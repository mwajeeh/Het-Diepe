 te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen"}},{"id":"EP-0041","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-06"],"question":"Een kandidaat voor Zwemdiploma C gaat in proef C1 Survival te water met een sprong naar keuze en zwemt enkele slagen. Wat volgt aansluitend?","options":["1 meter voor een verticaal hangend zeil onder water gaan en door het gat zwemmen","Naar de oppervlakte zwemmen en bovenkomen in een soort wak","1 keer onder een drijvend voorwerp door zwemmen"],"answer":0,"explanation":"In C1 gaat de kandidaat na de sprong naar keuze en enkele slagen 1 meter voor een verticaal hangend zeil onder water en zwemt door het gat. Bovenkomen in een soort wak is het slot van proef C2. Onder een drijvend voorwerp door zwemmen zit in de 100 meter van C1. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 1 meter voor het zeil onder water gaan en door het gat zwemmen","source":{"page":11,"quote":"1 meter voor een verticaal in het water hangend zeil onder water gaan en door het gat in het zeil zwemmen"}},{"id":"EP-0042","category":"examenprogrammas","subtopic":"diploma_c","type":"onjuist","objectives":["EP-DIPC-01","EP-DIPC-02","EP-DIPC-03"],"question":"Welke bewering over het eerste deel van proef C1 Survival van Zwemdiploma C is NIET juist?","options":["Na het watertrappen volgt 20 seconden drijven met een drijvend voorwerp.","De kandidaat gaat te water met een rol voorover, aansluitend 15 seconden watertrappen.","Na het verticaal drijven volgt 5 meter voortbewegen op de rug met armen."],"answer":0,"explanation":"In C1 volgt na het watertrappen 30 seconden verticaal blijven drijven met een drijvend voorwerp; 20 seconden hoort bij B5. De rol voorover met aansluitend 15 seconden watertrappen en daarna 5 meter voortbewegen op de rug met armen kloppen wel. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: rol voorover, 15 s watertrappen, 30 s verticaal drijven, 5 m op de rug","source":{"page":11,"quote":"Te water gaan met een rol voorover, aansluitend 15 seconden watertrappen, gevolgd door 30 seconden verticaal blijven drijven"}},{"id":"EP-0043","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-07","EP-VERG-03"],"question":"Waarmee wordt proef C2 Onder water oriëntatie van Zwemdiploma C afgerond?","options":["Naar de oppervlakte zwemmen en bovenkomen in een soort wak","Zelfstandig uit het water op de kant klimmen","1 keer hoofdwaarts richting de bodem gaan"],"answer":0,"explanation":"C2 wordt na het zwemmen door het zeil afgerond met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak. Zelfstandig uit het water klimmen hoort bij proef C1 Survival. Hoofdwaarts richting de bodem gaan hoort bij proef C3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C2: afronden met bovenkomen in een soort wak","source":{"page":11,"quote":"proef afronden met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak"}},{"id":"EP-0044","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-03","EP-DIPC-07","EP-DIPB-03"],"question":"Wat is een verschil tussen proef B2 en proef C2 Onder water oriëntatie?","options":["Alleen bij C2 volgt na het zeil bovenkomen in een soort wak.","Bij C2 hangt het zeil op 6 meter, bij B2 op 3 meter.","Bij C2 mag de kandidaat springen, bij B2 moet hij duiken."],"answer":0,"explanation":"Bij B2 en C2 duikt de kandidaat van de kant en hangt het zeil op 6 meter van de startkant; alleen C2 eindigt met bovenkomen in een soort wak. Het zeil op 3 meter hoort bij A2, en springen (duiken heeft de voorkeur) mag alleen bij A2. §1.1.2–1.1.3, p. 9 en 11","ref":"§1.1.2–1.1.3, p. 9 en 11","tests":"B2 vs C2: soort wak alleen bij C","source":{"page":11,"quote":"meter van de startkant bevindt, proef afronden met naar de oppervlakte zwemmen"}},{"id":"EP-0045","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-08","EP-VERG-06"],"question":"Hoe is proef C3 Conditiezwemmen van Zwemdiploma C opgebouwd?","options":["75 meter schoolslag, gevolgd door 75 meter enkelvoudige rugslag","Zes keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","75 meter enkelvoudige rugslag, gevolgd door 75 meter schoolslag"],"answer":0,"explanation":"C3 bestaat uit 75 meter schoolslag (met 1 keer hoofdwaarts richting bodem gaan), gevolgd door 75 meter enkelvoudige rugslag. Zes keer 25 meter afwisselend is B3. De omgekeerde volgorde, eerst rugslag, staat niet in het examenprogramma. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C3: 75 meter schoolslag, daarna 75 meter enkelvoudige rugslag","source":{"page":11,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan, gevolgd door 75 meter enkelvoudige rugslag"}},{"id":"EP-0046","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-08","EP-VERG-10"],"question":"Een kandidaat voor Zwemdiploma C zwemt proef C3 Conditiezwemmen. Welke onderbreking hoort bij de 75 meter schoolslag?","options":["1 keer hoofdwaarts richting bodem gaan","1 keer voetwaarts richting de bodem zakken","2 keer een halve draai om de lengteas"],"answer":0,"explanation":"De 75 meter schoolslag van C3 wordt onderbroken door 1 keer hoofdwaarts richting bodem te gaan. Voetwaarts richting de bodem zakken is de onderbreking in A3. De 2 halve draaien om de lengteas horen bij B3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C3: hoofdwaarts richting bodem in de 75 meter schoolslag","source":{"page":11,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan"}},{"id":"EP-0047","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-11","EP-VERG-09"],"question":"Een kandidaat voor Zwemdiploma C heeft in proef C5 30 seconden watertrappend verplaatst en daarna 15 seconden op de rug gedreven. Waarmee wordt de proef afgerond?","options":["30 seconden watertrappen met de benen","1 keer voetwaarts richting de bodem zakken","60 seconden watertrappen met armen en benen"],"answer":0,"explanation":"C5 wordt afgerond met 30 seconden watertrappen met de benen. Afronden met voetwaarts richting de bodem zakken is het slot van B6. 60 seconden watertrappen met armen en benen hoort bij A6 en B6. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C5: afronden met 30 seconden watertrappen met de benen","source":{"page":12,"quote":"15 seconden drijven op de rug, proef afronden met 30 seconden watertrappen met de benen"}},{"id":"EP-0048","category":"examenprogrammas","subtopic":"diploma_c","type":"onjuist","objectives":["EP-DIPC-11","EP-DIPC-10"],"question":"Welke bewering over proef C5 Oriënteren boven water en verplaatsen van Zwemdiploma C is NIET juist?","options":["Tussen de twee keer watertrappen drijft de kandidaat 10 seconden op de rug.","De kandidaat gaat van de kant te water met een sprong naar keuze.","Het watertrappen met verplaatsen in meerdere richtingen duurt 30 seconden."],"answer":0,"explanation":"In C5 drijft de kandidaat 15 seconden op de rug; 10 seconden is de duur bij A5. C5 begint wel met van de kant te water gaan met een sprong naar keuze, en het watertrappen met verplaatsen duurt 30 seconden. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C5: 15 seconden drijven op de rug","source":{"page":12,"quote":"richtingen, gevolgd door 15 seconden drijven op de rug"}},{"id":"EP-0049","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-01","EP-DIPA-01","EP-DIPB-01"],"question":"Hoe verschilt het te water gaan aan het begin van de proef Survival tussen Zwemdiploma A, B en C?","options":["A voetsprong voorwaarts, B achterwaarts, C rol voorover","A achterwaarts, B voetsprong voorwaarts, C rol voorover","A voetsprong voorwaarts, B rol voorover, C achterwaarts"],"answer":0,"explanation":"De proef Survival begint bij A met een voetsprong voorwaarts vanaf enige hoogte, bij B met achterwaarts te water gaan en bij C met een rol voorover. De andere twee opties verwisselen de manieren van te water gaan tussen de diploma's. Bijlage 3","ref":"Bijlage 3","tests":"te water gaan bij de proef Survival A/B/C","source":{"page":"Bijlage 3","quote":"A.1 voetsprong voorwaarts, gekleed B.1 achterwaarts te water gaan, gekleed C.1 met een rol voorover"}},{"id":"EP-0050","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["EP-VERG-01","EP-DIPC-01"],"question":"Welke bewering over het te water gaan in de proef Survival is NIET juist?","options":["Bij Zwemdiploma B gaat de kandidaat te water met een rol voorover.","Bij Zwemdiploma A gaat de kandidaat vanaf enige hoogte te water met een voetsprong voorwaarts.","Bij Zwemdiploma C gaat de kandidaat ook te water met een sprong waarbij het hoofd boven water blijft."],"answer":0,"explanation":"Bij B begint de proef Survival met achterwaarts te water gaan; de rol voorover hoort bij C. De voetsprong voorwaarts vanaf enige hoogte bij A klopt, en in C1 gaat de kandidaat later ook te water met een sprong waarbij het hoofd boven water blijft. §1.1, p. 7, 9 en 11","ref":"§1.1, p. 7, 9 en 11","tests":"te water gaan bij de proef Survival A/B/C","source":{"page":9,"quote":"B1 proef Survival Achterwaarts te water gaan"}},{"id":"EP-0051","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-02"],"question":"Hoe gaat de kandidaat te water bij de proef Onder water oriëntatie van Zwemdiploma A, B en C?","options":["Bij A met een sprong (duiken heeft de voorkeur), bij B en C van de kant duiken","Bij A en B met een sprong naar keuze, bij C van de kant duiken","Bij A van de kant duiken, bij B en C met een sprong (duiken heeft de voorkeur)"],"answer":0,"explanation":"Bij A2 mag de kandidaat te water gaan met een sprong, al heeft duiken de voorkeur; bij B2 en C2 is het van de kant duiken. Een sprong naar keuze bij A en B klopt dus niet, en de derde optie draait de regel om. §1.1, p. 7, 9 en 11","ref":"§1.1, p. 7, 9 en 11","tests":"te water gaan Onder water oriëntatie: A sprong, B en C duiken","source":{"page":9,"quote":"B2 proef Onder water oriëntatie Van de kant duiken"}},{"id":"EP-0052","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-04"],"question":"Welke afstand gekleed zwemmen hoort bij Zwemdiploma A, B en C?","options":["A 12,5 meter, B 50 meter, C 100 meter","A 25 meter, B 50 meter, C 100 meter","A 12,5 meter, B 50 meter, C 150 meter"],"answer":0,"explanation":"Gekleed zwemmen is 12,5 meter bij A (A.17), 50 meter bij B (B.18) en 100 meter bij C (C.20). 25 meter is geen afstand gekleed zwemmen, en 150 meter is de afstand conditiezwemmen bij B en C. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"afstand gekleed zwemmen A/B/C","source":{"page":63,"quote":"A.17 12,5 meter gekleed zwemmen B.18 50 meter gekleed zwemmen C.20 100 meter gekleed zwemmen"}},{"id":"EP-0053","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-VERG-04","EP-DIPB-02"],"question":"Een Licentiehouder laat kandidaten voor Zwemdiploma B in de proef Survival 100 meter zwemmen, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen. Klopt de afstand met het standaard examenprogramma?","options":["Nee, bij Zwemdiploma B is dit 50 meter.","Ja, 100 meter is de afstand voor Zwemdiploma B.","Nee, bij Zwemdiploma B is dit 12,5 meter."],"answer":0,"explanation":"In proef B1 zwemt de kandidaat 50 meter, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen. 100 meter is de afstand in proef C1 en 12,5 meter die in proef A1. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B1: 50 meter zwemmen in de proef Survival","source":{"page":9,"quote":"15 seconden watertrappen, gevolgd door 50 meter zwemmen"}},{"id":"EP-0054","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-05"],"question":"Hoeveel meter conditiezwemmen bevatten de examenprogramma's van Zwemdiploma A, B en C?","options":["A 100 meter, B 150 meter, C 150 meter","A 100 meter, B 100 meter, C 150 meter","A 75 meter, B 150 meter, C 150 meter"],"answer":0,"explanation":"Conditiezwemmen is 100 meter bij A (A.16) en 150 meter bij zowel B (B.17) als C (C.19). B zwemt dus niet 100 meter. 75 meter is geen totale afstand, maar het deel dat bij C in één slag wordt gezwommen. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A 100 m, B en C 150 m","source":{"page":62,"quote":"A.16 100 meter conditiezwemmen B.17 150 meter conditiezwemmen C.19 150 meter conditiezwemmen"}},{"id":"EP-0055","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["EP-VERG-05","EP-VERG-06"],"question":"Welke bewering over het conditiezwemmen in de standaard examenprogramma's is NIET juist?","options":["Bij Zwemdiploma C is de afstand conditiezwemmen groter dan bij B.","Bij Zwemdiploma A en B worden de twee slagen iedere 25 meter afgewisseld.","Bij Zwemdiploma C wordt 75 meter in één slag gezwommen en daarna gewisseld."],"answer":0,"explanation":"B en C hebben allebei 150 meter conditiezwemmen; C zwemt dus niet meer. Dat bij A en B enkelvoudige rugslag en schoolslag iedere 25 meter worden afgewisseld en dat bij C 75 meter in één slag wordt gezwommen, klopt wel. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A 100 m, B en C 150 m","source":{"page":62,"quote":"B.17 150 meter conditiezwemmen C.19 150 meter conditiezwemmen"}},{"id":"EP-0056","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-06"],"question":"Wat is in het standaard examenprogramma het verschil tussen B en C in de afwisseling van zwemslagen bij het conditiezwemmen?","options":["Bij B wordt iedere 25 meter gewisseld, bij C na 75 meter.","Bij B wordt na 75 meter gewisseld, bij C iedere 25 meter.","Bij B wordt iedere 25 meter gewisseld, bij C na 50 meter."],"answer":0,"explanation":"Bij A en B worden enkelvoudige rugslag en schoolslag iedere 25 meter afgewisseld. Bij C is er geen afwisseling meer: er wordt 75 meter in één slag gezwommen en daarna gewisseld. De andere opties draaien dit om of noemen 50 meter. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"afwisseling slagen conditiezwemmen: A en B per 25 m, C na 75 m","source":{"page":62,"quote":"er wordt 75 meter in één slag gezwommen en daarna gewisseld"}},{"id":"EP-0057","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-07","EP-DIPA-06","EP-DIPB-06"],"question":"Welke opbouw in afstand per zwemslag kent de proef Borst- en rugcrawl in de examenprogramma's van Zwemdiploma A, B en C?","options":["A 5 meter, B 10 meter, C 15 meter","A 10 meter, B 10 meter, C 15 meter","A 5 meter, B 10 meter, C 10 meter"],"answer":0,"explanation":"Bij borst- en rugcrawl is er een opbouw in afstand: 5 meter bij A, 10 meter bij B en 15 meter bij C, telkens zowel borstcrawl als rugcrawl. In de andere opties is A of C gelijk aan B, en dat klopt niet. §4.2.6, p. 60","ref":"§4.2.6, p. 60","tests":"borst- en rugcrawl opbouw 5/10/15 meter","source":{"page":60,"quote":"A.14, B.15 en C.17 5, 10, 15 meter rugcrawl"}},{"id":"EP-0058","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-09","EP-VERG-07"],"question":"Een kandidaat voor Zwemdiploma C zwemt bij proef C4 Borst- en rugcrawl 10 meter borstcrawl en 10 meter rugcrawl, met een goede uitvoering. Voldoet dit aan het standaard examenprogramma?","options":["Nee, voor Zwemdiploma C is dit 15 meter per zwemslag.","Ja, 10 meter per zwemslag is de afstand voor Zwemdiploma C.","Nee, voor Zwemdiploma C is dit 25 meter per zwemslag."],"answer":0,"explanation":"Proef C4 bestaat uit 15 meter borstcrawl en 15 meter rugcrawl. 10 meter per zwemslag is de afstand van B4. 25 meter is de afstand van de techniekonderdelen schoolslag en enkelvoudige rugslag, niet van de crawl. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C4: 15 meter borstcrawl en 15 meter rugcrawl","source":{"page":12,"quote":"C4 proef Borst- en rugcrawl 15 meter borstcrawl 15 meter rugcrawl"}},{"id":"EP-0059","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-08"],"question":"Wat is het verschil tussen Zwemdiploma A en Zwemdiploma B in de duur van het drijven op de rug?","options":["Bij A 10 seconden, bij B 15 seconden","Bij A 15 seconden, bij B 10 seconden","Bij A 10 seconden, bij B 20 seconden"],"answer":0,"explanation":"Drijven op de rug duurt 10 seconden bij A (A.7) en 15 seconden bij B en C (B.7, C.9). De tweede optie draait dit om. 20 seconden is de duur van het drijven met een drijvend voorwerp bij B. §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"drijven op de rug: A 10 s, B en C 15 s","source":{"page":54,"quote":"A.7, B.7, C.9 10, 15, 15 seconden drijven op de rug"}},{"id":"EP-0060","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["EP-VERG-08"],"question":"Welke bewering over de onderdelen van het basiselement Drijven is NIET juist?","options":["5 seconden drijven op de buik komt bij Zwemdiploma A en B voor.","Bij Zwemdiploma B en C duurt het drijven op de rug 15 seconden.","Bij Zwemdiploma A duurt het drijven op de rug 10 seconden."],"answer":0,"explanation":"5 seconden drijven op de buik (A.6) komt alleen bij Zwemdiploma A voor, niet bij B. Dat drijven op de rug bij A 10 seconden en bij B en C 15 seconden duurt, klopt wel. §4.2.3, p. 53","ref":"§4.2.3, p. 53","tests":"drijven op de buik alleen bij A","source":{"page":53,"quote":"Onderdelen Drijven A.6 5 seconden drijven op de buik A.7 10 seconden drijven op de rug B.7 15 seconden drijven op de rug"}},{"id":"EP-0061","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-09","EP-DIPB-10","EP-DIPC-10"],"question":"Wat is een verschil tussen het watertrappen met verplaatsen in meerdere richtingen in proef B6 en in proef C5?","options":["Bij B duurt het 60 seconden, bij C 30 seconden.","Bij B duurt het 30 seconden, bij C 60 seconden.","Bij B en C duurt het allebei 60 seconden."],"answer":0,"explanation":"Watertrappen met armen en benen en verplaatsen in meerdere richtingen duurt bij B 60 seconden en bij C 30 seconden. Bij C volgt daarna nog 15 seconden drijven op de rug en 30 seconden watertrappen met de benen. De andere opties draaien de duur om of maken die gelijk. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"watertrappen met verplaatsen: B 60 s vs C 30 s","source":{"page":57,"quote":"B.12, C.13 60 en 30 seconden watertrappen met armen en benen, verplaatsen in meerdere richtingen"}},{"id":"EP-0062","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["EP-VERG-09","EP-DIPA-10"],"question":"Welke bewering over het watertrappen in de proef Oriënteren boven water en verplaatsen is NIET juist?","options":["Alleen bij Zwemdiploma C maakt de kandidaat al watertrappend 2 keer een hele draai.","Alleen bij Zwemdiploma C wordt watergetrapt met alleen de benen.","Bij Zwemdiploma A duurt het watertrappen met armen en benen 60 seconden."],"answer":0,"explanation":"De 2 hele draaien om de lengteas tijdens het watertrappen horen bij A (A.11), niet bij C. Watertrappen met alleen de benen (C.14) komt wel alleen bij C voor, en bij A duurt het watertrappen met armen en benen 60 seconden. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"hele draai tijdens watertrappen alleen bij A","source":{"page":57,"quote":"A.11 twee keer, al watertrappend, een hele draai om de lengteas maken"}},{"id":"EP-0063","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["EP-VERG-10"],"question":"Welke bewering over richting de bodem gaan in de standaard examenprogramma's is NIET juist?","options":["Bij Zwemdiploma B gaat de kandidaat hoofdwaarts richting de bodem.","Bij Zwemdiploma A zakt de kandidaat voetwaarts richting de bodem.","Bij Zwemdiploma C gaat de kandidaat hoofdwaarts richting de bodem."],"answer":0,"explanation":"Bij B is het voetwaarts richting de bodem zakken (B.6), net als bij A (A.5). Alleen bij C is het hoofdwaarts richting de bodem gaan (C.8). De beweringen over A en C kloppen dus. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"voetwaarts zakken A en B vs hoofdwaarts C","source":{"page":52,"quote":"A.5, B.6 voetwaarts richting de bodem zakken C.8 hoofdwaarts richting de bodem gaan"}},{"id":"EP-0064","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-10","EP-DIPB-11","EP-DIPA-05"],"question":"In welke proef zakt een kandidaat voor Zwemdiploma A voetwaarts richting de bodem, en in welke proef doet een kandidaat voor Zwemdiploma B dat?","options":["A in Conditiezwemmen, B in Oriënteren boven water en verplaatsen","A in Oriënteren boven water en verplaatsen, B in Conditiezwemmen","A in Conditiezwemmen, B in Survival"],"answer":0,"explanation":"Bij A zit het voetwaarts zakken in proef A3 Conditiezwemmen (in de tweede 25 meter schoolslag). Bij B wordt proef B6 Oriënteren boven water en verplaatsen ermee afgerond. In B3 en B1 komt voetwaarts zakken niet voor. §1.1.1–1.1.2, p. 7 en 10","ref":"§1.1.1–1.1.2, p. 7 en 10","tests":"plaats voetwaarts zakken: A3 vs B6","source":{"page":10,"quote":"proef afronden met 1 keer voetwaarts richting de bodem zakken"}},{"id":"EP-0065","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-11","EP-BASE-03"],"question":"Wat is het verschil tussen de draai-onderdelen A.8 en B.10?","options":["A: één halve draai om de lengteas; B: van buik naar rug én van rug naar buik","A: van buik naar rug én van rug naar buik; B: één halve draai om de lengteas","A: één halve draai om de breedteas; B: één halve draai om de lengteas"],"answer":0,"explanation":"A.8 is een halve draai om de lengteas; B.10 is een halve draai om de lengteas van buik naar rug en van rug naar buik. De tweede optie draait dit om. Een draai om de breedteas hoort bij de rol voorover (C.1), niet bij A.8. Bijlage 2","ref":"Bijlage 2","tests":"halve draai: A één keer vs B van buik naar rug en terug","source":{"page":"Bijlage 2","quote":"B.10 een halve draai om de lengteas van buik naar rug en van rug naar buik"}},{"id":"EP-0066","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-01"],"question":"In hoeveel basiselementen zijn de onderdelen van de standaard examenprogramma's geordend?","options":["Zeven","Zes","Vijf"],"answer":0,"explanation":"De onderdelen zijn geordend in zeven basiselementen: te water gaan, onder water, drijven, draaien, watertrappen, voortbewegen en survival. Zes en vijf zijn de aantallen proeven in het standaard examenprogramma (zes bij A en B, vijf bij C), niet het aantal basiselementen. §4.2, p. 46","ref":"§4.2, p. 46","tests":"zeven basiselementen","source":{"page":46,"quote":"te water gaan; onder water; drijven; draaien; watertrappen; voortbewegen; survival."}},{"id":"EP-0067","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-01"],"question":"Welke van de volgende categorieën is NIET een van de basiselementen waarin de onderdelen zijn geordend?","options":["Conditiezwemmen","Watertrappen","Voortbewegen"],"answer":0,"explanation":"Watertrappen en voortbewegen zijn twee van de zeven basiselementen. Conditiezwemmen is geen basiselement maar een onderdeel dat valt onder het basiselement Voortbewegen. §4.2, p. 46","ref":"§4.2, p. 46","tests":"conditiezwemmen is geen basiselement","source":{"page":46,"quote":"te water gaan; onder water; drijven; draaien; watertrappen; voortbewegen; survival."}},{"id":"EP-0068","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-02"],"question":"Hoeveel onderdelen tellen de standaard examenprogramma's van Zwemdiploma A, B en C volgens Bijlage 2?","options":["A 18, B 19, C 22","A 18, B 18, C 22","A 19, B 19, C 22"],"answer":0,"explanation":"Bijlage 2 nummert de onderdelen van A.1 tot en met A.18, van B.1 tot en met B.19 en van C.1 tot en met C.22. A en B hebben dus niet hetzelfde aantal onderdelen. Bijlage 2","ref":"Bijlage 2","tests":"aantal onderdelen A 18, B 19, C 22","source":{"page":"Bijlage 2","quote":"A.18 zelfstandig uit het water op de kant klimmen, gekleed Onderdelen Zwemdiploma B"}},{"id":"EP-0069","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-03"],"question":"Bij welke zwemdiploma's heeft het basiselement Draaien volgens Bijlage 3 een onderdeel?","options":["Alleen bij Zwemdiploma A en B","Bij Zwemdiploma A, B en C","Alleen bij Zwemdiploma B en C"],"answer":0,"explanation":"In Bijlage 3 heeft het basiselement Draaien alleen onderdelen bij A (A.8) en B (B.10). Bij Zwemdiploma C staat onder Draaien geen onderdeel. §4.2.4 noemt eveneens alleen A.8 en B.10. Bijlage 3","ref":"Bijlage 3","tests":"Draaien: alleen onderdelen bij A en B","source":{"page":"Bijlage 3","quote":"Draaien A.8 een halve draai om de lengteas B.10 een halve draai om de lengteas van"}},{"id":"EP-0070","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-03","EP-VERG-11"],"question":"Welke bewering over het basiselement Draaien in Bijlage 3 is NIET juist?","options":["Bij Zwemdiploma C valt een halve draai om de lengteas onder Draaien.","Bij Zwemdiploma A valt A.8, een halve draai om de lengteas, onder Draaien.","Bij Zwemdiploma B valt B.10 onder Draaien: van buik naar rug en van rug naar buik."],"answer":0,"explanation":"Zwemdiploma C heeft geen onderdeel bij het basiselement Draaien. Bij A valt A.8 (een halve draai om de lengteas) eronder en bij B valt B.10 (een halve draai van buik naar rug en van rug naar buik) eronder. Bijlage 3","ref":"Bijlage 3","tests":"Draaien: alleen onderdelen bij A en B","source":{"page":"Bijlage 3","quote":"Draaien A.8 een halve draai om de lengteas B.10 een halve draai om de lengteas van"}},{"id":"EP-0071","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-04"],"question":"Welk onderdeel hoort volgens Bijlage 3 NIET bij het basiselement Te water gaan van Zwemdiploma C?","options":["Achterwaarts te water gaan, gekleed","Van de kant in het water duiken","Gekleed te water gaan met een sprong waarbij het hoofd boven water blijft"],"answer":0,"explanation":"Bij C vallen onder Te water gaan: met een rol voorover te water gaan (gekleed), van de kant in het water duiken en gekleed te water gaan met een sprong waarbij het hoofd boven water blijft. Achterwaarts te water gaan is onderdeel B.1 van Zwemdiploma B. Bijlage 3","ref":"Bijlage 3","tests":"Te water gaan bij C: rol voorover, duiken, sprong met hoofd boven water","source":{"page":"Bijlage 3","quote":"B.1 achterwaarts te water gaan, gekleed C.1 met een rol voorover te water gaan,"}},{"id":"EP-0072","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-04","EP-VERG-02"],"question":"Welk onderdeel van het basiselement Te water gaan hebben Zwemdiploma B en Zwemdiploma C gemeen?","options":["Van de kant in het water duiken","Achterwaarts te water gaan, gekleed","Te water gaan met een sprong"],"answer":0,"explanation":"B.2 en C.2 zijn allebei 'van de kant in het water duiken'. Achterwaarts te water gaan (B.1) komt alleen bij B voor. Te water gaan met een sprong (A.2) hoort bij Zwemdiploma A. Bijlage 3","ref":"Bijlage 3","tests":"van de kant in het water duiken bij B en C (B.2, C.2)","source":{"page":"Bijlage 3","quote":"A.2 te water gaan met een sprong B.2 van de kant in het water duiken C.2 van de kant in het water duiken"}},{"id":"EP-0073","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-05"],"question":"Onder welk basiselement worden de onderdelen B.9 en C.11 (5 meter voortbewegen op de rug met gebruik van de armen) beschreven?","options":["Drijven","Voortbewegen","Draaien"],"answer":0,"explanation":"B.9 en C.11 worden beschreven bij het basiselement Drijven, onder 'Drijven en verplaatsen met gebruik van de armen'. Ze vallen niet onder Voortbewegen, waar de zwemslagen, het conditiezwemmen en het gekleed zwemmen staan, en ook niet onder Draaien. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.9 en C.11 vallen onder het basiselement Drijven","source":{"page":55,"quote":"Onderdelen Drijven en verplaatsen met gebruik van de armen B.9 5 meter hoofdwaarts"}},{"id":"EP-0074","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-06"],"question":"Onder welke noemer worden de onderdelen samengevat die gekleed worden uitgevoerd?","options":["Survival","Voortbewegen","Te water gaan"],"answer":0,"explanation":"Een (steeds groter) deel van de onderdelen wordt gekleed uitgevoerd; die worden samengevat onder de noemer 'survival'. Voortbewegen en Te water gaan zijn andere basiselementen, die maar een deel van de gekleed uitgevoerde onderdelen bevatten. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"gekleed uitgevoerde onderdelen heten survival","source":{"page":64,"quote":"Deze onderdelen worden hier samengevat onder de noemer ‘survival’."}},{"id":"EP-0075","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-07","EP-BASE-06"],"question":"Welk onderdeel van Zwemdiploma A hoort NIET bij de survival-onderdelen?","options":["A.6 5 seconden drijven op de buik","A.9 15 seconden gekleed watertrappen","A.17 12,5 meter gekleed zwemmen"],"answer":0,"explanation":"Survival-onderdelen bij A zijn de gekleed uitgevoerde onderdelen: A.1 voetsprong voorwaarts, A.9 15 seconden gekleed watertrappen, A.17 12,5 meter gekleed zwemmen en A.18 uit het water klimmen. A.6 drijven op de buik wordt niet gekleed uitgevoerd. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma A","source":{"page":64,"quote":"A.1 voetsprong voorwaarts, gekleed A.9 15 seconden gekleed watertrappen A.17 12,5 meter gekleed zwemmen"}},{"id":"EP-0076","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-06","EP-DIPB-02"],"question":"Welk onderdeel van Zwemdiploma B hoort NIET bij de survival-onderdelen?","options":["B.2 van de kant in het water duiken","B.5 gekleed onder een drijvend voorwerp door zwemmen","B.1 achterwaarts te water gaan, gekleed"],"answer":0,"explanation":"B.2 duiken wordt niet gekleed uitgevoerd en is dus geen survival-onderdeel. B.1 achterwaarts te water gaan en B.5 gekleed onder een drijvend voorwerp door zwemmen worden gekleed uitgevoerd en vallen onder survival. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma B","source":{"page":64,"quote":"B.1 achterwaarts te water gaan, gekleed B.5 gekleed onder een drijvend voorwerp door zwemmen"}},{"id":"EP-0077","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-06"],"question":"Welk onderdeel van Zwemdiploma C hoort NIET bij de survival-onderdelen?","options":["C.9 15 seconden drijven op de rug","C.10 30 seconden blijven drijven met gebruik van een hulpmiddel","C.6 gekleed onder een drijvend voorwerp door zwemmen"],"answer":0,"explanation":"C.9 drijven op de rug zit in proef C5 en wordt niet gekleed uitgevoerd. C.10 (30 seconden blijven drijven met een hulpmiddel) en C.6 (gekleed onder een drijvend voorwerp door zwemmen) staan wel in de lijst van survival-onderdelen van C. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma C","source":{"page":64,"quote":"C.10 30 seconden blijven drijven met gebruik van een hulpmiddel C.11 5 meter gekleed voortbewegen"}},{"id":"EP-0078","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-BASE-06","EP-DIPC-05"],"question":"Welk survival-onderdeel komt alleen in het examenprogramma van Zwemdiploma C voor?","options":["Gekleed over een drijvend voorwerp heen klimmen","Gekleed onder een drijvend voorwerp door zwemmen","Zelfstandig uit het water op de kant klimmen, gekleed"],"answer":0,"explanation":"Over een drijvend voorwerp heen klimmen (C.22) komt alleen bij C voor. Gekleed onder een drijvend voorwerp door zwemmen hoort bij B en C (B.5, C.6). Zelfstandig uit het water op de kant klimmen zit bij A, B en C (A.18, B.19, C.21). §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"over een drijvend voorwerp klimmen alleen bij C","source":{"page":65,"quote":"C.22 1 keer gekleed over een drijvend voorwerp heen klimmen"}},{"id":"EP-0079","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-MAAT-04","EP-DIPB-09","EP-DIPB-07"],"question":"Een Licentiehouder wil bij het diplomazwemmen voor Zwemdiploma B in het standaard examenprogramma proef B5 omdraaien: eerst 20 seconden drijven met een drijvend voorwerp, daarna in het water springen en 15 seconden op de rug drijven. Wat stelt de examinator vast?","options":["Dit mag niet; de onderdelen worden in de vastgestelde volgorde uitgevoerd.","Dit mag; de volgorde van de onderdelen binnen een proef is vrij.","Dit mag, zolang alle onderdelen van de proef worden getoond."],"answer":0,"explanation":"In het standaard examenprogramma moeten de onderdelen in de beschreven volgorde worden uitgevoerd; B5 begint met springen en 15 seconden drijven op de rug en eindigt met 20 seconden drijven met een drijvend voorwerp. Een vrije volgorde of alleen tonen van alle onderdelen is daarom niet genoeg. Bijlage 1","ref":"Bijlage 1","tests":"B5: volgorde onderdelen vastgelegd","source":{"page":"Bijlage 1","quote":"De onderdelen van de proeven dienen in de vastgestelde, in de Examenregeling Nationale Zwemdiploma’s beschreven, volgorde te worden uitgevoerd."}},{"id":"EP-0080","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"onjuist","objectives":["AB-DEF-11","EP-DIPA-01","EP-DIPC-01"],"question":"Welke bewering over de standaard examenprogramma's van Zwemdiploma A, B en C is NIET juist?","options":["De proef Je vertrouwd voelen in het water komt bij A, B en C voor.","Bij A, B en C volgt in de proef Survival na het te water gaan 15 seconden watertrappen.","De proef Borst- en rugcrawl komt bij A, B en C voor."],"answer":0,"explanation":"C heeft vijf proeven en geen proef Je vertrouwd voelen in het water; die komt alleen bij A (A5) en B (B5) voor. In de proef Survival volgt bij alle drie na het te water gaan 15 seconden watertrappen, en Borst- en rugcrawl is A4, B4 en C4. Bijlage 1","ref":"Bijlage 1","tests":"Zwemdiploma C heeft geen proef Je vertrouwd voelen in het water","source":{"page":"Bijlage 1","quote":"In het standaard examenprogramma zijn zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen."}},{"id":"EP-0081","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-DIPA-01","EP-DIPB-01","EP-DIPC-01"],"question":"Hoe lang duurt het gekleed watertrappen in de proef Survival bij Zwemdiploma A, B en C?","options":["Bij alle drie 15 seconden","A 15, B 15 en C 30 seconden","A 15, B 60 en C 30 seconden"],"answer":0,"explanation":"Het gekleed watertrappen duurt bij A, B en C 15 seconden (A.9, B.11, C.12). 30 seconden is bij C de duur van het verticaal drijven en van het watertrappen in C5; 60 seconden is het watertrappen in A6 en B6. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"gekleed watertrappen 15 seconden bij A, B en C","source":{"page":57,"quote":"A.9, B.11, C.12 15 seconden gekleed watertrappen"}},{"id":"EP-0082","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-02","EP-VERG-09"],"question":"Welk onderdeel staat NIET in de lijst Onderdelen Zwemdiploma B van Bijlage 2?","options":["30 seconden watertrappen met de benen","20 seconden drijven met gebruik van een hulpmiddel","6 meter onder water zwemmen"],"answer":0,"explanation":"Watertrappen met alleen de benen (30 seconden) is onderdeel C.14 en komt alleen bij C voor. 20 seconden drijven met gebruik van een hulpmiddel (B.8) en 6 meter onder water zwemmen (B.4) staan wel in de lijst van B. Bijlage 2","ref":"Bijlage 2","tests":"onderdelen B: geen watertrappen met alleen de benen","source":{"page":"Bijlage 2","quote":"C.14 30 seconden watertrappen met de benen"}},{"id":"EP-0083","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-02","EP-DIPA-02"],"question":"Welk onderdeel staat NIET in de lijst Onderdelen Zwemdiploma A van Bijlage 2?","options":["Gekleed onder een drijvend voorwerp door zwemmen","60 seconden watertrappen met armen en benen","Zelfstandig uit het water op de kant klimmen, gekleed"],"answer":0,"explanation":"Gekleed onder een drijvend voorwerp door zwemmen is B.5 en C.6; bij A komt het niet voor. 60 seconden watertrappen met armen en benen (A.10) en zelfstandig uit het water op de kant klimmen, gekleed (A.18) staan wel in de lijst van A. Bijlage 2","ref":"Bijlage 2","tests":"onderdelen A: geen drijvend voorwerp","source":{"page":"Bijlage 2","quote":"A.10 60 seconden watertrappen met armen en benen A.11 2 keer, al watertrappend"}},{"id":"EP-0200","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-01"],"question":"Voor welke kandidaten zijn de Zwemcertificaten A, B en C ontwikkeld?","options":["Kandidaten met beperkingen die het zwemdiploma niet of pas na een heel lange oefenperiode halen","Alle jonge kandidaten, als verplichte tussenstap op weg naar het Zwemdiploma A","Kandidaten die voor hun zwemdiploma een maatwerk examenprogramma willen afleggen"],"answer":0,"explanation":"De zwemcertificaten zijn bedoeld voor een relatief kleine groep kandidaten met tijdelijke of permanente beperkingen die Zwemdiploma A, B of C niet, of pas na een heel lange oefenperiode, kunnen halen. Ze zijn geen verplichte tussenstap voor alle kinderen: in principe worden alle kandidaten opgeleid voor de zwemdiploma's. Een maatwerk examenprogramma is iets anders dan een zwemcertificaat. §1.2, p. 13","ref":"§1.2, p. 13","tests":"doelgroep zwemcertificaten: kandidaten met beperking","source":{"page":13,"quote":"groep kandidaten met tijdelijke of permanente beperkingen niet, of slechts na een heel lange oefenperiode, in staat zijn om het Zwemdiploma A, B of C te halen"}},{"id":"EP-0201","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-04","EP-CERT-01"],"question":"Welke bewering over de plaats van de zwemcertificaten naast de zwemdiploma's is NIET juist?","options":["In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma's.","Een zwemcertificaat kan een tussenstap zijn naar een hoger zwemcertificaat of naar een zwemdiploma.","Kandidaten met een beperking worden in principe opgeleid voor een zwemcertificaat in plaats van een zwemdiploma."],"answer":2,"explanation":"Ook voor kandidaten met een beperking is het zwemdiploma het uitgangspunt: in principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma's. Het zwemcertificaat is er pas voor de groep die het diploma niet of slechts na een heel lange oefenperiode kan halen. De andere twee beweringen kloppen, ook de rol van het certificaat als tussenstap. §1.2, p. 13","ref":"§1.2, p. 13","tests":"uitgangspunt: alle kandidaten opgeleid voor zwemdiploma","source":{"page":13,"quote":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma’s."}},{"id":"EP-0202","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-02"],"question":"Waarvoor kan een zwemcertificaat volgens de examenregeling worden gebruikt?","options":["Alleen als tussenstap; daarna volgt altijd het examen voor het bijbehorende zwemdiploma","Als eindresultaat om trots op te zijn of als tussenstap naar een hoger certificaat of diploma","Als bewijs dat de kandidaat een maatwerk examenprogramma voldoende heeft uitgevoerd"],"answer":1,"explanation":"Voor kandidaten met een (tijdelijke) beperking kan het zwemcertificaat een behaald eindresultaat zijn om trots op te zijn, of een tussenstap naar een hoger zwemcertificaat of een zwemdiploma. Het is dus niet alleen een tussenstap met een verplicht vervolgexamen. Een maatwerk examenprogramma is iets anders dan een zwemcertificaat. §1.2, p. 13","ref":"§1.2, p. 13","tests":"functie zwemcertificaat: eindresultaat of tussenstap","source":{"page":13,"quote":"behaald eindresultaat om trots op te zijn of als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma"}},{"id":"EP-0203","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-02"],"question":"Een kandidaat met een permanente beperking heeft Zwemcertificaat B behaald. Na verder oefenen willen de ouders dat het kind meedoet aan het diplomazwemmen voor Zwemdiploma B. Wat geldt?","options":["Dat kan niet; na een certificaat volgt alleen nog een hoger zwemcertificaat.","Dat kan pas nadat het kind eerst Zwemdiploma A heeft behaald.","Dat kan; een zwemcertificaat kan een tussenstap zijn naar een zwemdiploma."],"answer":2,"explanation":"Het zwemcertificaat kan worden gebruikt als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma, dus de overstap naar Zwemdiploma B kan. Een lager diploma is daarvoor niet vereist: ook bij het overstappen van een behaald certificaat naar een diploma mag worden overgeslagen. §1.2, p. 13","ref":"§1.2, p. 13","tests":"functie zwemcertificaat: eindresultaat of tussenstap","source":{"page":13,"quote":"als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma"}},{"id":"EP-0204","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-03"],"question":"Uit welke twee delen bestaat elk zwemcertificaat?","options":["Een standaard deel met vaste proeven en een maatwerk deel met eigen proeven","Een verplicht deel met een zekere mate van zwemveiligheid en een open deel","Een gekleed deel dat verplicht is en een vrij deel in badkleding"],"answer":1,"explanation":"Bij elk zwemcertificaat is er een verplicht onderdeel dat een zekere mate van zwemveiligheid in zich heeft, en een open deel waar het kind al dan niet aan kan voldoen. Standaard en maatwerk zijn soorten examenprogramma's, geen delen van een certificaat. Het verplicht deel is ook niet alleen gekleed: het heeft ook een gedeelte in badkleding. §1.2, p. 13","ref":"§1.2, p. 13","tests":"zwemcertificaat: verplicht deel en open deel","source":{"page":13,"quote":"verplicht onderdeel, dat een zekere mate van zwemveiligheid in zich heeft, en een open deel waar het kind al dan niet aan kan voldoen"}},{"id":"EP-0205","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-03","EP-CERT-05","EP-CERT-06"],"question":"Wat is bij Zwemcertificaat A een verschil tussen het verplicht deel en het open deel wat de kleding betreft?","options":["Het verplicht deel is alleen gekleed, het open deel is alleen in badkleding.","Het verplicht deel is deels gekleed en deels in badkleding, het open deel alleen in badkleding.","Het verplicht deel is alleen in badkleding, het open deel is deels gekleed."],"answer":1,"explanation":"Het verplicht deel van Zwemcertificaat A heeft een gekleed gedeelte (onder water gaan en 12,5 meter verplaatsen) en een gedeelte in badkleding (5 seconden drijven, 50 meter en watertrappen). Het open deel wordt in badkleding uitgevoerd. 'Alleen gekleed' klopt dus niet voor het verplicht deel, en een gekleed open deel bestaat niet. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"kleding: verplicht deel gekleed en in badkleding, open deel in badkleding","source":{"page":13,"quote":"In badkleding: naar keuze te water gaan en 5 seconden drijven, gevolgd door 50 meter verplaatsen met een zwemslag naar keuze en 1 minuut watertrappen Open deel (in badkleding)"}},{"id":"EP-0206","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-05"],"question":"Een kandidaat voor Zwemcertificaat A gaat gekleed naar keuze te water, gaat geheel onder water en verplaatst zich daarna 12,5 meter met een zwemslag naar keuze. Is het gekleed gedeelte van het verplicht deel daarmee volledig?","options":["Nee, er hoort ook 15 seconden watertrappen bij, zoals bij Zwemdiploma A.","Nee, de kandidaat moet ook nog zelfstandig uit het water op de kant klimmen.","Ja, meer hoort niet bij het gekleed gedeelte van het verplicht deel van A."],"answer":2,"explanation":"Het gekleed gedeelte van het verplicht deel van Zwemcertificaat A bestaat uit naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met een zwemslag naar keuze. De 15 seconden watertrappen en het zelfstandig op de kant klimmen horen bij de proef Survival van Zwemdiploma A, niet bij het certificaat. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"Zwemcertificaat A gekleed: onder water gaan en 12,5 m","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met zwemslag naar keuze"}},{"id":"EP-0207","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-06","EP-CERT-11","EP-CERT-17"],"question":"Hoe lang drijft de kandidaat in het verplicht deel in badkleding bij respectievelijk Zwemcertificaat A, B en C?","options":["A 5, B 10 en C 15 seconden","A 5, B 7 en C 10 seconden","A 10, B 15 en C 20 seconden"],"answer":1,"explanation":"In badkleding drijft de kandidaat na het naar keuze te water gaan bij A 5 seconden, bij B 7 seconden en bij C 10 seconden. 10 seconden hoort dus bij C en niet bij B. Waarden als 15 en 20 seconden komen uit het open deel van B (15 seconden drijven op de rug, 20 seconden met een drijvend voorwerp). §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"drijven verplicht deel A/B/C: 5/7/10 s","source":{"page":14,"quote":"In badkleding: naar keuze te water gaan, 7 seconden drijven"}},{"id":"EP-0208","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-06","EP-CERT-11","EP-CERT-17"],"question":"Hoeveel meter verplaatst de kandidaat zich in badkleding in het verplicht deel van respectievelijk Zwemcertificaat A, B en C?","options":["12,5, 50 en 75 meter","25, 50 en 75 meter","50, 75 en 100 meter"],"answer":2,"explanation":"In badkleding verplaatst de kandidaat zich met een zwemslag naar keuze over 50 meter (A), 75 meter (B) en 100 meter (C). De reeks 12,5, 50 en 75 meter hoort bij het gekleed gedeelte van het verplicht deel. 25 meter is de afstand van de schoolslag en de enkelvoudige rugslag in het open deel. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"afstand badkleding verplicht deel A/B/C: 50/75/100 m","source":{"page":15,"quote":"10 seconden drijven, gevolgd door 100 meter te verplaatsen met een zwemslag naar keuze"}},{"id":"EP-0209","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-05","EP-CERT-10","EP-CERT-16"],"question":"Hoeveel meter verplaatst de kandidaat zich gekleed in het verplicht deel van respectievelijk Zwemcertificaat A, B en C?","options":["12,5, 50 en 75 meter","50, 75 en 100 meter","12,5, 25 en 50 meter"],"answer":0,"explanation":"Gekleed verplaatst de kandidaat zich 12,5 meter bij A, 50 meter bij B en 75 meter bij C; bij B en C onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen. 50, 75 en 100 meter zijn de afstanden in badkleding. Een gekleed gedeelte van 25 meter komt in het verplicht deel niet voor. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"afstand gekleed verplicht deel A/B/C: 12,5/50/75 m","source":{"page":15,"quote":"gevolgd door 75 meter te verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen"}},{"id":"EP-0210","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-10","EP-CERT-16"],"question":"Wat is het verschil in minimale overbruggingsafstand bij het gekleed onder een drijvend voorwerp door zwemmen tussen Zwemcertificaat B en C?","options":["Bij B minimaal 50 centimeter, bij C minimaal 30 centimeter","Bij B en C allebei minimaal 70 centimeter","Bij B minimaal 30 centimeter, bij C minimaal 50 centimeter"],"answer":2,"explanation":"Bij Zwemcertificaat B is de overbruggingsafstand minimaal 30 centimeter, bij Zwemcertificaat C minimaal 50 centimeter; de omgekeerde volgorde klopt dus niet. 70 centimeter is in de normering van de zwemdiploma's de minimale breedte van het drijvend voorwerp, niet de overbruggingsafstand bij de certificaten. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":15,"quote":"onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 50 centimeter)"}},{"id":"EP-0211","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-05","EP-CERT-06"],"question":"Welke bewering over het verplicht deel van Zwemcertificaat A is NIET juist?","options":["Gekleed gaat de kandidaat geheel onder water en verplaatst zich daarna 12,5 meter.","Gekleed zwemt de kandidaat 1 keer onder een drijvend voorwerp door.","In badkleding drijft de kandidaat 5 seconden, zwemt 50 meter en trapt 1 minuut water."],"answer":1,"explanation":"Onder een drijvend voorwerp door zwemmen komt alleen voor in het gekleed verplicht deel van Zwemcertificaat B en C, niet bij A. Bij A gaat de kandidaat gekleed geheel onder water en verplaatst zich 12,5 meter; in badkleding volgen 5 seconden drijven, 50 meter verplaatsen en 1 minuut watertrappen. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"Zwemcertificaat A gekleed: geen drijvend voorwerp","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met zwemslag naar keuze"}},{"id":"EP-0212","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-07","EP-CERT-19"],"question":"Wat is een verschil tussen het onder water zwemmen door een gat in een verticaal hangend zeil in het open deel van Zwemcertificaat A en dat van C?","options":["A: 3 meter onder water; C: 6 meter en bovenkomen in een soort wak","A: 6 meter onder water; C: 6 meter en bovenkomen in een soort wak","A: 3 meter en bovenkomen in een soort wak; C: 6 meter onder water"],"answer":0,"explanation":"In het open deel van A zwemt de kandidaat 3 meter onder water door het gat in het zeil; bij C is dat 6 meter, met bovenkomen in een soort wak. 6 meter is dus te veel voor A, en het bovenkomen in een soort wak hoort bij C, niet bij A. §1.2.1 en 1.2.3, p. 13 en 15","ref":"§1.2.1 en 1.2.3, p. 13 en 15","tests":"zeil open deel A 3 m vs C 6 m met wak","source":{"page":15,"quote":"6 meter onder water zwemmen door een gat in een verticaal hangend zeil, bovenkomen in een soort wak"}},{"id":"EP-0213","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-08"],"question":"Welke drijfonderdelen horen bij het open deel van Zwemcertificaat A?","options":["10 seconden drijven op de buik en 5 seconden drijven op de rug","5 seconden drijven op de buik en 10 seconden drijven op de rug","15 seconden drijven op de rug en 20 seconden met een drijvend voorwerp"],"answer":1,"explanation":"Het open deel van A bevat 5 seconden drijven op de buik en 10 seconden drijven op de rug, en daarnaast zwemmen met een halve draai om de lengteas. De omgedraaide tijden kloppen niet. 15 seconden op de rug en 20 seconden met een drijvend voorwerp horen bij het open deel van Zwemcertificaat B. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"open deel A: 5 s buik, 10 s rug","source":{"page":13,"quote":"5 seconden drijven op de buik 10 seconden drijven op de rug"}},{"id":"EP-0214","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-09","EP-CERT-15","EP-CERT-20"],"question":"Hoeveel meter borstcrawl en hoeveel meter rugcrawl horen bij het open deel van respectievelijk Zwemcertificaat A, B en C?","options":["Telkens 10 meter bij A, 15 meter bij B en 25 meter bij C","Bij A, B en C telkens 25 meter, net als de schoolslag","Telkens 5 meter bij A, 10 meter bij B en 15 meter bij C"],"answer":2,"explanation":"Het open deel bevat 5 meter borstcrawl en 5 meter rugcrawl bij A, 10 meter bij B en 15 meter bij C. 25 meter geldt in het open deel alleen voor de schoolslag en de enkelvoudige rugslag. De reeks 10, 15 en 25 meter komt bij de crawlslagen van de certificaten niet voor. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"crawl open deel A/B/C: 5/10/15 m","source":{"page":14,"quote":"10 meter borstcrawl 10 meter rugcrawl"}},{"id":"EP-0215","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-20","EP-CERT-09","EP-CERT-15"],"question":"Welke bewering over de schoolslag en enkelvoudige rugslag in het open deel van de zwemcertificaten is NIET juist?","options":["Bij Zwemcertificaat A zwemt de kandidaat 25 meter schoolslag.","Bij Zwemcertificaat C zwemt de kandidaat 75 meter schoolslag.","Bij Zwemcertificaat B zwemt de kandidaat 25 meter enkelvoudige rugslag."],"answer":1,"explanation":"In het open deel van alle drie de zwemcertificaten is het 25 meter schoolslag en 25 meter enkelvoudige rugslag, ook bij C. 75 meter schoolslag en 75 meter enkelvoudige rugslag horen bij de proef Conditiezwemmen van Zwemdiploma C. De beweringen over A en B kloppen. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"schoolslag en enkelvoudige rugslag open deel: steeds 25 m","source":{"page":15,"quote":"25 meter schoolslag 25 meter enkelvoudige rugslag 15 meter borstcrawl"}},{"id":"EP-0216","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-10"],"question":"Wat volgt in het gekleed verplicht deel van Zwemcertificaat B op het naar keuze te water gaan en geheel onder water gaan?","options":["15 seconden watertrappen en 50 meter verplaatsen, met 1 keer onder een drijvend voorwerp door","30 seconden drijven met een drijvend voorwerp en 75 meter verplaatsen, met 1 keer onder een drijvend voorwerp door","12,5 meter verplaatsen met een zwemslag naar keuze en daarna 1 minuut watertrappen"],"answer":0,"explanation":"Bij B volgen na het onder water gaan 15 seconden watertrappen en 50 meter verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen. 30 seconden drijven met een drijvend voorwerp en 75 meter horen bij C. 12,5 meter hoort bij het gekleed gedeelte van A, en 1 minuut watertrappen gebeurt in badkleding. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"Zwemcertificaat B gekleed: 15 s watertrappen en 50 m","source":{"page":14,"quote":"geheel onder water gaan, gevolgd door 15 seconden watertrappen, gevolgd door 50 meter verplaatsen"}},{"id":"EP-0217","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-10"],"question":"Bij het examen voor Zwemcertificaat B ligt het drijvend voorwerp voor het gekleed verplicht deel zo dat de overbruggingsafstand 40 centimeter is. Voldoet deze opstelling aan het examenprogramma?","options":["Nee, voor B is de overbruggingsafstand minimaal 50 centimeter.","Ja, voor B is de overbruggingsafstand minimaal 30 centimeter.","Nee, de overbruggingsafstand moet minimaal 70 centimeter zijn."],"answer":1,"explanation":"Voor Zwemcertificaat B geldt een overbruggingsafstand van minimaal 30 centimeter, dus 40 centimeter voldoet. Minimaal 50 centimeter is de eis bij Zwemcertificaat C. 70 centimeter is in de normering van de zwemdiploma's de minimale breedte van het drijvend voorwerp, niet de overbruggingsafstand bij het certificaat. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":14,"quote":"drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 30 centimeter)"}},{"id":"EP-0218","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-11","EP-CERT-17"],"question":"Wat is het verschil in de minuut watertrappen in het verplicht deel in badkleding tussen Zwemcertificaat B en C?","options":["B: 30 seconden verplaatsen in meerdere richtingen; C: 30 seconden met alleen armen of benen","B: 30 seconden met alleen armen of benen; C: 30 seconden verplaatsen in meerdere richtingen","B: 15 seconden met alleen de benen; C: 30 seconden met alleen de benen"],"answer":1,"explanation":"Bij B gebeurt 30 seconden van de minuut watertrappen met alleen de armen of benen; bij C wordt 30 seconden verplaatst in meerdere richtingen. De eerste optie draait dit om. De derde optie klopt niet: 15 seconden komt in deze minuut niet voor, en bij C gaat het om verplaatsen in meerdere richtingen, niet om watertrappen met alleen de benen. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"watertrappen badkleding B (alleen armen of benen) vs C (verplaatsen)","source":{"page":14,"quote":"1 minuut watertrappen (30 seconden met alleen de armen of benen)"}},{"id":"EP-0219","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-11","EP-CERT-10"],"question":"Welke bewering over het verplicht deel van Zwemcertificaat B is NIET juist?","options":["In badkleding drijft de kandidaat 7 seconden.","In badkleding verplaatst de kandidaat zich 100 meter.","Gekleed trapt de kandidaat 15 seconden water."],"answer":1,"explanation":"In badkleding verplaatst de kandidaat zich bij B 75 meter met een zwemslag naar keuze; 100 meter hoort bij Zwemcertificaat C. Het drijven van 7 seconden in badkleding en de 15 seconden watertrappen in het gekleed gedeelte kloppen wel. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"Zwemcertificaat B badkleding: 7 s drijven en 75 m","source":{"page":14,"quote":"In badkleding: naar keuze te water gaan, 7 seconden drijven, gevolgd door 75 meter"}},{"id":"EP-0220","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-12","EP-CERT-07"],"question":"Welke manier van te water gaan hoort bij het open deel van Zwemcertificaat B, maar niet bij dat van Zwemcertificaat A?","options":["Van de kant het water in duiken","Rol voorover","Achterwaarts te water gaan"],"answer":2,"explanation":"Het open deel van B kent achterwaarts te water gaan, duiken vanaf de kant en een voetsprong; bij A zijn dat de voetsprong en van de kant het water in duiken. Duiken komt dus bij beide voor. De rol voorover hoort bij het open deel van C, niet bij B. §1.2.1–1.2.2, p. 13–14","ref":"§1.2.1–1.2.2, p. 13–14","tests":"open deel B: achterwaarts te water gaan (niet bij A)","source":{"page":14,"quote":"Achterwaarts te water gaan • Vanaf de kant in het water duiken • Voetsprong"}},{"id":"EP-0221","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-13"],"question":"Welke bewering over het open deel van Zwemcertificaat B is NIET juist?","options":["De kandidaat zwemt 6 meter onder water door een gat in een verticaal hangend zeil.","De kandidaat komt na het zeil boven in een soort wak.","De kandidaat zakt voetwaarts richting de bodem."],"answer":1,"explanation":"Bovenkomen in een soort wak hoort bij het open deel van Zwemcertificaat C, niet bij B. In het open deel van B zwemt de kandidaat 6 meter onder water door een gat in een verticaal hangend zeil en zakt hij voetwaarts richting de bodem; beide beweringen kloppen dus. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"open deel B: 6 m zeil zonder wak, voetwaarts zakken","source":{"page":14,"quote":"6 meter onder water zwemmen door een gat in een verticaal hangend zeil Voetwaarts richting bodem zakken"}},{"id":"EP-0222","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-14"],"question":"Welk onderdeel hoort NIET bij het open deel van Zwemcertificaat B?","options":["15 seconden drijven op de rug","5 seconden drijven op de buik","5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen"],"answer":1,"explanation":"5 seconden drijven op de buik hoort bij het open deel van Zwemcertificaat A. Het open deel van B bevat onder meer 20 seconden met behulp van een drijvend voorwerp blijven drijven, 15 seconden drijven op de rug, 5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen en zwemmen met 2x een halve draai om de lengteas. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"open deel B: drijfonderdelen en hoofdwaarts voortbewegen","source":{"page":14,"quote":"20 seconden met behulp van een drijvend voorwerp blijven drijven 15 seconden drijven op de rug 5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen"}},{"id":"EP-0223","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-16"],"question":"Bij het examen voor Zwemcertificaat C ligt het drijvend voorwerp voor het gekleed verplicht deel zo dat de overbruggingsafstand 40 centimeter is. Voldoet deze opstelling aan het examenprogramma?","options":["Ja, voor C is de overbruggingsafstand minimaal 30 centimeter.","Nee, voor C is de overbruggingsafstand minimaal 50 centimeter.","Ja, bij zwemcertificaten is de overbruggingsafstand vrij."],"answer":1,"explanation":"Bij Zwemcertificaat C is de overbruggingsafstand minimaal 50 centimeter, dus 40 centimeter is te weinig. Minimaal 30 centimeter geldt bij Zwemcertificaat B. Bij de certificaten is onder meer de uitvoering van de zwemslag naar keuze vrij, maar de overbruggingsafstand ligt vast in het examenprogramma. §1.2.3, p. 15","ref":"§1.2.3, p. 15","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":15,"quote":"onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 50 centimeter)"}},{"id":"EP-0224","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-16","EP-CERT-17"],"question":"Welke bewering over het verplicht deel van Zwemcertificaat C is NIET juist?","options":["Gekleed klimt de kandidaat 1 keer over een drijvend voorwerp heen.","In badkleding drijft de kandidaat 10 seconden.","Gekleed blijft de kandidaat 30 seconden drijven met een drijvend voorwerp."],"answer":0,"explanation":"Over een drijvend voorwerp heen klimmen hoort bij de proef Survival van Zwemdiploma C, niet bij het zwemcertificaat. In het gekleed verplicht deel van Zwemcertificaat C blijft de kandidaat 30 seconden drijven met een drijvend voorwerp en zwemt hij 1 keer onder een drijvend voorwerp door; in badkleding drijft hij 10 seconden. §1.2.3, p. 15","ref":"§1.2.3, p. 15","tests":"Zwemcertificaat C gekleed: 30 s drijven met voorwerp, niet over voorwerp klimmen","source":{"page":15,"quote":"gevolgd door 30 seconden te blijven drijven met een drijvend voorwerp, gevolgd door 75 meter te verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen"}},{"id":"EP-0225","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-17"],"question":"Een kandidaat voor Zwemcertificaat C gaat in badkleding naar keuze te water, drijft 10 seconden, zwemt 75 meter met een zwemslag naar keuze en trapt daarna 1 minuut water. Wat stelt de examinator vast?","options":["Het gedeelte in badkleding is volledig: bij C hoort 75 meter.","Het gedeelte in badkleding is niet volledig: bij C hoort 15 seconden drijven.","Het gedeelte in badkleding is niet volledig: bij C hoort 100 meter."],"answer":2,"explanation":"Bij Zwemcertificaat C verplaatst de kandidaat zich in badkleding 100 meter met een zwemslag naar keuze, na 10 seconden drijven. 75 meter in badkleding hoort bij B; bij C is 75 meter de afstand in het gekleed gedeelte. Het drijven van 10 seconden was juist, dus daar ligt het probleem niet. §1.2.3, p. 15","ref":"§1.2.3, p. 15","tests":"afstand badkleding verplicht deel A/B/C: 50/75/100 m","source":{"page":15,"quote":"10 seconden drijven, gevolgd door 100 meter te verplaatsen met een zwemslag naar keuze"}},{"id":"EP-0226","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-18"],"question":"Welke manier van te water gaan hoort NIET bij het open deel van Zwemcertificaat C?","options":["Rol voorover","Achterwaarts te water gaan","Sprong waarbij het hoofd boven water blijft"],"answer":1,"explanation":"Achterwaarts te water gaan hoort bij het open deel van Zwemcertificaat B. Het open deel van C kent de voetsprong, duiken vanaf de kant, de rol voorover en de sprong waarbij het hoofd boven water blijft; die twee andere opties horen er dus wel bij. §1.2.3, p. 15","ref":"§1.2.3, p. 15","tests":"open deel C: manieren van te water gaan","source":{"page":15,"quote":"Te water gaan • Voetsprong • Duiken vanaf de kant • Rol voorover • Sprong waarbij het hoofd boven water blijft"}},{"id":"EP-0227","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-19"],"question":"Wat doet de kandidaat in het open deel van Zwemcertificaat C tijdens het zwemmen?","options":["1x hoofdwaarts richting bodem gaan","2x een halve draai om de lengteas maken","1x voetwaarts richting bodem zakken"],"answer":0,"explanation":"In het open deel van C staat 'zwemmen, 1x hoofdwaarts richting bodem gaan', naast onder meer 10 seconden drijven op de rug. Zwemmen met 2x een halve draai om de lengteas hoort bij het open deel van B, en voetwaarts richting bodem zakken eveneens. §1.2.3, p. 15","ref":"§1.2.3, p. 15","tests":"open deel C: zwemmen met 1x hoofdwaarts richting bodem","source":{"page":15,"quote":"zwemmen, 1x hoofdwaarts richting bodem gaan"}},{"id":"EP-0228","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-05","EP-CERT-10","EP-CERT-16"],"question":"Welke bewering over de verschillen tussen de verplichte delen van Zwemcertificaat A, B en C is NIET juist?","options":["Alleen bij B en C zwemt de kandidaat gekleed 1 keer onder een drijvend voorwerp door.","Alleen bij C bevat het verplicht deel ook een gedeelte dat gekleed wordt uitgevoerd.","Bij alle drie de certificaten trapt de kandidaat in badkleding 1 minuut water."],"answer":1,"explanation":"Het verplicht deel van alle drie de zwemcertificaten heeft een gekleed gedeelte; bij A is dat geheel onder water gaan en 12,5 meter verplaatsen. Onder een drijvend voorwerp door zwemmen komt inderdaad alleen bij B en C voor, en in badkleding is er bij A, B en C steeds 1 minuut watertrappen. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"gekleed gedeelte in verplicht deel van A, B en C","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter"}},{"id":"EP-0229","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-04","EP-CERT-01"],"question":"Een kandidaat van negen jaar zonder beperking heeft moeite met de borstcrawl. De lesgever wil hem daarom opgeven voor Zwemcertificaat A in plaats van Zwemdiploma A. Wat past bij de uitgangspunten van de examenregeling?","options":["Opleiden voor Zwemdiploma A; het certificaat is bedoeld voor kandidaten met een beperking.","Opgeven voor het certificaat; dat is bedoeld voor kandidaten die één onderdeel niet beheersen.","Opgeven voor het certificaat; dat is de gebruikelijke tussenstap op weg naar Zwemdiploma A."],"answer":0,"explanation":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma's. De zwemcertificaten zijn ontwikkeld voor een relatief kleine groep kandidaten met tijdelijke of permanente beperkingen die het diploma niet of slechts na een heel lange oefenperiode halen. Ze zijn niet bedoeld voor wie moeite heeft met één onderdeel, en ook geen gebruikelijke tussenstap voor iedereen. §1.2, p. 13","ref":"§1.2, p. 13","tests":"uitgangspunt: alle kandidaten opgeleid voor zwemdiploma","source":{"page":13,"quote":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma’s."}},{"id":"EP-0300","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-01"],"question":"Welke twee soorten examenprogramma's bestaan er volgens de Examenregeling Nationale Zwemdiploma's voor het Zwem-ABC?","options":["Standaard en maatwerk","Standaard en zwemcertificaat","Een verplicht deel en een open deel"],"answer":0,"explanation":"Voor het Zwem-ABC bestaan twee soorten examenprogramma's: standaard en maatwerk. De Zwemcertificaten A, B en C zijn geen tweede soort examenprogramma van het Zwem-ABC, maar aparte certificaten. Een verplicht onderdeel en een open deel horen bij de zwemcertificaten. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"twee soorten examenprogramma's Zwem-ABC: standaard en maatwerk","source":{"page":4,"quote":"twee soorten examenprogramma’s: standaard en maatwerk"}},{"id":"EP-0301","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-01"],"question":"Waarom kent de Examenregeling Nationale Zwemdiploma's naast het standaard examenprogramma ook een maatwerk examenprogramma?","options":["Het werkveld wilde naast de standaard examenprogramma's eigen examenprogramma's kunnen ontwikkelen.","Kinderen met een (tijdelijke) beperking moeten het Zwem-ABC op een aangepaste manier kunnen halen.","Voor niveau vier (open water met stroming/zee) was een apart examenprogramma nodig."],"answer":0,"explanation":"Het maatwerk examenprogramma komt voort uit een wens vanuit het werkveld om naast de standaard examenprogramma's eigen examenprogramma's te ontwikkelen. Voor kinderen met een (tijdelijke) beperking zijn er de Zwemcertificaten A, B en C. Niveau vier wordt juist niet uitgewerkt, omdat die omstandigheden nauwelijks in een zwembad te oefenen zijn. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"maatwerk: wens vanuit het werkveld","source":{"page":4,"quote":"Een wens vanuit het werkveld is om naast de standaard examenprogramma’s de mogelijkheid te hebben eigen examenprogramma’s te ontwikkelen."}},{"id":"EP-0302","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-34"],"question":"De Examenregeling Nationale Zwemdiploma's geldt voor standaard en maatwerk examenprogramma's. Voor welke diploma's of certificaten is het maatwerk examenprogramma beschreven?","options":["Voor de Zwemdiploma's A, B en C","Voor de Zwemdiploma's A, B en C en de Zwemcertificaten A, B en C","Alleen voor Zwemdiploma C, het niveau van de Nationale Norm Zwemveiligheid"],"answer":0,"explanation":"Volgens hoofdstuk 1 geldt de Examenregeling voor het standaard examenprogramma van de Zwemdiploma's en de Zwemcertificaten A, B en C, en voor het maatwerk examenprogramma van de Zwemdiploma's A, B en C. Voor de zwemcertificaten wordt dus alleen een standaard examenprogramma beschreven. Maatwerk is ook niet beperkt tot Zwemdiploma C. §1, p. 6","ref":"§1, p. 6","tests":"maatwerk beschreven voor Zwemdiploma's A, B en C","source":{"page":6,"quote":"Zwemcertificaten A, B en C en het maatwerk examenprogramma voor de Zwemdiploma’s A, B en C"}},{"id":"EP-0303","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-02"],"question":"Wat geldt voor de inhoud (de onderdelen) van een maatwerk examenprogramma?","options":["Die is gelijk aan de inhoud van het standaard examenprogramma.","Die is een keuze uit de onderdelen van het standaard examenprogramma.","Die bevat per proef ten minste één nieuw, zelf bedacht onderdeel."],"answer":0,"explanation":"De inhoud (onderdelen) van een maatwerk examenprogramma is gelijk aan die van het standaard examenprogramma; alleen de proeven waarin ze zitten mogen anders. Een keuze maken uit de onderdelen kan niet, want alle onderdelen moeten worden opgenomen. Nieuwe onderdelen zijn evenmin vereist: nieuw zijn de proeven, niet de onderdelen. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"inhoud maatwerk gelijk aan standaard","source":{"page":4,"quote":"is gelijk aan de inhoud van het standaard examenprogramma"}},{"id":"EP-0304","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-04","EP-MAAT-03"],"question":"Wat is een verschil tussen een standaard en een maatwerk examenprogramma?","options":["Bij standaard zijn de proeven uitgeschreven en hebben de onderdelen een vaste volgorde; bij maatwerk mogen proeven worden aangepast.","Bij standaard geldt de normering van de onderdelen; bij maatwerk stelt de Licentiehouder een eigen normering op.","Bij standaard zijn alle onderdelen verplicht; bij maatwerk mogen onderdelen vervallen als het niveau gelijkwaardig blijft."],"answer":0,"explanation":"In het standaard examenprogramma zijn de proeven uitgeschreven en worden de onderdelen van de proeven in de vastgestelde volgorde uitgevoerd; met maatwerk mogen proeven worden aangepast of nieuw bedacht. De normering van het standaard examenprogramma geldt, op het conditiezwemmen na, ook voor maatwerk (extra eisen toevoegen mag). Alle onderdelen moeten ook in een maatwerk examenprogramma worden opgenomen. §4, p. 44","ref":"§4, p. 44","tests":"standaard: vaste volgorde onderdelen; maatwerk: proeven aanpassen","source":{"page":44,"quote":"De onderdelen van de proeven dienen in de vastgestelde"}},{"id":"EP-0305","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-03"],"question":"Wat is het volgens de Examenregeling voor een Licentiehouder mogelijk met een maatwerk examenprogramma?","options":["Proeven aanpassen, nieuwe proeven bedenken en zo een heel nieuw examenprogramma samenstellen","Per kandidaat kiezen welke onderdelen van het standaard examenprogramma worden getoond","Het standaard examenprogramma afnemen met een eigen, aangepaste normering per onderdeel"],"answer":0,"explanation":"Met een maatwerk examenprogramma mag de Licentiehouder proeven aanpassen, nieuwe proeven bedenken en zo een heel nieuw examenprogramma samenstellen. Per kandidaat onderdelen kiezen kan niet, want alle onderdelen worden opgenomen. Een eigen normering mag ook niet: de normering van het standaard examenprogramma blijft gelden. Bijlage 1","ref":"Bijlage 1","tests":"maatwerk: proeven aanpassen en nieuwe proeven bedenken","source":{"page":"Bijlage 1","quote":"Met maatwerk examenprogramma’s is het voor Licentiehouders mogelijk om proeven aan te passen, nieuwe proeven te bedenken en zo een heel nieuw examenprogramma samen te stellen."}},{"id":"EP-0306","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-05"],"question":"Een Licentiehouder heeft zelf een maatwerk examenprogramma voor Zwemdiploma B ontwikkeld en wil het volgende week bij het diplomazwemmen gebruiken. Het programma is nog nergens ingediend. Wat geldt?","options":["Dat mag niet; het programma moet eerst ter goedkeuring worden voorgelegd aan de Nationale Raad Zwemveiligheid.","Dat mag, als de Examinator Nationale Zwemdiploma's het programma vooraf heeft beoordeeld.","Dat mag, mits alle onderdelen van het standaard examenprogramma in de proeven zijn opgenomen."],"answer":0,"explanation":"Een Licentiehouder mag een maatwerk examenprogramma pas toepassen als het vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid, waar de Toetsingscommissie het toetst. Beoordeling door de Examinator is daarvoor niet genoeg. Dat alle onderdelen zijn opgenomen is een voorwaarde voor goedkeuring, maar vervangt de goedkeuring niet. §4, p. 44","ref":"§4, p. 44","tests":"maatwerk vooraf ter goedkeuring voorleggen aan NRZ","source":{"page":44,"quote":"Een Licentiehouder kan een maatwerk examenprogramma toepassen als deze vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid."}},{"id":"EP-0307","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-06"],"question":"Welke instantie toetst of een ingediend maatwerk examenprogramma voldoet?","options":["De Toetsingscommissie Maatwerk Examenprogramma's","De Commissie van Beroep van de Nationale Raad Zwemveiligheid","Het bestuur van de Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"De Toetsingscommissie Maatwerk Examenprogramma's is een commissie van deskundigen die toetst of een ingediend maatwerk examenprogramma voldoet. De Commissie van Beroep komt pas in beeld als de Licentiehouder schriftelijk beroep indient tegen een weigering. Het bestuur van de Nationale Raad Zwemveiligheid heeft de Examenregeling vastgesteld, maar toetst geen maatwerk examenprogramma's. Bijlage 1","ref":"Bijlage 1","tests":"Toetsingscommissie toetst maatwerk examenprogramma","source":{"page":"Bijlage 1","quote":"De Toetsingscommissie Maatwerk Examenprogramma’s is een commissie van deskundigen die toetst of een ingediend maatwerk examenprogramma voldoet."}},{"id":"EP-0308","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-07"],"question":"Op basis waarvan toetst de Toetsingscommissie Maatwerk Examenprogramma's een ingediend maatwerk examenprogramma?","options":["Gelijkwaardigheid aan het niveau van de proeven/onderdelen van het standaard examenprogramma en aan de doelen van de niveaus van zwemveiligheid","De mate waarin het programma ruimte geeft voor innovatie en aansluit bij de eigen (bedrijfs)visie van de zwemlesaanbieder","Of de onderdelen in dezelfde volgorde worden uitgevoerd als in de proeven van het standaard examenprogramma"],"answer":0,"explanation":"De commissie toetst op gelijkwaardigheid aan het niveau van de proeven/onderdelen van het standaard examenprogramma en aan de doelen die horen bij de niveaus van zwemveiligheid. Innovatie en aansluiting bij de eigen visie zijn wat maatwerk mogelijk maakt, niet de toetsmaatstaf. De volgorde van onderdelen mag bij maatwerk juist anders zijn. §4, p. 44","ref":"§4, p. 44","tests":"toetsingscriterium: gelijkwaardigheid aan standaard en doelen zwemveiligheid","source":{"page":44,"quote":"examenprogramma’s toetst op basis van gelijkwaardigheid aan het niveau van de"}},{"id":"EP-0309","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-06","EP-MAAT-19"],"question":"Welke bewering over de Toetsingscommissie Maatwerk Examenprogramma's is NIET juist?","options":["Zij is een commissie van deskundigen.","Zij kijkt of een programma voldoet aan de gestelde voorwaarden.","Na haar goedkeuring moet de Commissie van Beroep het programma nog vaststellen."],"answer":2,"explanation":"Na goedkeuring kan de zwemlesaanbieder het maatwerk examenprogramma gebruiken voor het diplomazwemmen; de Commissie van Beroep speelt alleen een rol bij beroep tegen een weigering. Dat de Toetsingscommissie een commissie van deskundigen is en kijkt of het programma aan de gestelde voorwaarden voldoet, klopt wel. §4–4.1, p. 44–45","ref":"§4–4.1, p. 44–45","tests":"na goedkeuring maatwerk direct bruikbaar","source":{"page":44,"quote":"Na goedkeuring kan de zwemlesaanbieder het maatwerk examenprogramma gebruiken voor het diplomazwemmen"}},{"id":"EP-0310","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-08","EP-MAAT-35","EP-MAAT-13"],"question":"Welke bewering over het doel van maatwerk examenprogramma's is NIET juist?","options":["Maatwerk geeft meer ruimte voor innovatie van het zwemonderwijs en het diplomazwemmen.","Met maatwerk kan het diplomazwemmen aansluiten op de eigen visie en identiteit van de organisatie.","Maatwerk is bedoeld om kinderen met een (tijdelijke) beperking een lichter examen te bieden."],"answer":2,"explanation":"Voor kinderen met een (tijdelijke) beperking zijn de Zwemcertificaten A, B en C bedoeld; maatwerk heeft dezelfde onderdelen en, op het conditiezwemmen na, dezelfde normering als het standaard examenprogramma. Meer ruimte voor innovatie en aansluiten op de
