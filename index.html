"Bij B is rugligging ook toegestaan; bij C is een verticale houding vereist.","Bij B is de keuze voor het voorwerp vrij; bij C is een flexibeam verplicht.","Bij B mogen armen en benen stuwen; bij C moeten ze stil blijven."],"answer":0,"explanation":"Bij B.8 is de lichaamshouding bij voorkeur verticaal, maar rugligging is ook toegestaan; bij C.10 is verticaal blijven drijven de essentie, met de principes van de HELP-houding. De keuze voor het voorwerp is bij beide vrij, en ook bij B.8 worden armen en benen niet gebruikt om te stuwen. §4.2.3, p. 54 en 55","ref":"§4.2.3, p. 54 en 55","tests":"B.8 rugligging toegestaan vs C.10 verticaal","source":{"page":54,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."}},{"id":"EP-0436","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-25"],"question":"Een kandidaat voor Zwemdiploma C ligt bij 30 seconden gekleed verticaal blijven drijven met een drijvend voorwerp (C.10) rustig in rugligging op een plankje, met het hoofd boven water en op de plaats. Wat beslist de examinator?","options":["Onvoldoende: de houding moet verticaal zijn, met opgetrokken knieën.","Voldoende: bij drijven met een voorwerp is rugligging ook toegestaan.","Voldoende: de keuze voor het drijvend voorwerp is vrij."],"answer":0,"explanation":"De essentie van C.10 is verticaal blijven drijven met de principes van de HELP-houding, omdat die de afkoeling in koud water vermindert: verticaal, knieën opgetrokken, ellebogen tegen het lichaam. Rugligging is alleen bij B.8 toegestaan. De keuze voor het voorwerp is wel vrij, maar dat maakt rugligging niet voldoende. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.8 rugligging toegestaan vs C.10 verticaal","source":{"page":55,"quote":"De essentie van dit onderdeel is dat de kandidaat verticaal kan blijven drijven met gebruik van een drijvend voorwerp."}},{"id":"EP-0437","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-26"],"question":"Welke bewering over 5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen (B.9) is NIET juist?","options":["De armen blijven onder water, omdat de benen anders zakken.","Het onderdeel is bedoeld voor als je je benen niet goed kunt gebruiken.","Het onderdeel is vooral bedoeld om even uit te rusten tijdens het zwemmen."],"answer":2,"explanation":"De essentie van B.9 is dat je je kunt verplaatsen als je om een bepaalde reden je benen niet goed kunt gebruiken. De armen blijven onder water, omdat de benen anders zakken en je niet makkelijk vooruitkomt. Uitrusten tijdens het overbruggen van een afstand is een functie van drijven. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.9 essentie: verplaatsen als de benen niet bruikbaar zijn","source":{"page":55,"quote":"De essentie van de opdracht is dat je je kunt verplaatsen wanneer je om een bepaalde reden je benen niet goed kunt gebruiken."}},{"id":"EP-0438","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-26"],"question":"Wat is een verschil tussen voortbewegen op de rug met gebruik van de armen bij Zwemdiploma B (B.9) en bij Zwemdiploma C (C.11)?","options":["Bij B is de verplaatsing hoofdwaarts; bij C mag die zowel hoofd- als voetwaarts.","Bij B wordt dit gekleed gedaan; bij C in badkleding.","Bij B blijven de armen onder water; bij C mogen de armen over het water."],"answer":0,"explanation":"Bij B.9 is de verplaatsing in de richting van het hoofd, omdat dit het eenvoudigst is; bij C.11 is zowel hoofdwaarts als voetwaarts toegestaan. Het is C.11 dat gekleed wordt uitgevoerd, niet B.9, en bij beide blijven de armen onder water. §4.2.3, p. 55 en 56","ref":"§4.2.3, p. 55 en 56","tests":"B.9 hoofdwaarts (eenvoudigst) vs C.11 beide richtingen","source":{"page":56,"quote":"Verplaatsing is zowel in de richting van het hoofd als de voeten toegestaan."}},{"id":"EP-0439","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-27"],"question":"Waarvoor dient een halve draai om de lengteas (A.8, B.10) volgens de Examenregeling?","options":["Om van rug- naar buikligging te veranderen zonder overeind te komen","Om met een draai te water te raken en je daarna te heroriënteren","Om al watertrappend in verticale houding actief om je heen te kijken"],"answer":0,"explanation":"Met een halve draai om de lengteas kun je van rug- naar buikligging veranderen zonder overeind te komen, bijvoorbeeld om te kijken of je nog de goede kant op zwemt. Met een draai te water raken is de rol voorover (om de breedteas), en al watertrappend om je heen kijken hoort bij de hele draai van A.11. §4.2.4, p. 56","ref":"§4.2.4, p. 56","tests":"halve draai om de lengteas: van rug naar buik zonder overeind","source":{"page":56,"quote":"Dit kan om te veranderen van rug- naar buikligging zonder dat je overeind hoeft te komen."}},{"id":"EP-0440","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-28"],"question":"Watertrappen wordt vooral gebruikt om te oriënteren boven water. Welke toepassing van watertrappen noemt de Examenregeling NIET?","options":["Na van een (snelle) glijbaan of springplank in het water terechtkomen","Een bal naar elkaar overgooien tijdens het spelen","Een lange afstand in een grote recreatieplas overbruggen"],"answer":2,"explanation":"Watertrappen is bedoeld om met het hoofd boven water om je heen te kijken, zonder veel inspanning; de regeling noemt onder meer het in het water terechtkomen van een glijbaan of springplank en het overgooien van een bal. Een lange afstand overbruggen hoort bij het basiselement voortbewegen. §4.2.5, p. 56 en 57","ref":"§4.2.5, p. 56 en 57","tests":"toepassingen watertrappen (oriënteren boven water)","source":{"page":56,"quote":"Watertrappen is een belangrijke vaardigheid die vooral wordt gebruikt om te oriënteren boven water."}},{"id":"EP-0441","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-29"],"question":"Een kandidaat voor Zwemdiploma A watertrapt 15 seconden gekleed, in verticale houding en met het hoofd boven water. Hij steekt daarbij, zoals vroeger gebruikelijk was, zijn vingers boven water. Wat beslist de examinator?","options":["Onvoldoende: de armen/handen moeten onder water meebewegen ter ondersteuning.","Voldoende: het hoofd is boven water en de houding is verticaal.","Voldoende: bij gekleed watertrappen is het gebruik van de armen vrij."],"answer":0,"explanation":"Bij gekleed watertrappen moet de inspanning zo makkelijk mogelijk zijn; daarom is het gebruik van armen/handen als ondersteuning heel belangrijk, in tegenstelling tot vroeger, toen de vingers boven water werden getoond. Hoofd boven water en een verticale houding zijn nodig, maar niet voldoende. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"gekleed watertrappen: armen ondersteunen, geen vingers boven water","source":{"page":57,"quote":"ondersteuning heel belangrijk (in tegenstelling tot ‘vroeger’, toen de vingers boven water werden"}},{"id":"EP-0442","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-30"],"question":"Wat is een verschil tussen 30 seconden watertrappen met de benen (C.14) en watertrappen met armen en benen?","options":["Met alleen de benen is het intensiever; het is voor als de armen niet mee kunnen.","Met alleen de benen kost het minder energie, omdat de armen kunnen rusten.","Met alleen de benen hoeft de kandidaat niet op de plaats te blijven."],"answer":0,"explanation":"Watertrappen met alleen de benen is bedoeld voor als de armen om een bepaalde reden niet mee kunnen bewegen, en is intensiever dan wanneer de armen ter ondersteuning mogen worden gebruikt. Ook bij C.14 blijft de kandidaat op de plaats. §4.2.5, p. 58 en 59","ref":"§4.2.5, p. 58 en 59","tests":"watertrappen met alleen de benen: intensiever","source":{"page":59,"quote":"Deze uitvoering is intensiever dan wanneer de armen ter ondersteuning mogen worden gebruikt."}},{"id":"EP-0443","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-31"],"question":"Welke bewering over de enkelvoudige rugslag en de schoolslag is NIET juist?","options":["Bij een goede techniek kost het zwemmen relatief weinig energie.","Beide zwemslagen zijn tot op hoge leeftijd uit te voeren.","Met kleding aan zijn ze minder lang vol te houden dan de borstcrawl."],"answer":2,"explanation":"De enkelvoudige rugslag en de schoolslag zijn juist over een langere afstand makkelijk vol te houden, ook met kleding aan; rugcrawl en borstcrawl zijn misschien minder geschikt voor langere afstanden. Dat ze bij een goede techniek weinig energie kosten en tot op hoge leeftijd uit te voeren zijn, klopt. §4.2.6, p. 59","ref":"§4.2.6, p. 59","tests":"rugslag/schoolslag: weinig energie, ook gekleed vol te houden","source":{"page":59,"quote":"daarom over een langere afstand makkelijk vol te houden, ook wanneer er met kleding wordt gezwommen."}},{"id":"EP-0444","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-31","EP-ESS-32"],"question":"Hoe beschrijft de Examenregeling het verschil in nut tussen enkelvoudige rugslag en schoolslag enerzijds en rugcrawl en borstcrawl anderzijds?","options":["Rugslag en schoolslag zijn geschikt om je in veiligheid te brengen; crawl geeft vooral plezier.","Crawl is het meest geschikt voor lange afstanden; rugslag en schoolslag geven vooral plezier.","Rugslag en schoolslag zijn vooral voor het zwembad; crawl is vooral voor open water."],"answer":0,"explanation":"De enkelvoudige rugslag en de schoolslag zijn heel geschikt om je te verplaatsen en in veiligheid te brengen. Rugcrawl en borstcrawl zijn misschien minder geschikt voor langere afstanden, maar het beheersen ervan levert een grote bijdrage aan het beleven van plezier. Een indeling naar zwembad of open water maakt de regeling niet. §4.2.6, p. 59","ref":"§4.2.6, p. 59","tests":"rugslag/schoolslag veiligheid vs crawl plezier","source":{"page":59,"quote":"maar het beheersen ervan levert een grote bijdrage aan het beleven van plezier."}},{"id":"EP-0445","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-33"],"question":"Waarom worden de armen bij de enkelvoudige rugslag ontspannen naast het lichaam gehouden, in plaats van bijvoorbeeld onder het hoofd?","options":["Zo is er zo weinig mogelijk frontale weerstand.","Zo kan de kandidaat om zich heen blijven kijken.","Zo blijft de ademhaling ontspannen en ritmisch."],"answer":0,"explanation":"Met de armen ontspannen naast het lichaam is er zo weinig mogelijk frontale weerstand, waardoor de verplaatsing met meer gemak wordt bereikt. Om je heen blijven kijken tijdens het voortbewegen noemt de regeling als voordeel van de schoolslag, en een ontspannen ademhaling is een normeringspunt van de schoolslag. §4.2.6, p. 60","ref":"§4.2.6, p. 60","tests":"enkelvoudige rugslag: armen naast lichaam, minste frontale weerstand","source":{"page":60,"quote":"is er sprake van zo weinig mogelijk frontale weerstand"}},{"id":"EP-0446","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-34"],"question":"Waarom is de ademhaling bij de borstcrawl voor Zwemdiploma A en B nog niet noodzakelijk?","options":["Die is in het begin moeilijk voor jonge kinderen en geeft veel extra weerstand.","Bij A en B wordt de borstcrawl met het gezicht boven water gezwommen.","Bij A en B wordt de borstcrawl nog zonder armslag over het water gezwommen."],"answer":0,"explanation":"In het begin van het leerproces is de ademhaling bij de borstcrawl moeilijk voor jonge kinderen en ontstaat er veel (extra) weerstand; daarom is die bij A en B nog niet noodzakelijk. Ook bij A en B is het gezicht in het water en is er sprake van een armslag over het water. §4.2.6, p. 61","ref":"§4.2.6, p. 61","tests":"borstcrawl A/B: waarom ademhaling niet noodzakelijk","source":{"page":61,"quote":"leerproces is het uitvoeren van de ademhaling moeilijk voor jonge kinderen, er ontstaat veel (extra) weerstand."}},{"id":"EP-0447","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-34"],"question":"Wat is het verschil in de ademhaling bij de borstcrawl tussen Zwemdiploma B (B.16) en Zwemdiploma C (C.18)?","options":["Bij B is ademhalen niet beslist noodzakelijk; bij C minimaal één keer, bij voorkeur zijwaarts.","Bij B is minimaal één ademhaling verplicht; bij C moet de ademhaling zijwaarts zijn.","Bij B wordt de ademhaling beoordeeld; bij C niet meer, omdat de manier vrij is."],"answer":0,"explanation":"Bij B is de ademhaling niet beslist noodzakelijk en wordt die, als hij wordt uitgevoerd, niet beoordeeld. Bij C moet er minimaal één keer worden geademd; zijwaarts heeft de voorkeur omdat dat de minste weerstand geeft, maar de manier wordt niet beoordeeld. §4.2.6, p. 61 en 62","ref":"§4.2.6, p. 61 en 62","tests":"borstcrawl ademhaling B vs C","source":{"page":62,"quote":"Er is sprake van minimaal 1 keer een ademhaling."}},{"id":"EP-0448","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-34"],"question":"Een kandidaat voor Zwemdiploma C zwemt 15 meter borstcrawl met het gezicht in het water. Hij haalt één keer adem door het hoofd naar voren op te tillen. Wat beslist de examinator over de ademhaling?","options":["Voldoende: de manier van ademhalen is vrij; zijwaarts heeft alleen de voorkeur.","Onvoldoende: bij Zwemdiploma C moet de ademhaling zijwaarts worden uitgevoerd.","Onvoldoende: bij Zwemdiploma C moet na iedere armslag worden geademd."],"answer":0,"explanation":"Bij C moet er bij de borstcrawl minimaal één keer worden geademd, maar de manier waarop is vrij. Een zijwaartse ademhaling heeft de voorkeur omdat die de minste weerstand geeft, maar wordt niet bij de beoordeling betrokken. Ademen na iedere armslag wordt niet geëist. §4.2.6, p. 61","ref":"§4.2.6, p. 61","tests":"borstcrawl ademhaling B vs C","source":{"page":61,"quote":"C moet dat wel, maar de manier waarop de ademhaling wordt uitgevoerd is vrij."}},{"id":"EP-0449","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-35"],"question":"Waarom worden bij het conditiezwemmen voor Zwemdiploma A en B de enkelvoudige rugslag en de schoolslag afgewisseld?","options":["Zo treedt minder vermoeidheid op en is de afstand makkelijker vol te houden.","Zo kan de examinator beide technieken over de hele afstand beoordelen.","Zo leert de kandidaat tijdens het zwemmen draaien om zich te oriënteren."],"answer":0,"explanation":"Door af te wisselen tussen de enkelvoudige rugslag (minst vermoeiend) en de schoolslag treedt minder vermoeidheid op en kan de afstand makkelijker worden volgehouden. De techniek wordt alleen in de eerste 25 meter van elke zwemslag beoordeeld; daarna gaat het om het volhouden. Oriënteren door te draaien hoort bij het basiselement draaien. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A/B: afwisseling tegen vermoeidheid","source":{"page":62,"quote":"(minst vermoeiend) en de schoolslag, treedt minder vermoeidheid op"}},{"id":"EP-0450","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-36"],"question":"Waarom is gekleed zwemmen in de examenprogramma's opgenomen?","options":["Als je per ongeluk in open water valt, heb je meestal dagelijkse kleding aan.","Met kleding aan zwemmen is een goede training voor het conditiezwemmen.","Kleding geeft extra drijfvermogen, waardoor je langer kunt blijven drijven."],"answer":0,"explanation":"Wie per ongeluk in open water valt, heeft meestal dagelijkse kleding aan; daarom is het belangrijk ook met kleding aan een afstand te kunnen overbruggen. Training voor conditiezwemmen wordt niet als reden genoemd, en kleding maakt zwemmen juist moeilijker door extra weerstand en vermoeidheid. §4.2.6, p. 63 en 64","ref":"§4.2.6, p. 63 en 64","tests":"waarom gekleed zwemmen is opgenomen","source":{"page":63,"quote":"Wanneer je per ongeluk een keer in open water valt, heb je meestal dagelijkse kleding aan."}},{"id":"EP-0451","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-36"],"question":"Een kandidaat voor Zwemdiploma B zwemt bij 50 meter gekleed zwemmen afwisselend borstcrawl en schoolslag met alleen de benen. De techniek is rommelig, maar hij komt met redelijke voortstuwing vooruit. Wat beslist de examinator?","options":["Voldoende: het gaat om het overbruggen van de afstand; de uitvoering telt niet mee.","Onvoldoende: gekleed zwemmen moet met enkelvoudige rugslag of schoolslag.","Onvoldoende: de zwemslagen moeten met armen én benen worden gezwommen."],"answer":0,"explanation":"De essentie van gekleed zwemmen is een afstand kunnen overbruggen met kleding aan. De kandidaat mag schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl gebruiken, mag wisselen en mag ook alleen met armen of benen zwemmen; bij een redelijke voortstuwing wordt de uitvoering van de zwemslagen niet beoordeeld. §4.2.6, p. 63 en 64","ref":"§4.2.6, p. 63 en 64","tests":"gekleed zwemmen: zwemslag en uitvoering vrij","source":{"page":63,"quote":"De essentie van het gekleed zwemmen is het kunnen overbruggen van een afstand met kleding aan."}},{"id":"EP-0452","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-37"],"question":"Wat is volgens de Examenregeling handig om kandidaten bij het gekleed zwemmen te stimuleren?","options":["Bij de enkelvoudige rugslag de armen gebruiken voor balans of extra voorstuwing","Bij de enkelvoudige rugslag de armen stil naast het lichaam houden tegen weerstand","Alleen schoolslag zwemmen, omdat je dan om je heen kunt blijven kijken"],"answer":0,"explanation":"Bij gekleed zwemmen is het handig kandidaten te stimuleren om bij de enkelvoudige rugslag de armen te gebruiken voor de balans of (extra) voorstuwing. Armen ontspannen naast het lichaam is de basistechniek van de enkelvoudige rugslag in badkleding, en de keuze van zwemslag is bij gekleed zwemmen vrij. §4.2.6, p. 64","ref":"§4.2.6, p. 64","tests":"gekleed zwemmen: armen gebruiken bij enkelvoudige rugslag","source":{"page":64,"quote":"stimuleren om bij het uitvoeren van de enkelvoudige rugslag de armen te gebruiken voor de balans of (extra) voorstuwing."}},{"id":"EP-0453","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-38"],"question":"Een kandidaat voor Zwemdiploma A klimt gekleed uit het water door eerst op een mat te gaan liggen en daarna op zijn buik de kant op te schuiven. Wat beslist de examinator?","options":["Voldoende: de essentie is het resultaat en een mat mag worden gebruikt.","Onvoldoende: de kandidaat moet zonder hulpmiddel op de kant klimmen.","Onvoldoende: de kandidaat moet via een trapje uit het water klimmen."],"answer":0,"explanation":"De essentie van zelfstandig uit het water klimmen is het resultaat; er worden geen eisen gesteld aan de manier waarop op de kant wordt geklommen. Het gebruik van een mat of ander drijvend voorwerp is toegestaan, een trapje juist niet. §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"uit het water klimmen: essentie is het resultaat","source":{"page":65,"quote":"Het gebruik van een mat of een ander drijvend voorwerp om het voor de kandidaat makkelijker te maken is toegestaan."}},{"id":"EP-0454","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-38"],"question":"Welke bewering over zelfstandig uit het water klimmen is NIET juist?","options":["Jezelf redden eindigt bij het zelfstandig uit het water klimmen.","Een mat mag worden gebruikt om het klimmen makkelijker te maken.","Er worden eisen gesteld aan de manier waarop op de kant wordt geklommen."],"answer":2,"explanation":"Bij zelfstandig uit het water klimmen is de essentie het resultaat: er worden geen eisen gesteld aan de manier waarop op de kant of over het drijvend voorwerp wordt geklommen. Dat jezelf redden eindigt bij het zelfstandig uit het water klimmen en dat een mat mag worden gebruikt, klopt wel. §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"uit het water klimmen: essentie is het resultaat","source":{"page":65,"quote":"Er worden geen eisen gesteld aan de manier waarop op de kant wordt geklommen."}},{"id":"NO-0001","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-01"],"question":"Wat is volgens hoofdstuk 2 van de examenregeling het uitgangspunt voor het vaststellen van de normering?","options":["Een efficiënte uitvoering van een onderdeel of vaardigheid","Een technisch perfecte uitvoering van elke zwemslag","De snelst mogelijke uitvoering van elk onderdeel"],"answer":0,"explanation":"Uitgangspunt voor de normering is een efficiënte uitvoering, omdat je daarmee bijvoorbeeld sneller een doel bereikt of een zwemslag langer volhoudt. Technische perfectie wordt niet geëist: de normering beschrijft juist de minimale uitvoering. Snelheid is geen uitgangspunt van de normering. §2, p. 16","ref":"§2, p. 16","tests":"uitgangspunt normering: efficiënte uitvoering","source":{"page":16,"quote":"Uitgangspunt voor het vaststellen van de normering is een efficiënte uitvoering van een onderdeel of vaardigheid."}},{"id":"NO-0002","category":"normering","subtopic":"normering_algemeen","type":"onjuist","objectives":["NO-ALG-02","NO-ALG-01"],"question":"Welke bewering over wat de normering in de examenregeling beschrijft, is NIET juist?","options":["De normering beschrijft aan welke kenmerken de (technische) uitvoering van een onderdeel minimaal moet voldoen.","De normering beschrijft in welke waterdiepte een onderdeel minimaal dient te worden uitgevoerd.","De normering schrijft voor elk onderdeel één verplichte uitvoeringswijze voor waaraan de kandidaat moet voldoen."],"answer":2,"explanation":"De normering geeft minimale kenmerken en soms een voorkeursuitvoering, maar geen verplichte uitvoeringswijze per onderdeel; bij veel onderdelen mag de kandidaat het op een eigen manier doen. Dat de normering minimale kenmerken van de uitvoering beschrijft en ook de 'omstandigheden' zoals de minimale waterdiepte, klopt allebei. §2, p. 16","ref":"§2, p. 16","tests":"inhoud normering: kenmerken, voorkeur, niet toegestaan, omstandigheden","source":{"page":16,"quote":"(soms) naar welke uitvoeringswijze de voorkeur uitgaat"}},{"id":"NO-0003","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-02"],"question":"Hoofdstuk 2 noemt 'via een trapje uit het water klimmen' als voorbeeld. Van welk deel van de normering is dit een voorbeeld?","options":["Van wat op sommige punten niet wordt toegestaan","Van een voorkeursuitvoering die niet verplicht is","Van de omstandigheden waaronder een onderdeel wordt getoond"],"answer":0,"explanation":"De normering beschrijft onder meer wat op sommige punten niet wordt toegestaan, met als voorbeeld via een trapje uit het water klimmen. Het is dus geen voorkeursuitvoering. Onder 'omstandigheden' vallen zaken als waterdiepte en afmetingen van materiaal. §2, p. 16","ref":"§2, p. 16","tests":"trapje als voorbeeld van wat niet wordt toegestaan","source":{"page":16,"quote":"wat op sommige punten niet wordt toegestaan (bijvoorbeeld via een trapje uit het water"}},{"id":"NO-0004","category":"normering","subtopic":"normering_algemeen","type":"onjuist","objectives":["NO-ALG-03"],"question":"Welke bewering over de voorkeursuitvoering in de normering is NIET juist?","options":["De normering beschrijft soms naar welke uitvoeringswijze de voorkeur uitgaat.","Met de voorkeursuitvoering wordt meestal het makkelijkst het doel bereikt.","Een kandidaat die de voorkeursuitvoering niet beheerst, kan niet slagen."],"answer":2,"explanation":"Als een kandidaat de voorkeursuitvoering lastig onder de knie krijgt, hoeft dat niet direct een belemmering te zijn om te slagen. De andere twee beweringen kloppen: de normering noemt (soms) een voorkeur, omdat daarmee meestal het makkelijkst het doel wordt bereikt. §2, p. 16","ref":"§2, p. 16","tests":"voorkeursuitvoering geen directe belemmering om te slagen","source":{"page":16,"quote":"hoeft dat niet direct een belemmering te zijn om te slagen voor het zwemdiploma"}},{"id":"NO-0005","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-03"],"question":"Bij de A2 proef Onder water oriëntatie gaat een kandidaat met een sprong van de kant te water in plaats van met een duik. Duiken heeft daar de voorkeur. De rest van de uitvoering voldoet. Wat geldt hier?","options":["Dit hoeft geen belemmering te zijn; de voorkeursuitvoering is niet verplicht.","Dit voldoet niet; bij Zwemdiploma A is duiken verplicht.","Dit voldoet alleen als de kandidaat bij een volgende poging wel duikt."],"answer":0,"explanation":"Bij A2 mag de kandidaat met een sprong te water gaan; duiken heeft alleen de voorkeur. Een kandidaat die de voorkeursuitvoering lastig onder de knie krijgt, hoeft daardoor niet direct te zakken. Duiken is bij A dus niet verplicht, en een nieuwe poging met een duik is niet nodig. §2 en §2.1.1, p. 16–17","ref":"§2 en §2.1.1, p. 16–17","tests":"voorkeursuitvoering geen directe belemmering om te slagen","source":{"page":16,"quote":"wanneer een kandidaat die uitvoering lastig onder de knie krijgt, hoeft dat niet direct een belemmering te zijn"}},{"id":"NO-0006","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-04"],"question":"Wat is volgens §2.1 nodig om in het bezit te komen van een zwemdiploma?","options":["Alle onderdelen van het examenprogramma worden volgens de beschreven normering uitgevoerd.","De meeste onderdelen van elke proef worden volgens de beschreven normering uitgevoerd.","Alle proeven worden uitgevoerd; per proef mag één onderdeel onvoldoende zijn."],"answer":0,"explanation":"Voor een zwemdiploma moeten alle onderdelen van het examenprogramma volgens de beschreven normering worden uitgevoerd. 'De meeste onderdelen' is dus niet genoeg, en een onvoldoende onderdeel per proef is evenmin toegestaan. §2.1, p. 16","ref":"§2.1, p. 16","tests":"alle onderdelen volgens normering voor diploma","source":{"page":16,"quote":"moeten alle onderdelen van het examenprogramma volgens de beschreven normering worden uitgevoerd"}},{"id":"NO-0007","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-06","NO-ALG-04"],"question":"Bij het diplomazwemmen voor Zwemdiploma B is geen drijvend voorwerp beschikbaar. Daarom wordt bij de B1 proef Survival het onderdeel 'gekleed onder een drijvend voorwerp door zwemmen' overgeslagen. De rest gaat goed. Wat geldt?","options":["Het diploma kan zo niet worden behaald; er mogen geen onderdelen worden overgeslagen.","Het diploma kan worden behaald, omdat de overige onderdelen van de proef voldoen.","Het diploma kan worden behaald als de examinator het onderdeel als beheerst beschouwt."],"answer":0,"explanation":"Er mogen geen onderdelen of proeven worden overgeslagen, en voor het diploma moeten alle onderdelen volgens de normering worden uitgevoerd. Dat de overige onderdelen voldoen, is dus niet genoeg. De examinator kan een onderdeel dat niet is uitgevoerd ook niet als beheerst aanmerken. §2.1, p. 16","ref":"§2.1, p. 16","tests":"geen onderdelen of proeven overslaan","source":{"page":16,"quote":"Er mogen geen onderdelen of proeven worden overgeslagen."}},{"id":"NO-0008","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-05"],"question":"Een kandidaat met een permanente fysieke beperking zwemt bij de schoolslag een schaarslag. Verder voldoet zijn uitvoering. Wat geldt voor de beoordeling?","options":["Hij kan slagen, mits de essentie van de opdracht blijft bestaan.","Hij kan niet slagen; aanpassing kan alleen bij een tijdelijke beperking.","Hij kan alleen slagen als hij het onderdeel met rugcrawl overdoet."],"answer":0,"explanation":"Bij de beoordeling wordt rekening gehouden met een tijdelijke of permanente beperking; de uitvoering mag worden aangepast zolang de essentie blijft bestaan. De regeling noemt juist de schaarslag bij schoolslag of enkelvoudige rugslag als voorbeeld. Aanpassing is dus niet beperkt tot tijdelijke beperkingen, en overdoen met een andere zwemslag is niet nodig. §2.1, p. 16","ref":"§2.1, p. 16","tests":"aanpassing bij beperking mits essentie blijft (schaarslag)","source":{"page":16,"quote":"kandidaten die door een (fysieke) beperking een schaarslag zwemmen bij de schoolslag of enkelvoudige rugslag, wel kunnen slagen voor dat onderdeel"}},{"id":"NO-0009","category":"normering","subtopic":"normering_algemeen","type":"onjuist","objectives":["NO-ALG-05","NO-ALG-06"],"question":"Welke bewering over de beoordeling van kandidaten met een beperking is NIET juist?","options":["Er wordt rekening gehouden met zowel een tijdelijke als een permanente beperking.","De uitvoering mag worden aangepast, mits de essentie van de opdracht blijft bestaan.","Een onderdeel dat de kandidaat door zijn beperking niet kan uitvoeren, mag worden overgeslagen."],"answer":2,"explanation":"Ook bij een beperking mogen geen onderdelen of proeven worden overgeslagen; alleen de uitvoering kan worden aangepast. Dat rekening wordt gehouden met tijdelijke en permanente beperkingen en dat aanpassing mag zolang de essentie blijft bestaan, klopt allebei. §2.1, p. 16","ref":"§2.1, p. 16","tests":"aanpassing bij beperking, maar niets overslaan","source":{"page":16,"quote":"De uitvoering van onderdelen kan worden aangepast aan de mogelijkheden van de kandidaat, mits de essentie van de opdracht of vaardigheid blijft bestaan."}},{"id":"NO-0010","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-01"],"question":"In welke waterdiepte wordt de A1 proef Survival minimaal gestart?","options":["1,8 meter","1,4 meter","Waar de kandidaat net kan staan"],"answer":0,"explanation":"De A1 proef Survival wordt gestart in een waterdiepte van minimaal 1,8 meter. 1,4 meter is de minimale lengte van het drijvend voorwerp, geen waterdiepte. Water waarin de kandidaat kan staan is juist te ondiep. §2.1.1, p. 16","ref":"§2.1.1, p. 16","tests":"A1 survival: waterdiepte minimaal 1,8 m","source":{"page":16,"quote":"De proef wordt gestart in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0011","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-01","NO-SURV-03"],"question":"Welke bewering over de normering van de A1 proef Survival is NIET juist?","options":["De proef wordt gestart in een waterdiepte van minimaal 1,4 meter.","'Vanaf enige hoogte' is minimaal 30 centimeter vanaf de waterlijn.","Bij de voetsprong raken de voeten als eerste het water."],"answer":0,"explanation":"De A1 proef Survival wordt gestart in een waterdiepte van minimaal 1,8 meter, niet 1,4 meter. Dat 'vanaf enige hoogte' minimaal 30 centimeter vanaf de waterlijn is en dat de voeten als eerste het water raken, staat wel in de normering. §2.1.1, p. 16–17","ref":"§2.1.1, p. 16–17","tests":"A1 survival: waterdiepte minimaal 1,8 m","source":{"page":16,"quote":"De proef wordt gestart in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0012","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-01","NO-SURV-10"],"question":"Wat is het verschil in voorgeschreven waterdiepte tussen de A1 en de B1 proef Survival?","options":["A1 start in minimaal 1,8 meter; B1 is tenminste waar de kandidaat niet kan staan.","A1 is tenminste waar de kandidaat niet kan staan; B1 start in minimaal 1,8 meter.","A1 en B1 worden allebei gestart in een waterdiepte van minimaal 1,8 meter."],"answer":0,"explanation":"Voor A1 noemt de regeling een minimale waterdiepte van 1,8 meter. B1 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. De omgekeerde combinatie klopt dus niet, en voor B1 staat geen 1,8 meter genoemd. §2.1.1–2.1.2, p. 16 en 21","ref":"§2.1.1–2.1.2, p. 16 en 21","tests":"waterdiepte survival A1 (1,8 m) vs B1/C1 (niet kunnen staan)","source":{"page":21,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"NO-0013","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-02","NO-SURV-04"],"question":"Welke bewering over de gekleed voetsprong voorwaarts bij de A1 proef Survival is NIET juist?","options":["De voeten raken als eerste het water en het lichaam is zo gestrekt mogelijk.","De kandidaat gaat na de sprong helemaal onder water.","Zonder hoge kant of startblok springt de kandidaat gewoon vanaf de lage kant."],"answer":2,"explanation":"Als er geen hoge kant of startblok is, moet worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen; vanaf de lage kant springen is dan niet de oplossing. Dat de voeten eerst het water raken met een zo gestrekt mogelijk lichaam en dat de kandidaat helemaal onder water gaat, staat wel in de normering. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong: veilige verhoging zonder hoge kant","source":{"page":17,"quote":"Indien geen hoge kant of startblok aanwezig is, dient te worden gezorgd voor een veilige verhoging"}},{"id":"NO-0014","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-02"],"question":"Een kandidaat voor Zwemdiploma A maakt bij de A1 proef Survival een voetsprong voorwaarts vanaf voldoende hoogte, met de voeten eerst en een gestrekt lichaam. Zijn hoofd blijft echter boven water. Wat beslist de examinator?","options":["Het onderdeel voldoet niet; na de sprong moet hij helemaal onder water.","Het onderdeel voldoet; bij een survivalsprong blijft het hoofd boven water.","Het onderdeel voldoet; alleen de gestrekte houding wordt beoordeeld."],"answer":0,"explanation":"Bij de gekleed voetsprong voorwaarts moet de kandidaat na de sprong helemaal onder water gaan. Een sprong waarbij het hoofd boven water blijft, is een ander onderdeel (bij Zwemdiploma C). De normering stelt ook andere eisen dan alleen een gestrekt lichaam. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong A1: helemaal onder water","source":{"page":17,"quote":"De kandidaat gaat na de sprong helemaal onder water."}},{"id":"NO-0015","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-03"],"question":"Bij de A1 proef Survival maakt een kandidaat een correcte voetsprong voorwaarts vanaf een kant die 20 centimeter boven de waterlijn ligt. Wat beslist de examinator?","options":["Dit voldoet niet; 'vanaf enige hoogte' is minimaal 30 centimeter vanaf de waterlijn.","Dit voldoet; de voetsprong mag vanaf een lage kant worden uitgevoerd.","Dit voldoet; de hoogte waarvan wordt gesprongen, is niet voorgeschreven."],"answer":0,"explanation":"Vanaf enige hoogte betekent bij de voetsprong voorwaarts minimaal 30 centimeter vanaf de waterlijn, dus 20 centimeter is te laag. 'Vanaf een lage kant' hoort bij achterwaarts te water gaan (B) en de rol voorover (C), niet bij de voetsprong. De hoogte is dus wel voorgeschreven. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong A1: vanaf enige hoogte = minimaal 30 cm","source":{"page":17,"quote":"Vanaf enige hoogte is minimaal 30 centimeter vanaf de waterlijn."}},{"id":"NO-0016","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-04"],"question":"Een zwembad heeft bij het diepe gedeelte geen hoge kant en geen startblok. Hoe wordt de voetsprong voorwaarts van de A1 proef Survival dan afgenomen?","options":["Er wordt gezorgd voor een veilige verhoging waar vanaf wordt gesprongen.","De kandidaat springt vanaf de lage kant; de hoogte-eis vervalt dan.","De kandidaat gaat in plaats daarvan achterwaarts te water vanaf de kant."],"answer":0,"explanation":"Als er geen hoge kant of startblok aanwezig is, moet worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen. De eis van minimaal 30 centimeter vervalt dus niet. Het onderdeel vervangen door achterwaarts te water gaan mag niet; dat is een onderdeel van B1. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong: veilige verhoging zonder hoge kant","source":{"page":17,"quote":"dient te worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen"}},{"id":"NO-0017","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-05"],"question":"Welke zwemslagen mag een kandidaat gebruiken bij het gekleed zwemmen in de proef Survival?","options":["Eén of meer van: schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl","Alleen schoolslag of enkelvoudige rugslag, zonder te wisselen","Eén zwemslag naar keuze, die de hele afstand wordt volgehouden"],"answer":0,"explanation":"Bij gekleed zwemmen zwemt de kandidaat één of meer van de vier genoemde zwemslagen: schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl. Hij is niet beperkt tot schoolslag of enkelvoudige rugslag, en hij hoeft niet één slag vol te houden: voortdurend wisselen mag. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: vier zwemslagen, wisselen mag","source":{"page":17,"quote":"De kandidaat zwemt één of meer van de volgende zwemslagen: schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl."}},{"id":"NO-0018","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-05","NO-SURV-06"],"question":"Welke bewering over het 50 meter gekleed zwemmen bij de B1 proef Survival is NIET juist?","options":["De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen.","De kandidaat zwemt één of meer van de zwemslagen schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl.","De kandidaat moet de hele afstand met dezelfde zwemslag zwemmen."],"answer":2,"explanation":"Bij gekleed zwemmen mag de kandidaat voortdurend wisselen van zwemslagen; één slag de hele afstand is dus niet vereist. Dat de zwemslagen ook met alleen de armen of alleen de benen mogen en dat hij kiest uit de vier genoemde slagen, klopt allebei. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"gekleed zwemmen: vier zwemslagen, wisselen mag","source":{"page":22,"quote":"De kandidaat mag voortdurend wisselen van zwemslagen."}},{"id":"NO-0019","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-06"],"question":"Een kandidaat voor Zwemdiploma A zwemt de 12,5 meter gekleed zwemmen alleen met de benen van de rugcrawl. Hij komt met een redelijk voortstuwingsrendement vooruit. Wat beslist de examinator?","options":["Dit voldoet; de zwemslagen mogen ook met alleen de benen worden gezwommen.","Dit voldoet niet; bij gekleed zwemmen moeten armen en benen samen bewegen.","Dit voldoet niet; alleen met de benen zwemmen mag alleen bij schoolslag."],"answer":0,"explanation":"Bij gekleed zwemmen mogen de zwemslagen ook met alleen de armen of alleen de benen worden gezwommen, bij elk van de vier toegestane zwemslagen. Armen en benen hoeven dus niet samen te bewegen, en de regel is niet beperkt tot de schoolslag. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: alleen armen of alleen benen toegestaan","source":{"page":17,"quote":"De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen."}},{"id":"NO-0020","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-07","NO-SURV-06","NO-SURV-05"],"question":"Welke bewering over de normering van het 100 meter gekleed zwemmen bij de C1 proef Survival is NIET juist?","options":["De kandidaat mag voortdurend wisselen van zwemslagen.","De zwemslagen mogen ook met alleen de armen worden gezwommen.","De technische uitvoering van de zwemslagen telt mee in de beoordeling."],"answer":2,"explanation":"Bij gekleed zwemmen moet er sprake zijn van een redelijk voorstuwingsrendement; de uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling. Voortdurend wisselen van zwemslag mag wel, en zwemmen met alleen de armen ook. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"gekleed zwemmen: redelijk rendement, techniek niet beoordeeld","source":{"page":28,"quote":"de uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling"}},{"id":"NO-0021","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-07"],"question":"Waarop let de examinator bij het 12,5 meter gekleed zwemmen van de A1 proef Survival?","options":["Op een redelijk voortstuwingsrendement","Op een correcte uitvoering van de zwemslagen","Op het volhouden van één en dezelfde zwemslag"],"answer":0,"explanation":"Bij gekleed zwemmen moet er sprake zijn van een redelijk voortstuwingsrendement; de uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling. Een correcte zwemslagtechniek is dus geen eis, en de kandidaat mag voortdurend wisselen van zwemslag. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: redelijk rendement, techniek niet beoordeeld","source":{"page":17,"quote":"Er is sprake van een redelijk voortstuwingsrendement"}},{"id":"NO-0022","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-08"],"question":"Een kandidaat voor Zwemdiploma B rondt de B1 proef Survival af door zich via een mat die in het water ligt zelfstandig op de kant te werken. Wat beslist de examinator?","options":["Dit voldoet; gebruik van een drijvend voorwerp, zoals een mat, is toegestaan.","Dit voldoet niet; de kandidaat moet zonder hulpmiddel op de kant klimmen.","Dit voldoet niet; een mat mag alleen bij Zwemdiploma A worden gebruikt."],"answer":0,"explanation":"Bij zelfstandig uit het water op de kant klimmen klimt de kandidaat op een eigen manier, en het gebruik van een drijvend voorwerp, zoals een mat, is toegestaan. Klimmen zonder hulpmiddel is dus niet vereist. De mat is bij A, B en C op dezelfde manier toegestaan. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"kant klimmen: mat (drijvend voorwerp) toegestaan","source":{"page":22,"quote":"Gebruik van een drijvend voorwerp, zoals een mat, is toegestaan."}},{"id":"NO-0023","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-09"],"question":"Een kandidaat voor Zwemdiploma B klimt aan het eind van de B1 proef Survival gekleed via het trapje uit het water. Wat beslist de examinator?","options":["Dit voldoet niet; het gebruik van een trapje is niet toegestaan.","Dit voldoet; de kandidaat mag op een eigen manier uit het water klimmen.","Dit voldoet; een trapje is alleen bij Zwemdiploma A niet toegestaan."],"answer":0,"explanation":"Bij zelfstandig uit het water op de kant klimmen is het gebruik van een trapje niet toegestaan. 'Op een eigen manier' betekent dus niet dat een trapje mag. Het trapje-verbod geldt bij A, B en C. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"kant klimmen: trapje niet toegestaan","source":{"page":22,"quote":"Het gebruik van een trapje is niet toegestaan."}},{"id":"NO-0024","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-09","NO-SURV-08"],"question":"Welke bewering over 'zelfstandig uit het water op de kant klimmen' bij de A1 proef Survival is NIET juist?","options":["De kandidaat klimt op een eigen manier uit het water op de kant.","Gebruik van een drijvend voorwerp, zoals een mat, is toegestaan.","Gebruik van een trapje is toegestaan als de kant hoog is."],"answer":2,"explanation":"Het gebruik van een trapje is bij dit onderdeel niet toegestaan, ook niet bij een hoge kant. De kandidaat klimt wel op een eigen manier uit het water, en een drijvend voorwerp zoals een mat mag worden gebruikt. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"kant klimmen: trapje niet toegestaan","source":{"page":17,"quote":"Het gebruik van een trapje is niet toegestaan."}},{"id":"NO-0025","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-09","NO-SURV-08"],"question":"Hoe verschilt de normering van 'zelfstandig uit het water op de kant klimmen' tussen de proeven Survival van A, B en C?","options":["Er is geen verschil; bij A, B en C is een trapje niet toegestaan.","Bij A mag een trapje worden gebruikt, bij B en C niet.","Bij C is een mat niet toegestaan, bij A en B wel."],"answer":0,"explanation":"Bij A1, B1 en C1 is de normering gelijk: de kandidaat klimt op een eigen manier op de kant, een drijvend voorwerp zoals een mat mag, en een trapje is niet toegestaan. Er is dus geen uitzondering voor het trapje bij A, en de mat is bij C ook toegestaan. §2.1.1–2.1.3, p. 17, 22 en 28","ref":"§2.1.1–2.1.3, p. 17, 22 en 28","tests":"kant klimmen: normering gelijk bij A, B en C","source":{"page":28,"quote":"Het gebruik van een trapje is niet toegestaan."}},{"id":"NO-0026","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-10"],"question":"In welke waterdiepte wordt de C1 proef Survival uitgevoerd?","options":["Tenminste waar de kandidaat niet kan staan","In een waterdiepte van minimaal 1,4 meter","In een waterdiepte van minimaal 3 meter"],"answer":0,"explanation":"De C1 proef Survival wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. 1,4 meter is de minimale lengte van het drijvend voorwerp, geen waterdiepte. 3 meter is de afstand van het zeil bij A2, ook geen waterdiepte. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"C1 survival: dieper water, waar de kandidaat niet kan staan","source":{"page":27,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"NO-0027","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-11"],"question":"Wat kenmerkt het gekleed achterwaarts te water gaan bij de B1 proef Survival?","options":["De kandidaat heeft geen zicht op de valrichting.","De kandidaat maakt een draai om de breedteas.","De voeten raken als eerste het water."],"answer":0,"explanation":"Bij achterwaarts te water gaan heeft de kandidaat geen zicht op de valrichting. Een draai om de breedteas hoort bij de rol voorover van C1. Dat de voeten als eerste het water raken, is een kenmerk van de voetsprong voorwaarts van A1. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: geen zicht op valrichting","source":{"page":22,"quote":"De kandidaat heeft geen zicht op de valrichting."}},{"id":"NO-0028","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-12"],"question":"Een kandidaat voor Zwemdiploma B springt bij de B1 proef Survival achterwaarts het water in, zonder te kijken waar hij terechtkomt. Wat beslist de examinator?","options":["Dit voldoet niet; er moet sprake zijn van een valbeweging.","Dit voldoet; de kandidaat heeft geen zicht op de valrichting.","Dit voldoet; een sprong heeft bij dit onderdeel de voorkeur."],"answer":0,"explanation":"Bij gekleed achterwaarts te water gaan moet er sprake zijn van een valbeweging; springen is niet toegestaan. Geen zicht op de valrichting is wel een eis, maar dat alleen is niet genoeg. Een sprong heeft hier dus zeker niet de voorkeur. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: valbeweging, springen niet toegestaan","source":{"page":22,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."}},{"id":"NO-0029","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-12","NO-SURV-13","NO-SURV-11"],"question":"Welke bewering over het gekleed achterwaarts te water gaan bij Zwemdiploma B is NIET juist?","options":["Dit onderdeel mag vanaf een drijvend voorwerp worden uitgevoerd.","Te water gaan mag zittend of staand worden uitgevoerd.","Een kleine sprong achterwaarts is toegestaan, mits zonder zicht op de valrichting."],"answer":2,"explanation":"Bij achterwaarts te water gaan is er sprake van een valbeweging; springen is niet toegestaan, ook geen kleine sprong. Het onderdeel mag wel vanaf een lage kant of een drijvend voorwerp worden uitgevoerd, en zowel zittend als staand. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: valbeweging, springen niet toegestaan","source":{"page":22,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."}},{"id":"NO-0030","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-02","NO-SURV-11","NO-SURV-15"],"question":"Op welke manier gaat de kandidaat aan het begin van de proef Survival gekleed te water bij Zwemdiploma A, B en C?","options":["A: voetsprong voorwaarts; B: achterwaarts; C: rol voorover","A: achterwaarts; B: voetsprong voorwaarts; C: rol voorover","A: voetsprong voorwaarts; B: rol voorover; C: achterwaarts"],"answer":0,"explanation":"A1 begint met een voetsprong voorwaarts vanaf enige hoogte, B1 met achterwaarts te water gaan en C1 met een rol voorover. De andere twee volgordes verwisselen de onderdelen van A en B, of van B en C. §2.1.1–2.1.3, p. 17, 21 en 27","ref":"§2.1.1–2.1.3, p. 17, 21 en 27","tests":"te water gaan bij survival: A voetsprong, B achterwaarts, C rol","source":{"page":21,"quote":"Achterwaarts te water gaan, gekleed"}},{"id":"NO-0031","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-03","NO-SURV-13"],"question":"Wat is een verschil tussen het te water gaan bij de A1 en bij de B1 proef Survival?","options":["Bij A1 vanaf minimaal 30 centimeter boven de waterlijn, bij B1 mag het vanaf een lage kant.","Bij A1 mag het vanaf een lage kant, bij B1 vanaf minimaal 30 centimeter boven de waterlijn.","Bij A1 en B1 mag de kandidaat zelf kiezen of hij zittend of staand te water gaat."],"answer":0,"explanation":"De voetsprong voorwaarts van A1 gaat vanaf enige hoogte: minimaal 30 centimeter vanaf de waterlijn. Achterwaarts te water gaan bij B1 mag vanaf een lage kant of een drijvend voorwerp. De keuze tussen zittend of staand geldt alleen voor B1. §2.1.1–2.1.2, p. 17 en 22","ref":"§2.1.1–2.1.2, p. 17 en 22","tests":"hoogte te water gaan: A1 30 cm vs B1 lage kant of drijvend voorwerp","source":{"page":22,"quote":"Dit onderdeel mag vanaf een lage kant of een drijvend voorwerp worden uitgevoerd."}},{"id":"NO-0032","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-14"],"question":"Waaraan moet het gekleed onder een drijvend voorwerp door zwemmen bij de B1 proef Survival voldoen?","options":["De kandidaat zwemt met een redelijke voorstuwing onder water onder het voorwerp door.","De kandidaat duikt van de kant en zwemt zonder boven te komen onder het voorwerp door.","De kandidaat gaat minimaal 1 meter voor het voorwerp onder water."],"answer":0,"explanation":"De normering vraagt dat de kandidaat met een redelijke voorstuwing onder water onder een voorwerp, bijvoorbeeld een mat of bootje, door zwemt. Van de kant duiken zonder boven te komen hoort bij de proef Onder water oriëntatie. Minimaal 1 meter vooraf onder water gaan is een eis bij het zeil in C1. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"onder drijvend voorwerp door: redelijke voorstuwing onder water","source":{"page":22,"quote":"De kandidaat zwemt met een redelijke voorstuwing onder water onder een voorwerp"}},{"id":"NO-0033","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-14"],"question":"Welke bewering over het gekleed onder een drijvend voorwerp door zwemmen bij de C1 proef Survival is NIET juist?","options":["De kandidaat zwemt met een redelijke voorstuwing onder water onder het voorwerp door.","Het voorwerp waar de kandidaat onderdoor zwemt, is minimaal 70 centimeter breed.","De kandidaat moet minimaal 1 meter voor het voorwerp onder water gaan."],"answer":2,"explanation":"Minimaal 1 meter vooraf onder water gaan is een eis bij het zwemmen door het gat in het zeil, niet bij het onder een drijvend voorwerp door zwemmen. Dat de kandidaat met een redelijke voorstuwing onder water onder het voorwerp door zwemt en dat het voorwerp minimaal 70 centimeter breed is, staat wel in de normering. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"onder drijvend voorwerp door: redelijke voorstuwing onder water","source":{"page":28,"quote":"De kandidaat zwemt met een redelijke voorstuwing onder water onder een voorwerp (bijvoorbeeld een mat of bootje) door."}},{"id":"NO-0034","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-21","NO-SURV-14"],"question":"Wat is een verschil tussen de B1 en de C1 proef Survival wat betreft het drijvend voorwerp tijdens het zwemmen?","options":["Bij B1 zwemt de kandidaat er 1 keer onderdoor; bij C1 ook 1 keer eroverheen klimmen.","Bij B1 klimt de kandidaat er 1 keer overheen; bij C1 zwemt hij er 1 keer onderdoor.","Bij B1 en C1 zwemt de kandidaat er 2 keer onderdoor en klimt hij er niet overheen."],"answer":0,"explanation":"Bij B1 zwemt de kandidaat 1 keer gekleed onder een drijvend voorwerp door. Bij C1 komt daar 1 keer gekleed over een drijvend voorwerp heen klimmen bij. Over een drijvend voorwerp heen klimmen komt bij B1 niet voor, en bij geen van beide proeven wordt er 2 keer onderdoor gezwommen. §2.1.2–2.1.3, p. 21 en 27","ref":"§2.1.2–2.1.3, p. 21 en 27","tests":"drijvend voorwerp: B1 onderdoor, C1 ook overheen klimmen","source":{"page":27,"quote":"1 keer gekleed over een drijvend voorwerp heen klimmen"}},{"id":"NO-0035","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-15"],"question":"Een kandidaat voor Zwemdiploma C gaat bij de C1 proef Survival met een rol voorover te water. Hij maakt een draai om de breedteas, maar komt een stuk verder en schuin ten opzichte van de kant in het water terecht. Wat beslist de examinator?","options":["Dit voldoet; de plaats waar de kandidaat in het water terechtkomt, is niet van belang.","Dit voldoet niet; de kandidaat moet met de voeten eerst in het water terechtkomen.","Dit voldoet niet; de kandidaat moet recht voor de kant in het water terechtkomen."],"answer":0,"explanation":"Bij de rol voorover moet er sprake zijn van een draai om de breedteas; de plaats waar de kandidaat in het water terechtkomt, is niet van belang. Met de voeten eerst het water raken is een kenmerk van de voetsprong voorwaarts van A1. Een vaste plek recht voor de kant wordt niet geëist. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: plaats in het water niet van belang","source":{"page":27,"quote":"De plaats waar de kandidaat in het water terecht komt, is niet van belang."}},{"id":"NO-0036","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-15","NO-SURV-16"],"question":"Welke bewering over het gekleed met een rol voorover te water gaan bij de C1 proef Survival is NIET juist?","options":["Er is sprake van een draai om de breedteas.","De rol voorover mag vanaf een drijvend voorwerp worden uitgevoerd.","De rol voorover gaat vanaf minimaal 30 centimeter boven de waterlijn."],"answer":2,"explanation":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd; minimaal 30 centimeter boven de waterlijn is de hoogte-eis bij de voetsprong voorwaarts van A1. Dat er sprake is van een draai om de breedteas en dat een drijvend voorwerp als startplaats mag, klopt allebei. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: vanaf (lage) kant of drijvend voorwerp","source":{"page":27,"quote":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd."}},{"id":"NO-0037","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-16"],"question":"Bij de C1 proef Survival voert een kandidaat de rol voorover uit vanaf een drijvend voorwerp in plaats van vanaf de kant. De draai om de breedteas is correct. Wat beslist de examinator?","options":["Dit voldoet; de rol voorover mag vanaf een drijvend voorwerp worden uitgevoerd.","Dit voldoet niet; de rol voorover moet vanaf de kant worden uitgevoerd.","Dit voldoet niet; de rol voorover moet vanaf minimaal 30 centimeter hoogte."],"answer":0,"explanation":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd. Een rol vanaf de kant is dus niet verplicht. De eis van minimaal 30 centimeter hoogte hoort bij de voetsprong voorwaarts van A1. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: vanaf (lage) kant of drijvend voorwerp","source":{"page":27,"quote":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd."}},{"id":"NO-0038","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-17"],"question":"Welke houding hoort bij het 30 seconden gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp (C1)?","options":["Knieën opgetrokken, ellebogen tegen het lichaam, hoofd boven water","Benen gestrekt, armen gespreid naast het lichaam, hoofd boven water","Benen bewegen afwisselend, armen ondersteunen onder water"],"answer":0,"explanation":"Bij verticaal blijven drijven met een drijvend voorwerp is het hoofd boven water, de houding verticaal, zijn de knieën opgetrokken en de ellebogen tegen het lichaam. Gestrekte benen en gespreide armen passen daar niet bij. Bewegende benen met ondersteunende armen beschrijven het watertrappen. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"verticaal drijven: hoofd boven, knieën opgetrokken, ellebogen tegen lichaam","source":{"page":27,"quote":"De ellebogen zijn tegen het lichaam."}},{"id":"NO-0039","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-18","NO-SURV-17"],"question":"Welke bewering over het gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp bij Zwemdiploma C is NIET juist?","options":["De onderbenen mogen gekruist of naast elkaar zijn.","De keuze voor het drijvend voorwerp is vrij.","De kandidaat mag zich rustig in een richting naar keuze verplaatsen."],"answer":2,"explanation":"Bij verticaal blijven drijven blijft de kandidaat op de plaats; verplaatsen hoort er niet bij. De onderbenen mogen wel gekruist of naast elkaar zijn, en de keuze voor het drijvend voorwerp is vrij. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"verticaal drijven: op de plaats, onderbenen vrij, voorwerp vrij","source":{"page":27,"quote":"De keuze voor het drijvend voorwerp is vrij. • De kandidaat blijft op de plaats."}},{"id":"NO-0040","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-19","NO-SURV-20"],"question":"Welke bewering over het 5 meter gekleed voortbewegen op de rug met gebruik van de armen (C1) is NIET juist?","options":["De ligging is horizontaal.","Verplaatsing is zowel in de richting van het hoofd als van de voeten toegestaan.","De benen ondersteunen de verplaatsing met een lichte trapbeweging."],"answer":2,"explanation":"Bij dit onderdeel liggen de benen stil; de verplaatsing gebeurt door gebruik van de armen/handen. De ligging is wel horizontaal, en verplaatsing in de richting van het hoofd en van de voeten is allebei toegestaan. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"voortbewegen op de rug C1: horizontaal, benen stil, armen/handen","source":{"page":27,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen."}},{"id":"NO-0041","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-19"],"question":"Bij het 5 meter gekleed voortbewegen op de rug (C1) ligt een kandidaat horizontaal. Hij verplaatst zich met een lichte beenslag, terwijl zijn armen onder water meebewegen. Wat beslist de examinator?","options":["Dit voldoet niet; de benen liggen stil en de armen/handen zorgen voor verplaatsing.","Dit voldoet; zolang de armen onder water blijven, mogen de benen meehelpen.","Dit voldoet; alleen een redelijk voorstuwingsrendement wordt beoordeeld."],"answer":0,"explanation":"Bij voortbewegen op de rug met gebruik van de armen liggen de benen stil en gebeurt de verplaatsing door gebruik van de armen/handen. Dat de armen onder water blijven, maakt een beenslag niet toegestaan. 'Alleen een redelijk voorstuwingsrendement' is de norm bij gekleed zwemmen, niet bij dit onderdeel. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"voortbewegen op de rug C1: horizontaal, benen stil, armen/handen","source":{"page":27,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen."}},{"id":"NO-0042","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-20"],"question":"Hoe verschilt de toegestane richting bij voortbewegen op de rug met gebruik van de armen tussen B5 (Zwemdiploma B) en C1 (Zwemdiploma C)?","options":["B5: alleen richting hoofd; C1: richting hoofd én richting voeten","B5: richting hoofd én richting voeten; C1: alleen richting hoofd","B5 en C1: alleen in de richting van het hoofd"],"answer":0,"explanation":"Bij B5 gaat het om hoofdwaarts voortbewegen: de verplaatsing is in de richting van het hoofd. Bij C1 is de verplaatsing zowel in de richting van het hoofd als de voeten toegestaan. De andere twee opties draaien dit om of beperken C1 ten onrechte tot hoofdwaarts. §2.1.2–2.1.3, p. 25 en 28","ref":"§2.1.2–2.1.3, p. 25 en 28","tests":"voortbewegen op de rug: C1 richting hoofd en voeten","source":{"page":28,"quote":"Verplaatsing is zowel in de richting van het hoofd als de voeten toegestaan."}},{"id":"NO-0043","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-21"],"question":"Welke bewering over het gekleed over een drijvend voorwerp heen klimmen is NIET juist?","options":["De kandidaat klimt op een eigen manier uit het water op het drijvend voorwerp.","Het voorwerp waar de kandidaat overheen klimt, is minimaal 70 centimeter breed.","Dit onderdeel komt zowel in de B1 als in de C1 proef Survival voor."],"answer":2,"explanation":"Over een drijvend voorwerp heen klimmen komt alleen in de C1 proef Survival voor; bij B1 zwemt de kandidaat er alleen onderdoor. De kandidaat klimt wel op een eigen manier uit het water op het voorwerp, en het voorwerp is minimaal 70 centimeter breed. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"over drijvend voorwerp heen klimmen: op eigen manier (alleen C1)","source":{"page":28,"quote":"De kandidaat klimt op een eigen manier uit het water op een drijvend voorwerp."}},{"id":"NO-0044","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-22"],"question":"Bij de C1 proef Survival gaat een kandidaat gekleed met een sprong vanaf de lage kant te water voor het onderdeel 'te water gaan met een sprong waarbij het hoofd boven water blijft'. Zijn hoofd verdwijnt even helemaal onder water. Wat beslist de examinator?","options":["Dit voldoet niet; bij deze sprong blijft het hoofd boven water.","Dit voldoet; de sprong mag vanaf een lage kant worden uitgevoerd.","Dit voldoet; na een sprong gaat de kandidaat helemaal onder water."],"answer":0,"explanation":"Bij gekleed te water gaan met een sprong waarbij het hoofd boven water blijft, is dat ook de eis: het hoofd blijft boven water. Dat de sprong vanaf een (lage) kant mag, klopt, maar maakt de uitvoering niet goed. Helemaal onder water gaan na de sprong is de eis bij de voetsprong voorwaarts van A1. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"sprong C1: hoofd blijft boven water","source":{"page":28,"quote":"Het hoofd blijft boven water."}},{"id":"NO-0045","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-22","NO-SURV-02"],"question":"Wat is een verschil tussen de voetsprong voorwaarts bij A1 en de sprong waarbij het hoofd boven water blijft bij C1?","options":["Bij A1 gaat de kandidaat helemaal onder water; bij C1 blijft het hoofd boven water.","Bij A1 blijft het hoofd boven water; bij C1 gaat de kandidaat helemaal onder water.","Bij A1 mag vanaf een lage kant worden gesprongen; bij C1 vanaf minimaal 30 centimeter."],"answer":0,"explanation":"Bij de voetsprong voorwaarts van A1 gaat de kandidaat na de sprong helemaal onder water; bij de sprong van C1 blijft het hoofd boven water. De tweede optie draait dat om. De hoogte is ook andersom: A1 vanaf minimaal 30 centimeter, C1 mag vanaf een (lage) kant of een drijvend voorwerp. §2.1.1 en §2.1.3, p. 17 en 28","ref":"§2.1.1 en §2.1.3, p. 17 en 28","tests":"sprong A1 (onder water) vs C1 (hoofd boven water)","source":{"page":28,"quote":"Het hoofd blijft boven water."}},{"id":"NO-0046","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-23"],"question":"Hoeveel meter voor het verticaal hangende zeil moet de kandidaat bij de C1 proef Survival minimaal onder water gaan?","options":["1 meter","3 meter","6 meter"],"answer":0,"explanation":"Bij gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen moet de kandidaat minimaal 1 meter voor het zeil onder water gaan. 3 meter en 6 meter zijn de afstanden van het zeil tot de startkant bij de proef Onder water oriëntatie (A respectievelijk B en C). §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"zeil C1: minimaal 1 m voor het zeil onder water","source":{"page":28,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."}},{"id":"NO-0047","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-23"],"question":"Bij de C1 proef Survival springt een kandidaat te water en zwemt enkele slagen. Pas een halve meter voor het verticaal hangende zeil gaat hij onder water, waarna hij keurig door het gat zwemt. Wat beslist de examinator?","options":["Dit voldoet niet; hij moet minimaal 1 meter voor het zeil onder water gaan.","Dit voldoet; het gaat er alleen om dat hij door het gat in het zeil zwemt.","Dit voldoet niet; hij moet direct na de sprong onder water blijven."],"answer":0,"explanation":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan; een halve meter is te weinig. Alleen door het gat zwemmen is dus niet genoeg. Direct na de sprong onder water blijven is niet vereist: bij C1 zwemt de kandidaat eerst enkele slagen. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"zeil C1: minimaal 1 m voor het zeil onder water","source":{"page":28,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."}},{"id":"NO-0048","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-24","NO-SURV-10"],"question":"Welke waterdiepte geldt bij de C1 proef Survival voor de proef als geheel en voor het onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen'?","options":["Proef: waar de kandidaat niet kan staan; zeil: minimaal 1,8 meter","Proef: minimaal 1,8 meter; zeil: waar de kandidaat niet kan staan","Proef en zeil: allebei minimaal 1,4 meter"],"answer":0,"explanation":"De C1 proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan; voor het zeil-onderdeel geldt een waterdiepte van minimaal 1,8 meter. De tweede optie draait dit om. 1,4 meter is de minimale lengte van het drijvend voorwerp, geen waterdiepte. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"zeil C1: waterdiepte minimaal 1,8 m","source":{"page":28,"quote":"Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0049","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-11"],"question":"Bij welke proef Survival staat in de normering uitdrukkelijk dat het te water gaan aan het begin van de proef zittend of staand mag worden uitgevoerd?","options":["Bij B1, het achterwaarts te water gaan","Bij A1, de voetsprong voorwaarts","Bij C1, de rol voorover"],"answer":0,"explanation":"Alleen bij het achterwaarts te water gaan van B1 staat dat dit zittend of staand mag worden uitgevoerd. De voetsprong voorwaarts van A1 is een sprong vanaf minimaal 30 centimeter. Voor de rol voorover van C1 noemt de normering een draai om de breedteas, niet zittend uitvoeren. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: zittend of staand","source":{"page":22,"quote":"Te water gaan mag zittend of staand worden uitgevoerd."}},{"id":"NO-0050","category":"normering","subtopic":"survival","type":"verschil","objectives":["NO-SURV-12","NO-SURV-15"],"question":"Wat is een verschil tussen het gekleed achterwaarts te water gaan (B1) en het gekleed met een rol voorover te water gaan (C1)?","options":["Bij B1 is er een valbeweging; bij C1 een draai om de breedteas.","Bij B1 is er een draai om de breedteas; bij C1 een valbeweging.","Bij B1 mag het vanaf een drijvend voorwerp; bij C1 alleen vanaf de kant."],"answer":0,"explanation":"Achterwaarts te water gaan (B1) is een valbeweging zonder zicht op de valrichting; de rol voorover (C1) is een draai om de breedteas. De tweede optie verwisselt dat. Beide onderdelen mogen vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd. §2.1.2–2.1.3, p. 22 en 27","ref":"§2.1.2–2.1.3, p. 22 en 27","tests":"B1 valbeweging vs C1 draai om de breedteas","source":{"page":27,"quote":"Er is sprake van een draai om de breedteas."}},{"id":"NO-0200","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-01"],"question":"Een zwembad heeft een diep gedeelte waar de kandidaten niet kunnen staan, maar dat minder dan 1,8 meter diep is. Mag de proef B2 Onder water oriëntatie daar worden afgenomen?","options":["Nee, de proef wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter.","Ja, de proef vereist alleen water waar de kandidaat niet kan staan.","Ja, alleen het zeil moet minimaal 1,8 bij 1,8 meter zijn."],"answer":0,"explanation":"De proef Onder water oriëntatie wordt bij A, B en C uitgevoerd in een waterdiepte van minimaal 1,8 meter. 'Tenminste waar de kandidaat niet kan staan' is de eis bij onder meer de proef Oriënteren boven water en verplaatsen, niet bij Onder water oriëntatie. De afmeting van het zeil is een aparte eis en vervangt de diepte-eis niet. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"Onder water oriëntatie: waterdiepte minimaal 1,8 meter","source":{"page":22,"quote":"De proef wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0201","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-02"],"question":"Een kandidaat voor Zwemdiploma A springt bij A2 vanuit staande positie voetwaarts van de bassinrand, gaat geheel onder water en zwemt zonder boven te komen door het gat in het zeil. Wat beslist de examinator over het te water gaan?","options":["Voldoende: duiken heeft de voorkeur, maar een sprong is toegestaan.","Onvoldoende: de handen moeten als eerste het wateroppervlak raken.","Onvoldoende: bij A2 moet de kandidaat vanaf het startblok duiken."],"answer":0,"explanation":"Bij A2 gaat de kandidaat te water met een sprong; duiken heeft de voorkeur, maar is niet verplicht. Dat de handen als eerste het wateroppervlak raken, is de normering van het duiken bij B2 en C2. Starten mag vanaf bassinrand of startblok, en duiken is bij A2 niet verplicht. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A2: sprong toegestaan, duiken heeft de voorkeur","source":{"page":18,"quote":"Duiken heeft de voorkeur. • Vanuit staande positie starten vanaf bassinrand of startblok."}},{"id":"NO-0202","category":"normering","subtopic":"onder_water","type":"onjuist","objectives":["NO-ONDW-03"],"question":"Welke bewering over het onderdeel 'van de kant in het water duiken' bij B2 is NIET juist?","options":["De kandidaat start vanuit staande positie vanaf bassinrand of startblok.","De handen raken als eerste het wateroppervlak, daarna de armen en het hoofd.","Duiken heeft de voorkeur, maar een sprong naar keuze is ook toegestaan."],"answer":2,"explanation":"Bij B2 is duiken verplicht: de proef begint met 'van de kant duiken'; 'duiken heeft de voorkeur' hoort bij de sprong van A2. De start vanuit staande positie vanaf bassinrand of startblok en de volgorde handen, armen, hoofd zijn wel de normering bij B2. §2.1.2, p. 22–23","ref":"§2.1.2, p. 22–23","tests":"B2/C2 duiken: staande start, handen eerst","source":{"page":22,"quote":"Van de kant duiken, direct gevolgd door (zonder boven te komen)"}},{"id":"NO-0203","category":"normering","subtopic":"onder_water","type":"verschil","objectives":["NO-ONDW-02","NO-ONDW-03"],"question":"Wat is een verschil in het te water gaan bij de proef Onder water oriëntatie tussen Zwemdiploma A en Zwemdiploma C?","options":["Bij A is een sprong toegestaan (duiken heeft de voorkeur), bij C moet de kandidaat duiken.","Bij A start de kandidaat vanaf de bassinrand, bij C vanaf het startblok.","Bij A gaat de kandidaat na de sprong geheel onder water, bij C hoeft dat na de duik niet."],"answer":0,"explanation":"Bij A2 gaat de kandidaat te water met een sprong, waarbij duiken de voorkeur heeft; bij C2 is het 'van de kant duiken'. Bij beide start de kandidaat vanuit staande positie vanaf bassinrand of startblok, en bij beide gaat de kandidaat daarna geheel onder water. §2.1.1 en 2.1.3, p. 18 en 29","ref":"§2.1.1 en 2.1.3, p. 18 en 29","tests":"te water gaan A2 (sprong) vs B2/C2 (duiken)","source":{"page":29,"quote":"Van de kant duiken, direct gevolgd door (zonder boven te komen)"}},{"id":"NO-0204","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-04"],"question":"Een kandidaat voor Zwemdiploma B duikt bij B2 van de kant, komt tussen de startkant en het zeil kort boven om adem te halen en zwemt daarna onder water door het gat in het zeil. Wat beslist de examinator?","options":["Onvoldoende: de kandidaat blijft tijdens het onder water zwemmen geheel onder water.","Voldoende: de manier waarop onder water wordt gezwommen is vrij.","Voldoende: alleen het zwemmen door het gat in het zeil wordt beoordeeld."],"answer":0,"explanation":"De duik wordt direct, zonder boven te komen, gevolgd door het onder water zwemmen, en de kandidaat blijft daarbij geheel onder water. De vrije zwemwijze gaat over hoe onder water wordt gezwommen, niet over bovenkomen. Ook het onder water zwemmen zelf is een beoordeeld onderdeel, niet alleen het zeil. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"onder water zwemmen: geheel onder water blijven","source":{"page":23,"quote":"De kandidaat blijft tijdens het onder water zwemmen geheel onder water."}},{"id":"NO-0205","category":"normering","subtopic":"onder_water","type":"onjuist","objectives":["NO-ONDW-05","NO-ONDW-04"],"question":"Welke bewering over het onder water zwemmen bij A2 is NIET juist?","options":["De kandidaat blijft tijdens het onder water zwemmen geheel onder water.","De manier waarop onder water wordt gezwommen is vrij.","De afstand van de sprong telt niet mee in de 3 meter onder water zwemmen."],"answer":2,"explanation":"De afstand die met springen of duiken wordt overbrugd, wordt juist in de totale afstand onder water zwemmen meegeteld. Dat de kandidaat geheel onder water blijft en dat de zwemwijze vrij is, zijn wel normen van A2. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"afstand sprong/duik telt mee in onder water zwemmen","source":{"page":18,"quote":"De afstand die wordt overbrugd met springen of duiken wordt in de totale afstand"}},{"id":"NO-0206","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-05"],"question":"Een kandidaat voor Zwemdiploma B maakt bij B2 een verre duik en hoeft daarna onder water nog maar een klein stuk te zwemmen tot hij door het gat in het zeil gaat. Hoe telt de afstand van de duik?","options":["De afstand van de duik wordt in de totale afstand meegeteld.","Na de duik moet nog de volle 6 meter onder water worden gezwommen.","De afstand van de duik telt alleen mee bij Zwemdiploma A."],"answer":0,"explanation":"Bij B2 wordt de afstand die met het duiken wordt overbrugd in de totale afstand van 6 meter onder water zwemmen meegeteld. Na de duik hoeft dus niet nog eens 6 meter te worden gezwommen. Het meetellen is ook geen regel die alleen voor A geldt. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"afstand sprong/duik telt mee in onder water zwemmen","source":{"page":23,"quote":"De afstand die wordt overbrugd met het duiken wordt in de totale afstand meegeteld."}},{"id":"NO-0207","category":"normering","subtopic":"onder_water","type":"onjuist","objectives":["NO-ONDW-06"],"question":"Welke bewering over de proef C2 Onder water oriëntatie is NIET juist?","options":["De kandidaat duikt van de kant en komt niet boven voor het zeil.","De afstand die met het duiken wordt overbrugd, telt mee in de totale afstand.","Na het zeil komt de kandidaat boven water op een plek naar keuze."],"answer":2,"explanation":"Bij C2 komt de kandidaat boven water in/op een vooraf afgesproken plek, zoals een hoepel, mat of afgebakend gebied: een soort wak. De plek is dus niet vrij. De duik zonder boven te komen en het meetellen van de duikafstand zijn wel juist. §2.1.3, p. 29","ref":"§2.1.3, p. 29","tests":"C2: bovenkomen in vooraf afgesproken plek (wak)","source":{"page":29,"quote":"De kandidaat komt boven water in/op een vooraf afgesproken plek (hoepel, mat, afgebakend"}},{"id":"NO-0208","category":"normering","subtopic":"onder_water","type":"verschil","objectives":["NO-ONDW-06","NO-ONDW-03"],"question":"Welk onderdeel van de proef Onder water oriëntatie komt bij Zwemdiploma C voor, maar niet bij Zwemdiploma B?","options":["Aansluitend boven water komen in een ‘wak’","Onder water zwemmen door een gat in een verticaal hangend zeil","Van de kant in het water duiken"],"answer":0,"explanation":"Alleen bij C2 volgt na het onder water zwemmen het boven water komen in een 'wak', een vooraf afgesproken plek. Het duiken van de kant en het zwemmen door het gat in het zeil zijn onderdelen van zowel B2 als C2. §2.1.2–2.1.3, p. 23 en 29","ref":"§2.1.2–2.1.3, p. 23 en 29","tests":"C2 extra onderdeel: bovenkomen in een wak","source":{"page":29,"quote":"6 meter onder water zwemmen en aansluitend boven water komen in een ‘wak’"}},{"id":"NO-0209","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-07"],"question":"Een kandidaat voor Zwemdiploma B rondt B6 af met voetwaarts richting de bodem zakken. Hij strekt de armen boven het hoofd, maar zakt maar zo ver dat zijn handen boven het wateroppervlak blijven. Wat beslist de examinator?","options":["Onvoldoende: de kandidaat gaat geheel onder water.","Voldoende: de armen zijn gestrekt boven het hoofd.","Voldoende: het hoofd is onder water geweest."],"answer":0,"explanation":"Bij voetwaarts richting de bodem zakken zijn de armen gestrekt boven het hoofd en blijven ze onder water ook gestrekt; de kandidaat gaat geheel onder water. Gestrekte armen alleen zijn dus niet genoeg, en alleen het hoofd onder water is niet 'geheel onder water'. §2.1.2, p. 26","ref":"§2.1.2, p. 26","tests":"voetwaarts zakken: geheel onder water, armen gestrekt","source":{"page":26,"quote":"Armen zijn gestrekt boven het hoofd en blijven onder water ook gestrekt. • De kandidaat gaat geheel onder water."}},{"id":"NO-0210","category":"normering","subtopic":"onder_water","type":"kennis","objectives":["NO-ONDW-08"],"question":"Welke waterdiepte noemt de normering bij A3 voor het onderdeel voetwaarts richting de bodem zakken?","options":["Minimaal 1,8 meter","Minimaal 1 meter","Tenminste waar de kandidaat niet kan staan"],"answer":0,"explanation":"Voetwaarts richting de bodem zakken wordt bij A3 uitgevoerd in een waterdiepte van minimaal 1,8 meter. 'Tenminste waar de kandidaat niet kan staan' is de eis voor onder meer A5 en A6. Een minimum van 1 meter wordt voor dit onderdeel niet genoemd. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"A3 voetwaarts zakken: minimaal 1,8 m waterdiepte","source":{"page":19,"quote":"Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0211","category":"normering","subtopic":"onder_water","type":"verschil","objectives":["NO-ONDW-07","NO-ONDW-08"],"question":"In welke proef komt voetwaarts richting de bodem zakken voor bij Zwemdiploma A en bij Zwemdiploma B?","options":["A: Conditiezwemmen; B: Oriënteren boven water en verplaatsen","A: Je vertrouwd voelen in het water; B: Conditiezwemmen","A: Oriënteren boven water en verplaatsen; B: Onder water oriëntatie"],"answer":0,"explanation":"Bij A onderbreekt voetwaarts richting de bodem zakken de t
