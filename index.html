want die kent het kind."],"answer":0,"explanation":"De Examinator selecteert alleen kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren; bij sterke twijfel doet het kind dus niet mee. De drie pogingen per onderdeel zijn geen reden om toch te selecteren. Kandidaten selecteren is een taak van de Examinator, niet van de lesgever. §3.1, p. 39","ref":"§3.1, p. 39","tests":"selectie: met grote zekerheid","source":{"page":39,"quote":"selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren"},"rev":2},{"id":"TV-0050","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-20"],"question":"Hoe ver van tevoren meldt de Examinator het diplomazwemmen minimaal aan?","options":["21 dagen","7 dagen","24 uur"],"answer":0,"explanation":"De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via 'Mijn NRZ'. 7 dagen is de termijn voor het verslag na afloop. Tot 24 uur voor het diplomazwemmen kan de Licentiehouder de aanvraag bekijken en wijzigen. §3.1, p. 39–41","ref":"§3.1, p. 39–41","tests":"aanvraag ten minste 21 dagen vooraf","source":{"page":39,"quote":"meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via www.nrz-nl.nl"},"rev":2},{"id":"TV-0051","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-20"],"question":"Een Examinator wil op 1 juni diplomazwemmen houden. Hij meldt het op 20 mei aan via 'Mijn NRZ'. Is hij op tijd?","options":["Nee, hij moet het ten minste 21 dagen van tevoren aanmelden.","Nee, hij moet het via de aangewezen medewerker aanmelden.","Ja, hij moet het ten minste 7 dagen van tevoren aanmelden."],"answer":0,"explanation":"Tussen 20 mei en 1 juni zitten maar 12 dagen. De Examinator moet het diplomazwemmen ten minste 21 dagen van tevoren aanmelden, via 'Mijn NRZ' op www.nrz-nl.nl, en niet via de aangewezen medewerker. 7 dagen is de termijn voor het verslag na afloop. §3.1, p. 39","ref":"§3.1, p. 39","tests":"aanvraag ten minste 21 dagen vooraf","source":{"page":39,"quote":"meldt het diplomazwemmen ten minste 21 dagen van tevoren aan"},"rev":2},{"id":"TV-0052","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-21"],"question":"De Examinator heeft het diplomazwemmen aangevraagd en de Nationale Raad Zwemveiligheid heeft akkoord gegeven. Wanneer is uiterlijk zichtbaar of er een gedelegeerde komt?","options":["24 uur voor het diplomazwemmen","7 dagen voor het diplomazwemmen","21 dagen voor het diplomazwemmen"],"answer":0,"explanation":"Na de aanvraag en het akkoord van de Nationale Raad Zwemveiligheid is uiterlijk 24 uur voor het diplomazwemmen zichtbaar of er een gedelegeerde komt. 21 dagen is de termijn voor het aanmelden. 7 dagen is de termijn voor het verslag na afloop. §3.1, p. 40","ref":"§3.1, p. 40","tests":"gedelegeerde uiterlijk 24 uur vooraf zichtbaar","source":{"page":40,"quote":"wordt uiterlijk 24 uur voorafgaande aan het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar"},"rev":2},{"id":"TV-0053","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-21","TV-EXA-20"],"question":"Aanvraag van het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan.\nStelling 2: Of er een gedelegeerde komt, is pas na het diplomazwemmen bekend.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan. Stelling 2 is onjuist: na akkoord is uiterlijk 24 uur voor het examen zichtbaar of er een gedelegeerde komt, dus niet pas achteraf. §3.1, p. 39–40","ref":"§3.1, p. 39–40","tests":"gedelegeerde uiterlijk 24 uur vooraf zichtbaar","source":{"page":40,"quote":"wordt uiterlijk 24 uur voorafgaande aan het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar"},"rev":2},{"id":"TV-0054","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-22"],"question":"Er is een gedelegeerde aanwezig bij het diplomazwemmen. Voor wie moet er dan een beoordelingslijst zijn?","options":["De Licentiehouder, de Examinator en de gedelegeerde","De Licentiehouder, de Examinator en de kandidaat","De Examinator, de gedelegeerde en de kandidaat"],"answer":0,"explanation":"Er moeten genoeg beoordelingslijsten zijn: één voor de Licentiehouder, één voor de Examinator en één voor de eventueel aanwezige medewerker en/of gedelegeerde. In de andere twee opties ontbreekt de gedelegeerde of de Licentiehouder. Een lijst voor de kandidaat noemt de Examenregeling niet. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voldoende beoordelingslijsten","source":{"page":40,"quote":"één voor de Licentiehouder, één voor de Examinator Nationale Zwemdiploma’s, één voor de eventueel aanwezige medewerker van de Nationale Raad Zwemveiligheid en/of gedelegeerde"},"rev":2},{"id":"TV-0055","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXT-04","TV-LIC-12"],"question":"Beoordelingslijsten bij het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De gedelegeerde gebruikt beoordelingslijsten die de examinator aanlevert.\nStelling 2: De ingevulde lijsten blijven bij de Licentiehouder.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Beide stellingen zijn juist. De gedelegeerde observeert de kandidaten met beoordelingslijsten die de examinator aanlevert. De ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder. §3.1–3.2, p. 40 en 42","ref":"§3.1–3.2, p. 40 en 42","tests":"beoordelingslijsten: wie levert aan, wie archiveert","source":{"page":42,"quote":"met behulp van beoordelingslijsten die worden aangeleverd door de examinator"},"rev":2},{"id":"TV-0056","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-23"],"question":"De Examinator maakt de zwemdiploma's gereed. Hij vult op elk diploma de datum van het diplomazwemmen in. Hij vult ook de naam van de kandidaat en de naam van het zwembad in. Is het diploma zo gereed?","options":["Nee, de geboortedatum van de kandidaat ontbreekt nog.","Nee, de naam van de Licentiehouder ontbreekt nog.","Ja, meer gegevens zijn niet nodig."],"answer":0,"explanation":"Op het zwemdiploma komen de datum van het diplomazwemmen, de naam en geboortedatum van de kandidaat en de naam van het zwembad. De geboortedatum ontbreekt dus nog. De naam van de Licentiehouder wordt bij het gereedmaken niet genoemd. §3.1, p. 40","ref":"§3.1, p. 40","tests":"gegevens op zwemdiploma","source":{"page":40,"quote":"het invullen van de naam en geboortedatum van de kandidaat, en de naam van het zwembad"},"rev":2},{"id":"TV-0057","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-32"],"question":"Wanneer krijgen geslaagde kandidaten hun zwemdiploma?","options":["Direct na afloop van het diplomazwemmen","Nadat het verslag is verstuurd","7 dagen na het diplomazwemmen"],"answer":0,"explanation":"Geslaagde kandidaten krijgen hun zwemdiploma direct na afloop van het diplomazwemmen. Ze wachten niet op het verslag, en 7 dagen is de termijn voor het verslag van de Examinator. Vooraf maakt de Examinator de zwemdiploma's gereed, met onder andere de naam en de geboortedatum van de kandidaat. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"diploma direct na afloop uitgereikt","source":{"page":41,"quote":"De geslaagde kandidaten ontvangen direct na afloop van het diplomazwemmen het behaalde zwemdiploma."},"rev":2},{"id":"TV-0058","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-24","TV-EXA-34"],"question":"Er is een gedelegeerde aanwezig bij het diplomazwemmen. Welke stelling is juist?\nStelling 1: De voorbespreking duurt langer dan het feedbackgesprek.\nStelling 2: Het feedbackgesprek duurt ongeveer 15 tot 20 minuten.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de voorbespreking duurt ongeveer 15 minuten, dus niet langer dan het feedbackgesprek. Stelling 2 is juist: het feedbackgesprek waarmee het diplomazwemmen wordt afgerond, duurt ongeveer 15 tot 20 minuten. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"duur voorbespreking 15 min vs feedbackgesprek 15-20 min","source":{"page":40,"quote":"een voorbespreking (ongeveer 15 minuten)"},"rev":2},{"id":"TV-0059","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-24"],"question":"Een dag voor het diplomazwemmen ziet de Examinator in 'Mijn NRZ' dat er een gedelegeerde komt. Wat moet er gebeuren vóór de start van het diplomazwemmen?","options":["De Examinator houdt een voorbespreking met de gedelegeerde.","De Examinator houdt een feedbackgesprek met de gedelegeerde.","De Licentiehouder houdt een voorbespreking met de gedelegeerde."],"answer":0,"explanation":"Als er een gedelegeerde aanwezig is, houdt de Examinator vóór de start een voorbespreking van ongeveer 15 minuten met de gedelegeerde. Het feedbackgesprek komt pas aan het einde van het diplomazwemmen. De voorbespreking is met de Examinator, niet met de Licentiehouder. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voorbespreking bij aanwezigheid gedelegeerde","source":{"page":40,"quote":"dient voor aanvang van het diplomazwemmen een voorbespreking (ongeveer 15 minuten) plaats te vinden"},"rev":2},{"id":"TV-0060","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-24","TV-EXA-26"],"question":"Voorbespreking met een gedelegeerde:\nWelke stelling is juist?\nStelling 1: De Examinator houdt de voorbespreking direct na het diplomazwemmen.\nStelling 2: De gedelegeerde wordt voor de start aan het publiek voorgesteld.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de voorbespreking is vóór de start van het diplomazwemmen; na afloop volgt het feedbackgesprek. Stelling 2 is juist: de gedelegeerde wordt aan het publiek voorgesteld voordat het diplomazwemmen van start gaat. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voorbespreking bij aanwezigheid gedelegeerde","source":{"page":40,"quote":"dient voor aanvang van het diplomazwemmen een voorbespreking (ongeveer 15 minuten) plaats te vinden"},"rev":2},{"id":"TV-0061","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-25"],"question":"Welk onderwerp hoort NIET bij de voorbespreking met de gedelegeerde?","options":["De volgorde van de verschillende onderdelen","De taken van organisatorisch betrokkenen","De manier waarop de gedelegeerde zijn rol heeft vervuld"],"answer":2,"explanation":"Hoe de gedelegeerde zijn of haar rol heeft vervuld, bespreken ze in het feedbackgesprek na afloop. In de voorbespreking komen onder andere de volgorde van het diplomazwemmen en van de onderdelen, de taken van organisatorisch betrokkenen en bijzonderheden bij kandidaten aan bod. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"onderwerpen voorbespreking","source":{"page":41,"quote":"Verder wordt besproken hoe de gedelegeerde zijn/haar rol heeft vervuld."},"rev":2},{"id":"TV-0062","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-26"],"question":"Wanneer wordt de gedelegeerde aan het publiek voorgesteld?","options":["Voordat het diplomazwemmen start","Bij het uitreiken van de zwemdiploma's","Na het feedbackgesprek"],"answer":0,"explanation":"De gedelegeerde wordt aan het publiek voorgesteld voordat het diplomazwemmen van start gaat. Bij het uitreiken van de zwemdiploma's krijgt hij bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek. Het feedbackgesprek is na afloop, tussen de Examinator en de gedelegeerde. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"gedelegeerde voorstellen vs enkele woorden","source":{"page":40,"quote":"wordt voorgesteld aan het publiek voordat het diplomazwemmen van start gaat"},"rev":2},{"id":"TV-0063","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-33"],"question":"De Examinator reikt de zwemdiploma's uit. Welke gelegenheid geeft hij de gedelegeerde dan bij voorkeur?","options":["Enkele woorden richten tot kandidaten en publiek","De uitslag van de kandidaten bepalen","De resultaten terugkoppelen naar de zwemlesaanbieder"],"answer":0,"explanation":"De Examinator biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek. De uitslag bepalen en de resultaten terugkoppelen naar de zwemlesaanbieder zijn taken van de Examinator zelf. §3.1, p. 38–41","ref":"§3.1, p. 38–41","tests":"gedelegeerde enkele woorden bij uitreiking","source":{"page":41,"quote":"biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek"},"rev":2},{"id":"TV-0064","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-27"],"question":"Wie zorgt tijdens het diplomazwemmen voor een goede routing en een goede begeleiding van de kandidaten?","options":["De Examinator","De gedelegeerde","De aangewezen medewerker"],"answer":0,"explanation":"Tijdens het diplomazwemmen zorgt de Examinator voor een goed lopend diplomazwemmen, zoals een goede routing en een adequate begeleiding van de kandidaten. Hij zorgt er ook voor dat de kandidaten aan de hand van de beoordelingslijsten worden beoordeeld. De gedelegeerde en de aangewezen medewerker houden namens de Nationale Raad Zwemveiligheid toezicht op de kwaliteit. §3.1, p. 38–41","ref":"§3.1, p. 38–41","tests":"goed lopend diplomazwemmen: routing en begeleiding","source":{"page":41,"quote":"zorg te dragen voor een goed lopend diplomazwemmen, zoals een goede routing en een adequate begeleiding"},"rev":2},{"id":"TV-0065","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-28"],"question":"Uitslag bij een zwemcertificaat:\nWelke onderdelen moet de kandidaat in ieder geval voldoende uitvoeren?","options":["De onderdelen uit het verplichte deel","Alle onderdelen van het examenprogramma","De onderdelen uit het open deel"],"answer":0,"explanation":"Voor het zwemcertificaat moet de kandidaat de onderdelen uit het verplichte deel voldoende uitvoeren. Van het open deel wordt bijgehouden welke onderdelen hij beheerst. Alle onderdelen voldoende is de eis voor het zwemdiploma. §3.1, p. 41","ref":"§3.1, p. 41","tests":"geslaagd: diploma alle onderdelen vs certificaat verplicht deel","source":{"page":41,"quote":"Voor het zwemcertificaat dienen de onderdelen uit het verplichte deel van het programma voldoende te worden uitgevoerd."},"rev":2},{"id":"TV-0066","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-29"],"question":"Het resultaat van de kandidaten staat op de beoordelingslijsten. Wat staat daar in ieder geval op?","options":["Welk onderdeel onvoldoende is uitgevoerd","Hoeveel pogingen de kandidaat nodig had","Welke onderdelen de gedelegeerde goedkeurde"],"answer":0,"explanation":"Op de beoordelingslijsten wordt in ieder geval aangegeven welk onderdeel de kandidaat onvoldoende heeft uitgevoerd. Het aantal pogingen hoeft er niet op. De gedelegeerde keurt geen onderdelen goed: de Examinator is eindverantwoordelijk voor het resultaat. §3.1, p. 41","ref":"§3.1, p. 41","tests":"beoordelingslijst: onvoldoende onderdeel aangeven","source":{"page":41,"quote":"Op deze lijsten wordt in ieder geval aangegeven welk onderdeel door de kandidaat onvoldoende is uitgevoerd."},"rev":2},{"id":"TV-0067","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-29"],"question":"Wie is eindverantwoordelijk voor het vaststellen van het resultaat van de kandidaten?","options":["De Examinator","De gedelegeerde","De Licentiehouder"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's is eindverantwoordelijk voor het vaststellen van het resultaat. Het resultaat wordt inzichtelijk gemaakt met beoordelingslijsten. De gedelegeerde en de Licentiehouder stellen het resultaat niet vast. §3.1, p. 41","ref":"§3.1, p. 41","tests":"Examinator eindverantwoordelijk voor resultaat","source":{"page":41,"quote":"is eindverantwoordelijk voor het vaststellen van het resultaat"},"rev":2},{"id":"TV-0068","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-32","TV-EXA-15"],"question":"De zwemdiploma's en zwemcertificaten zijn klaargemaakt. Wie ondertekent ze?","options":["De Examinator, of iemand namens hem","De gedelegeerde, of iemand namens hem","De medewerker van het werkgebied"],"answer":0,"explanation":"De klaargemaakte zwemdiploma's en zwemcertificaten worden ondertekend door of namens de Examinator Nationale Zwemdiploma's. De gedelegeerde krijgt bij voorkeur de gelegenheid om enkele woorden tot de kandidaten en het publiek te richten. De gedelegeerde en de medewerker worden bij het ondertekenen niet genoemd. §3.1, p. 41","ref":"§3.1, p. 41","tests":"ondertekening door of namens Examinator","source":{"page":41,"quote":"worden ondertekend door of namens de Examinator Nationale Zwemdiploma’s"},"rev":2},{"id":"TV-0069","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-34"],"question":"Wie voeren het feedbackgesprek na het diplomazwemmen?","options":["De Examinator en de gedelegeerde","De Licentiehouder en de ouders","De gedelegeerde en de kwaliteitsmanager"],"answer":0,"explanation":"Het feedbackgesprek is een gesprek tussen de Examinator en de gedelegeerde, soms aangevuld met de medewerkers die betrokken waren. Met het kind en de ouders gaat een ander gesprek over de reden van een afwijzing. De kwaliteitsmanager krijgt de verbeterafspraken uit een verbetertraject. §3.1, p. 41","ref":"§3.1, p. 41","tests":"deelnemers feedbackgesprek","source":{"page":41,"quote":"Dit is een gesprek tussen de Examinator Nationale Zwemdiploma’s en de gedelegeerde"},"rev":2},{"id":"TV-0070","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-35"],"question":"Feedbackgesprek na het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De uitgangspunten zijn wederzijds respect en professioneel handelen.\nStelling 2: De rol van de gedelegeerde wordt niet besproken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de uitgangspunten van het gesprek zijn wederzijds respect en professioneel handelen. Stelling 2 is onjuist: ze bespreken ook hoe de gedelegeerde zijn of haar rol heeft vervuld. §3.1, p. 41","ref":"§3.1, p. 41","tests":"inhoud feedbackgesprek","source":{"page":41,"quote":"Verder wordt besproken hoe de gedelegeerde zijn/haar rol heeft vervuld."},"rev":2},{"id":"TV-0071","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-36"],"question":"De Examinator maakt na afloop een verslag over de kwaliteit van het diplomazwemmen. Binnen welke termijn stuurt hij het naar de Nationale Raad Zwemveiligheid?","options":["Binnen 7 dagen","Binnen 24 uur","Binnen 21 dagen"],"answer":0,"explanation":"De Examinator stuurt zijn verslag binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid. 24 uur is de grens voor het wijzigen van de aanvraag vóór het diplomazwemmen. 21 dagen is de termijn voor het aanmelden. §3.1, p. 41","ref":"§3.1, p. 41","tests":"verslag Examinator binnen 7 dagen","source":{"page":41,"quote":"stuurt dit verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid"}},{"id":"TV-0072","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-36"],"question":"Bij een diplomazwemmen op zaterdag was geen gedelegeerde of medewerker aanwezig. Moet de Examinator toch een verslag maken?","options":["Ja, en hij stuurt het binnen 7 dagen in.","Ja, en hij stuurt het binnen 24 uur in.","Nee, een verslag is alleen nodig bij een gedelegeerde."],"answer":0,"explanation":"Na afloop maakt de Examinator een verslag over de kwaliteit van het diplomazwemmen, ook zonder gedelegeerde. Hij stuurt het binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid, dus niet binnen 24 uur. Alleen het aanvullende feedbackformulier hangt af van de aanwezigheid van een gedelegeerde of medewerker. §3.1, p. 41","ref":"§3.1, p. 41","tests":"verslag Examinator binnen 7 dagen","source":{"page":41,"quote":"Na afloop wordt door de Examinator Nationale Zwemdiploma’s verslag gemaakt over de kwaliteit van het betreffende diplomazwemmen."},"rev":2},{"id":"TV-0073","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-37","TV-EXA-36"],"question":"Wanneer vult de Examinator, naast zijn verslag, ook een aanvullend feedbackformulier in?","options":["Als er een gedelegeerde of medewerker was","Na elk diplomazwemmen","Als een kandidaat is afgewezen"],"answer":0,"explanation":"Na afloop maakt de Examinator altijd een verslag. Alleen als er een gedelegeerde of medewerker van de Nationale Raad Zwemveiligheid aanwezig was, vullen de Examinator en de gedelegeerde of medewerker ook een aanvullend feedbackformulier in. Een afgewezen kandidaat is daarvoor geen reden. §3.1, p. 41–42","ref":"§3.1, p. 41–42","tests":"verslag vs aanvullend feedbackformulier","source":{"page":41,"quote":"Bij de aanwezigheid van een gedelegeerde of medewerker van de Nationale Raad Zwemveiligheid tijdens het examen, vullen zowel de Examinator Nationale Zwemdiploma’s als de gedelegeerde"},"rev":2},{"id":"TV-0074","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-37"],"question":"Er was een gedelegeerde aanwezig bij het diplomazwemmen. Wat vullen de Examinator en de gedelegeerde na afloop allebei in?","options":["Een aanvullend feedbackformulier","Een gezamenlijke beoordelingslijst","Een formulier voor een klacht"],"answer":0,"explanation":"Bij aanwezigheid van een gedelegeerde of medewerker vullen de Examinator en de gedelegeerde of medewerker allebei een aanvullend feedbackformulier in. Dat wordt binnen 7 dagen verzonden. Beoordelingslijsten zijn er voor ieder apart, en een klacht gaat over het gedrag van een medewerker of vrijwilliger. §3.1, p. 42","ref":"§3.1, p. 42","tests":"aanvullend feedbackformulier Examinator en gedelegeerde","source":{"page":42,"quote":"vullen zowel de Examinator Nationale Zwemdiploma’s als de gedelegeerde of medewerker van de Nationale Raad Zwemveiligheid een aanvullend feedbackformulier in"},"rev":2},{"id":"TV-0075","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXT-06"],"question":"Verslag van de gedelegeerde:\nWelke stelling is juist?\nStelling 1: De gedelegeerde stuurt zijn verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid.\nStelling 2: De Licentiehouder kan het verslag van de gedelegeerde inzien.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Beide stellingen zijn juist. De gedelegeerde stuurt zijn verslag binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid. De Licentiehouder, de gedelegeerde en de aangewezen medewerker kunnen dit verslag inzien. §3.1–3.2, p. 42","ref":"§3.1–3.2, p. 42","tests":"inzage verslag gedelegeerde","source":{"page":42,"quote":"Dit verslag is in te zien door de Licentiehouder, de gedelegeerde en de daartoe aangewezen medewerker"},"rev":2},{"id":"TV-0076","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXT-06","TV-EXA-36"],"question":"Verslagen na het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De Examinator stuurt zijn verslag binnen 7 dagen in.\nStelling 2: De gedelegeerde stuurt zijn verslag binnen 24 uur in.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de Examinator stuurt zijn verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid. Stelling 2 is onjuist: ook de gedelegeerde stuurt zijn verslag binnen 7 dagen, niet binnen 24 uur. §3.1–3.2, p. 41–42","ref":"§3.1–3.2, p. 41–42","tests":"verslag Examinator binnen 7 dagen","source":{"page":42,"quote":"De gedelegeerde stuurt het verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid"},"rev":2},{"id":"TV-0077","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-38"],"question":"Wat hoort NIET bij de vaardigheden van de Examinator Nationale Zwemdiploma's?","options":["Tegenstellingen en conflicten onderkennen","Objectief oordelen op basis van geobserveerde vaardigheden","De Licentie tijdelijk intrekken"],"answer":2,"explanation":"Het (tijdelijk) intrekken van de Licentie is een besluit van de directeur, geen vaardigheid van de Examinator. Het onderkennen van tegenstellingen en conflicten en objectief oordelen op basis van geobserveerde vaardigheden staan wel in de lijst van vaardigheden. Handleiding, p. 3","ref":"Handleiding, p. 3","tests":"vaardigheden Examinator (handleiding)","source":{"doc":"handleiding","page":3,"quote":"Objectief oordelen op basis van geobserveerde vaardigheden."},"rev":2},{"id":"TV-0078","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-01"],"question":"Waaruit bestaat de externe kwaliteitsborging van het diplomazwemmen?","options":["Toezicht op de kwaliteit van het diplomazwemmen","De organisatie van het diplomazwemmen","Het selecteren van de kandidaten"],"answer":0,"explanation":"De externe kwaliteitsborging bestaat uit toezicht op de kwaliteit van het diplomazwemmen, door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid. De organisatie van het diplomazwemmen hoort bij de interne kwaliteit, waarvoor de Licentiehouder verantwoordelijk is. Kandidaten selecteren is een taak van de Examinator. §3, p. 37","ref":"§3, p. 37","tests":"externe kwaliteitsborging: toezicht","source":{"page":37,"quote":"De externe kwaliteitsborging bestaat uit het toezicht op de kwaliteit van het diplomazwemmen."},"rev":2},{"id":"TV-0079","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-02"],"question":"De Nationale Raad Zwemveiligheid laat het diplomazwemmen bezoeken. Door wie?","options":["Periodiek door gedelegeerden, en aanvullend door aangewezen medewerkers","Periodiek door aangewezen medewerkers, en aanvullend door gedelegeerden","Alleen door gedelegeerden, en op verzoek van de Licentiehouder"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid zorgt ervoor dat het diplomazwemmen periodiek wordt bezocht door gedelegeerden en aanvullend door daartoe aangewezen medewerkers. Het is dus niet andersom. De bezoeken zijn niet alleen op verzoek van de Licentiehouder. §3.2, p. 42","ref":"§3.2, p. 42","tests":"periodiek bezoek gedelegeerden, aanvullend medewerkers","source":{"page":42,"quote":"periodiek wordt bezocht door gedelegeerden en aanvullend door daartoe aangewezen medewerkers"},"rev":2},{"id":"TV-0080","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXT-11","TV-EXT-03","TV-EXT-04"],"question":"Rol van de gedelegeerde:\nWelke stelling is juist?\nStelling 1: De gedelegeerde kan corrigerend handelen als hij dat nodig vindt.\nStelling 2: De gedelegeerde observeert ook de examinator en de organisatie.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: corrigerend handelen kan de medewerker van de Nationale Raad Zwemveiligheid, niet de gedelegeerde. Stelling 2 is juist: de gedelegeerde observeert de kandidaten, de examinator en de organisatie van het diplomazwemmen. §3.2, p. 42–43","ref":"§3.2, p. 42–43","tests":"medewerker kan corrigerend handelen","source":{"page":43,"quote":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."},"rev":2},{"id":"TV-0081","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-04"],"question":"Met welke beoordelingslijsten observeert de gedelegeerde de kandidaten?","options":["Met lijsten die de examinator aanlevert","Met lijsten die de aangewezen medewerker aanlevert","Met lijsten die de gedelegeerde zelf meeneemt"],"answer":0,"explanation":"De gedelegeerde observeert de kandidaten met beoordelingslijsten die de examinator aanlevert. Daarom moet er ook een lijst voor de gedelegeerde zijn. De lijsten komen dus niet van de aangewezen medewerker, en de gedelegeerde neemt geen eigen lijsten mee. §3.2, p. 42","ref":"§3.2, p. 42","tests":"gedelegeerde gebruikt lijsten van examinator","source":{"page":42,"quote":"met behulp van beoordelingslijsten die worden aangeleverd door de examinator"},"rev":2},{"id":"TV-0082","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-05"],"question":"Een gedelegeerde vindt op grond van eigen bevindingen dat meerdere kandidaten niet aan de normering voldoen. De Examinator wil hen toch laten slagen. Wat doet de gedelegeerde?","options":["Hij stelt het vóór de uitslagbepaling kort aan de orde.","Hij bepaalt zelf de uitslag van deze kandidaten.","Hij meldt het alleen achteraf in zijn verslag."],"answer":0,"explanation":"Vindt de gedelegeerde dat diploma's ten onrechte worden uitgereikt, dan stelt hij dit vóór de uitslagbepaling kort aan de orde. In het feedbackgesprek na afloop licht hij zijn onderbouwing toe. De uitslag bepaalt hij niet zelf, en wachten tot het verslag past niet bij deze regel. §3.2, p. 42","ref":"§3.2, p. 42","tests":"gedelegeerde: ten onrechte uitgereikt, vóór uitslagbepaling aan de orde","source":{"page":42,"quote":"stelt hij dit vóór de uitslagbepaling kort aan de orde"},"rev":2},{"id":"TV-0083","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-08"],"question":"Wat doet de aangewezen medewerker van de Nationale Raad Zwemveiligheid, naast het bezoeken van het diplomazwemmen?","options":["De verslagformulieren beoordelen en de aanvragen controleren","De kandidaten selecteren en de zwemdiploma's gereed maken","De Examinator aanstellen en de lijsten archiveren"],"answer":0,"explanation":"De medewerker beoordeelt de verslagformulieren van de Examinator en de gedelegeerden, en controleert in de systemen de aanvragen van het diplomazwemmen. Kandidaten selecteren en zwemdiploma's gereed maken doet de Examinator. De Examinator aanstellen en de lijsten archiveren hoort bij de Licentiehouder. §3.2, p. 42","ref":"§3.2, p. 42","tests":"medewerker: verslagformulieren beoordelen, aanvragen controleren","source":{"page":42,"quote":"Daarnaast controleert de medewerker in de systemen de aanvragen van het diplomazwemmen."},"rev":2},{"id":"TV-0084","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-09"],"question":"Tijdens een diplomazwemmen komt er een aangewezen medewerker van de Nationale Raad Zwemveiligheid. Het bezoek is onaangekondigd. Wat doet de Examinator?","options":["Hij laat hem toe, want een onaangekondigd bezoek mag.","Hij laat hem niet toe, want het bezoek is onaangekondigd.","Hij laat hem alleen toekijken, want het bezoek is onaangekondigd."],"answer":0,"explanation":"De medewerker bezoekt het diplomazwemmen steekproefsgewijs, zowel aangekondigd als onaangekondigd. De Examinator ontvangt hem dus gewoon. Ook bij een onaangekondigd bezoek heeft de medewerker tijdens het diplomazwemmen dezelfde rol en taken als de gedelegeerde. §3.2, p. 42–43","ref":"§3.2, p. 42–43","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"zowel aangekondigd als onaangekondigd, het diplomazwemmen"},"rev":2},{"id":"TV-0085","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXT-09","TV-EXT-08"],"question":"Aangewezen medewerker van de Nationale Raad Zwemveiligheid:\nWelke stelling is juist?\nStelling 1: De medewerker controleert in de systemen de aanvragen van het diplomazwemmen.\nStelling 2: De medewerker bezoekt het diplomazwemmen ook onaangekondigd.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Beide stellingen zijn juist. De medewerker controleert in de systemen de aanvragen van het diplomazwemmen. Hij bezoekt het diplomazwemmen ook steekproefsgewijs, zowel aangekondigd als onaangekondigd. §3.2, p. 42","ref":"§3.2, p. 42","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"De medewerker bezoekt ook steekproefsgewijs, zowel aangekondigd als onaangekondigd, het diplomazwemmen."},"rev":2},{"id":"TV-0086","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"verschil","objectives":["TV-EXT-10"],"question":"Wat kan een aangewezen medewerker tijdens het diplomazwemmen wel, maar een gedelegeerde niet?","options":["Directe invloed hebben op de uitslagbepaling","Kandidaten observeren met lijsten van de examinator","Na afloop een verslag maken"],"answer":0,"explanation":"De medewerker heeft dezelfde rol en taken als de gedelegeerde. Daarnaast kan hij bezwaar maken tegen de organisatie en het functioneren van de Examinator, en heeft hij directe invloed op de uitslagbepaling. Observeren met de lijsten van de examinator en een verslag maken doen ze allebei. §3.2, p. 43","ref":"§3.2, p. 43","tests":"medewerker: bezwaar en directe invloed op uitslagbepaling","source":{"page":43,"quote":"heeft de medewerker directe invloed op de uitslagbepaling van het diplomazwemmen"},"rev":2},{"id":"TV-0087","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXT-10","TV-EXT-05"],"question":"Invloed op de uitslag van het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De gedelegeerde heeft directe invloed op de uitslagbepaling.\nStelling 2: De medewerker van de Nationale Raad Zwemveiligheid heeft directe invloed op de uitslagbepaling.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de gedelegeerde kan vóór de uitslagbepaling alleen kort aan de orde stellen dat diploma's ten onrechte worden uitgereikt. Stelling 2 is juist: de medewerker heeft directe invloed op de uitslagbepaling. §3.2, p. 42–43","ref":"§3.2, p. 42–43","tests":"medewerker: bezwaar en directe invloed op uitslagbepaling","source":{"page":43,"quote":"heeft de medewerker directe invloed op de uitslagbepaling van het diplomazwemmen"},"rev":2},{"id":"TV-0088","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-11","TV-EXT-10"],"question":"Een aangewezen medewerker van de Nationale Raad Zwemveiligheid is bij een diplomazwemmen. De organisatie is niet goed. Daardoor voeren kandidaten onderdelen niet volgens de Examenregeling uit. Wat mag de medewerker doen?","options":["Hij mag corrigerend handelen als hij dat nodig vindt.","Hij mag alleen observeren en het achteraf melden.","Hij mag de Licentie ter plekke intrekken."],"answer":0,"explanation":"De medewerker kan corrigerend handelen wanneer hij dat nodig vindt, en kan bezwaar maken tegen de organisatie van het diplomazwemmen. Hij hoeft dus niet alleen te observeren. Het (tijdelijk) intrekken van de Licentie is een besluit van de directeur. §3.2, p. 43","ref":"§3.2, p. 43","tests":"medewerker kan corrigerend handelen","source":{"page":43,"quote":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."},"rev":2},{"id":"TV-0089","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-12"],"question":"Aangewezen medewerkers maken met Licentiehouders afspraken in een verbetertraject. Waarop baseren zij die afspraken?","options":["De verslaglegging en/of hun eigen bevindingen","Een schriftelijke klacht over een medewerker","Een besluit van de directeur"],"answer":0,"explanation":"Aangewezen medewerkers maken verbeterafspraken op grond van de verslaglegging van de gedelegeerde en de Examinator en/of hun eigen bevindingen. Een schriftelijke klacht valt onder het klachtenreglement. Een besluit van de directeur tot intrekken komt pas als de verbetering uitblijft. §3.2, p. 43","ref":"§3.2, p. 43","tests":"grondslag verbetertraject","source":{"page":43,"quote":"op grond van de verslaglegging van de gedelegeerde en de Examinator Nationale Zwemdiploma’s en/of hun eigen bevindingen"},"rev":2},{"id":"TV-0090","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-12"],"question":"Met wie maken aangewezen medewerkers afspraken in een verbetertraject?","options":["Met de Licentiehouders","Met de ouders/verzorgers","Met de gedelegeerden"],"answer":0,"explanation":"In een verbetertraject maken aangewezen medewerkers afspraken met de Licentiehouders. De afspraken gaan over het resultaat van het diplomazwemmen, het functioneren van de Examinator of de organisatorische/administratieve gang van zaken. Ze worden niet met ouders/verzorgers of gedelegeerden gemaakt. §3.2, p. 43","ref":"§3.2, p. 43","tests":"verbetertraject: afspraken medewerker met Licentiehouder","source":{"page":43,"quote":"met de Licentiehouders afspraken maken over verbetering van het resultaat van het diplomazwemmen"},"rev":2},{"id":"TV-0091","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-13"],"question":"Verbetertraject:\nDe verbeterafspraken worden schriftelijk of per e-mail vastgelegd. Met wie delen de medewerkers deze afspraken?","options":["Met de kwaliteitsmanager","Met de gedelegeerde","Met de directeur"],"answer":0,"explanation":"De medewerkers delen de verbeterafspraken met de kwaliteitsmanager van de Nationale Raad Zwemveiligheid. De Examenregeling noemt hier alleen de kwaliteitsmanager, niet de gedelegeerde of de directeur. De directeur komt pas in beeld bij het intrekken van de Licentie. §3.2, p. 43","ref":"§3.2, p. 43","tests":"verbeterafspraken schriftelijk, gedeeld met kwaliteitsmanager","source":{"page":43,"quote":"Deze afspraken worden door de medewerkers gedeeld met de kwaliteitsmanager"},"rev":2},{"id":"TV-0092","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-14"],"question":"Wat kan bij een verbetertraject horen?","options":["Een extra (onaangekondigde) controle","Een gedelegeerde als tijdelijke Examinator","Een overdracht van de archiefplicht"],"answer":0,"explanation":"Een verbetertraject kan een extra (onaangekondigde) controle op het diplomazwemmen bevatten, door een gedelegeerde of een medewerker. Een gedelegeerde observeert, bespreekt en rapporteert; hij neemt de rol van Examinator niet over. De archiefplicht voor de beoordelingslijsten blijft bij de Licentiehouder. §3.2, p. 43","ref":"§3.2, p. 43","tests":"extra onaangekondigde controle in verbetertraject","source":{"page":43,"quote":"Onderdeel van het verbetertraject kan een extra (onaangekondigde) controle op het diplomazwemmen zijn."},"rev":2},{"id":"TV-0093","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-15"],"question":"De directeur besluit de Licentie (tijdelijk) in te trekken. Hoe hoort de Licentiehouder van dit besluit?","options":["Schriftelijk","Mondeling","Via www.allesoverzwemles.nl"],"answer":0,"explanation":"Het besluit tot het (tijdelijk) intrekken van de Licentie wordt schriftelijk met de Licentiehouder gecommuniceerd. Mondeling is dus niet genoeg. Op www.allesoverzwemles.nl staat een actueel overzicht van alle Licentiehouders. §3.2, p. 43","ref":"§3.2, p. 43","tests":"intrekken Licentie schriftelijk gecommuniceerd","source":{"page":43,"quote":"Dit besluit wordt schriftelijk met de Licentiehouder gecommuniceerd."},"rev":2},{"id":"TV-0094","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-16"],"question":"Een Licentiehouder krijgt een kritisch verslag. Hij vraagt zelf om extra controlemomenten bij het diplomazwemmen. Kan dat?","options":["Ja, hij kan daarover afspraken maken met de aangewezen medewerker.","Ja, hij kan daarover afspraken maken met de gedelegeerde.","Nee, dat kan alleen na een besluit van de directeur."],"answer":0,"explanation":"Op verzoek van de Licentiehouder zelf kunnen er afspraken met de medewerker worden gemaakt over een verbetertraject en/of extra controlemomenten. Die afspraken zijn met de medewerker, niet met de gedelegeerde. De directeur komt pas in beeld bij het intrekken van de Licentie. §3.2, p. 43","ref":"§3.2, p. 43","tests":"verbetertraject op eigen verzoek Licentiehouder","source":{"page":43,"quote":"op verzoek van de Licentiehouder zelf afspraken te maken met de medewerker over een verbetertraject"},"rev":2},{"id":"TV-0095","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-17"],"question":"Iemand is ontevreden over het gedrag van een medewerker van de Nationale Raad Zwemveiligheid. Hoe kan hij een klacht indienen?","options":["Schriftelijk, volgens het klachtenreglement","Mondeling, in het feedbackgesprek","Via het aanvullende feedbackformulier"],"answer":0,"explanation":"Bij onvrede over het gedrag of handelen van een medewerker of vrijwilliger van/namens de Nationale Raad Zwemveiligheid kan een klacht schriftelijk worden ingediend. Het klachtenreglement is dan van toepassing. Het feedbackgesprek en het feedbackformulier gaan over de kwaliteit van het diplomazwemmen. §3.2, p. 43","ref":"§3.2, p. 43","tests":"klacht schriftelijk, klachtenreglement","source":{"page":43,"quote":"kan een klacht schriftelijk worden ingediend"},"rev":2},{"id":"AB-0120","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-10"],"question":"Voor welk niveau zijn naast vaardigheden ook specifieke kennis en voldoende kracht en uithoudingsvermogen nodig?","options":["Niveau vier","Niveau drie","Niveau twee"],"answer":0,"explanation":"Dit geldt voor niveau vier: open water met stroming/zee. Niveau twee (Zwemdiploma B) gaat over een zwembad met attracties en niveau drie (Zwemdiploma C) over zwembaden met attracties en open water zonder stroming; voor die niveaus noemt de tekst deze extra eisen niet. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"niveau vier: naast vaardigheden ook kennis, kracht en uithoudingsvermogen nodig","source":{"page":4,"quote":"Voor niveau vier (open water met stroming/zee) zijn de omstandigheden zeer specifiek en in hoge mate onvoorspelbaar. Dit is niet of nauwelijks te oefenen in een zwembad. Naast vaardigheden zijn ook specifieke kennis en voldoende kracht en uithoudingsvermogen nodig."}},{"id":"AB-0121","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-11"],"question":"Een zwemlesaanbieder plant het diplomazwemmen. Welke stelling is juist?\nStelling 1: Hij mag op een dag meerdere blokken diplomazwemmen aanvragen.\nStelling 2: Een blok diplomazwemmen duurt bij voorkeur niet langer dan 2,5 uur.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de zwemlesaanbieder mag op een dag meerdere blokken diplomazwemmen organiseren en aanvragen. Stelling 2 is ook juist: het totale blok diplomazwemmen duurt bij voorkeur niet langer dan 2,5 uur. §2.3, p. 35-36","ref":"§2.3, p. 35-36","tests":"meerdere blokken diplomazwemmen per dag toegestaan","source":{"page":36,"quote":"De zwemlesaanbieder mag op een dag meerdere blokken diplomazwemmen organiseren en aanvragen."}},{"id":"EP-0455","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-09"],"question":"Zwemcertificaat A, open deel (in badkleding):\nWelke stelling is juist?\nStelling 1: De kandidaat zwemt schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl.\nStelling 2: De kandidaat zwemt 50 meter met een zwemslag naar keuze.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: het open deel bevat 25 meter schoolslag, 25 meter enkelvoudige rugslag, 5 meter borstcrawl en 5 meter rugcrawl. Stelling 2 is onjuist: 50 meter met een zwemslag naar keuze hoort bij het verplicht deel. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"Zwemcertificaat A open deel: vier zwemslagen, geen zwemslag naar keuze","source":{"page":13,"quote":"25 meter schoolslag 25 meter enkelvoudige rugslag 5 meter borstcrawl 5 meter rugcrawl"}},{"id":"TV-0096","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-03"],"question":"Een Licentiehouder heeft één Examinator Nationale Zwemdiploma's. De Licentiehouder wil er een tweede Examinator bij. Mag dat?","options":["Ja, dan is niet steeds dezelfde persoon verantwoordelijk.","Ja, dan zijn per aanvraag beide Examinatoren eindverantwoordelijk.","Nee, een Licentiehouder mag maar één Examinator hebben."],"answer":0,"explanation":"Een Licentiehouder mag over meerdere Examinatoren beschikken. Zo is niet steeds dezelfde persoon verantwoordelijk voor het hele proces van diplomazwemmen. Toch is per aanvraag van diplomazwemmen maar één examinator (eind)verantwoordelijk. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Licentiehouder mag meerdere Examinatoren hebben (niet steeds dezelfde persoon)","source":{"page":38,"quote":"zodat niet steeds dezelfde persoon verantwoordelijk is voor het hele proces van diplomazwemmen"}},{"id":"TV-0097","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-12"],"question":"Rol van de Examinator Nationale Zwemdiploma's:\nWelke stelling is juist?\nStelling 1: Hij mag zijn aanwezigheid bij het diplomazwemmen delegeren.\nStelling 2: Hij zorgt ervoor dat de kandidaten met de beoordelingslijsten worden beoordeeld.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: zijn aanwezigheid bij het diplomazwemmen is het enige dat de Examinator niet mag delegeren. Stelling 2 is juist: hij zorgt ervoor dat de kandidaten aan de hand van de beoordelingslijsten worden beoordeeld, volgens de Examenregeling. §3.1, p. 38-39","ref":"§3.1, p. 38-39","tests":"Examinator zorgt voor beoordeling met beoordelingslijsten conform Examenregeling","source":{"page":39,"quote":"zorgt ervoor dat de kandidaten aan de hand van de beoordelingslijsten conform de Examenregeling Nationale Zwemdiploma's worden beoordeeld."}}]}</script>
<script type="application/json" id="glossary">[{"id":"bewering","term":"bewering","kind":"examentaal","forms":["bewering","beweringen"],"uitleg":"Een zin die iets zegt wat waar of niet waar kan zijn. ‘Welke bewering is juist?’ betekent: welke zin is waar?"},{"id":"stelling","term":"stelling","kind":"examentaal","forms":["stelling","stellingen"],"uitleg":"Een zin die waar of niet waar kan zijn, net als een bewering. Bij ‘Welke stelling is juist?’ lees je Stelling 1 en Stelling 2. Dan kies je: ‘Alleen stelling 1 is juist’, ‘Alleen stelling 2 is juist’ of ‘Beide stellingen zijn juist’ (allebei waar)."},{"id":"juist","term":"juist","kind":"examentaal","forms":["juist","juiste"],"uitleg":"Goed, correct, waar. ‘NIET juist’ betekent: fout, niet waar. Let op: bij zo’n vraag zoek je het antwoord dat níet klopt. ‘Juist’ kan ook ‘precies’ of ‘eigenlijk’ betekenen: ‘dat is juist de oude manier’ betekent: dat is precies de oude manier."},{"id":"onjuist","term":"onjuist","kind":"examentaal","forms":["onjuist","onjuiste"],"uitleg":"Niet juist; fout, niet waar. ‘Stelling 2 is onjuist’ betekent: stelling 2 klopt niet."},{"id":"kloppen","term":"kloppen","kind":"examentaal","forms":["klopt","kloppen","klopte"],"uitleg":"Waar zijn, correct zijn. ‘Wat klopt?’ betekent: wat is waar?"},{"id":"beslissen","term":"beslissen","kind":"examentaal","forms":["beslist","beslissen","besluit","besluiten","beslisser"],"uitleg":"Kiezen wat er gebeurt. ‘Wat beslist de examinator?’ betekent: wat kiest de examinator, bijvoorbeeld voldoende of onvoldoende? Een besluit is zo’n keuze. De beslisser is degene die kiest. Let op: ‘niet beslist noodzakelijk’ betekent: niet echt nodig; het hoeft niet."},{"id":"toegestaan","term":"toegestaan","kind":"examentaal","forms":["toegestaan","toegestane"],"uitleg":"Het mag. ‘Niet toegestaan’ betekent: het mag niet."},{"id":"verplicht","term":"verplicht","kind":"examentaal","forms":["verplicht","verplichte"],"uitleg":"Het moet. Je mag het niet overslaan."},{"id":"vereist","term":"vereist","kind":"examentaal","forms":["vereist","vereiste","vereisten","geëist"],"uitleg":"Nodig; het moet er zijn. Vereist betekent bijna hetzelfde als verplicht. Vereisten zijn de dingen die nodig zijn."},{"id":"voorgeschreven","term":"voorgeschreven","kind":"examentaal","forms":["voorgeschreven"],"uitleg":"Door de regels gevraagd. Iets is voorgeschreven als de regels zeggen dat het zo moet."},{"id":"voldoende","term":"voldoende","kind":"examentaal","forms":["voldoende"],"uitleg":"Genoeg; goed genoeg. Bij een examen: het onderdeel is goed genoeg gedaan."},{"id":"onvoldoende","term":"onvoldoende","kind":"examentaal","forms":["onvoldoende"],"uitleg":"Niet genoeg; niet goed genoeg. Bij een examen: het onderdeel is niet goed genoeg gedaan."},{"id":"voldoen","term":"voldoen (aan)","kind":"examentaal","forms":["voldoet","voldoen","voldaan","voldeed"],"uitleg":"Doen of zijn wat gevraagd wordt. ‘Aan de normering voldoen’ betekent: goed genoeg zijn volgens de regels."},{"id":"minimaal","term":"minimaal","kind":"examentaal","forms":["minimaal","minimale","minimum"],"uitleg":"Minstens; niet minder dan. ‘Minimaal 1,8 meter’ betekent: 1,8 meter of meer. Let op: ‘zo minimaal mogelijk’ betekent: zo weinig mogelijk."},{"id":"maximaal","term":"maximaal","kind":"examentaal","forms":["maximaal","maximale","maximum"],"uitleg":"Hoogstens; niet meer dan. ‘Maximaal 3 keer’ betekent: 3 keer of minder."},{"id":"ten-minste","term":"ten minste","kind":"examentaal","forms":["ten minste","tenminste","op zijn minst"],"uitleg":"Minstens; niet minder dan. Het betekent hetzelfde als minimaal."},{"id":"ten-hoogste","term":"ten hoogste","kind":"examentaal","forms":["ten hoogste","hoogstens"],"uitleg":"Niet meer dan. Het betekent hetzelfde als maximaal."},{"id":"bij-voorkeur","term":"bij voorkeur","kind":"examentaal","forms":["bij voorkeur"],"uitleg":"Het liefst. Zo is het het beste, maar het hoeft niet altijd zo."},{"id":"voorkeur","term":"de voorkeur hebben","kind":"examentaal","forms":["voorkeur","voorkeursuitvoering"],"uitleg":"Iets heeft de voorkeur als het het liefst gekozen wordt. ‘Duiken heeft de voorkeur’ betekent: duiken is het liefst, maar iets anders mag ook. Een voorkeursuitvoering is de manier van uitvoeren die het liefst gezien wordt."},{"id":"mits","term":"mits","kind":"examentaal","forms":["mits"],"uitleg":"Alleen als; op voorwaarde dat. ‘Het mag, mits het hoofd boven water blijft’ betekent: het mag alleen als het hoofd boven water blijft."},{"id":"indien","term":"indien","kind":"examentaal","forms":["indien"],"uitleg":"Als; in het geval dat. ‘Indien nodig’ betekent: als het nodig is."},{"id":"eventueel","term":"eventueel","kind":"examentaal","forms":["eventueel","eventuele"],"uitleg":"Misschien; als het er is of als het nodig is. ‘Een eventueel aanwezige medewerker’ betekent: een medewerker, als die er is."},{"id":"uitsluitend","term":"uitsluitend","kind":"examentaal","forms":["uitsluitend"],"uitleg":"Alleen; niets anders."},{"id":"slechts","term":"slechts","kind":"examentaal","forms":["slechts"],"uitleg":"Alleen maar; niet meer dan."},{"id":"uitdrukkelijk","term":"uitdrukkelijk","kind":"examentaal","forms":["uitdrukkelijk"],"uitleg":"Duidelijk en letterlijk gezegd of opgeschreven. ‘Een uitdrukkelijk genoemde mogelijkheid’ betekent: die mogelijkheid staat er letterlijk."},{"id":"respectievelijk","term":"respectievelijk","kind":"examentaal","forms":["respectievelijk"],"uitleg":"In dezelfde volgorde. ‘Bij A, B en C is het respectievelijk 5, 10 en 15 meter’ betekent: bij A 5 meter, bij B 10 meter en bij C 15 meter."},{"id":"gelijktijdig","term":"gelijktijdig","kind":"examentaal","forms":["gelijktijdig","tegelijkertijd"],"uitleg":"Op hetzelfde moment; tegelijk."},{"id":"afwisselend","term":"afwisselend","kind":"examentaal","forms":["afwisselend","afgewisseld","afwisseling","afwisselende","afwisselen"],"uitleg":"Om de beurt: eerst het een, dan het ander. Benen die afwisselend bewegen: eerst het ene been, dan het andere."},{"id":"aansluitend","term":"aansluitend","kind":"examentaal","forms":["aansluitend"],"uitleg":"Direct daarna, zonder pauze."},{"id":"voorafgaand","term":"voorafgaand (aan)","kind":"examentaal","forms":["voorafgaand","voorafgaande"],"uitleg":"Ervoor; voordat iets begint. ‘Voorafgaand aan het examen’ betekent: vóór het examen."},{"id":"vooraf","term":"vooraf","kind":"examentaal","forms":["vooraf","van tevoren","tevoren"],"uitleg":"Van tevoren; voordat iets gebeurt."},{"id":"achteraf","term":"achteraf","kind":"examentaal","forms":["achteraf"],"uitleg":"Later; nadat iets gebeurd is."},{"id":"onderbroken","term":"onderbroken door","kind":"examentaal","forms":["onderbroken","onderbreking","onderbreekt"],"uitleg":"Even gestopt voor iets anders. ‘75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem gaan’ betekent: tijdens het zwemmen doe je tussendoor één keer iets anders, en daarna zwem je verder."},{"id":"gevolgd-door","term":"gevolgd door","kind":"examentaal","forms":["gevolgd door"],"uitleg":"Daarna komt. ‘A, gevolgd door B’ betekent: eerst A, dan B."},{"id":"zelfstandig","term":"zelfstandig","kind":"examentaal","forms":["zelfstandig"],"uitleg":"Alleen, zonder hulp van iemand anders."},{"id":"sprake-van","term":"er is sprake van","kind":"examentaal","forms":["sprake van","sprake"],"uitleg":"Iets is er of gebeurt. ‘Er is sprake van een verticale houding’ betekent: de houding is verticaal."},{"id":"gelden","term":"gelden","kind":"examentaal","forms":["geldt","gelden","golden"],"uitleg":"Een regel geldt als je hem moet volgen. ‘Deze regel geldt voor Zwemdiploma B’ betekent: deze regel moet je volgen bij Zwemdiploma B. ‘Wat geldt?’ betekent: wat is de regel?"},{"id":"van-toepassing","term":"van toepassing","kind":"examentaal","forms":["van toepassing"],"uitleg":"Geldt voor deze situatie."},{"id":"uitzondering","term":"uitzondering","kind":"examentaal","forms":["uitzondering","uitzonderingen"],"uitleg":"Een geval waarin de gewone regel niet geldt."},{"id":"voorwaarde","term":"voorwaarde","kind":"examentaal","forms":["voorwaarde","voorwaarden"],"uitleg":"Iets wat eerst moet kloppen of moet gebeuren; anders kan iets anders niet. Let op: ‘algemene voorwaarden’ zijn de vaste regels die bij een overeenkomst horen."},{"id":"noodzakelijk","term":"noodzakelijk","kind":"examentaal","forms":["noodzakelijk"],"uitleg":"Echt nodig."},{"id":"aangewezen","term":"aangewezen","kind":"examentaal","forms":["aangewezen"],"uitleg":"Gekozen voor een taak. ‘Hiervoor aangewezen medewerkers’ betekent: medewerkers die deze taak gekregen hebben."},{"id":"namens","term":"namens","kind":"examentaal","forms":["namens"],"uitleg":"Voor iemand anders, in de plaats van die persoon of organisatie. ‘Namens de Nationale Raad Zwemveiligheid’ betekent: in opdracht van de NRZ."},{"id":"verantwoordelijk","term":"verantwoordelijk","kind":"examentaal","forms":["verantwoordelijk","eindverantwoordelijk","verantwoordelijkheid","verantwoordelijkheden","verantwoordelijke"],"uitleg":"Wie verantwoordelijk is, moet ervoor zorgen dat iets goed gaat. Eindverantwoordelijk: de persoon die uiteindelijk verantwoordelijk is voor het geheel."},{"id":"delegeren","term":"delegeren","kind":"examentaal","forms":["delegeren","delegeert","gedelegeerd"],"uitleg":"Een taak aan iemand anders geven, zodat die persoon de taak voor jou doet."},{"id":"intrekken","term":"intrekken","kind":"examentaal","forms":["intrekken","ingetrokken","intrekking"],"uitleg":"Iets wat iemand gekregen heeft weer afnemen. ‘De licentie wordt ingetrokken’ betekent: de licentie geldt niet meer."},{"id":"afwijzen","term":"afwijzen","kind":"examentaal","forms":["afwijzen","afgewezen","afwijzing","wijst af"],"uitleg":"Nee zeggen. Bij een examen: de kandidaat is niet geslaagd. Bij een aanvraag: de aanvraag wordt niet goedgekeurd."},{"id":"goedkeuring","term":"goedkeuring","kind":"examentaal","forms":["goedkeuring","goedgekeurd","goedgekeurde","goedkeurt","goedkeuren"],"uitleg":"Officiële toestemming: iemand zegt ja tegen een plan of aanvraag."},{"id":"toestemming","term":"toestemming","kind":"examentaal","forms":["toestemming"],"uitleg":"Iemand zegt dat het mag."},{"id":"aanvragen","term":"aanvragen","kind":"examentaal","forms":["aanvragen","aanvraag","aangevraagd","aanvraagt"],"uitleg":"Officieel om iets vragen, vaak met een formulier of via een systeem. Een aanvraag is zo’n officiële vraag."},{"id":"indienen","term":"indienen","kind":"examentaal","forms":["indienen","ingediend","ingediende"],"uitleg":"Officieel inleveren of aanbieden, bijvoorbeeld een plan of een klacht."},{"id":"vaststellen","term":"vaststellen","kind":"examentaal","forms":["vaststellen","vastgesteld","vastgestelde"],"uitleg":"Officieel bepalen. ‘De uitslag vaststellen’ betekent: officieel bepalen wie geslaagd is. ‘De vastgestelde volgorde’ is de volgorde die vastligt."},{"id":"bepalen","term":"bepalen","kind":"examentaal","forms":["bepaalt","bepalen","bepaald","bepaalde"],"uitleg":"Beslissen hoe iets is of wordt. Let op: ‘bepaald’ kan ook ‘een zekere, specifieke’ betekenen: ‘een bepaalde richting’ is een specifieke richting. ‘Bijlage 1 bepaalt dat …’ betekent: in Bijlage 1 staat de regel dat …"},{"id":"kenbaar-maken","term":"kenbaar maken","kind":"examentaal","forms":["kenbaar"],"uitleg":"Laten weten; vertellen."},{"id":"terugkoppelen","term":"terugkoppelen","kind":"examentaal","forms":["terugkoppelen","terugkoppelt","teruggekoppeld","terugkoppeling"],"uitleg":"Aan iemand laten weten hoe iets gegaan is. ‘De resultaten terugkoppelen naar de zwemlesaanbieder’ betekent: de zwemlesaanbieder vertellen wat de resultaten zijn. ‘Hij koppelt de resultaten terug’ betekent hetzelfde."},{"id":"goedvinden","term":"goedvinden","kind":"examentaal","forms":["goedvindt","goedvinden"],"uitleg":"Het goed vinden; zeggen dat het mag. ‘Als de gedelegeerde dat goedvindt’ betekent: als de gedelegeerde zegt dat het mag."},{"id":"aan-de-orde","term":"aan de orde stellen","kind":"examentaal","forms":["aan de orde"],"uitleg":"‘Iets aan de orde stellen’ betekent: erover beginnen; het bespreken. ‘Dat is nog niet aan de orde’ betekent: daar gaat het nu nog niet om."},{"id":"ten-onrechte","term":"ten onrechte","kind":"examentaal","forms":["ten onrechte"],"uitleg":"Niet terecht; fout. ‘Ten onrechte uitgereikt’ betekent: gegeven terwijl dat niet mocht."},{"id":"terechtkomen","term":"terechtkomen","kind":"examentaal","forms":["terechtkomt","terechtkomen","terecht komt","terecht komen","terechtgekomen"],"uitleg":"Ergens komen, vaak zonder dat je dat zo kiest. ‘Onverwacht in het water terechtkomen’ betekent: in het water vallen terwijl je dat niet verwachtte."},{"id":"onverwacht","term":"onverwacht","kind":"examentaal","forms":["onverwacht","onverwachts"],"uitleg":"Zonder dat je het wist of verwachtte."},{"id":"steekproefsgewijs","term":"steekproefsgewijs","kind":"examentaal","forms":["steekproefsgewijs","steekproef"],"uitleg":"Niet altijd, maar af en toe, bij een paar gekozen gevallen."},{"id":"aangekondigd","term":"(on)aangekondigd","kind":"examentaal","forms":["aangekondigd","onaangekondigd","onaangekondigde","aangekondigde"],"uitleg":"Aangekondigd: van tevoren gemeld. Onaangekondigd: zonder het van tevoren te melden."},{"id":"willekeurig","term":"willekeurig","kind":"examentaal","forms":["willekeurig","willekeurige"],"uitleg":"Zomaar gekozen, zonder vaste keuze of volgorde. ‘In een willekeurige volgorde’ betekent: in elke volgorde die je wilt."},{"id":"periodiek","term":"periodiek","kind":"examentaal","forms":["periodiek","periodieke"],"uitleg":"Regelmatig; steeds na een bepaalde tijd."},{"id":"tussentijds","term":"tussentijds","kind":"examentaal","forms":["tussentijds","tussentijdse"],"uitleg":"Tussendoor; niet aan het begin en niet aan het einde."},{"id":"uiterlijk","term":"uiterlijk","kind":"examentaal","forms":["uiterlijk"],"uitleg":"Op zijn laatst. ‘Uiterlijk 24 uur van tevoren’ betekent: niet later dan 24 uur van tevoren."},{"id":"termijn","term":"termijn","kind":"examentaal","forms":["termijn"],"uitleg":"Een periode waarin iets moet gebeuren."},{"id":"afloop","term":"afloop","kind":"examentaal","forms":["afloop"],"uitleg":"Het einde. ‘Na afloop’ betekent: als het voorbij is."},{"id":"aanvang","term":"aanvang","kind":"examentaal","forms":["aanvang"],"uitleg":"Het begin. ‘Voor aanvang’ betekent: voordat het begint."},{"id":"gereed","term":"gereed","kind":"examentaal","forms":["gereed"],"uitleg":"Klaar. ‘Gereed maken’ betekent: klaarmaken."},{"id":"aanwezig","term":"aanwezig","kind":"examentaal","forms":["aanwezig","aanwezige","aanwezigheid"],"uitleg":"Er zijn; op de plek zijn. Aanwezigheid: het er zijn."},{"id":"ontbreken","term":"ontbreken","kind":"examentaal","forms":["ontbreekt","ontbreken","ontbrak"],"uitleg":"Er niet zijn, terwijl het er wel moet zijn; missen. ‘De geboortedatum ontbreekt nog’ betekent: de geboortedatum staat er nog niet op."},{"id":"compleet","term":"compleet","kind":"examentaal","forms":["compleet","complete"],"uitleg":"Helemaal af; alles is erbij. ‘Is dit onderdeel compleet?’ betekent: is dit alles, of hoort er nog iets bij?"},{"id":"betrokken","term":"betrokken","kind":"examentaal","forms":["betrokken","betrokkenen"],"uitleg":"Er iets mee te maken hebben; meedoen. Let op: ‘niet bij de beoordeling betrokken’ betekent: het telt niet mee bij het beoordelen."},{"id":"uitvoeren","term":"uitvoeren","kind":"examentaal","forms":["uitvoeren","uitgevoerd","uitgevoerde","uitvoering","uitvoert"],"uitleg":"Doen; laten zien. ‘Een onderdeel uitvoeren’ betekent: het onderdeel doen. De uitvoering is de manier waarop iemand het doet."},{"id":"beheersen","term":"beheersen","kind":"examentaal","forms":["beheerst","beheersen","beheersing","beheerste","niet-beheerste"],"uitleg":"Iets goed kunnen. Een beheerst onderdeel doet de kandidaat goed genoeg. Een niet-beheerst onderdeel kan de kandidaat nog niet goed genoeg."},{"id":"tonen","term":"tonen","kind":"examentaal","forms":["tonen","getoond","toont"],"uitleg":"Laten zien."},{"id":"beoordelen","term":"beoordelen","kind":"examentaal","forms":["beoordelen","beoordeeld","beoordeelt","beoordeling"],"uitleg":"Kijken hoe goed iets is en zeggen of het goed genoeg is."},{"id":"observeren","term":"observeren","kind":"examentaal","forms":["observeren","observeert","observerende","observerend","geobserveerd","geobserveerde"],"uitleg":"Goed kijken en letten op wat er gebeurt."},{"id":"toetsen","term":"toetsen","kind":"examentaal","forms":["toetsen","toetst","getoetst"],"uitleg":"Controleren of iemand of iets goed genoeg is; testen."},{"id":"specifiek","term":"specifiek","kind":"examentaal","forms":["specifiek","specifieke"],"uitleg":"Precies voor één ding of situatie; niet algemeen."},{"id":"relatief","term":"relatief","kind":"examentaal","forms":["relatief"],"uitleg":"Vergeleken met iets anders."},{"id":"redelijk","term":"redelijk","kind":"examentaal","forms":["redelijk","redelijke"],"uitleg":"Goed genoeg, maar niet perfect. ‘Een redelijke voortstuwing’ betekent: je komt goed genoeg vooruit."},{"id":"ontspannen","term":"ontspannen","kind":"examentaal","forms":["ontspannen"],"uitleg":"Rustig; niet gespannen of stijf."},{"id":"soepel","term":"soepel","kind":"examentaal","forms":["soepel","soepele","soepeler","soepelere"],"uitleg":"Makkelijk en vloeiend, zonder moeite of haperen. ‘Soepel onder een voorwerp door zwemmen’ betekent: rustig en zonder moeite eronderdoor. Een soepelere normering is een normering die minder streng is."},{"id":"vertrouwd","term":"je vertrouwd voelen","kind":"examentaal","forms":["vertrouwd"],"uitleg":"Je op je gemak voelen; je veilig voelen."},{"id":"ritmisch","term":"ritmisch","kind":"examentaal","forms":["ritmisch","ritmische"],"uitleg":"Met een vast, regelmatig tempo."},{"id":"symmetrisch","term":"symmetrisch","kind":"examentaal","forms":["symmetrisch","symmetrische","asymmetrisch","asymmetrische"],"uitleg":"Symmetrisch: links en rechts doen hetzelfde, op hetzelfde moment. Asymmetrisch: links en rechts doen iets anders."},{"id":"gestrekt","term":"gestrekt","kind":"examentaal","forms":["gestrekt","gestrekte"],"uitleg":"Recht, niet gebogen."},{"id":"passief","term":"passief","kind":"examentaal","forms":["passief","passieve"],"uitleg":"Zonder te bewegen; niet actief."},{"id":"actief","term":"actief","kind":"examentaal","forms":["actief","actieve"],"uitleg":"Bewegend; je doet er zelf iets mee."},{"id":"horizontaal","term":"horizontaal","kind":"examentaal","forms":["horizontaal","horizontale"],"uitleg":"Plat, liggend; in dezelfde richting als het wateroppervlak."},{"id":"verticaal","term":"verticaal","kind":"examentaal","forms":["verticaal","verticale"],"uitleg":"Rechtop; van boven naar beneden."},{"id":"genoemd","term":"genoemd","kind":"examentaal","forms":["genoemd","genoemde"],"uitleg":"Gezegd of beschreven in de tekst. ‘De genoemde onderdelen’ zijn de onderdelen waarover de tekst het heeft. Let op: ‘iets wordt X genoemd’ betekent: iets heet X."},{"id":"vermelden","term":"vermelden","kind":"examentaal","forms":["vermeld","vermelden","vermeldt"],"uitleg":"Opschrijven of noemen."},{"id":"opgenomen","term":"opgenomen","kind":"examentaal","forms":["opgenomen"],"uitleg":"Erin gezet; het staat erin. ‘Opgenomen in het examenprogramma’ betekent: het staat in het examenprogramma."},{"id":"bevatten","term":"bevatten","kind":"examentaal","forms":["bevat","bevatten"],"uitleg":"Iets erin hebben. ‘Het examenprogramma bevat zes proeven’ betekent: er zitten zes proeven in."},{"id":"beschrijven","term":"beschrijven","kind":"examentaal","forms":["beschreven","beschrijft","beschrijven","omschreven"],"uitleg":"In woorden uitleggen in een tekst. ‘Zoals beschreven in de Examenregeling’ betekent: zoals het in de Examenregeling staat."},{"id":"hanteren","term":"hanteren","kind":"examentaal","forms":["gehanteerd","hanteert","hanteren"],"uitleg":"Gebruiken (een regel, een woord of een manier van werken)."},{"id":"voorheen","term":"voorheen","kind":"examentaal","forms":["voorheen"],"uitleg":"Vroeger; eerder."},{"id":"vervangen","term":"vervangen","kind":"examentaal","forms":["vervangt","vervangen"],"uitleg":"In de plaats komen van. ‘X vervangt Y’ betekent: nu gebruiken we X in plaats van Y."},{"id":"term","term":"term","kind":"examentaal","forms":["term","termen","benaming"],"uitleg":"Een woord of naam voor iets. Een benaming is ook een naam."},{"id":"afstemming","term":"afstemming","kind":"examentaal","forms":["afstemming","afstemmen"],"uitleg":"Overleg om afspraken te maken, zodat iedereen het eens is."},{"id":"afgestemd","term":"afgestemd op","kind":"examentaal","forms":["afgestemd"],"uitleg":"Aangepast aan. ‘Afgestemd op de situatie’ betekent: aangepast aan de situatie. ‘Afgestemd met iemand’ betekent: met die persoon overlegd."},{"id":"overleg","term":"overleg","kind":"examentaal","forms":["overleg","overlegd","overleggen","overlegt"],"uitleg":"Met elkaar praten om samen iets te beslissen."},{"id":"evalueren","term":"evalueren","kind":"examentaal","forms":["evalueren","evalueert","evaluatie"],"uitleg":"Achteraf bespreken hoe iets ging en wat beter kan."},{"id":"rapporteren","term":"rapporteren","kind":"examentaal","forms":["rapporteren","rapporteert","rapporterende"],"uitleg":"Officieel vertellen of opschrijven wat er gebeurd is."},{"id":"verslag","term":"verslag","kind":"examentaal","forms":["verslag","verslaglegging","verslagformulieren","verslagen","verslagformulier"],"uitleg":"Een tekst waarin staat wat er gebeurd is. Verslaglegging: het opschrijven daarvan."},{"id":"bezwaar","term":"bezwaar","kind":"examentaal","forms":["bezwaar"],"uitleg":"Bezwaar maken: zeggen dat je het ergens niet mee eens bent."},{"id":"klacht","term":"klacht","kind":"examentaal","forms":["klacht","klachten"],"uitleg":"Je zegt officieel dat je ergens niet tevreden over bent."},{"id":"corrigerend","term":"corrigerend handelen","kind":"examentaal","forms":["corrigerend","corrigerende"],"uitleg":"Ingrijpen om iets wat fout gaat te verbeteren."},{"id":"ondertekenen","term":"ondertekenen","kind":"examentaal","forms":["ondertekenen","ondertekend","ondertekening","ondertekent"],"uitleg":"Je handtekening zetten."},{"id":"uitreiken","term":"uitreiken","kind":"examentaal","forms":["uitreiken","uitgereikt","uitreiking","diploma-uitreiking"],"uitleg":"Officieel geven, bijvoorbeeld diploma’s aan de kandidaten die geslaagd zijn."},{"id":"uitgifte","term":"uitgifte","kind":"examentaal","forms":["uitgifte","uitgeven","uitgegeven"],"uitleg":"Het officieel maken en beschikbaar stellen van iets, zoals diploma’s. ‘Uitgegeven door de Nationale Raad Zwemveiligheid’ betekent: het diploma komt officieel van de Nationale Raad Zwemveiligheid, ook als de zwemlesaanbieder het aan de kandidaat geeft."},{"id":"voor-rekening-van","term":"voor rekening van","kind":"examentaal","forms":["voor rekening van","voor rekening"],"uitleg":"Moet het betalen. ‘Voor rekening van de Licentiehouder’ betekent: de Licentiehouder betaalt."},{"id":"gekoppeld","term":"gekoppeld","kind":"examentaal","forms":["gekoppeld","koppelt","koppelen"],"uitleg":"Aan elkaar verbonden; bij elkaar horend. Let op: ‘hij koppelt de resultaten terug’ betekent: hij laat weten hoe het ging."},{"id":"geordend","term":"geordend","kind":"examentaal","forms":["geordend","ordenen"],"uitleg":"In een logische volgorde of groep gezet."},{"id":"ondergebracht","term":"ondergebracht","kind":"examentaal","forms":["ondergebracht"],"uitleg":"Een plek gegeven; in een groep gezet."},{"id":"overgeslagen","term":"overslaan","kind":"examentaal","forms":["overgeslagen","overslaan"],"uitleg":"Niet doen; eroverheen gaan en verdergaan met het volgende."},{"id":"aaneengesloten","term":"aaneengesloten","kind":"examentaal","forms":["aaneengesloten"],"uitleg":"Zonder pauze; achter elkaar door."},{"id":"voortdurend","term":"voortdurend","kind":"examentaal","forms":["voortdurend","voortdurende"],"uitleg":"Steeds; de hele tijd."},{"id":"telkens","term":"telkens","kind":"examentaal","forms":["telkens"],"uitleg":"Elke keer."},{"id":"betreffen","term":"betreffen","kind":"examentaal","forms":["betreft","betreffen","betreffende"],"uitleg":"Gaan over. ‘Het betreft’ betekent: het gaat om. ‘Wat de kleding betreft’ betekent: als het gaat om de kleding. ‘De betreffende kandidaten’ zijn de kandidaten waar het over gaat."},{"id":"omstandigheden","term":"omstandigheden","kind":"examentaal","forms":["omstandigheden","omstandigheid"],"uitleg":"De situatie waarin iets gebeurt, bijvoorbeeld de waterdiepte of de kleding."},{"id":"eisen","term":"eis","kind":"examentaal","forms":["eis","eisen"],"uitleg":"Wat er gevraagd wordt; waar iets aan moet voldoen."},{"id":"beperking","term":"beperking","kind":"examentaal","forms":["beperking","beperkingen","beperkt"],"uitleg":"Iets waardoor iemand bepaalde dingen niet of moeilijker kan, bijvoorbeeld door een lichamelijke handicap. Het kan ook gewoon ‘grens’ of ‘limiet’ betekenen. Beperkt betekent: niet veel, met een grens. ‘Zeer beperkt in voorraad’ betekent: maar heel weinig op voorraad. ‘Beperkt tot Zwemdiploma C’ betekent: alleen voor Zwemdiploma C. ‘Dat is te beperkt’ betekent: dat is te weinig, er hoort meer bij."},{"id":"jeugdig","term":"jeugdig","kind":"examentaal","forms":["jeugdige","jeugdig"],"uitleg":"Jong; nog een kind of tiener."},{"id":"verzorgers","term":"verzorgers","kind":"examentaal","forms":["verzorgers","verzorger"],"uitleg":"Mensen die voor een kind zorgen, zoals ouders."},{"id":"deskundige","term":"deskundige","kind":"examentaal","forms":["deskundige","deskundigen"],"uitleg":"Iemand die veel weet van een onderwerp; een expert."},{"id":"lesgever","term":"lesgever","kind":"examentaal","forms":["lesgever","lesgevers"],"uitleg":"Iemand die les geeft, bijvoorbeeld zwemles."},{"id":"rechtspersoon","term":"rechtspersoon","kind":"examentaal","forms":["rechtspersoon"],"uitleg":"Een organisatie die volgens de wet als ‘persoon’ telt, zoals een bedrijf, stichting of vereniging. Een natuurlijk persoon is gewoon een mens."},{"id":"stichting","term":"stichting","kind":"examentaal","forms":["stichting"],"uitleg":"Een soort organisatie met een vast doel en zonder leden."},{"id":"overeenkomst","term":"overeenkomst","kind":"examentaal","forms":["overeenkomst"],"uitleg":"Een afspraak op papier, zoals een contract."},{"id":"documentatie","term":"documentatie","kind":"examentaal","forms":["documentatie"],"uitleg":"Papieren of bestanden die je bewaart als bewijs of als informatie."},{"id":"in-het-bezit","term":"in het bezit van","kind":"examentaal","forms":["in het bezit","bezit","bezitten"],"uitleg":"Iets hebben. ‘In het bezit zijn van een diploma’ betekent: een diploma hebben."},{"id":"melden","term":"melden","kind":"examentaal","forms":["meldt","melden","gemeld"],"uitleg":"Laten weten; vertellen aan de juiste persoon. ‘Zich melden’ betekent: zeggen dat je er bent. ‘Iets aanmelden’ (‘hij meldt het aan’) betekent: het officieel opgeven."},{"id":"gewaarborgd","term":"waarborgen","kind":"examentaal","forms":["gewaarborgd","waarborgen","waarborgt"],"uitleg":"Ervoor zorgen dat iets zeker goed is en goed blijft."},{"id":"zorgdragen","term":"zorgdragen voor","kind":"examentaal","forms":["zorgdraagt","zorgdragen","zorg dragen"],"uitleg":"Zorgen voor; ervoor zorgen dat iets gebeurt."},{"id":"inzichtelijk","term":"inzichtelijk","kind":"examentaal","forms":["inzichtelijk"],"uitleg":"Duidelijk en makkelijk te begrijpen. ‘Inzichtelijk maken’ betekent: duidelijk laten zien."},{"id":"globaal","term":"globaal","kind":"examentaal","forms":["globaal"],"uitleg":"Ongeveer; niet precies."},{"id":"gelegenheid","term":"gelegenheid","kind":"examentaal","forms":["gelegenheid"],"uitleg":"De kans om iets te doen."},{"id":"verbod","term":"verbod","kind":"examentaal","forms":["verbod","verboden"],"uitleg":"Een regel die zegt dat iets niet mag."},{"id":"bevindingen","term":"bevindingen","kind":"examentaal","forms":["bevindingen","constateringen"],"uitleg":"Wat iemand gezien of ontdekt heeft."},{"id":"onderbouwing","term":"onderbouwing","kind":"examentaal","forms":["onderbouwing","onderbouwen","onderbouwd","onderbouwt"],"uitleg":"De redenen en uitleg waarom iets zo is. Onderbouwen: uitleggen waarom je iets zo doet, met redenen. ‘Hij onderbouwt zijn keuze’ betekent: hij legt uit waarom hij dat kiest."},{"id":"weigering","term":"weigeren","kind":"examentaal","forms":["weigering","weigert","weigeren","geweigerd"],"uitleg":"Nee zeggen; iets niet willen doen of niet toestaan."},{"id":"annulering","term":"annuleren","kind":"examentaal","forms":["annulering","annuleren","geannuleerd","annuleert"],"uitleg":"Afzeggen; het gaat niet door."},{"id":"selecteren","term":"selecteren","kind":"examentaal","forms":["selecteren","selecteert","geselecteerd"],"uitleg":"Kiezen. ‘Kandidaten selecteren’ betekent: kiezen welke kandidaten examen doen."},{"id":"vrijwilliger","term":"vrijwilliger","kind":"examentaal","forms":["vrijwilliger","vrijwilligers","vrijwilligersvergoeding"],"uitleg":"Iemand die werkt zonder salaris. Een vrijwilligersvergoeding is een kleine betaling voor dat werk."},{"id":"kosten","term":"reiskosten en andere kosten","kind":"examentaal","forms":["reiskosten","verblijfkosten","administratiekosten"],"uitleg":"Reiskosten: geld voor de reis. Verblijfkosten: geld voor eten of overnachten. Administratiekosten: geld voor het papierwerk."},{"id":"te-water-gaan","term":"te water gaan","kind":"water","forms":["te water gaan","te water"],"uitleg":"In het water komen, bijvoorbeeld met een sprong, door te duiken of met een rol voorover."},{"id":"watertrappen","term":"watertrappen","kind":"water","forms":["watertrappen","watertrappend","watertrapt"],"uitleg":"Rechtop in het water blijven met je hoofd boven water. Je beweegt je benen, en meestal helpen je armen of handen onder water mee. Zo kun je om je heen kijken. Soms blijf je op de plaats, soms verplaats je je.","ref":"Examenregeling p. 56–59"},{"id":"drijven","term":"drijven","kind":"water","forms":["drijven","drijft"],"uitleg":"Op het water blijven zonder te zinken, vaak zonder veel te bewegen."},{"id":"drijvend-voorwerp","term":"drijvend voorwerp","kind":"water","forms":["drijvend voorwerp","drijvende voorwerpen"],"uitleg":"Iets wat op het water blijft liggen, zoals een mat."},{"id":"gekleed","term":"gekleed","kind":"water","forms":["gekleed"],"uitleg":"Met kleren aan, dus niet alleen in badkleding."},{"id":"badkleding","term":"badkleding","kind":"water","forms":["badkleding"],"uitleg":"Zwemkleding, zoals een badpak of zwembroek."},{"id":"hoofdwaarts","term":"hoofdwaarts","kind":"water","forms":["hoofdwaarts"],"uitleg":"Met het hoofd eerst."},{"id":"voetwaarts","term":"voetwaarts","kind":"water","forms":["voetwaarts"],"uitleg":"Met de voeten eerst."},{"id":"achterwaarts","term":"achterwaarts","kind":"water","forms":["achterwaarts","achterwaartse"],"uitleg":"Naar achteren."},{"id":"achterover","term":"achterover","kind":"water","forms":["achterover"],"uitleg":"Naar achteren, met je rug eerst. ‘Zich achterover laten vallen’ betekent: met je rug naar achteren vallen, bijvoorbeeld in het water."},{"id":"voorwaarts","term":"voorwaarts","kind":"water","forms":["voorwaarts","voorwaartse"],"uitleg":"Naar voren."},{"id":"zijwaarts","term":"zijwaarts","kind":"water","forms":["zijwaarts","zijwaartse"],"uitleg":"Naar de zijkant; opzij."},{"id":"rol-voorover","term":"rol voorover","kind":"water","forms":["rol voorover"],"uitleg":"Een koprol naar voren. Je lichaam draait daarbij om de breedteas.","ref":"Examenregeling p. 48"},{"id":"lengteas","term":"lengteas","kind":"water","forms":["lengteas"],"uitleg":"Een lijn door je lichaam, van je hoofd naar je voeten. Je ziet die lijn niet. Een halve draai om de lengteas is bijvoorbeeld van je rug naar je buik draaien.","ref":"Examenregeling p. 9"},{"id":"breedteas","term":"breedteas","kind":"water","forms":["breedteas"],"uitleg":"Een lijn dwars door je lichaam, van links naar rechts. Je ziet die lijn niet. Bij een draai om de breedteas maak je een koprol, zoals bij de rol voorover.","ref":"Examenregeling p. 48"},{"id":"bodem","term":"bodem","kind":"water","forms":["bodem"],"u
