itleg":"De grond onder het water; de vloer van het zwembad."},{"id":"wateroppervlak","term":"wateroppervlak","kind":"water","forms":["wateroppervlak","oppervlakte","oppervlak","wateroppervlakte"],"uitleg":"De bovenkant van het water. ‘Naar de oppervlakte zwemmen’ betekent: omhoog zwemmen tot je boven water komt. Let op: ‘oppervlakte’ of ‘(water)oppervlak’ kan ook betekenen: hoe groot een vlak is, in m2. ‘Een bassin met een oppervlakte van 160 m2’ betekent: het bassin is 160 m2 groot."},{"id":"kant","term":"kant","kind":"water","forms":["kant","startkant"],"uitleg":"De rand van het zwembad. De startkant is de kant waar je begint. Let op: ‘de goede kant op zwemmen’ betekent: in de goede richting zwemmen."},{"id":"bassin","term":"bassin","kind":"water","forms":["bassin","bassinrand","bassins"],"uitleg":"Het zwembad zelf: de bak met water. De bassinrand is de rand ervan."},{"id":"trapje","term":"trapje","kind":"water","forms":["trapje"],"uitleg":"Een kleine trap om het zwembad in of uit te gaan."},{"id":"startblok","term":"startblok","kind":"water","forms":["startblok","startblokken"],"uitleg":"Een verhoogd blok aan de kant, waar zwemmers vanaf springen bij een wedstrijd."},{"id":"zeil","term":"zeil met gat","kind":"water","forms":["zeil","zeil-onderdeel"],"uitleg":"Een groot stuk stof of plastic dat verticaal in het water hangt. Er zit een gat in. De kandidaat zwemt onder water door dat gat."},{"id":"wak","term":"soort wak","kind":"water","forms":["soort wak","wak"],"uitleg":"Een wak is een gat in het ijs. In het examen is een ‘soort wak’ een vierkant of rond voorwerp, zoals een hoepel, waarin de kandidaat boven water moet komen.","ref":"Examenregeling p. 34"},{"id":"hoepel","term":"hoepel","kind":"water","forms":["hoepel"],"uitleg":"Een grote ronde ring."},{"id":"voetsprong","term":"voetsprong","kind":"water","forms":["voetsprong"],"uitleg":"Een sprong waarbij je met je voeten eerst in het water komt."},{"id":"duiken","term":"duiken","kind":"water","forms":["duiken","duikt","duik","gedoken"],"uitleg":"Met je handen eerst het water in gaan; daarna volgen je armen en je hoofd. In de Examenregeling heet de oude ‘kopsprong’ nu ‘duiken’.","ref":"Examenregeling Bijlage 1 en p. 23"},{"id":"kopsprong","term":"kopsprong","kind":"water","forms":["kopsprong"],"uitleg":"Oude technische naam voor een sprong met je handen en hoofd eerst het water in. In de Examenregeling heet dit nu ‘duiken’.","ref":"Examenregeling Bijlage 1"},{"id":"hurksprong","term":"hurksprong","kind":"water","forms":["hurksprong"],"uitleg":"Oude technische naam. Nu heet het ‘een sprong waarbij het hoofd boven water blijft’. Hoe de kandidaat springt, is vrij, als het hoofd maar boven water blijft.","ref":"Examenregeling Bijlage 1"},{"id":"hoekduik","term":"hoekduik","kind":"water","forms":["hoekduik"],"uitleg":"Oude technische naam. Nu heet het ‘hoofdwaarts richting bodem gaan’.","ref":"Examenregeling Bijlage 1"},{"id":"help-houding","term":"HELP-houding","kind":"water","forms":["help-houding"],"uitleg":"Oude naam voor ‘verticaal drijven met behulp van een voorwerp’. In deze houding koel je minder snel af als je in koud open water op hulp wacht.","ref":"Examenregeling Bijlage 1"},{"id":"schoolslag","term":"schoolslag","kind":"water","forms":["schoolslag"],"uitleg":"Een zwemslag op je buik. Je armen en benen bewegen links en rechts op dezelfde manier en tegelijk."},{"id":"enkelvoudige-rugslag","term":"enkelvoudige rugslag","kind":"water","forms":["enkelvoudige rugslag"],"uitleg":"Rugslag waarbij alleen je benen de beweging maken. Je armen zijn passief, bij voorkeur langs je lichaam.","ref":"Examenregeling p. 19"},{"id":"rugslag","term":"rugslag","kind":"water","forms":["rugslag"],"uitleg":"Zwemmen op je rug. In de vragen is ‘rugslag’ vaak kort voor ‘enkelvoudige rugslag’."},{"id":"borstcrawl","term":"borstcrawl","kind":"water","forms":["borstcrawl"],"uitleg":"Een zwemslag op je buik. Je armen draaien om de beurt over het water en je benen trappen op en neer."},{"id":"rugcrawl","term":"rugcrawl","kind":"water","forms":["rugcrawl"],"uitleg":"Een zwemslag op je rug. Je armen draaien om de beurt en je benen trappen op en neer."},{"id":"zwemslag","term":"zwemslag","kind":"water","forms":["zwemslag","zwemslagen"],"uitleg":"Een manier van zwemmen, zoals schoolslag of borstcrawl."},{"id":"beenslag","term":"beenslag","kind":"water","forms":["beenslag","beenbeweging","beenbewegingen"],"uitleg":"De beweging van je benen bij het zwemmen."},{"id":"armslag","term":"armslag","kind":"water","forms":["armslag","armbeweging","armbewegingen","armdoorhaal","armslagen"],"uitleg":"De beweging van je armen bij het zwemmen. De armdoorhaal is het deel waarbij je je arm door het water trekt."},{"id":"uitdrijfmoment","term":"uitdrijfmoment","kind":"water","forms":["uitdrijfmoment","uitdrijfmomenten"],"uitleg":"Het moment na een slag waarop je even doorglijdt zonder je armen en benen te bewegen."},{"id":"voortstuwing","term":"voortstuwing","kind":"water","forms":["voortstuwing","voorstuwing","voortstuwingsrendement","voorstuwingsrendement"],"uitleg":"De kracht die je vooruit brengt in het water. ‘Voorstuwing’ betekent hetzelfde. ‘Een redelijk voortstuwingsrendement’ betekent: je komt goed genoeg vooruit voor de moeite die je doet."},{"id":"wrikbewegingen","term":"wrikbewegingen","kind":"water","forms":["wrikbewegingen","wrikbeweging","wrikken"],"uitleg":"Kleine bewegingen met je handen heen en weer, om te blijven drijven of je te verplaatsen."},{"id":"ligging","term":"ligging","kind":"water","forms":["ligging","rugligging","buikligging"],"uitleg":"Hoe je in het water ligt. Rugligging: op je rug. Buikligging: op je buik."},{"id":"houding","term":"houding","kind":"water","forms":["houding","lichaamshouding","drijfhouding"],"uitleg":"De manier waarop je lichaam staat of ligt."},{"id":"orienteren","term":"oriënteren","kind":"water","forms":["oriënteren","oriëntatie","oriëntatieopdracht","heroriënteren","desoriëntatie","gedesoriënteerd","oriënteert"],"uitleg":"Kijken waar je bent en welke kant je op moet. Gedesoriënteerd: je weet even niet waar je bent of waar boven is. Heroriënteren: opnieuw ontdekken waar je bent."},{"id":"verplaatsen","term":"verplaatsen","kind":"water","forms":["verplaatsen","verplaatst","verplaatsing","voortbewegen","voortbeweging"],"uitleg":"Van de ene plek naar de andere gaan. In het water: vooruitkomen, op welke manier dan ook."},{"id":"bovenkomen","term":"bovenkomen","kind":"water","forms":["bovenkomen","boven komen","bovenkomt"],"uitleg":"Weer met je hoofd boven water komen."},{"id":"zakken","term":"zakken","kind":"water","forms":["zakken","zakt"],"uitleg":"Langzaam naar beneden gaan. ‘Voetwaarts richting de bodem zakken’ betekent: met je voeten eerst naar beneden gaan. Let op: ‘zakken voor een examen’ betekent: niet slagen."},{"id":"onderdoor","term":"onderdoor","kind":"water","forms":["onderdoor","eronderdoor"],"uitleg":"Onder iets door, langs de onderkant."},{"id":"klimmen","term":"klimmen","kind":"water","forms":["klimmen","klimt","geklommen"],"uitleg":"Omhoog gaan met je handen en voeten, bijvoorbeeld uit het water op de kant."},{"id":"afzetten","term":"afzetten","kind":"water","forms":["afzetten","afzet","zet af"],"uitleg":"Je met je voeten of handen ergens tegen duwen om vaart te maken."},{"id":"golfslag","term":"golfslag","kind":"water","forms":["golfslag","golfslagbad","golfslagbassin"],"uitleg":"Golven in het water. Een golfslagbad is een zwembad waarin golven gemaakt worden."},{"id":"stroming","term":"stroming","kind":"water","forms":["stroming","stroomversnelling"],"uitleg":"Water dat in één richting beweegt, zoals in een rivier. Een stroomversnelling is een plek waar het water sneller stroomt."},{"id":"attracties","term":"attracties","kind":"water","forms":["attracties","attractie"],"uitleg":"Extra dingen in een zwembad om mee te spelen, zoals een glijbaan, een golfslagbassin of een stroomversnelling.","ref":"Examenregeling Bijlage 1"},{"id":"open-water","term":"open water","kind":"water","forms":["open water"],"uitleg":"Water buiten het zwembad, zoals een plas, meer of sloot."},{"id":"recreatieplas","term":"recreatieplas","kind":"water","forms":["recreatieplas","recreatieplassen"],"uitleg":"Een meer of plas in de natuur waar mensen zwemmen en spelen."},{"id":"recreeren","term":"recreëren","kind":"water","forms":["recreëren","recreatie"],"uitleg":"Ontspannen en plezier hebben in je vrije tijd."},{"id":"zwembrilletje","term":"zwembrilletje","kind":"water","forms":["zwembrilletje","brilletje","chloorbrilletje"],"uitleg":"Een kleine bril die je ogen beschermt tegen water en chloor."},{"id":"waterdiepte","term":"waterdiepte","kind":"water","forms":["waterdiepte","diepte","waterdieptes"],"uitleg":"Hoe diep het water is."},{"id":"overbruggen","term":"overbruggen","kind":"water","forms":["overbruggen","overbrugd","overbrugt"],"uitleg":"Een afstand afleggen; van het ene punt naar het andere komen."},{"id":"enkels","term":"enkels","kind":"water","forms":["enkels"],"uitleg":"Het dunne deel van je been, net boven je voet."},{"id":"ellebogen","term":"ellebogen","kind":"water","forms":["ellebogen","elleboog"],"uitleg":"Het punt in het midden van je arm waar je arm buigt."},{"id":"knie","term":"knie","kind":"water","forms":["knie","knieën"],"uitleg":"Het punt in het midden van je been waar je been buigt. Let op: ‘iets onder de knie krijgen’ betekent: iets leren tot je het goed kunt."},{"id":"conditie","term":"conditie","kind":"water","forms":["conditie"],"uitleg":"Hoe lang je iets kunt volhouden zonder moe te worden."},{"id":"volhouden","term":"volhouden","kind":"water","forms":["volhouden","volhoudt"],"uitleg":"Doorgaan zonder te stoppen."},{"id":"vermoeidheid","term":"vermoeidheid","kind":"water","forms":["vermoeidheid","vermoeiend","vermoeiender"],"uitleg":"Vermoeidheid: het gevoel moe te zijn. Vermoeiend: iets wat je moe maakt."},{"id":"afkoeling","term":"afkoeling","kind":"water","forms":["afkoeling","afkoelen"],"uitleg":"Kouder worden."},{"id":"ademhaling","term":"ademhaling","kind":"water","forms":["ademhaling","ademhalen","ademen","geademd"],"uitleg":"Lucht in- en uitademen."},{"id":"hangend","term":"hangend","kind":"water","forms":["hangend","hangende"],"uitleg":"Aan iets vast en naar beneden. ‘Een verticaal hangend zeil’ is een zeil dat rechtop in het water hangt."},{"id":"meebewegen","term":"meebewegen","kind":"water","forms":["meebewegen","bewegen mee","beweegt mee"],"uitleg":"Ook bewegen, samen met iets anders. ‘De armen bewegen mee ter ondersteuning’ betekent: de armen helpen mee."},{"id":"ondersteuning","term":"ondersteuning","kind":"water","forms":["ondersteuning","ondersteunen","ondersteunende","ondersteunt"],"uitleg":"Hulp; iets wat helpt."},{"id":"gestroomlijnd","term":"gestroomlijnd","kind":"water","forms":["gestroomlijnd","gestroomlijnde"],"uitleg":"In een lange, rechte vorm, zodat je makkelijk door het water glijdt."},{"id":"verhoging","term":"verhoging","kind":"water","forms":["verhoging"],"uitleg":"Een hogere plek, bijvoorbeeld iets waar je vanaf springt."},{"id":"valrichting","term":"valrichting","kind":"water","forms":["valrichting"],"uitleg":"De richting waarin je valt."},{"id":"plankje","term":"plankje","kind":"water","forms":["plankje"],"uitleg":"Een klein, plat stuk materiaal dat drijft, bijvoorbeeld van schuim. Je gebruikt het bij zwemles."},{"id":"examenregeling","term":"Examenregeling","kind":"regels","forms":["Examenregeling","Examenregeling Nationale Zwemdiploma's"],"uitleg":"Het officiële reglement met de regels en de examenprogramma’s voor de Nationale Zwemdiploma’s. Vroeger heette dit de BREZ.","ref":"Examenregeling Bijlage 1"},{"id":"brez","term":"BREZ","kind":"regels","forms":["BREZ"],"uitleg":"Oude naam voor de Examenregeling. Deze naam wordt niet meer gebruikt.","ref":"Examenregeling Bijlage 1"},{"id":"nrz","term":"Nationale Raad Zwemveiligheid (NRZ)","kind":"regels","forms":["Nationale Raad Zwemveiligheid","NRZ"],"uitleg":"Een landelijke stichting. Ze let op de kwaliteit van het z etje.","ref":"Examenregeling p. 34 en 36"},{"id":"zwemlesaanbieder","term":"zwemlesaanbieder","kind":"regels","forms":["zwemlesaanbieder","zwemlesaanbieders"],"uitleg":"Een organisatie of persoon die zwemles geeft, zoals een zwemschool of een zwembad."},{"id":"kandidaat","term":"kandidaat","kind":"regels","forms":["kandidaat","kandidaten","kandidate"],"uitleg":"Iemand die examen doet. In de vragen is de kandidaat bijna altijd de zwemmer die een diploma wil halen, niet de examinator."},{"id":"diplomazwemmen","term":"diplomazwemmen","kind":"regels","forms":["diplomazwemmen"],"uitleg":"Het zwemexamen voor een zwemdiploma. In de Examenregeling betekenen ‘examens’ en ‘diplomazwemmen’ hetzelfde.","ref":"Examenregeling Bijlage 1"},{"id":"examenprogramma","term":"examenprogramma","kind":"regels","forms":["examenprogramma","examenprogramma's"],"uitleg":"Alles wat een kandidaat moet laten zien voor een diploma of certificaat. Een examenprogramma bestaat uit proeven.","ref":"Examenregeling Bijlage 1"},{"id":"standaard-examenprogramma","term":"standaard examenprogramma","kind":"regels","forms":["standaard examenprogramma","standaard examenprogramma's"],"uitleg":"Het vaste examenprogramma uit de Examenregeling. De onderdelen van een proef worden in de vaste volgorde uitgevoerd, en elk onderdeel heeft een eigen normering. De proeven zelf mogen in een willekeurige volgorde.","ref":"Examenregeling Bijlage 1 en p. 35"},{"id":"maatwerk","term":"maatwerk examenprogramma","kind":"regels","forms":["maatwerk examenprogramma","maatwerk examenprogramma's","maatwerk","maatwerkproef","maatwerkproeven"],"uitleg":"Een examenprogramma dat een Licentiehouder zelf ontwikkelt, in plaats van het standaard examenprogramma. Het moet eerst naar de NRZ. De Toetsingscommissie controleert het en keurt het goed of af. Pas na goedkeuring mag je het gebruiken. Een maatwerkproef is een proef in zo’n programma.","ref":"Examenregeling Bijlage 1 en p. 44"},{"id":"toetsingscommissie","term":"Toetsingscommissie", <script>
"use strict";
// Het Diepe — pure logic (no DOM). Imported by tests in node and concatenated
// into index.html by tools/build.py (which strips the `export` keywords).

const CATEGORIES = [
  { key: "examenprogrammas", label: "Examenprogramma's", short: "Programma's" },
  { key: "normering", label: "Normering", short: "Normering" },
  { key: "algemene_bepalingen", label: "Algemene bepalingen", short: "Algemeen" },
  { key: "taken_verantwoordelijkheden", label: "Taken en verantwoordelijkheden", short: "Taken" },
];
const CATEGORY_KEYS = CATEGORIES.map((c) => c.key);
const EXAM_SIZE = 40;
const PASS_MARK = 29;
const EXAM_MINUTES = 40;
const STORAGE_PREFIX = "hetdiepe:v1:";
const STORAGE_KEY = STORAGE_PREFIX + "state";
const SCHEMA_VERSION = 1;
const DAY = 24 * 60 * 60 * 1000;

function categoryLabel(key) {
  const c = CATEGORIES.find((x) => x.key === key);
  return c ? c.label : key;
}

// ------------------------------------------------------------------ state
function defaultSettings() {
  return {
    timer: true,
    counts: { examenprogrammas: 10, normering: 10, algemene_bepalingen: 10, taken_verantwoordelijkheden: 10 },
    includeMaatwerk: true,
    includeCertificaten: true,
    theme: "auto",
    wordHelp: true, // underline glossary terms and explain them under the question
    wordHelpExam: true, // ...also during a practice exam
    wordHelpOpen: true, // the woordhulp panel starts open
    knownTerms: [], // glossary ids the user marked as "Ken ik"
  };
}

function emptyState() {
  return { schemaVersion: SCHEMA_VERSION, answers: {}, exams: [], inProgress: null, settings: defaultSettings() };
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

// Migration chain. Each step takes a state of version n and returns version n+1.
const MIGRATIONS = {
  // 1: (s) => ({ ...s, schemaVersion: 2, newField: ... }),
};

function migrate(raw) {
  if (!isObj(raw)) return emptyState();
  let s = { ...raw };
  let v = Number.isInteger(s.schemaVersion) ? s.schemaVersion : 1;
  while (v < SCHEMA_VERSION && MIGRATIONS[v]) {
    s = MIGRATIONS[v](s);
    v = s.schemaVersion;
  }
  const base = emptyState();
  const settings = { ...base.settings, ...(isObj(s.settings) ? s.settings : {}) };
  settings.counts = { ...base.settings.counts, ...(isObj(settings.counts) ? settings.counts : {}) };
  if (!validCounts(settings.counts)) settings.counts = { ...base.settings.counts };
  settings.knownTerms = Array.isArray(settings.knownTerms)
    ? [...new Set(settings.knownTerms.filter((x) => typeof x === "string"))] : [];
  for (const k of ["wordHelp", "wordHelpExam", "wordHelpOpen"]) {
    if (typeof settings[k] !== "boolean") settings[k] = base.settings[k];
  }
  return {
    schemaVersion: SCHEMA_VERSION,
    answers: isObj(s.answers) ? s.answers : {},
    exams: Array.isArray(s.exams) ? s.exams : [],
    inProgress: isObj(s.inProgress) ? s.inProgress : null,
    settings,
  };
}

function validCounts(counts) {
  if (!isObj(counts)) return false;
  let total = 0;
  for (const k of CATEGORY_KEYS) {
    const n = counts[k];
    if (!Number.isInteger(n) || n < 0) return false;
    total += n;
  }
  return total === EXAM_SIZE;
}

// Validate an imported progress file. Returns { ok, error?, state? }.
function validateImport(obj) {
  if (!isObj(obj)) return { ok: false, error: "Dit is geen geldig voortgangsbestand." };
  const data = isObj(obj.data) ? obj.data : obj;
  if (obj.app !== undefined && obj.app !== "het-diepe") return { ok: false, error: "Dit bestand is niet van Het Diepe." };
  if (!isObj(data.answers) || !Array.isArray(data.exams)) {
    return { ok: false, error: "Het bestand mist antwoorden of examengeschiedenis." };
  }
  for (const [qid, list] of Object.entries(data.answers)) {
    if (typeof qid !== "string" || !Array.isArray(list)) return { ok: false, error: "Antwoorden hebben een onbekend formaat." };
    for (const a of list) {
      if (!isObj(a) || typeof a.correct !== "boolean" || typeof a.at !== "number") {
        return { ok: false, error: "Antwoorden hebben een onbekend formaat." };
      }
    }
  }
  for (const e of data.exams) {
    if (!isObj(e) || !Array.isArray(e.questionIds) || typeof e.score !== "number") {
      return { ok: false, error: "De examengeschiedenis heeft een onbekend formaat." };
    }
  }
  return { ok: true, state: migrate(data) };
}

function exportPayload(state, now = Date.now()) {
  return {
    app: "het-diepe",
    exportedAt: new Date(now).toISOString(),
    schemaVersion: SCHEMA_VERSION,
    data: { answers: state.answers, exams: state.exams, inProgress: state.inProgress, settings: state.settings },
  };
}

// Clears answers, exam history and in-progress exam; keeps settings.
function resetProgress(state) {
  return { ...emptyState(), settings: { ...state.settings } };
}

// ------------------------------------------------------------------ rng
function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return function rng() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ------------------------------------------------------------------ bank helpers
function indexBank(bank) {
  const qById = new Map();
  for (const q of bank.questions) qById.set(q.id, q);
  const oById = new Map();
  for (const o of bank.objectives) oById.set(o.id, o);
  const qByObj = new Map();
  for (const q of bank.questions) {
    for (const oid of q.objectives) {
      if (!qByObj.has(oid)) qByObj.set(oid, []);
      qByObj.get(oid).push(q.id);
    }
  }
  return { qById, oById, qByObj };
}

function idx(bank) {
  if (!bank._idx) Object.defineProperty(bank, "_idx", { value: indexBank(bank), enumerable: false });
  return bank._idx;
}

function sectionOf(bank, q) {
  const o = idx(bank).oById.get(q.objectives[0]);
  return o ? o.section : "?";
}

// Top-level grouping used in the coverage view and the practice scope list.
function chapterOf(section) {
  if (!section) return "?";
  if (/^Bijlage/.test(section)) return section;
  if (/^(Inleiding|Aanleiding|NRZ)$/.test(section)) return "Inleiding";
  if (/^Handleiding/.test(section)) return "3";
  const m = /^(\d+)/.exec(section);
  return m ? m[1] : section;
}

const CHAPTER_LABELS = {
  Inleiding: "Inleiding, Aanleiding en NRZ",
  1: "H1 Examenprogramma's",
  2: "H2 Normering en algemene bepalingen",
  3: "H3 Kwaliteitsborging",
  4: "H4 Maatwerk",
  "Bijlage 1": "Bijlage 1 Definities",
  "Bijlage 2": "Bijlage 2 Onderdelen",
  "Bijlage 3": "Bijlage 3 Basiselementen",
};

function lastAnswer(answers, qid) {
  const list = answers[qid];
  if (!Array.isArray(list) || list.length === 0) return null;
  let best = list[0];
  for (const a of list) if (a.at >= best.at) best = a;
  return best;
}

function isEligible(q, settings) {
  if (!settings.includeMaatwerk && q.subtopic === "maatwerk") return false;
  if (!settings.includeCertificaten && q.subtopic === "zwemcertificaten") return false;
  return true;
}

// ------------------------------------------------------------------ coverage
// Gezien: at least one question of the objective answered.
// Beheerst: the most recent answer among its questions was correct.
function coverage(bank, answers) {
  const { qByObj } = idx(bank);
  const perObjective = {};
  const perCategory = {};
  const perChapter = {};
  let seen = 0;
  let mastered = 0;
  for (const c of CATEGORY_KEYS) perCategory[c] = { total: 0, seen: 0, mastered: 0 };
  for (const o of bank.objectives) {
    let latest = null;
    for (const qid of qByObj.get(o.id) || []) {
      const a = lastAnswer(answers, qid);
      if (a && (!latest || a.at >= latest.at)) latest = a;
    }
    const st = { seen: !!latest, mastered: !!(latest && latest.correct) };
    perObjective[o.id] = st;
    const pc = perCategory[o.category] || (perCategory[o.category] = { total: 0, seen: 0, mastered: 0 });
    const ch = chapterOf(o.section);
    const pch = perChapter[ch] || (perChapter[ch] = { total: 0, seen: 0, mastered: 0, sections: {} });
    const ps = pch.sections[o.section] || (pch.sections[o.section] = { total: 0, seen: 0, mastered: 0 });
    for (const bucket of [pc, pch, ps]) {
      bucket.total++;
      if (st.seen) bucket.seen++;
      if (st.mastered) bucket.mastered++;
    }
    if (st.seen) seen++;
    if (st.mastered) mastered++;
  }
  let answeredQuestions = 0;
  const known = idx(bank).qById;
  for (const [qid, list] of Object.entries(answers)) if (known.has(qid) && list && list.length) answeredQuestions++;
  return {
    perObjective, perCategory, perChapter,
    total: bank.objectives.length, seen, mastered,
    answeredQuestions, totalQuestions: bank.questions.length,
  };
}

// ------------------------------------------------------------------ picking an exam
function questionPriority(q, answers, now, uncovered, rng) {
  const last = lastAnswer(answers, q.id);
  let s;
  if (!last) s = 100;
  else if (!last.correct) s = 50 + Math.min(25, ((now - last.at) / DAY) * 2);
  else s = 5 + Math.min(12, ((now - last.at) / DAY) * 0.4);
  if (q.objectives.some((o) => uncovered.has(o))) s += 15;
  return s + rng() * 4;
}

// Returns { questionIds, optionOrders } with exactly sum(counts) questions when the bank allows it.
function pickExam(bank, progress, settings, rng, now = Date.now()) {
  const answers = (progress && progress.answers) || {};
  const counts = validCounts(settings.counts) ? settings.counts : defaultSettings().counts;
  const cov = coverage(bank, answers);
  const uncovered = new Set(Object.keys(cov.perObjective).filter((k) => !cov.perObjective[k].seen));
  const chosen = [];
  const chosenSet = new Set();
  const usedTests = new Set();
  const objCount = new Map();
  const sectionCount = new Map();
  const norm = (s) => String(s || "").trim().toLowerCase();

  const take = (q) => {
    chosen.push(q);
    chosenSet.add(q.id);
    usedTests.add(norm(q.tests));
    for (const o of q.objectives) objCount.set(o, (objCount.get(o) || 0) + 1);
    const sec = sectionOf(bank, q);
    sectionCount.set(sec, (sectionCount.get(sec) || 0) + 1);
  };
  const lastAt = (q) => {
    const a = lastAnswer(answers, q.id);
    return a ? a.at : -Infinity;
  };

  // Phase per category, with progressively relaxed rules.
  const deficits = {};
  for (const cat of CATEGORY_KEYS) {
    const need = counts[cat];
    const pool = bank.questions.filter((q) => q.category === cat);
    const eligible = pool.filter((q) => isEligible(q, settings));
    const scored = new Map(eligible.map((q) => [q.id, questionPriority(q, answers, now, uncovered, rng)]));
    let got = 0;

    // 1) greedy by score with all constraints + section spread
    while (got < need) {
      let best = null;
      let bestScore = -Infinity;
      for (const q of eligible) {
        if (chosenSet.has(q.id) || usedTests.has(norm(q.tests))) continue;
        if (q.objectives.some((o) => (objCount.get(o) || 0) >= 2)) continue;
        const eff = scored.get(q.id) - 6 * (sectionCount.get(sectionOf(bank, q)) || 0);
        if (eff > bestScore) { bestScore = eff; best = q; }
      }
      if (!best) break;
      take(best); got++;
    }
    // 2) fallback: least recently seen eligible questions, still no duplicate `tests`
    if (got < need) {
      const rest = eligible.filter((q) => !chosenSet.has(q.id) && !usedTests.has(norm(q.tests)))
        .sort((a, b) => lastAt(a) - lastAt(b));
      for (const q of rest) { if (got >= need) break; take(q); got++; }
    }
    // 3) fallback: least recently seen of the whole category (also toggled-off subtopics)
    if (got < need) {
      const rest = pool.filter((q) => !chosenSet.has(q.id)).sort((a, b) => lastAt(a) - lastAt(b));
      for (const q of rest) { if (got >= need) break; take(q); got++; }
    }
    deficits[cat] = need - got;
  }
  // 4) a category had too few questions at all: fill from anywhere, least recently seen first.
  const missing = Object.values(deficits).reduce((a, b) => a + b, 0);
  if (missing > 0) {
    const rest = bank.questions.filter((q) => !chosenSet.has(q.id))
      .sort((a, b) => (usedTests.has(norm(a.tests)) - usedTests.has(norm(b.tests))) || (lastAt(a) - lastAt(b)));
    for (const q of rest.slice(0, missing)) take(q);
  }

  const ordered = shuffle(chosen, rng);
  return {
    questionIds: ordered.map((q) => q.id),
    optionOrders: ordered.map(() => shuffle([0, 1, 2], rng)),
  };
}

// ------------------------------------------------------------------ exams
function newExam(bank, state, rng, now = Date.now(), timerMinutes = EXAM_MINUTES) {
  const picked = pickExam(bank, state, state.settings, rng, now);
  const timed = !!state.settings.timer;
  const { qById } = idx(bank);
  return {
    id: "ex-" + now.toString(36) + "-" + Math.floor(rng() * 1e6).toString(36),
    startedAt: now,
    timed,
    deadline: timed ? now + timerMinutes * 60 * 1000 : null,
    questionIds: picked.questionIds,
    optionOrders: picked.optionOrders,
    answers: picked.questionIds.map(() => null), // original option index chosen, or null
    flags: picked.questionIds.map(() => false),
    // question revision at exam time: a later rewrite (rev + 1) must not be reviewed against old answers
    revs: picked.questionIds.map((id) => (qById.get(id) && qById.get(id).rev) || 1),
    current: 0,
  };
}

function timeLeftMs(exam, now = Date.now()) {
  if (!exam || !exam.deadline) return null;
  return Math.max(0, exam.deadline - now);
}

function scoreExam(bank, exam) {
  const { qById } = idx(bank);
  const perCategory = {};
  for (const c of CATEGORY_KEYS) perCategory[c] = { correct: 0, total: 0 };
  let score = 0;
  let unanswered = 0;
  exam.questionIds.forEach((qid, i) => {
    const q = qById.get(qid);
    const cat = q ? q.category : "onbekend";
    const pc = perCategory[cat] || (perCategory[cat] = { correct: 0, total: 0 });
    pc.total++;
    const a = exam.answers[i];
    if (a === null || a === undefined) { unanswered++; return; }
    if (q && a === q.answer) { score++; pc.correct++; }
  });
  return { score, total: exam.questionIds.length, perCategory, unanswered, passed: score >= PASS_MARK };
}

// Submitting records answered questions (not blanks) and appends the exam to history.
function submitExam(bank, state, now = Date.now(), auto = false) {
  const exam = state.inProgress;
  if (!exam) return state;
  const { qById } = idx(bank);
  const res = scoreExam(bank, exam);
  const answers = { ...state.answers };
  const at = Math.min(now, exam.deadline || now);
  exam.questionIds.forEach((qid, i) => {
    const a = exam.answers[i];
    const q = qById.get(qid);
    if (a === null || a === undefined || !q) return;
    answers[qid] = [...(answers[qid] || []), { at, correct: a === q.answer, mode: "exam" }];
  });
  const record = {
    ...exam,
    submittedAt: at,
    durationMs: Math.max(0, at - exam.startedAt),
    score: res.score,
    total: res.total,
    perCategory: res.perCategory,
    unanswered: res.unanswered,
    passed: res.passed,
    autoSubmitted: !!auto,
    // per-question result at submit time (null = blank), so reviews survive later question rewrites
    correct: exam.questionIds.map((qid, i) => {
      const a = exam.answers[i];
      const q = qById.get(qid);
      return a === null || a === undefined || !q ? null : a === q.answer;
    }),
  };
  delete record.current;
  return { ...state, answers, exams: [...state.exams, record], inProgress: null };
}

// Abandoned exams don't count anywhere.
function abandonExam(state) {
  return { ...state, inProgress: null };
}

function recordPractice(state, qid, correct, now = Date.now()) {
  const answers = { ...state.answers };
  answers[qid] = [...(answers[qid] || []), { at: now, correct: !!correct, mode: "practice" }];
  return { ...state, answers };
}

// ------------------------------------------------------------------ practice sets
// scope: { kind: "category"|"subtopic"|"chapter"|"section"|"wrong"|"unseen"|"mix"|"objectives", value }
function practiceSet(bank, state, scope, n, rng, now = Date.now()) {
  const answers = state.answers || {};
  let pool = bank.questions;
  const kind = scope && scope.kind;
  if (kind === "category") pool = pool.filter((q) => q.category === scope.value);
  else if (kind === "subtopic") pool = pool.filter((q) => q.subtopic === scope.value);
  else if (kind === "chapter") pool = pool.filter((q) => chapterOf(sectionOf(bank, q)) === scope.value);
  else if (kind === "section") pool = pool.filter((q) => sectionOf(bank, q) === scope.value);
  else if (kind === "wrong") pool = pool.filter((q) => { const a = lastAnswer(answers, q.id); return a && !a.correct; });
  else if (kind === "unseen") pool = pool.filter((q) => !lastAnswer(answers, q.id));
  else if (kind === "objectives") {
    const set = new Set(scope.value || []);
    pool = pool.filter((q) => q.objectives.some((o) => set.has(o)));
  }
  const cov = coverage(bank, answers);
  const uncovered = new Set(Object.keys(cov.perObjective).filter((k) => !cov.perObjective[k].seen));
  let ordered;
  if (kind === "objectives") {
    // one question per objective first (best-scored), then the rest
    const set = scope.value || [];
    const byPriority = (a, b) => b._p - a._p;
    const scored = pool.map((q) => ({ q, _p: questionPriority(q, answers, now, uncovered, rng) })).sort(byPriority);
    const first = [];
    const used = new Set();
    for (const oid of set) {
      const hit = scored.find((x) => !used.has(x.q.id) && x.q.objectives.includes(oid));
      if (hit) { first.push(hit.q); used.add(hit.q.id); }
    }
    ordered = [...first, ...scored.filter((x) => !used.has(x.q.id)).map((x) => x.q)];
  } else if (kind === "mix") {
    ordered = pool.map((q) => ({ q, p: questionPriority(q, answers, now, uncovered, rng) }))
      .sort((a, b) => b.p - a.p).map((x) => x.q);
  } else {
    ordered = shuffle(pool, rng);
  }
  const limit = n && n > 0 ? n : ordered.length;
  const ids = ordered.slice(0, limit).map((q) => q.id);
  return { questionIds: ids, optionOrders: ids.map(() => shuffle([0, 1, 2], rng)) };
}

// ------------------------------------------------------------------ study list
function studyList(bank, answers, category = null) {
  const cov = coverage(bank, answers);
  return bank.objectives
    .filter((o) => !cov.perObjective[o.id].mastered)
    .filter((o) => !category || o.category === category)
    .map((o) => ({ ...o, seen: cov.perObjective[o.id].seen }));
}

}

// ===================================================================== glossary (woordhulp)
// Mirrors tools/validate_glossary.py: case-insensitive, whole words (a word character is a letter,
// digit, _ or -), longest form first, any whitespace run matches a space, ' matches ’.
const GLOSSARY_KINDS = [
  { key: "examentaal", label: "Examentaal" },
  { key: "water", label: "In het water" },
  { key: "regels", label: "Regels en rollen" },
];
const normForm = (s) => String(s).toLowerCase().replace(/’/g, "'").replace(/\s+/g, " ").trim();

function formPattern(form) {
  return form.split(/(\s+)/).map((part) => (/^\s+$/.test(part) ? "\\s+" : part
    .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
    .replace(/'/g, "['’]"))).join("");
}

function glossaryMatcher(glossary) {
  const formToId = new Map();
  for (const e of glossary || []) for (const f of e.forms || []) formToId.set(normForm(f), e.id);
  if (!formToId.size) return null;
  const forms = [...formToId.keys()].sort((a, b) => b.length - a.length);
  const W = "\\p{L}\\p{N}_\\-";
  const rx = new RegExp(`(^|[^${W}])(${forms.map(formPattern).join("|")})(?=$|[^${W}])`, "giu");
  return { rx, formToId };
}

// Split text into plain and term segments: [{ text }, { text, id }, ...].
// hide: ids not to mark (words the user knows). once: ids already marked; each id is marked once
// and added to `once`, so one Set can span the question, its options and the explanation.
function splitTerms(text, matcher, { hide, once } = {}) {
  const s = String(text ?? "");
  if (!matcher) return [{ text: s }];
  const out = [];
  let last = 0;
  matcher.rx.lastIndex = 0;
  let m;
  while ((m = matcher.rx.exec(s))) {
    const start = m.index + m[1].length;
    const word = m[2];
    const id = matcher.formToId.get(normForm(word));
    if (!id || (hide && hide.has(id)) || (once && once.has(id))) continue;
    if (once) once.add(id);
    if (start > last) out.push({ text: s.slice(last, start) });
    out.push({ text: word, id });
    last = start + word.length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });
  return out;
}

// Ids of all glossary terms in these texts, in order of first appearance.
function termsIn(texts, matcher, hide) {
  const once = new Set();
  for (const t of texts) splitTerms(t, matcher, { hide, once });
  return [...once];
}

// For the word list: how many questions use each term.
function termQuestionCounts(questions, matcher) {
  const counts = {};
  for (const q of questions) {
    for (const id of termsIn([q.question, ...q.options, q.explanation], matcher)) counts[id] = (counts[id] || 0) + 1;
  }
  return counts;
}

// Accent- and case-insensitive search key ("orienteren" finds "oriënteren").
const searchKey = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/’/g, "'");

function filterGlossary(glossary, { query = "", kind = "alles", known = new Set() } = {}) {
  const q = searchKey(query.trim());
  return glossary.filter((e) => {
    if (kind === "bekend" ? !known.has(e.id) : kind !== "alles" && e.kind !== kind) return false;
    if (!q) return true;
    return [e.term, ...e.forms].some((x) => searchKey(x).includes(q));
  });
}

// Review helper: has this question been rewritten since the exam, and was the answer right at the time?
// Older exam records have no revs/correct; then the rewrite is detected by rev > 1 and the result is looked
// up in the answer history (exam answers are recorded with at === submittedAt).
function reviewRow(exam, i, q, answers) {
  const examRev = (exam.revs && exam.revs[i]) || 1;
  const changed = !!q && ((q.rev || 1) !== examRev);
  const a = exam.answers[i];
  if (a === null || a === undefined) return { changed, status: "blank" };
  let ok;
  if (exam.correct) ok = exam.correct[i];
  else if (!changed) ok = !!q && a === q.answer;
  else {
    const hit = ((answers || {})[exam.questionIds[i]] || []).find((x) => x.mode === "exam" && x.at === exam.submittedAt);
    ok = hit ? hit.correct : null;
  }
  return { changed, status: ok === true ? "right" : ok === false ? "wrong" : "unknown" };
}

// ----- routing: every screen gets a #hash so the browser/phone back button works.
// Hash changes need no server support, so this works on file:// and on GitHub Pages.
const ROUTES = {
  dashboard: "", examIntro: "examen", resume: "examen/open", exam: "examen/bezig",
  results: "uitslag", review: "nakijken", practiceSetup: "oefenen", practice: "oefenen/ronde",
  progress: "voortgang", settings: "instellingen", glossary: "woorden",
};
const normHash = (x) => (x || "").replace(/^#/, "");
function hashFor(name, extra) {
  let r = ROUTES[name] ?? "";
  if ((name === "results" || name === "review") && extra && Number.isInteger(extra.examIndex)) r += "/" + extra.examIndex;
  return r;
}
function parseHash(hash) {
  const r = normHash(hash);
  const m = /^(uitslag|nakijken)\/(\d+)$/.exec(r);
  if (m) return { name: m[1] === "uitslag" ? "results" : "review", examIndex: Number(m[2]) };
  const name = Object.keys(ROUTES).find((k) => ROUTES[k] === r);
  return { name: name || "dashboard" };
}

function setHash(route, replace) {
  if (normHash(location.hash) === route) return;
  ignoreHash = route;
  try {
    if (replace) location.replace("#" + route);
    else location.hash = route;
  } catch (e) { ignoreHash = null; }
}

// opts.replace: replace the current history entry instead of adding one
// opts.fromHistory: called from a back/forward navigation; the URL is already right
function go(name, extra, opts = {}) {
  view = { name, ...(extra || {}) };
  if (!opts.fromHistory) setHash(hashFor(name, view), !!opts.replace);
  render();
  window.scrollTo(0, 0);
}

// Decide which screen a (possibly stale) route may show right now.
function resolveRoute(target) {
  if (target.name === "exam" || target.name === "resume") return state.inProgress ? { name: "resume" } : { name: "dashboard" };
  if (target.name === "practice" && !practice) return { name: "practiceSetup" };
  if ((target.name === "results" || target.name === "review") && !state.exams[target.examIndex]) return { name: "dashboard" };
  return target;
}

window.addEventListener("hashchange", () => {
  const cur = normHash(location.hash);
  if (ignoreHash !== null && cur === ignoreHash) { ignoreHash = null; return; }
  ignoreHash = null;
  // Back while a dialog is open: just close the dialog and stay.
  const dlg = document.querySelector("dialog[open]");
  if (dlg) {
    dlg.dispatchEvent(new Event("cancel", { cancelable: true }));
    setHash(hashFor(view.name, view), false);
    return;
  }
  // Back during an exam: never leave silently; ask whether to abandon.
  if (view.name === "exam" && state.inProgress) {
    setHash(hashFor("exam"), false);
    abandonFlow();
    return;
  }
  const target = parseHash(cur);
  const next = resolveRoute(target);
  const redirected = next.name !== target.name;
  go(next.name, next, redirected ? { replace: true } : { fromHistory: true });
});

              h("button", { class: "btn small ghost", type: "button", onclick: () => { ui.reviewFilter = "alles"; go("review", { examIndex: i }); } }, "Nakijken")));

  return page(

// ===================================================================== toets layout (exam + practice)
// Follows the layout of the official online practice test: a row of round steps
// (instructions, one per question, hand in), an "answered" counter, plain radio answers
// and Vorige / overzicht / Volgende. Colours and wording are our own.
// Positions: -1 = instructions, 0..n-1 = questions, n = hand-in page.
const NARROW = 640;
const isNarrow = () => window.innerWidth <= NARROW;
const FLAG_ICON = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5" fill="none" style="stroke:currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const LIST_ICON = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" style="stroke:currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" style="fill:currentColor"/><circle cx="4.5" cy="12" r="1.5" style="fill:currentColor"/><circle cx="4.5" cy="18" r="1.5" style="fill:currentColor"/></svg>`;

// status(k): "answered" | "skipped" (seen but not answered) | ""
function stepButton(k, n, pos, status, onGo, finishLabel) {
  if (k === -1) return h("button", { type: "button", class: "step special" + (pos === -1 ? " current" : ""), "aria-label": "Instructies", "aria-current": pos === -1 ? "step" : null, onclick: () => onGo(-1) }, h("b", { "aria-hidden": "true" }, "i"));
  if (k === n) return h("button", { type: "button", class: "step special" + (pos === n ? " current" : ""), "aria-label": finishLabel, title: finishLabel, "aria-current": pos === n ? "step" : null, onclick: () => onGo(n) }, svg(FLAG_ICON));
  const st = status(k);
  return h("button", {
    type: "button", class: "step" + (st ? " " + st : "") + (pos === k ? " current" : ""),
    "aria-label": `Vraag ${k + 1}${st === "answered" ? ", beantwoord" : st === "skipped" ? ", gezien, niet beantwoord" : ""}`,
    "aria-current": pos === k ? "step" : null, onclick: () => onGo(k),
  }, String(k + 1));
}
function stepper(n, pos, status, onGo, finishLabel) {
  // On a phone only a window around the current question is shown (plus the last one);
  // the list button opens all of them.
  let ks = [...Array(n).keys()];
  if (isNarrow() && n > 7) {
    const c = Math.min(Math.max(pos, 0), n - 1);
    const start = Math.min(Math.max(c - 1, 0), n - 3);
    ks = [...Array(3).keys()].map((x) => start + x);
    if (!ks.includes(n - 1)) ks.push(n - 1);
  }
  const items = [h("li", null, stepButton(-1, n, pos, status, onGo, finishLabel))];
  ks.forEach((k, j) => {
    if (j > 0 && k !== ks[j - 1] + 1) items.push(h("li", { class: "gap", "aria-hidden": "true" }, "…"));
    items.push(h("li", null, stepButton(k, n, pos, status, onGo, finishLabel)));
  });
  items.push(h("li", null, stepButton(n, n, pos, status, onGo, finishLabel)));
  return h("nav", { "aria-label": "Vragen" }, h("ol", { class: "steps" }, items));
}
function openStepList(n, pos, status, onGo, finishLabel) {
  const pick = (k) => {
    const dlg = document.querySelector("dialog[open]");
    if (dlg) dlg.dispatchEvent(new Event("cancel", { cancelable: true }));
    onGo(k);
  };
  const all = [-1, ...Array(n).keys(), n].map((k) => stepButton(k, n, pos, status, pick, finishLabel));
  dialog({
    title: "Vragen",
    body: [h("div", { class: "steps all" }, all),
      h("div", { class: "step-legend" },
        h("span", null, h("i", { class: "answered" }), "beantwoord"),
        h("span", null, h("i", { class: "skipped" }), "gezien, niet beantwoord"),
        h("span", null, h("i"), "nog niet gezien"))],
    actions: [{ label: "Sluiten", value: null, cls: "" }],
  });
}
function radioAnswers(q, order, ctx, { chosen, locked, onPick, marks }) {
  return h("div", { class: "radios", role: "radiogroup", "aria-labelledby": "qtext" },
    order.map((orig) => {
      const mark = marks ? marks(orig) : "";
      // Locked answers are not `disabled`: WebKit (iPhone) then swallows taps on everything inside
      // the label, including the underlined words. Instead, clicks are cancelled and any change is undone.
      return h("label", { class: "radio" + (mark ? " " + mark : "") + (locked ? " locked" : "") },
        h("input", {
          type: "radio", name: "antwoord", value: String(orig), checked: chosen === orig, "aria-disabled": locked ? "true" : null,
          onclick: locked ? (ev) => ev.preventDefault() : null,
          onchange: () => (locked ? render() : onPick(orig)),
        }),
        h("span", { class: "radio-text" }, rich(q.options[orig], ctx),
          mark === "correct" ? h("span", { class: "mark" }, " ✓", h("span", { class: "sr-only" }, " juist antwoord")) : null,
          mark === "wrong" ? h("span", { class: "mark" }, " ✗", h("span", { class: "sr-only" }, " jouw antwoord, fout")) : null));
    }));
}
function questionText(i, n, q, ctx) {
  return h("p", { class: "qtext", id: "qtext", tabindex: "-1" },
    h("span", { class: "qno", "aria-hidden": "true" }, `${i + 1}.`), h("span", { class: "sr-only" }, `Vraag ${i + 1} van ${n}: `), " ",
    rich(q.question, ctx));
}
function toetsNav({ pos, n, onMove, onList, middle, nextPrimary = true }) {
  return h("div", { class: "toets-nav" },
    h("button", { class: "btn square", type: "button", disabled: pos <= -1, onclick: () => onMove(-1) }, "Vorige"),
    h("button", { class: "btn square icon", type: "button", "aria-label": "Alle vragen", title: "Alle vragen", onclick: onList }, svg(LIST_ICON)),
    middle || null,
    pos < n ? h("button", { class: "btn square" + (nextPrimary ? " primary" : ""), type: "button", id: "next-btn", onclick: () => onMove(1) }, "Volgende") : null);
}
function focusToets() {
  const t = document.getElementById("qtext") || document.getElementById("toets-title");
  if (t) t.focus({ preventScroll: true });
}

// ===================================================================== exam: question screen
const examPos = (ex) => (ui.examPage === "info" ? -1 : ui.examPage === "finish" ? ex.questionIds.length : Math.min(Math.max(ex.current || 0, 0), ex.questionIds.length - 1));
const examVisited = (ex) => ex.visited || ex.answers.map((a) => a !== null);
function examStatus(ex) {
  const seen = examVisited(ex);
  return (k) => (ex.answers[k] !== null ? "answered" : seen[k] ? "skipped" : "");
}

function renderExam() {
  const ex = state.inProgress;
  if (!ex) return renderDashboard();
  document.body.classList.add("exam-mode");
  const n = ex.questionIds.length;
  const pos = examPos(ex);
  const answeredCount = ex.answers.filter((a) => a !== null).length;
  const status = examStatus(ex);

  const head = h("header", { class: "exam-head" }, h("div", { class: "wrap" },
    h("span", { class: "title" }, "Oefenexamen", h("span", { class: "wide-only" }, " Zwem-ABC")),
    h("span", { class: "spacer" }),
    h("button", { class: "btn small ghost", type: "button", onclick: abandonFlow }, "Afbreken"),
    h("div", { class: "timer", id: "timer", role: "timer", "aria-label": "Resterende tijd" }, ex.timed ? formatDuration(timeLeftMs(ex)) : "—")));

  const body = [];
  let wctx = null;
  let helpTexts = null;
  if (pos === -1) {
    const timed = ex.timed;
    body.push(h("h2", { class: "toets-title", id: "toets-title", tabindex: "-1" }, "Instructies"),
      h("p", null, `Het oefenexamen bestaat uit ${n} vragen.`),
      h("p", null, "Alle vragen zijn meerkeuzevragen. Per vraag is steeds maar één antwoord goed."),
      h("p", null, timed ? `Je hebt ${EXAM_MINUTES} minuten. Bij 0:00 wordt automatisch ingeleverd.` : "Je hebt geen tijdslimiet (aan te passen in Instellingen)."),
      h("p", null, "Je ziet pas na het inleveren welke antwoorden goed waren."),
      h("div", { class: "toets-nav" }, h("button", { class: "btn square primary", type: "button", id: "next-btn", onclick: () => moveExam(1) }, "Volgende")));
  } else if (pos === n) {
    const open = n - answeredCount;
    body.push(h("p", { class: "finish-q", id: "toets-title", tabindex: "-1" }, "Weet je zeker dat je wilt inleveren? Daarna kun je je antwoorden niet meer aanpassen."),
      open ? h("div", { class: "alert-bad", role: "status" }, h("b", null, "Let op: "), `je hebt niet alle vragen beantwoord (${open} ${open === 1 ? "vraag" : "vragen"} open). Onbeantwoorde vragen tellen als fout.`) : null,
      h("div", { class: "toets-nav" },
        h("button", { class: "btn square go", type: "button", id: "submit-btn", onclick: () => { if (state.inProgress) finishExam(false); } }, "Toets inleveren")));
  } else {
    const q = QMAP.get(ex.questionIds[pos]);
    const order = ex.optionOrders[pos];
    wctx = wordHelpOn("exam") ? termCtx() : null;
    const stem = questionText(pos, n, q, wctx);
    body.push(stem,
      radioAnswers(q, order, wctx, { chosen: ex.answers[pos], locked: false, onPick: selectExamAnswer }),
      toetsNav({ pos, n, onMove: moveExam, onList: () => openStepList(n, pos, status, examGo, "Inleveren") }));
    helpTexts = [q.question, ...order.map((o) => q.options[o])];
  }

  const card = h("section", { class: "toets", "aria-label": "Oefenexamen" },
    stepper(n, pos, status, examGo, "Inleveren"),
    h("div", { class: "toets-count", role: "status" }, `Vragen beantwoord: ${answeredCount} / ${n}`),
    body,
    wctx ? wordHelpPanel(helpTexts, { open: state.settings.wordHelpOpen, onToggle: setHelpOpen, inExam: true }) : null);
  return [head, h("main", null, h("div", { class: "wrap" }, h("div", { class: "exam-shell" }, card)))];
}

function selectExamAnswer(orig) {
  const ex = state.inProgress;
  if (!ex || ui.examPage !== "q") return;
  ex.answers[ex.current] = orig;
  commit({ ...state });
  render();
  const pos = ex.optionOrders[ex.current].indexOf(orig);
  const inputs = document.querySelectorAll(".radio input");
  if (inputs[pos]) inputs[pos].focus({ preventScroll: true });
}
function examGo(k) {
  const ex = state.inProgress;
  if (!ex) return;
  const n = ex.questionIds.length;
  if (k <= -1) ui.examPage = "info";
  else if (k >= n) ui.examPage = "finish";
  else {
    ui.examPage = "q";
    ex.current = k;
    ex.visited = examVisited(ex).slice();
    ex.visited[k] = true;
    commit({ ...state });
  }
  render();
  focusToets();
}
function moveExam(d) {
  const ex = state.inProgress;
  if (!ex) return;
  const n = ex.questionIds.length;
  const from = examPos(ex);
  const to = Math.min(Math.max(from + d, -1), n);
  if (to !== from) examGo(to);
}
function finishExam(auto) {
  commit(submitExam(BANK, state, Date.now(), auto));
  if (auto) notice = "De tijd was om. Je examen is automatisch ingeleverd met de antwoorden die je had gegeven.";
  go("results", { examIndex: state.exams.length - 1, fresh: true }, { replace: true });
}

// ----- timer
function startTimer() {
  const ex = state.inProgress;
  if (!ex || !ex.timed) return;
  const tick = () => {
    const cur = state.inProgress;
    if (!cur) return stopTimer();
    const left = timeLeftMs(cur);
    const el = document.getElementById("timer");
    if (el) {
      el.textContent = formatDuration(left);
      el.classList.toggle("warn", left <= 5 * 60 * 1000 && left > 60 * 1000);
      el.classList.toggle("crit", left <= 60 * 1000);
    }
    if (left <= 5 * 60 * 1000 && !cur.warned5 && left > 60 * 1000) {
      cur.warned5 = true; commit({ ...state }); announce("Nog 5 minuten.", true);
    }
    if (left <= 60 * 1000 && !cur.warned1 && left > 0) {
      cur.warned1 = true; cur.warned5 = true; commit({ ...state }); announce("Nog 1 minuut.", true);
    }
    if (left <= 0) {
      stopTimer();
      const dlg = document.querySelector("dialog");
      if (dlg) { try { dlg.close(); } catch (e) { /* ignore */ } dlg.remove(); }
      announce("De tijd is om. Je examen is ingeleverd.", true);
      finishExam(true);
    }
  };
  tick();
  timerHandle = setInterval(tick, 250);
}
function stopTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = null;
}

// ===================================================================== results & review
function renderResults() {
  const exams = state.exams;
  const idx = view.examIndex ?? exams.length - 1;

  if (!e) return renderDashboard();

  const quip = quipFor(e.score, rng);
  const msg = notice;
  notice = null;
  if (view.fresh && e.passed && !reducedMotion()) setTimeout(confetti, 150);
  view.fresh = false;
  const diff = prev ? e.score - prev.score : null;
  return page(
    msg ? h("p", { class: "note", role: "status" }, msg) : null,
    h("section", { class: "card result-hero" },
      h("div", { class: "kicker" }, "Uitslag oefenexamen"),
      h("div", { class: "result-score" }, `${e.score}/${e.total}`),
      h("div", { class: "result-verdict " + (e.passed ? "ok" : "bad") }, e.passed ? "Geslaagd" : "Niet geslaagd"),
      h("p", { class: "quip" }, quip),
      h("p", { class: "muted" },
        `Slaaggrens ${PASS_MARK} goed · tijd gebruikt ${formatDuration(e.durationMs)}`,
        e.unanswered ? ` · ${e.unanswered} niet beantwoord` : "",
        e.autoSubmitted ? " · automatisch ingeleverd" : ""),
      diff !== null
        ? h("p", null, h("span", { class: "pill " + (diff > 0 ? "ok" : diff < 0 ? "bad" : "") },
          diff > 0 ? `${diff} beter dan vorige keer (${prev.score})` : diff < 0 ? `${-diff} minder dan vorige keer (${prev.score})` : `Gelijk aan vorige keer (${prev.score})`))
        : h("p", { class: "muted small" }, "Je eerste examen. Vanaf nu kun je jezelf verslaan."),

async function startPractice(scope, n, label) {
  const set = practiceSet(BANK, state, scope, n, rng);
  if (set.questionIds.length === 0) {
    await infoDialog("Geen vragen gevonden", scope.kind === "wrong" ? "Je hebt (nog) niets fout beantwoord. Lekker bezig." : "In deze selectie zitten (nu) geen vragen.");
    return;
  }
  const blank = () => set.questionIds.map(() => null);
  practice = { ...set, label, i: 0, page: "q", chosen: blank(), pending: blank(), visited: set.questionIds.map((_, k) => k === 0), correct: 0, done: 0, finished: false };
  go("practice");
}

const practicePos = (p) => (p.page === "info" ? -1 : p.page === "finish" ? p.questionIds.length : p.i);
const practiceStatus = (p) => (k) => (p.chosen[k] !== null ? "answered" : p.visited[k] ? "skipped" : "");

function renderPractice() {
  if (!practice) return renderPracticeSetup();
  const p = practice;
  if (p.finished) {
    const score = p.correct;
    const total = p.done;
    const ratio = total ? score / total : 0;
    const line = ratio >= 0.9 ? "Strak gezwommen. Geen spat te veel." : ratio >= 0.725 ? "Mooi baantje. Nog even doortrainen." : "Dat was even watertrappen. Volgende ronde gaat beter.";
    return page(h("section", { class: "card result-hero", style: "max-width:640px;margin:0 auto" },
      h("div", { class: "kicker" }, `Oefenen · ${p.label}`),
      h("div", { class: "result-score" }, `${score}/${total}`),
      h("p", { class: "quip" }, line),
      h("div", { class: "btn-row", style: "justify-content:center" },
        h("button", { class: "btn primary", type: "button", onclick: () => go("practiceSetup") }, "Nog een ronde"),
        h("button", { class: "btn", type: "button", onclick: () => go("progress") }, "Bekijk voortgang"),
        h("button", { class: "btn ghost", type: "button", onclick: () => go("dashboard") }, "Naar overzicht"))));
  }
  const n = p.questionIds.length;
  const pos = practicePos(p);
  const status = practiceStatus(p);
  const body = [];
  let wctx = null;
  let helpTexts = null;
  if (pos === -1) {
    body.push(h("h2", { class: "toets-title", id: "toets-title", tabindex: "-1" }, "Instructies"),
      h("p", null, `Deze oefenronde bestaat uit ${n} ${n === 1 ? "vraag" : "vragen"}.`),
      h("p", null, "Alle vragen zijn meerkeuzevragen. Per vraag is steeds maar één antwoord goed."),
      h("p", null, "Kies een antwoord en druk op Controleer. Je ziet dan meteen of het klopt, met uitleg en bron. Tot je op Controleer drukt, kun je nog wisselen."),
      h("div", { class: "toets-nav" }, h("button", { class: "btn square primary", type: "button", id: "next-btn", onclick: () => movePractice(1) }, "Volgende")));
  } else if (pos === n) {
    const open = n - p.done;
    body.push(h("p", { class: "finish-q", id: "toets-title", tabindex: "-1" }, `Klaar met oefenen? Je hebt ${p.done} van de ${n} vragen gecontroleerd en ${p.correct} goed.`),
      open ? h("div", { class: "alert-bad", role: "status" }, h("b", null, "Let op: "), `${open} ${open === 1 ? "vraag heb" : "vragen heb"} je nog niet gecontroleerd. Die tellen niet mee.`) : null,
      h("div", { class: "toets-nav" },
        h("button", { class: "btn square", type: "button", onclick: () => movePractice(-1) }, "Vorige"),
        h("button", { class: "btn square go", type: "button", id: "finish-btn", onclick: () => { p.finished = true; render(); window.scrollTo(0, 0); } }, "Ronde afronden")));
  } else {
    const q = QMAP.get(p.questionIds[pos]);
    const order = p.optionOrders[pos];
    const chosen = p.chosen[pos];
    const answered = chosen !== null;
    const isRight = answered && chosen === q.answer;
    wctx = wordHelpOn("practice") ? termCtx() : null;
    const stem = questionText(pos, n, q, wctx);
    // Two steps: choosing an answer only selects it (changeable); "Controleer" checks it.
    // After checking, the radios are disabled; the underlined words inside them stay tappable.
    const answers = radioAnswers(q, order, wctx, {
      chosen: answered ? chosen : p.pending[pos], locked: answered, onPick: selectPractice,
      marks: answered ? (orig) => (orig === q.answer ? "correct" : orig === chosen ? "wrong" : "") : null,
    });
    const explanation = answered ? rich(q.explanation, wctx) : null;
    body.push(stem, answers,
      answered ? h("div", { class: "feedback " + (isRight ? "ok" : "bad") },
        h("div", { class: "verdict" }, isRight ? "Goed!" : "Helaas. Het juiste antwoord is:", isRight ? null : h("span", { class: "right-answer" }, " ", q.options[q.answer])),
        h("p", null, explanation),
        h("div", { class: "ref" }, q.ref),
        sourceBlock(q)) : null,
      toetsNav({
        pos, n, onMove: movePractice, onList: () => openStepList(n, pos, status, practiceGo, "Afronden"), nextPrimary: answered,
        middle: answered ? null : h("button", { class: "btn square primary", type: "button", id: "check-btn", disabled: p.pending[pos] === null, onclick: () => answerPractice(p.pending[pos]) }, "Controleer"),
      }),
      answered ? null : h("p", { class: "muted small toets-hint" }, p.pending[pos] === null ? "Kies een antwoord en druk op Controleer." : "Je kunt nog wisselen."));
    helpTexts = [q.question, ...order.map((o) => q.options[o]), ...(answered ? [q.explanation] : [])];
  }
  return page(
    h("div", { class: "kicker", style: "margin-bottom:10px" }, `Oefenen · ${p.label}`),
    h("section", { class: "toets", "aria-label": "Oefenronde" },
      stepper(n, pos, status, practiceGo, "Afronden"),
      h("div", { class: "toets-count", role: "status" }, `Vragen beantwoord: ${p.done} / ${n}`, p.done ? ` · ${p.correct} goed` : ""),
      body,
      wctx ? wordHelpPanel(helpTexts, { open: state.settings.wordHelpOpen, onToggle: setHelpOpen }) : null));
}

function practiceGo(k) {
  const p = practice;
  if (!p) return;
  const n = p.questionIds.length;
  if (k <= -1) p.page = "info";
  else if (k >= n) p.page = "finish";
  else { p.page = "q"; p.i = k; p.visited[k] = true; }
  render();
  focusToets();
}
function movePractice(d) {
  const p = practice;
  if (!p || p.finished) return;
  const from = practicePos(p);
  const to = Math.min(Math.max(from + d, -1), p.questionIds.length);
  if (to !== from) practiceGo(to);
}
// Step 1: select (or change) an answer; nothing is recorded yet.
function selectPractice(orig) {
  const p = practice;
  if (!p || p.page !== "q" || p.chosen[p.i] !== null) return;
  p.pending[p.i] = orig;
  render();
  const pos = p.optionOrders[p.i].indexOf(orig);
  const inputs = document.querySelectorAll(".radio input");
  if (inputs[pos]) inputs[pos].focus({ preventScroll: true });
}
// Step 2: check the selected answer; this records it.
function answerPractice(orig) {
  const p = practice;
  if (!p || p.page !== "q" || p.chosen[p.i] !== null || orig === null || orig === undefined) return;
  const q = QMAP.get(p.questionIds[p.i]);
  p.chosen[p.i] = orig;
  p.done++;
  const right = orig === q.answer;
  if (right) p.correct++;
  commit(recordPractice(state, q.id, right));
  render();
  announce(right ? "Goed!" : `Helaas, het juiste antwoord is: ${q.options[q.answer]}`);
  const nb = document.getElementById("next-btn");
  if (nb) nb.focus({ preventScroll: true });
}

  return page(
    h("h1", null, "Woordenlijst"),
    h("p", null, "Uitleg in eenvoudig Nederlands bij moeilijke woorden uit de vragen. In een vraag staat een stippellijn onder zo’n woord; de uitleg staat onder de vraag, bij ‘Woordhulp’. Ken je een woord? Kies ‘Ken ik’, dan wordt het niet meer uitgelegd."),
    h("p", { class: "note" }, "Bij vakwoorden volgt de uitleg de Examenregeling. Bij twijfel geldt altijd de tekst van de Examenregeling."),
    h("label", { class: "sr-only", for: "gl-search" }, "Zoek een woord"),
    h("input", { type: "search", id: "gl-search", class: "gl-search", placeholder: "Zoek een woord", value: ui.glQuery, autocomplete: "off",
      oninput: (ev) => { ui.glQuery = ev.target.value; fill(); } }),
    h("div", { class: "chips", role: "group", "aria-label": "Soort woord", style: "margin:12px 0 4px" }, kinds.map(([key, label, n]) =>
      h("button", { class: "chip", type: "button", "aria-pressed": String(ui.glKind === key), onclick: () => { ui.glKind = key; render(); } }, `${label} (${n})`))),
    count,
    list);
}
function glossaryItem(e, known) {
  const isKnown = known.has(e.id);
  const n = termCounts[e.id] || 0;
  const meta = [n ? `In ${n} ${n === 1 ? "vraag" : "vragen"}` : null, e.ref ? `Bron: ${e.ref}` : null].filter(Boolean).join(" · ");
  return h("article", { class: "gl-item" + (isKnown ? " is-known" : ""), id: "w-" + e.id },
    h("div", { class: "gl-head" },
      h("h2", { class: "gl-term" }, e.term),
      h("span", { class: "pill" }, kindLabel(e.kind)),
      h("span", { class: "spacer" }),
      h("button", { class: "btn small" + (isKnown ? "" : " ghost"), type: "button", "aria-pressed": String(isKnown),
        "aria-label": isKnown ? `${e.term} weer uitleggen` : `Ken ik: ${e.term} niet meer uitleggen`,
        onclick: () => {
          setKnown(e.id, !isKnown);
          render();
          const btn = document.querySelector(`#w-${e.id} .gl-head button`);
          if (btn) btn.focus({ preventScroll: true });
        } }, isKnown ? "Weer uitleggen" : "Ken ik")),
    h("p", null, e.uitleg),
    meta ? h("p", { class: "muted small" }, meta) : null);
}

function renderSettings() {
  const s = state.settings;
  const counts = { ...(ui.draftCounts || s.counts) };
  const total = CATEGORY_KEYS.reduce((a, k) => a + (Number(counts[k]) || 0), 0);
  const setSetting = (patch) => { commit({ ...state, settings: { ...state.settings, ...patch } }); applyTheme(); render(); };
  const fileInput = h("input", { type: "file", accept: "application/json,.json", id: "import-file", class: "sr-only", onchange: importFlow });
  return page(
    h("h1", null, "Instellingen"),
    h("fieldset", null, h("legend", null, "Oefenexamen"),
      h("label", { class: "check" }, h("input", { type: "checkbox", checked: !s.timer, onchange: (ev) => setSetting({ timer: !ev.target.checked }) }), "Zonder tijdsdruk (geen timer)"),
      h("label", { class: "check" }, h("input", { type: "checkbox", checked: s.includeMaatwerk, onchange: (ev) => setSetting({ includeMaatwerk: ev.target.checked }) }), "Vragen over maatwerk examenprogramma's meenemen"),
      h("label", { class: "check" }, h("input", { type: "checkbox", checked: s.includeCertificaten, onchange: (ev) => setSetting({ includeCertificaten: ev.target.checked }) }), "Vragen over zwemcertificaten meenemen")),
    h("fieldset", null, h("legend", null, "Woordhulp"),
      h("label", { class: "check" }, h("input", { type: "checkbox", id: "set-wordhelp", checked: s.wordHelp, onchange: (ev) => setSetting({ wordHelp: ev.target.checked }) }),
        "Moeilijke woorden uitleggen (stippellijn onder het woord, uitleg onder de vraag)"),
      h("label", { class: "check" }, h("input", { type: "checkbox", id: "set-wordhelp-exam", checked: s.wordHelpExam, disabled: !s.wordHelp, onchange: (ev) => setSetting({ wordHelpExam: ev.target.checked }) }),
        "Ook tijdens het oefenexamen (het echte examen heeft geen woordhulp)"),
      h("p", { class: "muted small" }, s.knownTerms.length
        ? `${s.knownTerms.length} ${s.knownTerms.length === 1 ? "woord staat" : "woorden staan"} op ‘Ken ik’ en ${s.knownTerms.length === 1 ? "wordt" : "worden"} niet uitgelegd.`
        : "Kies ‘Ken ik’ bij een woord dat je kent; dan wordt het niet meer uitgelegd."),
      h("div", { class: "btn-row" },
        h("button", { class: "btn small", type: "button", onclick: () => go("glossary") }, "Naar de woordenlijst"),
        s.knownTerms.length ? h("button", { class: "btn small", type: "button", onclick: () => setSetting({ knownTerms: [] }) }, "Alle woorden weer uitleggen") : null)),
    h("fieldset", null, h("legend", null, "Vragen per categorie"),
      h("div", { class: "count-grid" }, CATEGORIES.map((c) => [
        h("label", { for: "cnt-" + c.key }, c.label),
        h("input", { type: "number", id: "cnt-" + c.key, min: "0", max: "40", step: "1", value: counts[c.key],
          oninput: (ev) => { ui.draftCounts = { ...counts, [c.key]: Math.max(0, Math.round(Number(ev.target.value) || 0)) }; },
          onchange: () => { const d = ui.draftCounts || counts; if (validCounts(d)) { ui.draftCounts = null; setSetting({ counts: d }); } else render(); } }),
      ])),
      h("p", { class: total === EXAM_SIZE ? "muted small" : "error-text small", role: "status" }, `Totaal: ${total} (moet ${EXAM_SIZE} zijn${total === EXAM_SIZE ? " ✓" : ""}).`),
      h("p", { class: "note" }, "De echte verdeling over de categorieën is niet gepubliceerd; dit is een schatting."),
      h("button", { class: "btn small", type: "button", onclick: () => { ui.draftCounts = null; setSetting({ counts: { examenprogrammas: 10, normering: 10, algemene_bepalingen: 10, taken_verantwoordelijkheden: 10 } }); } }, "Terug naar 10/10/10/10")),
    h("fieldset", null, h("legend", null, h("label", { for: "theme" }, "Weergave")),
      h("select", { id: "theme", style: "max-width:260px", onchange: (ev) => setSetting({ theme: ev.target.value }) },
        [["auto", "Automatisch (volgt systeem)"], ["light", "Licht"], ["dark", "Donker"]].map(([v, l]) => h("option", { value: v, selected: s.theme === v }, l)))),
    h("fieldset", null, h("legend", null, "Voortgang"),
      h("p", { class: "muted small" }, "Je voortgang staat alleen in deze browser. Exporteer om hem te bewaren of mee te nemen naar een ander apparaat."),
      h("div", { class: "btn-row" },
        h("button", { class: "btn", type: "button", onclick: exportProgress }, "Exporteren (.json)"),
        h("label", { class: "btn", for: "import-file", tabindex: "0", role: "button", onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } } }, "Importeren"),
        fileInput,
        h("button", { class: "btn danger", type: "button", onclick: resetFlow }, "Voortgang wissen"))),
    h("p", { class: "muted small" }, `Vragenbank ${CONFIG.BANK_VERSION || ""} · ${BANK.questions.length} vragen · ${BANK.objectives.length} leerdoelen.`));
}

function exportProgress() {
  const payload = exportPayload(state);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: `het-diepe-voortgang-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  announce("Voortgang geëxporteerd.");
}

function importFlow(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    const res = validateImport(parsed);
    if (!res.ok) { await infoDialog("Importeren lukt niet", res.error); return; }
    const n = Object.keys(res.state.answers).length;
    const ok = await confirmDialog("Voortgang vervangen?",
      `Het bestand bevat antwoorden op ${n} vragen en ${res.state.exams.length} examens. Je huidige voortgang in deze browser wordt hierdoor vervangen.`,
      "Vervangen", true);
    if (!ok) return;
    commit(res.state);
    applyTheme();
    announce("Voortgang geïmporteerd.");
    go("progress");
  };
  reader.onerror = () => infoDialog("Importeren lukt niet", "Het bestand kon niet worden gelezen.");
  reader.readAsText(file);
}

async function resetFlow() {
  const ok = await confirmDialog("Voortgang wissen?",
    "Al je antwoorden, je examengeschiedenis en een eventueel open examen worden gewist. Je instellingen blijven bewaard. Dit kun je niet ongedaan maken (tenzij je eerst exporteert).",
    "Wissen", true);
  if (!ok) return;
  commit(resetProgress(state));
  practice = null;
  announce("Voortgang gewist.");
  go("dashboard");
}

// ===================================================================== keyboard
document.addEventListener("keydown", (ev) => {
  if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === "Escape" && termPop) { ev.preventDefault(); closeTermPop(); return; }
  if (document.querySelector("dialog[open]")) return;
  const tag = (ev.target && ev.target.tagName) || "";
  // A focused answer radio still gets the shortcuts (←/→ page instead of moving the selection).
  const onRadio = tag === "INPUT" && ev.target.type === "radio";
  if ((tag === "INPUT" && !onRadio) || tag === "SELECT" || tag === "TEXTAREA") return;
  const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  const choice = { 1: 0, 2: 1, 3: 2 }[key];
  const onButton = tag === "BUTTON" || tag === "A" || tag === "LABEL" || tag === "SUMMARY";
  if (view.name === "exam" && state.inProgress) {
    const ex = state.inProgress;
    const onQuestion = ui.examPage === "q";
    if (choice !== undefined && onQuestion) { ev.preventDefault(); selectExamAnswer(ex.optionOrders[ex.current][choice]); }
    else if (key === "ArrowRight") { ev.preventDefault(); moveExam(1); }
    else if (key === "ArrowLeft") { ev.preventDefault(); moveExam(-1); }
    else if (key === "Enter" && onQuestion && !onButton) { ev.preventDefault(); moveExam(1); }
  } else if (view.name === "practice" && practice && !practice.finished) {
    const p = practice;
    const onQuestion = p.page === "q";
    const checked = onQuestion && p.chosen[p.i] !== null;
    if (choice !== undefined && onQuestion && !checked) { ev.preventDefault(); selectPractice(p.optionOrders[p.i][choice]); }
    else if (key === "ArrowRight") { ev.preventDefault(); movePractice(1); }
    else if (key === "ArrowLeft") { ev.preventDefault(); movePractice(-1); }
    else if (key === "Enter" && onQuestion && !onButton) {
      if (!checked && p.pending[p.i] !== null) { ev.preventDefault(); answerPractice(p.pending[p.i]); }
      else if (checked) { ev.preventDefault(); movePractice(1); }
    }
  }
});

// The question row shows fewer steps on a phone; re-render when crossing that width.
window.addEventListener("resize", () => {
  if (view.name !== "exam" && view.name !== "practice") return;
  const small = isNarrow();
  if (small !== ui.lastSmall) { ui.lastSmall = small; render(); }
});
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => { if (state.settings.theme === "auto") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
}

// ===================================================================== start
function boot() {
  applyTheme();
  renderBanner();
  ui.lastSmall = isNarrow();
  const ex = state.inProgress;
  if (ex) {
    const unknown = ex.questionIds.some((id) => !QMAP.has(id));
    // a question rewritten since the exam started: its stored answer index no longer fits the new options
    const rewritten = !unknown && ex.questionIds.some((id, i) => (QMAP.get(id).rev || 1) !== ((ex.revs && ex.revs[i]) || 1));
    if (unknown || rewritten || !Array.isArray(ex.answers)) {
      commit(abandonExam(state));
      notice = null;
      go("dashboard", null, { replace: true });
      infoDialog("Open examen vervallen", "De vragenbank is bijgewerkt sinds je dit examen startte. Het open examen is daarom vervallen en telt nergens mee.");
      return;
    }
    if (ex.timed && timeLeftMs(ex) <= 0) {
      commit(submitExam(BANK, state, Date.now(), true));
      notice = "Je had nog een examen open, maar de tijd was al om. Het is automatisch ingeleverd met de antwoorden die je had gegeven.";
      go("results", { examIndex: state.exams.length - 1, fresh: true }, { replace: true });
      return;
    }
    go("resume", null, { replace: true });
    return;
  }
  const next = resolveRoute(parseHash(location.hash));
  go(next.name, next, { replace: true });
}
boot();
</script>
