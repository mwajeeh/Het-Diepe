as","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-05"],"question":"De onderdelen B.9 en C.11 gaan over voortbewegen op de rug. Onder welk basiselement staan deze onderdelen?","options":["Drijven","Voortbewegen","Draaien"],"answer":0,"explanation":"B.9 en C.11 staan bij het basiselement Drijven, onder 'Drijven en verplaatsen met gebruik van de armen'. Ze staan niet bij Voortbewegen, waar de zwemslagen, het conditiezwemmen en het gekleed zwemmen staan, en ook niet bij Draaien. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.9 en C.11 vallen onder het basiselement Drijven","source":{"page":55,"quote":"Onderdelen Drijven en verplaatsen met gebruik van de armen B.9 5 meter hoofdwaarts"}},{"id":"EP-0074","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-06"],"question":"Een deel van de onderdelen wordt gekleed uitgevoerd. Welke naam geeft de Examenregeling aan deze onderdelen samen?","options":["Survival","Voortbewegen","Te water gaan"],"answer":0,"explanation":"Een (steeds groter) deel van de onderdelen wordt gekleed uitgevoerd; die worden samengevat onder de noemer 'survival'. Voortbewegen en Te water gaan zijn andere basiselementen, met maar een deel van de gekleed uitgevoerde onderdelen. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"gekleed uitgevoerde onderdelen heten survival","source":{"page":64,"quote":"Deze onderdelen worden hier samengevat onder de noemer ‘survival’."}},{"id":"EP-0075","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-07","EP-BASE-06"],"question":"Welk onderdeel van Zwemdiploma A hoort NIET bij survival?","options":["A.6: 5 seconden drijven op de buik","A.9: 15 seconden gekleed watertrappen","A.17: 12,5 meter gekleed zwemmen"],"answer":0,"explanation":"Survival-onderdelen worden gekleed uitgevoerd, zoals A.9 gekleed watertrappen en A.17 gekleed zwemmen. A.6 drijven op de buik wordt niet gekleed uitgevoerd. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma A","source":{"page":64,"quote":"A.1 voetsprong voorwaarts, gekleed A.9 15 seconden gekleed watertrappen A.17 12,5 meter gekleed zwemmen"},"rev":2},{"id":"EP-0076","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-06","EP-DIPB-02"],"question":"Welk onderdeel van Zwemdiploma B hoort NIET bij survival?","options":["B.2: van de kant in het water duiken","B.5: gekleed onder een drijvend voorwerp door zwemmen","B.1: achterwaarts te water gaan, gekleed"],"answer":0,"explanation":"B.2 duiken wordt niet gekleed uitgevoerd en is dus geen survival-onderdeel. B.1 achterwaarts te water gaan en B.5 gekleed onder een drijvend voorwerp door zwemmen worden wel gekleed uitgevoerd. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma B","source":{"page":64,"quote":"B.1 achterwaarts te water gaan, gekleed B.5 gekleed onder een drijvend voorwerp door zwemmen"},"rev":2},{"id":"EP-0077","category":"examenprogrammas","subtopic":"basiselementen","type":"stellingen","objectives":["EP-BASE-06"],"question":"Survival-onderdelen van Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: Onderdeel C.6 'gekleed onder een drijvend voorwerp door zwemmen' hoort bij survival.\nStelling 2: Onderdeel C.9 '15 seconden drijven op de rug' hoort bij survival.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: C.6 staat in de lijst van survival-onderdelen, want het wordt gekleed uitgevoerd. Stelling 2 is onjuist: C.9 drijven op de rug zit in proef C5 en wordt niet gekleed uitgevoerd. §4.2.7, p. 64","ref":"§4.2.7, p. 64","tests":"survival-onderdelen bij Zwemdiploma C","source":{"page":64,"quote":"C.12 15 seconden gekleed watertrappen C.6 gekleed onder een drijvend voorwerp door zwemmen"},"rev":2},{"id":"EP-0078","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-DIPC-05","EP-BASE-06"],"question":"Welk onderdeel van de proef Survival komt alleen bij Zwemdiploma C voor?","options":["Gekleed over een drijvend voorwerp heen klimmen","Gekleed onder een drijvend voorwerp door zwemmen","Zelfstandig uit het water op de kant klimmen"],"answer":0,"explanation":"Over een drijvend voorwerp heen klimmen (C.22) komt alleen bij C voor. Onder een drijvend voorwerp door zwemmen hoort bij B en C (B.5, C.6). Zelfstandig uit het water op de kant klimmen hoort bij A, B en C (A.18, B.19, C.21). §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"over een drijvend voorwerp klimmen alleen bij C","source":{"page":65,"quote":"C.22 1 keer gekleed over een drijvend voorwerp heen klimmen"},"rev":2},{"id":"EP-0079","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-MAAT-04"],"question":"Proef B5 Je vertrouwd voelen in het water, Zwemdiploma B:\nEen Licentiehouder wil de proef omdraaien. Eerst komt dan het drijven met een drijvend voorwerp. Daarna volgen de sprong en het drijven op de rug. Mag dat in het standaard examenprogramma?","options":["Nee, de onderdelen hebben een vaste volgorde.","Ja, de volgorde binnen een proef is vrij.","Ja, als alle onderdelen worden getoond."],"answer":0,"explanation":"In het standaard examenprogramma worden de onderdelen van een proef in de beschreven volgorde uitgevoerd. B5 begint met de sprong en het drijven op de rug, en eindigt met het drijven met een drijvend voorwerp. Een vrije volgorde mag dus niet, ook niet als alle onderdelen worden getoond. Bijlage 1","ref":"Bijlage 1","tests":"B5: volgorde onderdelen vastgelegd","source":{"page":"Bijlage 1","quote":"De onderdelen van de proeven dienen in de vastgestelde, in de Examenregeling Nationale Zwemdiploma’s beschreven, volgorde te worden uitgevoerd."},"rev":2},{"id":"EP-0080","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"stellingen","objectives":["AB-DEF-11"],"question":"Standaard examenprogramma Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: De proef 'Je vertrouwd voelen in het water' hoort bij dit examenprogramma.\nStelling 2: Dit examenprogramma bevat vijf proeven.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de proef Je vertrouwd voelen in het water komt alleen bij A (A5) en B (B5) voor. Stelling 2 is juist: het standaard examenprogramma heeft zes proeven voor A en B, en vijf proeven voor C. §1.1.1–1.1.3, p. 7–12 en Bijlage 1","ref":"§1.1.1–1.1.3, p. 7–12 en Bijlage 1","tests":"Zwemdiploma C heeft geen proef Je vertrouwd voelen in het water","source":{"page":"Bijlage 1","quote":"In het standaard examenprogramma zijn zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen."},"rev":2},{"id":"EP-0081","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-DIPA-01","EP-DIPB-01","EP-DIPC-01"],"question":"Proef Survival:\nHoe lang duurt het gekleed watertrappen bij Zwemdiploma A, B en C?","options":["A 15, B 15 en C 15 seconden","A 15, B 15 en C 30 seconden","A 15, B 60 en C 30 seconden"],"answer":0,"explanation":"Het gekleed watertrappen duurt bij A, B en C 15 seconden (A.9, B.11, C.12). 30 seconden is bij C de duur van het watertrappen in proef C5. 60 seconden is de duur van het watertrappen in A6 en B6. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"gekleed watertrappen 15 seconden bij A, B en C","source":{"page":57,"quote":"A.9, B.11, C.12 15 seconden gekleed watertrappen"},"rev":2},{"id":"EP-0082","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-02","EP-VERG-09"],"question":"Welk onderdeel staat NIET in de lijst Onderdelen Zwemdiploma B van Bijlage 2?","options":["30 seconden watertrappen met de benen","20 seconden drijven met gebruik van een hulpmiddel","6 meter onder water zwemmen"],"answer":0,"explanation":"30 seconden watertrappen met de benen is onderdeel C.14 en komt alleen bij C voor. 20 seconden drijven met gebruik van een hulpmiddel (B.8) en 6 meter onder water zwemmen (B.4) staan wel in de lijst van B. Bijlage 2","ref":"Bijlage 2","tests":"onderdelen B: geen watertrappen met alleen de benen","source":{"page":"Bijlage 2","quote":"C.14 30 seconden watertrappen met de benen"}},{"id":"EP-0083","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-02","EP-DIPA-02"],"question":"Welk onderdeel staat NIET in de lijst Onderdelen Zwemdiploma A van Bijlage 2?","options":["Gekleed onder een drijvend voorwerp door zwemmen","60 seconden watertrappen met armen en benen","Zelfstandig uit het water op de kant klimmen, gekleed"],"answer":0,"explanation":"Gekleed onder een drijvend voorwerp door zwemmen is B.5 en C.6; bij A komt het niet voor. 60 seconden watertrappen met armen en benen (A.10) en zelfstandig uit het water op de kant klimmen, gekleed (A.18) staan wel in de lijst van A. Bijlage 2","ref":"Bijlage 2","tests":"onderdelen A: geen drijvend voorwerp","source":{"page":"Bijlage 2","quote":"A.10 60 seconden watertrappen met armen en benen A.11 2 keer, al watertrappend"}},{"id":"EP-0200","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-01"],"question":"Voor welke kandidaten zijn de Zwemcertificaten A, B en C ontwikkeld?","options":["Voor een kleine groep kandidaten met een beperking","Voor alle jonge kandidaten, als vaste tussenstap","Voor kandidaten met een maatwerk examenprogramma"],"answer":0,"explanation":"De zwemcertificaten zijn er voor een relatief kleine groep kandidaten met tijdelijke of permanente beperkingen. Zij halen het zwemdiploma niet, of pas na een heel lange oefenperiode. In principe worden alle kandidaten opgeleid voor de zwemdiploma's, en een maatwerk examenprogramma is iets anders. §1.2, p. 13","ref":"§1.2, p. 13","tests":"doelgroep zwemcertificaten: kandidaten met beperking","source":{"page":13,"quote":"groep kandidaten met tijdelijke of permanente beperkingen niet, of slechts na een heel lange oefenperiode, in staat zijn om het Zwemdiploma A, B of C te halen"},"rev":2},{"id":"EP-0201","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-04","EP-CERT-01"],"question":"Zwemcertificaten en zwemdiploma's:\nWelke stelling is juist?\nStelling 1: Kandidaten met een beperking worden in principe opgeleid voor een zwemcertificaat.\nStelling 2: In principe worden alle kandidaten, jong of oud, opgeleid voor de zwemdiploma's.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: ook voor kandidaten met een beperking is het zwemdiploma het uitgangspunt. Het zwemcertificaat is er voor de groep die het diploma niet, of pas na een heel lange oefenperiode, kan halen. Stelling 2 is juist: dat is het uitgangspunt van de examenregeling. §1.2, p. 13","ref":"§1.2, p. 13","tests":"uitgangspunt: alle kandidaten opgeleid voor zwemdiploma","source":{"page":13,"quote":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma’s."},"rev":2},{"id":"EP-0202","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-02"],"question":"Waarvoor kan een kandidaat met een beperking een zwemcertificaat gebruiken?","options":["Als eindresultaat of als tussenstap","Alleen als tussenstap naar een zwemdiploma","Als bewijs voor een maatwerk examenprogramma"],"answer":0,"explanation":"Het zwemcertificaat kan een behaald eindresultaat zijn om trots op te zijn. Het kan ook een tussenstap zijn naar een hoger zwemcertificaat of naar een zwemdiploma. Het is dus niet alleen een tussenstap, en een maatwerk examenprogramma is iets anders. §1.2, p. 13","ref":"§1.2, p. 13","tests":"functie zwemcertificaat: eindresultaat of tussenstap","source":{"page":13,"quote":"behaald eindresultaat om trots op te zijn of als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma"},"rev":2},{"id":"EP-0203","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-02"],"question":"Een kandidaat met een permanente beperking heeft Zwemcertificaat B behaald. Hij oefent verder. Nu willen zijn ouders dat hij meedoet aan het diplomazwemmen voor Zwemdiploma B. Kan dat?","options":["Ja, een certificaat kan een tussenstap naar een diploma zijn.","Nee, na een certificaat volgt alleen een hoger certificaat.","Nee, hij moet eerst Zwemdiploma A halen."],"answer":0,"explanation":"Een zwemcertificaat kan een tussenstap zijn naar een hoger zwemcertificaat of naar een zwemdiploma. Een lager diploma is niet vereist; dat geldt ook bij het overstappen van een behaald zwemcertificaat naar een zwemdiploma. §1.2 en 2.3, p. 13 en 35","ref":"§1.2 en 2.3, p. 13 en 35","tests":"functie zwemcertificaat: eindresultaat of tussenstap","source":{"page":13,"quote":"als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma"},"rev":2},{"id":"EP-0204","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-03"],"question":"Uit welke twee delen bestaat elk zwemcertificaat?","options":["Een verplicht deel en een open deel","Een standaard deel en een maatwerk deel","Een gekleed deel en een vrij deel"],"answer":0,"explanation":"Elk zwemcertificaat heeft een verplicht onderdeel, dat een zekere mate van zwemveiligheid in zich heeft, en een open deel. Aan het open deel kan het kind al dan niet voldoen. Standaard en maatwerk zijn soorten examenprogramma's, en gekleed is maar een gedeelte van het verplicht deel. §1.2, p. 13","ref":"§1.2, p. 13","tests":"zwemcertificaat: verplicht deel en open deel","source":{"page":13,"quote":"verplicht onderdeel, dat een zekere mate van zwemveiligheid in zich heeft, en een open deel waar het kind al dan niet aan kan voldoen"},"rev":2},{"id":"EP-0205","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-03","EP-CERT-05","EP-CERT-06"],"question":"Zwemcertificaat A:\nWelke stelling over de kleding is juist?\nStelling 1: Het verplicht deel is deels gekleed en deels in badkleding.\nStelling 2: Het open deel is in badkleding.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: het verplicht deel heeft een gekleed gedeelte en een gedeelte in badkleding. Stelling 2 is ook juist: het open deel wordt in badkleding uitgevoerd. §1.2.1, p. 13","ref":"§1.2.1, p. 13","tests":"kleding: verplicht deel gekleed en in badkleding, open deel in badkleding","source":{"page":13,"quote":"In badkleding: naar keuze te water gaan en 5 seconden drijven, gevolgd door 50 meter verplaatsen met een zwemslag naar keuze en 1 minuut watertrappen Open deel (in badkleding)"},"rev":2},{"id":"EP-0206","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-05"],"question":"Zwemcertificaat A, verplicht deel, gekleed gedeelte:\nEen kandidaat gaat naar keuze te water en gaat geheel onder water. Daarna verplaatst hij zich 12,5 meter met een zwemslag naar keuze. Is dit gedeelte zo compleet?","options":["Ja, meer hoort niet bij dit gedeelte.","Nee, hij moet ook 15 seconden watertrappen.","Nee, hij moet ook zelfstandig uit het water klimmen."],"answer":0,"explanation":"In het gekleed gedeelte van Zwemcertificaat A gaat de kandidaat naar keuze te water en geheel onder water. Daarna volgt 12,5 meter verplaatsen met een zwemslag naar keuze. De 15 seconden watertrappen en het zelfstandig op de kant klimmen horen bij proef A1 Survival van Zwemdiploma A. §1.1.1 en 1.2.1, p. 7 en 13","ref":"§1.1.1 en 1.2.1, p. 7 en 13","tests":"Zwemcertificaat A gekleed: onder water gaan en 12,5 m","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met zwemslag naar keuze"},"rev":2},{"id":"EP-0207","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-06","EP-CERT-11","EP-CERT-17"],"question":"Zwemcertificaten, verplicht deel in badkleding:\nHoe lang drijft de kandidaat bij A, B en C?","options":["A 5, B 7 en C 10 seconden","A 5, B 10 en C 15 seconden","A 10, B 15 en C 20 seconden"],"answer":0,"explanation":"In badkleding drijft de kandidaat bij A 5 seconden, bij B 7 seconden en bij C 10 seconden. 10 seconden hoort dus bij C, niet bij B. 15 en 20 seconden komen uit het open deel van B: drijven op de rug en drijven met een drijvend voorwerp. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"drijven verplicht deel A/B/C: 5/7/10 s","source":{"page":14,"quote":"In badkleding: naar keuze te water gaan, 7 seconden drijven"},"rev":2},{"id":"EP-0208","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-17"],"question":"Zwemcertificaat C, verplicht deel:\nHoeveel meter verplaatst de kandidaat zich in badkleding?","options":["100 meter","75 meter","50 meter"],"answer":0,"explanation":"Bij Zwemcertificaat C verplaatst de kandidaat zich in badkleding 100 meter met een zwemslag naar keuze. 75 meter is de afstand in badkleding bij B, en de afstand gekleed bij C. 50 meter is de afstand in badkleding bij A. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"afstand badkleding verplicht deel A/B/C: 50/75/100 m","source":{"page":15,"quote":"10 seconden drijven, gevolgd door 100 meter te verplaatsen met een zwemslag naar keuze"},"rev":2},{"id":"EP-0209","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"verschil","objectives":["EP-CERT-05","EP-CERT-10","EP-CERT-16"],"question":"Zwemcertificaten, verplicht deel, gekleed gedeelte:\nHoeveel meter verplaatst de kandidaat zich bij A, B en C?","options":["A 12,5, B 50 en C 75 meter","A 50, B 75 en C 100 meter","A 12,5, B 25 en C 50 meter"],"answer":0,"explanation":"Gekleed verplaatst de kandidaat zich 12,5 meter bij A, 50 meter bij B en 75 meter bij C. 50, 75 en 100 meter zijn de afstanden in badkleding. Een gekleed gedeelte van 25 meter komt in het verplicht deel niet voor. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"afstand gekleed verplicht deel A/B/C: 12,5/50/75 m","source":{"page":15,"quote":"gevolgd door 75 meter te verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen"},"rev":2},{"id":"EP-0210","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-10","EP-CERT-16"],"question":"Zwemcertificaten, gekleed onder een drijvend voorwerp door zwemmen:\nWelke stelling is juist?\nStelling 1: Bij Zwemcertificaat B is de overbruggingsafstand minimaal 30 centimeter.\nStelling 2: Bij Zwemcertificaat C is de overbruggingsafstand minimaal 30 centimeter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij Zwemcertificaat B is de overbruggingsafstand minimaal 30 centimeter. Stelling 2 is onjuist: bij Zwemcertificaat C is die minimaal 50 centimeter. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":15,"quote":"onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 50 centimeter)"},"rev":2},{"id":"EP-0211","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-05"],"question":"Zwemcertificaat A, verplicht deel, gekleed gedeelte:\nWelke stelling is juist?\nStelling 1: De kandidaat zwemt 1 keer onder een drijvend voorwerp door.\nStelling 2: De kandidaat gaat geheel onder water en verplaatst zich 12,5 meter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: onder een drijvend voorwerp door zwemmen hoort bij het gekleed gedeelte van het verplicht deel van Zwemcertificaat B en C, niet bij A. Stelling 2 is juist: bij A gaat de kandidaat gekleed geheel onder water en verplaatst zich daarna 12,5 meter. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"Zwemcertificaat A gekleed: geen drijvend voorwerp","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met zwemslag naar keuze"},"rev":2},{"id":"EP-0212","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-19"],"question":"Zwemcertificaat C, open deel:\nEen kandidaat zwemt 6 meter onder water door een gat in een verticaal hangend zeil. Daarna komt hij ergens boven water. Is dit onderdeel compleet?","options":["Nee, hij moet bovenkomen in een soort wak.","Nee, bij C zwemt hij 3 meter onder water.","Ja, een soort wak hoort alleen bij Zwemdiploma C."],"answer":0,"explanation":"In het open deel van Zwemcertificaat C zwemt de kandidaat 6 meter onder water door het zeil en komt hij boven in een soort wak. 3 meter onder water hoort bij het open deel van A. Bovenkomen in een soort wak staat dus ook bij Zwemcertificaat C. §1.2.1 en 1.2.3, p. 13 en 15","ref":"§1.2.1 en 1.2.3, p. 13 en 15","tests":"zeil open deel A 3 m vs C 6 m met wak","source":{"page":15,"quote":"6 meter onder water zwemmen door een gat in een verticaal hangend zeil, bovenkomen in een soort wak"},"rev":2},{"id":"EP-0213","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-08"],"question":"Zwemcertificaat A, open deel:\nHoe lang drijft de kandidaat op de buik en op de rug?","options":["Buik 5 seconden, rug 10 seconden","Buik 10 seconden, rug 5 seconden","Buik 5 seconden, rug 15 seconden"],"answer":0,"explanation":"Het open deel van A bevat 5 seconden drijven op de buik en 10 seconden drijven op de rug. De omgedraaide tijden kloppen niet. 15 seconden drijven op de rug hoort bij het open deel van Zwemcertificaat B. §1.2.1–1.2.2, p. 13–14","ref":"§1.2.1–1.2.2, p. 13–14","tests":"open deel A: 5 s buik, 10 s rug","source":{"page":13,"quote":"5 seconden drijven op de buik 10 seconden drijven op de rug"},"rev":2},{"id":"EP-0214","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-15"],"question":"Zwemcertificaat B, open deel:\nHoeveel meter borstcrawl zwemt de kandidaat?","options":["10 meter","25 meter","5 meter"],"answer":0,"explanation":"Het open deel van B bevat 10 meter borstcrawl en 10 meter rugcrawl. 5 meter hoort bij het open deel van A. 25 meter geldt in het open deel voor de schoolslag en de enkelvoudige rugslag. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"crawl open deel A/B/C: 5/10/15 m","source":{"page":14,"quote":"10 meter borstcrawl 10 meter rugcrawl"},"rev":2},{"id":"EP-0215","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-20"],"question":"Zwemcertificaat C, open deel:\nHoeveel meter schoolslag zwemt de kandidaat?","options":["25 meter","75 meter","15 meter"],"answer":0,"explanation":"In het open deel van alle drie de zwemcertificaten is het 25 meter schoolslag, ook bij C. 75 meter is bij Zwemcertificaat C de afstand gekleed in het verplicht deel. 15 meter is in het open deel van C de afstand van de borstcrawl en de rugcrawl. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"schoolslag en enkelvoudige rugslag open deel: steeds 25 m","source":{"page":15,"quote":"25 meter schoolslag 25 meter enkelvoudige rugslag 15 meter borstcrawl"},"rev":2},{"id":"EP-0216","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-10"],"question":"Zwemcertificaat B, verplicht deel, gekleed gedeelte:\nDe kandidaat gaat naar keuze te water en gaat geheel onder water. Wat volgt daarna?","options":["15 seconden watertrappen, dan 50 meter verplaatsen","30 seconden drijven, dan 75 meter verplaatsen","12,5 meter verplaatsen, dan 1 minuut watertrappen"],"answer":0,"explanation":"Bij B volgen 15 seconden watertrappen en 50 meter verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen. 30 seconden drijven met een drijvend voorwerp en 75 meter horen bij C. 12,5 meter hoort bij A, en 1 minuut watertrappen gebeurt in badkleding. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"Zwemcertificaat B gekleed: 15 s watertrappen en 50 m","source":{"page":14,"quote":"geheel onder water gaan, gevolgd door 15 seconden watertrappen, gevolgd door 50 meter verplaatsen"},"rev":2},{"id":"EP-0217","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-10"],"question":"Zwemcertificaat B, verplicht deel, gekleed gedeelte:\nHet drijvend voorwerp ligt zo dat de overbruggingsafstand 40 centimeter is. Voldoet deze opstelling aan het examenprogramma?","options":["Ja, voor B is minimaal 30 centimeter nodig.","Nee, voor B is minimaal 50 centimeter nodig.","Nee, voor B is minimaal 70 centimeter nodig."],"answer":0,"explanation":"Bij Zwemcertificaat B is de overbruggingsafstand minimaal 30 centimeter, dus 40 centimeter voldoet. Minimaal 50 centimeter geldt bij Zwemcertificaat C. 70 centimeter is bij de zwemdiploma's een minimale breedte van het drijvend voorwerp, geen overbruggingsafstand. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":14,"quote":"drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 30 centimeter)"},"rev":2},{"id":"EP-0218","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-11"],"question":"Zwemcertificaat B, verplicht deel in badkleding:\nDe kandidaat moet 1 minuut watertrappen. Hoe voert hij 30 seconden daarvan uit?","options":["Met alleen de armen of benen","Met verplaatsen in meerdere richtingen","Met gebruik van een drijvend voorwerp"],"answer":0,"explanation":"Bij B gebeurt 30 seconden van de minuut watertrappen met alleen de armen of benen. Verplaatsen in meerdere richtingen hoort bij de minuut watertrappen van Zwemcertificaat C. 30 seconden met een drijvend voorwerp is bij C drijven in het gekleed gedeelte, geen watertrappen. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"watertrappen badkleding B (alleen armen of benen) vs C (verplaatsen)","source":{"page":14,"quote":"1 minuut watertrappen (30 seconden met alleen de armen of benen)"},"rev":2},{"id":"EP-0219","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-11"],"question":"Zwemcertificaat B, verplicht deel in badkleding:\nHoeveel meter verplaatst de kandidaat zich met een zwemslag naar keuze?","options":["75 meter","100 meter","50 meter"],"answer":0,"explanation":"In badkleding drijft de kandidaat 7 seconden en verplaatst zich daarna 75 meter. 100 meter hoort bij Zwemcertificaat C. 50 meter is de afstand in badkleding bij Zwemcertificaat A. §1.2.2, p. 14","ref":"§1.2.2, p. 14","tests":"Zwemcertificaat B badkleding: 7 s drijven en 75 m","source":{"page":14,"quote":"In badkleding: naar keuze te water gaan, 7 seconden drijven, gevolgd door 75 meter"},"rev":2},{"id":"EP-0220","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-12","EP-CERT-07"],"question":"Open deel van de zwemcertificaten:\nWelke manier van te water gaan staat bij Zwemcertificaat B, maar niet bij Zwemcertificaat A?","options":["Achterwaarts te water gaan","Vanaf de kant in het water duiken","Voetsprong"],"answer":0,"explanation":"Het open deel van B kent achterwaarts te water gaan, duiken vanaf de kant en een voetsprong. Bij A zijn dat de voetsprong en van de kant het water in duiken. Duiken en de voetsprong komen dus bij allebei voor. §1.2.1–1.2.2, p. 13–14","ref":"§1.2.1–1.2.2, p. 13–14","tests":"open deel B: achterwaarts te water gaan (niet bij A)","source":{"page":14,"quote":"Achterwaarts te water gaan • Vanaf de kant in het water duiken • Voetsprong"},"rev":2},{"id":"EP-0221","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-13"],"question":"Zwemcertificaat B, open deel:\nWelke stelling is juist?\nStelling 1: De kandidaat zwemt onder water en komt boven in een soort wak.\nStelling 2: De kandidaat zakt voetwaarts richting de bodem.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bovenkomen in een soort wak hoort bij het open deel van Zwemcertificaat C. Bij B staat alleen 6 meter onder water zwemmen door een gat in een verticaal hangend zeil. Stelling 2 is juist: voetwaarts richting bodem zakken staat in het open deel van B. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"open deel B: 6 m zeil zonder wak, voetwaarts zakken","source":{"page":14,"quote":"6 meter onder water zwemmen door een gat in een verticaal hangend zeil Voetwaarts richting bodem zakken"},"rev":2},{"id":"EP-0222","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-14"],"question":"Zwemcertificaat B, open deel:\nWelk drijfonderdeel hoort hierbij?","options":["15 seconden drijven op de rug","5 seconden drijven op de buik","10 seconden drijven op de rug"],"answer":0,"explanation":"Het open deel van B bevat 15 seconden drijven op de rug en 20 seconden met behulp van een drijvend voorwerp blijven drijven. 5 seconden drijven op de buik hoort bij het open deel van A. 10 seconden drijven op de rug staat in het open deel van A en C. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"open deel B: drijfonderdelen en hoofdwaarts voortbewegen","source":{"page":14,"quote":"20 seconden met behulp van een drijvend voorwerp blijven drijven 15 seconden drijven op de rug 5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen"},"rev":2},{"id":"EP-0223","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-16"],"question":"Zwemcertificaat C, verplicht deel, gekleed gedeelte:\nHet drijvend voorwerp ligt zo dat de overbruggingsafstand 40 centimeter is. Voldoet deze opstelling aan het examenprogramma?","options":["Nee, voor C is minimaal 50 centimeter nodig.","Nee, voor C is minimaal 70 centimeter nodig.","Ja, voor C is minimaal 30 centimeter nodig."],"answer":0,"explanation":"Bij Zwemcertificaat C is de overbruggingsafstand minimaal 50 centimeter, dus 40 centimeter is te weinig. Minimaal 30 centimeter geldt bij Zwemcertificaat B. 70 centimeter is bij de zwemdiploma's een minimale breedte van het drijvend voorwerp, geen overbruggingsafstand. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"overbruggingsafstand B 30 cm vs C 50 cm","source":{"page":15,"quote":"onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 50 centimeter)"},"rev":2},{"id":"EP-0224","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-16"],"question":"Zwemcertificaat C, verplicht deel, gekleed gedeelte:\nWelke stelling is juist?\nStelling 1: De kandidaat blijft 30 seconden drijven met een drijvend voorwerp.\nStelling 2: De kandidaat klimt 1 keer over een drijvend voorwerp heen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: in het gekleed gedeelte van het verplicht deel blijft de kandidaat 30 seconden drijven met een drijvend voorwerp. Stelling 2 is onjuist: over een drijvend voorwerp heen klimmen hoort bij proef C1 Survival van Zwemdiploma C, niet bij het zwemcertificaat. §1.1.3 en 1.2.3, p. 11 en 15","ref":"§1.1.3 en 1.2.3, p. 11 en 15","tests":"Zwemcertificaat C gekleed: 30 s drijven met voorwerp, niet over voorwerp klimmen","source":{"page":15,"quote":"gevolgd door 30 seconden te blijven drijven met een drijvend voorwerp, gevolgd door 75 meter te verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen"},"rev":2},{"id":"EP-0225","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-17"],"question":"Zwemcertificaat C, verplicht deel in badkleding:\nEen kandidaat gaat naar keuze te water en drijft 10 seconden. Hij verplaatst zich 75 meter met een zwemslag naar keuze. Daarna volgt 1 minuut watertrappen. Is dit gedeelte compleet?","options":["Nee, hij moet zich 100 meter verplaatsen.","Nee, hij moet 15 seconden drijven.","Ja, bij C hoort 75 meter in badkleding."],"answer":0,"explanation":"Bij Zwemcertificaat C verplaatst de kandidaat zich in badkleding 100 meter, na 10 seconden drijven. 75 meter in badkleding hoort bij B; bij C is 75 meter de afstand gekleed. Het drijven van 10 seconden was juist. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"afstand badkleding verplicht deel A/B/C: 50/75/100 m","source":{"page":15,"quote":"10 seconden drijven, gevolgd door 100 meter te verplaatsen met een zwemslag naar keuze"},"rev":2},{"id":"EP-0226","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"onjuist","objectives":["EP-CERT-18"],"question":"Zwemcertificaat C, open deel:\nWelke manier van te water gaan hoort hier NIET bij?","options":["Rol voorover","Achterwaarts te water gaan","Sprong waarbij het hoofd boven water blijft"],"answer":1,"explanation":"Achterwaarts te water gaan hoort bij het open deel van Zwemcertificaat B. Het open deel van C kent de voetsprong, duiken vanaf de kant, de rol voorover en de sprong waarbij het hoofd boven water blijft. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"open deel C: manieren van te water gaan","source":{"page":15,"quote":"Te water gaan • Voetsprong • Duiken vanaf de kant • Rol voorover • Sprong waarbij het hoofd boven water blijft"}},{"id":"EP-0227","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"kennis","objectives":["EP-CERT-19"],"question":"Zwemcertificaat C, open deel:\nWat doet de kandidaat tijdens het zwemmen?","options":["1 keer hoofdwaarts richting bodem gaan","2 keer een halve draai om de lengteas maken","1 keer voetwaarts richting bodem zakken"],"answer":0,"explanation":"In het open deel van C staat 'zwemmen, 1x hoofdwaarts richting bodem gaan'. Zwemmen met 2 keer een halve draai om de lengteas hoort bij het open deel van B. Voetwaarts richting bodem zakken staat ook in het open deel van B. §1.2.2–1.2.3, p. 14–15","ref":"§1.2.2–1.2.3, p. 14–15","tests":"open deel C: zwemmen met 1x hoofdwaarts richting bodem","source":{"page":15,"quote":"zwemmen, 1x hoofdwaarts richting bodem gaan"},"rev":2},{"id":"EP-0228","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"stellingen","objectives":["EP-CERT-05","EP-CERT-10","EP-CERT-16"],"question":"Verplicht deel van de Zwemcertificaten A, B en C:\nWelke stelling is juist?\nStelling 1: Bij alle drie heeft het verplicht deel een gekleed gedeelte.\nStelling 2: Alleen bij B en C zwemt de kandidaat onder een drijvend voorwerp door.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: ook bij A is er een gekleed gedeelte, met geheel onder water gaan en 12,5 meter verplaatsen. Stelling 2 is ook juist: alleen bij B en C wordt de afstand gekleed onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen. §1.2.1–1.2.3, p. 13–15","ref":"§1.2.1–1.2.3, p. 13–15","tests":"gekleed gedeelte in verplicht deel van A, B en C","source":{"page":13,"quote":"Gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter"},"rev":2},{"id":"EP-0229","category":"examenprogrammas","subtopic":"zwemcertificaten","type":"casus","objectives":["EP-CERT-04","EP-CERT-01"],"question":"Een kandidaat van negen jaar heeft geen beperking. Hij heeft moeite met de borstcrawl. Daarom wil de lesgever hem opgeven voor Zwemcertificaat A in plaats van Zwemdiploma A. Wat past bij de examenregeling?","options":["Hij wordt verder opgeleid voor Zwemdiploma A.","Hij wordt eerst opgeleid voor Zwemcertificaat A.","Hij doet Zwemdiploma A zonder het onderdeel '5 meter borstcrawl'."],"answer":0,"explanation":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma's. De zwemcertificaten zijn voor een relatief kleine groep kandidaten met een beperking, die het diploma niet of pas na een heel lange oefenperiode halen. Een onderdeel overslaan mag niet: er mogen geen onderdelen of proeven worden overgeslagen. §1.2 en 2.1, p. 13 en 16","ref":"§1.2 en 2.1, p. 13 en 16","tests":"uitgangspunt: alle kandidaten opgeleid voor zwemdiploma","source":{"page":13,"quote":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma’s."},"rev":2},{"id":"EP-0300","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-01"],"question":"Welke twee soorten examenprogramma's zijn er voor het Zwem-ABC?","options":["Standaard en maatwerk","Standaard en zwemcertificaat","Een verplicht deel en een open deel"],"answer":0,"explanation":"Voor het Zwem-ABC zijn er twee soorten examenprogramma's: standaard en maatwerk. De Zwemcertificaten A, B en C zijn aparte certificaten, geen tweede soort examenprogramma. Een verplicht deel en een open deel horen bij de zwemcertificaten. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"twee soorten examenprogramma's Zwem-ABC: standaard en maatwerk","source":{"page":4,"quote":"twee soorten examenprogramma’s: standaard en maatwerk"}},{"id":"EP-0301","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-01"],"question":"Waarom is er naast het standaard examenprogramma ook een maatwerk examenprogramma?","options":["Het werkveld wil eigen examenprogramma's kunnen maken.","Kinderen met een (tijdelijke) beperking krijgen zo een aangepast examen.","Niveau vier (open water/zee) vraagt een eigen programma."],"answer":0,"explanation":"Het maatwerk examenprogramma komt uit een wens van het werkveld om naast de standaard examenprogramma's eigen examenprogramma's te ontwikkelen. Voor kinderen met een (tijdelijke) beperking zijn er de Zwemcertificaten A, B en C. Niveau vier wordt niet uitgewerkt, want dat is nauwelijks in een zwembad te oefenen. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"maatwerk: wens vanuit het werkveld","source":{"page":4,"quote":"Een wens vanuit het werkveld is om naast de standaard examenprogramma’s de mogelijkheid te hebben eigen examenprogramma’s te ontwikkelen."},"rev":2},{"id":"EP-0302","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-34"],"question":"Voor welke diploma's of certificaten bestaat een maatwerk examenprogramma?","options":["Zwemdiploma's A, B en C","Zwemdiploma's en Zwemcertificaten A, B en C","Alleen Zwemdiploma C"],"answer":0,"explanation":"De Examenregeling beschrijft een maatwerk examenprogramma voor de Zwemdiploma's A, B en C. Voor de Zwemcertificaten A, B en C is er alleen een standaard examenprogramma. Maatwerk is ook niet beperkt tot Zwemdiploma C. §1, p. 6","ref":"§1, p. 6","tests":"maatwerk beschreven voor Zwemdiploma's A, B en C","source":{"page":6,"quote":"Zwemcertificaten A, B en C en het maatwerk examenprogramma voor de Zwemdiploma’s A, B en C"},"rev":2},{"id":"EP-0303","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-02"],"question":"Wat geldt voor de onderdelen van een maatwerk examenprogramma?","options":["Ze zijn gelijk aan die van het standaard examenprogramma.","Ze zijn een keuze uit het standaard examenprogramma.","Elke proef heeft minimaal één nieuw onderdeel."],"answer":0,"explanation":"De inhoud (onderdelen) van een maatwerk examenprogramma is gelijk aan die van het standaard examenprogramma. Een keuze maken kan niet: alle onderdelen moeten erin. Nieuwe onderdelen zijn ook niet nodig; alleen de proeven mogen nieuw zijn. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"inhoud maatwerk gelijk aan standaard","source":{"page":4,"quote":"is gelijk aan de inhoud van het standaard examenprogramma"},"rev":2},{"id":"EP-0304","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-04","EP-MAAT-03"],"question":"Standaard en maatwerk examenprogramma:\nWelke stelling is juist?\nStelling 1: In het standaard examenprogramma hebben de onderdelen een vaste volgorde.\nStelling 2: Met maatwerk mag een Licentiehouder proeven aanpassen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: in het standaard examenprogramma worden de onderdelen van de proeven in de vastgestelde volgorde uitgevoerd. Stelling 2 is ook juist: met maatwerk mag een Licentiehouder proeven aanpassen en nieuwe proeven bedenken. §4, p. 44","ref":"§4, p. 44","tests":"standaard: vaste volgorde onderdelen; maatwerk: proeven aanpassen","source":{"page":44,"quote":"De onderdelen van de proeven dienen in de vastgestelde"},"rev":2},{"id":"EP-0305","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-03"],"question":"Wat mag een Licentiehouder doen met een maatwerk examenprogramma?","options":["Proeven aanpassen en nieuwe proeven bedenken","Per kandidaat onderdelen weglaten","De normering per onderdeel soepeler maken"],"answer":0,"explanation":"Met een maatwerk examenprogramma mag de Licentiehouder proeven aanpassen, nieuwe proeven bedenken en zo een heel nieuw examenprogramma maken. Onderdelen weglaten mag niet, want alle onderdelen moeten erin. Een soepelere normering mag ook niet: de normering van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma. Bijlage 1","ref":"Bijlage 1","tests":"maatwerk: proeven aanpassen en nieuwe proeven bedenken","source":{"page":"Bijlage 1","quote":"Met maatwerk examenprogramma’s is het voor Licentiehouders mogelijk om proeven aan te passen, nieuwe proeven te bedenken en zo een heel nieuw examenprogramma samen te stellen."},"rev":2},{"id":"EP-0306","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-05"],"question":"Een Licentiehouder heeft een maatwerk examenprogramma voor Zwemdiploma B gemaakt. Hij wil het volgende week gebruiken bij het diplomazwemmen. Hij heeft het nog nergens ingediend. Mag dat?","options":["Nee, eerst moet de Nationale Raad Zwemveiligheid het goedkeuren.","Nee, eerst moet de Examinator het programma beoordelen.","Ja, als alle onderdelen in de proeven zitten."],"answer":0,"explanation":"Een maatwerk examenprogramma mag pas worden gebruikt als het vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid. De Toetsingscommissie toetst het, niet de Examinator. Dat alle onderdelen erin zitten is een voorwaarde, maar vervangt de goedkeuring niet. §4, p. 44","ref":"§4, p. 44","tests":"maatwerk vooraf ter goedkeuring voorleggen aan NRZ","source":{"page":44,"quote":"Een Licentiehouder kan een maatwerk examenprogramma toepassen als deze vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid."},"rev":2},{"id":"EP-0307","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-06"],"question":"Wie toetst of een ingediend maatwerk examenprogramma voldoet?","options":["De Toetsingscommissie Maatwerk Examenprogramma's","De Commissie van Beroep","Het bestuur van de Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"De Toetsingscommissie Maatwerk Examenprogramma's is een commissie van deskundigen die dat toetst. De Commissie van Beroep komt pas in beeld bij een beroep tegen een weigering. Het bestuur van de Nationale Raad Zwemveiligheid heeft de Examenregeling vastgesteld, maar toetst geen maatwerk. Bijlage 1","ref":"Bijlage 1","tests":"Toetsingscommissie toetst maatwerk examenprogramma","source":{"page":"Bijlage 1","quote":"De Toetsingscommissie Maatwerk Examenprogramma’s is een commissie van deskundigen die toetst of een ingediend maatwerk examenprogramma voldoet."},"rev":2},{"id":"EP-0308","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-07"],"question":"Waarop toetst de Toetsingscommissie Maatwerk Examenprogramma's een ingediend programma?","options":["Gelijkwaardigheid aan het niveau van het standaard examenprogramma","Ruimte voor innovatie en aansluiting bij de eigen visie","De volgorde van de onderdelen in het standaard examenprogramma"],"answer":0,"explanation":"De commissie toetst op gelijkwaardigheid aan het niveau van de proeven/onderdelen van het standaard examenprogramma en aan de doelen van de niveaus van zwemveiligheid. Innovatie en een eigen visie zijn doelen van maatwerk, geen toetsmaatstaf. De volgorde van de onderdelen mag bij maatwerk juist anders zijn. §4, p. 44","ref":"§4, p. 44","tests":"toetsingscriterium: gelijkwaardigheid aan standaard en doelen zwemveiligheid","source":{"page":44,"quote":"examenprogramma’s toetst op basis van gelijkwaardigheid aan het niveau van de"},"rev":2},{"id":"EP-0309","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-19"],"question":"Een maatwerk examenprogramma is goedgekeurd. Wat geldt daarna?","options":["De zwemlesaanbieder kan het gebruiken voor het diplomazwemmen.","De zwemlesaanbieder kan het pas na vaststelling door het bestuur gebruiken.","De Commissie van Beroep moet het nog vaststellen."],"answer":0,"explanation":"Na goedkeuring kan de zwemlesaanbieder het maatwerk examenprogramma gebruiken voor het diplomazwemmen. Een vaststelling door het bestuur wordt niet genoemd. De Commissie van Beroep speelt alleen een rol bij beroep tegen een weigering. §4–4.1, p. 44–45","ref":"§4–4.1, p. 44–45","tests":"na goedkeuring maatwerk direct bruikbaar","source":{"page":44,"quote":"Na goedkeuring kan de zwemlesaanbieder het maatwerk examenprogramma gebruiken voor het diplomazwemmen"},"rev":2},{"id":"EP-0310","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-08"],"question":"Doel van maatwerk examenprogramma's:\nWelke stelling is juist?\nStelling 1: Maatwerk geeft ruimte voor innovatie van het zwemonderwijs.\nStelling 2: Maatwerk is bedoeld voor kinderen met een (tijdelijke) beperking.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: volgens de Examenregeling ontstaat zo 'meer ruimte voor innovatie van het zwemonderwijs en het diplomazwemmen'. Stelling 2 is onjuist: voor kinderen met een (tijdelijke) beperking zijn er de Zwemcertificaten A, B en C. Inleiding en §4, p. 1 en 44","ref":"Inleiding en §4, p. 1 en 44","tests":"doel maatwerk: ruimte voor innovatie","source":{"page":44,"quote":"Hierdoor ontstaat meer ruimte voor innovatie van het zwemonderwijs en het diplomazwemmen."},"rev":2},{"id":"EP-0311","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-09","EP-MAAT-12"],"question":"Welke mogelijkheid hoort NIET bij een maatwerk examenprogramma?","options":["Een proef inwisselen voor een nieuwe proef","Onderdelen uit een proef in een andere volgorde zetten","Een onderdeel vervangen door een nieuw onderdeel"],"answer":2,"explanation":"Een onderdeel vervangen kan niet: alle onderdelen uit het standaard examenprogramma moeten in de proeven van het maatwerk examenprogramma zitten. Een proef inwisselen voor een nieuwe proef en onderdelen in een andere volgorde zetten zijn wel genoemde mogelijkheden. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: alle onderdelen opnemen","source":{"page":44,"quote":"Alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van"},"rev":2},{"id":"EP-0312","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-09"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma A. Hij combineert onderdelen uit verschillende proeven tot een nieuwe proef. Alle onderdelen blijven erin. Kan dat?","options":["Ja, onderdelen anders combineren is een mogelijkheid van maatwerk.","Ja, als de Examinator de nieuwe proef goedkeurt.","Nee, alleen een hele proef mag worden ingewisseld."],"answer":0,"explanation":"Onderdelen op een andere manier combineren is een genoemde mogelijkheid van maatwerk. Het programma moet wel vooraf ter goedkeuring naar de Nationale Raad Zwemveiligheid; de Examinator keurt het niet goed. Een hele proef inwisselen mag ook, maar is niet de enige mogelijkheid. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"maatwerk: onderdelen anders combineren","source":{"page":44,"quote":"Onderdelen op een andere manier te combineren."},"rev":2},{"id":"EP-0313","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-10"],"question":"Een Licentiehouder maakt een maatwerkproef voor Zwemdiploma B. De kandidaten gaan van de glijbaan te water. Daarna moeten ze zich oriënteren. Is zo'n proef mogelijk?","options":["Ja, het doelgerichte gebruik van vaardigheden mag voorop staan.","Nee, de onderdelen moeten in de vaste volgorde blijven.","Nee, de proef moet gelijk zijn aan het standaard examenprogramma."],"answer":0,"explanation":"Maatwerk mag proeven bevatten waarin het doelgerichte gebruik van vaardigheden voorop staat, zoals oriënteren na te water gaan van de glijbaan. Een vaste volgorde geldt alleen in het standaard examenprogramma. Bij maatwerk mogen proeven juist worden aangepast of nieuw worden bedacht. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: doelgericht gebruik vaardigheden (glijbaan, golfslagbad)","source":{"page":44,"quote":"Proeven te maken waarin het doelgerichte gebruik van vaardigheden voorop staat"},"rev":2},{"id":"EP-0314","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-35","EP-MAAT-11"],"question":"Met maatwerk kan de zwemlesaanbieder het diplomazwemmen laten aansluiten op … Wat hoort op de puntjes?","options":["de eigen visie en identiteit van de organisatie","de wensen van de individuele kandidaat","het examenprogramma van de Zwemcertificaten"],"answer":0,"explanation":"Met maatwerk kan de zwemlesaanbieder het diplomazwemmen laten aansluiten op de eigen visie en identiteit van de organisatie. De wensen van een individuele kandidaat worden niet genoemd. De Zwemcertificaten hebben een eigen standaard examenprogramma. Inleiding, p. 1–2","ref":"Inleiding, p. 1–2","tests":"maatwerk: aansluiten op eigen visie en identiteit","source":{"page":2,"quote":"visie en identiteit van de organisatie. Ieder ontwikkeld maatwerk examenprogramma"},"rev":2},{"id":"EP-0315","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-11","EP-MAAT-12"],"question":"Welke mogelijkheid van een maatwerk examenprogramma noemt de Examenregeling?","options":["Proeven die aansluiten bij de eigen (bedrijfs)visie","Proeven waarin de kandidaat zelf onderdelen kiest","Proeven met een soepelere normering dan het standaard examenprogramma"],"answer":0,"explanation":"Proeven samenstellen die aansluiten bij de eigen (bedrijfs)visie op het leren zwemmen is een genoemde mogelijkheid. De kandidaat kiest geen onderdelen: alle onderdelen van het standaard examenprogramma moeten erin. Een soepelere normering wordt niet genoemd: de normering van het standaard examenprogramma geldt ook voor maatwerk. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: bedrijfsvisie en gevarieerde aanbiedingsvormen","source":{"page":44,"quote":"Proeven samen te stellen die aansluiten bij de eigen (bedrijfs)visie op het leren zwemmen."},"rev":2},{"id":"EP-0316","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-12"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma C. Hij wil het onderdeel '30 seconden watertrappen met de benen' weglaten. Het programma bevat al een ander onderdeel met watertrappen. Mag dat?","options":["Nee, alle onderdelen moeten in de proeven zitten.","Ja, als de essentie in een andere proef zichtbaar blijft.","Ja, als het andere onderdeel met watertrappen een extra eis krijgt."],"answer":0,"explanation":"Een voorwaarde voor maatwerk is dat alle onderdelen uit het standaard examenprogramma in de proeven zitten. De essentie moet zichtbaar zijn en extra eisen mogen, maar dat maakt weglaten niet toegestaan. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: alle onderdelen opnemen","source":{"page":44,"quote":"worden opgenomen in de proeven van het maatwerk examenprogramma"},"rev":2},{"id":"EP-0317","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-13"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma B. Bij het onderdeel '6 meter onder water zwemmen' mogen kandidaten 1 keer kort bovenkomen om adem te halen. Mag dat?","options":["Nee, de normering van het standaard examenprogramma blijft gelden.","Ja, bij maatwerk mag de normering van een onderdeel anders zijn.","Ja, als de kandidaat de afstand van 6 meter wel overbrugt."],"answer":0,"explanation":"De normering van het standaard examenprogramma geldt ook voor maatwerk. Daarin staat dat de kandidaat tijdens het onder water zwemmen geheel onder water blijft. Extra eisen toevoegen mag, maar alleen de afstand halen is niet genoeg. §4.1 en 4.2.2, p. 44 en 51","ref":"§4.1 en 4.2.2, p. 44 en 51","tests":"maatwerk: normering standaard blijft gelden","source":{"page":44,"quote":"De normering die wordt beschreven bij de onderdelen van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma."},"rev":2},{"id":"EP-0318","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-14"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma C. Bij het onderdeel '15 meter borstcrawl' stelt hij een extra eis: de kandidaat moet zijwaarts ademhalen. Mag dat?","options":["Ja, extra eisen aan de normering zijn toegestaan.","Ja, als de Examinator het per kandidaat goedvindt.","Nee, de normering moet gelijk blijven aan het standaard examenprogramma."],"answer":0,"explanation":"Bij maatwerk geldt de normering van het standaard examenprogramma, maar extra eisen aan de normering van bepaalde onderdelen toevoegen is toegestaan. De normering hoeft dus niet precies gelijk te blijven. Instemming per kandidaat door de Examinator is geen voorwaarde. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: extra eisen aan normering toegestaan","source":{"page":44,"quote":"Het is toegestaan om extra eisen aan de normering van bepaalde onderdelen toe te voegen."},"rev":2},{"id":"EP-0319","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-16","EP-MAAT-17"],"question":"Voorwaarden voor een maatwerk examenprogramma:\nWelke stelling is juist?\nStelling 1: Het water mag ondieper zijn dan de voorgeschreven waterdiepte.\nStelling 2: De kandidaten moeten individueel te beoordelen zijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de onderdelen worden minimaal uitgevoerd in de waterdiepte die staat voorgeschreven. Stelling 2 is juist: de organisatie van het maatwerk examenprogramma maakt het mogelijk om de kandidaten individueel te beoordelen. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"maatwerk: minimaal voorgeschreven waterdiepte","source":{"page":44,"quote":"De onderdelen van het maatwerk examenprogramma worden minimaal uitgevoerd in de"},"rev":2},{"id":"EP-0320","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-15"],"question":"Maatwerk examenprogramma:\nAan welke voorwaarde moet een onderdeel in een maatwerkproef voldoen?","options":["De essentie van het onderdeel is zichtbaar.","De volgorde van het standaard examenprogramma blijft gelijk.","Het onderdeel gebeurt in een bassin van minimaal 160 m2."],"answer":0,"explanation":"Bij het toepassen van de onderdelen in proeven voor maatwerk moet de essentie van het onderdeel zichtbaar zijn. De volgorde mag juist anders zijn: onderdelen in een andere volgorde plaatsen is een mogelijkheid van maatwerk. De eis van minimaal 160 m2 geldt voor conditiezwemmen en gekleed zwemmen. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: essentie onderdeel zichtbaar","source":{"page":44,"quote":"moet de essentie van het onderdeel zichtbaar zijn"},"rev":2},{"id":"EP-0321","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-16","EP-MAAT-33"],"question":"Maatwerkproef, Zwemdiploma A:\nHet onderdeel 'voetwaarts richting de bodem zakken' gebeurt in water van 1,4 meter diep. De kandidaten kunnen daar net niet staan. Is dat toegestaan?","options":["Nee, de waterdiepte moet minimaal 1,8 meter zijn.","Ja, water waar de kandidaat niet kan staan is genoeg.","Ja, bij maatwerk mag de waterdiepte afwijken."],"answer":0,"explanation":"Het onderdeel 'voetwaarts richting de bodem zakken' wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter. Bij maatwerk worden de onderdelen minimaal in de voorgeschreven waterdiepte uitgevoerd. 'Waar de kandidaat niet kan staan' geldt bijvoorbeeld voor de drijfonderdelen, niet voor dit onderdeel. §4.1 en 4.2.2, p. 44 en 52","ref":"§4.1 en 4.2.2, p. 44 en 52","tests":"diepte voetwaarts richting de bodem zakken: minimaal 1,8 m","source":{"page":52,"quote":"De kandidaat gaat geheel onder water. Het onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"EP-0322","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-33"],"question":"Onderdeel 'hoofdwaarts richting de bodem gaan':\nHoe diep moet het water minimaal zijn?","options":["1,8 meter diep","Zo diep dat de kandidaat niet kan staan","75 centimeter diep"],"answer":0,"explanation":"Hoofdwaarts richting de bodem gaan wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter. 'Dieper water, tenminste waar de kandidaat niet kan staan' geldt onder andere voor het onderdeel '15 seconden drijven op de rug'. 75 centimeter is de afstand van de bovenkant van het gat in het zeil tot het wateroppervlak. §4.2.2–4.2.3, p. 50–54","ref":"§4.2.2–4.2.3, p. 50–54","tests":"diepte hoofdwaarts (1,8 m) vs drijven op de rug (niet kunnen staan)","source":{"page":53,"quote":"De benen komen geheel onder water. Het onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"EP-0323","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-33"],"question":"Waterdiepte:\nWelke stelling is juist?\nStelling 1: Het onderdeel '5 seconden drijven op de buik' vraagt een waterdiepte van minimaal 1,8 meter.\nStelling 2: Het onderdeel 'voetwaarts richting de bodem zakken' vraagt een waterdiepte van minimaal 1,8 meter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: drijven op de buik wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. Stelling 2 is juist: voetwaarts richting de bodem zakken vraagt een waterdiepte van minimaal 1,8 meter. §4.2.2–4.2.3, p. 52–54","ref":"§4.2.2–4.2.3, p. 52–54","tests":"diepte drijven op de buik: waar de kandidaat niet kan staan","source":{"page":54,"quote":"mag uit het water worden getild voor ademhaling. Het onderdeel wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"EP-0324","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-17"],"question":"Een Licentiehouder maakt een maatwerkproef. Twaalf kandidaten drijven tegelijk door elkaar in het golfslagbad. Zo kan de examinator niet zien wat elke kandidaat afzonderlijk doet. Voldoet deze proef?","options":["Nee, elke kandidaat moet individueel te beoordelen zijn.","Nee, drijven in een golfslagbad is niet toegestaan.","Ja, als de groep samen de essentie laat zien."],"answer":0,"explanation":"Een voorwaarde voor maatwerk is dat de organisatie het mogelijk maakt om de kandidaten individueel te beoordelen. Drijven in een golfslagbad is juist een genoemde mogelijkheid. De essentie moet per kandidaat zichtbaar zijn, niet alleen voor de groep. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"maatwerk: kandidaten individueel beoordelen","source":{"page":45,"quote":"De organisatie van het maatwerk examenprogramma maakt het mogelijk om de kandidaten individueel te beoordelen."},"rev":2},{"id":"EP-0325","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-18"],"question":"Er zijn al maatwerkproeven ontwikkeld en goedgekeurd. Waarvoor zijn ze bedoeld?","options":["Als voorbeeld en inspiratie voor eigen proeven","Als verplichte basis voor elk maatwerk examenprogramma","Als vervanging van het standaard examenprogramma"],"answer":0,"explanation":"De goedgekeurde maatwerkproeven zijn bedoeld als voorbeeld en inspiratie om zelf proeven of examenprogramma's te ontwikkelen. Ze zijn geen verplichte basis. Ze vervangen het standaard examenprogramma ook niet. §4.1, p. 45","ref":"§4.1, p. 45","tests":"goedgekeurde maatwerkproeven als voorbeeld en inspiratie","source":{"page":45,"quote":"voorbeeld en inspiratie om zelf proeven of examenprogramma’s te ontwikkelen"},"rev":2},{"id":"EP-0326","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-19"],"question":"De aanvraag van een maatwerk examenprogramma gaat via het aanvraagformulier Maatwerk Examenprogramma. Wie doet die aanvraag?","options":["De Licentiehouder","De Examinator Nationale Zwemdiploma's","De Toetsingscommissie Maatwerk Examenprogramma's"],"answer":0,"explanation":"De Licentiehouder doet de aanvraag via het aanvraagformulier Maatwerk Examenprogramma, te downloaden en in te sturen via www.nrz-nl.nl. De Examinator Nationale Zwemdiploma's doet geen aanvraag. De Toetsingscommissie vraagt niet aan, maar kijkt of het programma voldoet aan de gestelde voorwaarden. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraag door Licentiehouder via aanvraagformulier","source":{"page":45,"quote":"De Licentiehouder doet de aanvraag van een maatwerk examenprogramma via het aanvraagformulier Maatwerk Examenprogramma"},"rev":2},{"id":"EP-0327","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-20","EP-MAAT-12"],"question":"Welke informatie staat NIET op het aanvraagformulier Maatwerk Examenprogramma?","options":["Voor welk examenprogramma goedkeuring wordt aangevraagd","Welke proef uit het standaard examenprogramma wordt vervangen","Welke onderdelen uit het standaard examenprogramma worden weggelaten"],"answer":2,"explanation":"Het formulier vraagt niet welke onderdelen worden weggelaten, want alle onderdelen van het standaard examenprogramma moeten in het maatwerk examenprogramma zitten. Wel staat erop voor welk examenprogramma goedkeuring wordt aangevraagd en of (en welke) proef wordt vervangen. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"inhoud aanvraagformulier Maatwerk Examenprogramma","source":{"page":44,"quote":"Alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van het maatwerk examenprogramma."},"rev":2},{"id":"EP-0328","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-21"],"question":"Aanvraagformulier Maatwerk Examenprogramma:\nWat geldt voor een tekening van het zwembad, foto's of film?","options":["Die mogen eventueel worden toegevoegd.","Die zijn bij elke proef verplicht.","Die mogen niet worden toegevoegd."],"answer":0,"explanation":"Bij de stapsgewijze uitvoering van de proeven mag de Licentiehouder 'eventueel een tekening van het zwembad of beeldmateriaal' (foto's of film) toevoegen. Verplicht is het dus niet, en verboden ook niet. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraagformulier: tekening of beeldmateriaal eventueel","source":{"page":45,"quote":"eventueel een tekening van het zwembad of beeldmateriaal"},"rev":2},{"id":"EP-0329","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-21","EP-MAAT-15"],"question":"Op het aanvraagformulier beschrijft de Licentiehouder hoe de proeven stapsgewijs gaan. Wat onderbouwt hij daarbij, als dat nodig is?","options":["Hoe hij rekening houdt met de normering en de essenties","Hoeveel kandidaten per jaar met het programma zwemmen","Welke Examinator de proeven heeft ontworpen"],"answer":0,"explanation":"Bij de stapsgewijze uitvoering van de proeven onderbouwt de aanvrager, als dat nodig is, hoe rekening wordt gehouden met de normering en de essenties van de onderdelen. Het aantal kandidaten en wie de proeven heeft ontworpen, staan niet in de lijst van het formulier. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraagformulier: onderbouwing normering en essenties","source":{"page":45,"quote":"wordt rekening gehouden met de normering en de essenties van de verschillende"},"rev":2},{"id":"EP-0330","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-22"],"question":"De Toetsingscommissie Maatwerk Examenprogramma's weigert een maatwerk examenprogramma. Welke stelling is juist?\nStelling 1: De Licentiehouder kan een aangepast verzoek indienen.\nStelling 2: De Licentiehouder kan schriftelijk beroep indienen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: na een weigering kan de Licentiehouder een aangepast verzoek indienen bij de Toetsingscommissie. Stelling 2 is ook juist: hij kan ook schriftelijk beroep indienen bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid. §4.1, p. 45","ref":"§4.1, p. 45","tests":"weigering: aangepast verzoek of schriftelijk beroep","source":{"page":45,"quote":"kan de Licentiehouder een aangepast verzoek bij de Toetsingscommissie Maatwerk Examenprogramma’s indienen of schriftelijk beroep indienen bij de Commissie van Beroep"},"rev":2},{"id":"EP-0331","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-22"],"question":"Een Licentiehouder gaat in beroep tegen een geweigerd maatwerk examenprogramma. Hoe en waar dient hij het beroep in?","options":["Schriftelijk, bij de Commissie van Beroep","Mondeling, bij de Commissie van Beroep","Schriftelijk, bij de Toetsingscommissie"],"answer":0,"explanation":"Beroep wordt schriftelijk ingediend bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid. Mondeling beroep wordt niet genoemd. Bij de Toetsingscommissie dient de Licentiehouder geen beroep in, maar een aangepast verzoek. §4.1, p. 45","ref":"§4.1, p. 45","tests":"beroep schriftelijk bij Commissie van Beroep","source":{"page":45,"quote":"schriftelijk beroep indienen bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid"},"rev":2},{"id":"EP-0332","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-23"],"question":"Maatwerk examenprogramma:\nNa de sprong of duik mag een andere oriëntatieopdracht dan het zeil volgen. Hoeveel centimeter onder het wateroppervlak gebeurt die opdracht minimaal?","options":["75 centimeter","180 centimeter","100 centimeter"],"answer":0,"explanation":"In maatwerk mag na de sprong of duik een andere oriëntatieopdracht onder water komen, maar die gebeurt minimaal 75 centimeter onder het wateroppervlak. 180 centimeter (1,8 meter) is de minimale waterdiepte voor de sprong of duik zelf. 100 centimeter (1 meter) is hoe ver de kandidaat minimaal voor het zeil onder water gaat. §4.2.1–4.2.2, p. 48–50","ref":"§4.2.1–4.2.2, p. 48–50","tests":"maatwerk: andere oriëntatieopdracht onder water, minimaal 75 cm","source":{"page":48,"quote":"In het maatwerk examenprogramma mag dat ook een andere oriëntatieopdracht onder water zijn. Het is wel belangrijk dat die opdracht dieper onder water (minimaal 75 centimeter onder het wateroppervlak) wordt uitgevoerd."},"rev":2},{"id":"EP-0333","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-23"],"question":"Maatwerk, onderdeel 'van de kant in het water duiken', Zwemdiploma B:\nNa de duik zwemmen de kandidaten niet door het zeil. Ze pakken een ring die 50 centimeter onder het wateroppervlak hangt. Voldoet dit?","options":["Nee, de ring moet minimaal 75 centimeter diep hangen.","Nee, na de duik is het zeil altijd verplicht.","Ja, bij maatwerk is de opdracht onder water vrij."],"answer":0,"explanation":"In maatwerk mag na de duik een andere oriëntatieopdracht onder water komen dan het zeil. De kandidaat voert die opdracht wel minimaal 75 centimeter onder het wateroppervlak uit; 50 centimeter is te weinig. Het zeil is bij maatwerk dus niet verplicht, maar de opdracht is ook niet helemaal vrij. §4.2.1, p. 48–49","ref":"§4.2.1, p. 48–49","tests":"maatwerk: andere oriëntatieopdracht onder water, minimaal 75 cm","source":{"page":49,"quote":"De kandidaat voert die opdracht minimaal 75 centimeter onder het wateroppervlak uit."},"rev":2},{"id":"EP-0334","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-29"],"question":"Maatwerkproef, Zwemdiploma C:\nDe kandidaat gaat gekleed met een rol voorover te water. Daarna zwemt hij meteen gekleed naar de overkant. Voldoet deze opzet?","options":["Nee, eerst moet hij gaan watertrappen.","Nee, eerst volgt een oriëntatieopdracht onder water.","Ja, er volgt direct een vervolgopdracht."],"answer":0,"explanation":"De rol voorover wordt direct gevolgd door oriënteren in de vorm van watertrappen, en pas daarna door een vervolgopdracht. Direct wegzwemmen slaat het watertrappen over. Een oriëntatieopdracht onder water volgt bij de onderdelen A.2, B.2 en C.2, na de sprong of duik. §4.2.1, p. 48–49","ref":"§4.2.1, p. 48–49","tests":"desoriëntatie-onderdelen: eerst watertrappen, dan vervolgopdracht","source":{"page":48,"quote":"De rol voorover wordt direct gevolgd door oriënteren in de vorm van watertrappen"},"rev":2},{"id":"EP-0335","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-29","EP-MAAT-23"],"question":"Aanvullende voorwaarden, Zwemdiploma A:\nWelke stelling is juist?\nStelling 1: Na het onderdeel 'voetsprong voorwaarts, gekleed' volgt eerst watertrappen.\nStelling 2: Na het onderdeel 'te water gaan met een sprong' volgt eerst watertrappen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de voetsprong voorwaarts, gekleed (A.1) wordt direct gevolgd door oriënteren in de vorm van watertrappen en daarna een vervolgopdracht. Stelling 2 is onjuist: de sprong van A.2 wordt direct gevolgd door een oriëntatieopdracht onder water. §4.2.1, p. 47–49","ref":"§4.2.1, p. 47–49","tests":"aanvullende voorwaarde A.1 (watertrappen) vs A.2 (opdracht onder water)","source":{"page":49,"quote":"De sprong wordt direct gevolgd door een oriëntatieopdracht onder water."},"rev":2},{"id":"EP-0336","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-30"],"question":"Onderdeel '15 seconden gekleed watertrappen':\nWat volgt er na dit onderdeel?","options":["Een actie in een vooraf afgesproken richting","Een oriëntatieopdracht onder water","Een hele draai om de lengteas"],"answer":0,"explanation":"Na het onderdeel '15 seconden gekleed watertrappen' volgt als aanvullende voorwaarde een actie in een vooraf afgesproken richting. Een oriëntatieopdracht onder water volgt na de sprong of duik. Een hele draai om de lengteas maakt de kandidaat bij A.11, al watertrappend. §4.2.5, p. 57–58","ref":"§4.2.5, p. 57–58","tests":"gekleed watertrappen: actie in vooraf afgesproken richting","source":{"page":57,"quote":"Na het watertrappen volgt een actie in een vooraf afgesproken richting."},"rev":2},{"id":"EP-0337","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-31"],"question":"Onderdeel 'onder water zwemmen door een gat in een verticaal hangend zeil', maatwerkproef Zwemdiploma B:\nEen kandidaat gaat een halve meter voor het zeil onder water. Daarna zwemt hij door het gat. Voldoet dit?","options":["Nee, hij moet minimaal 1 meter ervoor onder water gaan.","Nee, hij moet minimaal 3 meter ervoor onder water gaan.","Ja, de manier van verplaatsen onder water is vrij."],"answer":0,"explanation":"Bij dit onderdeel geldt de aanvullende voorwaarde dat de kandidaat minimaal 1 meter voor het zeil onder water gaat; een halve meter is te weinig. De manier van verplaatsen is wel vrij, maar dat heft deze voorwaarde niet op. 3 meter is bij Zwemdiploma A de afstand van het zeil tot de startkant. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"zeil: minimaal 1 meter ervoor onder water gaan","source":{"page":50,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."},"rev":2},{"id":"EP-0338","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-25"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma A. Hij toetst techniek en conditie in twee aparte proeven. Hoeveel meter zwemt de kandidaat in de conditieproef?","options":["100 meter","50 meter","150 meter"],"answer":0,"explanation":"Als techniek en conditie apart worden getoetst, blijft de afstand van het conditiezwemmen gelijk: voor Zwemdiploma A is dat 100 meter. 50 meter is wat er in totaal extra wordt gezwommen. 150 meter is de afstand voor Zwemdiploma B en C. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk techniek en conditie apart: conditie-afstand blijft gelijk","source":{"page":62,"quote":"De afstand van het onderdeel conditiezwemmen blijft voor"}},{"id":"EP-0339","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-25"],"question":"Maatwerk examenprogramma:\nTechniek en conditie staan in twee aparte proeven. Hoeveel meter zwemt de kandidaat in totaal meer dan in het standaard examenprogramma?","options":["50 meter","25 meter","100 meter"],"answer":0,"explanation":"De 25 meter enkelvoudige rugslag en 25 meter schoolslag techniek worden apart getoetst, en de afstand van het conditiezwemmen blijft gelijk. Daardoor wordt er in totaal 50 meter meer gezwommen. 25 meter is maar één van de twee techniekonderdelen, en 100 meter is de afstand conditiezwemmen bij Zwemdiploma A. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk techniek en conditie apart: in totaal 50 m meer","source":{"page":63,"quote":"In totaal worden er in zo’n maatwerk examenprogramma meer meters (50 meter) gezwommen."},"rev":2},{"id":"EP-0340","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-24"],"question":"Conditiezwemmen in een maatwerk examenprogramma:\nWelke stelling is juist?\nStelling 1: De afstand van het conditiezwemmen mag korter zijn dan in het standaard examenprogramma.\nStelling 2: Techniek en conditie mogen in twee aparte proeven staan.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de afstand van het conditiezwemmen blijft voor ieder zwemdiploma gelijk. Stelling 2 is juist: standaard zitten techniek en conditie in één proef, bij maatwerk mogen het er twee zijn. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen: standaard één proef vs maatwerk twee proeven","source":{"page":62,"quote":"Het is toegestaan om de onderdelen techniek en conditie op te nemen in twee proeven."},"rev":2},{"id":"EP-0341","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-26"],"question":"Een Licentiehouder maakt een maatwerk examenprogramma voor Zwemdiploma B. Bij het onderdeel 'conditiezwemmen' laat hij de kandidaten een bepaalde tijd aaneengesloten zwemmen. Er is geen vaste afstand. Mag dat?","options":["Ja, als de geschatte afstand globaal 150 meter is.","Ja, als de geschatte afstand globaal 100 meter is.","Nee, conditiezwemmen is altijd een vaste afstand."],"answer":0,"explanation":"Bij maatwerk mogen kandidaten een bepaalde tijd aaneengesloten zwemmen. De geschatte afstand in die tijd moet dan globaal overeenkomen met de afstand van het conditiezwemmen: voor Zwemdiploma B is dat 150 meter. 100 meter hoort bij Zwemdiploma A. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk conditiezwemmen: tijdseenheid in plaats van afstand","source":{"page":63,"quote":"Het is ook mogelijk om kandidaten een bepaalde tijd aaneengesloten te laten zwemmen."},"rev":2},{"id":"EP-0342","category":"examenprogrammas","subtopic":"maatwerk","type":"kandidaten","objectives":["EP-MAAT-27","EP-MAAT-28"],"question":"Yara en Mohammed doen het onderdeel '150 meter conditiezwemmen' in een goedgekeurd maatwerk examenprogramma voor Zwemdiploma C.\n- Yara wisselt steeds tussen borstcrawl, rugcrawl en schoolslag. Haar techniek is matig en zij komt redelijk vooruit.\n- Mohammed zwemt de hele afstand schoolslag. Zijn techniek is mooi en hij komt bijna niet vooruit.\nWelke kandidaat voldoet aan de normering?","options":["Yara","Mohammed","Yara en Mohammed"],"answer":0,"explanation":"Yara voldoet: bij maatwerk mag de kandidaat wisselen van zwemslag, en de uitvoering van de zwemslagen telt niet mee. Mohammed voldoet niet: zijn techniek telt ook niet mee, maar er moet wel een redelijke voortstuwing zijn. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"maatwerk conditiezwemmen: slagen vrij, uitvoering niet beoordeeld","source":{"page":63,"quote":"De kandidaat moet wel laten zien dat hij de uitvoering van de zwemslagen langer kan volhouden, daarom moet er sprake zijn van een redelijke voortstuwing."},"rev":2},{"id":"EP-0343","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-24","EP-MAAT-27"],"question":"Conditiezwemmen in een maatwerk examenprogramma:\nWelke stelling is juist?\nStelling 1: De kandidaat moet iedere 25 meter van zwemslag wisselen.\nStelling 2: Er moet een redelijke voortstuwing zijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bij maatwerk mag worden afgeweken van de verplichte volgorde en zwemslag; afwisselen om de 25 meter hoort bij het standaard examenprogramma voor A en B. Stelling 2 is juist: de kandidaat moet laten zien dat hij het volhoudt, dus er moet een redelijke voortstuwing zijn. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk conditiezwemmen: geen verplichte volgorde of zwemslag","source":{"page":62,"quote":"Voor het maatwerk mag van de verplichting in volgorde en uit te voeren zwemslag worden"},"rev":2},{"id":"EP-0344","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-28"],"question":"Voor welk onderdeel heeft een maatwerk examenprogramma een andere normering dan het standaard examenprogramma?","options":["Conditiezwemmen","Gekleed zwemmen","25 meter schoolslag techniek"],"answer":0,"explanation":"Alleen voor het onderdeel conditiezwemmen geldt bij maatwerk een andere normering: zwemslagen naar keuze, wisselen mag en werken met een tijdseenheid mag. Voor gekleed zwemmen en de schoolslag techniek geldt de normering van het standaard examenprogramma. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"andere normering conditiezwemmen bij maatwerk","source":{"page":63,"quote":"Voor het onderdeel conditiezwemmen geldt daarom voor een maatwerk examenprogramma een andere normering dan voor het standaard examenprogramma."}},{"id":"EP-0345","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["
