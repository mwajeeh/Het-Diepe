EP-MAAT-32"],"question":"Een Licentiehouder wil het onderdeel 'gekleed zwemmen' van zijn maatwerk examenprogramma laten uitvoeren in een bassin van 100 m2. Is dat toegestaan?","options":["Nee, het bassin moet minimaal 160 m2 zijn.","Ja, de minimale bassingrootte geldt alleen bij conditiezwemmen.","Ja, bij maatwerk mag de bassingrootte afwijken."],"answer":0,"explanation":"Gekleed zwemmen wordt, net als het conditiezwemmen, uitgevoerd in een bassin met een oppervlak van minimaal 160 m2. De normering van het standaard examenprogramma, met deze eis, geldt ook bij maatwerk. §4.2.6, p. 64","ref":"§4.2.6, p. 64","tests":"gekleed zwemmen en conditiezwemmen: bassin minimaal 160 m2","source":{"page":64,"quote":"Het onderdeel wordt uitgevoerd in een bassin met een oppervlak van minimaal 160 m2."},"rev":2},{"id":"EP-0346","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-32"],"question":"Conditiezwemmen gebeurt in een bassin van minimaal 160 m2. Waarom?","options":["Ook een zwembad en open water hebben een groot wateroppervlak.","Alleen een groot bassin heeft genoeg diep water.","Alleen in een groot bassin kan de examinator een groep beoordelen."],"answer":0,"explanation":"Volgens hoofdstuk 4 is er in een zwembad en in open water een groot wateroppervlak en veel ruimte. Daarom gebeurt conditiezwemmen in een bassin van minimaal 160 m2. Het oppervlak zegt niets over de waterdiepte, en een groep beoordelen wordt niet als reden genoemd. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"reden bassin minimaal 160 m2","source":{"page":62,"quote":"groot wateroppervlak en veel ruimte, daarom worden alle onderdelen die horen bij het"},"rev":2},{"id":"EP-0347","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-31","EP-MAAT-30"],"question":"Hoofdstuk 4 noemt bij sommige onderdelen een aanvullende voorwaarde. Bij welk onderdeel NIET?","options":["15 seconden gekleed watertrappen","Onder water zwemmen door een gat in een verticaal hangend zeil","15 seconden drijven op de rug"],"answer":2,"explanation":"Bij het onderdeel '15 seconden drijven op de rug' noemt hoofdstuk 4 geen aanvullende voorwaarde. Bij het onderdeel '15 seconden gekleed watertrappen' volgt wel een actie in een vooraf afgesproken richting. Bij het zeil gaat de kandidaat minimaal 1 meter ervoor onder water. §4.2, p. 46–57","ref":"§4.2, p. 46–57","tests":"aanvullende voorwaarden: bij welke onderdelen","source":{"page":46,"quote":"Daarnaast worden bij sommige onderdelen ook nog aanvullende voorwaarden benoemd"},"rev":2},{"id":"EP-0348","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-19","EP-MAAT-22"],"question":"Een Licentiehouder vraagt een maatwerk examenprogramma aan. Welke stelling is juist?\nStelling 1: De Toetsingscommissie kijkt of het programma aan de voorwaarden voldoet.\nStelling 2: De Commissie van Beroep beoordeelt de aanvraag.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de Toetsingscommissie Maatwerk Examenprogramma's kijkt of het programma voldoet aan de gestelde voorwaarden. Stelling 2 is onjuist: de Commissie van Beroep behandelt alleen een schriftelijk beroep na een weigering. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraag beoordeeld door Toetsingscommissie, niet Commissie van Beroep","source":{"page":45,"quote":"De Toetsingscommissie Maatwerk Examenprogramma’s kijkt of het programma voldoet aan de gestelde voorwaarden."},"rev":2},{"id":"EP-0349","category":"examenprogrammas","subtopic":"maatwerk","type":"stellingen","objectives":["EP-MAAT-02"],"question":"Welke stelling over maatwerk examenprogramma's is juist?\nStelling 1: De onderdelen zijn gelijk aan die van het standaard examenprogramma.\nStelling 2: De Toetsingscommissie toetst eerst elk maatwerk examenprogramma.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de inhoud (onderdelen) van een maatwerk examenprogramma is gelijk aan die van het standaard examenprogramma. Stelling 2 is ook juist: ieder ontwikkeld maatwerk examenprogramma wordt eerst getoetst door de Toetsingscommissie Maatwerk Examenprogramma's. Inleiding en Aanleiding, p. 2 en 4","ref":"Inleiding en Aanleiding, p. 2 en 4","tests":"inhoud maatwerk gelijk aan standaard","source":{"page":4,"quote":"De inhoud (onderdelen) van een maatwerk exprogramma is gelijk aan de inhoud van"},"rev":2},{"id":"EP-0350","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-05"],"question":"Een Licentiehouder wil eigen proeven gebruiken bij het diplomazwemmen. Wat geldt?","options":["Hij moet ze opnemen in een goedgekeurd maatwerk examenprogramma.","Hij mag ze toevoegen aan het standaard examenprogramma.","Hij moet ze laten goedkeuren door de Examinator."],"answer":0,"explanation":"Een Licentiehouder voert óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit, en maatwerk moet vooraf worden goedgekeurd. In het standaard examenprogramma zijn de proeven uitgeschreven. Goedkeuring door de Examinator is niet genoeg. §4, p. 44 en Bijlage 1","ref":"§4, p. 44 en Bijlage 1","tests":"standaard: vaste volgorde, eigen proeven alleen via goedgekeurd maatwerk","source":{"page":"Bijlage 1","quote":"heeft een Licentiehouder de mogelijkheid om óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit te voeren."},"rev":2},{"id":"EP-0400","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-01"],"question":"Wat bedoelt de Examenregeling met de 'essentie' van een onderdeel?","options":["Waarom het onderdeel belangrijk is","Hoe het onderdeel minimaal moet worden uitgevoerd","Welke opdracht na het onderdeel volgt"],"answer":0,"explanation":"De essentie beschrijft waarom een onderdeel belangrijk is, in relatie tot zwemveiligheid. Hoe een onderdeel minimaal moet worden uitgevoerd, staat in de normering. Een opdracht na het onderdeel is een aanvullende voorwaarde. §4.2, p. 46","ref":"§4.2, p. 46","tests":"betekenis van 'essentie' van een onderdeel","source":{"page":46,"quote":"waarom deze belangrijk zijn. Dit wordt de essentie van het onderdeel genoemd."},"rev":2},{"id":"EP-0401","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-01"],"question":"Basiselementen in de Examenregeling:\nWelke stelling is juist?\nStelling 1: De basiselementen zijn belangrijk om verdrinking te voorkomen.\nStelling 2: Alleen voor de basiselementen is beschreven waarom ze belangrijk zijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de basiselementen zijn belangrijk om verdrinking te voorkomen en dus om jezelf te kunnen redden. Stelling 2 is onjuist: dat is beschreven voor zowel de basiselementen als de onderdelen die daarbij horen. §4.2, p. 46","ref":"§4.2, p. 46","tests":"essentie beschreven voor basiselementen én onderdelen","source":{"page":46,"quote":"Voor zowel de basiselementen als de onderdelen die daarbij horen, is beschreven"},"rev":2},{"id":"EP-0402","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-02"],"question":"Waarom staan de onderdelen van 'te water gaan' in de examenprogramma's? Welke reden is NIET juist?","options":["Om niet in paniek te raken bij desoriëntatie","Om veilig te water te gaan in een onbekende omgeving","Om een technisch correcte sprong te leren"],"answer":2,"explanation":"De onderdelen zijn opgenomen om niet in paniek te raken bij desoriëntatie, om vanaf de kant dieper onder water te komen en om veilig in het water te gaan in een onbekende omgeving. Een technisch correcte uitvoering is niet het doel: bij de rol voorover worden bijvoorbeeld geen eisen aan de technische uitvoering gesteld. §4.2.1, p. 46 en 48","ref":"§4.2.1, p. 46 en 48","tests":"doel van de onderdelen te water gaan","source":{"page":46,"quote":"in paniek te raken bij desoriëntatie, vanaf de kant dieper onder water te komen en op een veilige"},"rev":2},{"id":"EP-0403","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-03"],"question":"De voetsprong voorwaarts, het achterwaarts te water gaan en de rol voorover horen bij 'te water gaan'. Bij welk ander basiselement horen ze ook, en waarom?","options":["Survival, omdat ze gekleed worden uitgevoerd","Onder water, omdat de kandidaat onder water raakt","Watertrappen, omdat daarna watertrappen volgt"],"answer":0,"explanation":"Deze drie onderdelen horen ook bij het basiselement 'Survival', omdat ze gekleed worden uitgevoerd. Ze worden wel direct gevolgd door watertrappen, maar dat maakt ze geen onderdeel van dat basiselement. Onder water raken noemt de regeling niet als reden. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"desoriëntatie-onderdelen horen ook bij survival (gekleed)","source":{"page":47,"quote":"basiselement ‘Survival’, omdat ze gekleed worden uitgevoerd"},"rev":2},{"id":"EP-0404","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-05"],"question":"Onderdeel 'voetsprong voorwaarts, gekleed' (A.1):\nWelke stelling is juist?\nStelling 1: Na het bovenkomen volgt direct een oriëntatieopdracht onder water.\nStelling 2: De sprong is vanaf enige hoogte, om dieper onder water te raken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: na het bovenkomen volgt direct oriëntatie boven water en een vervolgopdracht. Een oriëntatieopdracht onder water hoort bij de sprong of duik van A.2, B.2 en C.2. Stelling 2 is juist: om dieper onder water te kunnen raken, wordt de sprong vanaf enige hoogte uitgevoerd. §4.2.1, p. 47 en 48","ref":"§4.2.1, p. 47 en 48","tests":"A.1: na de voetsprong oriëntatie boven water","source":{"page":47,"quote":"Na het bovenkomen volgt direct oriëntatie boven water en een vervolgopdracht."},"rev":2},{"id":"EP-0405","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-04","EP-ESS-05"],"question":"Onderdeel 'voetsprong voorwaarts, gekleed' (A.1):\nEen kandidaat springt vanaf het startblok. Hij gaat helemaal onder water en raakt de bodem. Hij zet zich krachtig af van de bodem om boven te komen. Wat is hier fout volgens de essentie van dit onderdeel?","options":["Hij zet zich af van de bodem.","Hij springt vanaf het startblok.","Hij gaat helemaal onder water."],"answer":0,"explanation":"De essentie van de voetsprong is helemaal onder water gaan, je oriënteren en zelfstandig weer omhoog komen, zonder een afzet van de bodem. Deze kandidaat zet zich wel af van de bodem. Vanaf enige hoogte springen en helemaal onder water gaan horen juist bij dit onderdeel. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"A.1 essentie: bovenkomen zonder afzet van de bodem","source":{"page":47,"quote":"zelfstandig (zonder een afzet van de bodem) weer omhoog kunt komen"},"rev":2},{"id":"EP-0406","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-07"],"question":"Onderdeel 'achterwaarts te water gaan, gekleed' (B.1):\nWaarom is achterwaarts springen niet toegestaan?","options":["Een sprong is een bewuste actie en gevaarlijk.","Een sprong brengt de kandidaat te ver van de kant.","Na een sprong gaat de kandidaat niet helemaal onder water."],"answer":0,"explanation":"Achterwaarts springen is een bewuste actie: er ontstaat geen desoriëntatie en bovendien is het gevaarlijk. Daarom is springen niet toegestaan. De afstand tot de kant en helemaal onder water gaan noemt de regeling niet als reden. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1: achterwaarts springen niet toegestaan","source":{"page":47,"quote":"Achterwaarts springen is een bewuste actie. Er ontstaat geen desoriëntatie en bovendien is het gevaarlijk."},"rev":2},{"id":"EP-0407","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-07","EP-ESS-06"],"question":"Proef B1 Survival, onderdeel 'gekleed achterwaarts te water gaan':\nEen kandidaat staat gekleed met zijn rug naar het water. Hij maakt een krachtige sprong achterwaarts het water in. Daarna gaat hij direct watertrappen. Wat beslist de examinator?","options":["Onvoldoende: springen is niet toegestaan.","Onvoldoende: hij moet zittend te water gaan.","Voldoende: hij ziet de valrichting niet."],"answer":0,"explanation":"Bij achterwaarts te water gaan moet er een valbeweging zijn; springen is niet toegestaan. Een sprong is een bewuste actie, geeft geen desoriëntatie en is gevaarlijk. Te water gaan mag zittend of staand, en dat hij de valrichting niet ziet, maakt de sprong niet goed. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1: achterwaarts springen niet toegestaan","source":{"page":47,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."},"rev":2},{"id":"EP-0408","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-06"],"question":"Onderdeel 'achterwaarts te water gaan, gekleed' (B.1):\nEen kandidaat staat met zijn rug naar het water. Hij kijkt over zijn schouder naar het water. Daarna laat hij zich achterover vallen. Wat is hier fout?","options":["Hij kijkt waar hij terechtkomt.","Hij gaat staand te water.","Hij laat zich achterover vallen."],"answer":0,"explanation":"De essentie van B.1 is te water gaan zonder te weten waar je precies terechtkomt. Daarom heeft de kandidaat geen zicht op de valrichting. Staand te water gaan mag, en vallen is juist de bedoeling. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1 essentie: te water zonder te weten waar je terechtkomt","source":{"page":47,"quote":"De kandidaat heeft geen zicht op de valrichting."},"rev":2},{"id":"EP-0409","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-08"],"question":"Onderdeel 'met een rol voorover te water gaan, gekleed' (C.1):\nWaarom stelt de Examenregeling geen eisen aan de techniek van de rol?","options":["Het gaat om de draai en het heroriënteren daarna.","Kleding maakt een goede techniek te moeilijk.","Een rol vanaf een lage kant is nooit gevaarlijk."],"answer":0,"explanation":"De essentie van de rol voorover is met een draai om de breedteas te water raken, gedesoriënteerd zijn en je daarna heroriënteren. Daarom zijn er geen eisen aan de technische uitvoering. Kleding en een lage bassinrand worden niet als reden genoemd. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"C.1: geen eisen aan techniek rol voorover","source":{"page":48,"quote":"Er worden daarom geen eisen gesteld aan de technische uitvoering van de rol voorover."},"rev":2},{"id":"EP-0410","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-08"],"question":"Onderdeel 'met een rol voorover te water gaan, gekleed' (C.1):\nEen kandidaat maakt een scheve, rommelige rol voorover vanaf de lage kant. Hij komt verder van de kant in het water dan verwacht. Daarna gaat hij direct watertrappen. Wat beslist de examinator over de rol?","options":["Voldoende: hij maakt een draai om de breedteas.","Onvoldoende: hij moet de rol technisch correct maken.","Onvoldoende: hij moet vanaf een hoge kant rollen."],"answer":0,"explanation":"Bij C.1 moet er een draai om de breedteas zijn; aan de technische uitvoering worden geen eisen gesteld. De plaats waar de kandidaat in het water komt, is niet van belang. De rol mag ook vanaf een (lage) kant. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"C.1: geen eisen aan techniek rol voorover","source":{"page":48,"quote":"De plaats waar de kandidaat in het water terecht komt, is niet van belang."},"rev":2},{"id":"EP-0411","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-09"],"question":"Waarom staat 'duiken' in de examenprogramma's als manier om dieper onder water te gaan?","options":["In diep water kun je je niet makkelijk van de bodem afzetten.","Duiken is de veiligste manier in open water.","Na een duik blijf je het doel zien."],"answer":0,"explanation":"In water van 1,8 meter of dieper verdwijn je na een sprong of duik meestal helemaal onder water. Je kunt je dan niet makkelijk van de bodem afzetten om weer boven te komen. Als je niet weet hoe diep het water is, zoals in open water, is duiken juist gevaarlijk. Het doel blijven zien hoort bij de sprong waarbij het hoofd boven water blijft. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"waarom duiken is opgenomen (dieper onder gaan)","source":{"page":48,"quote":"kun je niet makkelijk afzetten van de bodem om weer boven te komen"},"rev":2},{"id":"EP-0412","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-12","EP-ESS-09"],"question":"Welke stelling over duiken is juist?\nStelling 1: Duiken is de populaire benaming voor de kopsprong.\nStelling 2: Duiken is veilig als je niet weet hoe diep het water is.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: duiken is de populaire benaming voor de kopsprong. Stelling 2 is onjuist: als je niet weet hoe diep het water is, zoals in open water, is duiken gevaarlijk. Je kunt dan met een klap op de bodem komen. §4.2.1, p. 48 en 49","ref":"§4.2.1, p. 48 en 49","tests":"onbekende waterdiepte: geen voetsprong of duik","source":{"page":49,"quote":"is de keuze voor een voetsprong of duiken gevaarlijk"},"rev":2},{"id":"EP-0413","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-10"],"question":"Bij welk zwemdiploma mag de kandidaat dieper onder water gaan met een sprong in plaats van een duik?","options":["Zwemdiploma A","Zwemdiploma B","Zwemdiploma C"],"answer":0,"explanation":"Bij Zwemdiploma A mag de kandidaat ook met een sprong dieper onder water gaan. Duiken is dan nog niet verplicht, maar heeft wel de voorkeur. Bij Zwemdiploma B en C is het onderdeel 'van de kant in het water duiken' (B.2, C.2). §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"A.2 sprong toegestaan vs B.2/C.2 duiken","source":{"page":48,"quote":"Duiken is dan nog niet verplicht, maar heeft wel de voorkeur."},"rev":2},{"id":"EP-0414","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-10"],"question":"Bij Zwemdiploma A heeft duiken voor de kandidaat de voorkeur boven een sprong. Waarom?","options":["Na een duik gaat de oriëntatieopdracht makkelijker dan na een sprong.","Na een duik zet hij zich makkelijker af dan na een sprong.","Een sprong is in 1,8 meter diep water gevaarlijk."],"answer":0,"explanation":"Het is voor de kandidaat veel makkelijker om na een duik de oriëntatieopdracht onder water uit te voeren. Makkelijker afzetten van de bodem noemt de regeling niet als reden. Een sprong in water van 1,8 meter diep is bij Zwemdiploma A gewoon toegestaan. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"A.2: waarom duiken de voorkeur heeft","source":{"page":48,"quote":"Het is voor de kandidaat veel makkelijker om na een duik de oriëntatieopdracht onder water uit te voeren."},"rev":2},{"id":"EP-0415","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-11"],"question":"Onderdeel 'van de kant in het water duiken' (B.2):\nEen kandidaat duikt met de handen eerst en gaat geheel onder water. Hij komt even boven om adem te halen. Daarna zwemt hij onder water door het gat in het zeil. Wat is hier fout volgens de essentie van dit onderdeel?","options":["Hij komt eerst boven om adem te halen.","Hij gaat met de handen eerst te water.","Hij gaat na de duik geheel onder water."],"answer":0,"explanation":"De essentie van duiken is hoofdwaarts te water gaan en direct daarna, zonder boven te komen, onder water oriënteren en een opdracht uitvoeren. Deze kandidaat komt eerst boven. Met de handen eerst te water gaan en geheel onder water gaan horen juist bij het duiken. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"duik/sprong: direct onder water oriënteren zonder boven te komen","source":{"page":49,"quote":"hoofdwaarts te water gaan om direct daarna, zonder boven te komen, onder water te oriënteren"},"rev":2},{"id":"EP-0416","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-12"],"question":"Een kind wil in een recreatieplas te water gaan. Het weet niet hoe diep het water daar is. Wat kan het kind het beste doen?","options":["Het maakt een sprong waarbij het hoofd boven water blijft.","Het duikt van de kant in het water.","Het maakt een voetsprong vanaf enige hoogte."],"answer":0,"explanation":"Als je niet weet hoe diep het water is, is een voetsprong of duiken gevaarlijk. Je kunt met een klap op de bodem komen en een been of zelfs je nek breken. In zo'n situatie kun je een sprong maken waarbij het hoofd boven water blijft. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"onbekende waterdiepte: geen voetsprong of duik","source":{"page":49,"quote":"In zo’n situatie kun je een sprong maken waarbij het hoofd boven water blijft"},"rev":2},{"id":"EP-0417","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-13"],"question":"Onderdeel 'gekleed te water gaan met een sprong waarbij het hoofd boven water blijft' (C.3):\nWat is de essentie van deze sprong?","options":["Je blijft het doel zien waar je naartoe wilt zwemmen.","Je gaat helemaal onder water en komt zelfstandig omhoog.","Je gaat direct onder water oriënteren."],"answer":0,"explanation":"De essentie van C.3 is dat je hoofd boven water blijft en je het doel waar je naartoe wilt zwemmen kunt blijven zien. Helemaal onder water gaan en zelfstandig omhoog komen is de essentie van de voetsprong (A.1). Direct onder water oriënteren hoort bij A.2, B.2 en C.2. §4.2.1, p. 47 en 49","ref":"§4.2.1, p. 47 en 49","tests":"C.3 essentie: doel blijven zien","source":{"page":49,"quote":"je het doel waar je naar toe wilt zwemmen kunt blijven zien"},"rev":2},{"id":"EP-0418","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-13"],"question":"Waarvoor gebruik je de sprong waarbij het hoofd boven water blijft NIET?","options":["Iemand helpen die in de problemen zit","Blijven kijken naar iets of iemand in het water","Dieper onder water komen om iets op te halen"],"answer":2,"explanation":"Bij deze sprong blijft het hoofd juist boven water. Dieper onder water komen om iets van de bodem te halen hoort bij de sprong (A.2) of het duiken (B.2, C.2). Blijven kijken naar iets of iemand in het water noemt de regeling wel, en ook later (als de kandidaat ouder is) iemand helpen die in de problemen zit. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"toepassingen sprong hoofd boven water (kijken, helpen)","source":{"page":49,"quote":"De essentie van deze sprong is dat je hoofd boven water blijft"},"rev":2},{"id":"EP-0419","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-14"],"question":"Basiselement 'onder water':\nWelke stelling over het doel van de onderdelen is juist?\nStelling 1: Ze zijn bedoeld om de adem zo lang mogelijk in te houden.\nStelling 2: Ze zijn bedoeld om voorwerpen te ontwijken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: zo lang mogelijk de adem inhouden wordt niet als doel genoemd. Stelling 2 is juist: de onderdelen zijn bedoeld om (gekleed) onder water te durven zwemmen en te oriënteren, en om voorwerpen te ontwijken. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"doel basiselement onder water","source":{"page":50,"quote":"zwemmen en te oriënteren en om voorwerpen te ontwijken"},"rev":2},{"id":"EP-0420","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-15"],"question":"Onderdeel 'onder water zwemmen door een gat in een verticaal hangend zeil':\nWat is de essentie van dit onderdeel?","options":["Onder water kijken en je in een bepaalde richting verplaatsen","Onder water inschatten waar je veilig boven kunt komen","Soepel en makkelijk onder een mat of bootje door zwemmen"],"answer":0,"explanation":"De essentie is dat de kandidaat onder water kan kijken en zich daarna in een bepaalde richting kan verplaatsen (oriënteren). Inschatten waar je veilig boven kunt komen hoort bij bovenkomen in een 'wak' (C.5). Soepel onder een voorwerp door zwemmen is de essentie van B.5 en C.6. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"essentie zeil-onderdeel: kijken en verplaatsen in een richting","source":{"page":50,"quote":"De essentie van dit onderdeel is dat de kandidaat onder water kan kijken"},"rev":2},{"id":"EP-0421","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-15","EP-ESS-17"],"question":"Onderdeel 'onder water zwemmen door een gat in een verticaal hangend zeil', Zwemdiploma B:\nEen kandidaat gebruikt onder water geen schoolslag. Hij maakt alleen een beenbeweging, met de armen langs het lichaam. Waar let de examinator op?","options":["Of hij door het gat in het zeil zwemt.","Of hij onder water de schoolslag gebruikt.","Of zijn armen gestrekt boven het hoofd blijven."],"answer":0,"explanation":"Bij dit onderdeel is de manier waarop je je onder water verplaatst vrij. Het gaat om het volbrengen van de opdracht: door het gat in het zeil zwemmen. Gestrekte armen boven het hoofd horen bij voetwaarts richting de bodem zakken. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"zeil-onderdeel: manier van verplaatsen vrij","source":{"page":50,"quote":"verplaatst is vrij. Het gaat om het volbrengen van de opdracht."},"rev":2},{"id":"EP-0422","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-16"],"question":"Waarom staat 'bovenkomen in een wak' in het examenprogramma voor Zwemdiploma C?","options":["Om in te schatten waar je veilig boven kunt komen","Om direct te kunnen watertrappen","Om gekleed onder water te zwemmen in open water"],"answer":0,"explanation":"Het is belangrijk om onder water in te schatten op welke plek je het beste boven water kunt komen. Zo stoot je je hoofd niet aan een boot of mat en bots je niet tegen andere mensen. Watertrappen en gekleed zwemmen in open water worden daarbij niet als reden genoemd. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"waarom bovenkomen in een wak (C)","source":{"page":50,"quote":"Het is ook belangrijk om onder water in te schatten op welke plek je het beste boven water kunt komen."},"rev":2},{"id":"EP-0423","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-16"],"question":"Onderdeel '6 meter onder water zwemmen, aansluitend boven komen in een wak' (C.5):\nWelke stelling is juist?\nStelling 1: De kandidaat komt boven op een veilige plek.\nStelling 2: De kandidaat moet onder water de schoolslag gebruiken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de kandidaat komt na het onder water zwemmen boven op een veilige plek, zodat hij zijn hoofd niet stoot aan een boot of mat. Stelling 2 is onjuist: de schoolslag onder water is verstandig, maar niet verplicht. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"waarom bovenkomen in een wak (C)","source":{"page":51,"quote":"en daarna boven kan komen op een veilige plek"},"rev":2},{"id":"EP-0424","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-17"],"question":"Onderdeel '3 en 6 meter onder water zwemmen' (A.4, B.4):\nDe schoolslag is hierbij niet verplicht. Waarom is die toch verstandig?","options":["Zo kost het relatief weinig energie.","Zo komt de kandidaat niet te vroeg boven.","Zo telt de sprong of duik mee in de afstand."],"answer":0,"explanation":"Verplaatsen onder water met de schoolslag kost bij een goede uitvoering relatief weinig energie en geeft veel verplaatsing. Dat de afstand van een sprong of duik meetelt, staat in de normering en heeft niets met de schoolslag te maken. Te vroeg bovenkomen wordt niet als reden genoemd. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"schoolslag onder water verstandig maar niet verplicht","source":{"page":51,"quote":"kost het relatief weinig energie en is er sprake van veel verplaatsing."},"rev":2},{"id":"EP-0425","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-18"],"question":"Onderdeel 'gekleed onder een drijvend voorwerp door zwemmen' (B.5, C.6):\nWat is de essentie van dit onderdeel?","options":["Soepel en makkelijk onder een voorwerp door zwemmen","Bovenkomen op een afgesproken plek","Zonder angst over een voorwerp heen klimmen"],"answer":0,"explanation":"Gekleed onder water zwemmen voelt heel anders en is vermoeiender dan in badkleding. De essentie is daarom soepel en makkelijk onder een voorwerp, zoals een mat of bootje, door kunnen zwemmen. Bovenkomen op een afgesproken plek hoort bij C.5, en over een voorwerp heen klimmen bij C.22. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"essentie gekleed onder drijvend voorwerp door zwemmen","source":{"page":51,"quote":"De essentie van dit onderdeel is het soepel en makkelijk onder een voorwerp"},"rev":2},{"id":"EP-0426","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-19"],"question":"Onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen' (C.7):\nWaarom mag de jas hierbij uit?","options":["Met een jas is onder water zwemmen erg vermoeiend.","Met een jas past de kandidaat niet door het gat.","Met een jas kan de kandidaat niet goed kijken."],"answer":0,"explanation":"Onder water zwemmen met een jas is erg vermoeiend en ook niet aan te raden. Daarom mag de jas, die bij Zwemdiploma C bij de kleding hoort, bij C.7 uit. De andere twee redenen noemt de regeling niet. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"C.7: jas uit (vermoeiend)","source":{"page":52,"quote":"Het zwemmen onder water met een jas is erg vermoeiend (en ook niet aan te raden)."},"rev":2},{"id":"EP-0427","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-19"],"question":"Onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen' (C.7):\nWelke stelling is juist?\nStelling 1: De kandidaat draagt hierbij een jas.\nStelling 2: De manier van verplaatsen onder water is vrij.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: tijdens C.7 wordt geen jas gedragen, omdat onder water zwemmen met een jas erg vermoeiend is. Stelling 2 is juist: de manier waarop je je onder water verplaatst, is vrij. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"C.7: jas uit (vermoeiend)","source":{"page":52,"quote":"Tijdens dit onderdeel wordt geen jas gedragen."},"rev":2},{"id":"EP-0428","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-20"],"question":"Onderdeel 'voetwaarts richting de bodem zakken' (A.5, B.6):\nWaarom houdt de kandidaat de armen gestrekt boven het hoofd?","options":["Zo kan hij snel en gestroomlijnd zakken.","Zo maakt hij met de armen een startsnelheid.","Zo ziet hij waar hij boven kan komen."],"answer":0,"explanation":"Door de gestrekte armen boven het hoofd kan het zakken naar de bodem veel sneller en meer gestroomlijnd gebeuren. De startsnelheid komt bij voetwaarts zakken uit een krachtige beenbeweging. Inschatten waar je boven kunt komen hoort bij bovenkomen in een 'wak'. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"voetwaarts zakken: armen gestrekt boven het hoofd","source":{"page":52,"quote":"armen boven het hoofd kan het zakken naar de bodem veel sneller (en meer gestroomlijnd)"},"rev":2},{"id":"EP-0429","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-21"],"question":"Onderdeel 'hoofdwaarts richting de bodem gaan' (C.8):\nHoe maakt de kandidaat een startsnelheid?","options":["Met een krachtige armdoorhaal","Met een krachtige beenbeweging","Door de benen te strekken"],"answer":0,"explanation":"Bij hoofdwaarts richting de bodem gaan komt de startsnelheid uit een krachtige armdoorhaal. Een krachtige beenbeweging geeft de startsnelheid bij voetwaarts richting de bodem zakken. De benen strekken zorgt voor een snelle, gestroomlijnde beweging naar beneden. §4.2.2, p. 52 en 53","ref":"§4.2.2, p. 52 en 53","tests":"startsnelheid voetwaarts (benen) vs hoofdwaarts (armen)","source":{"page":53,"quote":"met behulp van een krachtige armdoorhaal wordt een startsnelheid gecreëerd"},"rev":2},{"id":"EP-0430","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-21"],"question":"Onderdeel 'hoofdwaarts richting de bodem gaan' (C.8):\nEen kandidaat brengt de kin op de borst en gaat hoofdwaarts naar beneden. Hij gaat schuin en niet verticaal. Zijn benen komen geheel onder water. Wat beslist de examinator?","options":["Voldoende: de verticale uitvoering wordt niet beoordeeld.","Voldoende: hoofdwaarts of voetwaarts gaan is vrij.","Onvoldoende: de beweging moet verticaal zijn."],"answer":0,"explanation":"Zo verticaal mogelijk naar beneden gaan heeft de voorkeur, maar wordt niet bij de beoordeling betrokken. Deze kandidaat voldoet daarom. Hoofdwaarts of voetwaarts is niet vrij: bij C.8 is de beweging hoofdwaarts richting de bodem. §4.2.2, p. 53","ref":"§4.2.2, p. 53","tests":"C.8: kin op borst; verticaal niet beoordeeld","source":{"page":53,"quote":"De beweging wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dit wordt niet bij de beoordeling betrokken."},"rev":2},{"id":"EP-0431","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-22"],"question":"Basiselement drijven:\nWelke stelling is juist?\nStelling 1: Drijven doe je op de plaats.\nStelling 2: Drijven wordt vooral gebruikt om je boven water te oriënteren.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: drijven doe je op de plaats. Stelling 2 is onjuist: drijven wordt gebruikt om even uit te rusten tijdens het overbruggen van een afstand, of om te wachten tot iemand je komt redden of helpen. §4.2.3, p. 53","ref":"§4.2.3, p. 53","tests":"doel drijven: uitrusten, wachten op hulp","source":{"page":53,"quote":"gebruikt om even uit te rusten tijdens het overbruggen van een afstand of om te wachten tot"},"rev":2},{"id":"EP-0432","category":"examenprogrammas","subtopic":"essenties","type":"kandidaten","objectives":["EP-ESS-23"],"question":"Noor en Daan doen het onderdeel '10 seconden drijven op de rug' voor Zwemdiploma A.\n- Noor ligt horizontaal met gespreide armen en benen. Zij blijft op de plaats.\n- Daan ligt horizontaal met zijn armen langs het lichaam. Hij maakt kleine wrikbewegingen met zijn handen en blijft op de plaats.\nWelke kandidaat voldoet aan de normering?","options":["Noor","Daan","Noor en Daan"],"answer":2,"explanation":"Bij drijven op de rug is de houding van armen en benen vrij. Wrikbewegingen met armen of handen mogen ook, want dan is het makkelijker om horizontaal te blijven liggen. Noor en Daan liggen allebei horizontaal en blijven op de plaats, dus ze voldoen allebei. §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"drijven: houding vrij, wrikbewegingen toegestaan","source":{"page":54,"quote":"De armen/handen (wrikbewegingen) mogen worden gebruikt, het wordt dan makkelijker om horizontaal te blijven liggen."},"rev":2},{"id":"EP-0433","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-24"],"question":"Je wilt verticaal drijven met een drijvend voorwerp. Welk voorwerp is daarvoor het meest geschikt?","options":["Een dumbell","Een bal","Een plankje"],"answer":0,"explanation":"Verticaal drijven gaat makkelijker met een stuk flexibeam, een dumbell of een ander klein voorwerp. Een (te) groot voorwerp, zoals een bal of een plankje, stimuleert het kantelen naar de rug. §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"groot vs klein drijvend voorwerp bij verticaal drijven","source":{"page":54,"quote":"Deze vaardigheid is makkelijker uit te voeren wanneer een stuk flexibeam, een dumbell of een ander klein voorwerp wordt gebruikt."},"rev":2},{"id":"EP-0434","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-25"],"question":"Onderdeel '30 seconden gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp' (C.10):\nWaarom trekt de kandidaat de knieën op en houdt hij de ellebogen tegen het lichaam?","options":["Zo vermindert de afkoeling in koud water.","Zo kan hij zich naar de kant verplaatsen.","Zo blijft het hoofd boven water zonder voorwerp."],"answer":0,"explanation":"Bij C.10 worden zoveel mogelijk de principes van de HELP-houding gebruikt. Deze houding vermindert de afkoeling in koud water aanzienlijk. De kandidaat blijft daarbij op de plaats en gebruikt juist een drijvend voorwerp. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"C.10 HELP-houding: minder afkoeling","source":{"page":55,"quote":"Deze houding zorgt ervoor dat de afkoeling in koud water aanzienlijk vermindert."},"rev":2},{"id":"EP-0435","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-25"],"question":"Drijven met gebruik van een drijvend voorwerp:\nWat is een verschil tussen B.8 (Zwemdiploma B) en C.10 (Zwemdiploma C)?","options":["Alleen bij B.8 is rugligging toegestaan.","Alleen bij B.8 is de keuze voor het voorwerp vrij.","Alleen bij C.10 blijft de kandidaat op de plaats."],"answer":0,"explanation":"Bij B.8 is de houding bij voorkeur verticaal, maar rugligging is ook toegestaan. Bij C.10 is verticaal blijven drijven de essentie. De keuze voor het voorwerp is bij beide vrij, en bij beide blijft de kandidaat op de plaats. §4.2.3, p. 54 en 55","ref":"§4.2.3, p. 54 en 55","tests":"B.8 rugligging toegestaan vs C.10 verticaal","source":{"page":54,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."},"rev":2},{"id":"EP-0436","category":"examenprogrammas","subtopic":"essenties","type":"kandidaten","objectives":["EP-ESS-25"],"question":"Zwemdiploma C:\nFatima en Luuk doen het onderdeel '30 seconden gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp'.\n- Fatima drijft verticaal op een plankje, met de knieën opgetrokken en de ellebogen tegen het lichaam. Zij houdt het hoofd boven water en blijft op de plaats.\n- Luuk ligt in rugligging op een plankje. Hij houdt het hoofd boven water en blijft op de plaats.\nWelke kandidaat voldoet aan de normering?","options":["Fatima","Luuk","Fatima en Luuk"],"answer":0,"explanation":"Bij C.10 is een verticale houding nodig, met opgetrokken knieën en de ellebogen tegen het lichaam. Fatima voldoet daaraan. Luuk voldoet niet: rugligging is alleen toegestaan bij B.8, het drijven met een drijvend voorwerp voor Zwemdiploma B. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.8 rugligging toegestaan vs C.10 verticaal","source":{"page":55,"quote":"De essentie van dit onderdeel is dat de kandidaat verticaal kan blijven drijven met gebruik van een drijvend voorwerp."},"rev":2},{"id":"EP-0437","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-26"],"question":"Onderdeel '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen' (B.9):\nWat is de essentie van dit onderdeel?","options":["Je verplaatsen als je je benen niet goed kunt gebruiken","Even uitrusten tijdens het overbruggen van een afstand","Van rug- naar buikligging veranderen"],"answer":0,"explanation":"De essentie van B.9 is dat je je kunt verplaatsen als je om een bepaalde reden je benen niet goed kunt gebruiken. Even uitrusten tijdens het overbruggen van een afstand is een functie van drijven. Van rug- naar buikligging veranderen hoort bij de halve draai om de lengteas. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"B.9 essentie: verplaatsen als de benen niet bruikbaar zijn","source":{"page":55,"quote":"De essentie van de opdracht is dat je je kunt verplaatsen wanneer je om een bepaalde reden je benen niet goed kunt gebruiken."},"rev":2},{"id":"EP-0438","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-26"],"question":"Voortbewegen op de rug met gebruik van de armen:\nWat is een verschil tussen B.9 (Zwemdiploma B) en C.11 (Zwemdiploma C)?","options":["Alleen bij C.11 mag de kandidaat zich ook voetwaarts verplaatsen.","Alleen bij B.9 wordt het onderdeel gekleed uitgevoerd.","Alleen bij C.11 mogen de armen boven water komen."],"answer":0,"explanation":"Bij B.9 is de verplaatsing in de richting van het hoofd, omdat dit het eenvoudigst is. Bij C.11 is verplaatsing zowel in de richting van het hoofd als van de voeten toegestaan. C.11 is het onderdeel dat gekleed wordt uitgevoerd, en bij beide blijven de armen onder water. §4.2.3, p. 55 en 56","ref":"§4.2.3, p. 55 en 56","tests":"B.9 hoofdwaarts (eenvoudigst) vs C.11 beide richtingen","source":{"page":56,"quote":"Verplaatsing is zowel in de richting van het hoofd als de voeten toegestaan."},"rev":2},{"id":"EP-0439","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-27"],"question":"Waarvoor dient een halve draai om de lengteas (A.8, B.10)?","options":["Van rug- naar buikligging gaan zonder overeind te komen","Met een draai te water raken en heroriënteren","Tijdens het watertrappen actief om je heen kijken"],"answer":0,"explanation":"Met een halve draai om de lengteas kun je van rug- naar buikligging veranderen zonder dat je overeind hoeft te komen. Met een draai te water raken is de rol voorover, om de breedteas. Tijdens het watertrappen actief om je heen kijken hoort bij de hele draai van A.11. §4.2.4, p. 56","ref":"§4.2.4, p. 56","tests":"halve draai om de lengteas: van rug naar buik zonder overeind","source":{"page":56,"quote":"Dit kan om te veranderen van rug- naar buikligging zonder dat je overeind hoeft te komen."},"rev":2},{"id":"EP-0440","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-28"],"question":"Watertrappen wordt vooral gebruikt om te oriënteren boven water. Welke toepassing noemt de Examenregeling NIET?","options":["Van een glijbaan in het water terechtkomen","Een bal naar elkaar overgooien","Een lange afstand in een recreatieplas overbruggen"],"answer":2,"explanation":"Met watertrappen kun je zonder veel inspanning met het hoofd boven water om je heen kijken. De regeling noemt onder meer in het water terechtkomen van een glijbaan of springplank, en een bal naar elkaar overgooien. Een lange afstand overbruggen hoort bij het basiselement voortbewegen. §4.2.5, p. 56 en 57","ref":"§4.2.5, p. 56 en 57","tests":"toepassingen watertrappen (oriënteren boven water)","source":{"page":56,"quote":"Watertrappen is een belangrijke vaardigheid die vooral wordt gebruikt om te oriënteren boven water."},"rev":2},{"id":"EP-0441","category":"examenprogrammas","subtopic":"essenties","type":"kandidaten","objectives":["EP-ESS-29"],"question":"Lotte en Sem doen het onderdeel '15 seconden gekleed watertrappen' voor Zwemdiploma B. Ze hebben allebei een verticale houding en het hoofd boven water. Ze bewegen beide benen en blijven op de plaats.\n- Lotte houdt haar vingers boven water.\n- Sem beweegt zijn handen onder water mee.\nWelke kandidaat voldoet aan de normering?","options":["Lotte","Sem","Lotte en Sem"],"answer":1,"explanation":"Bij gekleed watertrappen zijn de armen/handen onder water en bewegen ze mee ter ondersteuning. Lotte houdt haar vingers boven water, zoals vroeger gebruikelijk was, en voldoet daarom niet. Sem voldoet wel. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"gekleed watertrappen: armen ondersteunen, geen vingers boven water","source":{"page":57,"quote":"De armen/handen zijn onder water en bewegen mee ter ondersteuning."},"rev":2},{"id":"EP-0442","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-30"],"question":"Onderdeel '30 seconden watertrappen met de benen' (C.14):\nWelke stelling is juist?\nStelling 1: Dit is intensiever dan watertrappen met armen en benen.\nStelling 2: Dit is bedoeld voor als de armen niet mee kunnen bewegen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: deze uitvoering is intensiever dan wanneer de armen ter ondersteuning mogen worden gebruikt. Stelling 2 is ook juist: de essentie is dat de kandidaat zich kan oriënteren als de armen om een bepaalde reden niet mee kunnen bewegen. §4.2.5, p. 58 en 59","ref":"§4.2.5, p. 58 en 59","tests":"watertrappen met alleen de benen: intensiever","source":{"page":59,"quote":"Deze uitvoering is intensiever dan wanneer de armen ter ondersteuning mogen worden gebruikt."},"rev":2},{"id":"EP-0443","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-31"],"question":"Enkelvoudige rugslag en schoolslag:\nWelke stelling is juist?\nStelling 1: Met kleding aan zijn ze minder lang vol te houden dan de borstcrawl.\nStelling 2: Ze zijn tot op hoge leeftijd uit te voeren.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: deze zwemslagen zijn over een langere afstand makkelijk vol te houden, ook met kleding aan. Rugcrawl en borstcrawl zijn misschien minder geschikt om langere afstanden te overbruggen. Stelling 2 is juist: beide zwemslagen zijn tot op hoge leeftijd uit te voeren. §4.2.6, p. 59","ref":"§4.2.6, p. 59","tests":"rugslag/schoolslag: weinig energie, ook gekleed vol te houden","source":{"page":59,"quote":"daarom over een langere afstand makkelijk vol te houden, ook wanneer er met kleding wordt gezwommen."},"rev":2},{"id":"EP-0444","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-32"],"question":"Rugcrawl en borstcrawl:\nWaarvoor is het beheersen van deze zwemslagen volgens de Examenregeling vooral belangrijk?","options":["Voor het beleven van plezier","Voor het besparen van energie","Voor het zwemmen tot op hoge leeftijd"],"answer":0,"explanation":"Rugcrawl en borstcrawl zijn misschien minder geschikt om langere afstanden te overbruggen, maar het beheersen ervan levert een grote bijdrage aan het beleven van plezier. Relatief weinig energie kosten en tot op hoge leeftijd uit te voeren zijn, noemt de regeling bij de enkelvoudige rugslag en de schoolslag. §4.2.6, p. 59","ref":"§4.2.6, p. 59","tests":"rugslag/schoolslag veiligheid vs crawl plezier","source":{"page":59,"quote":"maar het beheersen ervan levert een grote bijdrage aan het beleven van plezier."},"rev":2},{"id":"EP-0445","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-33"],"question":"Enkelvoudige rugslag:\nWaarom houdt de kandidaat de armen ontspannen naast het lichaam, en niet onder het hoofd?","options":["Zo is er zo weinig mogelijk frontale weerstand.","Zo kan hij om zich heen blijven kijken.","Zo blijft de ademhaling ontspannen."],"answer":0,"explanation":"Met de armen ontspannen naast het lichaam is er zo weinig mogelijk frontale weerstand. Daardoor wordt de verplaatsing met meer gemak bereikt. Om je heen blijven kijken noemt de regeling bij de schoolslag, en een ontspannen ademhaling staat in de normering van de schoolslag. §4.2.6, p. 60","ref":"§4.2.6, p. 60","tests":"enkelvoudige rugslag: armen naast lichaam, minste frontale weerstand","source":{"page":60,"quote":"is er sprake van zo weinig mogelijk frontale weerstand"},"rev":2},{"id":"EP-0446","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-34"],"question":"Borstcrawl:\nWaarom is ademhalen voor Zwemdiploma A en B nog niet noodzakelijk?","options":["Het is voor jonge kinderen moeilijk en geeft veel weerstand.","Het gezicht blijft bij A en B boven water.","Er is bij A en B nog geen armslag over het water."],"answer":0,"explanation":"In het begin van het leerproces is ademhalen bij de borstcrawl moeilijk voor jonge kinderen, en er ontstaat veel (extra) weerstand. Daarom is het bij A en B nog niet noodzakelijk. Ook bij A en B is het gezicht in het water en is er een armslag over het water. §4.2.6, p. 61","ref":"§4.2.6, p. 61","tests":"borstcrawl A/B: waarom ademhaling niet noodzakelijk","source":{"page":61,"quote":"leerproces is het uitvoeren van de ademhaling moeilijk voor jonge kinderen, er ontstaat veel (extra) weerstand."},"rev":2},{"id":"EP-0447","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-34"],"question":"Borstcrawl, ademhaling:\nWelke stelling is juist?\nStelling 1: Bij Zwemdiploma B is ademhalen niet beslist noodzakelijk.\nStelling 2: Bij Zwemdiploma C moet de ademhaling zijwaarts zijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij Zwemdiploma B is de ademhaling niet beslist noodzakelijk en wordt die niet beoordeeld. Stelling 2 is onjuist: bij Zwemdiploma C is minimaal 1 keer ademhalen nodig. Zijwaarts heeft de voorkeur, maar wordt niet beoordeeld. §4.2.6, p. 61 en 62","ref":"§4.2.6, p. 61 en 62","tests":"borstcrawl ademhaling B vs C","source":{"page":62,"quote":"De uitvoering van een ademhaling is bij voorkeur zijwaarts, maar wordt niet bij de beoordeling betrokken."},"rev":2},{"id":"EP-0448","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-34"],"question":"Onderdeel '15 meter borstcrawl', Zwemdiploma C:\nEen kandidaat zwemt met het gezicht in het water. Hij haalt 1 keer adem. Daarbij tilt hij zijn hoofd naar voren op. Wat beslist de examinator?","options":["Voldoende: de manier van ademhalen is vrij.","Voldoende: ademhalen is bij C niet nodig.","Onvoldoende: hij moet zijwaarts ademhalen."],"answer":0,"explanation":"Bij Zwemdiploma C moet de kandidaat minimaal 1 keer ademhalen, maar de manier is vrij. Ademhalen is alleen bij A en B nog niet noodzakelijk. Zijwaarts ademhalen heeft de voorkeur, maar telt niet mee in de beoordeling. §4.2.6, p. 61","ref":"§4.2.6, p. 61","tests":"borstcrawl ademhaling B vs C","source":{"page":61,"quote":"C moet dat wel, maar de manier waarop de ademhaling wordt uitgevoerd is vrij."},"rev":2},{"id":"EP-0449","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-35"],"question":"Conditiezwemmen, Zwemdiploma A en B:\nDe kandidaat wisselt de enkelvoudige rugslag en de schoolslag af. Waarom?","options":["Zo is de afstand goed vol te houden.","Zo ziet de examinator beide technieken over de hele afstand.","Zo leert de kandidaat draaien om te oriënteren."],"answer":0,"explanation":"De enkelvoudige rugslag is het minst vermoeiend. Door af te wisselen met de schoolslag 'treedt minder vermoeidheid op' en is de afstand makkelijker vol te houden. De techniek telt alleen in de eerste 25 meter van elke slag, en draaien om te oriënteren hoort bij het basiselement draaien. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A/B: afwisseling tegen vermoeidheid","source":{"page":62,"quote":"(minst vermoeiend) en de schoolslag, treedt minder vermoeidheid op"},"rev":2},{"id":"EP-0450","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-36"],"question":"Waarom zit gekleed zwemmen in de examenprogramma's?","options":["Wie in open water valt, draagt meestal kleding.","Het is een goede training voor het conditiezwemmen.","Kleding geeft je extra drijfvermogen in het water."],"answer":0,"explanation":"Wie per ongeluk in open water valt, heeft meestal dagelijkse kleding aan. Daarom moet je ook met kleding aan een afstand kunnen overbruggen. Training voor het conditiezwemmen wordt niet genoemd, en kleding maakt zwemmen juist moeilijk door extra weerstand en vermoeidheid. §4.2.6, p. 63 en 64","ref":"§4.2.6, p. 63 en 64","tests":"waarom gekleed zwemmen is opgenomen","source":{"page":63,"quote":"Wanneer je per ongeluk een keer in open water valt, heb je meestal dagelijkse kleding aan."},"rev":2},{"id":"EP-0451","category":"examenprogrammas","subtopic":"essenties","type":"kandidaten","objectives":["EP-ESS-36"],"question":"Fenna en Jesse doen het onderdeel '50 meter gekleed zwemmen' voor Zwemdiploma B.\n- Fenna zwemt schoolslag met alleen de benen. Zij komt redelijk vooruit.\n- Jesse wisselt borstcrawl en rugcrawl af. Hij komt redelijk vooruit.\nWelke kandidaat voldoet aan de normering?","options":["Fenna","Jesse","Fenna en Jesse"],"answer":2,"explanation":"Fenna en Jesse voldoen allebei. De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen, en de kandidaat mag wisselen tussen schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl. Allebei komen ze redelijk vooruit, en de uitvoering telt niet mee. §4.2.6, p. 63 en 64","ref":"§4.2.6, p. 63 en 64","tests":"gekleed zwemmen: zwemslag en uitvoering vrij","source":{"page":64,"quote":"De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen."},"rev":2},{"id":"EP-0452","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-37"],"question":"Gekleed zwemmen:\nWat is volgens de Examenregeling een handig advies voor kandidaten?","options":["Gebruik de armen bij de enkelvoudige rugslag.","Houd de armen stil bij de enkelvoudige rugslag.","Zwem alleen schoolslag om rond te kijken."],"answer":0,"explanation":"Het is handig om kandidaten te stimuleren om bij de enkelvoudige rugslag de armen te gebruiken voor de balans of (extra) voortstuwing. De armen ontspannen naast het lichaam houden hoort bij de enkelvoudige rugslag techniek, niet bij dit advies. De keuze van de zwemslag is vrij, dus alleen schoolslag is geen advies. §4.2.6, p. 64","ref":"§4.2.6, p. 64","tests":"gekleed zwemmen: armen gebruiken bij enkelvoudige rugslag","source":{"page":64,"quote":"stimuleren om bij het uitvoeren van de enkelvoudige rugslag de armen te gebruiken voor de balans of (extra) voorstuwing."},"rev":2},{"id":"EP-0453","category":"examenprogrammas","subtopic":"essenties","type":"kandidaten","objectives":["EP-ESS-38"],"question":"Thijs en Mila doen het onderdeel 'zelfstandig uit het water op de kant klimmen, gekleed' voor Zwemdiploma A.\n- Thijs klimt via het trapje uit het water.\n- Mila gaat eerst op een mat liggen. Daarna schuift zij op haar buik de kant op.\nWelke kandidaat voldoet aan de normering?","options":["Thijs","Mila","Thijs en Mila"],"answer":1,"explanation":"Mila voldoet: de kandidaat klimt op een eigen manier uit het water, en een drijvend voorwerp zoals een mat is toegestaan. Thijs voldoet niet: bij dit onderdeel is het gebruik van een trapje niet toegestaan. §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"uit het water klimmen: essentie is het resultaat","source":{"page":65,"quote":"Gebruik van een drijvend voorwerp, zoals een mat, is toegestaan. Het gebruik van een trapje is niet toegestaan."},"rev":2},{"id":"EP-0454","category":"examenprogrammas","subtopic":"essenties","type":"stellingen","objectives":["EP-ESS-38"],"question":"Onderdeel 'zelfstandig uit het water op de kant klimmen, gekleed':\nWelke stelling is juist?\nStelling 1: Er zijn geen eisen aan de manier van klimmen.\nStelling 2: De kandidaat mag een trapje gebruiken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de essentie is het resultaat, en er worden geen eisen gesteld aan de manier waarop op de kant wordt geklommen. Stelling 2 is onjuist: bij dit onderdeel is het gebruik van een trapje niet toegestaan. §4.2.7, p. 65","ref":"§4.2.7, p. 65","tests":"uit het water klimmen: essentie is het resultaat","source":{"page":65,"quote":"Er worden geen eisen gesteld aan de manier waarop op de kant wordt geklommen."},"rev":2},{"id":"NO-0001","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-01"],"question":"Wat is het uitgangspunt voor het vaststellen van de normering?","options":["Een efficiënte uitvoering","Een technisch perfecte uitvoering","Een zo snel mogelijke uitvoering"],"answer":0,"explanation":"Uitgangspunt voor de normering is een efficiënte uitvoering van een onderdeel of vaardigheid. Technisch perfect hoeft niet: de normering beschrijft hoe een onderdeel minimaal moet worden uitgevoerd. Een zo snel mogelijke uitvoering is niet het uitgangspunt. §2, p. 16","ref":"§2, p. 16","tests":"uitgangspunt normering: efficiënte uitvoering","source":{"page":16,"quote":"Uitgangspunt voor het vaststellen van de normering is een efficiënte uitvoering van een onderdeel of vaardigheid."},"rev":2},{"id":"NO-0002","category":"normering","subtopic":"normering_algemeen","type":"stellingen","objectives":["NO-ALG-02","NO-ALG-01"],"question":"Welke stelling over de normering is juist?\nStelling 1: De normering beschrijft waaraan de uitvoering van een onderdeel minimaal moet voldoen.\nStelling 2: Volgens de normering mag elk onderdeel maar op één manier worden uitgevoerd.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de normering beschrijft aan welke kenmerken de uitvoering van een onderdeel minimaal moet voldoen. Stelling 2 is onjuist: de normering noemt soms een uitvoering die de voorkeur heeft. Als een kandidaat die uitvoering lastig vindt, hoeft dat geen belemmering te zijn om te slagen. §2, p. 16","ref":"§2, p. 16","tests":"inhoud normering: kenmerken, voorkeur, niet toegestaan, omstandigheden","source":{"page":16,"quote":"(soms) naar welke uitvoeringswijze de voorkeur uitgaat"},"rev":2},{"id":"NO-0003","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-02"],"question":"De normering noemt 'via een trapje uit het water klimmen' als voorbeeld. Waarvan is dit een voorbeeld?","options":["Van wat niet wordt toegestaan","Van een voorkeursuitvoering","Van de omstandigheden van een onderdeel"],"answer":0,"explanation":"De normering beschrijft onder meer wat op sommige punten niet wordt toegestaan, zoals via een trapje uit het water klimmen. Een voorkeursuitvoering is het dus niet. Bij de omstandigheden noemt de normering bijvoorbeeld de waterdiepte en de afmetingen van het materiaal. §2, p. 16","ref":"§2, p. 16","tests":"trapje als voorbeeld van wat niet wordt toegestaan","source":{"page":16,"quote":"wat op sommige punten niet wordt toegestaan (bijvoorbeeld via een trapje uit het water"},"rev":2},{"id":"NO-0004","category":"normering","subtopic":"normering_algemeen","type":"stellingen","objectives":["NO-ALG-03"],"question":"De normering noemt soms een voorkeursuitvoering. Welke stelling is juist?\nStelling 1: Met de voorkeursuitvoering wordt meestal het makkelijkst het doel bereikt.\nStelling 2: Een kandidaat kan slagen, ook als de voorkeursuitvoering lastig voor hem is.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de normering noemt een voorkeur, omdat met die uitvoering meestal het makkelijkst het doel wordt bereikt. Stelling 2 is ook juist: als een kandidaat die uitvoering lastig onder de knie krijgt, hoeft dat niet direct een belemmering te zijn om te slagen. §2, p. 16","ref":"§2, p. 16","tests":"voorkeursuitvoering geen directe belemmering om te slagen","source":{"page":16,"quote":"hoeft dat niet direct een belemmering te zijn om te slagen voor het zwemdiploma"},"rev":2},{"id":"NO-0005","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-03"],"question":"Proef A2 Onder water oriëntatie, onderdeel 'te water gaan met een sprong':\nEen kandidaat gaat met een sprong te water, niet met een duik. De rest van de uitvoering is in orde. Voldoet dit?","options":["Ja, duiken heeft alleen de voorkeur.","Ja, het te water gaan telt bij A2 niet mee.","Nee, bij Zwemdiploma A is duiken verplicht."],"answer":0,"explanation":"Bij A2 gaat de kandidaat te water met een sprong; duiken heeft de voorkeur, maar is niet verplicht. Als een kandidaat de voorkeursuitvoering lastig vindt, hoeft dat geen belemmering te zijn om te slagen. Het te water gaan is wel een onderdeel van A2 en telt dus mee. §2 en §2.1.1, p. 16–17","ref":"§2 en §2.1.1, p. 16–17","tests":"voorkeursuitvoering geen directe belemmering om te slagen","source":{"page":16,"quote":"wanneer een kandidaat die uitvoering lastig onder de knie krijgt, hoeft dat niet direct een belemmering te zijn"},"rev":2},{"id":"NO-0006","category":"normering","subtopic":"normering_algemeen","type":"kennis","objectives":["NO-ALG-04"],"question":"Een kandidaat wil een zwemdiploma halen. Hoeveel onderdelen moet hij volgens de beschreven normering uitvoeren?","options":["Alle onderdelen","De meeste onderdelen","Alle onderdelen, behalve één per proef"],"answer":0,"explanation":"Voor een zwemdiploma moeten alle onderdelen van het examenprogramma volgens de beschreven normering worden uitgevoerd. De meeste onderdelen is dus niet genoeg. Eén onvoldoende onderdeel per proef mag ook niet. §2.1, p. 16","ref":"§2.1, p. 16","tests":"alle onderdelen volgens normering voor diploma","source":{"page":16,"quote":"moeten alle onderdelen van het examenprogramma volgens de beschreven normering worden uitgevoerd"},"rev":2},{"id":"NO-0007","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-06","NO-ALG-04"],"question":"Bij het diplomazwemmen voor Zwemdiploma B is er geen drijvend voorwerp. Daarom wordt bij de proef Survival het onderdeel 'gekleed onder een drijvend voorwerp door zwemmen' overgeslagen. De rest gaat goed. Kan de kandidaat het diploma halen?","options":["Nee, er mag geen onderdeel worden overgeslagen.","Ja, de rest van de proef voldoet.","Ja, als de examinator het onderdeel beheerst vindt."],"answer":0,"explanation":"Er mogen geen onderdelen of proeven worden overgeslagen. Voor het diploma moeten alle onderdelen volgens de normering worden uitgevoerd, dus een goede rest is niet genoeg. De examinator kan een onderdeel dat niet is uitgevoerd ook niet als beheerst zien. §2.1, p. 16","ref":"§2.1, p. 16","tests":"geen onderdelen of proeven overslaan","source":{"page":16,"quote":"Er mogen geen onderdelen of proeven worden overgeslagen."},"rev":2},{"id":"NO-0008","category":"normering","subtopic":"normering_algemeen","type":"casus","objectives":["NO-ALG-05"],"question":"Een kandidaat heeft een permanente fysieke beperking. Hij zwemt bij de schoolslag een schaarslag. Verder voldoet de uitvoering. Kan hij toch slagen?","options":["Ja, als de essentie van de opdracht blijft bestaan.","Ja, als hij de schoolslag daarna met rugcrawl overdoet.","Nee, aanpassen mag alleen bij een tijdelijke beperking."],"answer":0,"explanation":"Bij de beoordeling wordt rekening gehouden met een tijdelijke of permanente beperking. De uitvoering mag worden aangepast, mits de essentie blijft bestaan; de regeling noemt de schaarslag bij de schoolslag zelfs als voorbeeld. Overdoen met rugcrawl is niet nodig. §2.1, p. 16","ref":"§2.1, p. 16","tests":"aanpassing bij beperking mits essentie blijft (schaarslag)","source":{"page":16,"quote":"kandidaten die door een (fysieke) beperking een schaarslag zwemmen bij de schoolslag of enkelvoudige rugslag, wel kunnen slagen voor dat onderdeel"},"rev":2},{"id":"NO-0009","category":"normering","subtopic":"normering_algemeen","type":"stellingen","objectives":["NO-ALG-05","NO-ALG-06"],"question":"Een kandidaat heeft een beperking. Welke stelling is juist?\nStelling 1: De uitvoering mag worden aangepast, als de essentie van de opdracht blijft bestaan.\nStelling 2: Een onderdeel dat hij niet kan uitvoeren, mag worden overgeslagen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de uitvoering kan worden aangepast aan de mogelijkheden van de kandidaat, mits de essentie van de opdracht of vaardigheid blijft bestaan. Stelling 2 is onjuist: er mogen geen onderdelen of proeven worden overgeslagen. §2.1, p. 16","ref":"§2.1, p. 16","tests":"aanpassing bij beperking, maar niets overslaan","source":{"page":16,"quote":"De uitvoering van onderdelen kan worden aangepast aan de mogelijkheden van de kandidaat, mits de essentie van de opdracht of vaardigheid blijft bestaan."},"rev":2},{"id":"NO-0010","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-01"],"question":"Proef A1 Survival:\nHoe diep is het water waarin de proef wordt gestart?","options":["In water dat minimaal 1,8 meter diep is","In water dat minimaal 1,4 meter diep is","In water waar de kandidaat niet kan staan"],"answer":0,"explanation":"De A1 proef Survival wordt gestart in water dat minimaal 1,8 meter diep is. 1,4 meter is de minimale lengte van het drijvend voorwerp, geen waterdiepte. 'Waar de kandidaat niet kan staan' is de eis bij de proeven B1 en C1 Survival. §2.1.1, p. 16","ref":"§2.1.1, p. 16","tests":"A1 survival: waterdiepte minimaal 1,8 m","source":{"page":16,"quote":"De proef wordt gestart in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0011","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-01","NO-SURV-03"],"question":"Proef A1 Survival:\nWelke stelling is juist?\nStelling 1: De proef start in water van minimaal 1,4 meter diep.\nStelling 2: 'Vanaf enige hoogte' betekent: minimaal 30 centimeter vanaf de waterlijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de proef wordt gestart in een waterdiepte van minimaal 1,8 meter. Stelling 2 is juist: bij de voetsprong voorwaarts is 'vanaf enige hoogte' minimaal 30 centimeter vanaf de waterlijn. §2.1.1, p. 16–17","ref":"§2.1.1, p. 16–17","tests":"A1 survival: waterdiepte minimaal 1,8 m","source":{"page":16,"quote":"De proef wordt gestart in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0012","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-10","NO-SURV-01"],"question":"Proef B1 Survival:\nHet diepe deel van een zwembad is 1,6 meter diep. De kandidaten kunnen daar niet staan. Mag de proef daar worden afgenomen?","options":["Ja, de kandidaten kunnen daar niet staan.","Nee, het water moet minimaal 1,8 meter diep zijn.","Nee, de kandidaten moeten daar kunnen staan."],"answer":0,"explanation":"B1 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan, en dat is hier zo. Minimaal 1,8 meter is de eis bij de A1 proef Survival. Water waar de kandidaten kunnen staan, is juist te ondiep. §2.1.1–2.1.2, p. 16 en 21","ref":"§2.1.1–2.1.2, p. 16 en 21","tests":"waterdiepte survival A1 (1,8 m) vs B1/C1 (niet kunnen staan)","source":{"page":21,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"NO-0013","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-02","NO-SURV-04"],"question":"Proef A1 Survival, onderdeel 'gekleed voetsprong voorwaarts':\nWelke stelling is juist?\nStelling 1: Als er geen hoge kant of startblok is, springt de kandidaat van de lage kant.\nStelling 2: De kandidaat gaat na de sprong helemaal onder water.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: als er geen hoge kant of startblok is, moet worden gezorgd voor een veilige verhoging om vanaf te springen. Stelling 2 is juist: de kandidaat gaat na de sprong helemaal onder water. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong: veilige verhoging zonder hoge kant","source":{"page":17,"quote":"Indien geen hoge kant of startblok aanwezig is, dient te worden gezorgd voor een veilige verhoging"},"rev":2},{"id":"NO-0014","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-02"],"question":"Ruben en Nina doen het onderdeel 'gekleed voetsprong voorwaarts' voor Zwemdiploma A. Ze springen allebei vanaf 40 centimeter boven de waterlijn.\n- Ruben springt met de voeten eerst en een gestrekt lichaam. Zijn hoofd blijft boven water.\n- Nina springt met de voeten eerst en een gestrekt lichaam. Zij gaat helemaal onder water.\nWelke kandidaat voldoet aan de normering?","options":["Ruben","Nina","Ruben en Nina"],"answer":1,"explanation":"Nina voldoet: de voeten raken eerst het water, het lichaam is gestrekt en zij gaat na de sprong helemaal onder water. Ruben voldoet niet: zijn hoofd blijft boven water. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong A1: helemaal onder water","source":{"page":17,"quote":"De kandidaat gaat na de sprong helemaal onder water."},"rev":2},{"id":"NO-0015","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-03"],"question":"Proef A1 Survival, onderdeel 'gekleed voetsprong voorwaarts':\nEen kandidaat springt correct vanaf een kant van 20 centimeter boven de waterlijn. Voldoet dit?","options":["Nee, de hoogte moet minimaal 30 centimeter zijn.","Nee, hij moet altijd vanaf een startblok springen.","Ja, de voetsprong mag vanaf een lage kant."],"answer":0,"explanation":"'Vanaf enige hoogte' is minimaal 30 centimeter vanaf de waterlijn, dus 20 centimeter is te laag. Een startblok is niet verplicht: zonder hoge kant of startblok wordt gezorgd voor een veilige verhoging. 'Vanaf een lage kant' hoort bij andere onderdelen, zoals achterwaarts te water gaan. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong A1: vanaf enige hoogte = minimaal 30 cm","source":{"page":17,"quote":"Vanaf enige hoogte is minimaal 30 centimeter vanaf de waterlijn."},"rev":2},{"id":"NO-0016","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-04"],"question":"Proef A1 Survival, onderdeel 'gekleed voetsprong voorwaarts':\nHet zwembad heeft geen hoge kant en geen startblok. Hoe gaat de kandidaat dan te water?","options":["De kandidaat springt van een veilige verhoging.","De kandidaat springt van de lage kant.","De kandidaat gaat achterwaarts te water."],"answer":0,"explanation":"Als er geen hoge kant of startblok is, moet worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen. De eis van minimaal 30 centimeter vervalt dus niet. Achterwaarts te water gaan is een onderdeel van B1 en vervangt de voetsprong niet. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"voetsprong: veilige verhoging zonder hoge kant","source":{"page":17,"quote":"dient te worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen"},"rev":2},{"id":"NO-0017","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-05"],"question":"Proef Survival, onderdeel 'gekleed zwemmen':\nWelke stelling is juist?\nStelling 1: De kandidaat mag borstcrawl of rugcrawl zwemmen.\nStelling 2: De kandidaat mag voortdurend wisselen van zwemslag.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de kandidaat zwemt één of meer van deze zwemslagen: schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl. Stelling 2 is ook juist: de kandidaat mag voortdurend wisselen van zwemslagen. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: vier zwemslagen, wisselen mag","source":{"page":17,"quote":"De kandidaat zwemt één of meer van de volgende zwemslagen: schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl."},"rev":2},{"id":"NO-0018","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-05","NO-SURV-06"],"question":"Proef B1 Survival, onderdeel '50 meter gekleed zwemmen':\nWelke stelling is juist?\nStelling 1: De kandidaat moet de hele afstand dezelfde zwemslag zwemmen.\nStelling 2: De kandidaat mag zwemmen met alleen zijn benen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de kandidaat mag voortdurend wisselen van zwemslagen. Stelling 2 is juist: de zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"gekleed zwemmen: vier zwemslagen, wisselen mag","source":{"page":22,"quote":"De kandidaat mag voortdurend wisselen van zwemslagen."},"rev":2},{"id":"NO-0019","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-06"],"question":"Lucas en Eva doen het onderdeel '12,5 meter gekleed zwemmen' voor Zwemdiploma A.\n- Lucas zwemt alleen met de benen van de rugcrawl. Hij komt redelijk vooruit.\n- Eva zwemt eerst borstcrawl en daarna schoolslag. Zij komt redelijk vooruit.\nWelke kandidaat voldoet aan de normering?","options":["Lucas","Eva","Lucas en Eva"],"answer":2,"explanation":"Lucas en Eva voldoen allebei. De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen, en de kandidaat mag voortdurend wisselen van zwemslagen. Allebei hebben ze een redelijk voortstuwingsrendement. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: alleen armen of alleen benen toegestaan","source":{"page":17,"quote":"De zwemslagen mogen ook met alleen de armen of alleen de benen worden gezwommen."},"rev":2},{"id":"NO-0020","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-07"],"question":"Koen en Femke doen het onderdeel '100 meter gekleed zwemmen' voor Zwemdiploma C.\n- Koen zwemt borstcrawl zonder armslag over het water. Hij komt redelijk vooruit.\n- Femke zwemt borstcrawl met een armslag over het water. Zij komt bijna niet vooruit.\nWelke kandidaat voldoet aan de normering?","options":["Koen","Femke","Koen en Femke"],"answer":0,"explanation":"Koen voldoet: bij gekleed zwemmen moet er een redelijk voortstuwingsrendement zijn, en de uitvoering van de zwemslagen telt niet mee in de beoordeling. Femke voldoet niet: zij komt bijna niet vooruit, ook al maakt zij een armslag over het water. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"gekleed zwemmen: redelijk rendement, techniek niet beoordeeld","source":{"page":28,"quote":"de uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling"},"rev":2},{"id":"NO-0021","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-07"],"question":"Proef A1 Survival, onderdeel '12,5 meter gekleed zwemmen':\nWaarop let de examinator?","options":["Een redelijk voortstuwingsrendement","Een correcte uitvoering van de zwemslagen","Eén zwemslag over de hele afstand"],"answer":0,"explanation":"Bij gekleed zwemmen moet er sprake zijn van een redelijk voortstuwingsrendement. De uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling. De kandidaat mag ook voortdurend wisselen van zwemslagen. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"gekleed zwemmen: redelijk rendement, techniek niet beoordeeld","source":{"page":17,"quote":"Er is sprake van een redelijk voortstuwingsrendement"},"rev":2},{"id":"NO-0022","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-08"],"question":"Anna en Ayoub doen het onderdeel 'zelfstandig uit het water op de kant klimmen' voor Zwemdiploma B.\n- Anna klimt eerst op een mat in het water. Daarna klimt zij op de kant.\n- Ayoub houdt de kant vast. Daarna trekt hij zich met zijn armen op de kant.\nWelke kandidaat voldoet aan de normering?","options":["Anna","Ayoub","Anna en Ayoub"],"answer":2,"explanation":"Anna en Ayoub voldoen allebei. De kandidaat klimt op een eigen manier uit het water op de kant, en het gebruik van een drijvend voorwerp, zoals een mat, is toegestaan. Alleen een trapje is niet toegestaan. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"kant klimmen: mat (drijvend voorwerp) toegestaan","source":{"page":22,"quote":"Gebruik van een drijvend voorwerp, zoals een mat, is toegestaan."},"rev":2},{"id":"NO-0023","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-09"],"question":"Proef B1 Survival, onderdeel 'zelfstandig uit het water op de kant klimmen':\nEen kandidaat klimt gekleed via het trapje uit het water. Voldoet dit?","options":["Nee, een trapje is niet toegestaan.","Nee, hij moet daarvoor een mat gebruiken.","Ja, hij mag op een eigen manier klimmen."],"answer":0,"explanation":"Bij dit onderdeel is het gebruik van een trapje niet toegestaan. Een drijvend voorwerp, zoals een mat, mag wel, maar het hoeft niet. 'Op een eigen manier' betekent niet dat een trapje mag. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"kant klimmen: trapje niet toegestaan","source":{"page":22,"quote":"Het gebruik van een trapje is niet toegestaan."},"rev":2},{"id":"NO-0024","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-09","NO-SURV-08"],"question":"Proef A1 Survival, onderdeel 'zelfstandig uit het water op de kant klimmen':\nWelke uitspraak is NIET juist?","options":["Klimmen op een eigen manier is toegestaan.","Een drijvend voorwerp, zoals een mat, is toegestaan.","Een trapje is bij een hoge kant toegestaan."],"answer":2,"explanation":"Het gebruik van een trapje is bij dit onderdeel niet toegestaan, ook niet bij een hoge kant. De kandidaat klimt wel op een eigen manier uit het water, en een drijvend voorwerp zoals een mat mag. §2.1.1, p. 17","ref":"§2.1.1, p. 17","tests":"kant klimmen: trapje niet toegestaan","source":{"page":17,"quote":"Het gebruik van een trapje is niet toegestaan."},"rev":2},{"id":"NO-0025","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-09"],"question":"Onderdeel 'zelfstandig uit het water op de kant klimmen':\nBij welke zwemdiploma's is een trapje niet toegestaan?","options":["Bij Zwemdiploma A, B en C","Bij Zwemdiploma B en C","Bij Zwemdiploma A en B"],"answer":0,"explanation":"Bij A1, B1 en C1 is de normering gelijk: het gebruik van een trapje is niet toegestaan. Er is dus geen uitzondering voor Zwemdiploma A of C. Een drijvend voorwerp zoals een mat mag bij alle drie wel. §2.1.1–2.1.3, p. 17, 22 en 28","ref":"§2.1.1–2.1.3, p. 17, 22 en 28","tests":"kant klimmen: normering gelijk bij A, B en C","source":{"page":28,"quote":"Het gebruik van een trapje is niet toegestaan."},"rev":2},{"id":"NO-0026","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-10"],"question":"Proef C1 Survival:\nIn welk water wordt de proef uitgevoerd?","options":["In water waar de kandidaat niet kan staan","In water van minimaal 1,4 meter diep","In water van minimaal 3 meter diep"],"answer":0,"explanation":"De C1 proef Survival wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. 1,4 meter is de minimale lengte van het drijvend voorwerp. 3 meter is de afstand van het zeil bij A2; dat zijn dus geen waterdieptes. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"C1 survival: dieper water, waar de kandidaat niet kan staan","source":{"page":27,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"NO-0027","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-11"],"question":"Proef B1 Survival:\nWat kenmerkt het onderdeel 'achterwaarts te water gaan, gekleed'?","options":["De kandidaat heeft geen zicht op de valrichting.","De kandidaat maakt een draai om de breedteas.","De voeten raken als eerste het water."],"answer":
