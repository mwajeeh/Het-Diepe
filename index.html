ecifiek en in hoge mate onvoorspelbaar.\nStelling 2: Dit niveau is niet of nauwelijks te oefenen in een zwembad.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: voor niveau vier zijn de omstandigheden zeer specifiek en in hoge mate onvoorspelbaar. Stelling 2 is ook juist: dit is niet of nauwelijks te oefenen in een zwembad. Daarom focust de Nationale Raad Zwemveiligheid op de niveaus één tot en met drie. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"niveau vier: specifiek, onvoorspelbaar, niet in zwembad te oefenen","source":{"page":4,"quote":"Dit is niet of nauwelijks te oefenen in een zwembad."},"rev":2},{"id":"AB-0079","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-06"],"question":"Op welke niveaus van zwemveiligheid focust de Nationale Raad Zwemveiligheid?","options":["Op de niveaus één tot en met drie","Op de niveaus één tot en met vier","Op de niveaus twee tot en met vier"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid focust op de niveaus één tot en met drie. Niveau vier, open water met stroming of de zee, valt daarbuiten: de omstandigheden zijn zeer specifiek en onvoorspelbaar, en het is niet of nauwelijks in een zwembad te oefenen. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"NRZ focust op niveaus één t/m drie","source":{"page":4,"quote":"Vanuit de Nationale Raad Zwemveiligheid wordt gefocust op de niveaus één tot en met drie"}},{"id":"AB-0080","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-07","AB-NIV-08"],"question":"Het eerste en tweede niveau horen bij Zwemdiploma A en B. Hoe omschrijft de Examenregeling deze twee niveaus?","options":["Als 'op weg zijn naar zwemveilig'","Als de Nationale Norm Zwemveiligheid","Als zwemveilig in open water zonder stroming"],"answer":0,"explanation":"De Examenregeling omschrijft het eerste en tweede niveau (Zwemdiploma A en B) als 'op weg zijn naar zwemveilig'. De Nationale Norm Zwemveiligheid ligt op niveau drie, bij Zwemdiploma C. Pas op dat niveau is er sprake van zwemveilig zijn in open water zonder stroming of grote golfslag. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"A en B: op weg naar zwemveilig","source":{"page":4,"quote":"Het eerste en tweede niveau worden gepositioneerd als ‘op weg zijn naar zwemveilig’"},"rev":2},{"id":"AB-0081","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"casus","objectives":["AB-NIV-08"],"question":"Een ouder vraagt: 'Voldoet mijn kind met Zwemdiploma B aan de Nationale Norm Zwemveiligheid?' Wat is het juiste antwoord?","options":["Nee, de norm ligt op niveau drie.","Nee, de norm ligt op niveau vier.","Ja, de norm ligt op niveau twee."],"answer":0,"explanation":"De Nationale Norm Zwemveiligheid ligt op niveau drie, bij Zwemdiploma C. Zwemdiploma B hoort bij niveau twee en geldt als 'op weg zijn naar zwemveilig'. Niveau vier valt buiten de focus van de Nationale Raad Zwemveiligheid. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"Nationale Norm Zwemveiligheid op niveau drie (C)","source":{"page":4,"quote":"Nationale Norm Zwemveiligheid van de hele Nederlandse bevolking ligt op niveau drie"},"rev":2},{"id":"AB-0083","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-09"],"question":"Wat is de Nationale Norm Zwemveiligheid volgens de Inleiding?","options":["Uniforme landelijke richtlijnen voor de gewenste zwemveiligheid","Een systeem dat zwemlesaanbieders controleert","Het recht om de Nationale Zwemdiploma's te gebruiken"],"answer":0,"explanation":"De Nationale Norm Zwemveiligheid bestaat uit uniforme landelijke richtlijnen die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven. Het controlerende systeem is het kwaliteitsborgingssysteem. Het recht om de diploma's te gebruiken geeft de Licentie Nationale Zwemdiploma's. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Nationale Norm Zwemveiligheid = uniforme landelijke richtlijnen","source":{"page":1,"quote":"er uniforme landelijke richtlijnen zijn die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven"},"rev":2},{"id":"AB-0084","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-01"],"question":"Waar is de Examenregeling Nationale Zwemdiploma's een onderdeel van?","options":["Van de Licentie Nationale Zwemdiploma's","Van het project NL Zwemveilig","Van de kwaliteitsborging beroepsonderwijs"],"answer":0,"explanation":"De Examenregeling is een onderdeel van de Licentie Nationale Zwemdiploma's en is gekoppeld aan de Nationale Norm Zwemveiligheid. In het project NL Zwemveilig wordt kennis verzameld. De kwaliteitsborging beroepsonderwijs is een apart aandachtspunt van de Nationale Raad Zwemveiligheid. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Examenregeling onderdeel van Licentie, gekoppeld aan Nationale Norm","source":{"page":1,"quote":"vormt een onderdeel van de Licentie Nationale Zwemdiploma’s en is gekoppeld aan de Nationale Norm Zwemveiligheid"}},{"id":"AB-0085","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-03"],"question":"Wie heeft de Examenregeling Nationale Zwemdiploma's vastgesteld?","options":["Het bestuur van de Nationale Raad Zwemveiligheid","De Toetsingscommissie Maatwerk Examenprogramma's","Het ministerie van VWS"],"answer":0,"explanation":"Het bestuur van de Nationale Raad Zwemveiligheid heeft de Examenregeling vastgesteld, in nauw overleg met de zwembranche. De Toetsingscommissie toetst alleen maatwerk examenprogramma's. Het ministerie van VWS wordt genoemd als partner in het project NL Zwemveilig. Inleiding, p. 2 en Aanleiding, p. 3","ref":"Inleiding, p. 2 en Aanleiding, p. 3","tests":"Examenregeling vastgesteld door bestuur NRZ i.o.m. zwembranche","source":{"page":2,"quote":"is vastgesteld door het bestuur van de Nationale Raad Zwemveiligheid en is tot stand gekomen in nauw overleg met de zwembranche"},"rev":2},{"id":"AB-0087","category":"algemene_bepalingen","subtopic":"examenregeling","type":"stellingen","objectives":["AB-INL-02"],"question":"Zo herken je een zwemlesaanbieder die onder de Nationale Raad Zwemveiligheid valt. Welke stelling is juist?\nStelling 1: De zwemlesaanbieder heeft de Licentie Nationale Zwemdiploma's.\nStelling 2: De zwemdiploma's die hij geeft, zijn uitgegeven door de Nationale Raad Zwemveiligheid.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de zwemlesaanbieder is in het bezit van de Licentie Nationale Zwemdiploma's. Stelling 2 is ook juist: het zwemdiploma dat de zwemlesaanbieder geeft, is uitgegeven door de Nationale Raad Zwemveiligheid. Volgens de Inleiding kan iedereen het aan deze twee kenmerken herkennen. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"herkenbaar: Licentie + diploma uitgegeven door NRZ","source":{"page":1,"quote":"De zwemlesaanbieder is in het bezit van de Licentie Nationale Zwemdiploma’s"},"rev":2},{"id":"AB-0088","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-04"],"question":"Sinds welk jaar bestaat het huidige Zwem-ABC?","options":["Sinds 1998","Sinds 1984","Sinds 2014"],"answer":0,"explanation":"Het huidige Zwem-ABC bestaat sinds 1998. In 1984 heeft de overheid de uitgifte van de Nationale Zwemdiploma's overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid. In 2014 is de Licentie Zwem-ABC ingevoerd. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"huidige Zwem-ABC sinds 1998","source":{"page":3,"quote":"Het huidige Zwem-ABC bestaat sinds 1998"}},{"id":"AB-0089","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-DEF-08","AB-INL-04"],"question":"In welk jaar is de Licentie Zwem-ABC ingevoerd?","options":["In 2014","In 2018","In 1998"],"answer":0,"explanation":"De Licentie Zwem-ABC is in 2014 ingevoerd. Sinds 1 januari 2018 heet ze de Licentie Nationale Zwemdiploma's. Het huidige Zwem-ABC bestaat sinds 1998. Aanleiding, p. 3 en Bijlage 1","ref":"Aanleiding, p. 3 en Bijlage 1","tests":"Licentie Zwem-ABC 2014 (sinds 2018 Licentie Nationale Zwemdiploma's)","source":{"page":"Bijlage 1","quote":"De Licentie Zwem-ABC is in 2014 geïntroduceerd"},"rev":2},{"id":"AB-0090","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-05"],"question":"Voor wie is de Examenregeling Nationale Zwemdiploma's geschreven?","options":["Voor professionals in zwemonderwijs en diplomazwemmen","Voor ouders van kinderen die zwemles volgen","Voor kandidaten die afzwemmen voor een diploma"],"answer":0,"explanation":"De Examenregeling is geschreven voor professionals die betrokken zijn bij het zwemonderwijs en diplomazwemmen. Ouders en kandidaten worden niet als doelgroep genoemd. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Examenregeling geschreven voor professionals","source":{"page":1,"quote":"is geschreven voor professionals die betrokken zijn bij het zwemonderwijs en diplomazwemmen"},"rev":2},{"id":"AB-0091","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-06"],"question":"Waarop houdt de Nationale Raad Zwemveiligheid toezicht?","options":["Op de kwaliteit van het zwemonderwijs","Op de bouw van nieuwe zwembaden","Op de veiligheid van open water met stroming"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de kwaliteit van het zwemonderwijs, de zwemveiligheid en de zwemvaardigheid. De bouw van zwembaden en de veiligheid van open water met stroming worden daar niet genoemd. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"NRZ: landelijke stichting, toezicht op kwaliteit zwemonderwijs","source":{"page":5,"quote":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de kwaliteit van het zwemonderwijs"},"rev":2},{"id":"AB-0092","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"stellingen","objectives":["AB-INL-08"],"question":"Bestuur van de Nationale Raad Zwemveiligheid:\nWelke stelling is juist?\nStelling 1: Het bestuur bestaat uit partijen uit de zwembranche.\nStelling 2: Het bestuur heeft een onafhankelijk voorzitter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: het bestuur is samengesteld uit partijen uit de zwembranche. Stelling 2 is ook juist: het bestuur kent een onafhankelijk voorzitter. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"bestuur NRZ: partijen zwembranche, onafhankelijk voorzitter","source":{"page":5,"quote":"samengesteld uit partijen uit de zwembranche en kent een onafhankelijk voorzitter"},"rev":2},{"id":"AB-0093","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-07"],"question":"In 1984 heeft de overheid een taak overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid. Welke taak was dat?","options":["De uitgifte van de Nationale Zwemdiploma's","Het vaststellen van eisen aan zwembaden","Het opleiden van examinatoren"],"answer":0,"explanation":"In 1984 kreeg de voorganger van de NRZ de taak om de uitgifte van de Nationale Zwemdiploma's te verzorgen. Eisen aan zwembaden vaststellen en examinatoren opleiden worden daarbij niet genoemd. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"1984: overheid draagt uitgifte diploma's over aan voorganger NRZ","source":{"page":5,"quote":"In 1984 heeft de overheid deze taak overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid om de uitgifte van de Nationale Zwemdiploma’s te verzorgen"},"rev":2},{"id":"AB-0094","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-09"],"question":"Kwaliteit van het eindresultaat betekent: kandidaten voldoen aan de exameneisen. Waar valt deze kwaliteit onder?","options":["Onder de Examenregeling Nationale Zwemdiploma's","Onder de Licentie Nationale Zwemdiploma's","Onder de kwaliteitsborging beroepsonderwijs"],"answer":0,"explanation":"De kwaliteit van het eindresultaat valt onder de Examenregeling Nationale Zwemdiploma's. De kwaliteit van de organisatie van zwemlesaanbieders valt onder de Licentie. De kwaliteit van het beroepsonderwijs valt onder de kwaliteitsborging beroepsonderwijs. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"kwaliteit eindresultaat (Examenregeling) vs organisatie (Licentie)","source":{"page":5,"quote":"Kwaliteit van het eindresultaat: kandidaten voldoen aan exameneisen voor Nationale Zwemdiploma‘s (= Examenregeling Nationale Zwemdiploma's)"},"rev":2},{"id":"AB-0095","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-09"],"question":"Het gaat om de kwaliteit van drie dingen: de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen. Waar valt deze kwaliteit onder?","options":["Onder de Licentie Nationale Zwemdiploma's","Onder de Examenregeling Nationale Zwemdiploma's","Onder de Nationale Norm Zwemveiligheid"],"answer":0,"explanation":"De kwaliteit van de organisatie van zwemlesaanbieders, van de zwemles en van het diplomazwemmen valt onder de Licentie Nationale Zwemdiploma's. De Examenregeling gaat over het eindresultaat. De Nationale Norm Zwemveiligheid geeft de gewenste mate van zwemveiligheid weer. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"kwaliteit eindresultaat (Examenregeling) vs organisatie (Licentie)","source":{"page":5,"quote":"Kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen (= Licentie Nationale Zwemdiploma's)"},"rev":2},{"id":"AB-0096","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"onjuist","objectives":["AB-INL-10"],"question":"Wat doet de Nationale Raad Zwemveiligheid NIET om haar maatschappelijke doel te bereiken?","options":["Zelf zwemlessen geven aan kinderen","Kennis en expertise verzamelen en verspreiden","De kwaliteit van zwemlesaanbieders controleren"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid verzamelt, ontwikkelt en verspreidt kennis en expertise. Ook normeert en controleert ze de kwaliteit van zwemlesaanbieders. Zelf zwemlessen geven wordt niet genoemd. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"NRZ: kennis verspreiden en kwaliteit normeren/controleren","source":{"page":5,"quote":"Het normeren en controleren van de kwaliteit van zwemlesaanbieders"},"rev":2},{"id":"AB-0097","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-11"],"question":"Wat is volgens de Aanleiding een standaard examenprogramma?","options":["Een serie proeven, zoals 'conditiezwemmen'","Een lijst basiselementen om onderdelen uit te kiezen","Een eigen samenstelling van proeven, goedgekeurd door de Toetsingscommissie"],"answer":0,"explanation":"Een standaard examenprogramma is een serie proeven, zoals 'onder water oriëntatie' en 'conditiezwemmen'. Een eigen samenstelling die de Toetsingscommissie goedkeurt, is een maatwerk examenprogramma. Basiselementen zijn categorieën van vaardigheden, geen examenprogramma. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"standaard examenprogramma = serie proeven","source":{"page":4,"quote":"Een standaard examenprogramma is een serie proeven, zoals ‘onder water oriëntatie’ en ‘conditiezwemmen’"},"rev":2},{"id":"AB-0098","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-01"],"question":"Welke term gebruikt de Examenregeling nu voor de vroegere 'kopsprong'?","options":["Duiken","Hoofdwaarts richting bodem gaan","Een sprong waarbij het hoofd boven water blijft"],"answer":0,"explanation":"De Examenregeling gebruikt de term 'duiken' waar vroeger 'kopsprong' stond. 'Hoofdwaarts richting bodem gaan' vervangt de hoekduik. 'Een sprong waarbij het hoofd boven water blijft' vervangt de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"kopsprong → duiken","source":{"page":"Bijlage 1","quote":"wordt de term ‘duiken’ gebruikt waar voorheen de technische benaming ‘kopsprong’ werd gehanteerd"}},{"id":"AB-0100","category":"algemene_bepalingen","subtopic":"definities","type":"casus","objectives":["AB-DEF-02"],"question":"Onderdeel 'gekleed te water gaan met een sprong waarbij het hoofd boven water blijft':\nEen kandidaat springt met gestrekte benen, niet in hurkhouding. Zijn hoofd blijft boven water. Wat beslist de examinator?","options":["Voldoende, de uitvoering van de sprong is vrij.","Onvoldoende, de hurksprong is voorgeschreven.","Onvoldoende, hij moet bij deze sprong duiken."],"answer":0,"explanation":"Bij deze sprong is de uitvoering volledig vrij, als het hoofd boven water blijft. De techniek van de hurksprong wordt niet meer gehanteerd. 'Duiken' is de nieuwe term voor de kopsprong, niet voor deze sprong. Bijlage 1","ref":"Bijlage 1","tests":"hurksprong → sprong waarbij hoofd boven water blijft","source":{"page":"Bijlage 1","quote":"geldt dat de uitvoering volledig vrijgelaten wordt, mits het hoofd boven water blijft"},"rev":2},{"id":"AB-0101","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-03"],"question":"Wat zegt Bijlage 1 over de techniek van de hurksprong?","options":["Reddingsbrigade Nederland hanteert die niet meer.","Die is alleen nog verplicht bij Zwemdiploma C.","De Examenregeling noemt die nu 'duiken'."],"answer":0,"explanation":"De techniek van de hurksprong hoorde vroeger bij het examenprogramma, maar Reddingsbrigade Nederland hanteert die niet meer. Bij de sprong waarbij het hoofd boven water blijft, is de uitvoering nu vrij. 'Duiken' is de nieuwe term voor de kopsprong. Bijlage 1","ref":"Bijlage 1","tests":"hurksprong niet meer gehanteerd door Reddingsbrigade Nederland","source":{"page":"Bijlage 1","quote":"wordt door Reddingsbrigade Nederland niet meer gehanteerd"},"rev":2},{"id":"AB-0102","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-04"],"question":"Onder welke naam was de Examenregeling Nationale Zwemdiploma's vroeger bekend?","options":["Bepalingen, Richtlijnen en Examenprogramma's Zwem-ABC (BREZ)","Het Handboek Licentie Nationale Zwemdiploma's","De Nationale Norm Zwemveiligheid"],"answer":0,"explanation":"De Examenregeling heette vroeger de BREZ: Bepalingen, Richtlijnen en Examenprogramma's Zwem-ABC. Sinds 1 januari 2018 wordt de term BREZ niet meer gebruikt. Het Handboek Licentie en de Nationale Norm Zwemveiligheid zijn geen oude namen van de Examenregeling. Aanleiding, p. 3 en Bijlage 1","ref":"Aanleiding, p. 3 en Bijlage 1","tests":"BREZ → Examenregeling Nationale Zwemdiploma's (2018)","source":{"page":3,"quote":"voorheen bekend als Bepalingen, Richtlijnen en Examenprogramma’s Zwem-ABC (BREZ)"}},{"id":"AB-0103","category":"algemene_bepalingen","subtopic":"definities","type":"stellingen","objectives":["AB-DEF-04"],"question":"Nieuwe namen sinds 1 januari 2018:\nWelke stelling is juist?\nStelling 1: Naast de naam Examenregeling Nationale Zwemdiploma's wordt de term BREZ nog gebruikt.\nStelling 2: Licentiehouder Zwem-ABC heet nu Licentiehouder Nationale Zwemdiploma's.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de term BREZ wordt niet meer gebruikt; de nieuwe naam is Examenregeling Nationale Zwemdiploma's. Stelling 2 is juist: Licentiehouder Nationale Zwemdiploma's is de nieuwe term voor Licentiehouder Zwem-ABC. Bijlage 1","ref":"Bijlage 1","tests":"BREZ → Examenregeling Nationale Zwemdiploma's (2018)","source":{"page":"Bijlage 1","quote":"De term BREZ wordt niet meer gehanteerd"},"rev":2},{"id":"AB-0104","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-05"],"question":"Wat is de nieuwe naam voor de 'Gelicentieerde Examinator Zwem-ABC'?","options":["Examinator Nationale Zwemdiploma's","Licentiehouder Nationale Zwemdiploma's","Regioadviseur Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"De Gelicentieerde Examinator Zwem-ABC heet nu Examinator Nationale Zwemdiploma's; de oude term wordt niet meer gebruikt. Licentiehouder Nationale Zwemdiploma's is de nieuwe term voor Licentiehouder Zwem-ABC. De regioadviseur is van de Nationale Raad Zwemveiligheid. Bijlage 1","ref":"Bijlage 1","tests":"Gelicentieerde Examinator Zwem-ABC → Examinator Nationale Zwemdiploma's","source":{"page":"Bijlage 1","quote":"Het betreft hier een nieuwe naam voor Gelicentieerde Examinator Zwem-ABC"}},{"id":"AB-0105","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-05"],"question":"Wie zorgt vanuit de Licentiehouder voor de kwaliteit van het diplomazwemmen?","options":["De Examinator Nationale Zwemdiploma's","De regioadviseur van de Nationale Raad Zwemveiligheid","De Toetsingscommissie Maatwerk Examenprogramma's"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's zorgt vanuit de Licentiehouder voor de kwaliteit van het diplomazwemmen. De regioadviseur is van de Nationale Raad Zwemveiligheid, niet van de Licentiehouder. De Toetsingscommissie toetst maatwerk examenprogramma's. Bijlage 1","ref":"Bijlage 1","tests":"Examinator: vanuit Licentiehouder zorg voor kwaliteit diplomazwemmen","source":{"page":"Bijlage 1","quote":"is degene die vanuit de Licentiehouder zorgdraagt voor kwaliteit van het diplomazwemmen"}},{"id":"AB-0106","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-06"],"question":"Wat geldt in de Examenregeling voor de termen 'examens' en 'diplomazwemmen'?","options":["Het zijn twee woorden voor hetzelfde.","Het zijn twee aparte delen van het examen.","Het zijn twee verschillende soorten examens."],"answer":0,"explanation":"Een examen is een formeel moment van praktijktoetsing. Het staat ook bekend als diplomazwemmen, en de Examenregeling gebruikt de twee termen door elkaar. Het zijn dus geen aparte delen en geen verschillende soorten examens. Bijlage 1","ref":"Bijlage 1","tests":"examens en diplomazwemmen door elkaar gebruikt","source":{"page":"Bijlage 1","quote":"Dit formele moment is een vorm van praktijktoetsing en staat ook bekend als diplomazwemmen"},"rev":2},{"id":"AB-0107","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-07","AB-DEF-14"],"question":"Het onderdeel 'hoofdwaarts richting bodem gaan' heette vroeger 'hoekduik'. Waarom is de naam veranderd?","options":["De strakke technische normering is losgelaten.","De oude naam was onbekend en verwarrend.","Reddingsbrigade Nederland gebruikt de hoekduik niet meer."],"answer":0,"explanation":"Bij de hoekduik is de strakke technische normering losgelaten, en daarom is ook gekozen voor een nieuwe term. Een onbekende, verwarrende afkorting is de reden bij de HELP-houding. Reddingsbrigade Nederland wordt genoemd bij de hurksprong, niet bij de hoekduik. Bijlage 1","ref":"Bijlage 1","tests":"hoekduik → hoofdwaarts richting bodem gaan (normering losgelaten)","source":{"page":"Bijlage 1","quote":"Er is gekozen om de strakke technische normering, die daarbij hoorde, los te laten"},"rev":2},{"id":"AB-0108","category":"algemene_bepalingen","subtopic":"definities","type":"stellingen","objectives":["AB-DEF-07","AB-DEF-01","AB-DEF-02"],"question":"Oude en nieuwe termen uit Bijlage 1:\nWelke stelling is juist?\nStelling 1: De 'hoekduik' heet nu 'hoofdwaarts richting bodem gaan'.\nStelling 2: De 'hurksprong' heet nu 'duiken'.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: 'hoofdwaarts richting bodem gaan' vervangt de hoekduik. Stelling 2 is onjuist: 'duiken' vervangt de kopsprong. De hurksprong heet nu 'een sprong waarbij het hoofd boven water blijft'. Bijlage 1","ref":"Bijlage 1","tests":"hoekduik → hoofdwaarts richting bodem gaan (normering losgelaten)","source":{"page":"Bijlage 1","quote":"wordt de term ‘hoofdwaarts richting bodem gaan’ gebruikt waar voorheen de technische benaming ‘hoekduik’ werd gehanteerd"},"rev":2},{"id":"AB-0109","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-08"],"question":"Met welk doel is de Licentie Zwem-ABC in 2014 ingevoerd?","options":["De kwaliteit van zwemlessen en diplomazwemmen voortdurend verbeteren","De uitgifte van de diploma's overnemen van de overheid","Zwemlesaanbieders eigen examenprogramma's laten maken"],"answer":0,"explanation":"De Licentie Zwem-ABC is in 2014 ingevoerd om te werken aan voortdurende kwaliteitsverbetering voor zwemlessen en diplomazwemmen. De uitgifte van de diploma's heeft de overheid al in 1984 overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid. Eigen maatwerk examenprogramma's zijn pas sinds 1 januari 2018 mogelijk. Bijlage 1","ref":"Bijlage 1","tests":"Licentie Zwem-ABC 2014 (sinds 2018 Licentie Nationale Zwemdiploma's)","source":{"page":"Bijlage 1","quote":"De Licentie Zwem-ABC is in 2014 geïntroduceerd met als doel te werken aan voortdurende kwaliteitsverbetering"},"rev":2},{"id":"AB-0110","category":"algemene_bepalingen","subtopic":"definities","type":"stellingen","objectives":["AB-DEF-08","AB-DEF-09"],"question":"Licentie Nationale Zwemdiploma's:\nWelke stelling is juist?\nStelling 1: De Licentie geeft zwemlesaanbieders het recht om de Nationale Zwemdiploma's te gebruiken.\nStelling 2: De overheid heeft de Licentie in 1984 ingevoerd.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de Licentie geeft zwemlesaanbieders het recht tot gebruik van de Nationale Zwemdiploma's. Stelling 2 is onjuist: de Licentie is in 2014 ingevoerd, als Licentie Zwem-ABC. In 1984 heeft de overheid de uitgifte van de diploma's overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid. Bijlage 1","ref":"Bijlage 1","tests":"Licentie: recht tot gebruik Nationale Zwemdiploma's","source":{"page":"Bijlage 1","quote":"De Licentie Nationale Zwemdiploma’s geeft zwemlesaanbieders het recht tot gebruik van de Nationale Zwemdiploma’s"},"rev":2},{"id":"AB-0111","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-10"],"question":"In welke proef zitten alle onderdelen die gekleed worden uitgevoerd?","options":["In de proef Survival","In de proef Onder water oriëntatie","In de proef Conditiezwemmen"],"answer":0,"explanation":"Alle onderdelen die gekleed worden uitgevoerd, zitten in de proef Survival. Onder water oriëntatie en Conditiezwemmen zijn andere proeven. Bijlage 1","ref":"Bijlage 1","tests":"gekleed uitgevoerde onderdelen in proef Survival","source":{"page":"Bijlage 1","quote":"Alle onderdelen die gekleed worden uitgevoerd, zijn ondergebracht in de proef Survival"}},{"id":"AB-0112","category":"algemene_bepalingen","subtopic":"definities","type":"stellingen","objectives":["AB-DEF-11","AB-DEF-12"],"question":"Proeven en onderdelen:\nWelke stelling is juist?\nStelling 1: Het standaard examenprogramma voor Zwemdiploma C bevat zes proeven.\nStelling 2: Een proef is opgebouwd uit losse onderdelen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: Zwemdiploma C heeft vijf proeven; zes proeven geldt voor Zwemdiploma A en B. Stelling 2 is juist: een proef is opgebouwd uit losse onderdelen. Bijlage 1","ref":"Bijlage 1","tests":"aantal proeven: zes (A, B), vijf (C)","source":{"page":"Bijlage 1","quote":"zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen"},"rev":2},{"id":"AB-0113","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-11"],"question":"Hoeveel proeven bevat het standaard examenprogramma voor Zwemdiploma A, B en C?","options":["Zes voor A en B, vijf voor C","Vijf voor A en B, zes voor C","Zes voor A, B en C"],"answer":0,"explanation":"Het standaard examenprogramma heeft zes proeven voor Zwemdiploma A en B, en vijf voor Zwemdiploma C. Het is dus niet andersom, en C heeft niet evenveel proeven als A en B. Bijlage 1","ref":"Bijlage 1","tests":"aantal proeven: zes (A, B), vijf (C)","source":{"page":"Bijlage 1","quote":"zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen"}},{"id":"AB-0114","category":"algemene_bepalingen","subtopic":"definities","type":"stellingen","objectives":["AB-DEF-13"],"question":"Examenprogramma's sinds 1 januari 2018:\nWelke stelling is juist?\nStelling 1: Een Licentiehouder kan een zelf ontworpen maatwerk examenprogramma uitvoeren.\nStelling 2: Een Licentiehouder mag een maatwerk examenprogramma zonder goedkeuring gebruiken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: sinds 1 januari 2018 kan een Licentiehouder kiezen. Dat is het standaard examenprogramma of een zelf ontworpen maatwerk examenprogramma. Stelling 2 is onjuist: een maatwerk examenprogramma moet eerst ter goedkeuring worden voorgelegd aan de Nationale Raad Zwemveiligheid. Aanleiding, p. 4 en Bijlage 1","ref":"Aanleiding, p. 4 en Bijlage 1","tests":"keuze: standaard óf maatwerk examenprogramma (sinds 2018)","source":{"page":"Bijlage 1","quote":"óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit te voeren"},"rev":2},{"id":"AB-0115","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-13"],"question":"Welke keuze heeft een Licentiehouder sinds 1 januari 2018 voor het examenprogramma?","options":["Het standaard of een zelf ontworpen maatwerk examenprogramma","Het standaard of een maatwerk examenprogramma van de regioadviseur","Alleen het standaard examenprogramma"],"answer":0,"explanation":"Sinds 1 januari 2018 kan een Licentiehouder óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uitvoeren. Het standaard examenprogramma is dus niet de enige keuze. Een maatwerk examenprogramma ontwerpt de Licentiehouder zelf, niet de regioadviseur. Bijlage 1","ref":"Bijlage 1","tests":"keuze: standaard óf maatwerk examenprogramma (sinds 2018)","source":{"page":"Bijlage 1","quote":"óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit te voeren"},"rev":2},{"id":"AB-0116","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-14"],"question":"Welke term vervangt de 'HELP-houding' (Heat Escape Lessening Posture)?","options":["Verticaal drijven met behulp van een voorwerp","Hoofdwaarts richting bodem gaan","Een sprong waarbij het hoofd boven water blijft"],"answer":0,"explanation":"'Verticaal drijven met behulp van een voorwerp' vervangt de HELP-houding. 'Hoofdwaarts richting bodem gaan' vervangt de hoekduik. 'Een sprong waarbij het hoofd boven water blijft' vervangt de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"HELP-houding → verticaal drijven met behulp van een voorwerp","source":{"page":"Bijlage 1","quote":"een voorwerp’ gebruikt waar voorheen de term ‘HELP-houding’ werd gehanteerd"}},{"id":"AB-0117","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-14","AB-DEF-07"],"question":"Waarom heet de 'HELP-houding' nu 'verticaal drijven met behulp van een voorwerp'?","options":["De afkorting is onbekend en kan verwarring geven.","De strakke technische normering is losgelaten.","Reddingsbrigade Nederland hanteert de houding niet meer."],"answer":0,"explanation":"De term is versimpeld, omdat de afkorting HELP onbekend is en tot verwarring kan leiden. Het loslaten van de strakke technische normering is de reden bij de hoekduik. Reddingsbrigade Nederland wordt genoemd bij de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"HELP-houding vervangen: afkorting onbekend, verwarrend","source":{"page":"Bijlage 1","quote":"omdat de afkorting onbekend is en tot verwarring kan leiden"},"rev":2},{"id":"AB-0118","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-15"],"question":"Wat zijn basiselementen volgens Bijlage 1?","options":["Categorieën van vaardigheden","Proeven die uit losse onderdelen bestaan","Onderdelen die apart zijn genormeerd"],"answer":0,"explanation":"Basiselementen zijn categorieën van vaardigheden, zoals drijven en watertrappen. Een proef is opgebouwd uit losse onderdelen, en die onderdelen zijn apart genormeerd. De onderdelen kunnen wel rondom basiselementen worden geordend. Bijlage 1","ref":"Bijlage 1","tests":"basiselementen = categorieën van vaardigheden","source":{"page":"Bijlage 1","quote":"Basiselementen zijn categorieën van vaardigheden"},"rev":2},{"id":"AB-0119","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-16"],"question":"Hoe heette de stichting Nationale Raad Zwemveiligheid tot 1 januari 2018?","options":["Nationaal Platform Zwembaden | NRZ","NL Zwemveilig","Reddingsbrigade Nederland"],"answer":0,"explanation":"Sinds 1 januari 2018 is Stichting Nationale Raad Zwemveiligheid de nieuwe naam voor de stichting Nationaal Platform Zwembaden | NRZ. NL Zwemveilig is een project dat de Nationale Raad Zwemveiligheid coördineert. Reddingsbrigade Nederland is een andere organisatie. Bijlage 1","ref":"Bijlage 1","tests":"Nationaal Platform Zwembaden | NRZ → Nationale Raad Zwemveiligheid","source":{"page":"Bijlage 1","quote":"de stichting Nationaal Platform Zwembaden | NRZ"}},{"id":"TV-0001","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"stellingen","objectives":["TV-LIC-02","TV-EXT-01","TV-LIC-01"],"question":"Kwaliteitsborging van het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De Licentiehouder is verantwoordelijk voor de interne kwaliteit.\nStelling 2: De externe kwaliteitsborging is toezicht door gedelegeerden en medewerkers.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Beide stellingen zijn juist. De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen. De externe kwaliteitsborging is toezicht op de kwaliteit door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid. §3, p. 37","ref":"§3, p. 37","tests":"interne vs externe kwaliteitsborging: wie","source":{"page":37,"quote":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen."},"rev":2},{"id":"TV-0002","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-02"],"question":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen. Waar gaat die interne kwaliteit over?","options":["De organisatie van het diplomazwemmen en de uitvoering van de examenprogramma's","Het toezicht op het diplomazwemmen en de beoordeling van de verslagformulieren","De levering van de zwemdiploma's en de controle van de aanvragen"],"answer":0,"explanation":"De interne kwaliteit gaat over de organisatie van het diplomazwemmen en de uitvoering van de examenprogramma's. Het toezicht op de kwaliteit is de externe kwaliteitsborging, en de verslagformulieren beoordelen en de aanvragen controleren doet de aangewezen medewerker. De Nationale Raad Zwemveiligheid levert de zwemdiploma's. §3, p. 37","ref":"§3, p. 37","tests":"interne kwaliteit: organisatie en uitvoering examenprogramma's","source":{"page":37,"quote":"Dit heeft betrekking op de organisatie van het diplomazwemmen en de uitvoering van de examenprogramma’s"},"rev":2},{"id":"TV-0003","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-02"],"question":"Wie stelt voor de interne kwaliteit een Examinator Nationale Zwemdiploma's aan?","options":["De Licentiehouder","De Nationale Raad Zwemveiligheid","De aangewezen medewerker"],"answer":0,"explanation":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit en stelt daarvoor een Examinator Nationale Zwemdiploma's aan. De Nationale Raad Zwemveiligheid toetst de certificering van de Examinator, maar stelt hem niet aan. De aangewezen medewerker houdt extern toezicht. §3, p. 37","ref":"§3, p. 37","tests":"Licentiehouder stelt Examinator aan","source":{"page":37,"quote":"De Licentiehouder stelt hiervoor een Examinator Nationale Zwemdiploma’s aan."},"rev":2},{"id":"TV-0004","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-03"],"question":"Wie mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren?","options":["Alleen Licentiehouders","Alleen gecertificeerde Examinatoren","Elke zwemlesaanbieder met een Examinator"],"answer":0,"explanation":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren. Een Examinator organiseert niet zelf: de Licentiehouder stelt hem aan of huurt hem in. Een zwemlesaanbieder zonder Licentie mag het ook niet, ook niet met een Examinator. §3, p. 37","ref":"§3, p. 37","tests":"alleen Licentiehouders organiseren diplomazwemmen","source":{"page":37,"quote":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma’s organiseren."},"rev":2},{"id":"TV-0005","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-03"],"question":"Een zwemschool heeft geen Licentie Nationale Zwemdiploma's. Er werkt wel een lesgever met het certificaat tot Examinator Nationale Zwemdiploma's. De zwemschool wil zelf diplomazwemmen voor Zwemdiploma A organiseren. Mag dat?","options":["Nee, alleen Licentiehouders mogen diplomazwemmen organiseren.","Ja, het certificaat van de Examinator is genoeg.","Ja, als er een gedelegeerde aanwezig is."],"answer":0,"explanation":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren. Een Examinator met certificaat maakt de zwemschool nog geen Licentiehouder. Ook een gedelegeerde verandert daar niets aan. §3, p. 37","ref":"§3, p. 37","tests":"alleen Licentiehouders organiseren diplomazwemmen","source":{"page":37,"quote":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma’s organiseren."},"rev":2},{"id":"TV-0006","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-04"],"question":"Wat is volgens de Examenregeling een Licentiehouder Nationale Zwemdiploma's?","options":["Een zwemlesaanbieder met een overeenkomst met de Nationale Raad Zwemveiligheid","Een Examinator met een certificaat van de Nationale Raad Zwemveiligheid","Een vrijwilliger die namens de Nationale Raad Zwemveiligheid examens bezoekt"],"answer":0,"explanation":"Een Licentiehouder is een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid de Licentie Nationale Zwemdiploma's wil gebruiken. Het certificaat hoort bij de Examinator. Het periodiek bezoeken van het diplomazwemmen doen gedelegeerden. §3, p. 37","ref":"§3, p. 37","tests":"definitie Licentiehouder","source":{"page":37,"quote":"een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid"},"rev":2},{"id":"TV-0007","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-LIC-04","TV-LIC-05","TV-LIC-08"],"question":"Welke bewering over Licentiehouders Nationale Zwemdiploma's is NIET juist?","options":["Het bestuur van een zwemvereniging kan Licentiehouder zijn.","Een Licentiehouder krijgt een raamsticker.","Een Licentiehouder is altijd een natuurlijke persoon."],"answer":2,"explanation":"Een Licentiehouder kan een natuurlijke persoon of een rechtspersoon zijn. Dat het bestuur van een zwemvereniging Licentiehouder kan zijn, klopt. Dat een Licentiehouder een raamsticker ontvangt, klopt ook. §3, p. 37","ref":"§3, p. 37","tests":"voorbeelden Licentiehouders","source":{"page":37,"quote":"Als Licentiehouder Nationale Zwemdiploma’s kan worden aangemerkt: een natuurlijke of rechtspersoon (zwemlesaanbieder)"},"rev":2},{"id":"TV-0008","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"stellingen","objectives":["TV-LIC-07","TV-LIC-06"],"question":"Levering van zwemdiploma's aan Licentiehouders:\nWelke stelling is juist?\nStelling 1: Het bestuur stelt de prijs van de zwemdiploma's vast.\nStelling 2: De Nationale Raad Zwemveiligheid mag geleverde zwemdiploma's nooit terugvorderen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de zwemdiploma's worden geleverd tegen een door het bestuur vastgestelde prijs. Stelling 2 is onjuist: houdt een Licentiehouder zich niet aan de voorwaarden, dan mag de Nationale Raad Zwemveiligheid de levering beperken of staken, en zwemdiploma's en/of zwemcertificaten terugvorderen. §3, p. 37","ref":"§3, p. 37","tests":"NRZ mag levering beperken/staken/terugvorderen","source":{"page":37,"quote":"levering aan een Licentiehouder Nationale Zwemdiploma’s te beperken, te staken, dan wel zwemdiploma's en/of zwemcertificaten terug te vorderen"},"rev":2},{"id":"TV-0009","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-06"],"question":"De Nationale Raad Zwemveiligheid levert zwemdiploma's en zwemcertificaten aan Licentiehouders. Wie stelt de prijs vast?","options":["Het bestuur","De aangewezen medewerker","De Licentiehouder"],"answer":0,"explanation":"De zwemdiploma's en zwemcertificaten worden geleverd tegen een door het bestuur vastgestelde prijs. De aangewezen medewerker is aanspreekpunt in zijn werkgebied, maar stelt geen prijzen vast. Ook de Licentiehouder bepaalt de prijs niet. §3, p. 37","ref":"§3, p. 37","tests":"prijs zwemdiploma's vastgesteld door bestuur","source":{"page":37,"quote":"tegen een door het bestuur vastgestelde prijs"},"rev":2},{"id":"TV-0010","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-08"],"question":"Waar staat een actueel overzicht van alle Licentiehouders Nationale Zwemdiploma's?","options":["Op www.allesoverzwemles.nl","Op www.nrz-nl.nl, onder 'Mijn NRZ'","In het Handboek Licentie Nationale Zwemdiploma's"],"answer":0,"explanation":"Het actuele overzicht van alle Licentiehouders staat op www.allesoverzwemles.nl. Via 'Mijn NRZ' op www.nrz-nl.nl worden onder andere het diplomazwemmen en de zwemdiploma's aangevraagd. De Examenregeling noemt het Handboek Licentie niet als plaats voor dit overzicht. §3, p. 37","ref":"§3, p. 37","tests":"overzicht Licentiehouders op allesoverzwemles.nl","source":{"page":37,"quote":"vermeldt op de website www.allesoverzwemles.nl een actueel overzicht"},"rev":2},{"id":"TV-0011","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-09"],"question":"De Licentie van een Licentiehouder is ingetrokken. Wat is het gevolg?","options":["Hij mag geen zwemdiploma's meer uitgeven en geen diplomazwemmen organiseren.","Hij mag geen diplomazwemmen meer organiseren, maar wel zwemdiploma's uitgeven.","Hij mag nog diplomazwemmen organiseren onder toezicht van een gedelegeerde."],"answer":0,"explanation":"Na het (tijdelijk of permanent) intrekken van de Licentie mag de Licentiehouder geen Nationale Zwemdiploma's meer aanvragen en uitgeven. Hij mag ook geen diplomazwemmen meer organiseren, ook niet onder toezicht van een gedelegeerde. §3, p. 37","ref":"§3, p. 37","tests":"gevolg intrekken Licentie","source":{"page":37,"quote":"Het is dan niet meer toegestaan om Nationale Zwemdiploma's aan te vragen en uit te geven"},"rev":2},{"id":"TV-0012","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"stellingen","objectives":["TV-LIC-09"],"question":"Intrekken van de Licentie:\nWelke stelling is juist?\nStelling 1: Na het intrekken mag de Licentiehouder zwemdiploma's die al zijn aangevraagd nog uitgeven.\nStelling 2: De Licentie kan tijdelijk of permanent worden ingetrokken.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: na het intrekken mag de Licentiehouder geen Nationale Zwemdiploma's meer aanvragen en uitgeven, en ook geen diplomazwemmen organiseren. Stelling 2 is juist: de Licentie kan tijdelijk of permanent worden ingetrokken. §3, p. 37","ref":"§3, p. 37","tests":"gevolg intrekken Licentie","source":{"page":37,"quote":"Het is dan niet meer toegestaan om Nationale Zwemdiploma's aan te vragen en uit te geven"},"rev":2},{"id":"TV-0013","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-15","TV-LIC-09"],"question":"Uit het toezicht blijkt dat een Licentiehouder zich niet aan de Examenregeling houdt. Hij komt de verbeterafspraken niet na en de verbetering blijft uit. Wat kan er gebeuren?","options":["De directeur kan de Licentie intrekken.","De gedelegeerde kan de Licentie intrekken.","De aangewezen medewerker kan de Licentie intrekken."],"answer":0,"explanation":"Als de Licentiehouder de verbeterafspraken niet nakomt en de verbetering uitblijft, kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie. De Licentiehouder krijgt dit besluit schriftelijk. De gedelegeerde en de aangewezen medewerker kunnen de Licentie niet intrekken. §3.2, p. 43","ref":"§3.2, p. 43","tests":"directeur besluit tot intrekken Licentie","source":{"page":43,"quote":"kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie"},"rev":2},{"id":"TV-0014","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-10"],"question":"Wie zorgt voor een bassin dat voldoet aan de voorschriften?","options":["De Licentiehouder","De gedelegeerde","De aangewezen medewerker"],"answer":0,"explanation":"De Licentiehouder zorgt voor een bassin dat voldoet aan de voorschriften en voor de juiste materialen. De gedelegeerde en de aangewezen medewerker houden namens de Nationale Raad Zwemveiligheid toezicht op de kwaliteit. §3.1, p. 40","ref":"§3.1, p. 40","tests":"Licentiehouder zorgt voor bassin en materialen","source":{"page":40,"quote":"De Licentiehouder draagt zorg voor de beschikbaarheid van een bassin dat voldoet aan de voorschriften"}},{"id":"TV-0015","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"stellingen","objectives":["TV-LIC-11","TV-LIC-14"],"question":"Kosten van de Examinator en de gedelegeerde:\nWelke stelling is juist?\nStelling 1: De Licentiehouder betaalt de reiskosten van de Examinator.\nStelling 2: De Licentiehouder betaalt altijd de reiskosten van de gedelegeerde.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de reis- en verblijfkosten van de Examinator zijn voor rekening van de Licentiehouder. Stelling 2 is onjuist: de vrijwilligersvergoeding en reiskosten van de gedelegeerde vergoedt de Nationale Raad Zwemveiligheid. Alleen als een annulering te laat wordt gemeld (de grens is 24 uur van tevoren), betaalt de Licentiehouder ze. §3.1, p. 40","ref":"§3.1, p. 40","tests":"kosten Examinator vs gedelegeerde","source":{"page":40,"quote":"worden de door de Nationale Raad Zwemveiligheid te vergoeden kosten (vrijwilligersvergoeding en reiskosten) aan de gedelegeerde"},"rev":2},{"id":"TV-0016","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-11"],"question":"Een Licentiehouder kan zelf geen Examinator inzetten en huurt er een in. De Examinator moet ver reizen en blijft een nacht in de buurt. Wie betaalt de reis- en verblijfkosten?","options":["De Licentiehouder betaalt deze kosten.","De Nationale Raad Zwemveiligheid betaalt deze kosten.","De Examinator betaalt deze kosten zelf."],"answer":0,"explanation":"De kosten van het diplomazwemmen zijn voor rekening van de Licentiehouder. Daar horen ook de honorering en de reis- en verblijfkosten van de Examinator bij. De Nationale Raad Zwemveiligheid en de Examinator zelf betalen deze kosten niet. §3.1, p. 40","ref":"§3.1, p. 40","tests":"kosten diplomazwemmen voor Licentiehouder","source":{"page":40,"quote":"De kosten van het diplomazwemmen, zoals onder andere eventuele honorering, reis- en verblijfkosten van de Examinator Nationale Zwemdiploma’s, de kosten van zwemdiploma's, de huur van het zwembad en de administratiekosten zijn voor rekening van de Licentiehouder."},"rev":2},{"id":"TV-0017","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"stellingen","objectives":["TV-LIC-14","TV-LIC-11"],"question":"Diplomazwemmen en kosten:\nWelke stelling is juist?\nStelling 1: De huur van het zwembad is voor rekening van de Licentiehouder.\nStelling 2: Bij een te late annulering betaalt de Licentiehouder de kosten van de gedelegeerde.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Beide stellingen zijn juist. De huur van het zwembad is voor rekening van de Licentiehouder. Wordt een annulering te laat gemeld (de grens is 24 uur van tevoren), dan worden de vrijwilligersvergoeding en reiskosten van de gedelegeerde volledig bij de Licentiehouder in rekening gebracht. §3.1, p. 40","ref":"§3.1, p. 40","tests":"late annulering: kosten gedelegeerde bij Licentiehouder","source":{"page":40,"quote":"aan de gedelegeerde volledig in rekening gebracht bij de Licentiehouder"},"rev":2},{"id":"TV-0018","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-12"],"question":"Waar blijven de ingevulde beoordelingslijsten na het diplomazwemmen?","options":["Bij de Licentiehouder","Bij de Nationale Raad Zwemveiligheid","Bij de gedelegeerde"],"answer":0,"explanation":"De ingevulde beoordelingslijsten blijven ter documentatie bij de Licentiehouder: hij heeft een archiefplicht. Naar de Nationale Raad Zwemveiligheid gaan de verslagen en feedbackformulieren, niet de lijsten. De gedelegeerde maakt zelf een verslag. §3.1, p. 40","ref":"§3.1, p. 40","tests":"archiefplicht beoordelingslijsten bij Licentiehouder","source":{"page":40,"quote":"De ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder."},"rev":2},{"id":"TV-0019","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-12"],"question":"Een Licentiehouder wil bij het diplomazwemmen een beoordelingslijst gebruiken die hij zelf heeft ontwikkeld. Mag dat?","options":["Ja, hij mag zelf een beoordelingslijst ontwikkelen en gebruiken.","Ja, maar alleen als de gedelegeerde de lijst goedkeurt.","Nee, alleen lijsten van de Nationale Raad Zwemveiligheid zijn toegestaan."],"answer":0,"explanation":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken. De gedelegeerde hoeft die lijst niet goed te keuren; hij observeert met de lijsten die de examinator aanlevert. Lijsten van de Nationale Raad Zwemveiligheid zijn dus niet verplicht. §3.1, p. 40","ref":"§3.1, p. 40","tests":"Licentiehouder mag eigen beoordelingslijst ontwikkelen","source":{"page":40,"quote":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken."},"rev":2},{"id":"TV-0020","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-EXA-13"],"question":"Na het diplomazwemmen overlegt de Licentiehouder met de aanwezige gedelegeerde. Daarna bepaalt de Licentiehouder de uitslag. Is dat juist?","options":["Nee, de Examinator bepaalt de uitslag na overleg met de gedelegeerde.","Nee, de gedelegeerde bepaalt de uitslag na overleg met de Examinator.","Ja, de Licentiehouder bepaalt de uitslag na overleg met de gedelegeerde."],"answer":0,"explanation":"De Examinator bepaalt de uitslag volgens de Examenregeling, na overleg met een eventueel aanwezige medewerker of gedelegeerde. De Licentiehouder en de gedelegeerde bepalen de uitslag dus niet. De Licentiehouder zorgt wel voor het bassin en kan zelf een beoordelingslijst ontwikkelen. §3.1, p. 39–40","ref":"§3.1, p. 39–40","tests":"Examinator bepaalt uitslag na afstemming","source":{"page":39,"quote":"bepaalt de uitslag conform de Examenregeling Nationale Zwemdiploma's na afstemming met een eventueel aanwezige medewerker"},"rev":2},{"id":"TV-0021","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-13"],"question":"Twee dagen voor het diplomazwemmen wil de Licentiehouder de ingediende aanvraag nog wijzigen. Kan dat?","options":["Ja, wijzigen kan tot 24 uur voor het diplomazwemmen.","Nee, wijzigen kan alleen tot 7 dagen voor het diplomazwemmen.","Nee, wijzigen kan alleen tot 21 dagen voor het diplomazwemmen."],"answer":0,"explanation":"Met de inlogcodes kan de Licentiehouder tot 24 uur voor het diplomazwemmen de status van de aanvraag bekijken en zo nodig wijzigen. Twee dagen vooraf kan dat dus nog. 21 dagen is de termijn voor het aanmelden, en 7 dagen is de termijn voor de verslagen. §3.1, p. 40","ref":"§3.1, p. 40","tests":"aanvraag bekijken/wijzigen tot 24 uur","source":{"page":40,"quote":"de mogelijkheid om tot 24 uur voor het diplomazwemmen de status van de aanvraag te bekijken en indien gewenst te wijzigen"},"rev":2},{"id":"TV-0022","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-14"],"question":"Een Licentiehouder annuleert het diplomazwemmen 12 uur voor de start. Er was een gedelegeerde ingepland. Wat is het gevolg?","options":["De Licentiehouder betaalt de kosten van de gedelegeerde.","De Examinator betaalt de kosten van de gedelegeerde.","De Nationale Raad Zwemveiligheid betaalt de kosten van de gedelegeerde."],"answer":0,"explanation":"De Licentiehouder annuleert pas 12 uur voor de start. Dat is te laat: de grens is 24 uur van tevoren. Dan worden de vrijwilligersvergoeding en reiskosten van de gedelegeerde volledig bij de Licentiehouder in rekening gebracht. De Examinator en de Nationale Raad Zwemveiligheid betalen ze in dit geval niet. §3.1, p. 40","ref":"§3.1, p. 40","tests":"late annulering: kosten gedelegeerde bij Licentiehouder","source":{"page":40,"quote":"aan de gedelegeerde volledig in rekening gebracht bij de Licentiehouder"},"rev":2},{"id":"TV-0023","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-02","TV-EXA-01"],"question":"Examinator Nationale Zwemdiploma's:\nWelke stelling is juist?\nStelling 1: De Examinator moet het certificaat tot Examinator Nationale Zwemdiploma's bezitten.\nStelling 2: Een Licentiehouder zonder eigen Examinator kan er een inhuren.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de Examinator moet bekend zijn bij de Nationale Raad Zwemveiligheid en het certificaat tot Examinator Nationale Zwemdiploma's bezitten. Stelling 2 is juist: een Licentiehouder die vanuit de eigen organisatie geen Examinator kan inzetten, kan er een inhuren. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator: bekend bij NRZ, certificaat, inhuren mag","source":{"page":38,"quote":"Indien een Licentiehouder niet in staat is vanuit de eigen organisatie een Examinator Nationale Zwemdiploma’s in te zetten, kan hij ervoor kiezen deze in te huren."},"rev":2},{"id":"TV-0024","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-02"],"question":"Een zwemvereniging met Licentie heeft niemand in de eigen organisatie die Examinator kan zijn. Wat kan de vereniging doen?","options":["Ze huurt een Examinator in.","Ze laat de gedelegeerde de rol van Examinator overnemen.","Ze houdt het diplomazwemmen zonder Examinator."],"answer":0,"explanation":"Een Licentiehouder die vanuit de eigen organisatie geen Examinator kan inzetten, kan er een inhuren; die is dan verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem inhuurt. De gedelegeerde observeert, bespreekt en rapporteert, en neemt de rol van Examinator niet over. Zonder Examinator kan het niet, want hij moet zelf aanwezig zijn bij het diplomazwemmen. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"Examinator inhuren","source":{"page":38,"quote":"Deze Examinator is op dat moment verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem/haar inhuurt."},"rev":2},{"id":"TV-0025","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-04"],"question":"Een Licentiehouder heeft meerdere Examinatoren. Wie is per aanvraag van diplomazwemmen (eind)verantwoordelijk?","options":["Eén Examinator","Alle aanwezige Examinatoren samen","De Licentiehouder zelf"],"answer":0,"explanation":"Een Licentiehouder mag over meerdere Examinatoren beschikken, maar per aanvraag van diplomazwemmen is maar één examinator (eind)verantwoordelijk. Die Examinator is de beslisser. Alle aanwezige Examinatoren samen of de Licentiehouder zelf is dus niet juist. §3.1, p. 38","ref":"§3.1, p. 38","tests":"één eindverantwoordelijke Examinator per aanvraag","source":{"page":38,"quote":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk."},"rev":2},{"id":"TV-0026","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-04"],"question":"Bij één aanvraag van diplomazwemmen zijn drie Examinatoren van dezelfde Licentiehouder aanwezig. Ze zijn het niet eens over de uitslag van een kandidaat. Wie beslist?","options":["De (eind)verantwoordelijke Examinator beslist.","De drie Examinatoren beslissen bij meerderheid.","De Licentiehouder van de zwemschool beslist."],"answer":0,"explanation":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk, en die is de beslisser. Hij kan taken delegeren aan collega's, maar de beslissing is aan hem. De Licentiehouder bepaalt de uitslag niet: dat doet de Examinator. §3.1, p. 38–39","ref":"§3.1, p. 38–39","tests":"één eindverantwoordelijke Examinator per aanvraag","source":{"page":38,"quote":"Deze Examinator Nationale Zwemdiploma’s is degene die de beslisser is"},"rev":2},{"id":"TV-0027","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-05"],"question":"Wat mag de Examinator Nationale Zwemdiploma's niet delegeren?","options":["Zijn aanwezigheid bij het diplomazwemmen","De ondertekening van de zwemdiploma's","Het aanvragen van het diplomazwemmen"],"answer":0,"explanation":"De Examinator mag taken aan collega's delegeren. Het enige wat hij niet mag delegeren, is zijn aanwezigheid bij het diplomazwemmen waarvoor hij verantwoordelijk is. De ondertekening en het aanvragen mag hij dus wel delegeren. §3.1, p. 38–39","ref":"§3.1, p. 38–39","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"Het enige dat hij/zij niet mag delegeren, is de aanwezigheid bij het diplomazwemmen"},"rev":2},{"id":"TV-0028","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-05"],"question":"Een Examinator is eindverantwoordelijk voor een diplomazwemmen. Die dag heeft hij een andere afspraak. Hij wil een ervaren collega alles laten leiden en zelf wegblijven. Mag dat?","options":["Nee, hij moet zelf aanwezig zijn.","Nee, alleen een gedelegeerde mag hem vervangen.","Ja, als de kwaliteit gewaarborgd blijft."],"answer":0,"explanation":"De Examinator mag taken aan collega's delegeren als de kwaliteit gewaarborgd blijft. Maar hij moet zelf aanwezig zijn bij het diplomazwemmen: dat mag hij niet delegeren, ook niet aan een gedelegeerde. §3.1, p. 38","ref":"§3.1, p. 38","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"De Examinator dient zelf wel aanwezig te zijn bij het diplomazwemmen."},"rev":2},{"id":"TV-0029","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-15","TV-EXA-05"],"question":"Na het diplomazwemmen moeten veertig zwemdiploma's worden ondertekend. De Examinator vraagt een collega om dat te doen. Wat is juist?","options":["De Examinator mag deze taak delegeren.","De Examinator mag de diploma's alleen zelf ondertekenen.","De gedelegeerde moet de diploma's ondertekenen."],"answer":0,"explanation":"De Examinator is namens de Licentiehouder verantwoordelijk voor de ondertekening van de diploma's. Hij mag dit zelf doen, maar kan deze taak ook delegeren. De diploma's worden ondertekend door of namens de Examinator, niet door de gedelegeerde. §3.1, p. 39 en 41","ref":"§3.1, p. 39 en 41","tests":"ondertekening diploma's delegeerbaar","source":{"page":39,"quote":"de Examinator mag dit zelf doen, maar kan deze taak ook delegeren"},"rev":2},{"id":"TV-0030","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-05","TV-EXA-15"],"question":"Delegeren door de Examinator Nationale Zwemdiploma's:\nWelke stelling is juist?\nStelling 1: Hij mag de ondertekening van de zwemdiploma's delegeren.\nStelling 2: Hij mag zijn aanwezigheid delegeren aan een andere Examinator.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de Examinator mag de diploma's zelf ondertekenen, maar kan deze taak ook delegeren. Stelling 2 is onjuist: zijn aanwezigheid bij het diplomazwemmen is het enige wat hij niet mag delegeren. §3.1, p. 38–39","ref":"§3.1, p. 38–39","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"Het enige dat hij/zij niet mag delegeren, is de aanwezigheid bij het diplomazwemmen"},"rev":2},{"id":"TV-0031","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-06","TV-EXT-07"],"question":"Voor wie is de Examinator het aanspreekpunt voor de kwaliteit van zijn diplomazwemmen?","options":["Voor de Nationale Raad Zwemveiligheid","Voor Licentiehouders en gedelegeerden","Voor ouders/verzorgers van kandidaten"],"answer":0,"explanation":"De Examinator is voor zijn diplomazwemmen het aanspreekpunt voor de Nationale Raad Zwemveiligheid voor de kwaliteit. De aangewezen medewerkers van de Nationale Raad Zwemveiligheid zijn het aanspreekpunt voor Licentiehouders en gedelegeerden. Een rol als aanspreekpunt voor ouders/verzorgers noemt de Examenregeling niet. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"aanspreekpunt: Examinator vs medewerker","source":{"page":38,"quote":"De Examinator is voor dat diplomazwemmen ook het aanspreekpunt voor de Nationale Raad Zwemveiligheid voor de kwaliteit."},"rev":2},{"id":"TV-0032","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-07"],"question":"Waaraan toetst de Examinator of het diplomazwemmen kwalitatief voldoet?","options":["De Examenregeling en het Handboek Licentie","Het klachtenreglement en de algemene voorwaarden","De overeenkomst en de verbeterafspraken"],"answer":0,"explanation":"De Examinator toetst aan de eisen van de Examenregeling Nationale Zwemdiploma's in combinatie met het Handboek Licentie Nationale Zwemdiploma's. Het klachtenreglement, de algemene voorwaarden, de overeenkomst en de verbeterafspraken noemt de regeling hier niet als eisen voor deze toets. §3.1, p. 38","ref":"§3.1, p. 38","tests":"toetsing aan Examenregeling + Handboek Licentie","source":{"page":38,"quote":"toetst of het diplomazwemmen kwalitatief voldoet aan de eisen van de Examenregeling"},"rev":2},{"id":"TV-0033","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-08","TV-EXT-03"],"question":"Taken bij het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De Examinator heeft een observerende, signalerende en rapporterende taak.\nStelling 2: De gedelegeerde heeft taken in de vorm van observeren, bespreken en rapporteren.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de Examinator heeft een observerende, signalerende en rapporterende taak richting de Nationale Raad Zwemveiligheid (p. 38). Stelling 2 is juist: een gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"taken gedelegeerde: observeren, bespreken, rapporteren","source":{"page":42,"quote":"Een gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren."},"rev":2},{"id":"TV-0034","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-08"],"question":"Welke taak heeft de Examinator richting de Nationale Raad Zwemveiligheid?","options":["Een observerende, signalerende en rapporterende taak","Een controlerende, corrigerende en sanctionerende taak","Een adviserende taak zonder beslissingsbevoegdheid"],"answer":0,"explanation":"De Examinator heeft een observerende, signalerende en rapporterende taak voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid. Corrigerend handelen kan de medewerker van de Nationale Raad Zwemveiligheid. De Examinator is wel de beslisser, dus 'zonder beslissingsbevoegdheid' klopt niet. §3.1–3.2, p. 38 en 43","ref":"§3.1–3.2, p. 38 en 43","tests":"Examinator: observerend, signalerend, rapporterend","source":{"page":38,"quote":"heeft een observerende, signalerende en rapporterende taak voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid"},"rev":2},{"id":"TV-0035","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-09"],"question":"De rol van de Examinator Nationale Zwemdiploma's:\nWelke stelling is juist?\nStelling 1: Hij koppelt de resultaten alleen terug naar de Nationale Raad Zwemveiligheid.\nStelling 2: Hij is bij het diplomazwemmen in feite het 'gezicht' van de Nationale Raad Zwemveiligheid.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de Examinator koppelt de resultaten terug naar de zwemlesaanbieder die het diplomazwemmen organiseert én naar de Nationale Raad Zwemveiligheid. Stelling 2 is juist: hij is bij het diplomazwemmen in feite het 'gezicht' van de Nationale Raad Zwemveiligheid. §3.1, p. 38","ref":"§3.1, p. 38","tests":"terugkoppeling resultaten naar zwemlesaanbieder en NRZ","source":{"page":38,"quote":"koppelt de resultaten van het diplomazwemmen terug naar de zwemlesaanbieder die het diplomazwemmen organiseert"},"rev":2},{"id":"TV-0036","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-10"],"question":"Wie is verantwoordelijk voor het feedbackgesprek na het diplomazwemmen?","options":["De Examinator Nationale Zwemdiploma's","De gedelegeerde van de Nationale Raad Zwemveiligheid","De aangewezen medewerker van het werkgebied"],"answer":0,"explanation":"De Examinator is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid. De gedelegeerde is gesprekspartner en licht daar zijn onderbouwing toe. De aangewezen medewerker houdt (mede) toezicht, maar is niet verantwoordelijk voor dit gesprek. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"Examinator verantwoordelijk voor feedbackgesprek","source":{"page":38,"quote":"De Examinator Nationale Zwemdiploma’s is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid"}},{"id":"TV-0037","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-11"],"question":"Wie bepaalt de volgorde van de routing en het gebruik van circuitvormen?","options":["De Examinator, samen met collega's","De gedelegeerde, samen met de medewerker van de Nationale Raad Zwemveiligheid","De Licentiehouder, in de aanvraag"],"answer":0,"explanation":"De Examinator bepaalt samen met collega's de volgorde van de routing en de keuzes voor circuitvormen. Een aanwezige gedelegeerde bespreekt de routing hooguit in de voorbespreking. De Licentiehouder legt dit niet vast in de aanvraag. §3.1, p. 38 en 40","ref":"§3.1, p. 38 en 40","tests":"Examinator bepaalt routing en circuitvormen","source":{"page":38,"quote":"bepaalt samen met collega’s de volgorde van de routing, organisatorische keuzemogelijkheden voor het gebruikmaken van circuitvormen"},"rev":2},{"id":"TV-0038","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-13"],"question":"Er is een gedelegeerde aanwezig. Wie bepaalt de uitslag van het diplomazwemmen?","options":["De Examinator, na afstemming met de gedelegeerde","De gedelegeerde, op basis van eigen observaties","Examinator en gedelegeerde samen, met gelijke stem"],"answer":0,"explanation":"De Examinator bepaalt de uitslag volgens de Examenregeling, na afstemming met een eventueel aanwezige medewerker of gedelegeerde. De gedelegeerde kan vóór de uitslagbepaling kort melden dat diploma's ten onrechte worden uitgereikt. Hij bepaalt de uitslag niet en heeft ook geen gelijke stem. §3.1–3.2, p. 39 en 42","ref":"§3.1–3.2, p. 39 en 42","tests":"Examinator bepaalt uitslag na afstemming","source":{"page":39,"quote":"bepaalt de uitslag conform de Examenregeling Nationale Zwemdiploma's na afstemming met een eventueel aanwezige medewerker"},"rev":2},{"id":"TV-0039","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"stellingen","objectives":["TV-EXA-13","TV-EXT-11"],"question":"Bij het diplomazwemmen zijn een gedelegeerde en een medewerker van de Nationale Raad Zwemveiligheid aanwezig. Welke stelling is juist?\nStelling 1: De Examinator bepaalt de uitslag.\nStelling 2: De medewerker kan corrigerend handelen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de Examinator bepaalt de uitslag, na afstemming met de gedelegeerde of medewerker. Stelling 2 is ook juist: de medewerker heeft dezelfde rol als de gedelegeerde, maar kan ook corrigerend handelen. §3.1–3.2, p. 39 en 43","ref":"§3.1–3.2, p. 39 en 43","tests":"rolverdeling Examinator/gedelegeerde/medewerker","source":{"page":43,"quote":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."},"rev":2},{"id":"TV-0040","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-31","TV-EXA-14"],"question":"Een jeugdige kandidaat voor Zwemdiploma A is afgewezen. De Examinator heeft het druk. De eigen lesgever wil het gesprek met het kind en de ouders voeren. Wat is juist?","options":["De eigen lesgever mag dit gesprek voeren.","De lesgever mag alleen met de ouders praten, niet met het kind.","De Examinator moet dit gesprek zelf voeren."],"answer":0,"explanation":"De Examinator of iemand anders die bij het diplomazwemmen betrokken is, bijvoorbeeld de eigen lesgever, voert het gesprek en legt de reden van de afwijzing uit. Dat gesprek is met het kind en de ouder(s), dus niet alleen met de ouders. De Examinator hoeft het niet zelf te doen. §3.1, p. 41","ref":"§3.1, p. 41","tests":"afwijzing: gesprek door Examinator of betrokkene","source":{"page":41,"quote":"De Examinator of iemand anders die bij het diplomazwemmen is betrokken (bijvoorbeeld de eigen lesgever)"},"rev":2},{"id":"TV-0041","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-31"],"question":"Wanneer moet een afgewezen kandidaat horen dat hij is afgewezen?","options":["Vóór de diploma-uitreiking","Direct na de diploma-uitreiking","Binnen 7 dagen, met het verslag"],"answer":0,"explanation":"Een afgewezen kandidaat moet voorafgaand aan de diploma-uitreiking op de hoogte worden gebracht. Na de uitreiking is dus te laat. De termijn van 7 dagen geldt voor het verslag van de Examinator, niet voor het informeren van de kandidaat. §3.1, p. 41","ref":"§3.1, p. 41","tests":"afgewezen kandidaat vóór uitreiking informeren","source":{"page":41,"quote":"hiervan voorafgaand aan de diploma-uitreiking op de hoogte wordt gebracht"},"rev":2},{"id":"TV-0042","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-14"],"question":"Een jeugdige kandidaat wordt afgewezen. Wie moet de reden daarvan horen?","options":["De ouders/verzorgers van de kandidaat","De medewerker van de Nationale Raad Zwemveiligheid","De Licentiehouder van de kandidaat"],"answer":0,"explanation":"Als een jeugdige kandidaat wordt afgewezen, moet de reden bekend worden gemaakt aan de ouders/verzorgers. Die regel noemt de medewerker van de Nationale Raad Zwemveiligheid en de Licentiehouder niet. De Examinator of bijvoorbeeld de eigen lesgever legt de reden uit aan het kind en de ouder(s). §3.1, p. 39–41","ref":"§3.1, p. 39–41","tests":"jeugdige kandidaat afgewezen: reden aan ouders/verzorgers","source":{"page":39,"quote":"Indien een jeugdige kandidaat afgewezen moet worden, zal de reden daarvan kenbaar gemaakt dienen te worden aan de ouders/verzorgers"},"rev":2},{"id":"TV-0043","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"stellingen","objectives":["TV-EXA-30","TV-EXA-14"],"question":"Afwijzing tijdens het diplomazwemmen:\nWelke stelling is juist?\nStelling 1: De kandidaat moet stoppen zodra de afwijzing vaststaat.\nStelling 2: Bij een jeugdige kandidaat krijgen de ouders/verzorgers de reden te horen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de kandidaat heeft altijd het recht om het diplomazwemmen af te maken, ook als de afwijzing al een feit is. Stelling 2 is juist: bij een jeugdige kandidaat wordt de reden bekendgemaakt aan de ouders/verzorgers. §3.1, p. 39 en 41","ref":"§3.1, p. 39 en 41","tests":"recht om diplomazwemmen af te maken","source":{"page":41,"quote":"De kandidaat heeft altijd het recht om het diplomazwemmen af te maken"},"rev":2},{"id":"TV-0044","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-30"],"question":"Een kandidaat voor Zwemdiploma B heeft een onderdeel drie keer onvoldoende uitgevoerd. De afwijzing staat vast. Hij wil de andere onderdelen toch zwemmen. Wat beslist de Examinator?","options":["De kandidaat mag het diplomazwemmen afmaken.","De kandidaat moet stoppen, voor een goede routing.","De kandidaat mag alleen verder als de gedelegeerde dat goedvindt."],"answer":0,"explanation":"De kandidaat heeft altijd het recht om het diplomazwemmen af te maken, ook als de afwijzing al een feit is. De routing is geen reden om te stoppen. Toestemming van een gedelegeerde is niet nodig. §3.1, p. 41","ref":"§3.1, p. 41","tests":"recht om diplomazwemmen af te maken","source":{"page":41,"quote":"De kandidaat heeft altijd het recht om het diplomazwemmen af te maken ook al is tijdens het diplomazwemmen de afwijzing al een feit"},"rev":2},{"id":"TV-0045","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXT-08","TV-EXA-16"],"question":"Welke taak hoort NIET bij de Examinator Nationale Zwemdiploma's?","options":["Kandidaten op de beoordelingslijsten vermelden","Zwemdiploma's gereed maken","De verslagformulieren van gedelegeerden beoordelen"],"answer":2,"explanation":"De verslagformulieren van de Examinator en de gedelegeerden beoordelen is een taak van de aangewezen medewerker van de Nationale Raad Zwemveiligheid. Kandidaten op de beoordelingslijsten vermelden en zwemdiploma's gereed maken zijn wel taken van de Examinator. §3.1–3.2, p. 39 en 42","ref":"§3.1–3.2, p. 39 en 42","tests":"medewerker: verslagformulieren beoordelen, aanvragen controleren","source":{"page":42,"quote":"Hij/zij beoordeelt de verslagformulieren van de Examinator Nationale Zwemdiploma’s en van de gedelegeerden."}},{"id":"TV-0046","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXT-09","TV-EXA-17"],"question":"Welke taak hoort NIET bij de Examinator rond het diplomazwemmen?","options":["De eventueel aanwezige medewerker of gedelegeerde ontvangen","Het diplomazwemmen rapporteren en evalueren","Diplomazwemmen van andere Licentiehouders onaangekondigd bezoeken"],"answer":2,"explanation":"Steekproefsgewijs, aangekondigd en onaangekondigd, het diplomazwemmen bezoeken is een taak van de medewerker van de Nationale Raad Zwemveiligheid. Een eventueel aanwezige medewerker of gedelegeerde ontvangen en het diplomazwemmen rapporteren en evalueren zijn wel taken van de Examinator. §3.1–3.2, p. 39 en 42","ref":"§3.1–3.2, p. 39 en 42","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"De medewerker bezoekt ook steekproefsgewijs, zowel aangekondigd als onaangekondigd, het diplomazwemmen."}},{"id":"TV-0047","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-18"],"question":"Waarvoor heeft de Examinator inlogcodes voor 'Mijn NRZ' op www.nrz-nl.nl?","options":["Om diplomazwemmen en zwemdiploma's aan te vragen","Om het verslag van de gedelegeerde aan te passen","Om de Licentie van de zwemlesaanbieder te wijzigen"],"answer":0,"explanation":"De Examinator heeft inlogcodes om via 'Mijn NRZ' het diplomazwemmen aan te vragen en om zwemdiploma's aan te vragen via de webwinkel. Het verslag van de gedelegeerde maakt de gedelegeerde zelf. De Licentie wijzigen hoort niet bij de taken van de Examinator. §3.1, p. 39","ref":"§3.1, p. 39","tests":"inlogcodes Mijn NRZ voor aanvragen","source":{"page":39,"quote":"inlogcodes om het diplomazwemmen aan te vragen via www.nrz-nl.nl"},"rev":2},{"id":"TV-0048","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-19"],"question":"Welke kandidaten selecteert de Examinator voor het diplomazwemmen?","options":["Kandidaten die het examenprogramma met grote zekerheid kunnen uitvoeren","Alleen kandidaten die het lagere zwemdiploma al hebben behaald","Alle kandidaten die door hun eigen lesgever zijn aangemeld"],"answer":0,"explanation":"De Examinator selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren. Een lager zwemdiploma is geen voorwaarde: zwemdiploma's overslaan mag. Een aanmelding door de lesgever is zonder die zekerheid niet genoeg. §2.3 en §3.1, p. 35 en 39","ref":"§2.3 en §3.1, p. 35 en 39","tests":"selectie: met grote zekerheid","source":{"page":39,"quote":"selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren"},"rev":2},{"id":"TV-0049","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-19"],"question":"Een lesgever twijfelt sterk of een kandidaat voor Zwemdiploma A alle onderdelen beheerst. Het kind wil toch graag meedoen. Wat doet de Examinator?","options":["Hij selecteert het kind niet, want de twijfel is te groot.","Hij selecteert het kind, want het mag elk onderdeel drie keer uitvoeren.","Hij laat de lesgever beslissen,
