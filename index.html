p. 26","tests":"watertrappen: benen gelijktijdig of afwisselend","source":{"page":26,"quote":"De armen/handen bewegen mee, onder water. • Beide benen bewegen, dit mag gelijktijdig of afwisselend worden uitgevoerd."},"rev":2},{"id":"NO-0400","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-02"],"question":"Zwemcertificaat, verplicht deel:\nHoe mag de kandidaat in diep water te water gaan?","options":["Naar keuze, maar niet via een trapje","Naar keuze, ook via een trapje","Alleen met een voetsprong vanaf de kant"],"answer":1,"explanation":"In het verplicht deel gaat de kandidaat naar keuze te water, en in diep water mag dat via een trapje. Het verbod op een trapje geldt bij de zwemdiploma's voor zelfstandig uit het water klimmen. Een voetsprong is in het verplicht deel niet voorgeschreven. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat verplicht deel: te water gaan via trapje","source":{"page":32,"quote":"Te water gaan in diep water mag via een trapje."},"rev":2},{"id":"NO-0401","category":"normering","subtopic":"zwemcertificaten","type":"stellingen","objectives":["NO-CERT-02","NO-CERT-03"],"question":"Zwemcertificaat, verplicht deel:\nWelke stelling over het trapje is juist?\nStelling 1: Te water gaan in diep water mag via een trapje.\nStelling 2: Geheel onder water gaan mag ook met behulp van een trapje.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: te water gaan in diep water mag via een trapje. Stelling 2 is juist: geheel onder water gaan mag ook met behulp van een trapje. Dit zijn afwijkende bepalingen voor het verplicht deel van de zwemcertificaten. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat vs diploma: trapje bij te water en onder water gaan","source":{"page":32,"quote":"Geheel onder water gaan mag ook met behulp van een trapje."},"rev":2},{"id":"NO-0402","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-03"],"question":"Zwemcertificaat A, verplicht deel:\nEen kandidaat gaat gekleed geheel onder water. Hij houdt zich daarbij vast aan het trapje. Wat beslist de examinator?","options":["Voldoende: een trapje mag hierbij.","Onvoldoende: een trapje mag alleen bij het te water gaan.","Onvoldoende: een trapje mag nooit."],"answer":0,"explanation":"Bij de zwemcertificaten mag geheel onder water gaan ook met behulp van een trapje. Een trapje mag dus bij het te water gaan in diep water én bij geheel onder water gaan. Een verbod op het trapje geldt hier niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: geheel onder water gaan met trapje","source":{"page":32,"quote":"Geheel onder water gaan mag ook met behulp van een trapje."},"rev":2},{"id":"NO-0403","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-04"],"question":"Zwemcertificaat, verplicht deel:\nMag de kandidaat bij het drijven de armen actief gebruiken?","options":["Ja, als het nodig is.","Ja, maar altijd samen met een drijvend voorwerp.","Nee, de armen blijven passief."],"answer":0,"explanation":"Ja: drijven wordt in het verplicht deel, als het nodig is, uitgevoerd met actief gebruik van de armen. De armen hoeven dus niet passief te blijven. Een drijvend voorwerp is daarvoor niet altijd nodig; het is geen algemene regel voor het drijven. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."},"rev":2},{"id":"NO-0404","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-04"],"question":"Zwemcertificaat B, verplicht deel:\nEen kandidaat drijft 7 seconden. Dat lukt alleen als hij actief met de armen beweegt. Wat beslist de examinator?","options":["Voldoende, actief gebruik van de armen mag als het nodig is.","Voldoende, het drijven telt bij een zwemcertificaat niet mee.","Onvoldoende, bij het drijven blijven de armen passief."],"answer":0,"explanation":"In het verplicht deel wordt drijven, als het nodig is, uitgevoerd met actief gebruik van de armen. Passieve armen zijn dus niet verplicht. Het drijven telt wel mee: de onderdelen uit het verplichte deel moeten voldoende worden uitgevoerd. §2.2 en §3.1, p. 32 en 41","ref":"§2.2 en §3.1, p. 32 en 41","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."},"rev":2},{"id":"NO-0405","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-05"],"question":"Zwemcertificaat C, verplicht deel:\nEen kandidaat legt de 100 meter in badkleding af met een eigen zwemslag. Die voldoet niet aan de schoolslag techniek. Wat beslist de examinator?","options":["Voldoende, de uitvoering van de zwemslag naar keuze is vrij.","Voldoende, de 100 meter hoort bij het open deel.","Onvoldoende, hier geldt de normering schoolslag techniek."],"answer":0,"explanation":"In het verplicht deel is de uitvoering van de zwemslag naar keuze vrij. De normering schoolslag techniek geldt alleen voor de 25 meter schoolslag in het open deel. De 100 meter hoort niet bij het open deel, maar bij het verplicht deel. §1.2.3 en §2.2, p. 15 en 32","ref":"§1.2.3 en §2.2, p. 15 en 32","tests":"certificaat: uitvoering zwemslag naar keuze vrij","source":{"page":32,"quote":"De uitvoering van de zwemslag naar keuze is vrij."},"rev":2},{"id":"NO-0406","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-06"],"question":"Zwemcertificaat, verplicht deel:\nWat is de essentie van het watertrappen?","options":["Op een bepaalde plaats boven water blijven","Verticaal blijven en beide benen bewegen","Verplaatsen in meerdere richtingen"],"answer":0,"explanation":"Bij de zwemcertificaten is de uitvoering van watertrappen vrij. De essentie is op een bepaalde plaats in het water boven water blijven. Een verticale houding met bewegende benen is een eis bij de zwemdiploma's. Verplaatsen in meerdere richtingen is niet de essentie. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"de essentie is het op een bepaalde plaats in het water boven water blijven"},"rev":2},{"id":"NO-0407","category":"normering","subtopic":"zwemcertificaten","type":"kandidaten","objectives":["NO-CERT-06"],"question":"Zwemcertificaat A, verplicht deel:\nMilan en Anouk doen 1 minuut watertrappen.\n- Milan beweegt de benen onregelmatig en houdt de armen stil. Hij blijft op dezelfde plaats boven water.\n- Anouk beweegt alleen de armen. Zij blijft op dezelfde plaats boven water.\nWelke kandidaat voldoet aan de normering?","options":["Milan","Anouk","Milan en Anouk"],"answer":2,"explanation":"Milan en Anouk voldoen allebei. Bij het zwemcertificaat is de uitvoering van watertrappen vrij. De essentie is op een bepaalde plaats in het water boven water blijven, en dat doen ze allebei. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"De uitvoering van watertrappen is vrij"},"rev":2},{"id":"NO-0408","category":"normering","subtopic":"zwemcertificaten","type":"stellingen","objectives":["NO-CERT-07"],"question":"Zwemcertificaat, open deel:\nWelke stelling is juist?\nStelling 1: Op het zwemcertificaat staat hoeveel onderdelen zijn uitgevoerd.\nStelling 2: Op het zwemcertificaat worden de onvoldoende onderdelen aangekruist.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: er wordt vermeld hoeveel onderdelen zijn uitgevoerd. Stelling 2 is onjuist: op het zwemcertificaat wordt aangekruist welke onderdelen de kandidaat beheerst. Onvoldoende uitgevoerde onderdelen staan op de beoordelingslijsten. §2.2 en §3.1, p. 32 en 41","ref":"§2.2 en §3.1, p. 32 en 41","tests":"open deel: beheerste onderdelen aankruisen en aantal uitgevoerd vermelden","source":{"page":32,"quote":"Er wordt op het zwemcertificaat aangekruist welke onderdelen de kandidaat beheerst."},"rev":2},{"id":"NO-0409","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-07"],"question":"Zwemcertificaat B:\nEen kandidaat voert het verplicht deel voldoende uit. Van het open deel voert hij 8 onderdelen uit. Hij beheerst er 5. Wat gebeurt er op het zwemcertificaat?","options":["De 5 beheerste onderdelen worden aangekruist.","De 3 niet-beheerste onderdelen worden aangekruist.","Alle 8 uitgevoerde onderdelen worden aangekruist."],"answer":0,"explanation":"Op het zwemcertificaat wordt aangekruist welke onderdelen de kandidaat beheerst: hier dus 5. Daarnaast wordt vermeld hoeveel onderdelen zijn uitgevoerd: 8. Niet-beheerste onderdelen worden niet aangekruist. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel: beheerste onderdelen aankruisen en aantal uitgevoerd vermelden","source":{"page":32,"quote":"Er wordt op het zwemcertificaat aangekruist welke onderdelen de kandidaat beheerst."},"rev":2},{"id":"NO-0410","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-08"],"question":"Zwemcertificaat, open deel:\nWelke normering geldt voor de 25 meter schoolslag?","options":["De normering schoolslag techniek uit §2.1","Geen normering: de uitvoering is vrij","De normering gekleed zwemmen uit §2.1"],"answer":0,"explanation":"Bij de 25 meter schoolslag in het open deel geldt de normering schoolslag techniek uit §2.1. Een vrije uitvoering geldt in het verplicht deel, voor de zwemslag naar keuze. De normering gekleed zwemmen is voor zwemmen in kleding, niet voor deze 25 meter. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel schoolslag en enkelvoudige rugslag: normering techniek §2.1","source":{"page":32,"quote":"Bij het open deel 25 meter schoolslag en enkelvoudige rugslag geldt de normering van de schoolslag techniek en enkelvoudige rugslag techniek"},"rev":2},{"id":"NO-0411","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-09"],"question":"Zwemcertificaat, open deel:\nVoor de schoolslag en voor de enkelvoudige rugslag geldt de normering van de techniek uit §2.1. Welke normering geldt voor de overige onderdelen?","options":["Geen normering: de uitvoering is vrij","De richtlijnen voor het maatwerk examenprogramma","De normering uit het hoofdstuk 'Normering'"],"answer":2,"explanation":"Voor de overige onderdelen van het open deel geldt de normering van de onderdelen uit het hoofdstuk 'Normering'. De uitvoering is dus niet vrij. De richtlijnen voor het maatwerk examenprogramma staan in hoofdstuk 4 en gelden hier niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel overige onderdelen: normering uit hoofdstuk Normering","source":{"page":32,"quote":"Voor de overige onderdelen is de normering van de onderdelen uit het hoofdstuk"},"rev":2},{"id":"NO-0412","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-09","NO-CERT-07","NO-CERT-08"],"question":"Welke bewering over het open deel van een zwemcertificaat is NIET juist?","options":["Er wordt vermeld hoeveel onderdelen zijn uitgevoerd.","Voor de 25 meter schoolslag geldt de normering schoolslag techniek.","Voor de overige onderdelen geldt geen normering."],"answer":2,"explanation":"Deze bewering is niet juist. Voor de overige onderdelen van het open deel geldt de normering uit het hoofdstuk 'Normering'. Er wordt wel vermeld hoeveel onderdelen zijn uitgevoerd, en voor de 25 meter schoolslag geldt de normering schoolslag techniek uit §2.1. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel overige onderdelen: normering uit hoofdstuk Normering","source":{"page":32,"quote":"Voor de overige onderdelen is de normering van de onderdelen uit het hoofdstuk"},"rev":2},{"id":"NO-0413","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-01"],"question":"Wat geldt voor de normering bij de Zwemcertificaten A, B en C?","options":["Er gelden een paar afwijkende normeringen.","De normering is gelijk aan die van de zwemdiploma's.","De richtlijnen voor het maatwerk examenprogramma gelden."],"answer":0,"explanation":"Bij de Zwemcertificaten A, B en C gelden een paar specifieke afwijkende normeringen en bepalingen, bijvoorbeeld voor het trapje en voor watertrappen. De normering is dus niet helemaal gelijk aan die van de zwemdiploma's. De richtlijnen voor het maatwerk examenprogramma staan in hoofdstuk 4 en gelden hier niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten: specifieke afwijkende normeringen en bepalingen","source":{"page":32,"quote":"gelden een paar specifieke afwijkende normeringen en bepalingen"},"rev":2},{"id":"NO-0414","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-10"],"question":"Hoe worden zwemcertificaten aangevraagd?","options":["Eén keer per jaar, voor alle examens","Per organisatie van het diplomazwemmen","Per kandidaat, na de uitslag"],"answer":1,"explanation":"Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd, in kleine aantallen. Een jaarvoorraad past daar niet bij, want ze worden maar zeer beperkt in voorraad gehouden. Aanvragen per kandidaat na de uitslag staat niet in de regeling. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten per organisatie aanvragen, kleine aantallen","source":{"page":32,"quote":"Zwemcertificaten dienen per organisatie van het diplomazwemmen te worden aangevraagd."},"rev":2},{"id":"NO-0415","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-11"],"question":"Een Licentiehouder is gespecialiseerd in zwemlessen voor kandidaten met een (tijdelijke) beperking. Hoeveel zwemcertificaten mag hij in voorraad houden?","options":["10 stuks in totaal","Geen enkel zwemcertificaat","10 stuks per niveau"],"answer":2,"explanation":"Voor deze Licentiehouders geldt een uitzondering: zij kunnen een beperkte voorraad aanhouden van 10 stuks per niveau. Het gaat dus niet om 10 in totaal. Geen voorraad is ook onjuist: de hoofdregel is aanvragen per organisatie van het diplomazwemmen, en daarop is dit juist de uitzondering. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Zij kunnen een beperkte voorraad aanhouden (10 stuks per niveau)."},"rev":2},{"id":"NO-0416","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-11"],"question":"Een Licentiehouder is gespecialiseerd in zwemlessen voor kandidaten met een (tijdelijke) beperking. Hij wil 10 Zwemcertificaten A, 10 B en 10 C in voorraad houden. Mag dat?","options":["Ja, hij mag 10 stuks per niveau aanhouden.","Nee, hij mag in totaal maximaal 10 stuks aanhouden.","Nee, hij moet ze per organisatie van het diplomazwemmen aanvragen."],"answer":0,"explanation":"Voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking geldt een uitzondering: een voorraad van 10 stuks per niveau. 10 van A, 10 van B en 10 van C mag dus. Een maximum van 10 in totaal staat niet in de regeling, en aanvragen per organisatie van het diplomazwemmen is de hoofdregel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Zij kunnen een beperkte voorraad aanhouden (10 stuks per niveau)."},"rev":2},{"id":"NO-0417","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-11","NO-CERT-10"],"question":"Een zwemschool is niet gespecialiseerd in zwemlessen voor kandidaten met een beperking. De zwemschool wil standaard 10 zwemcertificaten per niveau in voorraad houden. Mag dat?","options":["Nee, die voorraad is een uitzondering voor gespecialiseerde Licentiehouders.","Nee, zwemcertificaten mogen nooit in voorraad worden gehouden.","Ja, elke Licentiehouder mag 10 stuks per niveau aanhouden."],"answer":0,"explanation":"Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd en zeer beperkt in voorraad gehouden. Een voorraad van 10 stuks per niveau is een uitzondering voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking. Zeer beperkt in voorraad houden mag wel, dus 'nooit' klopt niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten per organisatie aanvragen, kleine aantallen","source":{"page":32,"quote":"Er wordt een uitzondering gemaakt voor Licentiehouders die gespecialiseerd zijn in zwemlessen"},"rev":2},{"id":"NO-0418","category":"normering","subtopic":"zwemcertificaten","type":"stellingen","objectives":["NO-CERT-11","NO-CERT-10"],"question":"Zwemcertificaten aanvragen en in voorraad houden:\nWelke stelling is juist?\nStelling 1: Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd.\nStelling 2: Iedere Licentiehouder mag 10 zwemcertificaten per niveau in voorraad houden.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd. Stelling 2 is onjuist: de voorraad van 10 stuks per niveau is een uitzondering voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Er wordt een uitzondering gemaakt voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking."},"rev":2},{"id":"NO-0419","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-04","NO-CERT-02","NO-CERT-06"],"question":"Welke bepaling geldt NIET voor het verplicht deel van een zwemcertificaat?","options":["Te water gaan in diep water mag via een trapje.","Drijven gebeurt altijd zonder actief gebruik van de armen.","De uitvoering van watertrappen is vrij."],"answer":1,"explanation":"Drijven wordt in het verplicht deel juist, als het nodig is, uitgevoerd met actief gebruik van de armen. Te water gaan in diep water via een trapje en de vrije uitvoering van watertrappen zijn wel bepalingen voor het verplicht deel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."}},{"id":"NO-0420","category":"normering","subtopic":"zwemcertificaten","type":"verschil","objectives":["NO-CERT-06"],"question":"Watertrappen: wat is het verschil tussen Zwemdiploma A en het verplicht deel van een zwemcertificaat?","options":["Bij het zwemcertificaat is de uitvoering vrij.","Bij Zwemdiploma A is de uitvoering vrij.","Bij het zwemcertificaat is armgebruik verplicht."],"answer":0,"explanation":"Bij Zwemdiploma A gelden voor gekleed watertrappen eisen, zoals een verticale houding en bewegende benen. Bij het zwemcertificaat is de uitvoering van watertrappen vrij; de essentie is op een bepaalde plaats boven water blijven. Armgebruik is bij het zwemcertificaat dus niet verplicht. §2.1.1 en §2.2, p. 17 en 32","ref":"§2.1.1 en §2.2, p. 17 en 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"De uitvoering van watertrappen is vrij; de essentie is het op een bepaalde plaats in het water"},"rev":2},{"id":"NO-0421","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-02"],"question":"Zwemcertificaat C, verplicht deel:\nEen kandidaat gaat gekleed via het trapje het diepe water in. Mag dat?","options":["Ja, te water gaan in diep water mag via een trapje.","Nee, bij Zwemcertificaat C moet hij met een sprong te water gaan.","Nee, een trapje mag alleen in het open deel."],"answer":0,"explanation":"In het verplicht deel gaat de kandidaat naar keuze te water, en in diep water mag dat via een trapje. Een sprong is in het verplicht deel dus niet voorgeschreven. De regel over het trapje staat juist bij het verplicht deel, niet bij het open deel. §1.2.3 en §2.2, p. 15 en 32","ref":"§1.2.3 en §2.2, p. 15 en 32","tests":"certificaat verplicht deel: te water gaan via trapje","source":{"page":32,"quote":"Te water gaan in diep water mag via een trapje."},"rev":2},{"id":"AB-0001","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-01"],"question":"Een kandidaat voert een onderdeel onvoldoende uit. Hoe vaak mag hij dit onderdeel in totaal uitvoeren?","options":["Maximaal twee keer","Maximaal drie keer","Zo vaak als nodig binnen het examen"],"answer":1,"explanation":"Een kandidaat mag een onderdeel maximaal drie keer uitvoeren om te laten zien dat hij het beheerst. Twee keer is te weinig. Onbeperkt herhalen mag niet. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maximaal aantal pogingen per onderdeel","source":{"page":35,"quote":"De kandidaat mag een onderdeel maximaal drie keer uitvoeren"},"rev":2},{"id":"AB-0002","category":"algemene_bepalingen","subtopic":"kleding","type":"stellingen","objectives":["AB-KLED-03","AB-KLED-02"],"question":"Onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen':\nWelke stelling is juist?\nStelling 1: Bij het kledingpakket voor Zwemdiploma C hoort een jas.\nStelling 2: Bij dit onderdeel draagt de kandidaat een jas.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij Zwemdiploma C komt er een jas bij het kledingpakket van A en B. Stelling 2 is onjuist: dit onderdeel is de uitzondering en wordt zonder de jas gezwommen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: zeil-onderdeel zonder jas","source":{"page":33,"quote":"Dit onderdeel wordt zonder de jas gezwommen."},"rev":2},{"id":"AB-0003","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-06","AB-ORG-08"],"question":"Een kandidaat heeft nog geen Zwemdiploma A of B. Hij wordt aangemeld voor het diplomazwemmen voor Zwemdiploma C. Mag hij meedoen?","options":["Ja, een lager diploma is niet vereist.","Ja, als hij eerst op dezelfde dag Zwemdiploma A haalt.","Nee, hij moet eerst Zwemdiploma B halen."],"answer":0,"explanation":"Voor een hoger zwemdiploma is een lager diploma niet vereist: je mag zwemdiploma's overslaan. Op één dag eerst A en dan C afleggen kan niet. Een kandidaat mag voor het Zwem-ABC maar één examenprogramma per dag afleggen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"diploma's overslaan toegestaan","source":{"page":35,"quote":"Je mag dus zwemdiploma’s overslaan"},"rev":2},{"id":"AB-0010","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-01"],"question":"Bassin voor het Zwem-ABC:\nWelke oppervlakte moet het bassin minimaal hebben?","options":["160 m2","40 m2","80 m2"],"answer":0,"explanation":"Het bassin voor het Zwem-ABC heeft een oppervlakte van ten minste 160 m2. 40 m2 is het deel dat minimaal 1,8 meter diep moet zijn. 80 is de minimale waterdiepte in centimeters, geen oppervlakte. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: oppervlakte ten minste 160 m2","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"},"rev":2},{"id":"AB-0011","category":"algemene_bepalingen","subtopic":"zwembad","type":"casus","objectives":["AB-ZWEM-01","AB-ZWEM-03"],"question":"Een bassin is 150 m2 groot. Over 50 m2 is het water 2 meter diep. Mag een zwemlesaanbieder in dit bassin examens voor het Zwem-ABC afnemen?","options":["Nee, het bassin moet minimaal 160 m2 groot zijn.","Nee, het diepe deel moet minimaal 80 m2 groot zijn.","Ja, het diepe deel is groter dan 40 m2."],"answer":0,"explanation":"Het bassin moet een oppervlakte van ten minste 160 m2 hebben; 150 m2 is te klein. Het diepe deel van minimaal 1,8 meter hoeft maar ten minste 40 m2 te zijn, niet 80 m2. Een groot genoeg diep deel maakt een te klein bassin niet goed. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: oppervlakte ten minste 160 m2","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"},"rev":2},{"id":"AB-0012","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-03","AB-ZWEM-01"],"question":"Bassin voor het Zwem-ABC:\nOver hoeveel m2 moet het water minimaal 1,8 meter diep zijn?","options":["40 m2","80 m2","160 m2"],"answer":0,"explanation":"Over een wateroppervlakte van ten minste 40 m2 moet de waterdiepte minimaal 1,8 meter zijn. 160 m2 is de oppervlakte van het hele bassin. 80 m2 staat niet in de eisen; 80 is de minimale waterdiepte in centimeters. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: 40 m2 minimaal 1,8 meter diep","source":{"page":33,"quote":"over een wateroppervlakte van ten minste 40 m2 een waterdiepte van minimaal 1,8 meter heeft"},"rev":2},{"id":"AB-0014","category":"algemene_bepalingen","subtopic":"zwembad","type":"casus","objectives":["AB-ZWEM-02"],"question":"Een bassin is 200 m2 groot. Over 60 m2 is het water 2 meter diep. Het ondiepste deel is 60 centimeter diep. Voldoet dit bassin aan de eisen voor het Zwem-ABC?","options":["Nee, de waterdiepte moet minimaal 80 centimeter zijn.","Ja, het diepe deel is groter dan 40 m2.","Ja, het bassin is groter dan 160 m2."],"answer":0,"explanation":"Het bassin moet een waterdiepte van ten minste 80 centimeter hebben; 60 centimeter is te ondiep. De oppervlakte van 200 m2 en het diepe deel van 60 m2 voldoen wel, maar dat is niet genoeg. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: waterdiepte ten minste 80 centimeter","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"},"rev":2},{"id":"AB-0015","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-04"],"question":"Het bassin voor het Zwem-ABC heeft een voorgeschreven waterdiepte. Welke reden noemt de Examenregeling voor deze waterdiepte?","options":["Kinderen raken de bodem niet gemakkelijk.","Het examenprogramma past dan binnen 1,5 uur.","Het examen verloopt dan overzichtelijk."],"answer":0,"explanation":"Kinderen raken in de voorgeschreven waterdiepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven. De 1,5 uur en het overzichtelijk verlopen zijn organisatieregels; die hebben niets met de waterdiepte te maken. §2.3, p. 33","ref":"§2.3, p. 33","tests":"reden afmetingen bassin: bodem niet gemakkelijk raken","source":{"page":33,"quote":"Kinderen raken in de voorgeschreven waterdiepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven"},"rev":2},{"id":"AB-0016","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-06"],"question":"Bepaalde proeven of onderdelen mogen in een ander bassin worden uitgevoerd, zoals het golfslagbad. Welke onderdelen vinden altijd plaats in een bassin van minimaal 160 m2?","options":["Survival en conditiezwemmen","Onder water zwemmen en survival","Conditiezwemmen en borst- en rugcrawl"],"answer":0,"explanation":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2. Onder water zwemmen en borst- en rugcrawl noemt deze regel niet. §2.3, p. 33","ref":"§2.3, p. 33","tests":"survival en conditiezwemmen altijd in bassin ≥ 160 m2","source":{"page":33,"quote":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2"}},{"id":"AB-0017","category":"algemene_bepalingen","subtopic":"zwembad","type":"stellingen","objectives":["AB-ZWEM-06","AB-ZWEM-05"],"question":"Gebruik van andere bassins:\nWelke stelling is juist?\nStelling 1: Bepaalde proeven mogen in bijvoorbeeld het recreatiebad worden uitgevoerd.\nStelling 2: Conditiezwemmen mag in een golfslagbad van minder dan 160 m2.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bepaalde proeven of onderdelen mogen in andere bassins, zoals het recreatie- of golfslagbad. Stelling 2 is onjuist: survival en conditiezwemmen vinden altijd plaats in een bassin van ten minste 160 m2. §2.3, p. 33","ref":"§2.3, p. 33","tests":"andere bassins toegestaan voor bepaalde proeven/onderdelen","source":{"page":33,"quote":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2"},"rev":2},{"id":"AB-0018","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-07"],"question":"Wat zijn de bepalingen en richtlijnen voor de uitvoering van de examens volgens de Examenregeling?","options":["Minimale voorschriften voor het diplomazwemmen","Vrijblijvende aanbevelingen voor de Licentiehouder","Eisen die alleen voor maatwerk examenprogramma's gelden"],"answer":0,"explanation":"De bepalingen en richtlijnen zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen. Het zijn dus geen vrijblijvende aanbevelingen. Ze gelden ook niet alleen voor het maatwerk examenprogramma. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bepalingen en richtlijnen = minimale voorschriften","source":{"page":33,"quote":"Dit zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen"},"rev":2},{"id":"AB-0019","category":"algemene_bepalingen","subtopic":"kleding","type":"stellingen","objectives":["AB-KLED-02","AB-KLED-01"],"question":"Kledingvoorschriften voor de zwemdiploma's:\nWelke stelling is juist?\nStelling 1: De kledingvoorschriften voor Zwemdiploma A en B zijn gelijk.\nStelling 2: Bij Zwemdiploma C hoort er ook een jas bij het kledingpakket.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de kledingvoorschriften voor Zwemdiploma A en B zijn gelijk. Stelling 2 is ook juist: voor Zwemdiploma C komt er een jas met lange mouwen bij het kledingpakket. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: jas toegevoegd aan kledingpakket","source":{"page":33,"quote":"Voor Zwemdiploma C wordt een jas toegevoegd aan het kledingpakket"},"rev":2},{"id":"AB-0020","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-01"],"question":"Proef Survival, Zwemdiploma A:\nEen kandidaat draagt badkleding, een shirt met korte mouwen, een lange broek en sportschoenen. Voldoet deze kleding?","options":["Nee, het shirt moet lange mouwen hebben.","Nee, bij Zwemdiploma A hoort er ook een jas bij.","Ja, de broek en de schoenen zijn goed."],"answer":0,"explanation":"Bij Zwemdiploma A hoort een shirt, hemd of blouse met lange mouwen; korte mouwen voldoen dus niet. Een jas hoort alleen bij Zwemdiploma C. Een goede broek en goede schoenen maken het shirt niet goed. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding A/B: shirt, hemd of blouse met lange mouwen","source":{"page":33,"quote":"De kleding bestaat uit een lange broek, een shirt, hemd of blouse met lange mouwen en schoenen"},"rev":2},{"id":"AB-0021","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-01"],"question":"Proef Survival, Zwemdiploma B:\nEen kandidate draagt een rok die tot de knie komt. Voldoet deze kleding?","options":["Nee, een rok moet tot de enkels komen.","Nee, een rok is bij Survival niet toegestaan.","Ja, de lengte van een rok is vrij."],"answer":0,"explanation":"Het kledingvoorschrift noemt een lange broek, of een jurk of rok tot de enkels. Een rok mag dus wel, maar een rok tot de knie is te kort. De lengte is niet vrij. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding: jurk of rok tot de enkels","source":{"page":33,"quote":"Lange broek, jurk of rok tot de enkels"},"rev":2},{"id":"AB-0022","category":"algemene_bepalingen","subtopic":"kleding","type":"stellingen","objectives":["AB-KLED-04"],"question":"Proef Survival, Zwemdiploma A:\nWelke stelling is juist?\nStelling 1: De kandidaat draagt de kleding tot het einde van de opdracht.\nStelling 2: De kandidaat mag zijn schoenen uittrekken zodra hij in het water ligt.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij alle onderdelen van Survival blijft de kleding aan tot het einde van de opdracht. Stelling 2 is onjuist: de schoenen horen bij de kleding en blijven dus ook aan. Alleen bij Zwemdiploma C is er één uitzondering, voor de jas. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding tot het einde van de opdracht gedragen","source":{"page":33,"quote":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen"},"rev":2},{"id":"AB-0023","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-04"],"question":"Proef Survival, Zwemdiploma B:\nTijdens de proef trekt een kandidaat in het water zijn shirt uit. Het shirt werd te zwaar. Daarna maakt hij de opdracht af. Wat beslist de examinator?","options":["Onvoldoende, de kleding moet aanblijven tot het einde van de opdracht.","Voldoende, de broek en de schoenen zijn aangebleven.","Voldoende, alleen bij Zwemdiploma C moet alle kleding aanblijven."],"answer":0,"explanation":"Bij alle onderdelen van Survival blijft de kleding aan tot het einde van de opdracht, bij A, B en C. Een shirt uittrekken voldoet daar niet aan, ook als de broek en de schoenen aanblijven. De enige uitzondering is de jas bij één onderdeel van Zwemdiploma C. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding tot het einde van de opdracht gedragen","source":{"page":33,"quote":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen"},"rev":2},{"id":"AB-0024","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-03"],"question":"Onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen', Zwemdiploma C:\nEen kandidaat vraagt of hij zijn jas moet aanhouden. Wat zegt de examinator?","options":["Nee, dit onderdeel zwem je zonder de jas.","Nee, bij dit onderdeel gaat alle kleding uit.","Ja, bij Survival blijft alle kleding aan."],"answer":0,"explanation":"Dit onderdeel is de uitzondering op de regel dat de kleding aanblijft tot het einde van de opdracht. Het wordt zonder de jas gezwommen; alleen de jas gaat dus uit. De regel dat alle kleding aanblijft, geldt hier niet voor de jas. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: zeil-onderdeel zonder jas","source":{"page":33,"quote":"Dit onderdeel wordt zonder de jas gezwommen."},"rev":2},{"id":"AB-0025","category":"algemene_bepalingen","subtopic":"kleding","type":"kennis","objectives":["AB-KLED-05"],"question":"Wat is de bedoeling van het dragen van kleding tijdens de examens?","options":["Laten zien dat je jezelf kunt redden met dagelijkse kleding aan","Je voorbereiden op open water met stroming en golfslag","Laten zien dat je gekleed binnen een limiettijd kunt zwemmen"],"answer":0,"explanation":"Met kleding laat je zien dat je jezelf kunt redden met dagelijkse kleding aan, als je onverwacht in het water terechtkomt. Voorbereiden op open water met stroming en zwemmen binnen een limiettijd worden niet als doel genoemd. §2.3, p. 34","ref":"§2.3, p. 34","tests":"doel kleding: jezelf redden met dagelijkse kleding","source":{"page":34,"quote":"De bedoeling van het dragen van kleding tijdens de examens is te laten zien dat je met dagelijkse kleding aan jezelf kunt redden"},"rev":2},{"id":"AB-0026","category":"algemene_bepalingen","subtopic":"kleding","type":"kennis","objectives":["AB-KLED-05"],"question":"Waarop is de kledingkeuze bij het diplomazwemmen gebaseerd?","options":["Op dagelijkse buitenkleding in het Nederlandse klimaat","Op de kleding die Reddingsbrigade Nederland voorschrijft","Op de keuze van de Licentiehouder per seizoen"],"answer":0,"explanation":"De kledingkeuze is gebaseerd op kleding die je bij normale dagelijkse bezigheden buiten draagt, en is afgestemd op ons Nederlandse klimaat. Dat geldt ook voor de schoenen. Reddingsbrigade Nederland en de Licentiehouder bepalen de kleding niet. §2.3, p. 34","ref":"§2.3, p. 34","tests":"kledingkeuze: dagelijkse buitenkleding, Nederlands klimaat","source":{"page":34,"quote":"De kledingkeuze is gebaseerd op de kleding die tijdens normale dagelijkse bezigheden buiten wordt gedragen en is afgestemd op ons Nederlandse klimaat"},"rev":2},{"id":"AB-0027","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-07"],"question":"Proef Survival, Zwemdiploma A:\nEen kandidaat komt op slippers. Mag dit?","options":["Nee, slippers hebben geen echte zool.","Nee, alleen sportschoenen zijn toegestaan.","Ja, slippers gelden als plastic schoenen."],"answer":0,"explanation":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan. Niet alleen sportschoenen mogen: plastic, leren en katoenen schoenen zijn ook toegestaan. Slippers worden juist genoemd als schoenen die niet mogen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"slippers, pantoffels, surfschoentjes niet toegestaan","source":{"page":34,"quote":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan"},"rev":2},{"id":"AB-0028","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-07","AB-KLED-06"],"question":"Welke schoenen zijn bij het diplomazwemmen NIET toegestaan?","options":["Surfschoentjes","Leren schoenen","Plastic schoenen"],"answer":0,"explanation":"Surfschoentjes zijn schoenen zonder echte zool, net als slippers, en zijn daarom niet toegestaan. Leren en plastic schoenen zijn wel toegestaan, net als katoenen schoenen en sportschoenen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"slippers, pantoffels, surfschoentjes niet toegestaan","source":{"page":34,"quote":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan"},"rev":2},{"id":"AB-0029","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-06"],"question":"Proef Survival, Zwemdiploma B:\nEen kandidaat draagt katoenen schoenen met een echte zool. Mag dit?","options":["Ja, katoenen schoenen zijn toegestaan.","Nee, alleen leren schoenen en sportschoenen mogen.","Nee, katoenen schoenen gelden als pantoffels."],"answer":0,"explanation":"Plastic, leren, katoenen en sportschoenen zijn toegestaan, dus katoenen schoenen mogen. Het zijn er dus meer dan alleen leren schoenen en sportschoenen. Niet toegestaan zijn pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes. §2.3, p. 34","ref":"§2.3, p. 34","tests":"toegestane schoenen: plastic, leer, katoen, sport","source":{"page":34,"quote":"Plastic-, leren-, katoenen- en sportschoenen zijn toegestaan"},"rev":2},{"id":"AB-0030","category":"algemene_bepalingen","subtopic":"kleding","type":"kennis","objectives":["AB-KLED-08"],"question":"Welke kledingvoorschriften gelden voor de Zwemcertificaten A, B en C?","options":["Dezelfde voorschriften als voor het Zwem-ABC","De voorschriften van het Zwem-ABC, maar zonder jas","De voorschriften die de Licentiehouder kiest"],"answer":0,"explanation":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan die van het Zwem-ABC. Bij Zwemcertificaat C hoort dus ook een jas. De Licentiehouder kiest de kleding niet zelf. §2.3, p. 34","ref":"§2.3, p. 34","tests":"kleding zwemcertificaten gelijk aan Zwem-ABC","source":{"page":34,"quote":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan de kledingvoorschriften van het Zwem-ABC"},"rev":2},{"id":"AB-0031","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-01","AB-KLED-02"],"question":"Welk kledingstuk hoort NIET bij het kledingpakket voor Zwemdiploma A?","options":["Jas met lange mouwen","Shirt, hemd of blouse met lange mouwen","Schoenen"],"answer":0,"explanation":"De jas met lange mouwen komt alleen bij Zwemdiploma C bij het kledingpakket. Bij Zwemdiploma A horen wel badkleding, een shirt, hemd of blouse met lange mouwen, een lange broek (of jurk of rok tot de enkels) en schoenen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: jas toegevoegd aan kledingpakket","source":{"page":33,"quote":"Voor Zwemdiploma C wordt een jas toegevoegd aan het kledingpakket"}},{"id":"AB-0032","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-01"],"question":"Waarom moet het gebruik van lijnen bij het diplomazwemmen zo minimaal mogelijk blijven?","options":["De examens toetsen vooral zwemveiligheid, zelfvertrouwen en overzicht.","De examens toetsen vooral snelheid, conditie en uithoudingsvermogen.","De examens toetsen vooral de uitvoering van de zwemslagen."],"answer":0,"explanation":"Het voornaamste doel van de examens is de zwemveiligheid, het zelfvertrouwen en het overzicht in het water van de kandidaat te toetsen. Daarom blijft het gebruik van lijnen zo minimaal mogelijk. Snelheid, conditie en de uitvoering van de zwemslagen noemt de Examenregeling hier niet als voornaamste doel. §2.3, p. 34","ref":"§2.3, p. 34","tests":"gebruik van lijnen zo minimaal mogelijk","source":{"page":34,"quote":"Daarom dient het gebruik van lijnen tijdens het diplomazwemmen zo minimaal mogelijk te blijven"},"rev":2},{"id":"AB-0033","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-02"],"question":"Een chloor/zwembrilletje is bij het diplomazwemmen meestal niet toegestaan. Bij welke onderdelen mag het wel, zonder overleg vooraf?","options":["Bij borst- en rugcrawl","Bij de proef Onder water zwemmen","Bij de onderdelen van Survival"],"answer":0,"explanation":"Een chloor/zwembrilletje mag bij borst- en rugcrawl en bij de beoordeling van de techniek van de zwemslag. Bij andere onderdelen, zoals in de proef Onder water zwemmen of Survival, mag het alleen in bijzondere situaties. Die uitzondering bespreek je vooraf met de regioadviseur. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zwembrilletje alleen bij borst-/rugcrawl en techniek","source":{"page":34,"quote":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl"},"rev":2},{"id":"AB-0034","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-02","AB-MAT-03"],"question":"Proef Survival, Zwemdiploma B:\nEen kandidaat wil een chloor/zwembrilletje dragen. Er is vooraf niets over afgesproken. Mag dit?","options":["Nee, het mag bij borst- en rugcrawl, niet bij Survival.","Nee, het mag bij de proef Onder water zwemmen, niet bij Survival.","Ja, de examinator mag het op de examendag toestaan."],"answer":0,"explanation":"Een chloor/zwembrilletje is niet toegestaan, behalve bij borst- en rugcrawl en bij de beoordeling van de techniek van de zwemslag. Bij andere onderdelen kan een uitzondering alleen na overleg met de regioadviseur, vóór het selecteren van de kandidaten. De examinator beslist dit dus niet op de examendag. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zwembrilletje alleen bij borst-/rugcrawl en techniek","source":{"page":34,"quote":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl"},"rev":2},{"id":"AB-0036","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-03"],"question":"In een bijzondere situatie mag een kandidaat ook bij andere onderdelen dan borst- en rugcrawl een chloor/zwembrilletje gebruiken. Met wie bespreek je deze uitzondering?","options":["Met de regioadviseur van de Nationale Raad Zwemveiligheid","Met de Toetsingscommissie Maatwerk Examenprogramma's","Met de Examinator Nationale Zwemdiploma's"],"answer":0,"explanation":"Deze uitzondering bespreek je met de regioadviseur van de Nationale Raad Zwemveiligheid, vóór het selecteren van de kandidaten. De Toetsingscommissie toetst maatwerk examenprogramma's. De examinator wordt hier niet genoemd. §2.3, p. 34","ref":"§2.3, p. 34","tests":"uitzondering zwembrilletje: vooraf met regioadviseur","source":{"page":34,"quote":"bespreek je voorafgaand aan het selecteren van de kandidaten met de regioadviseur"},"rev":2},{"id":"AB-0037","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-03"],"question":"Een kandidaat heeft in een bijzondere situatie een chloor/zwembrilletje nodig bij de proef Onder water zwemmen. Dat is een uitzondering. Wanneer bespreek je die met de regioadviseur?","options":["Vóór het selecteren van de kandidaten","Op de examendag, vóór het examen","Na afloop van het diplomazwemmen"],"answer":0,"explanation":"Een uitzondering voor een chloor/zwembrilletje bespreek je met de regioadviseur vóór het selecteren van de kandidaten. Op de examendag of achteraf is te laat. §2.3, p. 34","ref":"§2.3, p. 34","tests":"uitzondering zwembrilletje: vooraf met regioadviseur","source":{"page":34,"quote":"bespreek je voorafgaand aan het selecteren van de kandidaten met de regioadviseur"},"rev":2},{"id":"AB-0038","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-04"],"question":"Wat is de minimale afmeting van het zeil met gat?","options":["1,8 bij 1,8 meter","1,4 meter bij 70 centimeter","1 bij 1 meter"],"answer":0,"explanation":"Het zeil is minimaal 1,8 bij 1,8 meter. 1,4 meter bij 70 centimeter is de minimale maat van een drijvend voorwerp om onderdoor te zwemmen. 1 bij 1 meter is de maximale maat van het soort wak. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zeil minimaal 1,8 × 1,8 meter","source":{"page":34,"quote":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter"}},{"id":"AB-0039","category":"algemene_bepalingen","subtopic":"materialen","type":"stellingen","objectives":["AB-MAT-05"],"question":"Het zeil met gat:\nWelke stelling is juist?\nStelling 1: Het gat heeft een diameter van 75 centimeter.\nStelling 2: Het gat zit op 75 centimeter van het wateroppervlak.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: het gat heeft een diameter van 75 centimeter. Stelling 2 is ook juist: het gat bevindt zich op 75 centimeter van het wateroppervlak. §2.3, p. 34","ref":"§2.3, p. 34","tests":"gat in zeil: diameter 75 cm, op 75 cm","source":{"page":34,"quote":"Het gat heeft een diameter van 75 centimeter. Het gat bevindt zich op 75 centimeter van het wateroppervlak"},"rev":2},{"id":"AB-0040","category":"algemene_bepalingen","subtopic":"materialen","type":"stellingen","objectives":["AB-MAT-10","AB-MAT-04"],"question":"Zeil en soort wak:\nWelke stelling is juist?\nStelling 1: Het soort wak is minimaal 1 bij 1 meter.\nStelling 2: Het zeil is minimaal 1,8 bij 1,8 meter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: 1 bij 1 meter (of een diameter van 1 meter) is de maximale afmeting van het soort wak, geen minimale. Stelling 2 is juist: het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter. §2.3, p. 34","ref":"§2.3, p. 34","tests":"soort wak maximaal 1 × 1 m of diameter 1 m","source":{"page":34,"quote":"Het wak heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter"},"rev":2},{"id":"AB-0041","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-04"],"question":"Bij een examen hangt een zeil van 1,5 bij 1,8 meter. Het gat heeft een diameter van 75 centimeter. Voldoet dit zeil?","options":["Nee, het zeil moet minimaal 1,8 bij 1,8 meter zijn.","Nee, het gat moet een diameter van 1 meter hebben.","Ja, alleen de maat van het gat is voorgeschreven."],"answer":0,"explanation":"Het zeil moet minimaal 1,8 bij 1,8 meter zijn, dus 1,5 meter is te klein. Het gat van 75 centimeter is goed; een diameter van 1 meter hoort bij het soort wak. Er zijn eisen voor het zeil én voor het gat. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zeil minimaal 1,8 × 1,8 meter","source":{"page":34,"quote":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter"},"rev":2},{"id":"AB-0042","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-06"],"question":"Wat zegt de Examenregeling over het materiaal van een drijvend voorwerp?","options":["Je mag het soort materiaal zelf kiezen.","Het moet een goedgekeurde zwembadmat zijn.","Je stemt het materiaal af met de regioadviseur."],"answer":0,"explanation":"Bij een drijvend voorwerp mag je zelf invulling geven aan het soort materiaal en voorwerp, zoals een mat, bootje of surfplank. Een speciale mat is niet voorgeschreven. Overleg met de regioadviseur hoort bij een uitzondering voor een chloor/zwembrilletje. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp: soort materiaal vrij (mat, bootje, surfplank)","source":{"page":34,"quote":"Dit biedt ruimte om zelf invulling te geven aan het soort materiaal en voorwerp"},"rev":2},{"id":"AB-0043","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-07"],"question":"Een kandidaat zwemt onder een drijvend voorwerp door. Wat is de minimale afmeting van dat voorwerp?","options":["1,4 meter lang en 70 centimeter breed","1,8 meter lang en 1,8 meter breed","1 meter lang en 75 centimeter breed"],"answer":0,"explanation":"Bij onderdelen waarbij de kandidaat onder het voorwerp door zwemt, is het voorwerp minimaal 1,4 meter lang en 70 centimeter breed. 1,8 bij 1,8 meter is de maat van het zeil. 1 meter en 75 centimeter zijn maten van het soort wak en van het gat in het zeil. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp onderdoor: minimaal 1,4 m × 70 cm","source":{"page":34,"quote":"Deze afmetingen zijn: lengte 1,4 meter en breedte 70 centimeter"},"rev":2},{"id":"AB-0044","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-08","AB-MAT-07"],"question":"Onderdeel 'gekleed onder een drijvend voorwerp door zwemmen':\nDe zwemlesaanbieder koppelt twee matten in de lengte aan elkaar. Elke mat is 0,7 meter lang en 70 centimeter breed. Voldoet dit?","options":["Ja, samen zijn de matten 1,4 meter lang.","Ja, voor dit onderdeel geldt geen minimale afmeting.","Nee, het voorwerp moet uit één stuk bestaan."],"answer":0,"explanation":"Kortere of smallere voorwerpen mogen aan elkaar worden gekoppeld, als ze samen aan de minimale afmetingen voldoen. Samen zijn de matten 1,4 meter lang en 70 centimeter breed: precies het minimum. Voor dit onderdeel geldt wel een minimale afmeting, en één stuk is niet nodig. §2.3, p. 34","ref":"§2.3, p. 34","tests":"koppelen voorwerpen toegestaan als totaal minimummaat haalt","source":{"page":34,"quote":"Het is toegestaan om meerdere smallere of kortere voorwerpen aan elkaar te koppelen"},"rev":2},{"id":"AB-0045","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-07"],"question":"Een zwemlesaanbieder gebruikt één mat voor het onderdeel 'gekleed onder een drijvend voorwerp door zwemmen'. De mat is 1,2 meter lang en 1 meter breed. Voldoet deze mat?","options":["Nee, de mat moet minimaal 1,4 meter lang zijn.","Nee, de mat moet minimaal 1,4 meter breed zijn.","Ja, de afmeting van het voorwerp is vrij."],"answer":0,"explanation":"Het voorwerp moet minimaal 1,4 meter lang en 70 centimeter breed zijn. De mat is dus breed genoeg, maar 1,2 meter is te kort. Het soort voorwerp is vrij, de minimale afmeting niet. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp onderdoor: minimaal 1,4 m × 70 cm","source":{"page":34,"quote":"Deze afmetingen zijn: lengte 1,4 meter en breedte 70 centimeter"},"rev":2},{"id":"AB-0046","category":"algemene_bepalingen","subtopic":"materialen","type":"stellingen","objectives":["AB-MAT-08"],"question":"Drijvend voorwerp, aan elkaar koppelen:\nWelke stelling is juist?\nStelling 1: Elk gekoppeld voorwerp moet apart minimaal 70 centimeter breed zijn.\nStelling 2: Samen moeten de voorwerpen aan de minimale afmetingen voldoen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: ook smallere voorwerpen mogen aan elkaar worden gekoppeld. Stelling 2 is juist: het geheel moet in totaal aan de minimale afmetingen voldoen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"koppelen voorwerpen toegestaan als totaal minimummaat haalt","source":{"page":34,"quote":"Het is toegestaan om meerdere smallere of kortere voorwerpen aan elkaar te koppelen, mits dan in totaal aan de minimale afmetingen wordt voldaan"},"rev":2},{"id":"AB-0047","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-09"],"question":"Onderdeel 'over een drijvend voorwerp heen klimmen':\nHoe breed is het voorwerp minimaal?","options":["70 centimeter","75 centimeter","1,4 meter"],"answer":0,"explanation":"Bij het onderdeel 'over een drijvend voorwerp heen klimmen' is het voorwerp minimaal 70 centimeter breed. 75 centimeter is de diameter van het gat in het zeil. 1,4 meter is de minimale lengte van een voorwerp om onderdoor te zwemmen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"over drijvend voorwerp klimmen: minimaal 70 cm breed","source":{"page":34,"quote":"moet de minimale breedte van het voorwerp 70 centimeter zijn"},"rev":2},{"id":"AB-0048","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-09"],"question":"Onderdeel 'over een drijvend voorwerp heen klimmen':\nDe zwemlesaanbieder legt een surfplank in het water. De plank is 2 meter lang en 60 centimeter breed. Voldoet dit voorwerp?","options":["Nee, het voorwerp moet minimaal 70 centimeter breed zijn.","Nee, een surfplank is hiervoor niet toegestaan.","Ja, het voorwerp is langer dan 1,4 meter."],"answer":0,"explanation":"Bij dit onderdeel moet het voorwerp minimaal 70 centimeter breed zijn; 60 centimeter is te smal. Een surfplank mag wel als materiaal, maar moet breed genoeg zijn. Een lengte van meer dan 1,4 meter maakt dat niet goed. §2.3, p. 34","ref":"§2.3, p. 34","tests":"over drijvend voorwerp klimmen: minimaal 70 cm breed","source":{"page":34,"quote":"moet de minimale breedte van het voorwerp 70 centimeter zijn"},"rev":2},{"id":"AB-0050","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-10"],"question":"Proef Onder water zwemmen, Zwemdiploma C:\nAls soort wak gebruikt de zwemlesaanbieder een ronde hoepel. De hoepel heeft een diameter van 80 centimeter. Mag dit?","options":["Ja, de diameter mag maximaal 1 meter zijn.","Nee, het soort wak moet vierkant zijn.","Nee, de diameter moet minimaal 1 meter zijn."],"answer":0,"explanation":"Het soort wak mag een vierkant of rond voorwerp zijn, zoals een hoepel. De maximale afmeting is 1 bij 1 meter of een diameter van 1 meter. Een hoepel van 80 centimeter blijft daaronder; 1 meter is een maximum, geen minimum. §2.3, p. 34","ref":"§2.3, p. 34","tests":"soort wak maximaal 1 × 1 m of diameter 1 m","source":{"page":34,"quote":"Het wak heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter"},"rev":2},{"id":"AB-0051","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-11"],"question":"Onderdeel 'drijven met gebruik van een drijvend voorwerp':\nEen kandidaat gebruikt een lege petfles als voorwerp. Mag dit?","options":["Ja, materialen uit het dagelijks leven zijn toegestaan.","Nee, alleen zwembadmaterialen zoals een plankje mogen.","Nee, het voorwerp moet minimaal 70 centimeter breed zijn."],"answer":0,"explanation":"Bij blijven drijven met een drijvend voorwerp is de keuze vrij. Materialen uit het dagelijks leven, zoals een plastic tas, bal of petfles, zijn toegestaan, net als zwembadmaterialen. De breedte van 70 centimeter geldt voor het onderdeel 'over een drijvend voorwerp heen klimmen'. §2.3, p. 34-35","ref":"§2.3, p. 34-35","tests":"drijven met voorwerp: keuze vrij, ook dagelijks leven","source":{"page":35,"quote":"Materialen uit het dagelijks leven, zoals een plastic tas, bal of een petfles, zijn toegestaan"}},{"id":"AB-0052","category":"algemene_bepalingen","subtopic":"materialen","type":"stellingen","objectives":["AB-MAT-11"],"question":"Voorwerpen om mee te blijven drijven:\nWelke stelling is juist?\nStelling 1: Een plastic tas is als voorwerp toegestaan.\nStelling 2: Het voorwerp moet minimaal 1,4 meter lang zijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: materialen uit het dagelijks leven, zoals een plastic tas, zijn toegestaan. Stelling 2 is onjuist: de keuze van het voorwerp is vrij. De lengte van 1,4 meter geldt voor een voorwerp waar de kandidaat onderdoor zwemt. §2.3, p. 34-35","ref":"§2.3, p. 34-35","tests":"drijven met voorwerp: keuze vrij, ook dagelijks leven","source":{"page":35,"quote":"De keuze voor het soort voorwerp is vrij. Materialen uit het dagelijks leven, zoals een plastic tas, bal of een petfles, zijn toegestaan"},"rev":2},{"id":"AB-0053","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-01"],"question":"Een kandidaat voor Zwemdiploma B voert een onderdeel twee keer onvoldoende uit. Wat beslist de examinator?","options":["De kandidaat mag het onderdeel nog één keer uitvoeren.","Het onderdeel is na twee pogingen afgekeurd.","De kandidaat mag het onderdeel nog twee keer uitvoeren."],"answer":0,"explanation":"Bij een onvoldoende uitvoering mag de kandidaat het onderdeel opnieuw uitvoeren, tot maximaal drie keer. Na twee pogingen is er dus nog één over. Nog twee keer zou vier pogingen betekenen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maximaal aantal pogingen per onderdeel","source":{"page":35,"quote":"De kandidaat mag een onderdeel maximaal drie keer uitvoeren"},"rev":2},{"id":"AB-0054","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-02","AB-ORG-03"],"question":"Examens voor zwemcertificaten:\nWelke stelling is juist?\nStelling 1: Het examen moet tegelijk met een examen voor het Zwem-ABC plaatsvinden.\nStelling 2: De aanvraag gaat op dezelfde manier als voor het Zwem-ABC.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: het examen voor een zwemcertificaat kan tegelijk met het Zwem-ABC, maar mag ook op een ander moment worden georganiseerd. Stelling 2 is juist: de aanvraag gebeurt op dezelfde manier als voor het Zwem-ABC. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examen zwemcertificaat: tegelijk met Zwem-ABC of apart","source":{"page":35,"quote":"Het examen voor het zwemcertificaat mag echter ook op een ander moment"},"rev":2},{"id":"AB-0055","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-02","AB-ORG-03"],"question":"Een zwemlesaanbieder wil alleen examens voor Zwemcertificaat A organiseren. Dat doet hij op een aparte dag, los van het Zwem-ABC. Mag dat, en hoe gaat de aanvraag?","options":["Ja, de aanvraag gaat zoals voor het Zwem-ABC.","Ja, de aanvraag gaat via de Toetsingscommissie Maatwerk Examenprogramma's.","Nee, het examen moet tijdens het Zwem-ABC plaatsvinden."],"answer":0,"explanation":"Het examen voor een zwemcertificaat mag ook op een ander moment dan het Zwem-ABC. De aanvraag gebeurt op dezelfde manier als voor het Zwem-ABC. De Toetsingscommissie toetst maatwerk examenprogramma's, niet de aanvraag van een examen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"aanvraag examen zwemcertificaat zoals Zwem-ABC","source":{"page":35,"quote":"De aanvraag van het examen voor een zwemcertificaat gebeurt op dezelfde manier als voor het Zwem-ABC"},"rev":2},{"id":"AB-0056","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-04"],"question":"Het standaard examenprogramma bestaat uit verschillende proeven. In welke volgorde mogen de kandidaten deze proeven tonen?","options":["In een willekeurige volgorde","In de volgorde van de Examenregeling","In een volgorde die de regioadviseur goedkeurt"],"answer":0,"explanation":"De proeven van het standaard examenprogramma mogen in een willekeurige volgorde worden getoond. De volgorde van de Examenregeling is voor de proeven niet verplicht. Goedkeuring van de regioadviseur is ook niet nodig. §2.3, p. 35","ref":"§2.3, p. 35","tests":"proeven standaard examenprogramma in willekeurige volgorde","source":{"page":35,"quote":"Deze proeven mogen in een willekeurige volgorde worden getoond"},"rev":2},{"id":"AB-0057","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-04"],"question":"Standaard examenprogramma:\nWelke stelling over de volgorde is juist?\nStelling 1: De proeven mogen in een willekeurige volgorde worden getoond.\nStelling 2: De onderdelen binnen een proef mogen in een willekeurige volgorde worden uitgevoerd.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de proeven van het standaard examenprogramma mogen in een willekeurige volgorde worden getoond. Stelling 2 is onjuist: volgens Bijlage 1 worden de onderdelen van de proeven in de vastgestelde volgorde uitgevoerd. §2.3, p. 35 en Bijlage 1","ref":"§2.3, p. 35 en Bijlage 1","tests":"proeven standaard examenprogramma in willekeurige volgorde","source":{"page":35,"quote":"Deze proeven mogen in een willekeurige volgorde worden getoond"},"rev":2},{"id":"AB-0058","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-05"],"question":"Bij het diplomazwemmen voor Zwemdiploma A werkt de examinator met kleine groepjes. De groepjes voeren tegelijkertijd verschillende proeven van het standaard examenprogramma uit. Is dit toegestaan?","options":["Ja, een circuitvorm is toegestaan.","Ja, als de regioadviseur toestemming geeft.","Nee, dit mag alleen bij een maatwerk examenprogramma."],"answer":0,"explanation":"Het examenprogramma uitvoeren in een circuitvorm, met kleine groepjes die tegelijkertijd verschillende proeven uitvoeren, is toegestaan. Toestemming van de regioadviseur is daarvoor niet nodig. Het mag ook met het standaard examenprogramma, dus een maatwerk examenprogramma is niet nodig. §2.3, p. 35","ref":"§2.3, p. 35","tests":"circuitvorm toegestaan","source":{"page":35,"quote":"kleine groepjes voeren tegelijkertijd verschillende proeven van het examenprogramma uit) is toegestaan"},"rev":2},{"id":"AB-0059","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-15","AB-ORG-04"],"question":"Maatwerk examenprogramma:\nWat geldt voor de volgorde van de onderdelen?","options":["Er kan een eigen volgorde worden samengesteld.","De volgorde van het standaard examenprogramma blijft gelden.","De regioadviseur bepaalt de volgorde."],"answer":0,"explanation":"Voor het maatwerk examenprogramma kan een eigen volgorde van onderdelen in de vorm van proeven worden samengesteld. De volgorde van het standaard examenprogramma hoeft dus niet. De regioadviseur bepaalt de volgorde niet. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maatwerk: eigen volgorde onderdelen in de vorm van proeven","source":{"page":35,"quote":"Voor het maatwerk examenprogramma geldt dat een eigen volgorde van onderdelen in de vorm van proeven kan worden samengesteld"},"rev":2},{"id":"AB-0060","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-08","AB-ORG-06"],"question":"Volgorde behalen zwemdiploma's:\nWelke stelling is juist?\nStelling 1: Voor Zwemdiploma C hoeft een kandidaat geen Zwemdiploma A of B te hebben.\nStelling 2: Een kandidaat mag voor het Zwem-ABC maar één examenprogramma per dag afleggen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: voor een 'hoger' zwemdiploma is het bezit van een 'lager' diploma niet vereist, dus je mag zwemdiploma's overslaan. Stelling 2 is ook juist: een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"één examenprogramma per dag (Zwem-ABC)","source":{"page":35,"quote":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen"},"rev":2},{"id":"AB-0061","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-07"],"question":"Een kind heeft Zwemcertificaat A behaald, maar geen Zwemdiploma A. Het kind wil overstappen en wordt aangemeld voor het diplomazwemmen voor Zwemdiploma B. Mag het kind meedoen?","options":["Ja, het kind hoeft Zwemdiploma A niet te hebben.","Ja, maar het kind moet ook Zwemcertificaat B hebben.","Nee, het kind moet eerst Zwemdiploma A behalen."],"answer":0,"explanation":"Voor een hoger zwemdiploma is het bezit van een lager diploma niet vereist. Dat geldt ook bij het overstappen van een behaald zwemcertificaat naar een zwemdiploma. Zwemdiploma A of Zwemcertificaat B is dus niet nodig. §2.3, p. 35","ref":"§2.3, p. 35","tests":"overstappen certificaat → diploma: lager diploma niet vereist","source":{"page":35,"quote":"Hetzelfde geldt voor het overstappen van een behaald zwemcertificaat naar een zwemdiploma"},"rev":2},{"id":"AB-0062","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-08"],"question":"Een kandidaat haalt in het ochtendblok Zwemdiploma A. De zwemlesaanbieder wil hem in het middagblok ook het examenprogramma voor Zwemdiploma B laten afleggen. Mag dit?","options":["Nee, de kandidaat mag maar één examenprogramma per dag afleggen.","Ja, het gaat om twee aparte blokken.","Ja, als beide blokken samen maximaal 2,5 uur duren."],"answer":0,"explanation":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen. De zwemlesaanbieder mag wel meerdere blokken per dag organiseren, maar dat geeft de kandidaat geen tweede examenprogramma. De 2,5 uur gaat over de duur van een blok. §2.3, p. 35","ref":"§2.3, p. 35","tests":"één examenprogramma per dag (Zwem-ABC)","source":{"page":35,"quote":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen"},"rev":2},{"id":"AB-0063","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-09"],"question":"Wat is het uitgangspunt voor de duur van een examenprogramma voor Zwemdiploma A, B of C?","options":["Maximaal 1,5 uur","Maximaal 2,5 uur","Maximaal 1 uur"],"answer":0,"explanation":"Uitgangspunt is dat de uitvoering van een examenprogramma voor Zwemdiploma A, B of C maximaal 1,5 uur duurt. 2,5 uur is de duur die het totale blok diplomazwemmen bij voorkeur niet overschrijdt. Een maximum van 1 uur staat niet in de Examenregeling. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examenprogramma maximaal 1,5 uur","source":{"page":35,"quote":"Zwemdiploma A, B of C maximaal 1,5 uur duurt"}},{"id":"AB-0064","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-09","AB-ORG-10"],"question":"Tijden diplomazwemmen:\nWelke stelling is juist?\nStelling 1: Een examenprogramma voor Zwemdiploma A, B of C duurt als uitgangspunt maximaal 2,5 uur.\nStelling 2: Het totale blok diplomazwemmen duurt bij voorkeur niet langer dan 2,5 uur.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: een examenprogramma duurt als uitgangspunt maximaal 1,5 uur. Stelling 2 is juist: het totale blok diplomazwemmen, met één of meer groepen, duurt bij voorkeur niet langer dan 2,5 uur. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examenprogramma 1,5 uur vs blok 2,5 uur","source":{"page":35,"quote":"De duur van het totale blok diplomazwemmen dat zo ontstaat, is bij voorkeur niet langer dan 2,5 uur"},"rev":2},{"id":"AB-0065","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-10"],"question":"Een zwemlesaanbieder vraagt één blok diplomazwemmen aan voor drie groepen. Twee groepen doen Zwemdiploma A en één groep doet Zwemdiploma B. Wat geldt voor de duur van het totale blok?","options":["Het blok duurt bij voorkeur niet langer dan 2,5 uur.","Het blok duurt bij voorkeur niet langer dan 1,5 uur.","Het blok mag 4,5 uur duren: 1,5 uur per groep."],"answer":0,"explanation":"Een aanvraag kan gelden voor één of meer groepen, voor hetzelfde of een verschillend zwemdiploma. Het totale blok dat zo ontstaat, duurt bij voorkeur niet langer dan 2,5 uur. 1,5 uur is het uitgangspunt voor één examenprogramma, niet voor het hele blok. Ook met drie groepen geldt de 2,5 uur voor het hele blok, dus 4,5 uur klopt niet. §2.3, p. 35","ref":"§2.3, p. 35","tests":"totale blok diplomazwemmen bij voorkeur ≤ 2,5 uur","source":{"page":35,"quote":"De duur van het totale blok diplomazwemmen dat zo ontstaat, is bij voorkeur niet langer dan 2,5 uur"},"rev":2},{"id":"AB-0066","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-10"],"question":"Voor hoeveel groepen kan één aanvraag voor diplomazwemmen gelden?","options":["Voor 1 of meer groepen","Voor precies 1 groep","Voor 1 groep per zwemdiploma"],"answer":0,"explanation":"Een aanvraag kan gelden voor 1 of meer groepen. Die groepen kunnen het examenprogramma voor hetzelfde of voor een verschillend zwemdiploma uitvoeren. Precies 1 groep, of 1 groep per zwemdiploma, is dus niet de regel. §2.3, p. 35-36","ref":"§2.3, p. 35-36","tests":"aanvraag voor 1 of meer groepen","source":{"page":35,"quote":"Een aanvraag voor diplomazwemmen kan gelden voor 1 of meer groepen deelnemers"},"rev":2},{"id":"AB-0067","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-12"],"question":"Een zwemlesaanbieder plant een blok diplomazwemmen van 19.30 uur tot 21.30 uur. Wat moet hij doen?","options":["Hij moet vooraf overleggen met de regioadviseur.","Hij hoeft niets te regelen; het blok duurt minder dan 2,5 uur.","Hij moet vooraf toestemming vragen aan de Toetsingscommissie Maatwerk Examenprogramma's."],"answer":0,"explanation":"Het diplomazwemmen vindt plaats tussen 08.30 uur en 21.00 uur, dus dit blok heeft afwijkende tijden. Daarvoor moet vooraf worden overlegd met de regioadviseur van de Nationale Raad Zwemveiligheid. De duur van het blok verandert dat niet, en de Toetsingscommissie gaat over maatwerk examenprogramma's. §2.3, p. 36","ref":"§2.3, p. 36","tests":"tijden 08.30–21.00; afwijkend vooraf overleg regioadviseur","source":{"page":36,"quote":"Voor afwijkende tijden dient vooraf overlegd te worden met de regioadviseur"},"rev":2},{"id":"AB-0069","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-13"],"question":"Wie bepaalt hoeveel kandidaten tegelijk aan een examen deelnemen?","options":["De Examinator Nationale Zwemdiploma's","De regioadviseur van de Nationale Raad Zwemveiligheid","De Licentiehouder"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen. De regioadviseur is betrokken bij afwijkende tijden, niet bij het aantal kandidaten. De Licentiehouder bepaalt dit aantal ook niet. §2.3, p. 36","ref":"§2.3, p. 36","tests":"Examinator bepaalt aantal kandidaten tegelijk","source":{"page":36,"quote":"De Examinator Nationale Zwemdiploma’s bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen"},"rev":2},{"id":"AB-0070","category":"algemene_bepalingen","subtopic":"organisatie","type":"stellingen","objectives":["AB-ORG-14"],"question":"Verloop van het examen:\nWelke stelling is juist?\nStelling 1: De kandidaten moeten voldoende tijd en ruimte hebben voor de onderdelen.\nStelling 2: De kandidaten wachten bij voorkeur tussen de onderdelen, zodat ze kunnen rusten.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de kandidaten moeten voldoende tijd en ruimte hebben om de onderdelen uit te voeren. Stelling 2 is onjuist: het is niet wenselijk dat kandidaten lang moeten wachten, dus de onderdelen worden bij voorkeur direct na elkaar (opeenvolgend) uitgevoerd. §2.3, p. 36","ref":"§2.3, p. 36","tests":"onderdelen bij voorkeur opeenvolgend, niet lang wachten","source":{"page":36,"quote":"Het is niet wenselijk dat kandidaten geruime tijd moeten wachten en dus worden de onderdelen bij voorkeur opeenvolgend uitgevoerd"},"rev":2},{"id":"AB-0071","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-13"],"question":"Een examinator wil een grote groep kandidaten tegelijk de proef Survival laten uitvoeren. Aan welke voorwaarde moet het aantal kandidaten voldoen?","options":["Het examen verloopt overzichtelijk en de kandidaten zijn goed te beoordelen.","De regioadviseur heeft het aantal kandidaten vooraf goedgekeurd.","Het aantal kandidaten staat zo in de aanvraag."],"answer":0,"explanation":"De Examinator bepaalt zelf hoeveel kandidaten gelijktijdig deelnemen. Het examen moet wel overzichtelijk verlopen en de kandidaten moeten goed beoordeeld kunnen worden. Goedkeuring door de regioadviseur of een aantal uit de aanvraag is daarvoor niet nodig. §2.3, p. 36","ref":"§2.3, p. 36","tests":"Examinator bepaalt aantal kandidaten tegelijk","source":{"page":36,"quote":"Het examen dient echter overzichtelijk te verlopen en kandidaten moeten goed beoordeeld kunnen worden"},"rev":2},{"id":"AB-0072","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-01"],"question":"Vanuit het project NL Zwemveilig is een definitie van zwemveilig zijn ontwikkeld. Wat is zwemveilig zijn?","options":["In en om water kunnen overleven en veilig kunnen bewegen en recreëren","Je in open water met stroming zelfstandig kunnen redden","In het bezit zijn van Zwemdiploma A, B en C"],"answer":0,"explanation":"Zwemveilig zijn is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur. Open water met stroming is niveau vier, waarop de Nationale Raad Zwemveiligheid niet focust. Het zwemdiploma is een maat voor zwemveilig zijn, niet de definitie. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"definitie zwemveilig zijn","source":{"page":3,"quote":"is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur"},"rev":2},{"id":"AB-0073","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"stellingen","objectives":["AB-NIV-03","AB-NIV-02"],"question":"Welke stelling over zwemveiligheid is juist?\nStelling 1: Zwemveiligheid wordt gezien als een dynamisch begrip.\nStelling 2: Omstandigheden hebben invloed; daarom kun je niet één niveau van zwemveiligheid definiëren.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: zwemveiligheid wordt gezien als een dynamisch begrip, onder andere beïnvloed door ervaring en zelfvertrouwen. Stelling 2 is ook juist: door de invloed van omstandigheden, zoals waterdiepte en stroming, is het onmogelijk om één niveau van zwemveiligheid te definiëren. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"zwemveiligheid dynamisch; niet één niveau","source":{"page":3,"quote":"Door de invloed van omstandigheden is het onmogelijk om één niveau van zwemveiligheid te definiëren"},"rev":2},{"id":"AB-0074","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"verschil","objectives":["AB-NIV-05","AB-NIV-04"],"question":"Welke situatie hoort bij Zwemdiploma A, en welke bij Zwemdiploma B?","options":["A: zwembad zonder attracties; B: zwembad met attracties","A: zwembad met attracties; B: open water zonder stroming","A: zwembad zonder attracties; B: open water zonder stroming"],"answer":0,"explanation":"Zwemdiploma A hoort bij een zwembad zonder attracties. Zwemdiploma B hoort bij een zwembad met attracties, zoals een golfslagbassin. Open water zonder stroming of grote golfslag komt er pas bij Zwemdiploma C bij. Bijlage 1","ref":"Bijlage 1","tests":"situatie A (zonder attracties) vs B (met attracties)","source":{"page":"Bijlage 1","quote":"Een zwembad zonder attracties = Zwemdiploma A"},"rev":2},{"id":"AB-0075","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-05","AB-NIV-08"],"question":"Bij welk zwemdiploma hoort de situatie 'een zwembad met attracties en open water zonder stroming of grote golfslag'?","options":["Zwemdiploma C","Zwemdiploma B","Zwemdiploma A"],"answer":0,"explanation":"Deze situatie hoort bij Zwemdiploma C, de Nationale Norm Zwemveiligheid. Zwemdiploma B hoort alleen bij een zwembad met attracties. Zwemdiploma A hoort bij een zwembad zonder attracties. Bijlage 1","ref":"Bijlage 1","tests":"situatie C: zwembad met attracties + open water zonder stroming","source":{"page":"Bijlage 1","quote":"recreatieplassen en bredere sloten/vaarten (behalve de zee) = Zwemdiploma C/Nationale"},"rev":2},{"id":"AB-0076","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-04"],"question":"De Examenregeling noemt vier veelvoorkomende situaties waarin wordt gezwommen. Bij welke situatie hoort de zee?","options":["Situatie vier","Situatie drie","Situatie twee"],"answer":0,"explanation":"Situatie drie is een zwembad met attracties en open water zonder stroming of grote golfslag, 'behalve de zee'. De zee hoort bij situatie vier: open water/zee met mogelijkheid tot stroming en sterke golfslag. Situatie twee is een zwembad met attracties. Aanleiding, p. 3-4","ref":"Aanleiding, p. 3-4","tests":"vier situaties; zee valt niet onder situatie drie","source":{"page":4,"quote":"Open water/zee met mogelijkheid tot stroming en sterke golfslag"},"rev":2},{"id":"AB-0077","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-08","AB-NIV-05","AB-NIV-04"],"question":"Een gezin gaat zwemmen in een recreatieplas zonder stroming of grote golfslag. Bij welk niveau en welk zwemdiploma hoort deze situatie?","options":["Niveau drie, Zwemdiploma C","Niveau twee, Zwemdiploma B","Niveau vier, buiten het Zwem-ABC"],"answer":0,"explanation":"Open water zonder stroming of grote golfslag, zoals recreatieplassen, hoort bij niveau drie: Zwemdiploma C en de Nationale Norm Zwemveiligheid. Niveau twee (Zwemdiploma B) is een zwembad met attracties. Niveau vier is open water/zee met mogelijkheid tot stroming en sterke golfslag. Aanleiding, p. 3-4","ref":"Aanleiding, p. 3-4","tests":"situatie C: zwembad met attracties + open water zonder stroming","source":{"page":3,"quote":"Een zwembad met attracties en in open water zonder stroming of grote golfslag"}},{"id":"AB-0078","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"stellingen","objectives":["AB-NIV-06"],"question":"Niveau vier (open water met stroming/zee):\nWelke stelling is juist?\nStelling 1: De omstandigheden zijn zeer sp
