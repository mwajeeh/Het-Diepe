eigen visie en identiteit van de organisatie zijn wel genoemde doelen van maatwerk. §4–4.1, p. 44","ref":"§4–4.1, p. 44","tests":"doel maatwerk: ruimte voor innovatie","source":{"page":44,"quote":"De normering die wordt beschreven bij de onderdelen van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma."}},{"id":"EP-0311","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-09","EP-MAAT-12"],"question":"Welke mogelijkheid hoort NIET bij een maatwerk examenprogramma?","options":["Een proef uit het standaard examenprogramma inwisselen voor een nieuwe proef","Onderdelen uit een proef in een andere volgorde plaatsen","Een onderdeel vervangen door een nieuw onderdeel met dezelfde essentie"],"answer":2,"explanation":"Onderdelen vervangen kan niet: alle onderdelen uit het standaard examenprogramma moeten in de proeven van het maatwerk examenprogramma worden opgenomen. Een proef inwisselen voor een nieuwe proef en onderdelen in een andere volgorde plaatsen zijn wel uitdrukkelijk genoemde mogelijkheden. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: alle onderdelen opnemen","source":{"page":44,"quote":"Alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van"}},{"id":"EP-0312","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-09"],"question":"Een Licentiehouder wil in zijn maatwerk examenprogramma voor Zwemdiploma A onderdelen uit verschillende proeven op een andere manier combineren tot een nieuwe proef. Alle onderdelen blijven opgenomen. Is dat mogelijk?","options":["Ja, onderdelen op een andere manier combineren is een mogelijkheid van maatwerk.","Nee, onderdelen mogen alleen binnen hun eigen proef van volgorde wisselen.","Nee, alleen een complete proef mag worden ingewisseld voor een nieuwe proef."],"answer":0,"explanation":"Bij maatwerk mogen onderdelen op een andere manier worden gecombineerd; het aanvraagformulier vraagt zelfs of onderdelen uit verschillende proeven worden gebruikt om nieuwe proeven te maken. Van volgorde wisselen binnen een proef en een proef inwisselen zijn ook mogelijkheden, maar niet de enige. Het programma moet wel eerst worden goedgekeurd. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"maatwerk: onderdelen anders combineren","source":{"page":44,"quote":"Onderdelen op een andere manier te combineren."}},{"id":"EP-0313","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-10"],"question":"Een Licentiehouder wil voor Zwemdiploma B een maatwerkproef maken waarin kandidaten na het te water gaan van de glijbaan moeten oriënteren. Is zo'n proef binnen maatwerk mogelijk?","options":["Ja, proeven waarin het doelgerichte gebruik van vaardigheden voorop staat zijn mogelijk.","Nee, maatwerkproeven worden in hetzelfde bassin uitgevoerd als de standaard proeven.","Nee, attracties zoals een glijbaan mogen niet bij het diplomazwemmen worden gebruikt."],"answer":0,"explanation":"De Examenregeling noemt als mogelijkheid van maatwerk uitdrukkelijk proeven waarin het doelgerichte gebruik van vaardigheden voorop staat, zoals oriënteren na te water gaan van de glijbaan. Proeven mogen ook in een specifiek deel van het zwembad, zoals stroming of een golfslagbad, worden uitgevoerd. Een verbod op attracties staat er niet in. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: doelgericht gebruik vaardigheden (glijbaan, golfslagbad)","source":{"page":44,"quote":"Proeven te maken waarin het doelgerichte gebruik van vaardigheden voorop staat"}},{"id":"EP-0314","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-35","EP-MAAT-11"],"question":"Met het maatwerk examenprogramma heeft de zwemlesaanbieder de vrijheid om het diplomazwemmen te laten aansluiten op … Wat hoort op de puntjes?","options":["de eigen visie en identiteit van de organisatie","de wensen van de individuele kandidaat","het examenprogramma van de Zwemcertificaten A, B en C"],"answer":0,"explanation":"In de inleiding staat dat de zwemlesaanbieder met maatwerk het diplomazwemmen kan laten aansluiten op de eigen visie en identiteit van de organisatie. Het gaat niet om de wensen van een individuele kandidaat: alle onderdelen blijven gelijk voor iedere kandidaat. De Zwemcertificaten hebben een eigen standaard examenprogramma. Inleiding, p. 1–2","ref":"Inleiding, p. 1–2","tests":"maatwerk: aansluiten op eigen visie en identiteit","source":{"page":2,"quote":"visie en identiteit van de organisatie. Ieder ontwikkeld maatwerk examenprogramma"}},{"id":"EP-0315","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-11","EP-MAAT-12"],"question":"Welke mogelijkheid van een maatwerk examenprogramma wordt in de Examenregeling NIET genoemd?","options":["Proeven samenstellen die aansluiten bij de eigen (bedrijfs)visie op het leren zwemmen","Een examenprogramma ontwikkelen met gevarieerde organisatie- en aanbiedingsvormen","Proeven samenstellen waarin de kandidaat zelf kiest welke onderdelen hij toont"],"answer":2,"explanation":"De kandidaat kan niet kiezen welke onderdelen hij toont: alle onderdelen van het standaard examenprogramma moeten in het maatwerk examenprogramma zitten en per kandidaat worden beoordeeld. Proeven die aansluiten bij de eigen (bedrijfs)visie en gevarieerde organisatie- en aanbiedingsvormen worden wel als mogelijkheden genoemd. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: bedrijfsvisie en gevarieerde aanbiedingsvormen","source":{"page":44,"quote":"Alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van het maatwerk examenprogramma."}},{"id":"EP-0316","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-12"],"question":"Een Licentiehouder ontwikkelt een maatwerk examenprogramma voor Zwemdiploma C. Hij wil het onderdeel 30 seconden watertrappen met de benen weglaten, omdat er al ander watertrappen in het programma zit. Wat geldt?","options":["Dat mag niet; alle onderdelen van het standaard examenprogramma moeten in de proeven zitten.","Dat mag, als de essentie van het onderdeel in een andere proef zichtbaar blijft.","Dat mag, als er een extra eis aan een ander watertrap-onderdeel wordt toegevoegd."],"answer":0,"explanation":"Een voorwaarde voor maatwerk is dat alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van het maatwerk examenprogramma. Dat de essentie zichtbaar moet zijn en dat extra eisen aan de normering mogen, maakt het weglaten van een onderdeel niet toegestaan. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: alle onderdelen opnemen","source":{"page":44,"quote":"worden opgenomen in de proeven van het maatwerk examenprogramma"}},{"id":"EP-0317","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-13"],"question":"In een maatwerk examenprogramma voor Zwemdiploma B wil een Licentiehouder toestaan dat kandidaten tijdens het 6 meter onder water zwemmen één keer kort bovenkomen om adem te halen. Mag dat?","options":["Nee, de normering van het standaard examenprogramma geldt ook voor maatwerk.","Ja, bij maatwerk mag de normering worden aangepast aan de nieuwe proef.","Ja, zolang de afstand van 6 meter in totaal wordt overbrugd."],"answer":0,"explanation":"De normering bij de onderdelen van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma; daarin staat dat de kandidaat tijdens het onder water zwemmen geheel onder water blijft. Maatwerk mag de normering niet versoepelen, alleen extra eisen toevoegen. Alleen de afstand overbruggen is dus niet genoeg. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: normering standaard blijft gelden","source":{"page":44,"quote":"De normering die wordt beschreven bij de onderdelen van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma."}},{"id":"EP-0318","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-14"],"question":"Een Licentiehouder wil in zijn maatwerk examenprogramma voor Zwemdiploma C bij het onderdeel 15 meter borstcrawl als extra eis stellen dat de ademhaling zijwaarts wordt uitgevoerd. Mag dat?","options":["Ja, extra eisen aan de normering van bepaalde onderdelen toevoegen is toegestaan.","Nee, de normering van het standaard examenprogramma moet ongewijzigd blijven.","Alleen als de Examinator Nationale Zwemdiploma's daar per kandidaat mee instemt."],"answer":0,"explanation":"Bij maatwerk geldt de normering van het standaard examenprogramma, maar het is uitdrukkelijk toegestaan om extra eisen aan de normering van bepaalde onderdelen toe te voegen. Ongewijzigd laten is dus niet verplicht; alleen versoepelen mag niet. Instemming per kandidaat door de Examinator is geen voorwaarde: het programma wordt vooraf door de Toetsingscommissie getoetst. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: extra eisen aan normering toegestaan","source":{"page":44,"quote":"Het is toegestaan om extra eisen aan de normering van bepaalde onderdelen toe te voegen."}},{"id":"EP-0319","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-16","EP-MAAT-15","EP-MAAT-17"],"question":"Welke bewering over de voorwaarden voor een maatwerk examenprogramma is NIET juist?","options":["De essentie van elk onderdeel moet in de proeven zichtbaar zijn.","De organisatie moet het mogelijk maken de kandidaten individueel te beoordelen.","Een onderdeel mag in ondieper water dan voorgeschreven, als de essentie zichtbaar blijft."],"answer":2,"explanation":"De onderdelen van een maatwerk examenprogramma worden minimaal uitgevoerd in de waterdiepte die staat voorgeschreven; daarvan mag niet worden afgeweken. Dat de essentie zichtbaar moet zijn en dat kandidaten individueel beoordeeld moeten kunnen worden, zijn wel voorwaarden. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"maatwerk: minimaal voorgeschreven waterdiepte","source":{"page":44,"quote":"De onderdelen van het maatwerk examenprogramma worden minimaal uitgevoerd in de"}},{"id":"EP-0320","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-15"],"question":"Waaraan moet worden voldaan bij het toepassen van de afzonderlijke onderdelen in proeven voor een maatwerk examenprogramma?","options":["De essentie van het onderdeel moet zichtbaar zijn.","Het onderdeel moet in dezelfde proef blijven als in het standaard examenprogramma.","Het onderdeel moet in een bassin van minimaal 160 m2 worden uitgevoerd."],"answer":0,"explanation":"Bij het toepassen van de afzonderlijke onderdelen in maatwerkproeven moet de essentie van het onderdeel zichtbaar zijn. Een onderdeel hoeft niet in dezelfde proef te blijven, want onderdelen mogen anders worden gecombineerd. De eis van minimaal 160 m2 geldt alleen voor conditiezwemmen en gekleed zwemmen. §4.1, p. 44","ref":"§4.1, p. 44","tests":"maatwerk: essentie onderdeel zichtbaar","source":{"page":44,"quote":"moet de essentie van het onderdeel zichtbaar zijn"}},{"id":"EP-0321","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-16","EP-MAAT-33"],"question":"In een maatwerkproef voor Zwemdiploma A laat een Licentiehouder het voetwaarts richting de bodem zakken uitvoeren in water van 1,4 meter diep, waar de kandidaten net niet kunnen staan. Is dat toegestaan?","options":["Nee, dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter.","Ja, dit onderdeel vraagt alleen dieper water, tenminste waar de kandidaat niet kan staan.","Ja, bij maatwerk mag de waterdiepte afwijken als de Toetsingscommissie akkoord is."],"answer":0,"explanation":"Voetwaarts richting de bodem zakken wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter, en bij maatwerk worden de onderdelen minimaal in de voorgeschreven waterdiepte uitgevoerd. 'Dieper water, tenminste waar de kandidaat niet kan staan' geldt onder meer voor de drijfonderdelen, niet voor dit onderdeel. Een geringere waterdiepte is geen mogelijkheid van maatwerk. §4.1 en 4.2.2, p. 44 en 52","ref":"§4.1 en 4.2.2, p. 44 en 52","tests":"diepte voetwaarts richting de bodem zakken: minimaal 1,8 m","source":{"page":52,"quote":"De kandidaat gaat geheel onder water. Het onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"EP-0322","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-33"],"question":"Wat is volgens hoofdstuk 4 het verschil in voorgeschreven waterdiepte tussen 'hoofdwaarts richting de bodem gaan' en '15 seconden drijven op de rug'?","options":["Hoofdwaarts: minimaal 1,8 meter; drijven op de rug: dieper water, tenminste waar de kandidaat niet kan staan.","Hoofdwaarts: dieper water, tenminste waar de kandidaat niet kan staan; drijven op de rug: minimaal 1,8 meter.","Er is geen verschil; beide worden uitgevoerd in een waterdiepte van minimaal 1,8 meter."],"answer":0,"explanation":"Hoofdwaarts richting de bodem gaan wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter; de kandidaat moet daarbij helemaal onder water komen. Drijven op de rug wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. De omgekeerde combinatie klopt dus niet, en de diepte is ook niet voor beide gelijk. §4.2.2–4.2.3, p. 53–54","ref":"§4.2.2–4.2.3, p. 53–54","tests":"diepte hoofdwaarts (1,8 m) vs drijven op de rug (niet kunnen staan)","source":{"page":53,"quote":"De benen komen geheel onder water. Het onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"EP-0323","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-33"],"question":"Welke bewering over de voorgeschreven waterdiepte volgens hoofdstuk 4 is NIET juist?","options":["5 meter voortbewegen op de rug met gebruik van de armen: dieper water, tenminste waar de kandidaat niet kan staan.","Voetwaarts richting de bodem zakken: een waterdiepte van minimaal 1,8 meter.","5 seconden drijven op de buik: een waterdiepte van minimaal 1,8 meter."],"answer":2,"explanation":"Drijven op de buik wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan; een diepte van 1,8 meter is daarvoor niet voorgeschreven. Voor voortbewegen op de rug met gebruik van de armen geldt ook 'waar de kandidaat niet kan staan', en voetwaarts richting de bodem zakken vraagt wel minimaal 1,8 meter. §4.2.2–4.2.3, p. 52–55","ref":"§4.2.2–4.2.3, p. 52–55","tests":"diepte drijven op de buik: waar de kandidaat niet kan staan","source":{"page":54,"quote":"mag uit het water worden getild voor ademhaling. Het onderdeel wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"EP-0324","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-17"],"question":"Een Licentiehouder ontwerpt een maatwerkproef waarin twaalf kandidaten tegelijk door elkaar in het golfslagbad drijven. Daardoor is niet vast te stellen wat elke kandidaat afzonderlijk laat zien. Voldoet deze proef aan de voorwaarden?","options":["Nee, de organisatie moet het mogelijk maken de kandidaten individueel te beoordelen.","Ja, drijven in een golfslagbad is een uitdrukkelijk genoemde mogelijkheid van maatwerk.","Ja, als de groep als geheel de essentie van het onderdeel laat zien."],"answer":0,"explanation":"Een voorwaarde voor maatwerk is dat de organisatie van het programma het mogelijk maakt om de kandidaten individueel te beoordelen. Drijven in een golfslagbad mag wel als proef, maar alleen als elke kandidaat beoordeeld kan worden. De essentie moet per kandidaat zichtbaar zijn, niet voor de groep als geheel. §4.1, p. 45","ref":"§4.1, p. 45","tests":"maatwerk: kandidaten individueel beoordelen","source":{"page":45,"quote":"De organisatie van het maatwerk examenprogramma maakt het mogelijk om de kandidaten individueel te beoordelen."}},{"id":"EP-0325","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-18"],"question":"Er zijn al maatwerkproeven ontwikkeld en goedgekeurd. Waarvoor zijn deze proeven volgens de Examenregeling bedoeld?","options":["Als voorbeeld en inspiratie om zelf proeven of examenprogramma's te ontwikkelen","Als verplichte basis voor elk nieuw maatwerk examenprogramma","Als vervanging van de proeven in het standaard examenprogramma"],"answer":0,"explanation":"De al goedgekeurde maatwerkproeven zijn bedoeld als voorbeeld en inspiratie om zelf proeven of examenprogramma's te ontwikkelen; ze staan op www.nrz-nl.nl (button 'Mijn NRZ'). Ze zijn geen verplichte basis. Ze vervangen het standaard examenprogramma ook niet: dat blijft gewoon bestaan. §4.1, p. 45","ref":"§4.1, p. 45","tests":"goedgekeurde maatwerkproeven als voorbeeld en inspiratie","source":{"page":45,"quote":"voorbeeld en inspiratie om zelf proeven of examenprogramma’s te ontwikkelen"}},{"id":"EP-0326","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-19"],"question":"Wie doet de aanvraag van een maatwerk examenprogramma, en hoe?","options":["De Licentiehouder, via het aanvraagformulier Maatwerk Examenprogramma","De Examinator Nationale Zwemdiploma's, na afloop van het diplomazwemmen","De Toetsingscommissie, na een bezoek aan het diplomazwemmen van de Licentiehouder"],"answer":0,"explanation":"De Licentiehouder vraagt een maatwerk examenprogramma aan via het aanvraagformulier Maatwerk Examenprogramma, te downloaden en in te sturen via www.nrz-nl.nl. De Examinator beoordeelt kandidaten maar dient geen aanvraag in, en het programma moet juist vóór het diplomazwemmen zijn goedgekeurd. De Toetsingscommissie vraagt niet aan, maar toetst de aanvraag. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraag door Licentiehouder via aanvraagformulier","source":{"page":45,"quote":"De Licentiehouder doet de aanvraag van een maatwerk examenprogramma via het aanvraagformulier Maatwerk Examenprogramma"}},{"id":"EP-0327","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-20","EP-MAAT-12"],"question":"Welke informatie wordt NIET genoemd als inhoud van het aanvraagformulier Maatwerk Examenprogramma?","options":["Voor welk examenprogramma goedkeuring wordt aangevraagd","Of een proef uit het standaard examenprogramma wordt vervangen, en zo ja welke","Welke onderdelen uit het standaard examenprogramma worden weggelaten"],"answer":2,"explanation":"Het formulier vraagt niet welke onderdelen worden weggelaten, want alle onderdelen van het standaard examenprogramma moeten in het maatwerk examenprogramma worden opgenomen. Wel staat erop voor welk examenprogramma goedkeuring wordt aangevraagd en of (en welke) proef uit het standaard examenprogramma wordt vervangen. §4.1, p. 44–45","ref":"§4.1, p. 44–45","tests":"inhoud aanvraagformulier Maatwerk Examenprogramma","source":{"page":44,"quote":"Alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van het maatwerk examenprogramma."}},{"id":"EP-0328","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-21"],"question":"Welke bewering over het aanvraagformulier Maatwerk Examenprogramma is NIET juist?","options":["Het beschrijft hoe alle proeven stapsgewijs worden uitgevoerd.","Het beschrijft hoe de proef per kandidaat goed kan worden beoordeeld.","Een tekening van het zwembad of filmbeelden zijn bij elke proef verplicht."],"answer":2,"explanation":"Een tekening van het zwembad of beeldmateriaal (foto's of film) mag 'eventueel' worden toegevoegd; verplicht is het niet. Het formulier beschrijft wel hoe alle proeven stapsgewijs worden uitgevoerd en hoe de proef per kandidaat goed kan worden beoordeeld door de Examinator Nationale Zwemdiploma's en medebeoordelaars. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraagformulier: tekening of beeldmateriaal eventueel","source":{"page":45,"quote":"eventueel een tekening van het zwembad of beeldmateriaal"}},{"id":"EP-0329","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-21","EP-MAAT-15"],"question":"Wat onderbouwt de Licentiehouder op het aanvraagformulier, indien nodig, bij de beschrijving van de stapsgewijze uitvoering van de proeven?","options":["Hoe rekening wordt gehouden met de normering en de essenties van de onderdelen","Hoeveel kandidaten per jaar met het programma gaan diplomazwemmen","Welke Examinator Nationale Zwemdiploma's de proeven heeft ontworpen"],"answer":0,"explanation":"Bij de stapsgewijze uitvoering van de proeven onderbouwt de aanvrager, indien nodig, hoe rekening wordt gehouden met de normering en de essenties van de verschillende onderdelen. Het aantal kandidaten en wie de proeven heeft ontworpen, worden niet als inhoud van het formulier genoemd. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraagformulier: onderbouwing normering en essenties","source":{"page":45,"quote":"wordt rekening gehouden met de normering en de essenties van de verschillende"}},{"id":"EP-0330","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-22"],"question":"De Toetsingscommissie Maatwerk Examenprogramma's heeft goedkeuring van het maatwerk examenprogramma van een Licentiehouder geweigerd. Wat kan de Licentiehouder doen?","options":["Een aangepast verzoek bij de Toetsingscommissie indienen of schriftelijk beroep indienen bij de Commissie van Beroep","Alleen schriftelijk beroep indienen; een aangepast verzoek bij de Toetsingscommissie is niet meer mogelijk","Alleen een aangepast verzoek indienen; tegen een weigering van de Toetsingscommissie is geen beroep mogelijk"],"answer":0,"explanation":"Na een weigering heeft de Licentiehouder twee mogelijkheden: een aangepast verzoek bij de Toetsingscommissie indienen of schriftelijk beroep indienen bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid. De twee andere opties sluiten elk één van die mogelijkheden ten onrechte uit. §4.1, p. 45","ref":"§4.1, p. 45","tests":"weigering: aangepast verzoek of schriftelijk beroep","source":{"page":45,"quote":"kan de Licentiehouder een aangepast verzoek bij de Toetsingscommissie Maatwerk Examenprogramma’s indienen of schriftelijk beroep indienen bij de Commissie van Beroep"}},{"id":"EP-0331","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-22"],"question":"Welke bewering over beroep tegen een geweigerd maatwerk examenprogramma is NIET juist?","options":["De Nationale Raad Zwemveiligheid heeft een Reglement van Beroep.","Het Reglement van Beroep is te vinden op www.nrz-nl.nl (button 'Mijn NRZ').","Het beroep wordt mondeling ingediend bij de Toetsingscommissie zelf."],"answer":2,"explanation":"Beroep wordt schriftelijk ingediend bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid, niet mondeling bij de Toetsingscommissie. Bij de Toetsingscommissie kan de Licentiehouder wel een aangepast verzoek indienen. Dat er een Reglement van Beroep is en dat dit op www.nrz-nl.nl staat, klopt. §4.1, p. 45","ref":"§4.1, p. 45","tests":"beroep schriftelijk bij Commissie van Beroep","source":{"page":45,"quote":"schriftelijk beroep indienen bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid"}},{"id":"EP-0332","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-23"],"question":"Wat is het verschil tussen standaard en maatwerk wat betreft de oriëntatieopdracht onder water direct na de sprong (A) of duik (B, C)?","options":["Standaard: door het gat in het zeil; maatwerk: mag een andere opdracht zijn, minimaal 75 centimeter onder water.","Standaard: door het gat in het zeil; maatwerk: mag een andere opdracht zijn, minimaal 1,8 meter onder water.","Standaard: door het gat in het zeil; maatwerk: mag ook een opdracht boven water zijn, direct na het bovenkomen."],"answer":0,"explanation":"In het standaard examenprogramma is de oriëntatieopdracht na de sprong of duik het zwemmen door het gat in een verticaal hangend zeil. In maatwerk mag het een andere oriëntatieopdracht onder water zijn, mits die minimaal 75 centimeter onder het wateroppervlak wordt uitgevoerd. 1,8 meter is de minimale waterdiepte voor de sprong of duik zelf, en een opdracht boven water past niet bij 'dieper onder water'. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"maatwerk: andere oriëntatieopdracht onder water, minimaal 75 cm","source":{"page":48,"quote":"In het maatwerk examenprogramma mag dat ook een andere oriëntatieopdracht onder water zijn. Het is wel belangrijk dat die opdracht dieper onder water (minimaal 75 centimeter onder het wateroppervlak) wordt uitgevoerd."}},{"id":"EP-0333","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-23"],"question":"In een maatwerk examenprogramma voor Zwemdiploma B moeten kandidaten na de duik een ring pakken die op 50 centimeter onder het wateroppervlak hangt, in plaats van door het zeil te zwemmen. Voldoet dit?","options":["Nee, de oriëntatieopdracht wordt minimaal 75 centimeter onder het wateroppervlak uitgevoerd.","Ja, bij maatwerk is de opdracht vrij zolang de duik in minimaal 1,8 meter water gebeurt.","Nee, na de duik is in elk examenprogramma het zwemmen door het zeil verplicht."],"answer":0,"explanation":"In maatwerk mag de opdracht na de duik een andere oriëntatieopdracht onder water zijn dan het zeil, maar de kandidaat voert die minimaal 75 centimeter onder het wateroppervlak uit. Een ring op 50 centimeter voldoet daar niet aan. De diepte van de duik alleen is niet genoeg, en het zeil is bij maatwerk juist niet verplicht. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"maatwerk: andere oriëntatieopdracht onder water, minimaal 75 cm","source":{"page":49,"quote":"De kandidaat voert die opdracht minimaal 75 centimeter onder het wateroppervlak uit."}},{"id":"EP-0334","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-29"],"question":"In een maatwerkproef voor Zwemdiploma C gaat de kandidaat gekleed met een rol voorover te water en zwemt daarna meteen gekleed naar de overkant, zonder eerst te watertrappen. Voldoet deze opzet?","options":["Nee, de rol voorover wordt direct gevolgd door oriënteren in de vorm van watertrappen.","Ja, na de rol voorover volgt direct een vervolgopdracht, en dat gebeurt hier.","Ja, de plaats waar de kandidaat in het water terechtkomt is niet van belang."],"answer":0,"explanation":"Als aanvullende voorwaarde wordt de rol voorover direct gevolgd door oriënteren in de vorm van watertrappen en pas daarna een vervolgopdracht. Direct wegzwemmen slaat het watertrappen over. Dat de plaats waar de kandidaat in het water terechtkomt niet van belang is, klopt wel, maar zegt niets over wat erna moet volgen. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"desoriëntatie-onderdelen: eerst watertrappen, dan vervolgopdracht","source":{"page":48,"quote":"De rol voorover wordt direct gevolgd door oriënteren in de vorm van watertrappen"}},{"id":"EP-0335","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-29","EP-MAAT-23"],"question":"Wat is het verschil in aanvullende voorwaarde tussen de voetsprong voorwaarts gekleed (A.1) en het te water gaan met een sprong (A.2)?","options":["Na A.1 volgen watertrappen en een vervolgopdracht; na A.2 direct een oriëntatieopdracht onder water.","Na A.1 volgt direct een oriëntatieopdracht onder water; na A.2 watertrappen en een vervolgopdracht.","Na beide volgt eerst watertrappen; alleen na A.2 volgt daarna nog een opdracht onder water."],"answer":0,"explanation":"De voetsprong voorwaarts gekleed wordt direct gevolgd door oriënteren in de vorm van watertrappen en daarna een vervolgopdracht. De sprong van A.2 wordt direct gevolgd door een oriëntatieopdracht onder water, uitgevoerd op minimaal 75 centimeter onder het wateroppervlak. De andere twee opties draaien dit om of voegen watertrappen toe waar dat niet hoort. §4.2.1, p. 47–49","ref":"§4.2.1, p. 47–49","tests":"aanvullende voorwaarde A.1 (watertrappen) vs A.2 (opdracht onder water)","source":{"page":49,"quote":"De sprong wordt direct gevolgd door een oriëntatieopdracht onder water."}},{"id":"EP-0336","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-30"],"question":"Welke aanvullende voorwaarde geldt voor het onderdeel 15 seconden gekleed watertrappen?","options":["Na het watertrappen volgt een actie in een vooraf afgesproken richting.","Na het watertrappen volgt een oriëntatieopdracht onder water.","Tijdens het watertrappen worden de vingers boven water getoond."],"answer":0,"explanation":"Na het gekleed watertrappen volgt als aanvullende voorwaarde een actie in een vooraf afgesproken richting. Een oriëntatieopdracht onder water hoort bij de sprong of duik. Vingers boven water tonen is juist de werkwijze van 'vroeger'; nu bewegen de armen/handen onder water mee ter ondersteuning. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"gekleed watertrappen: actie in vooraf afgesproken richting","source":{"page":57,"quote":"Na het watertrappen volgt een actie in een vooraf afgesproken richting."}},{"id":"EP-0337","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-31"],"question":"In een maatwerkproef voor Zwemdiploma B gaat een kandidaat pas een halve meter voor het verticaal hangende zeil onder water en zwemt dan door het gat. Voldoet dit aan de aanvullende voorwaarde?","options":["Nee, de kandidaat moet minimaal 1 meter voor het zeil onder water gaan.","Ja, de manier waarop de kandidaat zich onder water verplaatst is vrij.","Nee, de kandidaat moet minimaal 3 meter voor het zeil onder water gaan."],"answer":0,"explanation":"Bij onder water zwemmen door een gat in een verticaal hangend zeil (A.3, B.3, C.4) geldt de aanvullende voorwaarde dat de kandidaat minimaal 1 meter voor het zeil onder water gaat. De manier van verplaatsen is wel vrij, maar dat heft deze voorwaarde niet op. 3 meter is bij Zwemdiploma A de afstand van het zeil tot de startkant, geen eis voor het onder water gaan. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"zeil: minimaal 1 meter ervoor onder water gaan","source":{"page":50,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."}},{"id":"EP-0338","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-25","EP-MAAT-24"],"question":"Een Licentiehouder toetst in zijn maatwerk examenprogramma voor Zwemdiploma A de techniek (25 meter enkelvoudige rugslag en 25 meter schoolslag) en de conditie in aparte proeven. Hoe lang is de aparte conditieproef?","options":["100 meter","50 meter","150 meter"],"answer":0,"explanation":"Als techniek en conditie apart worden getoetst, blijft de afstand van het conditiezwemmen voor ieder zwemdiploma gelijk: voor Zwemdiploma A dus 100 meter. De techniek-meters gaan er niet vanaf, waardoor er in totaal 50 meter meer wordt gezwommen. 150 meter is de afstand voor Zwemdiploma B en C. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk techniek en conditie apart: conditie-afstand blijft gelijk","source":{"page":62,"quote":"De afstand van het onderdeel conditiezwemmen blijft voor"}},{"id":"EP-0339","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-25"],"question":"Hoeveel meter wordt er in totaal meer gezwommen in een maatwerk examenprogramma waarin techniek en conditie in twee aparte proeven worden getoetst?","options":["50 meter","25 meter","Geen; de totale afstand blijft gelijk"],"answer":0,"explanation":"Omdat 25 meter enkelvoudige rugslag en 25 meter schoolslag techniek apart worden getoetst en de afstand van het conditiezwemmen gelijk blijft, wordt er in totaal 50 meter meer gezwommen. 25 meter is maar één van de twee techniekonderdelen. Alleen de conditie-afstand blijft gelijk, de totale afstand niet. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"maatwerk techniek en conditie apart: in totaal 50 m meer","source":{"page":63,"quote":"In totaal worden er in zo’n maatwerk examenprogramma meer meters (50 meter) gezwommen."}},{"id":"EP-0340","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-24"],"question":"Wat is een verschil tussen het conditiezwemmen in het standaard en in een maatwerk examenprogramma?","options":["Standaard: techniek en volhouden in één proef; maatwerk: die mogen in twee aparte proeven.","Maatwerk: de conditie-afstand is korter, omdat de techniek in een aparte proef zit.","Standaard: zwemslag vrij te kiezen; maatwerk: vaste volgorde van zwemslagen."],"answer":0,"explanation":"In het standaard examenprogramma zijn het uitvoeren van de techniek en het volhouden van de afstand opgenomen in één proef; bij maatwerk mogen techniek en conditie in twee proeven. De conditie-afstand blijft daarbij gelijk. De derde optie is omgekeerd: juist bij maatwerk mag worden afgeweken van de verplichte volgorde en zwemslag. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen: standaard één proef vs maatwerk twee proeven","source":{"page":62,"quote":"In het standaard examenprogramma is het uitvoeren van de techniek en het volhouden van de afstand opgenomen in één proef, het conditiezwemmen."}},{"id":"EP-0341","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-26"],"question":"Een Licentiehouder wil kandidaten voor Zwemdiploma B in zijn maatwerk examenprogramma een bepaalde tijd aaneengesloten laten zwemmen in plaats van een vaste afstand. Wat geldt?","options":["Dat mag, als de geschatte afstand in die tijd globaal overeenkomt met 150 meter.","Dat mag niet; bij conditiezwemmen wordt altijd een vaste afstand gezwommen.","Dat mag, als de geschatte afstand in die tijd globaal overeenkomt met 100 meter."],"answer":0,"explanation":"Bij maatwerk mogen kandidaten een bepaalde tijd aaneengesloten zwemmen, mits de geschatte afstand in die tijd globaal overeenkomt met de afstand van het conditiezwemmen. Voor Zwemdiploma B is dat 150 meter; 100 meter hoort bij Zwemdiploma A. Werken met een tijdseenheid is dus wel toegestaan. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"maatwerk conditiezwemmen: tijdseenheid in plaats van afstand","source":{"page":63,"quote":"Het is ook mogelijk om kandidaten een bepaalde tijd aaneengesloten te laten zwemmen."}},{"id":"EP-0342","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-27","EP-MAAT-28"],"question":"Tijdens het conditiezwemmen in een goedgekeurd maatwerk examenprogramma voor Zwemdiploma C wisselt een kandidaat steeds tussen borstcrawl, rugcrawl en schoolslag. De slagen zijn technisch matig, de voortstuwing is redelijk. Wat beslist de examinator?","options":["Voldoende; de uitvoering van de zwemslagen wordt hier niet beoordeeld.","Onvoldoende; bij Zwemdiploma C moet 75 meter in één slag worden gezwommen.","Onvoldoende; borstcrawl en rugcrawl zijn bij conditiezwemmen niet toegestaan."],"answer":0,"explanation":"Bij het maatwerk-conditiezwemmen mag de kandidaat schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl gebruiken en tussentijds wisselen. De uitvoering van de zwemslagen telt niet mee, zolang er een redelijke voortstuwing is. 75 meter in één slag is de regel van het standaard examenprogramma voor Zwemdiploma C, die bij maatwerk niet verplicht is. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"maatwerk conditiezwemmen: slagen vrij, uitvoering niet beoordeeld","source":{"page":63,"quote":"De uitvoering van die zwemslagen wordt niet meegenomen in de beoordeling."}},{"id":"EP-0343","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-24","EP-MAAT-27"],"question":"Welke bewering over het conditiezwemmen in een maatwerk examenprogramma is NIET juist?","options":["De kandidaat mag tussentijds wisselen van zwemslag.","Er moet sprake zijn van een redelijke voortstuwing.","Enkelvoudige rugslag en schoolslag wisselen verplicht elke 25 meter."],"answer":2,"explanation":"Bij maatwerk mag worden afgeweken van de verplichting in volgorde en uit te voeren zwemslag; de afwisseling om de 25 meter hoort bij het standaard examenprogramma voor Zwemdiploma A en B. Tussentijds wisselen van zwemslag mag, en een redelijke voortstuwing is wel vereist. §4.2.6, p. 62–63","ref":"§4.2.6, p. 62–63","tests":"maatwerk conditiezwemmen: geen verplichte volgorde of zwemslag","source":{"page":62,"quote":"Voor het maatwerk mag van de verplichting in volgorde en uit te voeren zwemslag worden"}},{"id":"EP-0344","category":"examenprogrammas","subtopic":"maatwerk","type":"verschil","objectives":["EP-MAAT-28"],"question":"Voor welk onderdeel beschrijft hoofdstuk 4 voor een maatwerk examenprogramma een andere normering dan voor het standaard examenprogramma?","options":["Conditiezwemmen","Gekleed zwemmen","25 meter schoolslag techniek"],"answer":0,"explanation":"Alleen voor het onderdeel conditiezwemmen geldt bij maatwerk een andere normering: zwemslagen naar keuze, wisselen toegestaan en werken met een tijdseenheid toegestaan. Voor gekleed zwemmen en de schoolslag techniek geldt de normering van het standaard examenprogramma, eventueel met extra eisen. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"andere normering conditiezwemmen bij maatwerk","source":{"page":63,"quote":"Voor het onderdeel conditiezwemmen geldt daarom voor een maatwerk examenprogramma een andere normering dan voor het standaard examenprogramma."}},{"id":"EP-0345","category":"examenprogrammas","subtopic":"maatwerk","type":"casus","objectives":["EP-MAAT-32"],"question":"Een Licentiehouder wil het gekleed zwemmen in zijn maatwerk examenprogramma laten uitvoeren in een bassin met een wateroppervlak van 100 m2. Is dat toegestaan?","options":["Nee, gekleed zwemmen wordt uitgevoerd in een bassin van minimaal 160 m2.","Ja, de minimale bassingrootte geldt alleen voor het conditiezwemmen.","Ja, bij maatwerk mag het bassin kleiner zijn als de afstand gelijk blijft."],"answer":0,"explanation":"Gekleed zwemmen (A.17, B.18, C.20) wordt net als het conditiezwemmen uitgevoerd in een bassin met een oppervlak van minimaal 160 m2. De eis geldt dus niet alleen voor conditiezwemmen. De normering van het standaard examenprogramma, waar deze eis bij hoort, geldt ook bij maatwerk. §4.2.6, p. 64","ref":"§4.2.6, p. 64","tests":"gekleed zwemmen en conditiezwemmen: bassin minimaal 160 m2","source":{"page":64,"quote":"Het onderdeel wordt uitgevoerd in een bassin met een oppervlak van minimaal 160 m2."}},{"id":"EP-0346","category":"examenprogrammas","subtopic":"maatwerk","type":"kennis","objectives":["EP-MAAT-32"],"question":"Waarom worden de onderdelen die horen bij het volhouden van een afstand (conditiezwemmen) uitgevoerd in een bassin van minimaal 160 m2?","options":["Omdat er in een zwembad en in open water sprake is van een groot wateroppervlak en veel ruimte","Omdat er dan voldoende diep water is, tenminste waar de kandidaat niet kan staan","Omdat de examinator dan meerdere kandidaten tegelijk individueel kan beoordelen"],"answer":0,"explanation":"Hoofdstuk 4 legt uit dat er in zowel een zwembad als open water sprake is van een groot wateroppervlak en veel ruimte; daarom gebeurt het conditiezwemmen in een bassin van minimaal 160 m2. Het oppervlak zegt niets over de waterdiepte. Individueel beoordelen is een voorwaarde voor de organisatie van maatwerk, niet de reden voor deze bassingrootte. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"reden bassin minimaal 160 m2","source":{"page":62,"quote":"groot wateroppervlak en veel ruimte, daarom worden alle onderdelen die horen bij het"}},{"id":"EP-0347","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-31","EP-MAAT-30","EP-MAAT-29"],"question":"Welke bewering over de aanvullende voorwaarden in hoofdstuk 4 is NIET juist?","options":["Bij onder water zwemmen door het zeil gaat de kandidaat minimaal 1 meter voor het zeil onder water.","Na 15 seconden gekleed watertrappen volgt een actie in een vooraf afgesproken richting.","Na drijven op de rug volgt als aanvullende voorwaarde een halve draai om de lengteas."],"answer":2,"explanation":"Bij drijven op de rug wordt geen aanvullende voorwaarde genoemd; een halve draai om de lengteas is een apart onderdeel. Minimaal 1 meter voor het zeil onder water gaan en na gekleed watertrappen een actie in een vooraf afgesproken richting zijn wel aanvullende voorwaarden. §4.2, p. 46–57","ref":"§4.2, p. 46–57","tests":"aanvullende voorwaarden: bij welke onderdelen","source":{"page":46,"quote":"Daarnaast worden bij sommige onderdelen ook nog aanvullende voorwaarden benoemd"}},{"id":"EP-0348","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-19","EP-MAAT-05","EP-MAAT-22"],"question":"Welke bewering over het aanvragen van een maatwerk examenprogramma is NIET juist?","options":["Het programma wordt vooraf ter goedkeuring voorgelegd aan de Nationale Raad Zwemveiligheid.","Het aanvraagformulier is te downloaden en in te sturen via www.nrz-nl.nl.","De aanvraag wordt ingediend bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid."],"answer":2,"explanation":"De Commissie van Beroep behandelt alleen schriftelijk beroep na een weigering; de aanvraag zelf wordt beoordeeld door de Toetsingscommissie Maatwerk Examenprogramma's. Dat het programma vooraf ter goedkeuring wordt voorgelegd aan de Nationale Raad Zwemveiligheid en dat het formulier via www.nrz-nl.nl wordt gedownload en ingestuurd, klopt. §4.1, p. 45","ref":"§4.1, p. 45","tests":"aanvraag beoordeeld door Toetsingscommissie, niet Commissie van Beroep","source":{"page":45,"quote":"De Toetsingscommissie Maatwerk Examenprogramma’s kijkt of het programma voldoet aan de gestelde voorwaarden."}},{"id":"EP-0349","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-02","EP-MAAT-08"],"question":"Welke bewering over maatwerk examenprogramma's is NIET juist?","options":["De mogelijkheid om zelf maatwerk examenprogramma's te ontwikkelen is nieuw.","Ieder maatwerk examenprogramma wordt eerst getoetst door de Toetsingscommissie.","Een maatwerk examenprogramma bevat andere onderdelen dan het standaard examenprogramma."],"answer":2,"explanation":"De inhoud (onderdelen) van een maatwerk examenprogramma is gelijk aan die van het standaard examenprogramma; alleen de proeven mogen anders. Dat de mogelijkheid tot maatwerk nieuw is en dat ieder maatwerk examenprogramma eerst door de Toetsingscommissie Maatwerk Examenprogramma's wordt getoetst, staat wel in de Examenregeling. Inleiding en Aanleiding, p. 2 en 4","ref":"Inleiding en Aanleiding, p. 2 en 4","tests":"inhoud maatwerk gelijk aan standaard","source":{"page":4,"quote":"De inhoud (onderdelen) van een maatwerk exprogramma is gelijk aan de inhoud van"}},{"id":"EP-0350","category":"examenprogrammas","subtopic":"maatwerk","type":"onjuist","objectives":["EP-MAAT-05","EP-MAAT-04"],"question":"Welke bewering over het standaard examenprogramma is NIET juist?","options":["De onderdelen van de proeven worden in de vastgestelde volgorde uitgevoerd.","De onderdelen zijn apart genormeerd.","Een Licentiehouder mag er zonder goedkeuring eigen proeven aan toevoegen."],"answer":2,"explanation":"Eigen proeven maken kan alleen in een maatwerk examenprogramma, en dat moet vooraf ter goedkeuring worden voorgelegd aan de Nationale Raad Zwemveiligheid. Dat de onderdelen van de proeven in de vastgestelde volgorde worden uitgevoerd en dat de onderdelen apart zijn genormeerd, klopt voor het standaard examenprogramma. Bijlage 1","ref":"Bijlage 1","tests":"standaard: vaste volgorde, eigen proeven alleen via goedgekeurd maatwerk","source":{"page":"Bijlage 1","quote":"heeft een Licentiehouder de mogelijkheid om óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit te voeren."}},{"id":"EP-0400","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-01"],"question":"Wat wordt in de Examenregeling bedoeld met de 'essentie' van een onderdeel?","options":["Waarom het onderdeel belangrijk is, in relatie tot zwemveiligheid","Aan welke voorwaarden de technische uitvoering minimaal moet voldoen","Welke opdracht of actie na de uitvoering van het onderdeel volgt"],"answer":0,"explanation":"De essentie beschrijft waarom een basiselement of onderdeel belangrijk is: de relatie met zwemveiligheid, overleven en veilig bewegen en recreëren. De minimale voorwaarden voor de technische uitvoering staan in de normering, en een opdracht na het onderdeel is een aanvullende voorwaarde. §4.2, p. 46","ref":"§4.2, p. 46","tests":"betekenis van 'essentie' van een onderdeel","source":{"page":46,"quote":"waarom deze belangrijk zijn. Dit wordt de essentie van het onderdeel genoemd."}},{"id":"EP-0401","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-01"],"question":"Welke bewering over de basiselementen in hoofdstuk 4.2 is NIET juist?","options":["Ze zijn belangrijk om verdrinking te voorkomen en jezelf te kunnen redden.","Survival is, naast onder andere drijven en watertrappen, een van de basiselementen.","Alleen voor de basiselementen is beschreven waarom ze belangrijk zijn, niet voor de onderdelen."],"answer":2,"explanation":"De Examenregeling beschrijft zowel voor de basiselementen als voor de onderdelen die daarbij horen waarom ze belangrijk zijn. Dat de basiselementen helpen verdrinking te voorkomen en dat survival (net als drijven en watertrappen) een basiselement is, klopt wel. §4.2, p. 46","ref":"§4.2, p. 46","tests":"essentie beschreven voor basiselementen én onderdelen","source":{"page":46,"quote":"Voor zowel de basiselementen als de onderdelen die daarbij horen, is beschreven"}},{"id":"EP-0402","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-02"],"question":"Waarom zijn de onderdelen van het basiselement 'te water gaan' in de examenprogramma's opgenomen? Welke reden is NIET juist?","options":["Om niet in paniek te raken bij desoriëntatie","Om op een veilige manier in het water te gaan in een onbekende omgeving","Om een technisch correcte sprong of duik te leren uitvoeren"],"answer":2,"explanation":"De onderdelen bij 'te water gaan' zijn opgenomen om niet in paniek te raken bij desoriëntatie, om vanaf de kant dieper onder water te komen en om veilig in het water te gaan in een onbekende omgeving. Een technisch correcte uitvoering is niet het doel; bij de rol voorover worden bijvoorbeeld geen eisen aan de technische uitvoering gesteld. §4.2.1, p. 46 en 48","ref":"§4.2.1, p. 46 en 48","tests":"doel van de onderdelen te water gaan","source":{"page":46,"quote":"in paniek te raken bij desoriëntatie, vanaf de kant dieper onder water te komen en op een veilige"}},{"id":"EP-0403","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-03"],"question":"De voetsprong voorwaarts, het achterwaarts te water gaan en de rol voorover horen bij 'te water gaan'. Bij welk ander basiselement horen ze ook, en waarom?","options":["Bij survival, omdat ze gekleed worden uitgevoerd","Bij onder water, omdat de kandidaat daarbij onder water raakt","Bij watertrappen, omdat ze direct worden gevolgd door watertrappen"],"answer":0,"explanation":"Deze drie desoriëntatie-onderdelen horen ook bij het basiselement survival, omdat ze gekleed worden uitgevoerd. Ze worden wel direct gevolgd door oriënteren in de vorm van watertrappen, maar dat maakt ze geen onderdeel van dat basiselement; ook onder water raken is niet de reden die de regeling noemt. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"desoriëntatie-onderdelen horen ook bij survival (gekleed)","source":{"page":47,"quote":"basiselement ‘Survival’, omdat ze gekleed worden uitgevoerd"}},{"id":"EP-0404","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-04","EP-ESS-05"],"question":"Welke bewering over de voetsprong voorwaarts, gekleed (A.1) is NIET juist?","options":["De sprong wordt vanaf enige hoogte uitgevoerd om dieper onder water te kunnen raken.","De kandidaat moet zelfstandig, zonder afzet van de bodem, weer omhoog kunnen komen.","Na het bovenkomen volgt direct een oriëntatieopdracht onder water."],"answer":2,"explanation":"Na de voetsprong volgt direct oriëntatie boven water, in de vorm van watertrappen, en een vervolgopdracht; een oriëntatieopdracht onder water hoort bij de sprong of duik van A.2, B.2 en C.2. De andere beweringen kloppen: de hoogte zorgt dat de kandidaat dieper onder water raakt, en de essentie is zelfstandig zonder afzet van de bodem bovenkomen. §4.2.1, p. 47 en 48","ref":"§4.2.1, p. 47 en 48","tests":"A.1: na de voetsprong oriëntatie boven water","source":{"page":47,"quote":"Na het bovenkomen volgt direct oriëntatie boven water en een vervolgopdracht."}},{"id":"EP-0405","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-04","EP-ESS-05"],"question":"Een kandidaat voor Zwemdiploma A maakt de voetsprong voorwaarts, gekleed vanaf het startblok. Hij gaat helemaal onder water, raakt de bodem en zet zich daar krachtig af om boven te komen. Welk deel van de essentie van dit onderdeel laat hij daarmee NIET zien?","options":["Zelfstandig, zonder afzet van de bodem, weer omhoog komen","Helemaal onder water gaan na de sprong","Vanaf enige hoogte springen om dieper onder water te raken"],"answer":0,"explanation":"De essentie van de voetsprong is helemaal onder water gaan, je oriënteren en zelfstandig, zonder afzet van de bodem, weer omhoog komen; daarvoor is 1,8 meter waterdiepte een voorwaarde. Door zich van de bodem af te zetten laat de kandidaat dat laatste niet zien. Helemaal onder water gaan en vanaf enige hoogte (het startblok) springen heeft hij wel getoond. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"A.1 essentie: bovenkomen zonder afzet van de bodem","source":{"page":47,"quote":"zelfstandig (zonder een afzet van de bodem) weer omhoog kunt komen"}},{"id":"EP-0406","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-07"],"question":"Waarom is achterwaarts springen niet toegestaan bij het onderdeel achterwaarts te water gaan, gekleed (B.1)?","options":["Het is een bewuste actie: er ontstaat geen desoriëntatie en het is gevaarlijk.","Bij een sprong komt de kandidaat te ver van de kant terecht voor de vervolgopdracht.","Na een sprong gaat de kandidaat niet helemaal onder water, wat bij B.1 verplicht is."],"answer":0,"explanation":"Bij B.1 moet er sprake zijn van vallen, zodat de kandidaat onverwacht in het water terechtkomt. Achterwaarts springen is een bewuste actie, veroorzaakt geen desoriëntatie en is bovendien gevaarlijk; daarom is het niet toegestaan. De afstand tot de kant en het helemaal onder water gaan noemt de regeling niet als reden. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1: achterwaarts springen niet toegestaan","source":{"page":47,"quote":"Achterwaarts springen is een bewuste actie. Er ontstaat geen desoriëntatie en bovendien is het gevaarlijk."}},{"id":"EP-0407","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-07","EP-ESS-06"],"question":"Een kandidaat voor Zwemdiploma B gaat bij achterwaarts te water gaan, gekleed met zijn rug naar het water staan en maakt een krachtige sprong achterwaarts het water in. Daarna watertrapt hij direct. Wat beslist de examinator?","options":["Onvoldoende: er moet sprake zijn van een valbeweging; springen is niet toegestaan.","Voldoende: dit onderdeel mag zowel zittend als staand worden uitgevoerd.","Voldoende: hij heeft geen zicht op de valrichting en watertrapt direct daarna."],"answer":0,"explanation":"Bij B.1 moet er sprake zijn van een valbeweging; springen is niet toegestaan, omdat het een bewuste actie is die geen desoriëntatie geeft en gevaarlijk is. Dat het onderdeel staand mag en dat de kandidaat geen zicht op de valrichting heeft en daarna watertrapt, maakt een sprong niet alsnog toegestaan. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1: achterwaarts springen niet toegestaan","source":{"page":47,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."}},{"id":"EP-0408","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-06"],"question":"Welke bewering over de essentie van achterwaarts te water gaan, gekleed (B.1) is NIET juist?","options":["De kandidaat gaat te water zonder te weten waar hij precies terechtkomt.","Er is sprake van vallen, om het onverwacht in het water terechtkomen te bevorderen.","De kandidaat kijkt bij voorkeur over zijn schouder om de valrichting te kiezen."],"answer":2,"explanation":"Bij B.1 heeft de kandidaat juist geen zicht op de valrichting: de essentie is te water gaan zonder te weten waar je precies terechtkomt en je daarna heroriënteren. Het vallen is bedoeld om het onverwacht in het water terechtkomen te bevorderen; die twee beweringen kloppen dus. §4.2.1, p. 47","ref":"§4.2.1, p. 47","tests":"B.1 essentie: te water zonder te weten waar je terechtkomt","source":{"page":47,"quote":"De kandidaat heeft geen zicht op de valrichting."}},{"id":"EP-0409","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-08"],"question":"Waarom worden bij met een rol voorover te water gaan, gekleed (C.1) geen eisen gesteld aan de technische uitvoering van de rol?","options":["Het gaat om de draai om de breedteas, gedesoriënteerd raken en je daarna heroriënteren.","De rol wordt gekleed uitgevoerd, en kleding maakt een goede techniek te moeilijk.","De rol mag vanaf een lage kant, waardoor de uitvoering nooit gevaarlijk is."],"answer":0,"explanation":"De essentie van de rol voorover is met een draai om de breedteas te water raken, gedesoriënteerd zijn en je daarna heroriënteren; daarom worden geen eisen aan de techniek gesteld. Dat kleding de uitvoering moeilijker maakt, noemt de regeling bij gekleed zwemmen, niet als reden bij de rol. Dat de rol vanaf een lage rand mag, is een uitvoeringsvoorwaarde en niet de reden. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"C.1: geen eisen aan techniek rol voorover","source":{"page":48,"quote":"Er worden daarom geen eisen gesteld aan de technische uitvoering van de rol voorover."}},{"id":"EP-0410","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-08"],"question":"Een kandidaat voor Zwemdiploma C maakt gekleed een scheve, rommelige rol voorover vanaf de lage kant. Hij komt een stuk verderop dan verwacht in het water terecht en begint direct te watertrappen. Wat beslist de examinator over de rol?","options":["Voldoende: er is een draai om de breedteas en de plaats van terechtkomen is niet van belang.","Onvoldoende: de rol voorover moet technisch correct en recht worden uitgevoerd.","Onvoldoende: de rol voorover moet vanaf een hoge kant of een startblok worden gemaakt."],"answer":0,"explanation":"Bij C.1 gaat het om de draai om de breedteas en de desoriëntatie; aan de technische uitvoering worden geen eisen gesteld en de plaats waar de kandidaat in het water komt, is niet van belang. De rol mag juist ook vanaf een (lage) kant worden uitgevoerd. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"C.1: geen eisen aan techniek rol voorover","source":{"page":48,"quote":"De plaats waar de kandidaat in het water terecht komt, is niet van belang."}},{"id":"EP-0411","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-09"],"question":"Waarom is het onderdeel 'duiken' in de examenprogramma's opgenomen als manier om dieper onder te gaan?","options":["In diep water verdwijn je onder water en kun je niet makkelijk van de bodem afzetten.","Duiken is de veiligste manier om in onbekend open water te water te gaan.","Na een duik kun je het doel waar je naartoe wilt zwemmen blijven zien."],"answer":0,"explanation":"In water van 1,8 meter of dieper verdwijn je na een sprong of duik meestal helemaal onder water en kun je niet makkelijk van de bodem afzetten; daarom is duiken opgenomen als manier om dieper onder te gaan. In onbekend water is duiken juist gevaarlijk, en het doel blijven zien hoort bij de sprong waarbij het hoofd boven water blijft. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"waarom duiken is opgenomen (dieper onder gaan)","source":{"page":48,"quote":"kun je niet makkelijk afzetten van de bodem om weer boven te komen"}},{"id":"EP-0412","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-12","EP-ESS-09"],"question":"Welke bewering over duiken in de Examenregeling is NIET juist?","options":["Duiken is de populaire benaming voor de kopsprong.","Duiken is 'cool' en levert volgens de regeling veel plezier op.","Duiken is een veilige keuze als je niet weet hoe diep het water is."],"answer":2,"explanation":"Als je niet weet hoe diep het water is, zoals in open water, is een voetsprong of duiken juist gevaarlijk: je kunt met een klap op de bodem komen. Dat duiken de populaire benaming is voor de kopsprong en dat het 'cool' is en veel plezier oplevert, staat wel in de regeling. §4.2.1, p. 48 en 49","ref":"§4.2.1, p. 48 en 49","tests":"onbekende waterdiepte: geen voetsprong of duik","source":{"page":49,"quote":"is de keuze voor een voetsprong of duiken gevaarlijk"}},{"id":"EP-0413","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-10"],"question":"Wat is het verschil tussen Zwemdiploma A en de Zwemdiploma's B en C bij het dieper onder water gaan vanaf de kant?","options":["Bij A mag ook een sprong, al heeft duiken de voorkeur; bij B en C wordt er gedoken.","Bij A is duiken verplicht; bij B en C mag de kandidaat ook met een sprong te water gaan.","Bij A en B mag ook een sprong; alleen bij C is duiken van de kant verplicht."],"answer":0,"explanation":"Voor Zwemdiploma A mag een kandidaat ook met een sprong dieper onder water gaan; duiken is dan nog niet verplicht, maar heeft wel de voorkeur. Bij B en C is het onderdeel 'van de kant in het water duiken' (B.2, C.2). Het is dus niet andersom, en ook bij B is duiken het onderdeel. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"A.2 sprong toegestaan vs B.2/C.2 duiken","source":{"page":48,"quote":"Duiken is dan nog niet verplicht, maar heeft wel de voorkeur."}},{"id":"EP-0414","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-10"],"question":"Voor Zwemdiploma A is duiken nog niet verplicht, maar heeft het wel de voorkeur boven een sprong. Waarom?","options":["Na een duik is de oriëntatieopdracht onder water veel makkelijker uit te voeren.","Na een duik kan de kandidaat makkelijker van de bodem afzetten om boven te komen.","Een sprong is in water van 1,8 meter diep te gevaarlijk voor jonge kinderen."],"answer":0,"explanation":"Duiken heeft bij A de voorkeur omdat het voor de kandidaat veel makkelijker is om na een duik de oriëntatieopdracht onder water uit te voeren. Afzetten van de bodem is juist niet de bedoeling: de opdracht volgt direct, zonder boven te komen. Een sprong in 1,8 meter diep water is bij A gewoon toegestaan; gevaarlijk is springen of duiken in water waarvan je de diepte niet kent. §4.2.1, p. 48","ref":"§4.2.1, p. 48","tests":"A.2: waarom duiken de voorkeur heeft","source":{"page":48,"quote":"Het is voor de kandidaat veel makkelijker om na een duik de oriëntatieopdracht onder water uit te voeren."}},{"id":"EP-0415","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-11"],"question":"Een kandidaat voor Zwemdiploma B duikt van de kant, met de handen als eerste, en gaat in het diepe geheel onder water. Hij komt eerst even boven om adem te halen en zwemt daarna onder water door het gat in het zeil. Welk deel van de essentie van het duiken laat hij hierdoor NIET zien?","options":["Direct, zonder boven te komen, onder water oriënteren en een opdracht uitvoeren","Hoofdwaarts vanaf de kant te water gaan, zoals bij een kopsprong","Na het te water gaan geheel onder water komen, in diep water"],"answer":0,"explanation":"De essentie van duiken (B.2, C.2) is hoofdwaarts te water gaan om direct daarna, zonder boven te komen, onder water te oriënteren en een opdracht uit te voeren. Door eerst boven te komen laat de kandidaat dat niet zien. Hoofdwaarts van de kant te water gaan en geheel onder water komen heeft hij wel getoond. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"duik/sprong: direct onder water oriënteren zonder boven te komen","source":{"page":49,"quote":"hoofdwaarts te water gaan om direct daarna, zonder boven te komen, onder water te oriënteren"}},{"id":"EP-0416","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-12"],"question":"Een kind wil in een recreatieplas te water gaan, maar weet niet hoe diep het water daar is. Welke manier van te water gaan past volgens de Examenregeling het best bij deze situatie?","options":["Een sprong waarbij het hoofd boven water blijft","Een duik van de kant, om snel dieper onder water te komen","Een voetsprong vanaf enige hoogte, met de voeten eerst"],"answer":0,"explanation":"Als je niet weet hoe diep het water is, zoals in open water, is een voetsprong of duiken gevaarlijk: je kunt met een klap op de bodem komen en een been of zelfs je nek breken. In zo'n situatie kun je een sprong maken waarbij het hoofd boven water blijft. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"onbekende waterdiepte: geen voetsprong of duik","source":{"page":49,"quote":"In zo’n situatie kun je een sprong maken waarbij het hoofd boven water blijft"}},{"id":"EP-0417","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-13","EP-ESS-04"],"question":"Wat is het verschil in essentie tussen de voetsprong voorwaarts, gekleed (A.1) en de sprong waarbij het hoofd boven water blijft (C.3)?","options":["Bij A.1 ga je helemaal onder water; bij C.3 blijf je het doel waar je naartoe wilt zwemmen zien.","Bij A.1 blijft het hoofd boven water; bij C.3 ga je helemaal onder water om je te oriënteren.","Bij A.1 voer je onder water direct een opdracht uit; bij C.3 raak je bewust gedesoriënteerd."],"answer":0,"explanation":"Bij de voetsprong (A.1) ga je helemaal onder water en kom je zelfstandig weer omhoog; bij C.3 blijft het hoofd boven water, zodat je het doel waar je naartoe wilt zwemmen kunt blijven zien. De tweede optie draait dit om, en direct onder water een opdracht uitvoeren hoort bij A.2, B.2 en C.2. §4.2.1, p. 47 en 49","ref":"§4.2.1, p. 47 en 49","tests":"C.3 essentie: doel blijven zien","source":{"page":49,"quote":"je het doel waar je naar toe wilt zwemmen kunt blijven zien"}},{"id":"EP-0418","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-13"],"question":"Waarvoor kan de sprong waarbij het hoofd boven water blijft volgens de Examenregeling worden gebruikt? Welke toepassing is NIET juist?","options":["Later iemand helpen die tijdens het zwemmen in de problemen zit","Blijven kijken naar iets of iemand in het water","Dieper onder water komen om iets van de bodem te halen"],"answer":2,"explanation":"Bij deze sprong blijft het hoofd juist boven water; dieper onder water komen om iets van de bodem te halen hoort bij de sprong (A.2) of het duiken (B.2, C.2). De regeling noemt wel dat je de sprong kunt gebruiken om te blijven kijken naar iets of iemand in het water, en later om iemand die in de problemen zit te helpen of te redden. §4.2.1, p. 49","ref":"§4.2.1, p. 49","tests":"toepassingen sprong hoofd boven water (kijken, helpen)","source":{"page":49,"quote":"De essentie van deze sprong is dat je hoofd boven water blijft"}},{"id":"EP-0419","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-14"],"question":"Welke bewering over het doel van de onderdelen bij het basiselement 'onder water' is NIET juist?","options":["Ze zijn bedoeld om (gekleed) onder water te durven zwemmen.","Ze zijn bedoeld om onder water voorwerpen te kunnen ontwijken.","Ze zijn bedoeld om de adem zo lang mogelijk te leren inhouden."],"answer":2,"explanation":"De onderdelen bij 'onder water' zijn bedoeld om (gekleed) onder water te (durven) zwemmen en te oriënteren en om voorwerpen te ontwijken; wie niet bang is onder water, raakt niet zomaar in paniek. Zo lang mogelijk de adem inhouden wordt niet als doel genoemd. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"doel basiselement onder water","source":{"page":50,"quote":"zwemmen en te oriënteren en om voorwerpen te ontwijken"}},{"id":"EP-0420","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-15"],"question":"Wat is de essentie van onder water zwemmen door een gat in een verticaal hangend zeil (A.3, B.3, C.4)?","options":["Onder water kunnen kijken en je in een bepaalde richting verplaatsen","Onder water inschatten waar je het veiligst boven water kunt komen","Soepel en makkelijk onder een mat of bootje door kunnen zwemmen"],"answer":0,"explanation":"De essentie van het zeil-onderdeel is dat de kandidaat onder water kan kijken en zich daarna in een bepaalde richting kan verplaatsen (oriënteren), bijvoorbeeld om onder een omgevallen bootje vandaan te komen. Inschatten waar je veilig boven kunt komen hoort bij bovenkomen in een 'wak' (C.5), en soepel onder een voorwerp door zwemmen bij B.5 en C.6. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"essentie zeil-onderdeel: kijken en verplaatsen in een richting","source":{"page":50,"quote":"De essentie van dit onderdeel is dat de kandidaat onder water kan kijken"}},{"id":"EP-0421","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-15","EP-ESS-17"],"question":"Een kandidaat voor Zwemdiploma B zwemt onder water door het gat in het verticaal hangende zeil. Hij gebruikt geen schoolslag, maar alleen een beenbeweging, met de armen langs het lichaam. Wat beslist de examinator?","options":["Voldoende: de manier van verplaatsen onder water is vrij, het gaat om de opdracht.","Onvoldoende: onder water moet met de schoolslag worden gezwommen.","Onvoldoende: de armen moeten onder water gestrekt boven het hoofd blijven."],"answer":0,"explanation":"Bij het zeil-onderdeel is de manier waarop je je onder water verplaatst vrij; het gaat om het volbrengen van de opdracht. De schoolslag onder water is verstandig, maar niet verplicht. Gestrekte armen boven het hoofd horen bij voetwaarts richting de bodem zakken. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"zeil-onderdeel: manier van verplaatsen vrij","source":{"page":50,"quote":"verplaatst is vrij. Het gaat om het volbrengen van de opdracht."}},{"id":"EP-0422","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-16"],"question":"Waarom is 'bovenkomen in een wak' opgenomen in het examenprogramma voor Zwemdiploma C?","options":["Om onder water in te schatten waar je het beste veilig boven kunt komen","Om na het onder water zwemmen direct te kunnen watertrappen","Om te oefenen met gekleed onder water zwemmen in open water"],"answer":0,"explanation":"Het is belangrijk om onder water in te schatten op welke plek je het beste boven water kunt komen, zodat je je hoofd niet stoot aan een boot of mat en niet tegen andere mensen botst. Daarom is bovenkomen in een 'wak' opgenomen bij C. Watertrappen en gekleed onder water zwemmen worden daarbij niet als reden genoemd. §4.2.2, p. 50","ref":"§4.2.2, p. 50","tests":"waarom bovenkomen in een wak (C)","source":{"page":50,"quote":"Het is ook belangrijk om onder water in te schatten op welke plek je het beste boven water kunt komen."}},{"id":"EP-0423","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-16"],"question":"Wat voegt 6 meter onder water zwemmen met bovenkomen in een 'wak' (C.5) toe aan de essentie van het onder water zwemmen bij A en B (A.4, B.4)?","options":["Bovenkomen op een veilige plek, zonder je hoofd te stoten of tegen iemand te botsen","Gekleed onder water zwemmen, omdat dat vermoeiender is dan in badkleding","Verplicht de schoolslag onder water, omdat die relatief weinig energie kost"],"answer":0,"explanation":"Bij A.4 en B.4 gaat het om je onder water verplaatsen en oriënteren; bij C.5 komt daar bovenkomen op een veilige plek bij, om je hoofd niet te stoten aan een boot of mat en niet tegen anderen te botsen. Gekleed onder water zwemmen hoort bij B.5, C.6 en C.7, en de schoolslag is bij alle drie verstandig maar niet verplicht. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"waarom bovenkomen in een wak (C)","source":{"page":51,"quote":"en daarna boven kan komen op een veilige plek"}},{"id":"EP-0424","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-17"],"question":"Bij 3 of 6 meter onder water zwemmen (A.4, B.4) is de schoolslag niet verplicht. Waarom is het volgens de Examenregeling toch verstandig om die te gebruiken?","options":["Het kost relatief weinig energie en geeft veel verplaatsing.","Zo komt de kandidaat niet te vroeg weer boven water.","Zo telt de afstand van de sprong of duik mee in het totaal."],"answer":0,"explanation":"Verplaatsen onder water met de schoolslag is zeer effectief: goed uitgevoerd kost het relatief weinig energie en geeft het veel verplaatsing, zodat de afstand makkelijker wordt overbrugd. De afstand van een sprong of duik telt mee als het onderdeel daarmee wordt gecombineerd, los van de zwemslag; te vroeg bovenkomen wordt niet als reden genoemd. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"schoolslag onder water verstandig maar niet verplicht","source":{"page":51,"quote":"kost het relatief weinig energie en is er sprake van veel verplaatsing."}},{"id":"EP-0425","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-18"],"question":"Wat is de essentie van gekleed onder een drijvend voorwerp door zwemmen (B.5, C.6)?","options":["Soepel en makkelijk onder een voorwerp, zoals een mat of bootje, door kunnen zwemmen","Na het onder water zwemmen boven komen in een vooraf afgesproken plek","Zelfstandig en zonder angst over een drijvend voorwerp heen kunnen klimmen"],"answer":0,"explanation":"Gekleed onder water zwemmen voelt heel anders en is vermoeiender dan in badkleding; de essentie van B.5 en C.6 is daarom soepel en makkelijk onder een voorwerp door kunnen zwemmen. Bovenkomen op een afgesproken plek hoort bij C.5 en over een voorwerp heen klimmen bij C.22. §4.2.2, p. 51","ref":"§4.2.2, p. 51","tests":"essentie gekleed onder drijvend voorwerp door zwemmen","source":{"page":51,"quote":"De essentie van dit onderdeel is het soepel en makkelijk onder een voorwerp"}},{"id":"EP-0426","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-19"],"question":"Waarom mag bij Zwemdiploma C de jas uit bij gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen (C.7)?","options":["Zwemmen onder water met een jas is erg vermoeiend en niet aan te raden.","Met een jas aan past de kandidaat niet door het gat in het zeil.","Met een jas aan kan de kandidaat onder water niet goed kijken."],"answer":0,"explanation":"Het zwemmen onder water met een jas is erg vermoeiend en ook niet aan te raden; daarom mag de jas, die bij Zwemdiploma C bij de kleding hoort, bij C.7 uit. De andere twee redenen noemt de regeling niet: de essentie is juist dat de kandidaat ook gekleed onder water kan oriënteren. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"C.7: jas uit (vermoeiend)","source":{"page":52,"quote":"Het zwemmen onder water met een jas is erg vermoeiend (en ook niet aan te raden)."}},{"id":"EP-0427","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-19"],"question":"Welke bewering over gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen (C.7) is NIET juist?","options":["De manier waarop de kandidaat zich onder water verplaatst, is vrij.","Het laat zien dat de kandidaat ook gekleed onder water kan oriënteren.","De jas blijft aan, omdat zo een echte valsituatie wordt nagebootst."],"answer":2,"explanation":"Bij C.7 wordt geen jas gedragen, omdat onder water zwemmen met een jas erg vermoeiend is. De andere beweringen kloppen: de essentie is dat de kandidaat ook gekleed onder water kan oriënteren, en de manier van verplaatsen onder water is vrij. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"C.7: jas uit (vermoeiend)","source":{"page":52,"quote":"Daarom mag de jas, onderdeel van de kleding die bij Zwemdiploma C wordt gedragen, uit."}},{"id":"EP-0428","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-20"],"question":"Waarom worden bij voetwaarts richting de bodem zakken (A.5, B.6) de armen gestrekt boven het hoofd gehouden?","options":["Het zakken naar de bodem gaat dan sneller en meer gestroomlijnd.","Met de armen wordt zo een startsnelheid naar beneden gecreëerd.","Zo kan de kandidaat onder water beter zien waar hij boven kan komen."],"answer":0,"explanation":"Door de gestrekte armen boven het hoofd kan het zakken naar de bodem veel sneller en meer gestroomlijnd plaatsvinden. De startsnelheid komt bij voetwaarts zakken uit een krachtige beenbeweging, niet uit de armen. Inschatten waar je boven kunt komen hoort bij bovenkomen in een 'wak'. §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"voetwaarts zakken: armen gestrekt boven het hoofd","source":{"page":52,"quote":"armen boven het hoofd kan het zakken naar de bodem veel sneller (en meer gestroomlijnd)"}},{"id":"EP-0429","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-20","EP-ESS-21"],"question":"Hoe wordt de startsnelheid gecreëerd bij voetwaarts richting de bodem zakken (A.5, B.6) en bij hoofdwaarts richting de bodem gaan (C.8)?","options":["Voetwaarts met een krachtige beenbeweging; hoofdwaarts met een krachtige armdoorhaal","Voetwaarts met een krachtige armdoorhaal; hoofdwaarts met een krachtige beenbeweging","Bij beide door eerst de kin op de borst te brengen en dan de benen te strekken"],"answer":0,"explanation":"Bij voetwaarts zakken wordt de startsnelheid gecreëerd met een krachtige beenbeweging, bij hoofdwaarts richting de bodem gaan met een krachtige armdoorhaal. De kin op de borst zet alleen de hoofdwaartse beweging in, en daar zorgen gestrekte benen voor een snelle, gestroomlijnde beweging. §4.2.2, p. 52 en 53","ref":"§4.2.2, p. 52 en 53","tests":"startsnelheid voetwaarts (benen) vs hoofdwaarts (armen)","source":{"page":53,"quote":"met behulp van een krachtige armdoorhaal wordt een startsnelheid gecreëerd"}},{"id":"EP-0430","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-21"],"question":"Welke bewering over hoofdwaarts richting de bodem gaan (C.8) is NIET juist?","options":["De beweging naar beneden wordt ingezet door de kin op de borst te brengen.","Door de benen te strekken gaat de beweging naar beneden snel en gestroomlijnd.","Een zo verticaal mogelijke uitvoering is een eis bij de beoordeling."],"answer":2,"explanation":"Zo recht (verticaal) mogelijk naar beneden gaan verdient de voorkeur, maar wordt niet bij de beoordeling betrokken. De andere beweringen kloppen: de kin op de borst zet de beweging in, en gestrekte benen maken de beweging snel en gestroomlijnd. §4.2.2, p. 53","ref":"§4.2.2, p. 53","tests":"C.8: kin op borst; verticaal niet beoordeeld","source":{"page":53,"quote":"De beweging wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dit wordt niet bij de beoordeling betrokken."}},{"id":"EP-0431","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-22"],"question":"Welke bewering over het basiselement drijven is NIET juist?","options":["Drijven is een basisvoorwaarde om veel andere vaardigheden te kunnen uitvoeren.","Drijven op de rug is langer vol te houden, omdat er vrij kan worden geademd.","Drijven wordt vooral gebruikt om je boven water te oriënteren."],"answer":2,"explanation":"Drijven wordt gebruikt om even uit te rusten tijdens het overbruggen van een afstand of om te wachten tot iemand je komt redden of helpen; oriënteren boven water is vooral de functie van watertrappen. Dat drijven een basisvoorwaarde is voor veel andere vaardigheden en dat drijven op de rug langer vol te houden is omdat je vrij kunt ademen, klopt wel. §4.2.3, p. 53","ref":"§4.2.3, p. 53","tests":"doel drijven: uitrusten, wachten op hulp","source":{"page":53,"quote":"gebruikt om even uit te rusten tijdens het overbruggen van een afstand of om te wachten tot"}},{"id":"EP-0432","category":"examenprogrammas","subtopic":"essenties","type":"casus","objectives":["EP-ESS-23"],"question":"Een kandidaat voor Zwemdiploma A drijft 10 seconden horizontaal en op de plaats op de rug. Hij houdt de armen langs het lichaam en de benen gesloten en maakt kleine wrikbewegingen met de handen. Wat beslist de examinator?","options":["Voldoende: de houding van armen en benen is vrij en wrikbewegingen mogen.","Onvoldoende: armen en benen moeten gespreid zijn om op de plaats te drijven.","Onvoldoende: bij drijven op de rug mogen armen en handen niet bewegen."],"answer":0,"explanation":"Drijven op de plaats gaat makkelijker met gespreide armen en benen, maar de houding van armen en benen is vrij. Wrikbewegingen met armen of handen mogen worden gebruikt; dan wordt het juist makkelijker om horizontaal te blijven liggen. §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"drijven: houding vrij, wrikbewegingen toegestaan","source":{"page":54,"quote":"De armen/handen (wrikbewegingen) mogen worden gebruikt, het wordt dan makkelijker om horizontaal te blijven liggen."}},{"id":"EP-0433","category":"examenprogrammas","subtopic":"essenties","type":"onjuist","objectives":["EP-ESS-24"],"question":"Welke bewering over drijven met gebruik van een drijvend voorwerp is NIET juist?","options":["Een (te) groot voorwerp, zoals een bal, stimuleert het kantelen naar de rug.","Verticaal drijven is makkelijker met een klein voorwerp, zoals een dumbell.","Een groot plankje is het meest geschikt om verticaal op te blijven drijven."],"answer":2,"explanation":"Een (te) groot voorwerp, zoals een bal of plankje, heeft veel volume aan de voorkant en stimuleert het kantelen naar de rug; dat is vervelend als je verticaal wilt drijven. Verticaal drijven gaat makkelijker met een stuk flexibeam, een dumbell of een ander klein voorwerp. §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"groot vs klein drijvend voorwerp bij verticaal drijven","source":{"page":54,"quote":"Wanneer het voorwerp (te) groot is, bijvoorbeeld een bal of een plankje, stimuleert dat het kantelen naar de rug"}},{"id":"EP-0434","category":"examenprogrammas","subtopic":"essenties","type":"kennis","objectives":["EP-ESS-25"],"question":"Waarom zijn bij 30 seconden gekleed verticaal blijven drijven met een drijvend voorwerp (C.10) de knieën opgetrokken en de ellebogen tegen het lichaam?","options":["Deze HELP-houding vermindert de afkoeling in koud water aanzienlijk.","Zo kan de kandidaat zich met het voorwerp naar de kant verplaatsen.","Zo blijft het hoofd boven water zonder dat het voorwerp nodig is."],"answer":0,"explanation":"Bij C.10 worden zoveel mogelijk de principes van de HELP-houding (Heat Escape Lessening Posture) gebruikt; die houding vermindert de afkoeling in koud water aanzienlijk. De kandidaat blijft daarbij op de plaats en gebruikt juist een drijvend voorwerp. §4.2.3, p. 55","ref":"§4.2.3, p. 55","tests":"C.10 HELP-houding: minder afkoeling","source":{"page":55,"quote":"Deze houding zorgt ervoor dat de afkoeling in koud water aanzienlijk vermindert."}},{"id":"EP-0435","category":"examenprogrammas","subtopic":"essenties","type":"verschil","objectives":["EP-ESS-25"],"question":"Wat is een verschil tussen drijven met gebruik van een drijvend voorwerp bij Zwemdiploma B (B.8) en bij Zwemdiploma C (C.10)?","options":[
