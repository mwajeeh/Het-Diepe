aats te vinden"}},{"id":"TV-0061","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-25"],"question":"Welk onderwerp hoort NIET bij de voorbespreking met de gedelegeerde?","options":["De volgorde van het diplomazwemmen en de vaststelling van de routing","Eventuele bijzonderheden bij kandidaten","Hoe de gedelegeerde zijn of haar rol heeft vervuld"],"answer":2,"explanation":"Hoe de gedelegeerde zijn of haar rol heeft vervuld, wordt besproken in het feedbackgesprek na afloop. Gespreksonderwerpen van de voorbespreking zijn onder andere de volgorde en de routing, de taken van organisatorisch betrokkenen en eventuele bijzonderheden bij kandidaten. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"onderwerpen voorbespreking","source":{"page":41,"quote":"Verder wordt besproken hoe de gedelegeerde zijn/haar rol heeft vervuld."}},{"id":"TV-0062","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-26","TV-EXA-33"],"question":"Wanneer wordt de gedelegeerde aan het publiek voorgesteld, en wanneer krijgt hij bij voorkeur de gelegenheid enkele woorden te richten tot kandidaten en publiek?","options":["Voorgesteld voordat het diplomazwemmen start; enkele woorden bij het uitreiken van de zwemdiploma's","Voorgesteld bij het uitreiken van de zwemdiploma's; enkele woorden voordat het diplomazwemmen start","Voorgesteld na het feedbackgesprek; enkele woorden tijdens de voorbespreking"],"answer":0,"explanation":"De medewerker of gedelegeerde wordt aan het publiek voorgesteld voordat het diplomazwemmen van start gaat. Bij het ondertekenen en uitreiken van de zwemdiploma's biedt de Examinator de gedelegeerde bij voorkeur de gelegenheid enkele woorden te richten tot kandidaten en publiek. De andere opties verwisselen of verschuiven die momenten. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"gedelegeerde voorstellen vs enkele woorden","source":{"page":40,"quote":"wordt voorgesteld aan het publiek voordat het diplomazwemmen van start gaat"}},{"id":"TV-0063","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-33"],"question":"Welke gelegenheid biedt de Examinator de gedelegeerde bij voorkeur bij het uitreiken van de zwemdiploma's?","options":["Enkele woorden richten tot de kandidaten en het publiek","De zwemdiploma's namens de Examinator ondertekenen","De uitslag per kandidaat bekendmaken aan de ouders"],"answer":0,"explanation":"De Examinator biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek. De diploma's worden ondertekend door of namens de Examinator, en de uitslag wordt door de Examinator bepaald, dus dat zijn geen taken voor de gedelegeerde. §3.1, p. 41","ref":"§3.1, p. 41","tests":"gedelegeerde enkele woorden bij uitreiking","source":{"page":41,"quote":"biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek"}},{"id":"TV-0064","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-27","TV-EXA-12","TV-EXA-11"],"question":"Welke bewering over de rol van de Examinator tijdens het diplomazwemmen is NIET juist?","options":["Hij zorgt voor een goed lopend diplomazwemmen, zoals een goede routing en adequate begeleiding.","Hij zorgt ervoor dat de kandidaten aan de hand van de beoordelingslijsten worden beoordeeld.","Hij laat de routing tijdens het diplomazwemmen over aan de aanwezige gedelegeerde."],"answer":2,"explanation":"De Examinator bepaalt de routing samen met collega's en zorgt tijdens het diplomazwemmen zelf voor een goede routing en een adequate begeleiding van de kandidaten; dat laat hij niet aan de gedelegeerde over. Dat hij zorgt voor een goed lopend diplomazwemmen en voor beoordeling aan de hand van de beoordelingslijsten, klopt. §3.1, p. 38–41","ref":"§3.1, p. 38–41","tests":"goed lopend diplomazwemmen: routing en begeleiding","source":{"page":41,"quote":"zorg te dragen voor een goed lopend diplomazwemmen, zoals een goede routing en een adequate begeleiding"}},{"id":"TV-0065","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-28"],"question":"Wat is het verschil bij het vaststellen van de uitslag tussen een zwemdiploma en een zwemcertificaat?","options":["Diploma: alle onderdelen voldoende; certificaat: verplichte deel voldoende en bijhouden welke onderdelen van het open deel beheerst worden","Diploma: verplichte deel voldoende; certificaat: alle onderdelen van het examenprogramma voldoende","Diploma: alle onderdelen voldoende; certificaat: open deel voldoende en bijhouden welke onderdelen van het verplichte deel beheerst worden"],"answer":0,"explanation":"Een kandidaat slaagt voor het zwemdiploma als alle onderdelen van het examenprogramma voldoende zijn uitgevoerd. Voor het zwemcertificaat moet het verplichte deel voldoende zijn, en wordt bijgehouden welke onderdelen van het open deel de kandidaat beheerst. De tweede optie draait diploma en certificaat om, de derde verwisselt verplicht en open deel. §3.1, p. 41","ref":"§3.1, p. 41","tests":"geslaagd: diploma alle onderdelen vs certificaat verplicht deel","source":{"page":41,"quote":"Voor het zwemcertificaat dienen de onderdelen uit het verplichte deel van het programma voldoende te worden uitgevoerd."}},{"id":"TV-0066","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-29"],"question":"Wat wordt op de beoordelingslijsten in ieder geval aangegeven?","options":["Welk onderdeel door de kandidaat onvoldoende is uitgevoerd","Hoeveel pogingen de kandidaat per onderdeel nodig had","Welke onderdelen de gedelegeerde heeft goedgekeurd"],"answer":0,"explanation":"Het resultaat wordt inzichtelijk gemaakt met beoordelingslijsten, waarop in ieder geval wordt aangegeven welk onderdeel door de kandidaat onvoldoende is uitgevoerd. Het aantal pogingen per onderdeel hoeft er niet op, en de gedelegeerde keurt geen onderdelen goed: de Examinator is eindverantwoordelijk voor het resultaat. §3.1, p. 41","ref":"§3.1, p. 41","tests":"beoordelingslijst: onvoldoende onderdeel aangeven","source":{"page":41,"quote":"Op deze lijsten wordt in ieder geval aangegeven welk onderdeel door de kandidaat onvoldoende is uitgevoerd."}},{"id":"TV-0067","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-29","TV-EXA-28","TV-EXA-12"],"question":"Welke bewering over het vaststellen van de uitslag is NIET juist?","options":["Een kandidaat is geslaagd als alle onderdelen van het examenprogramma voldoende zijn uitgevoerd.","Het resultaat wordt inzichtelijk gemaakt door het gebruik van beoordelingslijsten.","De gedelegeerde is eindverantwoordelijk voor het vaststellen van het resultaat."],"answer":2,"explanation":"De Examinator Nationale Zwemdiploma's is eindverantwoordelijk voor het vaststellen van het resultaat, niet de gedelegeerde. Dat een kandidaat slaagt als alle onderdelen voldoende zijn en dat het resultaat inzichtelijk wordt gemaakt met beoordelingslijsten, klopt. §3.1, p. 41","ref":"§3.1, p. 41","tests":"Examinator eindverantwoordelijk voor resultaat","source":{"page":41,"quote":"is eindverantwoordelijk voor het vaststellen van het resultaat"}},{"id":"TV-0068","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-32","TV-EXA-15"],"question":"Door wie worden de klaargemaakte zwemdiploma's en zwemcertificaten ondertekend?","options":["Door of namens de Examinator Nationale Zwemdiploma's","Door de gedelegeerde die bij de uitreiking aanwezig is","Door de aangewezen medewerker van het werkgebied"],"answer":0,"explanation":"De klaargemaakte zwemdiploma's en zwemcertificaten worden ondertekend door of namens de Examinator, die hiervoor namens de Licentiehouder verantwoordelijk is. De gedelegeerde mag bij voorkeur enkele woorden spreken maar ondertekent niet, en de medewerker heeft een toezichthoudende rol. §3.1, p. 41","ref":"§3.1, p. 41","tests":"ondertekening door of namens Examinator","source":{"page":41,"quote":"worden ondertekend door of namens de Examinator Nationale Zwemdiploma’s"}},{"id":"TV-0069","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-34"],"question":"Tussen wie vindt het feedbackgesprek na het diplomazwemmen plaats?","options":["Tussen de Examinator en de gedelegeerde, al dan niet aangevuld met betrokken medewerkers","Tussen de Licentiehouder en de ouders/verzorgers van afgewezen kandidaten","Tussen de gedelegeerde en de kwaliteitsmanager van de Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"Het feedbackgesprek is een gesprek tussen de Examinator en de gedelegeerde, al dan niet aangevuld met de medewerkers die bij het diplomazwemmen betrokken waren. Het gesprek met ouders gaat over de reden van een afwijzing, en de kwaliteitsmanager ontvangt de verbeterafspraken uit een verbetertraject. §3.1, p. 41","ref":"§3.1, p. 41","tests":"deelnemers feedbackgesprek","source":{"page":41,"quote":"Dit is een gesprek tussen de Examinator Nationale Zwemdiploma’s en de gedelegeerde"}},{"id":"TV-0070","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-35"],"question":"Welke bewering over het feedbackgesprek is NIET juist?","options":["Besproken wordt of het diplomazwemmen organisatorisch kwalitatief aan de eisen heeft voldaan.","Uitgangspunten zijn wederzijds respect en professioneel handelen.","Alleen het functioneren van de Examinator wordt besproken, niet de rol van de gedelegeerde."],"answer":2,"explanation":"In het feedbackgesprek wordt ook besproken hoe de gedelegeerde zijn of haar rol heeft vervuld, naast de invulling van de verantwoordelijkheid door de Examinator. Dat de organisatorische kwaliteit aan bod komt en dat wederzijds respect en professioneel handelen de uitgangspunten zijn, klopt. §3.1, p. 41","ref":"§3.1, p. 41","tests":"inhoud feedbackgesprek","source":{"page":41,"quote":"Verder wordt besproken hoe de gedelegeerde zijn/haar rol heeft vervuld."}},{"id":"TV-0071","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-36"],"question":"Binnen welke termijn stuurt de Examinator zijn verslag over de kwaliteit van het diplomazwemmen naar de Nationale Raad Zwemveiligheid?","options":["Binnen 7 dagen","Binnen 24 uur","Binnen 21 dagen"],"answer":0,"explanation":"De Examinator stuurt zijn verslag binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid. 24 uur is de grens voor wijzigen en annuleren vóór het diplomazwemmen, en 21 dagen is de minimale aanmeldtermijn. §3.1, p. 41","ref":"§3.1, p. 41","tests":"verslag Examinator binnen 7 dagen","source":{"page":41,"quote":"stuurt dit verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid"}},{"id":"TV-0072","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-36"],"question":"Bij een diplomazwemmen op zaterdag was geen gedelegeerde of medewerker aanwezig. De Examinator vraagt zich af of hij een verslag moet maken. Wat is juist?","options":["Ja, hij maakt een verslag over de kwaliteit en stuurt het binnen 7 dagen via de website.","Nee, een verslag is alleen nodig als er een gedelegeerde of medewerker aanwezig was.","Nee, de ingevulde beoordelingslijsten blijven bij de Licentiehouder en dat volstaat."],"answer":0,"explanation":"Na afloop maakt de Examinator verslag over de kwaliteit van het diplomazwemmen, ongeacht of er een gedelegeerde was, en stuurt dit binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid. Alleen het aanvullende feedbackformulier hangt af van de aanwezigheid van een gedelegeerde of medewerker, en de archiefplicht voor beoordelingslijsten vervangt het verslag niet. §3.1, p. 41","ref":"§3.1, p. 41","tests":"verslag Examinator binnen 7 dagen","source":{"page":41,"quote":"Na afloop wordt door de Examinator Nationale Zwemdiploma’s verslag gemaakt over de kwaliteit van het betreffende diplomazwemmen."}},{"id":"TV-0073","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-36","TV-EXA-37"],"question":"Wat is het verschil tussen het verslag van de Examinator en het aanvullende feedbackformulier?","options":["Het verslag wordt altijd gemaakt; het feedbackformulier alleen als een gedelegeerde of medewerker aanwezig was.","Het feedbackformulier wordt altijd ingevuld; het verslag alleen als een gedelegeerde of medewerker aanwezig was.","Het verslag gaat binnen 7 dagen naar de Nationale Raad Zwemveiligheid; het feedbackformulier binnen 24 uur."],"answer":0,"explanation":"Na afloop maakt de Examinator altijd een verslag over de kwaliteit. Alleen bij aanwezigheid van een gedelegeerde of medewerker vullen beiden daarnaast een aanvullend feedbackformulier in. Beide worden binnen 7 dagen via de website verzonden, dus een termijn van 24 uur voor het formulier klopt niet. §3.1, p. 41–42","ref":"§3.1, p. 41–42","tests":"verslag vs aanvullend feedbackformulier","source":{"page":41,"quote":"Bij de aanwezigheid van een gedelegeerde of medewerker van de Nationale Raad Zwemveiligheid tijdens het examen, vullen zowel de Examinator Nationale Zwemdiploma’s als de gedelegeerde"}},{"id":"TV-0074","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-37"],"question":"Er was een gedelegeerde aanwezig bij het diplomazwemmen. Wat vullen de Examinator en de gedelegeerde na afloop allebei in?","options":["Een aanvullend feedbackformulier","Een gezamenlijke beoordelingslijst","Een formulier voor het klachtenreglement"],"answer":0,"explanation":"Bij aanwezigheid van een gedelegeerde of medewerker vullen zowel de Examinator als de gedelegeerde of medewerker een aanvullend feedbackformulier in, dat binnen 7 dagen wordt verzonden. Beoordelingslijsten gebruiken ze tijdens het diplomazwemmen ieder apart, en het klachtenreglement gaat over klachten over medewerkers of vrijwilligers. §3.1, p. 42","ref":"§3.1, p. 42","tests":"aanvullend feedbackformulier Examinator en gedelegeerde","source":{"page":42,"quote":"vullen zowel de Examinator Nationale Zwemdiploma’s als de gedelegeerde of medewerker van de Nationale Raad Zwemveiligheid een aanvullend feedbackformulier in"}},{"id":"TV-0075","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"onjuist","objectives":["TV-EXT-06","TV-EXA-37"],"question":"Welke bewering over de verslaglegging na het diplomazwemmen is NIET juist?","options":["De gedelegeerde stuurt zijn verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid.","Na verzending van het feedbackformulier kan de Licentiehouder direct kennis nemen van de inhoud.","Het verslag van de gedelegeerde kan de Licentiehouder niet inzien."],"answer":2,"explanation":"Het verslag van de gedelegeerde is in te zien door de Licentiehouder, de gedelegeerde en de daartoe aangewezen medewerker. Dat de gedelegeerde zijn verslag binnen 7 dagen stuurt en dat de Licentiehouder na verzending direct kennis kan nemen van het feedbackformulier, klopt. §3.1–3.2, p. 42","ref":"§3.1–3.2, p. 42","tests":"inzage verslag gedelegeerde","source":{"page":42,"quote":"Dit verslag is in te zien door de Licentiehouder, de gedelegeerde en de daartoe aangewezen medewerker"}},{"id":"TV-0076","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"verschil","objectives":["TV-EXT-06","TV-EXA-36"],"question":"Wat geldt voor de termijn waarbinnen de Examinator en de gedelegeerde hun verslag naar de Nationale Raad Zwemveiligheid sturen?","options":["Beiden sturen hun verslag binnen 7 dagen.","De Examinator binnen 7 dagen, de gedelegeerde binnen 24 uur.","De Examinator binnen 21 dagen, de gedelegeerde binnen 7 dagen."],"answer":0,"explanation":"Zowel de Examinator als de gedelegeerde stuurt het verslag binnen 7 dagen via de website naar de Nationale Raad Zwemveiligheid; er is geen verschil in termijn. 24 uur en 21 dagen zijn termijnen die vóór het diplomazwemmen gelden (wijzigen/annuleren en aanmelden). §3.1–3.2, p. 41–42","ref":"§3.1–3.2, p. 41–42","tests":"verslag Examinator binnen 7 dagen","source":{"page":42,"quote":"De gedelegeerde stuurt het verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid"}},{"id":"TV-0077","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-38"],"question":"Welke van de volgende hoort NIET bij de vaardigheden waarover de Examinator Nationale Zwemdiploma's beschikt?","options":["Het onderkennen van tegenstellingen en conflicten en hiermee om kunnen gaan","Objectief oordelen op basis van geobserveerde vaardigheden","Het tijdelijk intrekken van de Licentie bij uitblijvende verbetering"],"answer":2,"explanation":"Het (tijdelijk) intrekken van de Licentie is een besluit van de directeur, geen vaardigheid van de Examinator. Als vaardigheden worden onder meer genoemd: het onderkennen van tegenstellingen en conflicten, objectief oordelen op basis van geobserveerde vaardigheden, rapporteren, beslissingen nemen en het diplomazwemmen evalueren. Handleiding, p. 3","ref":"Handleiding, p. 3","tests":"vaardigheden Examinator (handleiding)","source":{"doc":"handleiding","page":3,"quote":"Objectief oordelen op basis van geobserveerde vaardigheden."}},{"id":"TV-0078","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-01"],"question":"Waaruit bestaat de externe kwaliteitsborging van het diplomazwemmen?","options":["Toezicht op de kwaliteit door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid","De organisatie van het diplomazwemmen en de uitvoering van de examenprogramma's door de Licentiehouder","Het selecteren van kandidaten en het aanvragen van het diplomazwemmen door de Examinator"],"answer":0,"explanation":"De externe kwaliteitsborging bestaat uit toezicht op de kwaliteit van het diplomazwemmen door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid, onder andere door steekproefsgewijs examens te bezoeken. Organisatie en uitvoering door de Licentiehouder en de taken van de Examinator horen bij de interne kwaliteitsborging. §3, p. 37","ref":"§3, p. 37","tests":"externe kwaliteitsborging: toezicht","source":{"page":37,"quote":"De externe kwaliteitsborging bestaat uit het toezicht op de kwaliteit van het diplomazwemmen."}},{"id":"TV-0079","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-02"],"question":"Hoe zorgt de Nationale Raad Zwemveiligheid ervoor dat het diplomazwemmen wordt bezocht?","options":["Periodiek door gedelegeerden en aanvullend door daartoe aangewezen medewerkers","Periodiek door medewerkers en aanvullend door ingehuurde Examinatoren","Uitsluitend op verzoek van de Licentiehouder, door een gedelegeerde"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid zorgt ervoor dat het diplomazwemmen periodiek wordt bezocht door gedelegeerden en aanvullend door daartoe aangewezen medewerkers. Ingehuurde Examinatoren horen bij de interne kwaliteitsborging van de Licentiehouder, en bezoeken gebeuren niet alleen op verzoek van de Licentiehouder. §3.2, p. 42","ref":"§3.2, p. 42","tests":"periodiek bezoek gedelegeerden, aanvullend medewerkers","source":{"page":42,"quote":"periodiek wordt bezocht door gedelegeerden en aanvullend door daartoe aangewezen medewerkers"}},{"id":"TV-0080","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"onjuist","objectives":["TV-EXT-11","TV-EXT-03","TV-EXT-04"],"question":"Welke bewering over de gedelegeerde is NIET juist?","options":["De gedelegeerde observeert naast de kandidaten ook de examinator en de organisatie.","De gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren.","De gedelegeerde kan tijdens het diplomazwemmen corrigerend handelen als hij dat noodzakelijk acht."],"answer":2,"explanation":"Corrigerend handelen wanneer dat noodzakelijk is, is een bevoegdheid van de medewerker van de Nationale Raad Zwemveiligheid, niet van de gedelegeerde. De gedelegeerde observeert de kandidaten, de examinator en de organisatie, en heeft taken in de vorm van observeren, bespreken en rapporteren. §3.2, p. 42–43","ref":"§3.2, p. 42–43","tests":"medewerker kan corrigerend handelen","source":{"page":43,"quote":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."}},{"id":"TV-0081","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-04"],"question":"Met welke beoordelingslijsten observeert de gedelegeerde de kandidaten tijdens het diplomazwemmen?","options":["Met beoordelingslijsten die de examinator aanlevert","Met eigen lijsten die de medewerker van tevoren toestuurt","Met de gearchiveerde lijsten van het vorige diplomazwemmen"],"answer":0,"explanation":"De gedelegeerde observeert de kandidaten met behulp van beoordelingslijsten die door de examinator worden aangeleverd; daarom moet er ook een lijst voor de gedelegeerde voorhanden zijn. De medewerker stuurt geen eigen lijsten, en gearchiveerde lijsten blijven ter documentatie bij de Licentiehouder. §3.2, p. 42","ref":"§3.2, p. 42","tests":"gedelegeerde gebruikt lijsten van examinator","source":{"page":42,"quote":"met behulp van beoordelingslijsten die worden aangeleverd door de examinator"}},{"id":"TV-0082","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-05"],"question":"Een gedelegeerde vindt op grond van eigen bevindingen dat meerdere kandidaten niet aan de normering voldoen, terwijl de Examinator hen wil laten slagen. Wat doet de gedelegeerde volgens de Examenregeling?","options":["Hij stelt dit vóór de uitslagbepaling kort aan de orde en licht zijn onderbouwing toe in het feedbackgesprek.","Hij houdt de uitreiking tegen en bepaalt zelf de uitslag van de betreffende kandidaten.","Hij zegt tijdens het examen niets en meldt het alleen in zijn verslag binnen 7 dagen."],"answer":0,"explanation":"Vindt de gedelegeerde dat diploma's ten onrechte worden uitgereikt, dan stelt hij dit vóór de uitslagbepaling kort aan de orde en licht hij zijn onderbouwing toe in het feedbackgesprek na het diplomazwemmen. Hij bepaalt de uitslag niet zelf; dat doet de Examinator. Zwijgen tot het verslag past niet bij de regel om het vóór de uitslagbepaling te melden. §3.2, p. 42","ref":"§3.2, p. 42","tests":"gedelegeerde: ten onrechte uitgereikt, vóór uitslagbepaling aan de orde","source":{"page":42,"quote":"stelt hij dit vóór de uitslagbepaling kort aan de orde"}},{"id":"TV-0083","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"kennis","objectives":["TV-EXT-08"],"question":"Welke taak heeft de aangewezen medewerker van de Nationale Raad Zwemveiligheid naast het bezoeken van het diplomazwemmen?","options":["Verslagformulieren beoordelen en in de systemen de aanvragen van het diplomazwemmen controleren","Kandidaten selecteren en de zwemdiploma's gereed maken voor het diplomazwemmen","De Examinator aanstellen en de ingevulde beoordelingslijsten archiveren"],"answer":0,"explanation":"De medewerker beoordeelt de verslagformulieren van de Examinator en de gedelegeerden en controleert in de systemen de aanvragen van het diplomazwemmen. Kandidaten selecteren en diploma's gereed maken zijn taken van de Examinator; de Examinator aanstellen en de lijsten archiveren horen bij de Licentiehouder. §3.2, p. 42","ref":"§3.2, p. 42","tests":"medewerker: verslagformulieren beoordelen, aanvragen controleren","source":{"page":42,"quote":"Daarnaast controleert de medewerker in de systemen de aanvragen van het diplomazwemmen."}},{"id":"TV-0084","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-09"],"question":"Tijdens een diplomazwemmen meldt zich onverwacht een aangewezen medewerker van de Nationale Raad Zwemveiligheid. Er was geen bezoek aangekondigd. Hoe gaat de Examinator hiermee om?","options":["Hij ontvangt de medewerker; medewerkers bezoeken het diplomazwemmen ook onaangekondigd.","Hij weigert de medewerker, omdat een bezoek uiterlijk 24 uur vooraf zichtbaar moet zijn.","Hij laat de medewerker alleen toekijken, zonder taken, omdat het bezoek niet is aangekondigd."],"answer":0,"explanation":"De medewerker bezoekt het diplomazwemmen steekproefsgewijs, zowel aangekondigd als onaangekondigd, en heeft tijdens het diplomazwemmen gewoon zijn rol en taken. De 24-uursregel gaat over het zichtbaar worden van een gedelegeerde na de aanvraag, niet over onaangekondigde bezoeken van een medewerker. §3.2, p. 42–43","ref":"§3.2, p. 42–43","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"zowel aangekondigd als onaangekondigd, het diplomazwemmen"}},{"id":"TV-0085","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"onjuist","objectives":["TV-EXT-09","TV-EXT-07","TV-EXT-08"],"question":"Welke bewering over de aangewezen medewerker van de Nationale Raad Zwemveiligheid is NIET juist?","options":["De medewerker is verantwoordelijk voor het diplomazwemmen in zijn eigen werkgebied.","De medewerker controleert in de systemen de aanvragen van het diplomazwemmen.","De medewerker bezoekt het diplomazwemmen alleen na aankondiging."],"answer":2,"explanation":"De medewerker bezoekt het diplomazwemmen steekproefsgewijs, zowel aangekondigd als onaangekondigd. Dat hij verantwoordelijk is voor het diplomazwemmen in zijn eigen werkgebied en de aanvragen in de systemen controleert, klopt. §3.2, p. 42","ref":"§3.2, p. 42","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"De medewerker bezoekt ook steekproefsgewijs, zowel aangekondigd als onaangekondigd, het diplomazwemmen."}},{"id":"TV-0086","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"verschil","objectives":["TV-EXT-10"],"question":"Wat kan een aangewezen medewerker van de Nationale Raad Zwemveiligheid tijdens het diplomazwemmen wat een gedelegeerde niet kan?","options":["Bezwaar maken tegen de organisatie en directe invloed hebben op de uitslagbepaling","De kandidaten observeren met behulp van beoordelingslijsten die de examinator aanlevert","Na afloop een verslag maken met constateringen over de kwaliteit"],"answer":0,"explanation":"De medewerker heeft dezelfde rol en taken als de gedelegeerde, maar kan daarnaast bezwaar maken tegen de organisatie en het functioneren van de Examinator, en heeft directe invloed op de uitslagbepaling. Observeren met de lijsten van de examinator en een verslag maken doen gedelegeerde en medewerker allebei. §3.2, p. 43","ref":"§3.2, p. 43","tests":"medewerker: bezwaar en directe invloed op uitslagbepaling","source":{"page":43,"quote":"heeft de medewerker directe invloed op de uitslagbepaling van het diplomazwemmen"}},{"id":"TV-0087","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"verschil","objectives":["TV-EXT-10","TV-EXT-05","TV-EXA-13"],"question":"Welke uitspraak over de invloed van de gedelegeerde en de medewerker op de uitslag is juist?","options":["De medewerker heeft directe invloed op de uitslagbepaling; de gedelegeerde stelt bezwaren vóór de uitslagbepaling kort aan de orde.","De gedelegeerde heeft directe invloed op de uitslagbepaling; de medewerker stelt bezwaren alleen in zijn verslag aan de orde.","De gedelegeerde en de medewerker bepalen samen de uitslag; de Examinator heeft alleen een adviserende rol."],"answer":0,"explanation":"Alleen de medewerker heeft directe invloed op de uitslagbepaling; de gedelegeerde kan vóór de uitslagbepaling kort aan de orde stellen dat diploma's ten <script>
"use strict";
// Het Diepe — pure logic (no DOM). Imported by tests in node and concatenated
// into index.html by tools/build.py (which strips the `export` keywords).

const CATEGORIES = [
  { key: "examenprogrammas", label: "Examenprogramma's", short: "Programma's" },
  { key: "normering", label: "Normering", short: "Normering" },
  { key: "algemene_bepalingen", label: "Algemene bepalingen", short: "Algemeen" },
  { key: "taken_verantwoordelijkheden", label: "Taken en verantwoordelijkheden", short: "Taken" },
];
const CATEGORY_KEYS = CATEGORIES.map((c) => c.key);
const EXAM_SIZE = 40;
const PASS_MARK = 29;
const EXAM_MINUTES = 40;
const STORAGE_PREFIX = "hetdiepe:v1:";
const STORAGE_KEY = STORAGE_PREFIX + "state";
const SCHEMA_VERSION = 1;
const DAY = 24 * 60 * 60 * 1000;

function categoryLabel(key) {
  const c = CATEGORIES.find((x) => x.key === key);
  return c ? c.label : key;
}

// ------------------------------------------------------------------ state
function defaultSettings() {
  return {
    timer: true,
    counts: { examenprogrammas: 10, normering: 10, algemene_bepalingen: 10, taken_verantwoordelijkheden: 10 },
    includeMaatwerk: true,
    includeCertificaten: true,
    theme: "auto",
  };
}

function emptyState() {
  return { schemaVersion: SCHEMA_VERSION, answers: {}, exams: [], inProgress: null, settings: defaultSettings() };
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

// Migration chain. Each step takes a state of version n and returns version n+1.
const MIGRATIONS = {
  // 1: (s) => ({ ...s, schemaVersion: 2, newField: ... }),
};

function migrate(raw) {
  if (!isObj(raw)) return emptyState();
  let s = { ...raw };
  let v = Number.isInteger(s.schemaVersion) ? s.schemaVersion : 1;
  while (v < SCHEMA_VERSION && MIGRATIONS[v]) {
    s = MIGRATIONS[v](s);
    v = s.schemaVersion;
  }
  const base = emptyState();
  const settings = { ...base.settings, ...(isObj(s.settings) ? s.settings : {}) };
  settings.counts = { ...base.settings.counts, ...(isObj(settings.counts) ? settings.counts : {}) };
  if (!validCounts(settings.counts)) settings.counts = { ...base.settings.counts };
  return {
    schemaVersion: SCHEMA_VERSION,
    answers: isObj(s.answers) ? s.answers : {},
    exams: Array.isArray(s.exams) ? s.exams : [],
    inProgress: isObj(s.inProgress) ? s.inProgress : null,
    settings,
  };
}

function validCounts(counts) {
  if (!isObj(counts)) return false;
  let total = 0;
  for (const k of CATEGORY_KEYS) {
    const n = counts[k];
    if (!Number.isInteger(n) || n < 0) return false;
    total += n;
  }
  return total === EXAM_SIZE;
}

// Validate an imported progress file. Returns { ok, error?, state? }.
function validateImport(obj) {
  if (!isObj(obj)) return { ok: false, error: "Dit is geen geldig voortgangsbestand." };
  const data = isObj(obj.data) ? obj.data : obj;
  if (obj.app !== undefined && obj.app !== "het-diepe") return { ok: false, error: "Dit bestand is niet van Het Diepe." };
  if (!isObj(data.answers) || !Array.isArray(data.exams)) {
    return { ok: false, error: "Het bestand mist antwoorden of examengeschiedenis." };
  }
  for (const [qid, list] of Object.entries(data.answers)) {
    if (typeof qid !== "string" || !Array.isArray(list)) return { ok: false, error: "Antwoorden hebben een onbekend formaat." };
    for (const a of list) {
      if (!isObj(a) || typeof a.correct !== "boolean" || typeof a.at !== "number") {
        return { ok: false, error: "Antwoorden hebben een onbekend formaat." };
      }
    }
  }
  for (const e of data.exams) {
    if (!isObj(e) || !Array.isArray(e.questionIds) || typeof e.score !== "number") {
      return { ok: false, error: "De examengeschiedenis heeft een onbekend formaat." };
    }
  }
  return { ok: true, state: migrate(data) };
}

function exportPayload(state, now = Date.now()) {
  return {
    app: "het-diepe",
    exportedAt: new Date(now).toISOString(),
    schemaVersion: SCHEMA_VERSION,
    data: { answers: state.answers, exams: state.exams, inProgress: state.inProgress, settings: state.settings },
  };
}

// Clears answers, exam history and in-progress exam; keeps settings.
function resetProgress(state) {
  return { ...emptyState(), settings: { ...state.settings } };
}

// ------------------------------------------------------------------ rng
function makeRng(seed) {
  let a = (seed >>> 0) || 0x9e3779b9;
  return function rng() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ------------------------------------------------------------------ bank helpers
function indexBank(bank) {
  const qById = new Map();
  for (const q of bank.questions) qById.set(q.id, q);
  const oById = new Map();
  for (const o of bank.objectives) oById.set(o.id, o);
  const qByObj = new Map();
  for (const q of bank.questions) {
    for (const oid of q.objectives) {
      if (!qByObj.has(oid)) qByObj.set(oid, []);
      qByObj.get(oid).push(q.id);
    }
  }
  return { qById, oById, qByObj };
}

function idx(bank) {
  if (!bank._idx) Object.defineProperty(bank, "_idx", { value: indexBank(bank), enumerable: false });
  return bank._idx;
}

function sectionOf(bank, q) {
  const o = idx(bank).oById.get(q.objectives[0]);
  return o ? o.section : "?";
}

// Top-level grouping used in the coverage view and the practice scope list.
function chapterOf(section) {
  if (!section) return "?";
  if (/^Bijlage/.test(section)) return section;
  if (/^(Inleiding|Aanleiding|NRZ)$/.test(section)) return "Inleiding";
  if (/^Handleiding/.test(section)) return "3";
  const m = /^(\d+)/.exec(section);
  return m ? m[1] : section;
}

const CHAPTER_LABELS = {
  Inleiding: "Inleiding, Aanleiding en NRZ",
  1: "H1 Examenprogramma's",
  2: "H2 Normering en algemene bepalingen",
  3: "H3 Kwaliteitsborging",
  4: "H4 Maatwerk",
  "Bijlage 1": "Bijlage 1 Definities",
  "Bijlage 2": "Bijlage 2 Onderdelen",
  "Bijlage 3": "Bijlage 3 Basiselementen",
};

function lastAnswer(answers, qid) {
  const list = answers[qid];
  if (!Array.isArray(list) || list.length === 0) return null;
  let best = list[0];
  for (const a of list) if (a.at >= best.at) best = a;
  return best;
}

function isEligible(q, settings) {
  if (!settings.includeMaatwerk && q.subtopic === "maatwerk") return false;
  if (!settings.includeCertificaten && q.subtopic === "zwemcertificaten") return false;
  return true;
}

// ------------------------------------------------------------------ coverage
// Gezien: at least one question of the objective answered.
// Beheerst: the most recent answer among its questions was correct.
function coverage(bank, answers) {
  const { qByObj } = idx(bank);
  const perObjective = {};
  const perCategory = {};
  const perChapter = {};
  let seen = 0;
  let mastered = 0;
  for (const c of CATEGORY_KEYS) perCategory[c] = { total: 0, seen: 0, mastered: 0 };
  for (const o of bank.objectives) {
    let latest = null;
    for (const qid of qByObj.get(o.id) || []) {
      const a = lastAnswer(answers, qid);
      if (a && (!latest || a.at >= latest.at)) latest = a;
    }
    const st = { seen: !!latest, mastered: !!(latest && latest.correct) };
    perObjective[o.id] = st;
    const pc = perCategory[o.category] || (perCategory[o.category] = { total: 0, seen: 0, mastered: 0 });
    const ch = chapterOf(o.section);
    const pch = perChapter[ch] || (perChapter[ch] = { total: 0, seen: 0, mastered: 0, sections: {} });
    const ps = pch.sections[o.section] || (pch.sections[o.section] = { total: 0, seen: 0, mastered: 0 });
    for (const bucket of [pc, pch, ps]) {
      bucket.total++;
      if (st.seen) bucket.seen++;
      if (st.mastered) bucket.mastered++;
    }
    if (st.seen) seen++;
    if (st.mastered) mastered++;
  }
  let answeredQuestions = 0;
  const known = idx(bank).qById;
  for (const [qid, list] of Object.entries(answers)) if (known.has(qid) && list && list.length) answeredQuestions++;
  return {
    perObjective, perCategory, perChapter,
    total: bank.objectives.length, seen, mastered,
    answeredQuestions, totalQuestions: bank.questions.length,
  };
}

// ------------------------------------------------------------------ picking an exam
function questionPriority(q, answers, now, uncovered, rng) {
  const last = lastAnswer(answers, q.id);
  let s;
  if (!last) s = 100;
  else if (!last.correct) s = 50 + Math.min(25, ((now - last.at) / DAY) * 2);
  else s = 5 + Math.min(12, ((now - last.at) / DAY) * 0.4);
  if (q.objectives.some((o) => uncovered.has(o))) s += 15;
  return s + rng() * 4;
}

// Returns { questionIds, optionOrders } with exactly sum(counts) questions when the bank allows it.
function pickExam(bank, progress, settings, rng, now = Date.now()) {
  const answers = (progress && progress.answers) || {};
  const counts = validCounts(settings.counts) ? settings.counts : defaultSettings().counts;
  const cov = coverage(bank, answers);
  const uncovered = new Set(Object.keys(cov.perObjective).filter((k) => !cov.perObjective[k].seen));
  const chosen = [];
  const chosenSet = new Set();
  const usedTests = new Set();
  const objCount = new Map();
  const sectionCount = new Map();
  const norm = (s) => String(s || "").trim().toLowerCase();

  const take = (q) => {
    chosen.push(q);
    chosenSet.add(q.id);
    usedTests.add(norm(q.tests));
    for (const o of q.objectives) objCount.set(o, (objCount.get(o) || 0) + 1);
    const sec = sectionOf(bank, q);
    sectionCount.set(sec, (sectionCount.get(sec) || 0) + 1);
  };
  const lastAt = (q) => {
    const a = lastAnswer(answers, q.id);
    return a ? a.at : -Infinity;
  };

  // Phase per category, with progressively relaxed rules.
  const deficits = {};
  for (const cat of CATEGORY_KEYS) {
    const need = counts[cat];
    const pool = bank.questions.filter((q) => q.category === cat);
    const eligible = pool.filter((q) => isEligible(q, settings));
    const scored = new Map(eligible.map((q) => [q.id, questionPriority(q, answers, now, uncovered, rng)]));
    let got = 0;

    // 1) greedy by score with all constraints + section spread
    while (got < need) {
      let best = null;
      let bestScore = -Infinity;
      for (const q of eligible) {
        if (chosenSet.has(q.id) || usedTests.has(norm(q.tests))) continue;
        if (q.objectives.some((o) => (objCount.get(o) || 0) >= 2)) continue;
        const eff = scored.get(q.id) - 6 * (sectionCount.get(sectionOf(bank, q)) || 0);
        if (eff > bestScore) { bestScore = eff; best = q; }
      }
      if (!best) break;
      take(best); got++;
    }
    // 2) fallback: least recently seen eligible questions, still no duplicate `tests`
    if (got < need) {
      const rest = eligible.filter((q) => !chosenSet.has(q.id) && !usedTests.has(norm(q.tests)))
        .sort((a, b) => lastAt(a) - lastAt(b));
      for (const q of rest) { if (got >= need) break; take(q); got++; }
    }
    // 3) fallback: least recently seen of the whole category (also toggled-off subtopics)
    if (got < need) {
      const rest = pool.filter((q) => !chosenSet.has(q.id)).sort((a, b) => lastAt(a) - lastAt(b));
      for (const q of rest) { if (got >= need) break; take(q); got++; }
    }
    deficits[cat] = need - got;
  }
  // 4) a category had too few questions at all: fill from anywhere, least recently seen first.
  const missing = Object.values(deficits).reduce((a, b) => a + b, 0);
  if (missing > 0) {
    const rest = bank.questions.filter((q) => !chosenSet.has(q.id))
      .sort((a, b) => (usedTests.has(norm(a.tests)) - usedTests.has(norm(b.tests))) || (lastAt(a) - lastAt(b)));
    for (const q of rest.slice(0, missing)) take(q);
  }

  const ordered = shuffle(chosen, rng);
  return {
    questionIds: ordered.map((q) => q.id),
    optionOrders: ordered.map(() => shuffle([0, 1, 2], rng)),
  };
}

// ------------------------------------------------------------------ exams
function newExam(bank, state, rng, now = Date.now(), timerMinutes = EXAM_MINUTES) {
  const picked = pickExam(bank, state, state.settings, rng, now);
  const timed = !!state.settings.timer;
  return {
    id: "ex-" + now.toString(36) + "-" + Math.floor(rng() * 1e6).toString(36),
    startedAt: now,
    timed,
    deadline: timed ? now + timerMinutes * 60 * 1000 : null,
    questionIds: picked.questionIds,
    optionOrders: picked.optionOrders,
    answers: picked.questionIds.map(() => null), // original option index chosen, or null
    flags: picked.questionIds.map(() => false),
    current: 0,
  };
}

function timeLeftMs(exam, now = Date.now()) {
  if (!exam || !exam.deadline) return null;
  return Math.max(0, exam.deadline - now);
}

function scoreExam(bank, exam) {
  const { qById } = idx(bank);
  const perCategory = {};
  for (const c of CATEGORY_KEYS) perCategory[c] = { correct: 0, total: 0 };
  let score = 0;
  let unanswered = 0;
  exam.questionIds.forEach((qid, i) => {
    const q = qById.get(qid);
    const cat = q ? q.category : "onbekend";
    const pc = perCategory[cat] || (perCategory[cat] = { correct: 0, total: 0 });
    pc.total++;
    const a = exam.answers[i];
    if (a === null || a === undefined) { unanswered++; return; }
    if (q && a === q.answer) { score++; pc.correct++; }
  });
  return { score, total: exam.questionIds.length, perCategory, unanswered, passed: score >= PASS_MARK };
}

// Submitting records answered questions (not blanks) and appends the exam to history.
function submitExam(bank, state, now = Date.now(), auto = false) {
  const exam = state.inProgress;
  if (!exam) return state;
  const { qById } = idx(bank);
  const res = scoreExam(bank, exam);
  const answers = { ...state.answers };
  const at = Math.min(now, exam.deadline || now);
  exam.questionIds.forEach((qid, i) => {
    const a = exam.answers[i];
    const q = qById.get(qid);
    if (a === null || a === undefined || !q) return;
    answers[qid] = [...(answers[qid] || []), { at, correct: a === q.answer, mode: "exam" }];
  });
  const record = {
    ...exam,
    submittedAt: at,
    durationMs: Math.max(0, at - exam.startedAt),
    score: res.score,
    total: res.total,
    perCategory: res.perCategory,
    unanswered: res.unanswered,
    passed: res.passed,
    autoSubmitted: !!auto,
  };
  delete record.current;
  return { ...state, answers, exams: [...state.exams, record], inProgress: null };
}

// Abandoned exams don't count anywhere.
function abandonExam(state) {
  return { ...state, inProgress: null };
}

function recordPractice(state, qid, correct, now = Date.now()) {
  const answers = { ...state.answers };
  answers[qid] = [...(answers[qid] || []), { at: now, correct: !!correct, mode: "practice" }];
  return { ...state, answers };
}

// ------------------------------------------------------------------ practice sets
// scope: { kind: "category"|"subtopic"|"chapter"|"section"|"wrong"|"unseen"|"mix"|"objectives", value }
function practiceSet(bank, state, scope, n, rng, now = Date.now()) {
  const answers = state.answers || {};
  let pool = bank.questions;
  const kind = scope && scope.kind;
  if (kind === "category") pool = pool.filter((q) => q.category === scope.value);
  else if (kind === "subtopic") pool = pool.filter((q) => q.subtopic === scope.value);
  else if (kind === "chapter") pool = pool.filter((q) => chapterOf(sectionOf(bank, q)) === scope.value);
  else if (kind === "section") pool = pool.filter((q) => sectionOf(bank, q) === scope.value);
  else if (kind === "wrong") pool = pool.filter((q) => { const a = lastAnswer(answers, q.id); return a && !a.correct; });
  else if (kind === "unseen") pool = pool.filter((q) => !lastAnswer(answers, q.id));
  else if (kind === "objectives") {
    const set = new Set(scope.value || []);
    pool = pool.filter((q) => q.objectives.some((o) => set.has(o)));
  }
  const cov = coverage(bank, answers);
  const uncovered = new Set(Object.keys(cov.perObjective).filter((k) => !cov.perObjective[k].seen));
  let ordered;
  if (kind === "objectives") {
    // one question per objective first (best-scored), then the rest
    const set = scope.value || [];
    const byPriority = (a, b) => b._p - a._p;
    const scored = pool.map((q) => ({ q, _p: questionPriority(q, answers, now, uncovered, rng) })).sort(byPriority);
    const first = [];
    const used = new Set();
    for (const oid of set) {
      const hit = scored.find((x) => !used.has(x.q.id) && x.q.objectives.includes(oid));
      if (hit) { first.push(hit.q); used.add(hit.q.id); }
    }
    ordered = [...first, ...scored.filter((x) => !used.has(x.q.id)).map((x) => x.q)];
  } else if (kind === "mix") {
    ordered = pool.map((q) => ({ q, p: questionPriority(q, answers, now, uncovered, rng) }))
      .sort((a, b) => b.p - a.p).map((x) => x.q);
  } else {
    ordered = shuffle(pool, rng);
  }
  const limit = n && n > 0 ? n : ordered.length;
  const ids = ordered.slice(0, limit).map((q) => q.id);
  return { questionIds: ids, optionOrders: ids.map(() => shuffle([0, 1, 2], rng)) };
}

// ------------------------------------------------------------------ study list
function studyList(bank, answers, category = null) {
  const cov = coverage(bank, answers);
  return bank.objectives
    .filter((o) => !cov.perObjective[o.id].mastered)
    .filter((o) => !category || o.category === category)
    .map((o) => ({ ...o, seen: cov.perObjective[o.id].seen }));
}

}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "html") el.innerHTML = v;
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c && c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

function dialog({ title, body, actions }) {
  return new Promise((resolve) => {
    const dlg = h("dialog", { "aria-labelledby": "dlg-title" });
    const close = (v) => { try { dlg.close(); } catch (e) { /* ignore */ } dlg.remove(); resolve(v); };
    dlg.append(
      h("div", { class: "dlg-body" }, h("h2", { id: "dlg-title" }, title), ...(Array.isArray(body) ? body : [body])),
      h("div", { class: "dlg-actions" }, actions.map((a) =>
        h("button", { class: "btn " + (a.cls || ""), type: "button", onclick: () => close(a.value) }, a.label))));
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(null); });
    document.body.append(dlg);
    if (typeof dlg.showModal === "function") {
      dlg.showModal();
      // Destructive dialogs focus "Annuleren" so a stray Enter never wipes anything.
      const destructive = actions.some((a) => /danger/.test(a.cls || ""));
      const target = dlg.querySelector(destructive ? ".dlg-actions .btn:first-child" : ".dlg-actions .btn:last-child");
      if (target) target.focus();
    } else {
      dlg.remove();
      resolve(window.confirm(title) ? actions[actions.length - 1].value : null);
    }
  });
}

function page(...content) {
  document.body.classList.remove("exam-mode");

function render() {
  stopTimer();
  const app = document.getElementById("app");
  app.innerHTML = "";
  let nodes;
  switch (view.name) {
    case "resume": nodes = renderResume(); break;
    case "examIntro": nodes = renderExamIntro(); break;
    case "exam": nodes = renderExam(); break;
    case "results": nodes = renderResults(); break;
    case "review": nodes = renderReview(); break;
    case "practiceSetup": nodes = renderPracticeSetup(); break;
    case "practice": nodes = renderPractice(); break;
    case "progress": nodes = renderProgress(); break;
    case "settings": nodes = renderSettings(); break;
    default: nodes = renderDashboard();
  }
  app.append(...nodes);
  document.getElementById("bank-version").textContent = `Vragenbank ${CONFIG.BANK_VERSION || BANK.version || ""}`;
  if (view.name === "exam") startTimer();
}

function selectExamAnswer(orig) {
  const ex = state.inProgress;
  if (!ex) return;
  ex.answers[ex.current] = orig;
  commit({ ...state });
  render();
  const btns = document.querySelectorAll(".option");
  const pos = ex.optionOrders[ex.current].indexOf(orig);
  if (btns[pos]) btns[pos].focus({ preventScroll: true });
}
function moveExam(d) {
  const ex = state.inProgress;
  if (!ex) return;
  const n = Math.min(Math.max(ex.current + d, 0), ex.questionIds.length - 1);
  if (n === ex.current) return;
  ex.current = n;
  commit({ ...state });
  render();
  const qt = document.getElementById("qtext");
  if (qt) qt.focus({ preventScroll: true });
}
function toggleFlag() {
  const ex = state.inProgress;
  if (!ex) return;
  ex.flags[ex.current] = !ex.flags[ex.current];
  commit({ ...state });
  render();
}
async function submitFlow() {
  const ex = state.inProgress;
  if (!ex) return;
  const unanswered = ex.answers.filter((a) => a === null).length;
  const flagged = ex.flags.filter(Boolean).length;
  const body = [
    h("p", null, unanswered ? `Je hebt ${unanswered} ${unanswered === 1 ? "vraag" : "vragen"} niet beantwoord.` : "Je hebt alle vragen beantwoord."),
    h("p", null, flagged ? `${flagged} ${flagged === 1 ? "vraag is" : "vragen zijn"} gemarkeerd.` : "Er zijn geen gemarkeerde vragen."),
    unanswered ? h("p", { class: "muted small" }, "Onbeantwoorde vragen tellen als fout.") : null,
  ];
  const ok = await confirmDialog("Examen inleveren?", body, "Inleveren", false);
  if (ok && state.inProgress) finishExam(false);
}
function finishExam(auto) {
  commit(submitExam(BANK, state, Date.now(), auto));
  if (auto) notice = "De tijd was om. Je examen is automatisch ingeleverd met de antwoorden die je had gegeven.";
  go("results", { examIndex: state.exams.length - 1, fresh: true });
}

// ----- timer
function startTimer() {
  const ex = state.inProgress;
  if (!ex || !ex.timed) return;
  const tick = () => {
    const cur = state.inProgress;
    if (!cur) return stopTimer();
    const left = timeLeftMs(cur);
    const el = document.getElementById("timer");
    if (el) {
      el.textContent = formatDuration(left);
      el.classList.toggle("warn", left <= 5 * 60 * 1000 && left > 60 * 1000);
      el.classList.toggle("crit", left <= 60 * 1000);
    }
    if (left <= 5 * 60 * 1000 && !cur.warned5 && left > 60 * 1000) {
      cur.warned5 = true; commit({ ...state }); announce("Nog 5 minuten.", true);
    }
    if (left <= 60 * 1000 && !cur.warned1 && left > 0) {
      cur.warned1 = true; cur.warned5 = true; commit({ ...state }); announce("Nog 1 minuut.", true);
    }
    if (left <= 0) {
      stopTimer();
      const dlg = document.querySelector("dialog");
      if (dlg) { try { dlg.close(); } catch (e) { /* ignore */ } dlg.remove(); }
      announce("De tijd is om. Je examen is ingeleverd.", true);
      finishExam(true);
    }
  };
  tick();
  timerHandle = setInterval(tick, 250);
}
function stopTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = null;
}

    msg ? h("p", { class: "note", role: "status" }, msg) : null,
    h("section", { class: "card result-hero" },
      h("div", { class: "kicker" }, "Uitslag oefenexamen"),

      h("p", { class: "quip" }, quip),

        h("button", { class: "btn", type: "button", onclick: () => go("examIntro") }, "Nieuw examen"),

function sourceBlock(q) {
  if (!CONFIG.SHOW_SOURCE_QUOTES || !q.source) return null;
  const doc = q.source.doc === "handleiding" ? "Handleiding toets Examinator (mei 2024)" : "Examenregeling (maart 2018)";
  const pg = typeof q.source.page === "number" ? `p. ${q.source.page}` : q.source.page;
  return h("blockquote", { class: "source" }, `“${q.source.quote}”`, h("cite", null, `${doc}, ${pg}`));
}

function renderReview() {
  const e = state.exams[view.examIndex];
  if (!e) return renderDashboard();
  const rows = e.questionIds.map((qid, i) => ({ q: QMAP.get(qid), i, a: e.answers[i], flag: e.flags && e.flags[i], order: e.optionOrders[i] }))
    .filter((r) => r.q);
  const status = (r) => (r.a === null || r.a === undefined ? "blank" : r.a === r.q.answer ? "right" : "wrong");
  const filters = [
    ["alles", "Alles", rows.length],
    ["fout", "Fout", rows.filter((r) => status(r) === "wrong").length],
    ["gemarkeerd", "Gemarkeerd", rows.filter((r) => r.flag).length],

function confetti() {

// ===================================================================== practice

async function startPractice(scope, n, label) {
  const set = practiceSet(BANK, state, scope, n, rng);
  if (set.questionIds.length === 0) {
    await infoDialog("Geen vragen gevonden", scope.kind === "wrong" ? "Je hebt (nog) niets fout beantwoord. Lekker bezig." : "In deze selectie zitten (nu) geen vragen.");
    return;
  }
  practice = { ...set, label, i: 0, chosen: null, correct: 0, done: 0 };
  go("practice");
}

function renderPractice() {
  if (!practice) return renderPracticeSetup();
  const p = practice;
  if (p.i >= p.questionIds.length) {
    const score = p.correct;
    const total = p.done;
    const ratio = total ? score / total : 0;
    const line = ratio >= 0.9 ? "Strak gezwommen. Geen spat te veel." : ratio >= 0.725 ? "Mooi baantje. Nog even doortrainen." : "Dat was even watertrappen. Volgende ronde gaat beter.";
    return page(h("section", { class: "card result-hero", style: "max-width:640px;margin:0 auto" },
      h("div", { class: "kicker" }, `Oefenen · ${p.label}`),
      h("div", { class: "result-score" }, `${score}/${total}`),
      h("p", { class: "quip" }, line),
      h("div", { class: "btn-row", style: "justify-content:center" },
        h("button", { class: "btn primary", type: "button", onclick: () => go("practiceSetup") }, "Nog een ronde"),
        h("button", { class: "btn", type: "button", onclick: () => go("progress") }, "Bekijk voortgang"),
        h("button", { class: "btn ghost", type: "button", onclick: () => go("dashboard") }, "Naar overzicht"))));
  }
  const q = QMAP.get(p.questionIds[p.i]);
  const order = p.optionOrders[p.i];
  const answered = p.chosen !== null;
  const isRight = answered && p.chosen === q.answer;
  const correctPos = order.indexOf(q.answer);
  return page(
    h("div", { class: "btn-row", style: "margin-bottom:10px" },
      h("span", { class: "kicker" }, `Oefenen · ${p.label}`),
      h("span", { class: "spacer", style: "flex:1" }),
      h("span", { class: "muted small" }, `${p.correct} van ${p.done} goed`),
      h("button", { class: "btn small ghost", type: "button", onclick: () => { p.questionIds = p.questionIds.slice(0, p.i); render(); } }, "Stoppen")),
    h("section", { class: "qpanel" },
      h("div", { class: "qnum" }, `Vraag ${p.i + 1} van ${p.questionIds.length}`, h("span", { class: "pill" }, categoryLabel(q.category))),
      h("p", { class: "qtext", id: "qtext", tabindex: "-1" }, q.question),
      h("div", { class: "options", role: answered ? "group" : "radiogroup", "aria-labelledby": "qtext" },
        order.map((orig, pos) => h("button", {
          class: "option" + (answered && orig === q.answer ? " correct" : "") + (answered && orig === p.chosen && orig !== q.answer ? " wrong" : ""),
          type: "button", role: answered ? null : "radio", "aria-checked": answered ? null : "false", disabled: answered,
          onclick: () => answerPractice(orig),
        }, h("span", { class: "letter" }, LETTERS[pos]), h("span", null, q.options[orig])))),
      answered ? h("div", { class: "feedback " + (isRight ? "ok" : "bad") },
        h("div", { class: "verdict" }, isRight ? "Goed!" : `Helaas. Het juiste antwoord is ${LETTERS[correctPos]}.`),
        h("p", null, q.explanation),
        h("div", { class: "ref" }, q.ref),
        sourceBlock(q)) : null,
      h("div", { class: "exam-nav" },
        answered ? h("button", { class: "btn primary", type: "button", id: "next-btn", onclick: nextPractice },
          p.i < p.questionIds.length - 1 ? "Volgende →" : "Afronden") : h("span", { class: "muted small" }, "Kies A, B of C."))));
}

function answerPractice(orig) {
  const p = practice;
  if (!p || p.chosen !== null) return;
  const q = QMAP.get(p.questionIds[p.i]);
  p.chosen = orig;
  p.done++;
  const right = orig === q.answer;
  if (right) p.correct++;
  commit(recordPractice(state, q.id, right));
  render();
  announce(right ? "Goed!" : `Helaas, het juiste antwoord is ${LETTERS[p.optionOrders[p.i].indexOf(q.answer)]}.`);
  const nb = document.getElementById("next-btn");
  if (nb) nb.focus({ preventScroll: true });
}
function nextPractice() {
  const p = practice;
  if (!p) return;
  p.i++;
  p.chosen = null;
  render();
  const qt = document.getElementById("qtext");
  if (qt) qt.focus({ preventScroll: true });
}

function exportProgress() {
  const payload = exportPayload(state);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: `het-diepe-voortgang-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  announce("Voortgang geëxporteerd.");
}

function importFlow(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    const res = validateImport(parsed);
    if (!res.ok) { await infoDialog("Importeren lukt niet", res.error); return; }
    const n = Object.keys(res.state.answers).length;
    const ok = await confirmDialog("Voortgang vervangen?",
      `Het bestand bevat antwoorden op ${n} vragen en ${res.state.exams.length} examens. Je huidige voortgang in deze browser wordt hierdoor vervangen.`,
      "Vervangen", true);
    if (!ok) return;
    commit(res.state);
    applyTheme();
    announce("Voortgang geïmporteerd.");
    go("progress");
  };
  reader.onerror = () => infoDialog("Importeren lukt niet", "Het bestand kon niet worden gelezen.");
  reader.readAsText(file);
}

async function resetFlow() {
  const ok = await confirmDialog("Voortgang wissen?",
    "Al je antwoorden, je examengeschiedenis en een eventueel open examen worden gewist. Je instellingen blijven bewaard. Dit kun je niet ongedaan maken (tenzij je eerst exporteert).",
    "Wissen", true);
  if (!ok) return;
  commit(resetProgress(state));
  practice = null;
  announce("Voortgang gewist.");
  go("dashboard");
}

// ===================================================================== keyboard
document.addEventListener("keydown", (ev) => {
  if (ev.defaultPrevented || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (document.querySelector("dialog[open]")) return;
  const tag = (ev.target && ev.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  const choice = { 1: 0, 2: 1, 3: 2, a: 0, b: 1, c: 2 }[key];
  const onButton = tag === "BUTTON" || tag === "A" || tag === "LABEL";
  if (view.name === "exam" && state.inProgress) {
    const ex = state.inProgress;
    if (choice !== undefined) { ev.preventDefault(); selectExamAnswer(ex.optionOrders[ex.current][choice]); }
    else if (key === "ArrowRight") { ev.preventDefault(); moveExam(1); }
    else if (key === "ArrowLeft") { ev.preventDefault(); moveExam(-1); }
    else if (key === "f") { ev.preventDefault(); toggleFlag(); }
    else if (key === "Enter" && !(onButton && !ev.target.classList.contains("option"))) {
      ev.preventDefault();
      if (ex.current < ex.questionIds.length - 1) moveExam(1); else submitFlow();
    }
  } else if (view.name === "practice" && practice && practice.i < practice.questionIds.length) {
    if (choice !== undefined && practice.chosen === null) { ev.preventDefault(); answerPractice(practice.optionOrders[practice.i][choice]); }
    else if (key === "Enter" && practice.chosen !== null && !onButton) { ev.preventDefault(); nextPractice(); }
    else if (key === "ArrowRight" && practice.chosen !== null) { ev.preventDefault(); nextPractice(); }
  }
});

window.addEventListener("resize", () => {
  if (view.name !== "exam") return;
  const small = window.innerWidth <= 860;
  if (small !== ui.lastSmall) { ui.lastSmall = small; ui.panelOpen = !small; render(); }
});
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => { if (state.settings.theme === "auto") render(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange);
}

  applyTheme();
  renderBanner();
  ui.lastSmall = window.innerWidth <= 860;
  const ex = state.inProgress;
  if (ex) {
    const unknown = ex.questionIds.some((id) => !QMAP.has(id));
    if (unknown || !Array.isArray(ex.answers)) {
      commit(abandonExam(state));
      notice = null;
      go("dashboard");
      infoDialog("Open examen vervallen", "De vragenbank is bijgewerkt sinds je dit examen startte. Het open examen is daarom vervallen en telt nergens mee.");
      return;
    }
    if (ex.timed && timeLeftMs(ex) <= 0) {
      commit(submitExam(BANK, state, Date.now(), true));
      notice = "Je had nog een examen open, maar de tijd was al om. Het is automatisch ingeleverd met de antwoorden die je had gegeven.";
      go("results", { examIndex: state.exams.length - 1, fresh: true });
      return;
    }
    go("resume");
    return;
  }
  go("dashboard");
}
boot();
</script>
</body>
</html>
