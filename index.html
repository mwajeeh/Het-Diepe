weede 25 meter schoolslag van A3 Conditiezwemmen. Bij B wordt de proef B6 Oriënteren boven water en verplaatsen ermee afgerond. In A5, B3, A6 en B2 komt dit onderdeel niet voor. §2.1.1–2.1.2, p. 18 en 26","ref":"§2.1.1–2.1.2, p. 18 en 26","tests":"voetwaarts zakken: A3 vs B6","source":{"page":26,"quote":"1 keer voetwaarts richting de bodem zakken"}},{"id":"NO-0212","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-10"],"question":"Een kandidaat voor Zwemdiploma C gaat bij C3 hoofdwaarts richting de bodem, maar doet dat vrij schuin in plaats van zo verticaal mogelijk. Zijn benen komen geheel onder water. Wat beslist de examinator?","options":["Voldoende: zo verticaal mogelijk heeft de voorkeur, maar wordt niet beoordeeld.","Onvoldoende: de beweging moet zo verticaal mogelijk worden uitgevoerd.","Onvoldoende: bij C3 moet de kandidaat voetwaarts richting de bodem zakken."],"answer":0,"explanation":"Hoofdwaarts richting de bodem gaan wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dat wordt niet bij de beoordeling betrokken. De benen komen geheel onder water, dus het onderdeel is voldoende. Voetwaarts richting de bodem zakken hoort bij A3 en B6, niet bij C3. §2.1.3, p. 30","ref":"§2.1.3, p. 30","tests":"hoofdwaarts: verticaal is voorkeur, niet beoordeeld","source":{"page":30,"quote":"De beweging wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dit wordt niet bij de"}},{"id":"NO-0213","category":"normering","subtopic":"onder_water","type":"onjuist","objectives":["NO-ONDW-09"],"question":"Welke bewering over hoofdwaarts richting de bodem gaan bij C3 is NIET juist?","options":["De benen komen geheel onder water.","Het onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter.","Het onderdeel onderbreekt de 75 meter enkelvoudige rugslag."],"answer":2,"explanation":"Hoofdwaarts richting de bodem gaan onderbreekt de 75 meter schoolslag, niet de enkelvoudige rugslag. Dat de benen geheel onder water komen en dat dit onderdeel in minimaal 1,8 meter waterdiepte wordt uitgevoerd, zijn wel normen van C3. §2.1.3, p. 29–30","ref":"§2.1.3, p. 29–30","tests":"C3: hoofdwaarts onderbreekt de 75 m schoolslag","source":{"page":29,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan"}},{"id":"NO-0214","category":"normering","subtopic":"onder_water","type":"verschil","objectives":["NO-ONDW-09","NO-ONDW-07"],"question":"Wat is een verschil tussen de normering van voetwaarts richting de bodem zakken (A3) en hoofdwaarts richting de bodem gaan (C3)?","options":["Bij voetwaarts zijn de armen gestrekt boven het hoofd; bij hoofdwaarts komen de benen geheel onder water.","Bij voetwaarts is minimaal 1,8 meter waterdiepte vereist; bij hoofdwaarts geldt geen minimale diepte.","Bij hoofdwaarts wordt de verticale uitvoering beoordeeld; bij voetwaarts wordt die niet beoordeeld."],"answer":0,"explanation":"Voetwaarts zakken vraagt armen die gestrekt boven het hoofd zijn en onder water gestrekt blijven; bij hoofdwaarts gaan is de eis dat de benen geheel onder water komen. Beide onderdelen worden uitgevoerd in minimaal 1,8 meter waterdiepte. Bij hoofdwaarts wordt de verticale uitvoering juist niet bij de beoordeling betrokken. §2.1.1 en 2.1.3, p. 19 en 30","ref":"§2.1.1 en 2.1.3, p. 19 en 30","tests":"voetwaarts (armen gestrekt) vs hoofdwaarts (benen geheel onder water)","source":{"page":30,"quote":"De benen komen geheel onder water. • Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."}},{"id":"NO-0215","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-02","NO-COND-01"],"question":"Een kandidaat voor Zwemdiploma A zwemt de eerste 50 meter van A3 technisch goed. In de tweede 50 meter is zijn schoolslag niet meer symmetrisch, maar hij komt nog met een redelijk voortstuwingsrendement vooruit. Wat beslist de examinator?","options":["Voldoende: in de tweede 50 meter wordt de uitvoering van de zwemslagen niet beoordeeld.","Onvoldoende: het bewegingsverloop moet over de hele 100 meter symmetrisch zijn.","Onvoldoende: de tweede 25 meter schoolslag wordt opnieuw op uitvoering beoordeeld."],"answer":0,"explanation":"Bij A3 wordt de uitvoering van de schoolslag en de enkelvoudige rugslag alleen in de eerste 50 meter beoordeeld. Daarna moet er nog wel een redelijk voortstuwingsrendement zijn, maar de uitvoering telt niet mee. Er is dus geen symmetrie-eis over de hele 100 meter en geen tweede techniekbeoordeling. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A3/B3: na 50 m uitvoering niet beoordeeld, wel voortstuwingsrendement","source":{"page":18,"quote":"De uitvoering van de zwemslagen wordt in de tweede 50 meter niet meegenomen in de beoordeling."}},{"id":"NO-0216","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-02","NO-COND-03"],"question":"Welke bewering over de beoordeling van B3 Conditiezwemmen is NIET juist?","options":["Er wordt in totaal 150 meter achter elkaar gezwommen.","Na de eerste 50 meter wordt de uitvoering van de zwemslagen niet meer beoordeeld.","Na de eerste 50 meter is een redelijk voortstuwingsrendement niet meer vereist."],"answer":2,"explanation":"Ook na de eerste 50 meter moet er bij B3 nog sprake zijn van een redelijk voortstuwingsrendement; alleen de uitvoering van de zwemslagen telt dan niet meer mee. De 150 meter achter elkaar en het niet meer beoordelen van de uitvoering na 50 meter zijn wel juist. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"A3/B3: na 50 m uitvoering niet beoordeeld, wel voortstuwingsrendement","source":{"page":24,"quote":"Er is na de eerste 50 meter ook nog sprake van een redelijk voortstuwingsrendement"}},{"id":"NO-0217","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-03"],"question":"Welke normering voor de conditie geldt bij de proef B3 Conditiezwemmen?","options":["150 meter achter elkaar; schoolslag en enkelvoudige rugslag wisselen iedere 25 meter","150 meter achter elkaar; na 75 meter wordt de schoolslag afgewisseld door de enkelvoudige rugslag","100 meter aaneengesloten; schoolslag en enkelvoudige rugslag wisselen iedere 25 meter"],"answer":0,"explanation":"Bij B3 wordt 150 meter achter elkaar gezwommen, waarbij schoolslag en enkelvoudige rugslag iedere 25 meter worden afgewisseld. Wisselen na 75 meter is de normering bij C3. 100 meter aaneengesloten is de afstand bij A3. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"B3 conditie: 150 m, wisselen iedere 25 m","source":{"page":24,"quote":"De schoolslag en enkelvoudige rugslag worden iedere 25 meter afgewisseld."}},{"id":"NO-0218","category":"normering","subtopic":"conditiezwemmen","type":"verschil","objectives":["NO-COND-05","NO-COND-03"],"question":"Wat is een verschil in de normering van de conditie bij de proef Conditiezwemmen tussen Zwemdiploma B en Zwemdiploma C?","options":["Bij B wisselen de zwemslagen iedere 25 meter, bij C na 75 meter.","Bij B wordt 100 meter gezwommen, bij C 150 meter.","Bij B worden beide zwemslagen op uitvoering beoordeeld, bij C alleen de schoolslag."],"answer":0,"explanation":"Bij B worden schoolslag en enkelvoudige rugslag iedere 25 meter afgewisseld; bij C wordt de schoolslag na 75 meter afgewisseld door de enkelvoudige rugslag. B en C zwemmen allebei 150 meter; 100 meter is A. Bij C wordt de uitvoering van beide zwemslagen beoordeeld, elk in de eerste 25 meter. §2.1.2–2.1.3, p. 24 en 30","ref":"§2.1.2–2.1.3, p. 24 en 30","tests":"conditie: wisselen iedere 25 m (A/B) vs na 75 m (C)","source":{"page":30,"quote":"De schoolslag wordt na 75 meter afgewisseld door de enkelvoudige rugslag."}},{"id":"NO-0219","category":"normering","subtopic":"conditiezwemmen","type":"verschil","objectives":["NO-COND-04","NO-COND-01"],"question":"Welk deel van de proef Conditiezwemmen wordt op de uitvoering van de zwemslagen beoordeeld bij Zwemdiploma A en B, en welk deel bij Zwemdiploma C?","options":["Bij A en B de eerste 50 meter van de proef; bij C de eerste 25 meter van elke 75 meter","Bij A en B de laatste 50 meter van de proef; bij C de laatste 25 meter van elke 75 meter","Bij A en B de totale afstand; bij C alleen de eerste 25 meter schoolslag"],"answer":0,"explanation":"Bij A3 en B3 wordt de uitvoering van schoolslag en enkelvoudige rugslag in de eerste 50 meter van de proef beoordeeld. Bij C3 gebeurt dat in de eerste 25 meter van de 75 meter met de betreffende zwemslag, dus voor beide zwemslagen. In de overige meters wordt bij alle drie het volhouden van de afstand beoordeeld, niet de uitvoering. §2.1.1–2.1.3, p. 18, 23 en 29","ref":"§2.1.1–2.1.3, p. 18, 23 en 29","tests":"techniekbeoordeling: eerste 50 m (A/B) vs eerste 25 m van elke 75 m (C)","source":{"page":29,"quote":"De uitvoering van zowel de schoolslag als de enkelvoudige rugslag wordt in de eerste 25 meter"}},{"id":"NO-0220","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-04","NO-COND-08"],"question":"Een kandidaat voor Zwemdiploma C zwemt bij C3 de 75 meter schoolslag goed. Zijn enkelvoudige rugslag is vanaf het begin niet symmetrisch, maar hij komt wel met een redelijk voortstuwingsrendement vooruit. Wat beslist de examinator?","options":["Onvoldoende: de eerste 25 meter enkelvoudige rugslag wordt op uitvoering beoordeeld.","Voldoende: bij C wordt alleen in de eerste 50 meter van de proef op uitvoering beoordeeld.","Voldoende: bij C wordt na de eerste 75 meter alleen het volhouden van de afstand beoordeeld."],"answer":0,"explanation":"Bij C3 wordt de uitvoering van beide zwemslagen beoordeeld in de eerste 25 meter van de 75 meter met die zwemslag; voor de enkelvoudige rugslag zijn dat de eerste 25 meter rugslag. Daar is een ritmisch en symmetrisch bewegingsverloop vereist. De eerste 50 meter is de regel voor A en B. §2.1.3, p. 29–30","ref":"§2.1.3, p. 29–30","tests":"techniekbeoordeling: eerste 50 m (A/B) vs eerste 25 m van elke 75 m (C)","source":{"page":29,"quote":"van de 75 meter zwemmen met de betreffende zwemslag beoordeeld"}},{"id":"NO-0221","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-05"],"question":"Welke bewering over de proef C3 Conditiezwemmen is NIET juist?","options":["Er wordt in totaal 150 meter achter elkaar gezwommen.","Na de eerste 25 meter van elke zwemslag is nog een redelijk voortstuwingsrendement vereist.","De schoolslag en de enkelvoudige rugslag worden iedere 25 meter afgewisseld."],"answer":2,"explanation":"Bij C3 wordt de schoolslag pas na 75 meter afgewisseld door de enkelvoudige rugslag; iedere 25 meter wisselen is de normering bij A3 en B3. De 150 meter achter elkaar en het redelijk voortstuwingsrendement na de eerste 25 meter van elke zwemslag zijn wel juist. §2.1.3, p. 30","ref":"§2.1.3, p. 30","tests":"conditie: wisselen iedere 25 m (A/B) vs na 75 m (C)","source":{"page":30,"quote":"De schoolslag wordt na 75 meter afgewisseld door de enkelvoudige rugslag."}},{"id":"NO-0222","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-01","NO-COND-03"],"question":"Welke bewering over de proef A3 Conditiezwemmen is NIET juist?","options":["De totale proef bestaat uit 100 meter zwemmen.","De conditie wordt over de totale afstand beoordeeld.","Voetwaarts richting de bodem zakken onderbreekt de enkelvoudige rugslag."],"answer":2,"explanation":"Bij A3 onderbreekt voetwaarts richting de bodem zakken de tweede 25 meter schoolslag, niet de enkelvoudige rugslag. Dat de proef in totaal 100 meter is en dat de conditie over de totale afstand wordt beoordeeld, staat wel in de normering. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A3: voetwaarts zakken onderbreekt de schoolslag","source":{"page":18,"quote":"25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken"}},{"id":"NO-0223","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-06","NO-COND-07"],"question":"Welke bewering over de normering van de 25 meter schoolslag techniek bij Zwemdiploma B is NIET juist?","options":["Er is sprake van een zo horizontaal mogelijke ligging.","Er is een kort uitdrijfmoment aanwezig, armen en benen zijn beide gestrekt.","Er is een duidelijk uitdrijfmoment en de armen zijn passief."],"answer":2,"explanation":"Een duidelijk uitdrijfmoment met passieve armen is de normering van de enkelvoudige rugslag techniek. Bij de schoolslag gaat het om een kort uitdrijfmoment met gestrekte armen en benen, en om een zo horizontaal mogelijke ligging. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"schoolslag: kort uitdrijfmoment, armen en benen gestrekt","source":{"page":24,"quote":"Er is een kort uitdrijfmoment aanwezig, armen en benen zijn beide gestrekt."}},{"id":"NO-0224","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-07"],"question":"Een kandidaat voor Zwemdiploma A zwemt de 25 meter schoolslag techniek ritmisch en symmetrisch, maar begint elke nieuwe slag zodra armen en benen gestrekt zijn, zonder enig uitdrijven. Wat beslist de examinator?","options":["Onvoldoende: er moet een kort uitdrijfmoment zijn, met armen en benen gestrekt.","Voldoende: een uitdrijfmoment is alleen vereist bij de enkelvoudige rugslag.","Voldoende: bij Zwemdiploma A wordt de schoolslag alleen op conditie beoordeeld."],"answer":0,"explanation":"De normering van de 25 meter schoolslag techniek vraagt een kort uitdrijfmoment waarin armen en benen beide gestrekt zijn. Bij de enkelvoudige rugslag is een duidelijk uitdrijfmoment vereist, maar dat neemt de eis bij de schoolslag niet weg. Bij A3 wordt de uitvoering van de schoolslag in de eerste 50 meter wel beoordeeld. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"schoolslag: kort uitdrijfmoment, armen en benen gestrekt","source":{"page":19,"quote":"Er is een kort uitdrijfmoment aanwezig, armen en benen zijn beide gestrekt."}},{"id":"NO-0225","category":"normering","subtopic":"conditiezwemmen","type":"verschil","objectives":["NO-COND-08","NO-COND-06","NO-COND-09"],"question":"Wat is een verschil tussen de normering van de schoolslag techniek en die van de enkelvoudige rugslag techniek?","options":["Bij de schoolslag wordt een ontspannen ademhaling genoemd, bij de enkelvoudige rugslag niet.","Bij de schoolslag is het uitdrijfmoment duidelijk, bij de enkelvoudige rugslag kort.","Bij de enkelvoudige rugslag is de ligging zo horizontaal mogelijk, bij de schoolslag horizontaal."],"answer":0,"explanation":"Een ontspannen ademhaling staat alleen in de normering van de schoolslag techniek. De andere twee opties zijn omgedraaid: de schoolslag heeft een kort uitdrijfmoment en een zo horizontaal mogelijke ligging, de enkelvoudige rugslag een duidelijk uitdrijfmoment en een horizontale ligging. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"schoolslag vs enkelvoudige rugslag techniek: ademhaling, uitdrijfmoment, ligging","source":{"page":19,"quote":"Er is sprake van een ontspannen ademhaling."}},{"id":"NO-0226","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-09"],"question":"Een kandidaat voor Zwemdiploma B zwemt de 25 meter enkelvoudige rugslag techniek met een goede beenslag, maar beweegt bij elke slag de armen onder water mee om extra vooruit te komen. Wat beslist de examinator?","options":["Onvoldoende: bij de enkelvoudige rugslag zijn de armen passief.","Voldoende: de houding van armen en benen is vrij.","Voldoende: de armen/handen mogen onder water meebewegen ter ondersteuning."],"answer":0,"explanation":"De normering van de enkelvoudige rugslag techniek vraagt passieve armen, bij voorkeur langs het lichaam. 'De houding van armen en benen is vrij' is de normering van drijven, en meebewegen van armen/handen ter ondersteuning hoort bij watertrappen. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"enkelvoudige rugslag: armen passief","source":{"page":24,"quote":"De armen zijn passief, bij voorkeur langs het lichaam."}},{"id":"NO-0227","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-09"],"question":"Een kandidaat voor Zwemdiploma C houdt bij de 25 meter enkelvoudige rugslag techniek de armen stil op de buik in plaats van langs het lichaam. De rest van de uitvoering is in orde. Wat beslist de examinator?","options":["Voldoende: de armen zijn passief; langs het lichaam is een voorkeur.","Onvoldoende: de armen moeten langs het lichaam liggen.","Onvoldoende: de armen moeten gestrekt boven het hoofd liggen."],"answer":0,"explanation":"Bij de enkelvoudige rugslag techniek zijn de armen passief, bij voorkeur langs het lichaam. Stil op de buik is ook passief; langs het lichaam is dus geen harde eis. Gestrekte armen boven het hoofd horen bij voetwaarts richting de bodem zakken. §2.1.3, p. 30","ref":"§2.1.3, p. 30","tests":"enkelvoudige rugslag: armen langs het lichaam is voorkeur","source":{"page":30,"quote":"De armen zijn passief, bij voorkeur langs het lichaam."}},{"id":"NO-0228","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-10"],"question":"Welke normering geldt voor de halve draai om de lengteas?","options":["Er is sprake van een horizontale ligging.","Het lichaam blijft in verticale houding.","Er is sprake van een draai om de breedteas."],"answer":0,"explanation":"Voor de halve draai om de lengteas (bij A5 en B3) is de norm een horizontale ligging. Een verticale houding hoort bij al watertrappend een hele draai om de lengteas maken (A6). Een draai om de breedteas is de normering van de rol voorover. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"halve draai om de lengteas: horizontale ligging","source":{"page":20,"quote":"Normering halve draai om de lengteas • Er is sprake van een horizontale ligging."}},{"id":"NO-0229","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-10","NO-COND-11"],"question":"Welke bewering over de halve draai om de lengteas is NIET juist?","options":["Bij de halve draai is er sprake van een horizontale ligging.","Bij B3 wordt zowel van rug naar buik als van buik naar rug gedraaid.","Bij B3 onderbreekt de halve draai de 25 meter schoolslag."],"answer":2,"explanation":"Bij B3 wordt de laatste 25 meter enkelvoudige rugslag onderbroken door 2 keer een halve draai om de lengteas, niet de schoolslag. Er wordt daarbij van rug naar buik en van buik naar rug gedraaid, en de normering is een horizontale ligging. §2.1.2, p. 23–24","ref":"§2.1.2, p. 23–24","tests":"B3: halve draaien onderbreken de enkelvoudige rugslag","source":{"page":23,"quote":"25 meter enkelvoudige rugslag, onderbroken door 2 keer een halve draai om de lengteas"}},{"id":"NO-0230","category":"normering","subtopic":"conditiezwemmen","type":"verschil","objectives":["NO-COND-11","NO-COND-10"],"question":"In welke proef wordt de halve draai om de lengteas gemaakt bij Zwemdiploma A en bij Zwemdiploma B?","options":["A: Je vertrouwd voelen in het water; B: Conditiezwemmen","A: Conditiezwemmen; B: Je vertrouwd voelen in het water","Bij A en bij B: Oriënteren boven water en verplaatsen"],"answer":0,"explanation":"Bij A maakt de kandidaat in A5 Je vertrouwd voelen in het water een halve draai naar rugligging. Bij B zitten twee halve draaien in B3 Conditiezwemmen. In Oriënteren boven water en verplaatsen (A6) wordt al watertrappend een hele draai gemaakt. §2.1.1–2.1.2, p. 20 en 23","ref":"§2.1.1–2.1.2, p. 20 en 23","tests":"halve draai: A5 vs B3","source":{"page":23,"quote":"Een halve draai om de lengteas van rug naar buik"}},{"id":"NO-0231","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-11"],"question":"Welk onderdeel hoort NIET bij de proef B3 Conditiezwemmen?","options":["Een halve draai om de lengteas van buik naar rug","150 meter conditiezwemmen","Voetwaarts richting de bodem zakken"],"answer":2,"explanation":"Voetwaarts richting de bodem zakken hoort bij A3 en B6, niet bij B3. De onderdelen van B3 zijn 25 meter schoolslag techniek, 25 meter enkelvoudige rugslag techniek, een halve draai van rug naar buik, een halve draai van buik naar rug en 150 meter conditiezwemmen. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"onderdelen B3 Conditiezwemmen","source":{"page":23,"quote":"Onderdelen B3 proef Conditiezwemmen • 25 meter schoolslag techniek • 25 meter enkelvoudige rugslag techniek • Een halve draai om de lengteas van rug naar buik • Een halve draai om de lengteas van buik naar rug • 150 meter conditiezwemmen"}},{"id":"NO-0232","category":"normering","subtopic":"borst_rugcrawl","type":"casus","objectives":["NO-CRAWL-01"],"question":"Een kandidaat voor Zwemdiploma A zwemt de 5 meter borstcrawl met het hoofd voortdurend boven water. De been- en armbeweging zijn verder in orde. Wat beslist de examinator?","options":["Onvoldoende: bij de borstcrawl is het gezicht in het water.","Voldoende: de uitvoering van een ademhaling is bij A niet noodzakelijk.","Voldoende: bij A wordt alleen een asymmetrische armbeweging gevraagd."],"answer":0,"explanation":"De normering van de borstcrawl begint met 'het gezicht is in het water'. Dat een ademhaling bij A niet noodzakelijk is, maakt zwemmen met het hoofd boven water niet voldoende. De eis van een asymmetrische armbeweging komt naast, niet in plaats van, de eis dat het gezicht in het water is. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"borstcrawl: gezicht in het water","source":{"page":19,"quote":"Normering borstcrawl • Het gezicht is in het water."}},{"id":"NO-0233","category":"normering","subtopic":"borst_rugcrawl","type":"onjuist","objectives":["NO-CRAWL-02"],"question":"Welke bewering over de normering van de rugcrawl bij Zwemdiploma A is NIET juist?","options":["Er is sprake van een armslag over het water.","Er is sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging.","De armen blijven onder water en komen niet boven de schouderlijn."],"answer":2,"explanation":"Bij de rugcrawl is er juist een armslag over het water. 'De armen blijven onder water en komen niet boven de schouderlijn' is de normering van voortbewegen op de rug met gebruik van de armen. De doorgaande asymmetrische beenbeweging hoort wel bij de rugcrawl. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"crawl: armslag over het water","source":{"page":20,"quote":"Er is sprake van een asymmetrische armbeweging. • Er is sprake van een armslag over het water."}},{"id":"NO-0234","category":"normering","subtopic":"borst_rugcrawl","type":"casus","objectives":["NO-CRAWL-02"],"question":"Een kandidaat voor Zwemdiploma B zwemt de 10 meter rugcrawl met een armslag over het water, maar beweegt beide benen gelijktijdig, zoals bij de enkelvoudige rugslag. Wat beslist de examinator?","options":["Onvoldoende: er moet een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging zijn.","Voldoende: beide benen bewegen; dit mag gelijktijdig of afwisselend worden uitgevoerd.","Voldoende: bij de rugcrawl wordt alleen de armbeweging beoordeeld."],"answer":0,"explanation":"Bij de rugcrawl is er sprake van een doorgaande asymmetrische, wisselend op- en neerwaartse beenbeweging; gelijktijdig bewegen voldoet daar niet aan. 'Gelijktijdig of afwisselend' is de normering van watertrappen. De beenbeweging wordt bij de rugcrawl dus wel beoordeeld. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"crawl: doorgaande asymmetrische beenbeweging","source":{"page":25,"quote":"Er is sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse)"}},{"id":"NO-0235","category":"normering","subtopic":"borst_rugcrawl","type":"verschil","objectives":["NO-CRAWL-03"],"question":"Wat is het verschil in de normering van de armbeweging bij borst- en rugcrawl tussen Zwemdiploma A en Zwemdiploma B?","options":["Bij A een asymmetrische armbeweging, bij B een doorgaande asymmetrische armbeweging.","Bij A een doorgaande asymmetrische armbeweging, bij B een asymmetrische armbeweging.","Bij A een armslag onder water, bij B een armslag over het water."],"answer":0,"explanation":"Bij A vraagt de normering een asymmetrische armbeweging; bij B (en C) is dat een doorgaande asymmetrische armbeweging. De tweede optie draait dit om. Een armslag over het water geldt al bij A. §2.1.1–2.1.2, p. 19 en 24","ref":"§2.1.1–2.1.2, p. 19 en 24","tests":"armbeweging crawl: asymmetrisch (A) vs doorgaand asymmetrisch (B/C)","source":{"page":24,"quote":"Er is sprake van een doorgaande asymmetrische armbeweging."}},{"id":"NO-0236","category":"normering","subtopic":"borst_rugcrawl","type":"verschil","objectives":["NO-CRAWL-03"],"question":"Wat is het verschil in de normering van de armbeweging bij de rugcrawl tussen Zwemdiploma A en Zwemdiploma B?","options":["Bij A wordt een asymmetrische armbeweging gevraagd, bij B een doorgaande asymmetrische armbeweging.","Bij A wordt een doorgaande asymmetrische armbeweging gevraagd, bij B een asymmetrische armbeweging.","Bij A mag de armslag onder water blijven, bij B is een armslag over het water vereist."],"answer":0,"explanation":"De normering van de rugcrawl bij A noemt een asymmetrische armbeweging; bij B staat er een doorgaande asymmetrische armbeweging. De tweede optie draait dit om. Een armslag over het water wordt bij A én bij B gevraagd, dus de derde optie klopt niet. §2.1.1–2.1.2, p. 20 en 25","ref":"§2.1.1–2.1.2, p. 20 en 25","tests":"armbeweging crawl: asymmetrisch (A) vs doorgaand asymmetrisch (B/C)","source":{"page":25,"quote":"Normering rugcrawl • Er is sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging. • Er is sprake van een doorgaande asymmetrische armbeweging."}},{"id":"NO-0237","category":"normering","subtopic":"borst_rugcrawl","type":"onjuist","objectives":["NO-CRAWL-04","NO-CRAWL-01"],"question":"Welke bewering over de normering van de borstcrawl bij Zwemdiploma B is NIET juist?","options":["Het gezicht is in het water.","Er is sprake van een doorgaande asymmetrische armbeweging.","Er is sprake van minimaal 1 keer een ademhaling."],"answer":2,"explanation":"Bij B is de uitvoering van een ademhaling niet beslist noodzakelijk, en als de kandidaat wel ademt, wordt die niet beoordeeld. Minimaal 1 keer ademhalen is de normering bij C. Het gezicht in het water en de doorgaande asymmetrische armbeweging horen wel bij B. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"borstcrawl A/B: ademhaling niet noodzakelijk","source":{"page":24,"quote":"De uitvoering van een ademhaling is niet beslist noodzakelijk"}},{"id":"NO-0238","category":"normering","subtopic":"borst_rugcrawl","type":"casus","objectives":["NO-CRAWL-05"],"question":"Een kandidaat voor Zwemdiploma C zwemt de 15 meter borstcrawl met het gezicht in het water en met goede arm- en beenbewegingen, maar haalt in die 15 meter geen enkele keer adem. Wat beslist de examinator?","options":["Onvoldoende: bij C is er minimaal 1 keer een ademhaling.","Voldoende: de ademhaling wordt bij C niet bij de beoordeling betrokken.","Voldoende: een ademhaling is bij de borstcrawl niet beslist noodzakelijk."],"answer":0,"explanation":"De normering van de borstcrawl bij C vraagt minimaal 1 keer een ademhaling. Alleen de manier van uitvoeren (bij voorkeur zijwaarts) wordt niet beoordeeld. 'Niet beslist noodzakelijk' geldt bij B, niet bij C. §2.1.3, p. 31","ref":"§2.1.3, p. 31","tests":"borstcrawl C: minimaal 1 keer ademhaling","source":{"page":31,"quote":"Er is sprake van minimaal 1 keer een ademhaling."}},{"id":"NO-0239","category":"normering","subtopic":"borst_rugcrawl","type":"casus","objectives":["NO-CRAWL-05"],"question":"Een kandidaat voor Zwemdiploma C haalt tijdens de 15 meter borstcrawl twee keer adem door het hoofd naar voren op te tillen in plaats van zijwaarts te draaien. Wat beslist de examinator?","options":["Voldoende: zijwaarts ademen heeft de voorkeur, maar wordt niet beoordeeld.","Onvoldoende: bij C moet de ademhaling zijwaarts worden uitgevoerd.","Onvoldoende: het gezicht moet steeds in het water blijven."],"answer":0,"explanation":"Bij C is de uitvoering van de ademhaling bij voorkeur zijwaarts, maar dat wordt niet bij de beoordeling betrokken. De kandidaat ademt minimaal 1 keer, dus aan de eis is voldaan. Dat het gezicht in het water is, sluit een ademhaling niet uit; bij C is die juist verplicht. §2.1.3, p. 31","ref":"§2.1.3, p. 31","tests":"borstcrawl C: zijwaarts ademen is voorkeur, niet beoordeeld","source":{"page":31,"quote":"De uitvoering van de ademhaling is bij voorkeur zijwaarts, maar wordt niet bij de beoordeling"}},{"id":"NO-0240","category":"normering","subtopic":"borst_rugcrawl","type":"verschil","objectives":["NO-CRAWL-05","NO-CRAWL-04"],"question":"Wat is het verschil in de normering van de ademhaling bij de borstcrawl tussen Zwemdiploma B en Zwemdiploma C?","options":["Bij B is een ademhaling niet beslist noodzakelijk, bij C is er minimaal 1 keer een ademhaling.","Bij B is er minimaal 1 keer een ademhaling, bij C is een ademhaling niet beslist noodzakelijk.","Bij B is zijwaarts ademen een voorkeur, bij C wordt zijwaarts ademen beoordeeld."],"answer":0,"explanation":"Bij B is ademhalen tijdens de borstcrawl niet beslist noodzakelijk; bij C moet de kandidaat minimaal 1 keer ademen. De tweede optie draait dit om. Zijwaarts ademen is bij C een voorkeur die niet wordt beoordeeld; bij B wordt de richting van ademhalen niet genoemd. §2.1.2–2.1.3, p. 24 en 31","ref":"§2.1.2–2.1.3, p. 24 en 31","tests":"borstcrawl C: minimaal 1 keer ademhaling","source":{"page":31,"quote":"Er is sprake van minimaal 1 keer een ademhaling."}},{"id":"NO-0241","category":"normering","subtopic":"vertrouwd_in_water","type":"kennis","objectives":["NO-VERT-01"],"question":"In welk water wordt de proef A5 Je vertrouwd voelen in het water uitgevoerd?","options":["Tenminste waar de kandidaat niet kan staan","In een waterdiepte van minimaal 1,8 meter","In een waterdiepte van minimaal 1 meter"],"answer":0,"explanation":"A5 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. Minimaal 1,8 meter is de waterdiepte voor Onder water oriëntatie en voor voetwaarts richting de bodem zakken. Een minimum van 1 meter wordt voor A5 niet genoemd. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"A5: dieper water, waar de kandidaat niet kan staan","source":{"page":20,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"NO-0242","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-03","NO-VERT-02"],"question":"Een kandidaat voor Zwemdiploma A maakt tijdens de 10 seconden drijven op de rug kleine bewegingen met de handen om horizontaal te blijven liggen. Hij blijft op de plaats. Wat beslist de examinator?","options":["Voldoende: armen/handen gebruiken om de horizontale drijfhouding te behouden is toegestaan.","Onvoldoende: bij drijven op de rug liggen armen en benen stil.","Onvoldoende: de armen zijn passief, bij voorkeur langs het lichaam."],"answer":0,"explanation":"Bij drijven op de rug is het gebruik van armen/handen voor het in stand houden van de horizontale drijfhouding toegestaan, en de houding van armen en benen is vrij. Stilliggende benen horen bij voortbewegen op de rug met de armen. Passieve armen langs het lichaam zijn de normering van de enkelvoudige rugslag techniek. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven: armen/handen gebruiken voor drijfhouding toegestaan","source":{"page":20,"quote":"Het gebruik van armen/handen voor het in stand houden van de horizontale drijfhouding is"}},{"id":"NO-0243","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-02"],"question":"Een kandidaat voor Zwemdiploma C drijft bij C5 15 seconden op de rug, maar verplaatst zich daarbij met handbewegingen enkele meters in de richting van het hoofd. Wat beslist de examinator?","options":["Onvoldoende: bij drijven op de rug blijft de kandidaat liggen op de plaats.","Voldoende: het gebruik van armen/handen bij het drijven is toegestaan.","Voldoende: in de proef C5 is verplaatsen in meerdere richtingen gevraagd."],"answer":0,"explanation":"Bij drijven op de rug blijft de kandidaat liggen op de plaats. Armen/handen mogen alleen worden gebruikt om de horizontale drijfhouding in stand te houden, niet om zich te verplaatsen. Verplaatsen in meerdere richtingen hoort bij het watertrappen in C5, niet bij het drijven. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"drijven: kandidaat blijft op de plaats liggen","source":{"page":32,"quote":"De kandidaat blijft liggen op de plaats."}},{"id":"NO-0244","category":"normering","subtopic":"vertrouwd_in_water","type":"onjuist","objectives":["NO-VERT-04","NO-VERT-02"],"question":"Welke bewering over drijven op de buik bij A5 is NIET juist?","options":["De ligging is horizontaal en de kandidaat blijft op de plaats liggen.","Armen/handen mogen worden gebruikt om de horizontale drijfhouding te behouden.","Het gezicht blijft in het water; optillen voor ademhaling mag niet."],"answer":2,"explanation":"Bij drijven op de buik is het gezicht in het water, maar het mag uit het water worden getild voor ademhaling. De horizontale ligging op de plaats en het gebruik van armen/handen voor de drijfhouding zijn wel de normering. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven op de buik: gezicht mag uit het water voor ademhaling","source":{"page":20,"quote":"Het gezicht is in het water, maar mag uit het water worden getild voor ademhaling."}},{"id":"NO-0245","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-04"],"question":"Een kandidaat voor Zwemdiploma A tilt tijdens de 5 seconden drijven op de buik zijn gezicht kort uit het water om adem te halen. Hij blijft horizontaal op de plaats liggen. Wat beslist de examinator?","options":["Voldoende: het gezicht mag voor ademhaling uit het water worden getild.","Onvoldoende: bij drijven op de buik is het gezicht in het water.","Onvoldoende: de kandidaat moet bij drijven op de buik op de plaats blijven liggen."],"answer":0,"explanation":"Bij drijven op de buik is het gezicht in het water, maar het mag uit het water worden getild voor ademhaling. 'Het gezicht is in het water' is dus niet absoluut. Op de plaats blijven liggen is wel een eis, maar daar voldoet de kandidaat aan. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven op de buik: gezicht mag uit het water voor ademhaling","source":{"page":20,"quote":"Het gezicht is in het water, maar mag uit het water worden getild voor ademhaling."}},{"id":"NO-0246","category":"normering","subtopic":"vertrouwd_in_water","type":"kennis","objectives":["NO-VERT-05"],"question":"Welke normering geldt bij B5 voor hoofdwaarts voortbewegen op de rug met gebruik van de armen?","options":["De benen liggen stil en de verplaatsing is in de richting van het hoofd.","De benen ondersteunen en de verplaatsing is in de richting van het hoofd.","De benen liggen stil; verplaatsing naar hoofd of voeten is toegestaan."],"answer":0,"explanation":"Bij B5 liggen de benen stil, gebeurt de verplaatsing met de armen/handen en is die in de richting van het hoofd. Ondersteunende beenbewegingen horen er niet bij. Verplaatsing in de richting van zowel het hoofd als de voeten is toegestaan bij het gekleed voortbewegen op de rug in C1, niet bij B5. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"B5 voortbewegen op de rug: benen stil, richting hoofd","source":{"page":25,"quote":"Verplaatsing is in de richting van het hoofd."}},{"id":"NO-0247","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-06","NO-VERT-05"],"question":"Een kandidaat voor Zwemdiploma B beweegt zich bij B5 5 meter hoofdwaarts op de rug voort. Hij gebruikt daarbij armslagen over het water, zoals bij de rugcrawl, en houdt de benen stil. Wat beslist de examinator?","options":["Onvoldoende: de armen blijven onder water en komen niet boven de schouderlijn.","Voldoende: de verplaatsing gebeurt door gebruik van de armen/handen.","Voldoende: de benen liggen stil en de ligging is horizontaal."],"answer":0,"explanation":"Bij hoofdwaarts voortbewegen op de rug met gebruik van de armen blijven de armen onder water en komen ze niet boven de schouderlijn. Armslagen over het water horen bij de rugcrawl. Dat de armen de verplaatsing verzorgen en de benen stilliggen, is juist, maar maakt de armslag over het water niet voldoende. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"voortbewegen op de rug: armen onder water, niet boven schouderlijn","source":{"page":25,"quote":"De armen blijven onder water. • De armen komen niet boven de schouderlijn."}},{"id":"NO-0248","category":"normering","subtopic":"vertrouwd_in_water","type":"onjuist","objectives":["NO-VERT-05","NO-VERT-06"],"question":"Welke bewering over hoofdwaarts voortbewegen op de rug met gebruik van de armen (B5) is NIET juist?","options":["De verplaatsing gebeurt door gebruik van de armen/handen.","De armen blijven onder water en komen niet boven de schouderlijn.","De benen mogen met een rustige beenslag helpen."],"answer":2,"explanation":"Bij dit onderdeel liggen de benen stil; de verplaatsing gebeurt alleen door gebruik van de armen/handen. Dat de armen onder water blijven en niet boven de schouderlijn komen, is wel de normering. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"B5 voortbewegen op de rug: benen stil, richting hoofd","source":{"page":25,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen. • Verplaatsing is in de richting van het hoofd."}},{"id":"NO-0249","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-08"],"question":"Een kandidaat voor Zwemdiploma B houdt zich bij B5 vast aan een drijvend voorwerp en maakt met de benen voortdurend schoolslagbewegingen om op de plaats te blijven. Wat beslist de examinator?","options":["Onvoldoende: de armen en benen worden niet gebruikt om te stuwen.","Voldoende: het drijvend voorwerp is vrij en de kandidaat blijft op de plaats.","Voldoende: gebruik van armen/handen en benen voor de drijfhouding is toegestaan."],"answer":0,"explanation":"Bij drijven met gebruik van een drijvend voorwerp worden armen en benen niet gebruikt om te stuwen. Dat het voorwerp vrij is en de kandidaat op de plaats blijft, maakt het stuwen met de benen niet toegestaan. Het gebruik van armen/handen voor de drijfhouding is toegestaan bij drijven op de buik en op de rug zonder voorwerp. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: armen en benen niet stuwen","source":{"page":25,"quote":"De armen en benen worden niet gebruikt om te stuwen."}},{"id":"NO-0250","category":"normering","subtopic":"vertrouwd_in_water","type":"onjuist","objectives":["NO-VERT-07","NO-VERT-08"],"question":"Welke bewering over drijven met gebruik van een drijvend voorwerp bij B5 is NIET juist?","options":["Het drijvend voorwerp is vrij; de kandidaat blijft op de plaats.","De armen en benen worden niet gebruikt om te stuwen.","De houding is bij voorkeur rugligging; verticaal is ook toegestaan."],"answer":2,"explanation":"Het is andersom: de lichaamshouding is bij voorkeur verticaal, en rugligging is ook toegestaan. Dat het drijvend voorwerp vrij is, de kandidaat op de plaats blijft en armen en benen niet stuwen, is wel de normering. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: bij voorkeur verticaal, rugligging toegestaan","source":{"page":25,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."}},{"id":"NO-0251","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-07"],"question":"Een kandidaat voor Zwemdiploma B blijft bij B5 20 seconden drijven met een drijvend voorwerp. Hij ligt daarbij in rugligging met het voorwerp op zijn buik, blijft op de plaats en stuwt niet. Wat beslist de examinator?","options":["Voldoende: verticaal heeft de voorkeur, maar rugligging is ook toegestaan.","Onvoldoende: de lichaamshouding moet verticaal zijn.","Onvoldoende: de knieën moeten opgetrokken zijn en de ellebogen tegen het lichaam."],"answer":0,"explanation":"Bij B5 is de lichaamshouding bij voorkeur verticaal, maar rugligging is ook toegestaan. Een verticale houding met opgetrokken knieën en ellebogen tegen het lichaam is de normering van het gekleed verticaal blijven drijven bij C1, niet van B5. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: bij voorkeur verticaal, rugligging toegestaan","source":{"page":25,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."}},{"id":"NO-0252","category":"normering","subtopic":"orienteren_boven_water","type":"kennis","objectives":["NO-ORI-01"],"question":"Welke normering geldt bij A6 voor de houding bij watertrappen met armen en benen?","options":["Het hoofd is boven water en er is sprake van een verticale houding.","Het hoofd is boven water en er is sprake van een horizontale ligging.","De houding is vrij, zolang de kandidaat op de plaats blijft."],"answer":0,"explanation":"Bij watertrappen met armen en benen is het hoofd boven water en is er sprake van een verticale houding. Een horizontale ligging hoort bij drijven en bij de halve draai om de lengteas. 'Vrij' is de houding van armen en benen bij drijven, niet de lichaamshouding bij watertrappen. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: hoofd boven water, verticale houding","source":{"page":21,"quote":"Normering watertrappen met armen en benen • Het hoofd is boven water. • Er is sprake van een verticale houding."}},{"id":"NO-0253","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-02"],"question":"Een kandidaat voor Zwemdiploma A watertrapt bij A6 met een gelijktijdige beenbeweging, zoals bij de schoolslag, in plaats van afwisselend. Hoofd, houding en armen zijn in orde. Wat beslist de examinator?","options":["Voldoende: beide benen bewegen; dit mag gelijktijdig of afwisselend.","Onvoldoende: bij watertrappen moeten de benen afwisselend bewegen.","Onvoldoende: er moet een doorgaande asymmetrische beenbeweging zijn."],"answer":0,"explanation":"Bij watertrappen bewegen beide benen, en dat mag gelijktijdig of afwisselend worden uitgevoerd. Een verplicht afwisselende beenbeweging staat niet in de normering. De doorgaande asymmetrische beenbeweging is de normering van borst- en rugcrawl. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: benen gelijktijdig of afwisselend","source":{"page":21,"quote":"Beide benen bewegen, dit mag gelijktijdig of afwisselend worden uitgevoerd."}},{"id":"NO-0254","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-03"],"question":"Een kandidaat voor Zwemdiploma A houdt bij A6 zijn handen stil boven water en watertrapt alleen met de benen. Hoofd en houding zijn in orde. Wat beslist de examinator?","options":["Onvoldoende: de armen/handen zijn onder water en bewegen mee ter ondersteuning.","Voldoende: de armen/handen zijn passief, in de zij of bij het wateroppervlak.","Voldoende: alleen het hoofd boven water en de verticale houding worden beoordeeld."],"answer":0,"explanation":"A6 vraagt watertrappen met armen en benen: de armen/handen zijn onder water en bewegen mee ter ondersteuning. Passieve armen/handen horen bij het watertrappen met de benen in C5. Bij A6 worden ook de armen en benen beoordeeld, niet alleen hoofd en houding. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen met armen en benen: armen onder water, bewegen mee","source":{"page":21,"quote":"De armen/handen zijn onder water en bewegen mee ter ondersteuning."}},{"id":"NO-0255","category":"normering","subtopic":"orienteren_boven_water","type":"onjuist","objectives":["NO-ORI-04","NO-ORI-07"],"question":"Welke bewering over watertrappen met armen en benen bij A6 is NIET juist?","options":["Het hoofd is boven water en de kandidaat blijft op de plaats.","Beide benen bewegen; dit mag gelijktijdig of afwisselend.","De kandidaat verplaatst zich minimaal 4 keer in meerdere richtingen."],"answer":2,"explanation":"Bij A6 blijft de kandidaat tijdens het watertrappen op de plaats; minimaal 4 keer verplaatsen in meerdere richtingen is de normering bij B6 en C5. Hoofd boven water en beide benen gelijktijdig of afwisselend bewegen horen wel bij A6. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: op de plaats (A6) vs minimaal 4 keer verplaatsen (B6/C5)","source":{"page":21,"quote":"De armen/handen zijn onder water en bewegen mee ter ondersteuning. • De kandidaat blijft op de plaats."}},{"id":"NO-0256","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-05"],"question":"Een examinator wil B6 Oriënteren boven water en verplaatsen laten uitvoeren in een deel van het bad waar de kandidaten kunnen staan. Is dat toegestaan?","options":["Nee, de proef wordt uitgevoerd in dieper water, waar de kandidaat niet kan staan.","Ja, een eis aan de waterdiepte geldt alleen bij Onder water oriëntatie.","Ja, als de kandidaten tijdens het watertrappen de bodem niet raken."],"answer":0,"explanation":"B6 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan; dat geldt ook voor A6 en C5. Er is dus ook bij deze proef een eis aan het water, niet alleen bij Onder water oriëntatie. Dat de kandidaat de bodem niet raakt, vervangt die eis niet. §2.1.2, p. 26","ref":"§2.1.2, p. 26","tests":"Oriënteren boven water: dieper water, waar de kandidaat niet kan staan","source":{"page":26,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"NO-0257","category":"normering","subtopic":"orienteren_boven_water","type":"verschil","objectives":["NO-ORI-05","NO-ONDW-01"],"question":"Wat is het verschil in de eis aan het water tussen de proef Onder water oriëntatie en de proef Oriënteren boven water en verplaatsen?","options":["Onder water oriëntatie: minimaal 1,8 meter diep; Oriënteren boven water: waar de kandidaat niet kan staan.","Onder water oriëntatie: waar de kandidaat niet kan staan; Oriënteren boven water: minimaal 1,8 meter diep.","Bij beide proeven geldt een waterdiepte van minimaal 1,8 meter."],"answer":0,"explanation":"Onder water oriëntatie (A2, B2, C2) wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter. Oriënteren boven water en verplaatsen (A6, B6, C5) wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. De tweede optie draait dit om, en de derde geeft beide proeven dezelfde eis. §2.1.3, p. 29 en 31","ref":"§2.1.3, p. 29 en 31","tests":"Oriënteren boven water: dieper water, waar de kandidaat niet kan staan","source":{"page":31,"quote":"Deze proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."}},{"id":"NO-0258","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-06"],"question":"Een kandidaat voor Zwemdiploma A maakt bij A6 al watertrappend een hele draai om de lengteas. Tijdens het draaien gaat hij op zijn rug liggen en draait zo rond. Wat beslist de examinator?","options":["Onvoldoende: tijdens het draaien blijft het lichaam in verticale houding.","Voldoende: bij een draai om de lengteas is er een horizontale ligging.","Voldoende: de manier van draaien is vrij, zolang het hoofd boven water is."],"answer":0,"explanation":"Bij al watertrappend een hele draai om de lengteas maken blijft het lichaam tijdens het draaien in verticale houding. Een horizontale ligging is de normering van de halve draai om de lengteas, niet van de hele draai bij A6. Een vrije manier van draaien staat niet in de normering. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"hele draai al watertrappend: verticale houding","source":{"page":21,"quote":"Tijdens het draaien blijft het lichaam in verticale houding."}},{"id":"NO-0259","category":"normering","subtopic":"orienteren_boven_water","type":"verschil","objectives":["NO-ORI-06","NO-COND-10"],"question":"Wat is het verschil in normering tussen de halve draai om de lengteas en al watertrappend een hele draai om de lengteas maken?","options":["Halve draai: horizontale ligging; hele draai: het lichaam blijft verticaal.","Halve draai: het lichaam blijft verticaal; hele draai: horizontale ligging.","Bij beide is de houding vrij, zolang de kandidaat op de plaats blijft."],"answer":0,"explanation":"Bij de halve draai om de lengteas (A5, B3) is er sprake van een horizontale ligging. Bij al watertrappend een hele draai maken (A6) blijft het lichaam tijdens het draaien in verticale houding. De tweede optie draait dit om en de derde noemt een norm die niet bestaat. §2.1.1, p. 20–21","ref":"§2.1.1, p. 20–21","tests":"halve draai om de lengteas: horizontale ligging","source":{"page":21,"quote":"Normering al watertrappend een hele draai om de lengteas maken • Tijdens het draaien blijft het lichaam in verticale houding."}},{"id":"NO-0260","category":"normering","subtopic":"orienteren_boven_water","type":"verschil","objectives":["NO-ORI-07","NO-ORI-04"],"question":"Wat is een verschil tussen het watertrappen met armen en benen bij A6 en bij B6?","options":["Bij A6 blijft de kandidaat op de plaats, bij B6 verplaatst hij zich minimaal 4 keer.","Bij A6 bewegen de armen mee onder water, bij B6 zijn de armen passief.","Bij A6 duurt het watertrappen 30 seconden, bij B6 60 seconden."],"answer":0,"explanation":"Bij A6 blijft de kandidaat tijdens het watertrappen op de plaats; bij B6 verplaatst hij zich minimaal 4 keer, zowel voor-, achter- als zijwaarts. Bij beide bewegen de armen/handen mee onder water. Bij A6 en bij B6 wordt 60 seconden gewatertrapt; 30 seconden is de duur bij C5. §2.1.1–2.1.2, p. 21 en 26","ref":"§2.1.1–2.1.2, p. 21 en 26","tests":"watertrappen: op de plaats (A6) vs minimaal 4 keer verplaatsen (B6/C5)","source":{"page":26,"quote":"De kandidaat verplaatst zich minimaal 4 keer (zowel voor-, achter- als zijwaarts)."}},{"id":"NO-0261","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-07"],"question":"Een kandidaat voor Zwemdiploma C watertrapt bij C5 30 seconden met armen en benen. Hij verplaatst zich in die tijd 2 keer voorwaarts en 1 keer zijwaarts. Wat beslist de examinator?","options":["Onvoldoende: hij verplaatst zich minimaal 4 keer, zowel voor-, achter- als zijwaarts.","Voldoende: hij verplaatst zich in meer dan één richting.","Voldoende: bij C5 blijft de kandidaat bij het watertrappen op de plaats."],"answer":0,"explanation":"Bij C5 verplaatst de kandidaat zich tijdens het watertrappen met armen en benen minimaal 4 keer, zowel voor-, achter- als zijwaarts. Drie verplaatsingen, zonder achterwaarts, is dus onvoldoende. Op de plaats blijven geldt bij C5 alleen voor het watertrappen met de benen. §2.1.3, p. 31","ref":"§2.1.3, p. 31","tests":"verplaatsen: minimaal 4 keer, voor-, achter- en zijwaarts","source":{"page":31,"quote":"De kandidaat verplaatst zich minimaal 4 keer (zowel voor-, achter- als zijwaarts)."}},{"id":"NO-0262","category":"normering","subtopic":"orienteren_boven_water","type":"kennis","objectives":["NO-ORI-08"],"question":"Welke normering geldt voor de armen/handen bij de 30 seconden watertrappen met de benen (C5)?","options":["Ze zijn passief, in de zij of bij het wateroppervlak.","Ze zijn onder water en bewegen mee ter ondersteuning.","Ze zijn gestrekt boven het hoofd."],"answer":0,"explanation":"Bij watertrappen met de benen zijn de armen/handen passief, in de zij of bij het wateroppervlak. Meebewegen onder water ter ondersteuning is de normering van watertrappen met armen en benen. Gestrekte armen boven het hoofd horen bij voetwaarts richting de bodem zakken. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"watertrappen met de benen: armen passief","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak."}},{"id":"NO-0263","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-08"],"question":"Een kandidaat voor Zwemdiploma C rondt C5 af met 30 seconden watertrappen met de benen. Om zijn hoofd boven water te houden, maakt hij steeds kleine ondersteunende bewegingen met de handen onder water. Wat beslist de examinator?","options":["Onvoldoende: bij dit onderdeel zijn de armen/handen passief.","Voldoende: de armen/handen mogen onder water meebewegen ter ondersteuning.","Voldoende: alleen het hoofd boven water en de verticale houding worden beoordeeld."],"answer":0,"explanation":"Bij watertrappen met de benen zijn de armen/handen passief, in de zij of bij het wateroppervlak. Meebewegen ter ondersteuning hoort bij watertrappen met armen en benen. Ook de passieve armen en het op de plaats blijven horen bij de normering, niet alleen hoofd en houding. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"watertrappen met de benen: armen passief","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak."}},{"id":"NO-0264","category":"normering","subtopic":"orienteren_boven_water","type":"onjuist","objectives":["NO-ORI-08","NO-ORI-07"],"question":"Welke bewering over de proef C5 Oriënteren boven water en verplaatsen is NIET juist?","options":["Bij drijven op de rug blijft de kandidaat liggen op de plaats.","Bij watertrappen met armen en benen verplaatst de kandidaat zich minimaal 4 keer.","Bij watertrappen met de benen verplaatst de kandidaat zich in meerdere richtingen."],"answer":2,"explanation":"Bij watertrappen met de benen blijft de kandidaat op de plaats; verplaatsen in meerdere richtingen hoort bij het watertrappen met armen en benen. Op de plaats blijven bij drijven op de rug en minimaal 4 keer verplaatsen bij watertrappen met armen en benen zijn wel juist. §2.1.3, p. 31–32","ref":"§2.1.3, p. 31–32","tests":"C5 watertrappen met de benen: op de plaats","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak. • De kandidaat blijft op de plaats."}},{"id":"NO-0265","category":"normering","subtopic":"orienteren_boven_water","type":"onjuist","objectives":["NO-ORI-02","NO-ORI-03"],"question":"Welke bewering over watertrappen met armen en benen, verplaatsen in meerdere richtingen (B6), is NIET juist?","options":["Het hoofd is boven water en er is sprake van een verticale houding.","De armen/handen bewegen mee, onder water.","De benen bewegen afwisselend; gelijktijdig bewegen is niet toegestaan."],"answer":2,"explanation":"Bij watertrappen bewegen beide benen, en dat mag gelijktijdig of afwisselend worden uitgevoerd. Hoofd boven water, een verticale houding en meebewegende armen/handen onder water zijn wel de normering van B6. §2.1.2, p. 26","ref":"§2.1.2, p. 26","tests":"watertrappen: benen gelijktijdig of afwisselend","source":{"page":26,"quote":"De armen/handen bewegen mee, onder water. • Beide benen bewegen, dit mag gelijktijdig of afwisselend worden uitgevoerd."}},{"id":"NO-0400","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-02"],"question":"Hoe mag de kandidaat in het verplicht deel van een zwemcertificaat in diep water te water gaan?","options":["Naar keuze, maar het gebruik van een trapje is niet toegestaan","Naar keuze, en dat mag ook via een trapje","Alleen met een voetsprong vanaf de kant"],"answer":1,"explanation":"In het verplicht deel gaat de kandidaat naar keuze te water, en volgens de specifieke normering mag te water gaan in diep water via een trapje. Het verbod op een trapje uit de normering van de zwemdiploma's gaat over het zelfstandig uit het water klimmen, niet over deze situatie. Een voetsprong is in het verplicht deel niet voorgeschreven. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat verplicht deel: te water gaan via trapje","source":{"page":32,"quote":"Te water gaan in diep water mag via een trapje."}},{"id":"NO-0401","category":"normering","subtopic":"zwemcertificaten","type":"verschil","objectives":["NO-CERT-02","NO-CERT-03"],"question":"Bij de zwemdiploma's is via een trapje uit het water klimmen niet toegestaan. Wat geldt voor een trapje in het verplicht deel van een zwemcertificaat?","options":["Ook bij het zwemcertificaat is een trapje bij geen enkel onderdeel toegestaan.","Een trapje mag alleen in het open deel worden gebruikt, niet in het verplicht deel.","Te water gaan in diep water en geheel onder water gaan mogen via een trapje."],"answer":2,"explanation":"In de toelichting op het verplicht deel staat dat te water gaan in diep water via een trapje mag, en dat geheel onder water gaan ook met behulp van een trapje mag. Het trapje is bij het certificaat dus wel toegestaan, en wel juist in het verplicht deel, niet alleen in het open deel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat vs diploma: trapje bij te water en onder water gaan","source":{"page":32,"quote":"Geheel onder water gaan mag ook met behulp van een trapje."}},{"id":"NO-0402","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-03"],"question":"Een kandidaat met een beperking gaat in het gekleed verplicht deel van Zwemcertificaat A geheel onder water terwijl hij zich aan het trapje vasthoudt. Wat beslist de examinator?","options":["Onvoldoende; een trapje mag alleen bij het te water gaan worden gebruikt.","Voldoende; geheel onder water gaan mag ook met behulp van een trapje.","Onvoldoende; het gebruik van een trapje is bij het certificaat niet toegestaan."],"answer":1,"explanation":"Volgens de specifieke normering voor de zwemcertificaten mag geheel onder water gaan ook met behulp van een trapje. Het trapje is dus niet beperkt tot het te water gaan in diep water, en een algemeen verbod op het trapje geldt bij het verplicht deel van het certificaat niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: geheel onder water gaan met trapje","source":{"page":32,"quote":"Geheel onder water gaan mag ook met behulp van een trapje."}},{"id":"NO-0403","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-04"],"question":"Hoe wordt het drijven in het verplicht deel van een zwemcertificaat uitgevoerd?","options":["Zonder actief gebruik van de armen","Altijd met behulp van een drijvend voorwerp","Indien nodig met actief gebruik van de armen"],"answer":2,"explanation":"De specifieke normering zegt dat drijven in het verplicht deel, indien nodig, wordt uitgevoerd met actief gebruik van de armen. Een verbod op armgebruik geldt dus niet. Een drijvend voorwerp hoort alleen bij bepaalde onderdelen, zoals de 30 seconden drijven in het gekleed deel van C, en is geen algemene regel voor het drijven. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."}},{"id":"NO-0404","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-04"],"question":"Een kandidaat voor Zwemcertificaat B kan bij de 7 seconden drijven in het verplicht deel alleen blijven drijven door actief met de armen te bewegen. Wat beslist de examinator?","options":["Toegestaan; drijven mag indien nodig met actief gebruik van de armen.","Onvoldoende; bij het drijven moeten de armen passief blijven.","Alleen toegestaan als de kandidaat ook een drijvend voorwerp gebruikt."],"answer":0,"explanation":"Voor het verplicht deel van de zwemcertificaten geldt dat drijven, indien nodig, wordt uitgevoerd met actief gebruik van de armen. De kandidaat hoeft de armen dus niet passief te houden, en een drijvend voorwerp is voor dit drijven niet voorgeschreven. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."}},{"id":"NO-0405","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-05"],"question":"Een kandidaat voor Zwemcertificaat C legt in het verplicht deel de 100 meter in badkleding af met een eigen zwemslag die niet aan de schoolslag techniek voldoet. Wat beslist de examinator?","options":["Onvoldoende; hier geldt de normering schoolslag techniek uit §2.1.","Toegestaan; de uitvoering van de zwemslag naar keuze is vrij.","Onvoldoende; de kandidaat moet schoolslag of enkelvoudige rugslag zwemmen."],"answer":1,"explanation":"In het verplicht deel is de uitvoering van de zwemslag naar keuze vrij. De normering van de schoolslag techniek uit §2.1 geldt alleen voor de 25 meter schoolslag in het open deel. Een verplichting om schoolslag of enkelvoudige rugslag te zwemmen staat niet in het verplicht deel, want de zwemslag is naar keuze. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: uitvoering zwemslag naar keuze vrij","source":{"page":32,"quote":"De uitvoering van de zwemslag naar keuze is vrij."}},{"id":"NO-0406","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-06"],"question":"Wat is volgens de specifieke normering de essentie van het watertrappen in het verplicht deel van een zwemcertificaat?","options":["Een verticale houding waarbij beide benen bewegen","Op een bepaalde plaats in het water boven water blijven","Met armen en benen verplaatsen in meerdere richtingen"],"answer":1,"explanation":"Voor de zwemcertificaten is de uitvoering van watertrappen vrij; de essentie is het op een bepaalde plaats in het water boven water blijven. Een verticale houding met bewegende benen is een eis uit de normering van het watertrappen bij de zwemdiploma's. Verplaatsen in meerdere richtingen is alleen bij C een deel van de minuut, niet de essentie van watertrappen. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"de essentie is het op een bepaalde plaats in het water boven water blijven"}},{"id":"NO-0407","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-06"],"question":"Een kandidaat voor Zwemcertificaat A trapt in het verplicht deel 1 minuut water met een eigen, onregelmatige beweging, maar blijft op dezelfde plaats boven water. Wat beslist de examinator?","options":["Onvoldoende; beide benen moeten gelijktijdig of afwisselend bewegen.","Onvoldoende; de armen moeten onder water meebewegen ter ondersteuning.","Voldoende; de uitvoering van watertrappen is bij het certificaat vrij."],"answer":2,"explanation":"Bij het zwemcertificaat is de uitvoering van watertrappen vrij; waar het om gaat is dat de kandidaat op een bepaalde plaats in het water boven water blijft. Eisen over bewegende benen en ondersteunende armen komen uit de normering van het watertrappen bij de zwemdiploma's en gelden hier niet. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"De uitvoering van watertrappen is vrij"}},{"id":"NO-0408","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-07"],"question":"Welke bewering over het vastleggen van het open deel op het zwemcertificaat is NIET juist?","options":["Er wordt aangekruist welke onderdelen de kandidaat beheerst.","Er wordt aangekruist welke onderdelen onvoldoende zijn uitgevoerd.","Er wordt vermeld hoeveel onderdelen zijn uitgevoerd."],"answer":1,"explanation":"Op het zwemcertificaat wordt aangekruist welke onderdelen van het open deel de kandidaat beheerst, niet welke onvoldoende zijn. Daarnaast wordt vermeld hoeveel onderdelen zijn uitgevoerd. Het aangeven van onvoldoende uitgevoerde onderdelen hoort bij de beoordelingslijsten, niet op het certificaat. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel: beheerste onderdelen aankruisen en aantal uitgevoerd vermelden","source":{"page":32,"quote":"Er wordt op het zwemcertificaat aangekruist welke onderdelen de kandidaat beheerst."}},{"id":"NO-0409","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-07"],"question":"Een kandidaat voor Zwemcertificaat B voert het verplicht deel voldoende uit. Van het open deel voert hij 8 onderdelen uit, waarvan hij er 5 beheerst. Wat komt er voor het open deel op het zwemcertificaat?","options":["Niets; het open deel wordt alleen op de beoordelingslijst bijgehouden.","De 5 beheerste onderdelen worden aangekruist en er wordt vermeld dat er 8 zijn uitgevoerd.","De 3 niet-beheerste onderdelen worden aangekruist als nog te oefenen."],"answer":1,"explanation":"Voor het open deel wordt op het zwemcertificaat aangekruist welke onderdelen de kandidaat beheerst, en wordt vermeld hoeveel onderdelen zijn uitgevoerd: hier dus 5 aangekruist en 8 uitgevoerd. Het open deel komt dus wel op het certificaat zelf, en niet-beheerste onderdelen worden niet aangekruist. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel: beheerste onderdelen aankruisen en aantal uitgevoerd vermelden","source":{"page":32,"quote":"Er wordt vermeld hoeveel onderdelen zijn uitgevoerd."}},{"id":"NO-0410","category":"normering","subtopic":"zwemcertificaten","type":"verschil","objectives":["NO-CERT-08","NO-CERT-05"],"question":"Welke normering geldt voor de schoolslag in het open deel van een zwemcertificaat, vergeleken met de zwemslag naar keuze in het verplicht deel?","options":["Open deel: uitvoering vrij; verplicht deel: de normering schoolslag techniek uit §2.1","Open deel: de normering schoolslag techniek uit §2.1; verplicht deel: uitvoering vrij","Open en verplicht deel: telkens de normering schoolslag techniek uit §2.1"],"answer":1,"explanation":"Bij het open deel geldt voor de 25 meter schoolslag en enkelvoudige rugslag de normering van de schoolslag techniek en enkelvoudige rugslag techniek uit §2.1. In het verplicht deel is de uitvoering van de zwemslag naar keuze juist vrij. De eerste optie draait dit om, en de derde negeert de vrije uitvoering in het verplicht deel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel schoolslag en enkelvoudige rugslag: normering techniek §2.1","source":{"page":32,"quote":"Bij het open deel 25 meter schoolslag en enkelvoudige rugslag geldt de normering van de schoolslag techniek en enkelvoudige rugslag techniek"}},{"id":"NO-0411","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-09"],"question":"Welke normering geldt voor de onderdelen van het open deel van een zwemcertificaat, afgezien van de 25 meter schoolslag en enkelvoudige rugslag?","options":["Geen normering; de uitvoering is bij het open deel vrij","De richtlijnen voor het maatwerk examenprogramma uit hoofdstuk 4","De normering van de onderdelen uit het hoofdstuk 'Normering'"],"answer":2,"explanation":"Voor de overige onderdelen van het open deel is de normering van de onderdelen uit het hoofdstuk 'Normering' van toepassing. De uitvoering is dus niet vrij; vrije uitvoering geldt in het verplicht deel voor de zwemslag naar keuze en het watertrappen. Hoofdstuk 4 gaat over het maatwerk examenprogramma, niet over de certificaten. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel overige onderdelen: normering uit hoofdstuk Normering","source":{"page":32,"quote":"Voor de overige onderdelen is de normering van de onderdelen uit het hoofdstuk"}},{"id":"NO-0412","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-09","NO-CERT-07","NO-CERT-08"],"question":"Welke bewering over de toelichting bij het open deel van een zwemcertificaat is NIET juist?","options":["Er wordt vermeld hoeveel onderdelen zijn uitgevoerd.","Voor de 25 meter schoolslag geldt de normering schoolslag techniek uit §2.1.","Voor de overige onderdelen is de uitvoering vrij."],"answer":2,"explanation":"Voor de overige onderdelen van het open deel geldt de normering van de onderdelen uit het hoofdstuk 'Normering'; de uitvoering is dus niet vrij. Dat wordt vermeld hoeveel onderdelen zijn uitgevoerd en dat voor de 25 meter schoolslag de normering schoolslag techniek uit §2.1 geldt, klopt wel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"open deel overige onderdelen: normering uit hoofdstuk Normering","source":{"page":32,"quote":"Voor de overige onderdelen is de normering van de onderdelen uit het hoofdstuk"}},{"id":"NO-0413","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-01"],"question":"Welke bewering over de normering van de Zwemcertificaten A, B en C is NIET juist?","options":["Voor het verplicht deel gelden zonder uitzondering de normeringen van de zwemdiploma's.","Ze zijn ontwikkeld voor kandidaten met tijdelijke of permanente beperkingen.","Bij de examenprogramma's gelden een paar specifieke afwijkende normeringen en bepalingen."],"answer":0,"explanation":"Voor de zwemcertificaten gelden juist een paar specifieke afwijkende normeringen en bepalingen, zoals het gebruik van een trapje en de vrije uitvoering van watertrappen in het verplicht deel. Dat de certificaten zijn ontwikkeld voor kandidaten met tijdelijke of permanente beperkingen, klopt. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten: specifieke afwijkende normeringen en bepalingen","source":{"page":32,"quote":"gelden een paar specifieke afwijkende normeringen en bepalingen"}},{"id":"NO-0414","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-10"],"question":"Hoe worden zwemcertificaten volgens de specifieke normering aangevraagd?","options":["Eén keer per jaar, als voorraad voor alle examens van dat jaar","Per organisatie van het diplomazwemmen, in kleine aantallen","Per kandidaat, door de Examinator nadat de uitslag is vastgesteld"],"answer":1,"explanation":"Zwemcertificaten dienen per organisatie van het diplomazwemmen te worden aangevraagd; ze kunnen in kleine aantallen worden aangevraagd en worden zeer beperkt in voorraad gehouden. Een jaarvoorraad past daar niet bij. De regeling koppelt de aanvraag aan de organisatie van het diplomazwemmen, niet aan een kandidaat na de uitslag. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten per organisatie aanvragen, kleine aantallen","source":{"page":32,"quote":"Zwemcertificaten dienen per organisatie van het diplomazwemmen te worden aangevraagd."}},{"id":"NO-0415","category":"normering","subtopic":"zwemcertificaten","type":"kennis","objectives":["NO-CERT-11"],"question":"Hoeveel zwemcertificaten mag een Licentiehouder die gespecialiseerd is in zwemlessen voor kandidaten met een (tijdelijke) beperking in voorraad houden?","options":["10 stuks in totaal, verdeeld over A, B en C","Geen; ook zij vragen ze per organisatie aan","10 stuks per niveau"],"answer":2,"explanation":"Voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking wordt een uitzondering gemaakt: zij kunnen een beperkte voorraad van 10 stuks per niveau aanhouden. Het gaat dus om 10 per niveau, niet 10 in totaal. Het per organisatie aanvragen is de hoofdregel, waarop voor hen juist een uitzondering geldt. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Zij kunnen een beperkte voorraad aanhouden (10 stuks per niveau)."}},{"id":"NO-0416","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-11"],"question":"Een Licentiehouder die gespecialiseerd is in zwemlessen voor kandidaten met een (tijdelijke) beperking wil 10 Zwemcertificaten A, 10 B en 10 C op voorraad houden. Mag dat?","options":["Nee, zij mogen in totaal maximaal 10 zwemcertificaten aanhouden.","Ja, zij mogen een beperkte voorraad van 10 stuks per niveau aanhouden.","Nee, ook zij moeten elk certificaat per organisatie aanvragen."],"answer":1,"explanation":"Voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking geldt een uitzondering: zij kunnen een beperkte voorraad van 10 stuks per niveau aanhouden, dus 10 van A, 10 van B en 10 van C. Een maximum van 10 in totaal staat niet in de regeling, en het per organisatie aanvragen is de hoofdregel waarop dit de uitzondering is. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Zij kunnen een beperkte voorraad aanhouden (10 stuks per niveau)."}},{"id":"NO-0417","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-10","NO-CERT-11"],"question":"Een zwemschool die niet gespecialiseerd is in zwemlessen voor kandidaten met een beperking, wil standaard 10 zwemcertificaten per niveau op voorraad houden. Wat geldt?","options":["Dat mag; elke Licentiehouder mag 10 stuks per niveau aanhouden.","Dat past niet; die voorraad is een uitzondering voor gespecialiseerde Licentiehouders.","Dat mag, mits de Examinator Nationale Zwemdiploma's de voorraad beheert."],"answer":1,"explanation":"Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd, in kleine aantallen, en zeer beperkt in voorraad gehouden. Alleen Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking mogen een voorraad van 10 stuks per niveau aanhouden. Beheer door de Examinator maakt die uitzondering niet van toepassing. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaten per organisatie aanvragen, kleine aantallen","source":{"page":32,"quote":"Er wordt een uitzondering gemaakt voor Licentiehouders die gespecialiseerd zijn in zwemlessen"}},{"id":"NO-0418","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-11","NO-CERT-10"],"question":"Welke bewering over het aanvragen en in voorraad houden van zwemcertificaten is NIET juist?","options":["Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd.","Iedere Licentiehouder mag 10 zwemcertificaten per niveau in voorraad houden.","Zwemcertificaten kunnen in kleine aantallen worden aangevraagd."],"answer":1,"explanation":"De voorraad van 10 stuks per niveau is een uitzondering voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking, niet voor iedere Licentiehouder. Dat zwemcertificaten per organisatie van het diplomazwemmen en in kleine aantallen worden aangevraagd, klopt. §2.2, p. 32","ref":"§2.2, p. 32","tests":"voorraad gespecialiseerde Licentiehouder: 10 per niveau","source":{"page":32,"quote":"Er wordt een uitzondering gemaakt voor Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking."}},{"id":"NO-0419","category":"normering","subtopic":"zwemcertificaten","type":"onjuist","objectives":["NO-CERT-04","NO-CERT-02","NO-CERT-06"],"question":"Welke afwijkende bepaling geldt NIET voor het verplicht deel van een zwemcertificaat?","options":["Te water gaan in diep water mag via een trapje.","Drijven gebeurt altijd zonder actief gebruik van de armen.","De uitvoering van watertrappen is vrij."],"answer":1,"explanation":"Drijven wordt in het verplicht deel juist, indien nodig, uitgevoerd met actief gebruik van de armen. Te water gaan in diep water via een trapje en de vrije uitvoering van watertrappen zijn wel afwijkende bepalingen voor het verplicht deel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: drijven indien nodig met actief armgebruik","source":{"page":32,"quote":"Drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."}},{"id":"NO-0420","category":"normering","subtopic":"zwemcertificaten","type":"verschil","objectives":["NO-CERT-06"],"question":"Wat is een verschil tussen de normering van gekleed watertrappen bij Zwemdiploma A en het watertrappen in het verplicht deel van een zwemcertificaat?","options":["Bij het diploma gelden eisen zoals een verticale houding; bij het certificaat is de uitvoering vrij.","Bij het diploma is de uitvoering vrij; bij het certificaat gelden eisen zoals een verticale houding.","Bij het certificaat moet de kandidaat de armen gebruiken; bij het diploma alleen de benen."],"answer":0,"explanation":"De normering gekleed watertrappen bij Zwemdiploma A eist onder meer een verticale houding en bewegende benen. Bij het zwemcertificaat is de uitvoering van watertrappen vrij; de essentie is op een bepaalde plaats boven water blijven. De tweede optie draait dit om, en bij het diploma bewegen de armen juist mee ter ondersteuning, terwijl het certificaat geen armgebruik voorschrijft. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat: watertrappen vrij, essentie op plaats boven water blijven","source":{"page":32,"quote":"De uitvoering van watertrappen is vrij; de essentie is het op een bepaalde plaats in het water"}},{"id":"NO-0421","category":"normering","subtopic":"zwemcertificaten","type":"casus","objectives":["NO-CERT-02"],"question":"Bij het examen voor Zwemcertificaat C gaat een kandidaat gekleed via het trapje het diepe water in. Wat beslist de examinator over dit te water gaan?","options":["Niet toegestaan; bij C moet de kandidaat met een sprong te water gaan.","Alleen toegestaan in het open deel, niet in het verplicht deel.","Toegestaan; te water gaan in diep water mag via een trapje."],"answer":2,"explanation":"In het verplicht deel van een zwemcertificaat gaat de kandidaat naar keuze te water, en te water gaan in diep water mag via een trapje. Dat geldt voor alle drie de certificaten, ook voor C. Een sprong is in het verplicht deel niet voorgeschreven, en de trapje-regel staat juist in de toelichting op het verplicht deel. §2.2, p. 32","ref":"§2.2, p. 32","tests":"certificaat verplicht deel: te water gaan via trapje","source":{"page":32,"quote":"Te water gaan in diep water mag via een trapje."}},{"id":"AB-0001","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-01"],"question":"Een kandidaat voert tijdens het diplomazwemmen een onderdeel onvoldoende uit. Hoe vaak mag de kandidaat dit onderdeel in totaal uitvoeren?","options":["Maximaal twee keer","Maximaal drie keer","Zo vaak als nodig binnen de duur van het examenprogramma"],"answer":1,"explanation":"Volgens de organisatievoorschriften mag een kandidaat een onderdeel maximaal drie keer uitvoeren om aan te tonen dat het wordt beheerst. Twee keer is te weinig; onbeperkt herhalen is niet toegestaan. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maximaal aantal pogingen per onderdeel","source":{"page":35,"quote":"De kandidaat mag een onderdeel maximaal drie keer uitvoeren"}},{"id":"AB-0002","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-03","AB-KLED-01","AB-KLED-02"],"question":"Welke bewering over de kledingvoorschriften is NIET juist?","options":["De kledingvoorschriften voor Zwemdiploma A en B zijn gelijk.","Voor Zwemdiploma C wordt een jas aan het kledingpakket toegevoegd.","Bij Zwemdiploma C wordt het onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen' met jas gezwommen."],"answer":2,"explanation":"Het zeil-onderdeel bij Zwemdiploma C is juist de uitzondering: dat wordt zónder jas gezwommen. De andere twee beweringen kloppen: A en B hebben dezelfde kleding, en bij C komt er een jas bij. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: zeil-onderdeel zonder jas","source":{"page":33,"quote":"Dit onderdeel wordt zonder de jas gezwommen."}},{"id":"AB-0003","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-06","AB-ORG-08"],"question":"Een kandidaat heeft nog geen Zwemdiploma A of B en wordt aangemeld voor het diplomazwemmen voor Zwemdiploma C. Wat beslist de examinator?","options":["Deelname is toegestaan; het bezit van een lager zwemdiploma is niet vereist.","Deelname is alleen toegestaan als de kandidaat eerst op dezelfde dag het examenprogramma voor Zwemdiploma A aflegt.","Deelname is niet toegestaan; eerst moet Zwemdiploma B zijn behaald."],"answer":0,"explanation":"Voor een hoger zwemdiploma is het bezit van een lager diploma niet vereist; diploma's overslaan mag. Op één dag A en C afleggen ka
