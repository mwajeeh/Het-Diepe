n ook niet, want een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"diploma's overslaan toegestaan","source":{"page":35,"quote":"Je mag dus zwemdiploma’s overslaan"}},{"id":"AB-0010","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-01"],"question":"Welke oppervlakte moet het bassin ten minste hebben waarin de examens voor het Zwem-ABC worden afgenomen?","options":["Ten minste 160 m2","Ten minste 40 m2","Ten minste 80 m2"],"answer":0,"explanation":"Het bassin voor het Zwem-ABC heeft een oppervlakte van ten minste 160 m2. De 40 m2 is het deel dat minimaal 1,8 meter diep moet zijn, en 80 is de minimale waterdiepte in centimeters, geen oppervlakte. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: oppervlakte ten minste 160 m2","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"}},{"id":"AB-0011","category":"algemene_bepalingen","subtopic":"zwembad","type":"casus","objectives":["AB-ZWEM-01","AB-ZWEM-03"],"question":"Een zwemlesaanbieder wil diplomazwemmen voor het Zwem-ABC organiseren in een bassin van 150 m2. Over 50 m2 is het water 2 meter diep. Mag het examen in dit bassin worden afgenomen?","options":["Nee, het bassin moet een oppervlakte van ten minste 160 m2 hebben.","Ja, want over ten minste 40 m2 is het water minimaal 1,8 meter diep.","Ja, mits het examen overzichtelijk verloopt en goed te beoordelen is."],"answer":0,"explanation":"Het bassin moet aan alle eisen tegelijk voldoen, en een oppervlakte van 150 m2 is kleiner dan de vereiste 160 m2. Dat het diepe deel groot genoeg is, maakt dat niet goed. Overzichtelijkheid is een eis bij het aantal kandidaten, geen vervanging voor de eisen aan het bassin. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: oppervlakte ten minste 160 m2","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"}},{"id":"AB-0012","category":"algemene_bepalingen","subtopic":"zwembad","type":"onjuist","objectives":["AB-ZWEM-03","AB-ZWEM-01","AB-ZWEM-02"],"question":"Welke bewering over de eisen aan het bassin voor het Zwem-ABC is NIET juist?","options":["De oppervlakte van het bassin is ten minste 160 m2.","De waterdiepte van het bassin is ten minste 80 centimeter.","Over ten minste 80 m2 is de waterdiepte minimaal 1,8 meter."],"answer":2,"explanation":"Het diepe gedeelte van minimaal 1,8 meter hoeft maar ten minste 40 m2 groot te zijn, niet 80 m2. Een oppervlakte van ten minste 160 m2 en een waterdiepte van ten minste 80 centimeter zijn wel de juiste eisen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: 40 m2 minimaal 1,8 meter diep","source":{"page":33,"quote":"over een wateroppervlakte van ten minste 40 m2 een waterdiepte van minimaal 1,8 meter heeft"}},{"id":"AB-0014","category":"algemene_bepalingen","subtopic":"zwembad","type":"casus","objectives":["AB-ZWEM-02"],"question":"Een bassin is 200 m2 groot en over 60 m2 is het water 2 meter diep. Het ondiepste deel van het bassin is 60 centimeter diep. Voldoet dit bassin aan de eisen voor het Zwem-ABC?","options":["Nee, de waterdiepte moet ten minste 80 centimeter zijn.","Ja, want het diepe deel is groter dan de vereiste 40 m2.","Ja, want de oppervlakte is groter dan de vereiste 160 m2."],"answer":0,"explanation":"Het bassin moet een waterdiepte van ten minste 80 centimeter hebben; 60 centimeter is te ondiep. De oppervlakte (ten minste 160 m2) en het diepe deel (ten minste 40 m2 van 1,8 meter) voldoen wel, maar dat is niet genoeg als de minimale diepte niet wordt gehaald. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bassin Zwem-ABC: waterdiepte ten minste 80 centimeter","source":{"page":33,"quote":"oppervlakte ten minste 160 m2 is, de waterdiepte ten minste 80 centimeter"}},{"id":"AB-0015","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-04"],"question":"Welke reden noemt de Examenregeling voor de voorgeschreven waterdiepte van het bassin voor het Zwem-ABC?","options":["Kinderen raken de bodem niet gemakkelijk en moeten zich inspannen om boven te komen.","Bij deze diepte kan het examenprogramma binnen 1,5 uur worden uitgevoerd.","Bij deze diepte verloopt het examen overzichtelijk en is het goed te beoordelen."],"answer":0,"explanation":"De afmetingen zijn gekozen voor de veiligheid en omdat ze de werkelijkheid reëel benaderen: kinderen raken in die diepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven. De duur van 1,5 uur en de overzichtelijkheid van het examen zijn organisatieregels die niets met de waterdiepte te maken hebben. §2.3, p. 33","ref":"§2.3, p. 33","tests":"reden afmetingen bassin: bodem niet gemakkelijk raken","source":{"page":33,"quote":"Kinderen raken in de voorgeschreven waterdiepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven"}},{"id":"AB-0016","category":"algemene_bepalingen","subtopic":"zwembad","type":"casus","objectives":["AB-ZWEM-06","AB-ZWEM-05"],"question":"Een zwemlesaanbieder wil een deel van het examen voor Zwemdiploma B in het golfslagbad laten plaatsvinden. Het golfslagbad is kleiner dan 160 m2. Welke onderdelen moeten in elk geval in een bassin van ten minste 160 m2 worden uitgevoerd?","options":["Survival en conditiezwemmen","Onder water zwemmen en survival","Conditiezwemmen en borst- en rugcrawl"],"answer":0,"explanation":"Bepaalde proeven of onderdelen mogen in een ander bassin worden uitgevoerd, maar survival en conditiezwemmen vinden altijd plaats in een bassin van ten minste 160 m2. Voor onder water zwemmen en borst- en rugcrawl geldt die vaste eis in §2.3 niet. §2.3, p. 33","ref":"§2.3, p. 33","tests":"survival en conditiezwemmen altijd in bassin ≥ 160 m2","source":{"page":33,"quote":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2"}},{"id":"AB-0017","category":"algemene_bepalingen","subtopic":"zwembad","type":"onjuist","objectives":["AB-ZWEM-06","AB-ZWEM-05"],"question":"Welke bewering over het gebruik van andere bassins bij het diplomazwemmen is NIET juist?","options":["Bepaalde proeven of onderdelen mogen in bijvoorbeeld het recreatiebad worden uitgevoerd.","Survival vindt altijd plaats in een bassin met een oppervlakte van ten minste 160 m2.","Conditiezwemmen mag in een golfslagbad dat kleiner is dan 160 m2."],"answer":2,"explanation":"Conditiezwemmen vindt, net als survival, altijd plaats in een bassin van ten minste 160 m2, dus niet in een kleiner golfslagbad. Wel juist is dat bepaalde andere proeven of onderdelen in bijvoorbeeld het recreatie- of golfslagbad mogen worden uitgevoerd. §2.3, p. 33","ref":"§2.3, p. 33","tests":"andere bassins toegestaan voor bepaalde proeven/onderdelen","source":{"page":33,"quote":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2"}},{"id":"AB-0018","category":"algemene_bepalingen","subtopic":"zwembad","type":"kennis","objectives":["AB-ZWEM-07"],"question":"Hoe omschrijft de Examenregeling de algemene bepalingen en richtlijnen voor de uitvoering van de examens?","options":["Als de minimale voorschriften voor het organiseren van het diplomazwemmen","Als aanbevelingen waarvan de Licentiehouder naar eigen inzicht mag afwijken","Als eisen die alleen gelden voor een maatwerk examenprogramma"],"answer":0,"explanation":"De bepalingen en richtlijnen zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen. Het zijn dus geen vrijblijvende aanbevelingen, en ze gelden niet alleen voor maatwerk examenprogramma's. §2.3, p. 33","ref":"§2.3, p. 33","tests":"bepalingen en richtlijnen = minimale voorschriften","source":{"page":33,"quote":"Dit zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen"}},{"id":"AB-0019","category":"algemene_bepalingen","subtopic":"kleding","type":"verschil","objectives":["AB-KLED-02","AB-KLED-01"],"question":"Wat is het verschil tussen de kledingvoorschriften voor Zwemdiploma B en die voor Zwemdiploma C?","options":["Bij C komt er een jas met lange mouwen bij.","Bij C zijn schoenen verplicht, bij B niet.","Bij B volstaat een shirt met korte mouwen."],"answer":0,"explanation":"Voor Zwemdiploma C wordt een jas met lange mouwen aan het kledingpakket toegevoegd. Schoenen horen bij A, B en C, en het shirt, hemd of de blouse heeft bij alle drie de diploma's lange mouwen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: jas toegevoegd aan kledingpakket","source":{"page":33,"quote":"Voor Zwemdiploma C wordt een jas toegevoegd aan het kledingpakket"}},{"id":"AB-0020","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-01"],"question":"Een kandidaat voor Zwemdiploma A meldt zich voor de proef Survival in badkleding, een shirt met korte mouwen, een lange broek en sportschoenen. Wat beslist de examinator?","options":["De kleding voldoet niet; het shirt moet lange mouwen hebben.","De kleding voldoet; bij A gaat het om de lange broek en de schoenen.","De kleding voldoet niet; bij A hoort ook een jas met lange mouwen."],"answer":0,"explanation":"Bij Zwemdiploma A (en B) bestaat de kleding uit badkleding, een shirt, hemd of blouse met lange mouwen, een lange broek (of jurk of rok tot de enkels) en schoenen; een shirt met korte mouwen voldoet dus niet. Een jas is alleen voorgeschreven bij Zwemdiploma C. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding A/B: shirt, hemd of blouse met lange mouwen","source":{"page":33,"quote":"De kleding bestaat uit een lange broek, een shirt, hemd of blouse met lange mouwen en schoenen"}},{"id":"AB-0021","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-01"],"question":"Een kandidate voor Zwemdiploma B draagt bij de proef Survival een rok die tot de knie reikt. Wat beslist de examinator over deze kleding?","options":["Niet toegestaan; een jurk of rok moet tot de enkels reiken.","Toegestaan; de lengte van een jurk of rok is vrij.","Toegestaan, mits er ook een jas met lange mouwen wordt gedragen."],"answer":0,"explanation":"Het kledingvoorschrift noemt een lange broek, of een jurk of rok tot de enkels. Een rok tot de knie voldoet daarom niet, en de lengte is dus niet vrij. Een jas hoort bij Zwemdiploma C en maakt een te korte rok niet goed. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding: jurk of rok tot de enkels","source":{"page":33,"quote":"Lange broek, jurk of rok tot de enkels"}},{"id":"AB-0022","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-04","AB-KLED-03"],"question":"Welke bewering over het dragen van kleding bij de proef Survival is NIET juist?","options":["De kleding wordt bij alle survival-onderdelen tot het einde van de opdracht gedragen.","Bij Zwemdiploma C wordt het zeil-onderdeel zonder de jas gezwommen.","De kandidaat mag de schoenen uittrekken zodra hij in het water ligt."],"answer":2,"explanation":"De kleding, inclusief de schoenen, wordt bij alle onderdelen van Survival tot het einde van de opdracht gedragen. De enige uitzondering is het zeil-onderdeel bij Zwemdiploma C, dat zonder de jas wordt gezwommen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding tot het einde van de opdracht gedragen","source":{"page":33,"quote":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen"}},{"id":"AB-0023","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-04"],"question":"Tijdens een survival-onderdeel voor Zwemdiploma B trekt een kandidaat in het water zijn shirt uit, omdat het zwaar wordt. Daarna maakt hij de opdracht af. Hoe beoordeelt de examinator dit?","options":["Niet goed uitgevoerd; de kleding hoort tot het einde van de opdracht aan te blijven.","Goed uitgevoerd, omdat de lange broek en de schoenen zijn aangehouden.","Goed uitgevoerd; alleen bij Zwemdiploma C moet alle kleding aanblijven."],"answer":0,"explanation":"Bij alle onderdelen van Survival wordt de kleding tot het einde van de opdracht gedragen, bij A, B en C. Het uittrekken van het shirt voldoet daar niet aan, ook niet als broek en schoenen aanblijven. De enige uitzondering is de jas bij het zeil-onderdeel van Zwemdiploma C. §2.3, p. 33","ref":"§2.3, p. 33","tests":"kleding tot het einde van de opdracht gedragen","source":{"page":33,"quote":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen"}},{"id":"AB-0024","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-03"],"question":"Een kandidaat voor Zwemdiploma C vraagt of hij bij 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen' zijn jas moet aanhouden. Wat antwoordt de examinator?","options":["Nee, dit onderdeel wordt zonder de jas gezwommen.","Ja, bij Survival blijft alle kleding tot het einde aan.","Ja, de jas mag pas uit na het bovenkomen in het wak."],"answer":0,"explanation":"Het zeil-onderdeel bij Zwemdiploma C is de uitzondering op de regel dat de kleding tot het einde van de opdracht wordt gedragen: het wordt zonder de jas gezwommen. De jas aanhouden, of pas na het bovenkomen uittrekken, is dus niet de bedoeling. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: zeil-onderdeel zonder jas","source":{"page":33,"quote":"Dit onderdeel wordt zonder de jas gezwommen."}},{"id":"AB-0025","category":"algemene_bepalingen","subtopic":"kleding","type":"kennis","objectives":["AB-KLED-05"],"question":"Wat is volgens de Examenregeling de bedoeling van het dragen van kleding tijdens de examens?","options":["Laten zien dat je je met dagelijkse kleding kunt redden als je onverwacht in het water komt","De kandidaat voorbereiden op zwemmen in open water met stroming en sterke golfslag","Aantonen dat de kandidaat met kleding een vaste afstand binnen een limiettijd zwemt"],"answer":0,"explanation":"Kleding tijdens de examens laat zien dat je jezelf met dagelijkse kleding kunt redden wanneer je onverwacht in het water terechtkomt. Open water met stroming is niveau vier, waarop het Zwem-ABC niet is gericht, en een limiettijd met kleding wordt hier niet als doel genoemd. §2.3, p. 34","ref":"§2.3, p. 34","tests":"doel kleding: jezelf redden met dagelijkse kleding","source":{"page":34,"quote":"De bedoeling van het dragen van kleding tijdens de examens is te laten zien dat je met dagelijkse kleding aan jezelf kunt redden"}},{"id":"AB-0026","category":"algemene_bepalingen","subtopic":"kleding","type":"kennis","objectives":["AB-KLED-05"],"question":"Waarop is de kledingkeuze bij het diplomazwemmen gebaseerd?","options":["Op kleding die buiten bij dagelijkse bezigheden wordt gedragen, afgestemd op het Nederlandse klimaat","Op de kleding die Reddingsbrigade Nederland bij reddingsoefeningen voorschrijft","Op wat de Licentiehouder per seizoen voor het diplomazwemmen vaststelt"],"answer":0,"explanation":"De kledingkeuze is gebaseerd op kleding die tijdens normale dagelijkse bezigheden buiten wordt gedragen en is afgestemd op het Nederlandse klimaat; dat geldt ook voor de schoenen. Reddingsbrigade Nederland en een keuze per seizoen door de Licentiehouder spelen hierbij geen rol. §2.3, p. 34","ref":"§2.3, p. 34","tests":"kledingkeuze: dagelijkse buitenkleding, Nederlands klimaat","source":{"page":34,"quote":"De kledingkeuze is gebaseerd op de kleding die tijdens normale dagelijkse bezigheden buiten wordt gedragen en is afgestemd op ons Nederlandse klimaat"}},{"id":"AB-0027","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-07"],"question":"Een kandidaat voor Zwemdiploma A verschijnt bij de proef Survival met slippers aan. Wat beslist de examinator?","options":["Niet toegestaan; schoenen zonder echte zool, zoals slippers, mogen niet.","Toegestaan; bij Zwemdiploma A is het soort schoen vrij.","Toegestaan, omdat slippers als plastic schoenen gelden."],"answer":0,"explanation":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan, ook niet bij Zwemdiploma A. Plastic schoenen zijn wel toegestaan, maar slippers worden juist als voorbeeld van niet-toegestane schoenen genoemd. §2.3, p. 34","ref":"§2.3, p. 34","tests":"slippers, pantoffels, surfschoentjes niet toegestaan","source":{"page":34,"quote":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan"}},{"id":"AB-0028","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-07","AB-KLED-06"],"question":"Welk schoeisel is bij het diplomazwemmen NIET toegestaan?","options":["Surfschoentjes","Leren schoenen","Sportschoenen"],"answer":0,"explanation":"Surfschoentjes zijn, net als slippers en pantoffels, schoenen zonder echte zool en daarom niet toegestaan. Leren schoenen en sportschoenen zijn wel toegestaan, net als plastic en katoenen schoenen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"slippers, pantoffels, surfschoentjes niet toegestaan","source":{"page":34,"quote":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan"}},{"id":"AB-0029","category":"algemene_bepalingen","subtopic":"kleding","type":"casus","objectives":["AB-KLED-06"],"question":"Een kandidaat voor Zwemdiploma B draagt bij de proef Survival katoenen schoenen met een echte zool. Wat beslist de examinator?","options":["Toegestaan; katoenen schoenen staan bij het toegestane schoeisel.","Niet toegestaan; alleen leren schoenen en sportschoenen mogen.","Niet toegestaan; katoenen schoenen gelden als pantoffels."],"answer":0,"explanation":"Plastic-, leren-, katoenen- en sportschoenen zijn toegestaan, dus katoenen schoenen mogen. Het is niet zo dat alleen leren schoenen en sportschoenen zijn toegestaan. Niet toegestaan zijn pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes. §2.3, p. 34","ref":"§2.3, p. 34","tests":"toegestane schoenen: plastic, leer, katoen, sport","source":{"page":34,"quote":"Plastic-, leren-, katoenen- en sportschoenen zijn toegestaan"}},{"id":"AB-0030","category":"algemene_bepalingen","subtopic":"kleding","type":"verschil","objectives":["AB-KLED-08"],"question":"Hoe verhouden de kledingvoorschriften voor de Zwemcertificaten A, B en C zich tot die voor het Zwem-ABC?","options":["Ze zijn gelijk aan die van het Zwem-ABC.","Bij de zwemcertificaten is nooit een jas nodig.","Bij de zwemcertificaten kiest de Licentiehouder."],"answer":0,"explanation":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan die van het Zwem-ABC. Dus ook bij Zwemcertificaat C hoort een jas bij het kledingpakket, en de Licentiehouder stelt de kleding niet zelf vast. §2.3, p. 34","ref":"§2.3, p. 34","tests":"kleding zwemcertificaten gelijk aan Zwem-ABC","source":{"page":34,"quote":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan de kledingvoorschriften van het Zwem-ABC"}},{"id":"AB-0031","category":"algemene_bepalingen","subtopic":"kleding","type":"onjuist","objectives":["AB-KLED-01","AB-KLED-02"],"question":"Welk kledingstuk hoort NIET bij het kledingpakket voor Zwemdiploma A?","options":["Jas met lange mouwen","Shirt, hemd of blouse met lange mouwen","Schoenen"],"answer":0,"explanation":"De jas met lange mouwen wordt alleen bij Zwemdiploma C aan het kledingpakket toegevoegd. Bij Zwemdiploma A horen wel badkleding, een shirt, hemd of blouse met lange mouwen, een lange broek (of jurk of rok tot de enkels) en schoenen. §2.3, p. 33","ref":"§2.3, p. 33","tests":"Zwemdiploma C: jas toegevoegd aan kledingpakket","source":{"page":33,"quote":"Voor Zwemdiploma C wordt een jas toegevoegd aan het kledingpakket"}},{"id":"AB-0032","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-01"],"question":"Waarom moet het gebruik van lijnen tijdens het diplomazwemmen zo minimaal mogelijk blijven?","options":["Omdat de examens vooral zwemveiligheid, zelfvertrouwen en overzicht in het water toetsen","Omdat de onderdelen bij voorkeur opeenvolgend en zonder wachttijd worden uitgevoerd","Omdat survival en conditiezwemmen in een bassin van ten minste 160 m2 plaatsvinden"],"answer":0,"explanation":"De examens hebben als voornaamste doel de zwemveiligheid, het zelfvertrouwen en het overzicht in het water van de kandidaat te toetsen; daarom blijft het gebruik van lijnen zo minimaal mogelijk. Opeenvolgend uitvoeren en de eis van 160 m2 zijn andere regels, die niet over lijnen gaan. §2.3, p. 34","ref":"§2.3, p. 34","tests":"gebruik van lijnen zo minimaal mogelijk","source":{"page":34,"quote":"Daarom dient het gebruik van lijnen tijdens het diplomazwemmen zo minimaal mogelijk te blijven"}},{"id":"AB-0033","category":"algemene_bepalingen","subtopic":"materialen","type":"onjuist","objectives":["AB-MAT-02","AB-MAT-01","AB-MAT-11"],"question":"Welke bewering over materialen en hulpmiddelen bij het diplomazwemmen is NIET juist?","options":["Het gebruik van lijnen blijft zo minimaal mogelijk.","Bij blijven drijven met een drijvend voorwerp is de keuze van het voorwerp vrij.","Een chloor/zwembrilletje is bij alle onderdelen toegestaan."],"answer":2,"explanation":"Een chloor/zwembrilletje is juist niet toegestaan, behalve bij borst- en rugcrawl en bij de beoordeling van de techniek van de zwemslag. Dat lijnen zo minimaal mogelijk worden gebruikt en dat de keuze van het voorwerp om mee te drijven vrij is, klopt wel. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zwembrilletje alleen bij borst-/rugcrawl en techniek","source":{"page":34,"quote":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl"}},{"id":"AB-0034","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-02","AB-MAT-03"],"question":"Een kandidaat voor Zwemdiploma B wil tijdens de proef Survival een zwembrilletje dragen. Er is vooraf niets over afgesproken. Wat beslist de examinator?","options":["Niet toegestaan; een brilletje mag alleen bij borst- en rugcrawl en techniekbeoordeling.","Toegestaan, mits de kandidaat het brilletje bij alle survival-onderdelen draagt.","Toegestaan, omdat de examinator op de dag zelf over hulpmiddelen beslist."],"answer":0,"explanation":"Een chloor/zwembrilletje is bij het diplomazwemmen niet toegestaan, behalve bij borst- en rugcrawl en bij de beoordeling van de techniek van de zwemslag. Een uitzondering bij andere onderdelen is alleen mogelijk na overleg met de regioadviseur van de Nationale Raad Zwemveiligheid, vóór het selecteren van de kandidaten, en dus niet op de dag zelf door de examinator. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zwembrilletje alleen bij borst-/rugcrawl en techniek","source":{"page":34,"quote":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl"}},{"id":"AB-0036","category":"algemene_bepalingen","subtopic":"materialen","type":"verschil","objectives":["AB-MAT-03"],"question":"Met wie bespreek je een uitzondering om in een bijzondere situatie bij andere onderdelen een chloor/zwembrilletje toe te staan?","options":["Met de regioadviseur van de Nationale Raad Zwemveiligheid","Met de Toetsingscommissie Maatwerk Examenprogramma's","Met de Examinator Nationale Zwemdiploma's op de examendag"],"answer":0,"explanation":"Een uitzondering in incidentele gevallen bespreek je met de regioadviseur van de Nationale Raad Zwemveiligheid. De Toetsingscommissie toetst maatwerk examenprogramma's en beslist niet over een brilletje. Ook de examinator op de examendag is niet het juiste aanspreekpunt, omdat het overleg vooraf moet plaatsvinden. §2.3, p. 34","ref":"§2.3, p. 34","tests":"uitzondering zwembrilletje: vooraf met regioadviseur","source":{"page":34,"quote":"bespreek je voorafgaand aan het selecteren van de kandidaten met de regioadviseur"}},{"id":"AB-0037","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-03"],"question":"Een kandidaat heeft in een bijzondere situatie ook bij onder water zwemmen een chloor/zwembrilletje nodig. Wanneer moet de zwemlesaanbieder deze uitzondering met de regioadviseur bespreken?","options":["Voorafgaand aan het selecteren van de kandidaten","Op de examendag, voordat het examen begint","Na afloop, bij de evaluatie van het diplomazwemmen"],"answer":0,"explanation":"De uitzondering bespreek je met de regioadviseur voorafgaand aan het selecteren van de kandidaten. Pas op de examendag of achteraf overleggen is te laat, want de uitzondering moet vooraf vaststaan. §2.3, p. 34","ref":"§2.3, p. 34","tests":"uitzondering zwembrilletje: vooraf met regioadviseur","source":{"page":34,"quote":"bespreek je voorafgaand aan het selecteren van de kandidaten met de regioadviseur"}},{"id":"AB-0038","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-04"],"question":"Welke afmeting heeft het zeil met gat dat bij het diplomazwemmen wordt gebruikt minimaal?","options":["1,8 bij 1,8 meter","1,4 meter bij 70 centimeter","1 bij 1 meter"],"answer":0,"explanation":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter. 1,4 meter bij 70 centimeter is de minimale afmeting van het drijvend voorwerp waar je onderdoor zwemt, en 1 bij 1 meter is de maximale afmeting van het soort wak. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zeil minimaal 1,8 × 1,8 meter","source":{"page":34,"quote":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter"}},{"id":"AB-0039","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-05"],"question":"Welke diameter heeft het gat in het zeil, en op welke afstand van het wateroppervlak bevindt het zich?","options":["Diameter 75 cm, op 75 cm van het wateroppervlak","Diameter 1 meter, op 75 cm van het wateroppervlak","Diameter 75 cm, op 1,8 meter van het wateroppervlak"],"answer":0,"explanation":"Het gat heeft een diameter van 75 centimeter en bevindt zich op 75 centimeter van het wateroppervlak. Een diameter van 1 meter hoort bij de maximale maat van het soort wak, en 1,8 meter is de minimale maat van het zeil zelf. §2.3, p. 34","ref":"§2.3, p. 34","tests":"gat in zeil: diameter 75 cm, op 75 cm","source":{"page":34,"quote":"Het gat heeft een diameter van 75 centimeter. Het gat bevindt zich op 75 centimeter van het wateroppervlak"}},{"id":"AB-0040","category":"algemene_bepalingen","subtopic":"materialen","type":"onjuist","objectives":["AB-MAT-10","AB-MAT-04","AB-MAT-05"],"question":"Welke bewering over het zeil en het soort wak is NIET juist?","options":["Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter.","Het gat in het zeil heeft een diameter van 75 centimeter.","Het soort wak heeft een minimale afmeting van 1 bij 1 meter."],"answer":2,"explanation":"Voor het soort wak geldt een maximale afmeting van 1 bij 1 meter (of een diameter van 1 meter), geen minimale. Het zeil van minimaal 1,8 bij 1,8 meter en het gat met een diameter van 75 centimeter zijn wel juist. §2.3, p. 34","ref":"§2.3, p. 34","tests":"soort wak maximaal 1 × 1 m of diameter 1 m","source":{"page":34,"quote":"Het wak heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter"}},{"id":"AB-0041","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-04"],"question":"Bij een examen hangt een zeil van 1,5 bij 1,8 meter met een gat met een diameter van 75 centimeter. Voldoet dit zeil?","options":["Nee, het zeil moet minimaal 1,8 bij 1,8 meter zijn.","Ja, alleen de maat van het gat is voorgeschreven.","Ja, het zeil moet minimaal 1,4 meter bij 70 centimeter zijn."],"answer":0,"explanation":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter, dus een zeil van 1,5 meter breed voldoet niet. Er zijn eisen aan zowel het zeil als het gat. 1,4 meter bij 70 centimeter is de minimale maat van een drijvend voorwerp, niet van het zeil. §2.3, p. 34","ref":"§2.3, p. 34","tests":"zeil minimaal 1,8 × 1,8 meter","source":{"page":34,"quote":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter"}},{"id":"AB-0042","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-06"],"question":"Wat zegt de Examenregeling over het soort materiaal van een 'drijvend voorwerp'?","options":["Er is ruimte om zelf invulling te geven aan het soort materiaal, zoals een mat of bootje.","Het moet een mat zijn die als zwembadmateriaal is goedgekeurd.","Het soort materiaal wordt vooraf met de regioadviseur afgestemd."],"answer":0,"explanation":"De term 'drijvend voorwerp' biedt ruimte om zelf invulling te geven aan het soort materiaal en voorwerp, bijvoorbeeld een mat, bootje of surfplank. Er is geen voorgeschreven soort mat en geen afstemming met de regioadviseur; die is alleen nodig voor een uitzondering op het brilletje of afwijkende tijden. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp: soort materiaal vrij (mat, bootje, surfplank)","source":{"page":34,"quote":"Dit biedt ruimte om zelf invulling te geven aan het soort materiaal en voorwerp"}},{"id":"AB-0043","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-07"],"question":"Welke minimale afmetingen heeft een drijvend voorwerp waar de kandidaat onderdoor moet zwemmen?","options":["Lengte 1,4 meter en breedte 70 centimeter","Lengte 1,8 meter en breedte 1,8 meter","Lengte 1 meter en breedte 75 centimeter"],"answer":0,"explanation":"Voor onderdelen waarbij onder het voorwerp door wordt gezwommen, is de minimale afmeting 1,4 meter lang en 70 centimeter breed. 1,8 bij 1,8 meter is de minimale maat van het zeil, en 1 meter en 75 centimeter zijn maten van het wak en het gat in het zeil. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp onderdoor: minimaal 1,4 m × 70 cm","source":{"page":34,"quote":"Deze afmetingen zijn: lengte 1,4 meter en breedte 70 centimeter"}},{"id":"AB-0044","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-08","AB-MAT-07"],"question":"Voor het onder een drijvend voorwerp door zwemmen koppelt de zwemlesaanbieder twee matten van elk 0,7 meter lang en 70 centimeter breed in de lengte aan elkaar. Voldoet dit?","options":["Ja; gekoppeld is het 1,4 meter lang en 70 centimeter breed.","Nee; het drijvend voorwerp moet uit één stuk bestaan.","Nee; het drijvend voorwerp moet minimaal 1,8 meter lang zijn."],"answer":0,"explanation":"Meerdere kortere of smallere voorwerpen mogen aan elkaar worden gekoppeld, mits ze samen aan de minimale afmetingen voldoen. Twee matten van 0,7 meter achter elkaar zijn samen 1,4 meter lang en 70 centimeter breed, precies het minimum. Een voorwerp uit één stuk is dus niet vereist, en 1,8 meter is de maat van het zeil. §2.3, p. 34","ref":"§2.3, p. 34","tests":"koppelen voorwerpen toegestaan als totaal minimummaat haalt","source":{"page":34,"quote":"Het is toegestaan om meerdere smallere of kortere voorwerpen aan elkaar te koppelen"}},{"id":"AB-0045","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-07"],"question":"Voor het onder een drijvend voorwerp door zwemmen gebruikt een zwemlesaanbieder één mat van 1,2 meter lang en 1 meter breed. Voldoet deze mat?","options":["Nee, de mat moet minimaal 1,4 meter lang zijn.","Ja, want de mat is breder dan de vereiste 70 centimeter.","Ja, want de afmeting van een drijvend voorwerp is vrij."],"answer":0,"explanation":"Het voorwerp waar onderdoor wordt gezwommen moet minimaal 1,4 meter lang en 70 centimeter breed zijn; een lengte van 1,2 meter is te kort, ook al is de mat breed genoeg. Het soort materiaal is vrij, maar de minimale afmeting is genormeerd. §2.3, p. 34","ref":"§2.3, p. 34","tests":"drijvend voorwerp onderdoor: minimaal 1,4 m × 70 cm","source":{"page":34,"quote":"Deze afmetingen zijn: lengte 1,4 meter en breedte 70 centimeter"}},{"id":"AB-0046","category":"algemene_bepalingen","subtopic":"materialen","type":"onjuist","objectives":["AB-MAT-08","AB-MAT-09"],"question":"Welke bewering over het drijvend voorwerp is NIET juist?","options":["Meerdere smallere of kortere voorwerpen mogen aan elkaar worden gekoppeld.","Bij over een drijvend voorwerp heen klimmen is het minimaal 70 cm breed.","Koppelen mag alleen als elk voorwerp afzonderlijk 70 centimeter breed is."],"answer":2,"explanation":"Smallere of kortere voorwerpen mogen juist aan elkaar worden gekoppeld; alleen het geheel moet aan de minimale afmetingen voldoen, niet elk voorwerp afzonderlijk. Dat koppelen is toegestaan en dat het voorwerp bij erover heen klimmen minimaal 70 centimeter breed is, klopt wel. §2.3, p. 34","ref":"§2.3, p. 34","tests":"koppelen voorwerpen toegestaan als totaal minimummaat haalt","source":{"page":34,"quote":"mits dan in totaal aan de minimale afmetingen wordt voldaan"}},{"id":"AB-0047","category":"algemene_bepalingen","subtopic":"materialen","type":"kennis","objectives":["AB-MAT-09"],"question":"Welke eis geldt voor het voorwerp bij het onderdeel 'over een drijvend voorwerp heen klimmen'?","options":["Het voorwerp is minimaal 70 centimeter breed.","Het voorwerp is minimaal 1,8 meter breed.","Het voorwerp is maximaal 1 meter breed."],"answer":0,"explanation":"Bij over een drijvend voorwerp heen klimmen moet het voorwerp minimaal 70 centimeter breed zijn. 1,8 meter is de minimale maat van het zeil, en een maximum van 1 meter geldt voor het soort wak. §2.3, p. 34","ref":"§2.3, p. 34","tests":"over drijvend voorwerp klimmen: minimaal 70 cm breed","source":{"page":34,"quote":"moet de minimale breedte van het voorwerp 70 centimeter zijn"}},{"id":"AB-0048","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-09"],"question":"Voor het onderdeel 'over een drijvend voorwerp heen klimmen' legt de zwemlesaanbieder een surfplank van 2 meter lang en 60 centimeter breed in het water. Voldoet dit voorwerp?","options":["Nee, het voorwerp moet minimaal 70 centimeter breed zijn.","Ja, want het voorwerp is langer dan 1,4 meter.","Ja, want een surfplank wordt als voorbeeld genoemd."],"answer":0,"explanation":"Bij over een drijvend voorwerp heen klimmen moet het voorwerp minimaal 70 centimeter breed zijn; 60 centimeter is te smal. Een lengte van meer dan 1,4 meter maakt dat niet goed. Een surfplank mag als materiaal, maar moet wel aan de minimale breedte voldoen. §2.3, p. 34","ref":"§2.3, p. 34","tests":"over drijvend voorwerp klimmen: minimaal 70 cm breed","source":{"page":34,"quote":"moet de minimale breedte van het voorwerp 70 centimeter zijn"}},{"id":"AB-0050","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-10"],"question":"Bij de proef Onder water zwemmen voor Zwemdiploma C gebruikt de zwemlesaanbieder een ronde hoepel met een diameter van 80 centimeter als soort wak. Is dit toegestaan?","options":["Ja, het wak is rond of vierkant en heeft een diameter van maximaal 1 meter.","Nee, het soort wak moet een vierkant voorwerp van 1 bij 1 meter zijn.","Nee, het soort wak moet een diameter van minimaal 1 meter hebben."],"answer":0,"explanation":"Het soort wak mag een vierkant of rond voorwerp zijn, zoals een hoepel, met een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter. Een hoepel van 80 centimeter blijft daaronder. Het wak hoeft dus niet vierkant te zijn, en 1 meter is een maximum, geen minimum. §2.3, p. 34","ref":"§2.3, p. 34","tests":"soort wak maximaal 1 × 1 m of diameter 1 m","source":{"page":34,"quote":"Het wak heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter"}},{"id":"AB-0051","category":"algemene_bepalingen","subtopic":"materialen","type":"casus","objectives":["AB-MAT-11"],"question":"Bij een onderdeel 'met gebruik van een drijvend voorwerp blijven drijven' gebruikt een kandidaat een lege petfles. Is dit toegestaan?","options":["Ja, materialen uit het dagelijks leven zijn toegestaan.","Nee, alleen zwembadmaterialen zoals een plankje mogen.","Nee, het voorwerp moet minimaal 70 centimeter breed zijn."],"answer":0,"explanation":"Bij blijven drijven met een drijvend voorwerp is de keuze vrij: materialen uit het dagelijks leven, zoals een plastic tas, bal of petfles, zijn toegestaan, net als zwembadmaterialen. De minimale breedte van 70 centimeter geldt voor over een drijvend voorwerp heen klimmen, niet voor drijven. §2.3, p. 35","ref":"§2.3, p. 35","tests":"drijven met voorwerp: keuze vrij, ook dagelijks leven","source":{"page":35,"quote":"Materialen uit het dagelijks leven, zoals een plastic tas, bal of een petfles, zijn toegestaan"}},{"id":"AB-0052","category":"algemene_bepalingen","subtopic":"materialen","type":"onjuist","objectives":["AB-MAT-11"],"question":"Welke bewering over voorwerpen ter ondersteuning van het drijven is NIET juist?","options":["Een plastic tas is toegestaan als voorwerp om mee te blijven drijven.","Een foam halter of een stuk flexibeam mag ook worden gebruikt.","Alleen voorwerpen van minimaal 1,4 meter lang zijn toegestaan."],"answer":2,"explanation":"De keuze van het voorwerp om mee te blijven drijven is vrij; een minimale lengte van 1,4 meter geldt alleen voor het voorwerp waar onderdoor wordt gezwommen. Een plastic tas (dagelijks leven) en een foam halter of flexibeam (zwembadmateriaal) zijn wel toegestaan. §2.3, p. 35","ref":"§2.3, p. 35","tests":"drijven met voorwerp: keuze vrij, ook dagelijks leven","source":{"page":35,"quote":"De keuze voor het soort voorwerp is vrij"}},{"id":"AB-0053","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-01"],"question":"Een kandidaat voor Zwemdiploma B voert een onderdeel twee keer onvoldoende uit. Wat beslist de examinator?","options":["De kandidaat mag het onderdeel nog één keer uitvoeren.","Het onderdeel is na twee onvoldoende pogingen afgekeurd.","De kandidaat mag het onderdeel nog twee keer uitvoeren."],"answer":0,"explanation":"Bij onvoldoende uitvoering mag de kandidaat het onderdeel nogmaals uitvoeren, tot maximaal drie keer in totaal. Na twee pogingen is er dus nog één over: afkeuren is nog niet aan de orde, en nog twee keer zou vier pogingen betekenen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maximaal aantal pogingen per onderdeel","source":{"page":35,"quote":"De kandidaat mag een onderdeel maximaal drie keer uitvoeren"}},{"id":"AB-0054","category":"algemene_bepalingen","subtopic":"organisatie","type":"onjuist","objectives":["AB-ORG-02","AB-ORG-03"],"question":"Welke bewering over de examens voor zwemcertificaten is NIET juist?","options":["Het examen kan tegelijk plaatsvinden met het examen voor één of meer Zwem-ABC-diploma's.","De aanvraag gebeurt op dezelfde manier als voor het Zwem-ABC.","Het examen moet altijd tegelijk met een Zwem-ABC-examen worden georganiseerd."],"answer":2,"explanation":"Het examen voor een zwemcertificaat mag tegelijk met het Zwem-ABC worden georganiseerd, maar ook op een ander moment; 'altijd tegelijk' klopt dus niet. Dat het samen kan en dat de aanvraag op dezelfde manier verloopt als voor het Zwem-ABC, is wel juist. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examen zwemcertificaat: tegelijk met Zwem-ABC of apart","source":{"page":35,"quote":"Het examen voor het zwemcertificaat mag echter ook op een ander moment"}},{"id":"AB-0055","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-02","AB-ORG-03"],"question":"Een zwemlesaanbieder wil op een aparte dag, los van het Zwem-ABC, alleen examens voor Zwemcertificaat A organiseren. Wat geldt hiervoor?","options":["Dat mag; de aanvraag gaat op dezelfde manier als voor het Zwem-ABC.","Dat mag niet; certificaatexamens vinden plaats tijdens het Zwem-ABC-examen.","Dat mag, maar de aanvraag loopt via de Toetsingscommissie Maatwerk Examenprogramma's."],"answer":0,"explanation":"Het examen voor een zwemcertificaat mag ook op een ander moment dan het Zwem-ABC-examen worden georganiseerd, en de aanvraag gebeurt op dezelfde manier als voor het Zwem-ABC. Het hoeft dus niet tijdens het Zwem-ABC, en de Toetsingscommissie toetst alleen maatwerk examenprogramma's. §2.3, p. 35","ref":"§2.3, p. 35","tests":"aanvraag examen zwemcertificaat zoals Zwem-ABC","source":{"page":35,"quote":"De aanvraag van het examen voor een zwemcertificaat gebeurt op dezelfde manier als voor het Zwem-ABC"}},{"id":"AB-0056","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-04"],"question":"In welke volgorde mogen de proeven van het standaard examenprogramma tijdens het diplomazwemmen worden getoond?","options":["In een willekeurige volgorde","In de volgorde waarin ze in de Examenregeling staan","In een volgorde die de regioadviseur vooraf goedkeurt"],"answer":0,"explanation":"De proeven van het standaard examenprogramma mogen in een willekeurige volgorde worden getoond. De volgorde van de Examenregeling is niet verplicht voor de proeven, en goedkeuring door de regioadviseur is daarvoor niet nodig. §2.3, p. 35","ref":"§2.3, p. 35","tests":"proeven standaard examenprogramma in willekeurige volgorde","source":{"page":35,"quote":"Deze proeven mogen in een willekeurige volgorde worden getoond"}},{"id":"AB-0057","category":"algemene_bepalingen","subtopic":"organisatie","type":"verschil","objectives":["AB-ORG-04"],"question":"Wat is in het standaard examenprogramma het verschil tussen de volgorde van de proeven en de volgorde van de onderdelen binnen een proef?","options":["Proeven in willekeurige volgorde; onderdelen binnen een proef in de vastgestelde volgorde","Proeven in de vastgestelde volgorde; onderdelen binnen een proef in willekeurige volgorde","Proeven en onderdelen mogen allebei in een willekeurige volgorde worden getoond"],"answer":0,"explanation":"Volgens §2.3 mogen de proeven in een willekeurige volgorde worden getoond. Bijlage 1 bepaalt dat de onderdelen van de proeven in de vastgestelde, in de Examenregeling beschreven volgorde worden uitgevoerd. Het is dus niet andersom, en de onderdelen zijn ook niet vrij. §2.3, p. 35 en Bijlage 1","ref":"§2.3, p. 35 en Bijlage 1","tests":"proeven standaard examenprogramma in willekeurige volgorde","source":{"page":35,"quote":"Deze proeven mogen in een willekeurige volgorde worden getoond"}},{"id":"AB-0058","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-05"],"question":"Bij het diplomazwemmen voor Zwemdiploma A laat de examinator kleine groepjes tegelijkertijd verschillende proeven van het standaard examenprogramma uitvoeren. Is dit toegestaan?","options":["Ja, uitvoeren in een circuitvorm is toegestaan.","Nee, alle kandidaten voeren dezelfde proef tegelijk uit.","Alleen bij een goedgekeurd maatwerk examenprogramma."],"answer":0,"explanation":"Het examenprogramma uitvoeren in een circuitvorm, waarbij kleine groepjes tegelijk verschillende proeven uitvoeren, is toegestaan. Dat geldt ook voor het standaard examenprogramma, dus er is geen maatwerk examenprogramma voor nodig, en kandidaten hoeven niet allemaal dezelfde proef tegelijk te doen. §2.3, p. 35","ref":"§2.3, p. 35","tests":"circuitvorm toegestaan","source":{"page":35,"quote":"kleine groepjes voeren tegelijkertijd verschillende proeven van het examenprogramma uit) is toegestaan"}},{"id":"AB-0059","category":"algemene_bepalingen","subtopic":"organisatie","type":"onjuist","objectives":["AB-ORG-15","AB-ORG-04","AB-ORG-05"],"question":"Welke bewering over de volgorde van de proeven tijdens het diplomazwemmen is NIET juist?","options":["De proeven van het standaard examenprogramma mogen in een willekeurige volgorde.","Een circuitvorm met kleine groepjes tegelijk is toegestaan.","Bij maatwerk liggen de proeven vast in de volgorde van het standaard examenprogramma."],"answer":2,"explanation":"Voor het maatwerk examenprogramma kan juist een eigen volgorde van onderdelen in de vorm van proeven worden samengesteld. Dat de proeven van het standaard examenprogramma in willekeurige volgorde mogen en dat een circuitvorm is toegestaan, is wel juist. §2.3, p. 35","ref":"§2.3, p. 35","tests":"maatwerk: eigen volgorde onderdelen in de vorm van proeven","source":{"page":35,"quote":"Voor het maatwerk examenprogramma geldt dat een eigen volgorde van onderdelen in de vorm van proeven kan worden samengesteld"}},{"id":"AB-0060","category":"algemene_bepalingen","subtopic":"organisatie","type":"onjuist","objectives":["AB-ORG-08","AB-ORG-06","AB-ORG-07"],"question":"Welke bewering over de volgorde van het behalen van zwemdiploma's en zwemcertificaten is NIET juist?","options":["Voor een hoger zwemdiploma is het bezit van een lager diploma niet vereist.","Wie overstapt van een behaald zwemcertificaat naar een zwemdiploma, hoeft geen lager diploma te hebben.","Een kandidaat mag voor het Zwem-ABC twee examenprogramma's per dag afleggen."],"answer":2,"explanation":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen. Dat een lager diploma niet vereist is, ook niet bij overstappen van een zwemcertificaat naar een zwemdiploma, is wel juist. §2.3, p. 35","ref":"§2.3, p. 35","tests":"één examenprogramma per dag (Zwem-ABC)","source":{"page":35,"quote":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen"}},{"id":"AB-0061","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-07"],"question":"Een kind heeft Zwemcertificaat A behaald en wordt aangemeld voor het diplomazwemmen voor Zwemdiploma B. Zwemdiploma A heeft het kind niet. Wat beslist de examinator?","options":["Deelname is toegestaan; een lager diploma is ook bij overstappen niet vereist.","Deelname is niet toegestaan; eerst moet Zwemdiploma A worden behaald.","Deelname is alleen toegestaan als eerst Zwemcertificaat B is behaald."],"answer":0,"explanation":"Voor een hoger zwemdiploma is het bezit van een lager diploma niet vereist, en dat geldt ook bij het overstappen van een behaald zwemcertificaat naar een zwemdiploma. Zwemdiploma A of Zwemcertificaat B is dus niet nodig. §2.3, p. 35","ref":"§2.3, p. 35","tests":"overstappen certificaat → diploma: lager diploma niet vereist","source":{"page":35,"quote":"Hetzelfde geldt voor het overstappen van een behaald zwemcertificaat naar een zwemdiploma"}},{"id":"AB-0062","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-08","AB-ORG-11"],"question":"Een kandidaat behaalt in het ochtendblok Zwemdiploma A. De zwemlesaanbieder wil hem in het middagblok van dezelfde dag ook het examenprogramma voor Zwemdiploma B laten afleggen. Wat beslist de examinator?","options":["Niet toegestaan; een kandidaat mag één Zwem-ABC-examenprogramma per dag afleggen.","Toegestaan, omdat het om twee afzonderlijke blokken diplomazwemmen gaat.","Toegestaan, mits beide blokken samen niet langer dan 2,5 uur duren."],"answer":0,"explanation":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen. De zwemlesaanbieder mag wel meerdere blokken per dag organiseren, maar dat geeft de kandidaat geen tweede examenprogramma. De 2,5 uur gaat over de duur van een blok, niet over het aantal examenprogramma's per kandidaat. §2.3, p. 35","ref":"§2.3, p. 35","tests":"één examenprogramma per dag (Zwem-ABC)","source":{"page":35,"quote":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen"}},{"id":"AB-0063","category":"algemene_bepalingen","subtopic":"organisatie","type":"kennis","objectives":["AB-ORG-09"],"question":"Wat is het uitgangspunt voor de duur van de uitvoering van een examenprogramma voor Zwemdiploma A, B of C?","options":["Maximaal 1,5 uur","Maximaal 2,5 uur","Maximaal 1 uur"],"answer":0,"explanation":"Uitgangspunt is dat de uitvoering van een examenprogramma voor Zwemdiploma A, B of C maximaal 1,5 uur duurt. 2,5 uur is de duur die het totale blok diplomazwemmen bij voorkeur niet overschrijdt; een maximum van 1 uur staat niet in de Examenregeling. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examenprogramma maximaal 1,5 uur","source":{"page":35,"quote":"Zwemdiploma A, B of C maximaal 1,5 uur duurt"}},{"id":"AB-0064","category":"algemene_bepalingen","subtopic":"organisatie","type":"verschil","objectives":["AB-ORG-09","AB-ORG-10"],"question":"Wat is het verschil tussen de 1,5 uur en de 2,5 uur in de voorschriften voor tijden van het diplomazwemmen?","options":["1,5 uur geldt voor één examenprogramma; 2,5 uur bij voorkeur voor het totale blok.","1,5 uur geldt voor Zwemdiploma A en B; 2,5 uur voor Zwemdiploma C.","1,5 uur geldt voor de zwemcertificaten; 2,5 uur voor het Zwem-ABC."],"answer":0,"explanation":"Een examenprogramma voor Zwemdiploma A, B of C duurt als uitgangspunt maximaal 1,5 uur; het totale blok diplomazwemmen, met één of meer groepen, duurt bij voorkeur niet langer dan 2,5 uur. De tijden verschillen niet per diploma, en de 1,5 uur gaat over het examenprogramma voor Zwemdiploma A, B of C, terwijl de 2,5 uur over het totale blok gaat, niet over het Zwem-ABC als geheel. §2.3, p. 35","ref":"§2.3, p. 35","tests":"examenprogramma 1,5 uur vs blok 2,5 uur","source":{"page":35,"quote":"De duur van het totale blok diplomazwemmen dat zo ontstaat, is bij voorkeur niet langer dan 2,5 uur"}},{"id":"AB-0065","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-10"],"question":"Een zwemlesaanbieder vraagt één blok diplomazwemmen aan voor drie groepen: twee groepen voor Zwemdiploma A en één groep voor Zwemdiploma B. Hoe lang duurt het totale blok bij voorkeur ten hoogste?","options":["2,5 uur","1,5 uur","4,5 uur (1,5 uur per groep)"],"answer":0,"explanation":"Een aanvraag kan gelden voor één of meer groepen, voor hetzelfde of een verschillend zwemdiploma. Het totale blok dat zo ontstaat, duurt bij voorkeur niet langer dan 2,5 uur. 1,5 uur is het uitgangspunt per examenprogramma, en die tijden worden niet per groep opgeteld. §2.3, p. 35","ref":"§2.3, p. 35","tests":"totale blok diplomazwemmen bij voorkeur ≤ 2,5 uur","source":{"page":35,"quote":"De duur van het totale blok diplomazwemmen dat zo ontstaat, is bij voorkeur niet langer dan 2,5 uur"}},{"id":"AB-0066","category":"algemene_bepalingen","subtopic":"organisatie","type":"onjuist","objectives":["AB-ORG-10","AB-ORG-11","AB-ORG-12"],"question":"Welke bewering over tijden en frequentie van het diplomazwemmen is NIET juist?","options":["De zwemlesaanbieder mag op een dag meerdere blokken diplomazwemmen organiseren.","Het diplomazwemmen vindt plaats tussen 08.30 uur en 21.00 uur.","Een aanvraag voor diplomazwemmen geldt altijd voor precies één groep."],"answer":2,"explanation":"Een aanvraag voor diplomazwemmen kan gelden voor één of meer groepen, voor hetzelfde of een verschillend zwemdiploma. Dat de zwemlesaanbieder meerdere blokken per dag mag organiseren en dat het diplomazwemmen tussen 08.30 uur en 21.00 uur plaatsvindt, is wel juist. §2.3, p. 35-36","ref":"§2.3, p. 35-36","tests":"aanvraag voor 1 of meer groepen","source":{"page":35,"quote":"Een aanvraag voor diplomazwemmen kan gelden voor 1 of meer groepen deelnemers"}},{"id":"AB-0067","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-12"],"question":"Een zwemlesaanbieder plant een blok diplomazwemmen van 19.30 uur tot 21.30 uur. Wat moet er gebeuren?","options":["Vooraf overleggen met de regioadviseur van de Nationale Raad Zwemveiligheid","Niets; het blok duurt korter dan 2,5 uur en is dus toegestaan","Vooraf toestemming vragen aan de Toetsingscommissie Maatwerk Examenprogramma's"],"answer":0,"explanation":"Het diplomazwemmen vindt plaats tussen 08.30 uur en 21.00 uur; een blok dat tot 21.30 uur duurt, wijkt daarvan af. Voor afwijkende tijden moet vooraf worden overlegd met de regioadviseur van de Nationale Raad Zwemveiligheid. Dat het blok korter is dan 2,5 uur verandert dat niet, en de Toetsingscommissie gaat over maatwerk examenprogramma's. §2.3, p. 36","ref":"§2.3, p. 36","tests":"tijden 08.30–21.00; afwijkend vooraf overleg regioadviseur","source":{"page":36,"quote":"Voor afwijkende tijden dient vooraf overlegd te worden met de regioadviseur"}},{"id":"AB-0069","category":"algemene_bepalingen","subtopic":"organisatie","type":"verschil","objectives":["AB-ORG-13"],"question":"Wie bepaalt hoeveel kandidaten gelijktijdig aan een examen deelnemen?","options":["De Examinator Nationale Zwemdiploma's","De regioadviseur van de Nationale Raad Zwemveiligheid","De Licentiehouder, bij de aanvraag van het diplomazwemmen"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen, zolang het overzichtelijk verloopt en de kandidaten goed beoordeeld kunnen worden. De regioadviseur is betrokken bij afwijkende tijden en een uitzondering voor het brilletje, niet bij het aantal kandidaten. De Licentiehouder legt dit aantal niet vast bij de aanvraag. §2.3, p. 36","ref":"§2.3, p. 36","tests":"Examinator bepaalt aantal kandidaten tegelijk","source":{"page":36,"quote":"De Examinator Nationale Zwemdiploma’s bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen"}},{"id":"AB-0070","category":"algemene_bepalingen","subtopic":"organisatie","type":"onjuist","objectives":["AB-ORG-14","AB-ORG-13"],"question":"Welke bewering over het aantal kandidaten en het verloop van het examen is NIET juist?","options":["De Examinator bepaalt zelf hoeveel kandidaten gelijktijdig deelnemen.","Kandidaten moeten voldoende tijd en ruimte hebben om de onderdelen uit te voeren.","Kandidaten wachten bij voorkeur tussen de onderdelen, zodat er rust is in het bad."],"answer":2,"explanation":"Het is juist niet wenselijk dat kandidaten geruime tijd moeten wachten; daarom worden de onderdelen bij voorkeur opeenvolgend uitgevoerd. Dat de Examinator zelf het aantal kandidaten bepaalt en dat kandidaten voldoende tijd en ruimte moeten hebben, klopt wel. §2.3, p. 36","ref":"§2.3, p. 36","tests":"onderdelen bij voorkeur opeenvolgend, niet lang wachten","source":{"page":36,"quote":"Het is niet wenselijk dat kandidaten geruime tijd moeten wachten en dus worden de onderdelen bij voorkeur opeenvolgend uitgevoerd"}},{"id":"AB-0071","category":"algemene_bepalingen","subtopic":"organisatie","type":"casus","objectives":["AB-ORG-13"],"question":"Een examinator overweegt om een grote groep kandidaten tegelijk de proef Survival te laten uitvoeren. Waaraan moet hij zijn keuze voor het aantal kandidaten toetsen?","options":["Het examen verloopt overzichtelijk en de kandidaten zijn goed te beoordelen.","Het aantal kandidaten is vooraf door de regioadviseur goedgekeurd.","Er doen niet meer kandidaten mee dan in de aanvraag per groep is vermeld."],"answer":0,"explanation":"De Examinator bepaalt zelf hoeveel kandidaten gelijktijdig deelnemen, maar het examen moet overzichtelijk verlopen en de kandidaten moeten goed beoordeeld kunnen worden. Goedkeuring door de regioadviseur of een aantal uit de aanvraag wordt hiervoor niet gevraagd. §2.3, p. 36","ref":"§2.3, p. 36","tests":"Examinator bepaalt aantal kandidaten tegelijk","source":{"page":36,"quote":"Het examen dient echter overzichtelijk te verlopen en kandidaten moeten goed beoordeeld kunnen worden"}},{"id":"AB-0072","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-01"],"question":"Hoe luidt de definitie van zwemveilig zijn die vanuit het project NL Zwemveilig is ontwikkeld?","options":["In en om water kunnen overleven en veilig kunnen bewegen en recreëren in de Nederlandse watercultuur","Je in open water met stroming en sterke golfslag zelfstandig kunnen redden tot er hulp komt","In het bezit zijn van Zwemdiploma A, B en C van de Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"Zwemveilig zijn is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur. Open water met stroming en sterke golfslag is niveau vier, waarop de Nationale Raad Zwemveiligheid niet focust. Het bezit van diploma's is een maat voor zwemveiligheid, niet de definitie ervan. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"definitie zwemveilig zijn","source":{"page":3,"quote":"is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur"}},{"id":"AB-0073","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"onjuist","objectives":["AB-NIV-03","AB-NIV-02"],"question":"Welke bewering over zwemveiligheid is NIET juist?","options":["Zwemveiligheid wordt gezien als een dynamisch begrip.","Zwemveiligheid wordt onder andere beïnvloed door ervaring en zelfvertrouwen.","Zwemveiligheid is één vast niveau dat in elke situatie hetzelfde is."],"answer":2,"explanation":"Door de invloed van omstandigheden, zoals waterdiepte, watertemperatuur, stroming, kleding en zwembad of open water, is het onmogelijk om één niveau van zwemveiligheid te definiëren. Dat zwemveiligheid een dynamisch begrip is en onder andere door ervaring en zelfvertrouwen wordt beïnvloed, is wel juist. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"zwemveiligheid dynamisch; niet één niveau","source":{"page":3,"quote":"Door de invloed van omstandigheden is het onmogelijk om één niveau van zwemveiligheid te definiëren"}},{"id":"AB-0074","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"verschil","objectives":["AB-NIV-05","AB-NIV-04"],"question":"Wat is het verschil tussen de situatie die hoort bij Zwemdiploma A en de situatie die hoort bij Zwemdiploma B?","options":["A: zwembad zonder attracties; B: zwembad met attracties, zoals een golfslagbassin","A: zwembad met attracties; B: ook open water zonder stroming of grote golfslag","A: zwembad zonder attracties; B: open water zonder stroming of grote golfslag"],"answer":0,"explanation":"Zwemdiploma A hoort bij een zwembad zonder attracties en Zwemdiploma B bij een zwembad met attracties, zoals een (wildwater)glijbaan, golfslagbassin of stroomversnelling. Open water zonder stroming of grote golfslag komt er pas bij Zwemdiploma C bij. Bijlage 1","ref":"Bijlage 1","tests":"situatie A (zonder attracties) vs B (met attracties)","source":{"page":"Bijlage 1","quote":"Een zwembad zonder attracties = Zwemdiploma A"}},{"id":"AB-0075","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"verschil","objectives":["AB-NIV-05","AB-NIV-08"],"question":"Bij welk zwemdiploma hoort de situatie 'een zwembad met attracties en open water zonder stroming of grote golfslag'?","options":["Zwemdiploma C","Zwemdiploma B","Bij geen diploma: dit is niveau vier"],"answer":0,"explanation":"Een zwembad met attracties én open water zonder stroming of grote golfslag hoort bij Zwemdiploma C, de Nationale Norm Zwemveiligheid. Zwemdiploma B gaat alleen over een zwembad met attracties. Niveau vier is open water/zee met mogelijke stroming en sterke golfslag. Bijlage 1","ref":"Bijlage 1","tests":"situatie C: zwembad met attracties + open water zonder stroming","source":{"page":"Bijlage 1","quote":"recreatieplassen en bredere sloten/vaarten (behalve de zee) = Zwemdiploma C/Nationale"}},{"id":"AB-0076","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"onjuist","objectives":["AB-NIV-04"],"question":"Welke bewering over de vier veelvoorkomende situaties waarin wordt gezwommen is NIET juist?","options":["Recreatieplassen en bredere sloten zonder stroming horen bij situatie drie.","Een golfslagbassin is een voorbeeld van een attractie in situatie twee.","De zee zonder grote golfslag hoort ook bij situatie drie."],"answer":2,"explanation":"Situatie drie gaat over een zwembad met attracties en open water zonder stroming of grote golfslag, zoals recreatieplassen en bredere sloten/vaarten, maar uitdrukkelijk 'behalve de zee'. De zee valt onder situatie vier. Recreatieplassen in situatie drie en het golfslagbassin in situatie twee zijn wel juist. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"vier situaties; zee valt niet onder situatie drie","source":{"page":3,"quote":"zoals recreatieplassen en bredere sloten/vaarten (behalve de zee)"}},{"id":"AB-0077","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"casus","objectives":["AB-NIV-04","AB-NIV-05","AB-NIV-08"],"question":"Een gezin wil in de zomer gaan zwemmen in een recreatieplas zonder stroming of grote golfslag. Bij welk niveau en welk zwemdiploma hoort deze situatie?","options":["Niveau drie, Zwemdiploma C","Niveau twee, Zwemdiploma B","Niveau vier, buiten het Zwem-ABC"],"answer":0,"explanation":"Open water zonder stroming of grote golfslag, zoals recreatieplassen, hoort bij niveau drie: Zwemdiploma C en de Nationale Norm Zwemveiligheid. Niveau twee (Zwemdiploma B) gaat over een zwembad met attracties. Niveau vier is open water/zee met mogelijkheid tot stroming en sterke golfslag. Aanleiding, p. 3-4","ref":"Aanleiding, p. 3-4","tests":"situatie C: zwembad met attracties + open water zonder stroming","source":{"page":3,"quote":"Een zwembad met attracties en in open water zonder stroming of grote golfslag"}},{"id":"AB-0078","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"onjuist","objectives":["AB-NIV-06","AB-NIV-10"],"question":"Welke bewering over niveau vier (open water met stroming/zee) is NIET juist?","options":["De omstandigheden zijn zeer specifiek en in hoge mate onvoorspelbaar.","Naast vaardigheden zijn specifieke kennis, kracht en uithoudingsvermogen nodig.","Met Zwemdiploma C is aangetoond dat iemand op dit niveau zwemveilig is."],"answer":2,"explanation":"Zwemdiploma C hoort bij niveau drie; de Nationale Raad Zwemveiligheid focust op de niveaus één tot en met drie, omdat niveau vier niet of nauwelijks in een zwembad te oefenen is. Dat de omstandigheden op niveau vier zeer specifiek en onvoorspelbaar zijn en dat ook kennis, kracht en uithoudingsvermogen nodig zijn, is wel juist. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"niveau vier: specifiek, onvoorspelbaar, niet in zwembad te oefenen","source":{"page":4,"quote":"Vanuit de Nationale Raad Zwemveiligheid wordt gefocust op de niveaus één tot en met drie"}},{"id":"AB-0079","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"kennis","objectives":["AB-NIV-06"],"question":"Op welke niveaus van zwemveiligheid focust de Nationale Raad Zwemveiligheid?","options":["Op de niveaus één tot en met drie","Op de niveaus één tot en met vier","Op de niveaus twee tot en met vier"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid focust op de niveaus één tot en met drie. Niveau vier, open water met stroming of de zee, valt daarbuiten: de omstandigheden zijn zeer specifiek en onvoorspelbaar en het is niet of nauwelijks in een zwembad te oefenen. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"NRZ focust op niveaus één t/m drie","source":{"page":4,"quote":"Vanuit de Nationale Raad Zwemveiligheid wordt gefocust op de niveaus één tot en met drie"}},{"id":"AB-0080","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"verschil","objectives":["AB-NIV-07","AB-NIV-08"],"question":"Hoe verschilt de positionering van Zwemdiploma A en B van die van Zwemdiploma C?","options":["Zwemdiploma A en B: 'op weg zijn naar zwemveilig'; C: de Nationale Norm Zwemveiligheid","Zwemdiploma A: 'op weg zijn naar zwemveilig'; B en C: de Nationale Norm Zwemveiligheid","Zwemdiploma A en B: de Nationale Norm; C: zwemveilig in open water met stroming"],"answer":0,"explanation":"Het eerste en tweede niveau (Zwemdiploma A en B) worden gepositioneerd als 'op weg zijn naar zwemveilig'. De Nationale Norm Zwemveiligheid ligt op niveau drie, bij Zwemdiploma C. Open water met stroming is niveau vier en hoort bij geen van de diploma's. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"A en B: op weg naar zwemveilig","source":{"page":4,"quote":"Het eerste en tweede niveau worden gepositioneerd als ‘op weg zijn naar zwemveilig’"}},{"id":"AB-0081","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"casus","objectives":["AB-NIV-08","AB-NIV-07"],"question":"Een ouder vraagt of zijn kind met Zwemdiploma B voldoet aan de Nationale Norm Zwemveiligheid. Wat is het juiste antwoord?","options":["Nee; B geldt als 'op weg naar zwemveilig', de norm ligt bij Zwemdiploma C.","Ja; de Nationale Norm ligt op niveau twee, bij Zwemdiploma B.","Nee; de Nationale Norm ligt op niveau vier, open water met stroming."],"answer":0,"explanation":"De Nationale Norm Zwemveiligheid ligt op niveau drie, bij Zwemdiploma C. Zwemdiploma B (niveau twee) wordt gepositioneerd als 'op weg zijn naar zwemveilig'. Niveau vier valt buiten de focus van de Nationale Raad Zwemveiligheid. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"Nationale Norm Zwemveiligheid op niveau drie (C)","source":{"page":4,"quote":"Nationale Norm Zwemveiligheid van de hele Nederlandse bevolking ligt op niveau drie"}},{"id":"AB-0083","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","type":"verschil","objectives":["AB-NIV-09"],"question":"Wat is volgens de Inleiding de Nationale Norm Zwemveiligheid?","options":["Uniforme landelijke richtlijnen voor de gewenste mate van zwemveiligheid van de bevolking","Het systeem dat controleert of de zwemlesaanbieder voldoet aan de kwaliteitsstandaard","Het recht van zwemlesaanbieders om de Nationale Zwemdiploma's te gebruiken"],"answer":0,"explanation":"De Nationale Norm Zwemveiligheid bestaat uit uniforme landelijke richtlijnen die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven. Het controlerende systeem is het kwaliteitsborgingssysteem, en het recht om de diploma's te gebruiken geeft de Licentie Nationale Zwemdiploma's. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Nationale Norm Zwemveiligheid = uniforme landelijke richtlijnen","source":{"page":1,"quote":"er uniforme landelijke richtlijnen zijn die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven"}},{"id":"AB-0084","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-01"],"question":"Waarvan vormt de Examenregeling Nationale Zwemdiploma's een onderdeel?","options":["Van de Licentie Nationale Zwemdiploma's","Van het project NL Zwemveilig","Van de kwaliteitsborging beroepsonderwijs"],"answer":0,"explanation":"De Examenregeling vormt een onderdeel van de Licentie Nationale Zwemdiploma's en is gekoppeld aan de Nationale Norm Zwemveiligheid. NL Zwemveilig is een project waarin kennis wordt verzameld, en de kwaliteitsborging beroepsonderwijs is een afzonderlijk aandachtspunt van de Nationale Raad Zwemveiligheid. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Examenregeling onderdeel van Licentie, gekoppeld aan Nationale Norm","source":{"page":1,"quote":"vormt een onderdeel van de Licentie Nationale Zwemdiploma’s en is gekoppeld aan de Nationale Norm Zwemveiligheid"}},{"id":"AB-0085","category":"algemene_bepalingen","subtopic":"examenregeling","type":"onjuist","objectives":["AB-INL-03","AB-INL-01"],"question":"Welke bewering over de Examenregeling Nationale Zwemdiploma's is NIET juist?","options":["Ze vormt een onderdeel van de Licentie Nationale Zwemdiploma's.","Ze is gekoppeld aan de Nationale Norm Zwemveiligheid.","Ze is vastgesteld door de Toetsingscommissie Maatwerk Examenprogramma's."],"answer":2,"explanation":"De Examenregeling is vastgesteld door het bestuur van de Nationale Raad Zwemveiligheid, in nauw overleg met de zwembranche. De Toetsingscommissie toetst alleen maatwerk examenprogramma's. Dat de Examenregeling onderdeel is van de Licentie en gekoppeld is aan de Nationale Norm Zwemveiligheid, is wel juist. Inleiding, p. 1-2","ref":"Inleiding, p. 1-2","tests":"Examenregeling vastgesteld door bestuur NRZ i.o.m. zwembranche","source":{"page":2,"quote":"is vastgesteld door het bestuur van de Nationale Raad Zwemveiligheid en is tot stand gekomen in nauw overleg met de zwembranche"}},{"id":"AB-0087","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-02"],"question":"Waaraan is volgens de Inleiding voor iedereen herkenbaar dat de zwemles en het diploma onder de Nationale Raad Zwemveiligheid vallen?","options":["De aanbieder heeft de Licentie Nationale Zwemdiploma's en het diploma is uitgegeven door de Nationale Raad Zwemveiligheid","De aanbieder werkt met een maatwerk examenprogramma dat de Toetsingscommissie Maatwerk Examenprogramma's heeft goedgekeurd","De examens vinden plaats in een bassin van ten minste 160 m2 en worden afgenomen door een regioadviseur"],"answer":0,"explanation":"Herkenbaar is dat de zwemlesaanbieder in het bezit is van de Licentie Nationale Zwemdiploma's en dat het verstrekte zwemdiploma is uitgegeven door de Nationale Raad Zwemveiligheid. Een maatwerk examenprogramma is een keuze, geen kenmerk, en de 160 m2 is een eis aan het bassin, niet het herkenningsteken. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"herkenbaar: Licentie + diploma uitgegeven door NRZ","source":{"page":1,"quote":"De zwemlesaanbieder is in het bezit van de Licentie Nationale Zwemdiploma’s"}},{"id":"AB-0088","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-04"],"question":"Sinds welk jaar bestaat het huidige Zwem-ABC?","options":["Sinds 1998","Sinds 1984","Sinds 2014"],"answer":0,"explanation":"Het huidige Zwem-ABC bestaat sinds 1998. In 1984 droeg de overheid de uitgifte van de Nationale Zwemdiploma's over aan de voorganger van de Nationale Raad Zwemveiligheid, en in 2014 is de Licentie Zwem-ABC geïntroduceerd. Aanleiding, p. 3","ref":"Aanleiding, p. 3","tests":"huidige Zwem-ABC sinds 1998","source":{"page":3,"quote":"Het huidige Zwem-ABC bestaat sinds 1998"}},{"id":"AB-0089","category":"algemene_bepalingen","subtopic":"examenregeling","type":"onjuist","objectives":["AB-DEF-08","AB-INL-04","AB-INL-07"],"question":"Welke bewering over jaartallen uit de Examenregeling is NIET juist?","options":["Het huidige Zwem-ABC bestaat sinds 1998.","In 1984 is de uitgifte van de Nationale Zwemdiploma's door de overheid overgedragen.","De Licentie Zwem-ABC is in 2018 geïntroduceerd."],"answer":2,"explanation":"De Licentie Zwem-ABC is in 2014 geïntroduceerd; sinds 1 januari 2018 heet ze de Licentie Nationale Zwemdiploma's. Dat het huidige Zwem-ABC sinds 1998 bestaat en dat de overheid in 1984 de uitgifte overdroeg aan de voorganger van de Nationale Raad Zwemveiligheid, is wel juist. Aanleiding p. 3, NRZ p. 5 en Bijlage 1","ref":"Aanleiding p. 3, NRZ p. 5 en Bijlage 1","tests":"Licentie Zwem-ABC 2014 (sinds 2018 Licentie Nationale Zwemdiploma's)","source":{"page":"Bijlage 1","quote":"De Licentie Zwem-ABC is in 2014 geïntroduceerd"}},{"id":"AB-0090","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-05"],"question":"Voor wie is de Examenregeling Nationale Zwemdiploma's geschreven?","options":["Voor professionals die betrokken zijn bij het zwemonderwijs en diplomazwemmen","Voor ouders van kinderen die zwemles volgen bij een zwemlesaanbieder","Voor kandidaten die afzwemmen voor een Nationaal Zwemdiploma"],"answer":0,"explanation":"De Examenregeling bevat examenprogramma's, normering en algemene bepalingen en richtlijnen, en is geschreven voor professionals die betrokken zijn bij het zwemonderwijs en diplomazwemmen. Ouders en kandidaten worden niet als doelgroep genoemd. Inleiding, p. 1","ref":"Inleiding, p. 1","tests":"Examenregeling geschreven voor professionals","source":{"page":1,"quote":"is geschreven voor professionals die betrokken zijn bij het zwemonderwijs en"}},{"id":"AB-0091","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-06"],"question":"Waarop ziet de Nationale Raad Zwemveiligheid als landelijk opererende stichting toe?","options":["Op de kwaliteit van het zwemonderwijs, de zwemveiligheid en de zwemvaardigheid","Op de bouw en het onderhoud van zwembaden en recreatieve watergebieden","Op de veiligheid van open water met stroming en van de zee"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de kwaliteit van het zwemonderwijs, de zwemveiligheid en de zwemvaardigheid. Toezicht op de bouw van zwembaden wordt niet genoemd, en open water met stroming en de zee (niveau vier) vallen juist buiten haar focus. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"NRZ: landelijke stichting, toezicht op kwaliteit zwemonderwijs","source":{"page":5,"quote":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de"}},{"id":"AB-0092","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"onjuist","objectives":["AB-INL-08","AB-INL-06"],"question":"Welke bewering over de Nationale Raad Zwemveiligheid is NIET juist?","options":["Het is een landelijk opererende stichting.","Het bestuur kent een onafhankelijk voorzitter.","Het bestuur bestaat uit medewerkers van het ministerie van VWS."],"answer":2,"explanation":"Het bestuur van de Nationale Raad Zwemveiligheid is samengesteld uit partijen uit de zwembranche, met een onafhankelijk voorzitter. Het ministerie van VWS is een partner in het project NL Zwemveilig, geen bestuur. Dat het een landelijk opererende stichting is, klopt wel. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"bestuur NRZ: partijen zwembranche, onafhankelijk voorzitter","source":{"page":5,"quote":"samengesteld uit partijen uit de zwembranche en kent een onafhankelijk voorzitter"}},{"id":"AB-0093","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"kennis","objectives":["AB-INL-07"],"question":"Welke taak heeft de overheid in 1984 overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid?","options":["Het verzorgen van de uitgifte van de Nationale Zwemdiploma's","Het vaststellen van de eisen aan zwembaden voor diplomazwemmen","Het opleiden van examinatoren voor het Zwem-ABC"],"answer":0,"explanation":"In 1984 heeft de overheid de taak om de uitgifte van de Nationale Zwemdiploma's (het Zwem-ABC en de Zwemvaardigheidsdiploma's) te verzorgen overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid. Het vaststellen van eisen aan zwembaden en het opleiden van examinatoren worden daarbij niet genoemd. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"1984: overheid draagt uitgifte diploma's over aan voorganger NRZ","source":{"page":5,"quote":"In 1984 heeft de overheid deze taak overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid"}},{"id":"AB-0094","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"verschil","objectives":["AB-INL-09"],"question":"Onder welk instrument valt de kwaliteit van het eindresultaat: kandidaten voldoen aan de exameneisen voor de Nationale Zwemdiploma's?","options":["De Examenregeling Nationale Zwemdiploma's","De Licentie Nationale Zwemdiploma's","De kwaliteitsborging beroepsonderwijs"],"answer":0,"explanation":"De kwaliteit van het eindresultaat valt onder de Examenregeling Nationale Zwemdiploma's. De kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen valt onder de Licentie, en de kwaliteit van het beroepsonderwijs onder de kwaliteitsborging beroepsonderwijs. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"kwaliteit eindresultaat (Examenregeling) vs organisatie (Licentie)","source":{"page":5,"quote":"Kwaliteit van het eindresultaat: kandidaten voldoen aan exameneisen voor Nationale Zwemdiploma‘s (= Examenregeling Nationale Zwemdiploma's)"}},{"id":"AB-0095","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"verschil","objectives":["AB-INL-09"],"question":"Onder welk instrument valt de kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen?","options":["De Licentie Nationale Zwemdiploma's","De Examenregeling Nationale Zwemdiploma's","De Nationale Norm Zwemveiligheid"],"answer":0,"explanation":"De kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen valt onder de Licentie Nationale Zwemdiploma's. De Examenregeling gaat over het eindresultaat (kandidaten voldoen aan de exameneisen), en de Nationale Norm Zwemveiligheid geeft de gewenste mate van zwemveiligheid weer. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"kwaliteit eindresultaat (Examenregeling) vs organisatie (Licentie)","source":{"page":5,"quote":"Kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen (= Licentie Nationale Zwemdiploma's)"}},{"id":"AB-0096","category":"algemene_bepalingen","subtopic":"nrz_organisatie","type":"onjuist","objectives":["AB-INL-10"],"question":"Wat doet de Nationale Raad Zwemveiligheid volgens de Examenregeling NIET om haar maatschappelijke doel te bereiken?","options":["Zelf zwemlessen geven aan kinderen en volwassenen","Kennis en expertise verzamelen, ontwikkelen en verspreiden","De kwaliteit van zwemlesaanbieders normeren en controleren"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid bereikt haar doel door kennis en expertise te verzamelen, ontwikkelen en verspreiden, en door de kwaliteit van zwemlesaanbieders te normeren en te controleren. Zelf zwemlessen geven wordt niet genoemd; dat doen de zwemlesaanbieders. NRZ, de organisatie, p. 5","ref":"NRZ, de organisatie, p. 5","tests":"NRZ: kennis verspreiden en kwaliteit normeren/controleren","source":{"page":5,"quote":"Het normeren en controleren van de kwaliteit van zwemlesaanbieders"}},{"id":"AB-0097","category":"algemene_bepalingen","subtopic":"examenregeling","type":"kennis","objectives":["AB-INL-11"],"question":"Wat is volgens de Aanleiding een standaard examenprogramma?","options":["Een serie proeven, zoals 'onder water oriëntatie' en 'conditiezwemmen'","Een lijst basiselementen waaruit de zwemlesaanbieder zelf onderdelen kiest","Een eigen samenstelling van proeven die de Toetsingscommissie goedkeurt"],"answer":0,"explanation":"Een standaard examenprogramma is een serie proeven, zoals 'onder water oriëntatie' en 'conditiezwemmen'; de proeven bestaan uit vaardigheden die belangrijk zijn om te kunnen overleven. Een eigen samenstelling die de Toetsingscommissie goedkeurt, is een maatwerk examenprogramma. Basiselementen zijn categorieën van vaardigheden, geen examenprogramma. Aanleiding, p. 4","ref":"Aanleiding, p. 4","tests":"standaard examenprogramma = serie proeven","source":{"page":4,"quote":"Een standaard examenprogramma is een serie proeven, zoals ‘onder water oriëntatie’ en ‘conditiezwemmen’"}},{"id":"AB-0098","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-01"],"question":"Welke term gebruikt de Examenregeling waar voorheen de technische benaming 'kopsprong' werd gehanteerd?","options":["Duiken","Hoofdwaarts richting bodem gaan","Een sprong waarbij het hoofd boven water blijft"],"answer":0,"explanation":"De term 'duiken' vervangt de kopsprong. 'Hoofdwaarts richting bodem gaan' vervangt de hoekduik, en 'een sprong waarbij het hoofd boven water blijft' vervangt de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"kopsprong → duiken","source":{"page":"Bijlage 1","quote":"wordt de term ‘duiken’ gebruikt waar voorheen de technische benaming ‘kopsprong’ werd gehanteerd"}},{"id":"AB-0100","category":"algemene_bepalingen","subtopic":"definities","type":"casus","objectives":["AB-DEF-02"],"question":"Bij 'te water gaan met een sprong waarbij het hoofd boven water blijft' springt een kandidaat met gestrekte benen, niet in hurkhouding. Zijn hoofd blijft boven water. Hoe beoordeelt de examinator de sprong?","options":["Goed; de uitvoering is vrij, mits het hoofd boven water blijft.","Niet goed; de techniek van de hurksprong is voorgeschreven.",
