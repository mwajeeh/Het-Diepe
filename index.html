ge 1","weight":"core","statement":"‘Verticaal drijven met behulp van een voorwerp’ vervangt de term ‘HELP-houding’ (Heat Escape Lessening Posture), omdat de afkorting onbekend is en tot verwarring kan leiden."},{"id":"AB-DEF-15","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"Basiselementen zijn categorieën van vaardigheden."},{"id":"AB-DEF-16","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"Stichting Nationale Raad Zwemveiligheid is met ingang van 1 januari 2018 de nieuwe naam voor de stichting Nationaal Platform Zwembaden | NRZ."},{"id":"AB-INL-01","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"core","statement":"De Examenregeling Nationale Zwemdiploma's vormt een onderdeel van de Licentie Nationale Zwemdiploma's en is gekoppeld aan de Nationale Norm Zwemveiligheid."},{"id":"AB-INL-02","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"core","statement":"Voor iedereen herkenbaar: de zwemlesaanbieder is in het bezit van de Licentie Nationale Zwemdiploma's en het verstrekte zwemdiploma is uitgegeven door de Nationale Raad Zwemveiligheid."},{"id":"AB-INL-03","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":2,"weight":"core","statement":"De Examenregeling is vastgesteld door het bestuur van de Nationale Raad Zwemveiligheid en is tot stand gekomen in nauw overleg met de zwembranche."},{"id":"AB-INL-04","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Aanleiding","page":3,"weight":"core","statement":"Het huidige Zwem-ABC bestaat sinds 1998."},{"id":"AB-INL-05","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"detail","statement":"De Examenregeling bevat examenprogramma's, de bijbehorende normering en algemene bepalingen en richtlijnen voor het organiseren van diplomazwemmen, en is geschreven voor professionals in zwemonderwijs en diplomazwemmen."},{"id":"AB-INL-06","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de kwaliteit van het zwemonderwijs, de zwemveiligheid en de zwemvaardigheid."},{"id":"AB-INL-07","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"In 1984 heeft de overheid de taak om de uitgifte van de Nationale Zwemdiploma's te verzorgen overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid."},{"id":"AB-INL-08","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"detail","statement":"Het bestuur van de Nationale Raad Zwemveiligheid is samengesteld uit partijen uit de zwembranche en kent een onafhankelijk voorzitter."},{"id":"AB-INL-09","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"Kwaliteit van het eindresultaat valt onder de Examenregeling; kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen onder de Licentie Nationale Zwemdiploma's."},{"id":"AB-INL-10","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid bereikt haar doel door kennis te verzamelen, ontwikkelen en verspreiden, en door het normeren en controleren van de kwaliteit van zwemlesaanbieders."},{"id":"AB-INL-11","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Aanleiding","page":4,"weight":"detail","statement":"Een standaard examenprogramma is een serie proeven, zoals ‘onder water oriëntatie’ en ‘conditiezwemmen’; proeven bestaan uit vaardigheden die belangrijk zijn om te kunnen overleven."},{"id":"AB-KLED-01","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"De kledingvoorschriften zijn voor Zwemdiploma A en B gelijk: badkleding, shirt, hemd of blouse met lange mouwen, lange broek, jurk of rok tot de enkels, en schoenen."},{"id":"AB-KLED-02","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"Voor Zwemdiploma C wordt een jas met lange mouwen aan het kledingpakket toegevoegd."},{"id":"AB-KLED-03","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"Bij Zwemdiploma C wordt het onderdeel ‘gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen’ zonder de jas gezwommen."},{"id":"AB-KLED-04","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen."},{"id":"AB-KLED-05","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Kleding tijdens de examens laat zien dat je met dagelijkse kleding aan jezelf kunt redden bij onverwacht in het water terechtkomen; de kledingkeuze is afgestemd op het Nederlandse klimaat."},{"id":"AB-KLED-06","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Plastic-, leren-, katoenen- en sportschoenen zijn toegestaan."},{"id":"AB-KLED-07","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan."},{"id":"AB-KLED-08","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan die van het Zwem-ABC."},{"id":"AB-MAT-01","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Omdat de examens vooral de zwemveiligheid, het zelfvertrouwen en het overzicht in het water toetsen, moet het gebruik van lijnen zo minimaal mogelijk blijven."},{"id":"AB-MAT-02","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl en bij de beoordeling van de uitvoering (techniek) van de zwemslag."},{"id":"AB-MAT-03","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Een uitzondering voor het brilletje bij andere onderdelen in bijzondere situaties bespreek je vóór het selecteren van de kandidaten met de regioadviseur van de Nationale Raad Zwemveiligheid."},{"id":"AB-MAT-04","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter."},{"id":"AB-MAT-05","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het gat in het zeil heeft een diameter van 75 centimeter en bevindt zich (met de bovenkant) op 75 centimeter van het wateroppervlak."},{"id":"AB-MAT-06","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"detail","statement":"Bij ‘drijvend voorwerp’ is er ruimte om zelf invulling te geven aan het soort materiaal; voorbeelden zijn een mat, bootje of surfplank."},{"id":"AB-MAT-07","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het drijvend voorwerp waar onderdoor moet worden gezwommen heeft minimaal een lengte van 1,4 meter en een breedte van 70 centimeter."},{"id":"AB-MAT-08","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het is toegestaan meerdere smallere of kortere voorwerpen aan elkaar te koppelen, mits in totaal aan de minimale afmetingen wordt voldaan."},{"id":"AB-MAT-09","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Bij ‘over een drijvend voorwerp heen klimmen’ moet het voorwerp minimaal 70 centimeter breed zijn."},{"id":"AB-MAT-10","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het ‘soort wak’ bij Zwemdiploma C mag een vierkant of rond voorwerp zijn, zoals een hoepel, en heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter."},{"id":"AB-MAT-11","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":35,"weight":"core","statement":"Bij ‘met gebruik van een drijvend voorwerp blijven drijven’ is de keuze vrij: materialen uit het dagelijks leven (plastic tas, bal, petfles) en zwembadmaterialen (flexibeam, foam halter, plankje) zijn toegestaan."},{"id":"AB-NIV-01","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Zwemveilig zijn is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur."},{"id":"AB-NIV-02","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Zwemveiligheid is een dynamisch begrip, onder andere beïnvloed door beheersing van vaardigheden, omstandigheden, ervaring, ontwikkeling en zelfvertrouwen."},{"id":"AB-NIV-03","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"detail","statement":"Door de invloed van omstandigheden (zoals waterdiepte, watertemperatuur, stroming, kleding, zwembad of open water) is het onmogelijk om één niveau van zwemveiligheid te definiëren."},{"id":"AB-NIV-04","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Er zijn vier veelvoorkomende situaties: een zwembad zonder attracties; een zwembad met attracties; een zwembad met attracties en open water zonder stroming of grote golfslag; open water/zee met mogelijkheid tot stroming en sterke golfslag."},{"id":"AB-NIV-05","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"Een zwembad zonder attracties hoort bij Zwemdiploma A, een zwembad met attracties (zoals (wildwater)glijbaan, golfslagbassin, stroomversnelling) bij Zwemdiploma B, en daarnaast open water zonder stroming of grote golfslag bij Zwemdiploma C."},{"id":"AB-NIV-06","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"De Nationale Raad Zwemveiligheid focust op de niveaus één tot en met drie; niveau vier (open water met stroming/zee) is zeer specifiek, in hoge mate onvoorspelbaar en niet of nauwelijks te oefenen in een zwembad."},{"id":"AB-NIV-07","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"Het eerste en tweede niveau (Zwemdiploma's A en B) worden gepositioneerd als ‘op weg zijn naar zwemveilig’."},{"id":"AB-NIV-08","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"De Nationale Norm Zwemveiligheid ligt op niveau drie (Zwemdiploma C): zwemveilig in zwembaden met attracties en in open water zonder stroming of grote golfslag."},{"id":"AB-NIV-09","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Inleiding","page":1,"weight":"detail","statement":"De Nationale Norm Zwemveiligheid bestaat uit uniforme landelijke richtlijnen die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven."},{"id":"AB-NIV-10","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"detail","statement":"Voor niveau vier zijn naast vaardigheden ook specifieke kennis en voldoende kracht en uithoudingsvermogen nodig."},{"id":"AB-ORG-01","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Bij onvoldoende uitvoering mag de kandidaat een onderdeel nogmaals uitvoeren, maximaal drie keer in totaal."},{"id":"AB-ORG-02","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Het examen voor een zwemcertificaat kan tegelijk plaatsvinden met het examen voor één of meer diploma's van het Zwem-ABC, maar mag ook op een ander moment."},{"id":"AB-ORG-03","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"detail","statement":"De aanvraag van het examen voor een zwemcertificaat gebeurt op dezelfde manier als voor het Zwem-ABC."},{"id":"AB-ORG-04","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"De proeven van het standaard examenprogramma mogen in een willekeurige volgorde worden getoond."},{"id":"AB-ORG-05","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Het examenprogramma uitvoeren in een ‘circuitvorm’ (kleine groepjes voeren tegelijkertijd verschillende proeven uit) is toegestaan."},{"id":"AB-ORG-06","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Voor deelname aan een ‘hoger’ zwemdiploma/zwemcertificaat is het bezit van een ‘lager’ diploma/certificaat niet vereist; zwemdiploma's overslaan mag."},{"id":"AB-ORG-07","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Ook bij het overstappen van een behaald zwemcertificaat naar een zwemdiploma is een lager diploma niet vereist."},{"id":"AB-ORG-08","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen."},{"id":"AB-ORG-09","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Uitgangspunt is dat de uitvoering van een examenprogramma voor Zwemdiploma A, B of C maximaal 1,5 uur duurt."},{"id":"AB-ORG-10","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Een aanvraag kan gelden voor 1 of meer groepen (voor hetzelfde of een verschillend zwemdiploma); het totale blok diplomazwemmen duurt bij voorkeur niet langer dan 2,5 uur."},{"id":"AB-ORG-11","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"detail","statement":"De zwemlesaanbieder mag op een dag meerdere blokken diplomazwemmen organiseren en aanvragen."},{"id":"AB-ORG-12","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"core","statement":"Het diplomazwemmen vindt plaats tussen 08.30 uur en 21.00 uur; voor afwijkende tijden moet vooraf worden overlegd met de regioadviseur van de Nationale Raad Zwemveiligheid."},{"id":"AB-ORG-13","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"core","statement":"De Examinator bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen, zolang het examen overzichtelijk verloopt en kandidaten goed beoordeeld kunnen worden."},{"id":"AB-ORG-14","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"detail","statement":"Kandidaten moeten voldoende tijd en ruimte hebben; het is niet wenselijk dat ze geruime tijd moeten wachten, dus worden de onderdelen bij voorkeur opeenvolgend uitgevoerd."},{"id":"AB-ORG-15","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"detail","statement":"Voor het maatwerk examenprogramma kan een eigen volgorde van onderdelen in de vorm van proeven worden samengesteld."},{"id":"AB-ZWEM-01","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"De examens voor het Zwem-ABC worden afgenomen in een bassin met een oppervlakte van ten minste 160 m2."},{"id":"AB-ZWEM-02","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Het bassin voor het Zwem-ABC heeft een waterdiepte van ten minste 80 centimeter."},{"id":"AB-ZWEM-03","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Het bassin heeft over een wateroppervlakte van ten minste 40 m2 een waterdiepte van minimaal 1,8 meter."},{"id":"AB-ZWEM-04","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"detail","statement":"De afmetingen zijn gekozen in het belang van veiligheid en omdat ze de werkelijkheid reëel benaderen; kinderen raken in de voorgeschreven diepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven."},{"id":"AB-ZWEM-05","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Bepaalde proeven of onderdelen mogen in andere bassins worden uitgevoerd, bijvoorbeeld het recreatie- of golfslagbad."},{"id":"AB-ZWEM-06","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2."},{"id":"AB-ZWEM-07","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":33,"weight":"detail","statement":"De algemene bepalingen en richtlijnen zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen."},{"id":"TV-EXA-01","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator Nationale Zwemdiploma's is verantwoordelijk voor de kwaliteit van het diplomazwemmen; hij/zij moet bekend zijn bij de Nationale Raad Zwemveiligheid en in het bezit zijn van het certificaat tot Examinator Nationale Zwemdiploma's."},{"id":"TV-EXA-02","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"Een Licentiehouder die vanuit de eigen organisatie geen Examinator kan inzetten, kan er een inhuren; die Examinator is dan verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem/haar inhuurt."},{"id":"TV-EXA-03","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"Een Licentiehouder kan/mag over meerdere Examinatoren beschikken, zodat niet steeds dezelfde persoon verantwoordelijk is voor het hele proces van diplomazwemmen."},{"id":"TV-EXA-04","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk; deze is de beslisser."},{"id":"TV-EXA-05","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator mag taken delegeren aan collega's mits de kwaliteit gewaarborgd blijft; het enige wat niet gedelegeerd mag worden is de aanwezigheid bij het diplomazwemmen waarvoor hij/zij verantwoordelijk is."},{"id":"TV-EXA-06","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator is voor het diplomazwemmen het aanspreekpunt voor de Nationale Raad Zwemveiligheid voor de kwaliteit."},{"id":"TV-EXA-07","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"De Examinator toetst of het diplomazwemmen kwalitatief voldoet aan de eisen van de Examenregeling in combinatie met het Handboek Licentie Nationale Zwemdiploma's."},{"id":"TV-EXA-08","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator heeft een observerende, signalerende en rapporterende taak voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-09","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"De Examinator is bij het diplomazwemmen in feite het ‘gezicht’ van de Nationale Raad Zwemveiligheid en koppelt de resultaten terug naar de organiserende zwemlesaanbieder en naar de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-10","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-11","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator bepaalt samen met collega's de volgorde van de routing en de keuze voor circuitvormen, en stelt de volgorde van de onderdelen van het diplomazwemmen vast."},{"id":"TV-EXA-12","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"detail","statement":"De Examinator zorgt ervoor dat de kandidaten aan de hand van de beoordelingslijsten conform de Examenregeling worden beoordeeld."},{"id":"TV-EXA-13","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator bepaalt de uitslag conform de Examenregeling, na afstemming met een eventueel aanwezige medewerker van de Nationale Raad Zwemveiligheid of gedelegeerde."},{"id":"TV-EXA-14","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Als een jeugdige kandidaat wordt afgewezen, moet de reden daarvan kenbaar worden gemaakt aan de ouders/verzorgers."},{"id":"TV-EXA-15","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De uitgereikte zwemdiploma's zijn namens de Nationale Raad Zwemveiligheid ondertekend; de Examinator is namens de Licentiehouder verantwoordelijk voor de ondertekening en mag dit zelf doen of delegeren."},{"id":"TV-EXA-16","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Taken van de Examinator vóór het examen: kandidaten selecteren, het diplomazwemmen aanvragen, kandidaten op de beoordelingslijsten vermelden, zwemdiploma's gereed maken en zorgen voor benodigde materialen."},{"id":"TV-EXA-17","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Taken van de Examinator rond en na het examen: medewerker/gedelegeerde ontvangen, voorbespreking, goed georganiseerd diplomazwemmen, uitslag vaststellen, diploma's ondertekenen en uitreiken, feedbackgesprek, rapporteren en evalueren."},{"id":"TV-EXA-18","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"detail","statement":"De Examinator beschikt onder andere over beoordelingsformulieren en inlogcodes om via ‘Mijn NRZ’ het diplomazwemmen en zwemdiploma's aan te vragen."},{"id":"TV-EXA-19","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren zoals beschreven in de Examenregeling."},{"id":"TV-EXA-20","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via de website van de Nationale Raad Zwemveiligheid (‘Mijn NRZ’)."},{"id":"TV-EXA-21","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Na akkoord van de Nationale Raad Zwemveiligheid wordt uiterlijk 24 uur voor het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar."},{"id":"TV-EXA-22","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"Er moeten voldoende beoordelingslijsten zijn: één voor de Licentiehouder, één voor de Examinator en één voor de eventueel aanwezige medewerker van de Nationale Raad Zwemveiligheid en/of gedelegeerde."},{"id":"TV-EXA-23","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Zwemdiploma's worden gereed gemaakt met de datum van het diplomazwemmen, de naam en geboortedatum van de kandidaat en de naam van het zwembad."},{"id":"TV-EXA-24","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Als een medewerker/gedelegeerde namens de Nationale Raad Zwemveiligheid aanwezig is, vindt vóór aanvang een voorbespreking van ongeveer 15 minuten plaats met de Examinator."},{"id":"TV-EXA-25","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"Onderwerpen van de voorbespreking zijn onder andere de volgorde en routing, de taken van organisatorisch betrokkenen en eventuele bijzonderheden bij kandidaten."},{"id":"TV-EXA-26","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"De medewerker/gedelegeerde wordt aan het publiek voorgesteld voordat het diplomazwemmen van start gaat."},{"id":"TV-EXA-27","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"Tijdens het diplomazwemmen zorgt de Examinator voor een goed lopend diplomazwemmen, zoals een goede routing en een adequate begeleiding van de kandidaten."},{"id":"TV-EXA-28","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Een kandidaat is geslaagd als alle onderdelen voldoende zijn uitgevoerd; voor het zwemcertificaat moet het verplichte deel voldoende zijn en wordt bijgehouden welke onderdelen van het open deel de kandidaat beheerst."},{"id":"TV-EXA-29","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De Examinator is eindverantwoordelijk voor het vaststellen van het resultaat; op de beoordelingslijsten wordt in ieder geval aangegeven welk onderdeel onvoldoende is uitgevoerd."},{"id":"TV-EXA-30","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De kandidaat heeft altijd het recht het diplomazwemmen af te maken, ook als de afwijzing al een feit is."},{"id":"TV-EXA-31","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Een afgewezen kandidaat moet vóór de diploma-uitreiking op de hoogte worden gebracht; de Examinator of iemand anders die betrokken is (bijvoorbeeld de eigen lesgever) legt het kind en de ouder(s) de reden uit."},{"id":"TV-EXA-32","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Zwemdiploma's en zwemcertificaten worden ondertekend door of namens de Examinator; geslaagde kandidaten ontvangen het zwemdiploma direct na afloop van het diplomazwemmen."},{"id":"TV-EXA-33","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"De Examinator biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek."},{"id":"TV-EXA-34","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Het diplomazwemmen wordt afgerond met een feedbackgesprek van ongeveer 15-20 minuten tussen de Examinator en de gedelegeerde, al dan niet aangevuld met betrokken medewerkers."},{"id":"TV-EXA-35","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"In het feedbackgesprek komt aan de orde of het diplomazwemmen organisatorisch heeft voldaan, hoe de Examinator de verantwoordelijkheid heeft ingevuld en hoe de gedelegeerde zijn/haar rol heeft vervuld; uitgangspunten zijn wederzijds respect en professioneel handelen."},{"id":"TV-EXA-36","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De Examinator maakt na afloop een verslag over de kwaliteit van het diplomazwemmen en stuurt dit binnen 7 dagen naar de Nationale Raad Zwemveiligheid via de website."},{"id":"TV-EXA-37","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":42,"weight":"detail","statement":"Bij aanwezigheid van een gedelegeerde of medewerker vullen zowel de Examinator als de gedelegeerde/medewerker een aanvullend feedbackformulier in, ook binnen 7 dagen; Licentiehouder en gedelegeerde kunnen daarna direct kennis nemen van de inhoud."},{"id":"TV-EXA-38","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"Handleiding","page":3,"weight":"detail","statement":"(Handleiding) De Examinator beschikt over vaardigheden als tegenstellingen en conflicten onderkennen, objectief oordelen op basis van geobserveerde vaardigheden, rapporteren, beslissingen nemen en het diplomazwemmen evalueren."},{"id":"TV-EXT-01","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3","page":37,"weight":"core","statement":"De externe kwaliteitsborging bestaat uit toezicht op de kwaliteit van het diplomazwemmen door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid, onder andere door steekproefsgewijs examens te bezoeken."},{"id":"TV-EXT-02","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid zorgt dat het diplomazwemmen periodiek wordt bezocht door gedelegeerden en aanvullend door aangewezen medewerkers."},{"id":"TV-EXT-03","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"Een gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren."},{"id":"TV-EXT-04","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De gedelegeerde observeert de kandidaten met beoordelingslijsten die door de examinator worden aangeleverd, en observeert daarnaast de examinator en de organisatie van het diplomazwemmen."},{"id":"TV-EXT-05","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"Vindt de gedelegeerde dat diploma's ten onrechte worden uitgereikt, dan stelt hij dit vóór de uitslagbepaling kort aan de orde en licht hij zijn onderbouwing toe in het feedbackgesprek."},{"id":"TV-EXT-06","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De gedelegeerde stuurt zijn verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid; het is in te zien door de Licentiehouder, de gedelegeerde en de aangewezen medewerker."},{"id":"TV-EXT-07","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"Aangewezen medewerkers van de Nationale Raad Zwemveiligheid zijn het aanspreekpunt voor Licentiehouders en gedelegeerden en verantwoordelijk voor het diplomazwemmen in hun eigen werkgebied."},{"id":"TV-EXT-08","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"De medewerker beoordeelt de verslagformulieren van de Examinator en de gedelegeerden en controleert in de systemen de aanvragen van het diplomazwemmen."},{"id":"TV-EXT-09","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De medewerker bezoekt het diplomazwemmen steekproefsgewijs, zowel aangekondigd als onaangekondigd."},{"id":"TV-EXT-10","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"Tijdens het diplomazwemmen heeft de medewerker dezelfde rol en taken als de gedelegeerde, maar kan daarnaast bezwaar maken tegen de organisatie en het functioneren van de Examinator en heeft directe invloed op de uitslagbepaling."},{"id":"TV-EXT-11","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."},{"id":"TV-EXT-12","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"In een verbetertraject maken aangewezen medewerkers met Licentiehouders afspraken over verbetering van het resultaat, het functioneren van de Examinator of de organisatorische/administratieve gang van zaken."},{"id":"TV-EXT-13","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Verbeterafspraken worden schriftelijk/per e-mail vastgelegd en gedeeld met de kwaliteitsmanager van de Nationale Raad Zwemveiligheid."},{"id":"TV-EXT-14","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Onderdeel van een verbetertraject kan een extra (onaangekondigde) controle zijn, uitgevoerd door een gedelegeerde of een medewerker."},{"id":"TV-EXT-15","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"Komt de Licentiehouder de verbeterafspraken niet na en blijft verbetering uit, dan kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie; dit wordt schriftelijk gecommuniceerd."},{"id":"TV-EXT-16","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Een Licentiehouder kan ook op eigen verzoek afspraken maken met de medewerker over een verbetertraject en/of extra controlemomenten."},{"id":"TV-EXT-17","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Bij onvrede over het gedrag of handelen van een medewerker of vrijwilliger van de Nationale Raad Zwemveiligheid kan schriftelijk een klacht worden ingediend; het klachtenreglement is van toepassing."},{"id":"TV-LIC-01","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Het diplomazwemmen kent interne en externe kwaliteitsborging."},{"id":"TV-LIC-02","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen (organisatie van het diplomazwemmen en uitvoering van de examenprogramma's) en stelt hiervoor een Examinator Nationale Zwemdiploma's aan."},{"id":"TV-LIC-03","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren."},{"id":"TV-LIC-04","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Een Licentiehouder is een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid gebruik wenst te maken van de Licentie Nationale Zwemdiploma's."},{"id":"TV-LIC-05","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"Voorbeelden van Licentiehouders zijn een directie van een zwembad of exploitatiemaatschappij, een bestuur van een stichting of (zwem)vereniging, bevoegd gezag van een school of de eigenaar van een zwemschool."},{"id":"TV-LIC-06","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid stelt zwemdiploma's en zwemcertificaten ter beschikking aan Licentiehouders tegen een door het bestuur vastgestelde prijs."},{"id":"TV-LIC-07","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"De Nationale Raad Zwemveiligheid mag de levering aan een Licentiehouder beperken of staken, of zwemdiploma's en/of zwemcertificaten terugvorderen als de Licentiehouder zich niet aan de voorwaarden houdt."},{"id":"TV-LIC-08","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"De Licentiehouder ontvangt een raamsticker die zichtbaar kan worden getoond; een actueel overzicht van alle Licentiehouders staat op www.allesoverzwemles.nl."},{"id":"TV-LIC-09","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Houdt de Licentiehouder zich niet aan de Examenregeling, dan kan de Licentie tijdelijk of permanent worden ingetrokken; daarna mag hij geen Nationale Zwemdiploma's meer aanvragen en uitgeven of diplomazwemmen organiseren."},{"id":"TV-LIC-10","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder draagt zorg voor de beschikbaarheid van een bassin dat voldoet aan de voorschriften en voor de aanwezigheid van de juiste materialen."},{"id":"TV-LIC-11","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De kosten van het diplomazwemmen, zoals honorering, reis- en verblijfkosten van de Examinator, kosten van zwemdiploma's, huur van het zwembad en administratiekosten, zijn voor rekening van de Licentiehouder."},{"id":"TV-LIC-12","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken; de ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder."},{"id":"TV-LIC-13","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder kan met de inlogcodes tot 24 uur voor het diplomazwemmen de status van de aanvraag bekijken en indien gewenst wijzigen."},{"id":"TV-LIC-14","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"Wordt een annulering niet binnen 24 uur van tevoren gemeld, dan worden de te vergoeden kosten van de gedelegeerde (vrijwilligersvergoeding en reiskosten) volledig bij de Licentiehouder in rekening gebracht."}],"questions":[{"id":"EP-0001","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-03"],"question":"Proef Onder water oriëntatie, Zwemdiploma B:\nOp hoeveel meter van de startkant hangt het zeil?","options":["6 meter","3 meter","1 meter"],"answer":0,"explanation":"Bij Zwemdiploma B hangt het zeil op 6 meter van de startkant. 3 meter is de afstand bij Zwemdiploma A. 1 meter is hoe ver de kandidaat bij proef C1 voor het zeil onder water gaat. §1.1.1–1.1.3, p. 7, 9 en 11","ref":"§1.1.1–1.1.3, p. 7, 9 en 11","tests":"afstand zeil A (3 m) vs B (6 m)","source":{"page":9,"quote":"zeil dat zich op 6 meter van de startkant bevindt"},"rev":2},{"id":"EP-0010","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-01"],"question":"Proef A1 Survival, Zwemdiploma A:\nDe kandidaat gaat vanaf enige hoogte met een voetsprong voorwaarts te water. Hij komt boven. Wat volgt aansluitend?","options":["15 seconden watertrappen","60 seconden watertrappen","5 seconden drijven op de buik"],"answer":0,"explanation":"In proef A1 volgt na het bovenkomen aansluitend 15 seconden watertrappen, en daarna 12,5 meter zwemmen. De 60 seconden watertrappen hoort bij proef A6. De 5 seconden drijven op de buik hoort bij proef A5. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A1: 15 seconden watertrappen na de voetsprong","source":{"page":7,"quote":"na het bovenkomen aansluitend 15 seconden watertrappen, gevolgd door 12,5 meter zwemmen"},"rev":2},{"id":"EP-0011","category":"examenprogrammas","subtopic":"diploma_a","type":"stellingen","objectives":["EP-DIPA-02"],"question":"Proef A1 Survival, Zwemdiploma A:\nWelke stelling is juist?\nStelling 1: Na het watertrappen zwemt de kandidaat 50 meter.\nStelling 2: Aan het einde van de proef klimt de kandidaat zelfstandig uit het water op de kant.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bij A1 zwemt de kandidaat na het watertrappen 12,5 meter. 50 meter, met 1 keer onder een drijvend voorwerp door, hoort bij proef B1. Stelling 2 is juist: de proef wordt afgerond met zelfstandig uit het water op de kant klimmen. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A1: 12,5 meter zwemmen, afronden met uit het water klimmen","source":{"page":7,"quote":"12,5 meter zwemmen, proef afronden met zelfstandig uit het water op de kant klimmen"},"rev":2},{"id":"EP-0012","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-03","EP-VERG-02"],"question":"Proef A2 Onder water oriëntatie, Zwemdiploma A:\nEen kandidaat gaat met een sprong van de kant te water. Hij duikt dus niet. Daarna zwemt hij zonder boven te komen door het gat in het zeil. Voldoet het te water gaan?","options":["Ja, een sprong mag; duiken heeft de voorkeur.","Nee, bij A moet de kandidaat van de kant duiken.","Nee, hij moet met een voetsprong voorwaarts te water gaan."],"answer":0,"explanation":"Bij A2 gaat de kandidaat van de kant te water met een sprong; duiken heeft de voorkeur. Verplicht duiken geldt bij B2 en C2. De voetsprong voorwaarts vanaf enige hoogte hoort bij proef A1 Survival. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A2: sprong toegestaan, duiken heeft de voorkeur","source":{"page":7,"quote":"Van de kant te water gaan met een sprong (duiken heeft de voorkeur)"},"rev":2},{"id":"EP-0013","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-03","EP-VERG-03"],"question":"Proef A2 Onder water oriëntatie, Zwemdiploma A:\nBij het diplomazwemmen hangt het zeil op 6 meter van de startkant. Wat stelt de examinator vast?","options":["Dit klopt niet; bij A hangt het zeil op 3 meter.","Dit klopt; het zeil hangt altijd op 6 meter.","Dit klopt niet; bij A hangt het zeil op 1 meter."],"answer":0,"explanation":"In het standaard examenprogramma van Zwemdiploma A hangt het zeil op 3 meter van de startkant. 6 meter geldt bij B2 en C2. De 1 meter komt uit proef C1: daar gaat de kandidaat 1 meter voor het zeil onder water. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"afstand zeil A (3 m) vs B (6 m)","source":{"page":7,"quote":"hangend zeil dat zich op 3 meter van de startkant bevindt"},"rev":2},{"id":"EP-0014","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-04","EP-VERG-05"],"question":"Proef A3 Conditiezwemmen, Zwemdiploma A:\nDe kandidaat wisselt schoolslag en enkelvoudige rugslag af. Hoe is de proef opgebouwd?","options":["4 keer 25 meter","6 keer 25 meter","2 keer 75 meter"],"answer":0,"explanation":"A3 is 25 meter schoolslag en 25 meter enkelvoudige rugslag, en daarna nog een keer: 4 keer 25 meter. 6 keer 25 meter is proef B3. 2 keer 75 meter is proef C3. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: vier keer 25 meter afwisselend schoolslag en enkelvoudige rugslag","source":{"page":7,"quote":"25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, gevolgd door 25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken, gevolgd door 25 meter enkelvoudige rugslag"},"rev":2},{"id":"EP-0015","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-05"],"question":"Proef A3 Conditiezwemmen, Zwemdiploma A:\nTijdens welk deel zakt de kandidaat 1 keer voetwaarts richting de bodem?","options":["De tweede 25 meter schoolslag","De laatste 25 meter enkelvoudige rugslag","De eerste 25 meter schoolslag"],"answer":0,"explanation":"In A3 wordt de tweede 25 meter schoolslag onderbroken door 1 keer voetwaarts richting de bodem zakken. De eerste 25 meter schoolslag en de laatste 25 meter rugslag worden niet onderbroken. Een onderbreking in de laatste 25 meter rugslag hoort bij B3. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: voetwaarts zakken in de tweede 25 meter schoolslag","source":{"page":7,"quote":"25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken"},"rev":2},{"id":"EP-0016","category":"examenprogrammas","subtopic":"diploma_a","type":"stellingen","objectives":["EP-DIPA-05","EP-DIPA-04"],"question":"Proef A3 Conditiezwemmen, Zwemdiploma A:\nWelke stelling is juist?\nStelling 1: Tijdens de laatste 25 meter maakt de kandidaat 2 halve draaien.\nStelling 2: De kandidaat zwemt in totaal 100 meter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: 2 keer een halve draai om de lengteas hoort bij B3; in A3 is de onderbreking 1 keer voetwaarts richting de bodem zakken. Stelling 2 is juist: A3 is vier keer 25 meter, samen 100 meter. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: onderbreking is voetwaarts zakken, geen halve draaien","source":{"page":7,"quote":"onderbroken door 1 keer voetwaarts richting de bodem zakken, gevolgd door 25 meter enkelvoudige rugslag"},"rev":2},{"id":"EP-0017","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-08","EP-VERG-08"],"question":"Proef A5 Je vertrouwd voelen in het water, Zwemdiploma A:\nDe kandidaat heeft 5 seconden op de buik gedreven en enkele slagen gezwommen. Wat volgt daarna?","options":["Een halve draai en 10 seconden drijven op de rug","Een halve draai en 15 seconden drijven op de rug","5 meter hoofdwaarts voortbewegen op de rug"],"answer":0,"explanation":"In A5 volgen na de enkele slagen een halve draai naar rugligging en 10 seconden drijven op de rug. 15 seconden drijven op de rug hoort bij B en C. 5 meter hoofdwaarts voortbewegen op de rug hoort bij proef B5. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A5: halve draai naar rugligging en 10 seconden drijven op de rug","source":{"page":7,"quote":"halve draai naar rugligging, gevolgd door 10 seconden drijven op de rug"},"rev":2},{"id":"EP-0018","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-07"],"question":"Proef A5 Je vertrouwd voelen in het water, Zwemdiploma A:\nWaarmee begint de proef?","options":["Enkele slagen zwemmen op de buik","In het water springen met een sprong naar keuze","Achterwaarts te water gaan"],"answer":0,"explanation":"A5 begint met enkele slagen zwemmen op de buik, aansluitend 5 seconden drijven op de buik. In het water springen met een sprong naar keuze is het begin van proef B5. Achterwaarts te water gaan is het begin van proef B1. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A5: begint met enkele slagen zwemmen op de buik en 5 seconden drijven op de buik","source":{"page":7,"quote":"Enkele slagen zwemmen op de buik, aansluitend 5 seconden drijven op de buik"},"rev":2},{"id":"EP-0019","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-10","EP-VERG-09"],"question":"Proef A6 Oriënteren boven water en verplaatsen, Zwemdiploma A:\nDe kandidaat gaat 60 seconden watertrappen met armen en benen. Wat laat hij daarbij ook zien?","options":["2 keer een hele draai om de lengteas","Verplaatsen in meerdere richtingen","1 keer voetwaarts richting de bodem zakken"],"answer":0,"explanation":"In A6 maakt de kandidaat tijdens de 60 seconden watertrappen 2 keer, al watertrappend, een hele draai om de lengteas. Verplaatsen in meerdere richtingen en afronden met voetwaarts richting de bodem zakken horen bij proef B6. §1.1.1, p. 8","ref":"§1.1.1, p. 8","tests":"A6: 2 keer een hele draai om de lengteas tijdens het watertrappen","source":{"page":8,"quote":"waarin 2 keer, al watertrappend, een hele draai om de lengteas gemaakt wordt"},"rev":2},{"id":"EP-0020","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-09","EP-DIPA-10"],"question":"Proef A6 Oriënteren boven water en verplaatsen, Zwemdiploma A:\nDe kandidaat gaat met een sprong naar keuze te water. Hoe lang gaat hij daarna watertrappen met armen en benen?","options":["60 seconden","30 seconden","15 seconden"],"answer":0,"explanation":"In A6 volgt na de sprong naar keuze 60 seconden watertrappen met gebruik van armen en benen. 30 seconden watertrappen met armen en benen hoort bij proef C5. 15 seconden watertrappen hoort bij proef A1 Survival. §1.1.1, p. 8","ref":"§1.1.1, p. 8","tests":"A6: sprong naar keuze en 60 seconden watertrappen met armen en benen","sour a het verticaal drijven","source":{"page":11,"quote":"gevolgd door 5 meter voortbewegen op de rug met gebruik van armen"},"rev":2},{"id":"EP-0037","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-DIPC-03","EP-DIPB-08"],"question":"Onderdelen B.9 en C.11 (voortbewegen op de rug met gebruik van de armen):\nWat is volgens Bijlage 2 een verschil tussen deze twee onderdelen?","options":["C.11 wordt gekleed uitgevoerd, B.9 niet.","B.9 wordt gekleed uitgevoerd, C.11 niet.","Bij B.9 is de afstand 5 meter, bij C.11 15 meter."],"answer":0,"explanation":"In Bijlage 2 heet C.11 '5 meter gekleed voortbewegen op de rug met gebruik van de armen'. B.9 heet '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen', zonder 'gekleed'. De afstand is bij allebei 5 meter. Bijlage 2","ref":"Bijlage 2","tests":"B.9 vs C.11: C.11 gekleed","source":{"page":"Bijlage 2","quote":"C.11 5 meter gekleed voortbewegen op de rug met gebruik van de armen"}},{"id":"EP-0038","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-04"],"question":"Proef C1 Survival, Zwemdiploma C:\nHoe gaat de kandidaat te water voordat hij 100 meter zwemt?","options":["Met een sprong waarbij het hoofd boven water blijft","Met een rol voorover","Met een duik vanaf de kant of het startblok"],"answer":0,"explanation":"Vóór de 100 meter gaat de kandidaat te water met een sprong waarbij het hoofd boven water blijft. De rol voorover hoort bij het begin van C1. Van de kant duiken hoort bij proef C2 Onder water oriëntatie. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: sprong waarbij het hoofd boven water blijft vóór de 100 meter","source":{"page":11,"quote":"Te water gaan met een sprong waarbij het hoofd boven water blijft, aansluitend 100 meter zwemmen"},"rev":2},{"id":"EP-0039","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-05"],"question":"Proef C1 Survival, Zwemdiploma C:\nDe kandidaat zwemt 100 meter. Hij zwemt daarbij 1 keer onder een drijvend voorwerp door. Wat doet hij tijdens de 100 meter nog meer?","options":["1 keer over een drijvend voorwerp heen klimmen","1 keer hoofdwaarts richting bodem gaan","15 seconden watertrappen"],"answer":0,"explanation":"De 100 meter in C1 wordt onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen. Hoofdwaarts richting bodem gaan hoort bij proef C3. De 15 seconden watertrappen komen in C1 na de rol voorover, vóór de 100 meter. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 100 meter onderbroken door onder en over een drijvend voorwerp","source":{"page":11,"quote":"onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen"},"rev":2},{"id":"EP-0040","category":"examenprogrammas","subtopic":"diploma_c","type":"stellingen","objectives":["EP-DIPC-05","EP-DIPC-04"],"question":"Proef C1 Survival, Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: De 100 meter begint na een sprong waarbij het hoofd boven water blijft.\nStelling 2: Na de 100 meter klimt de kandidaat zelfstandig uit het water op de kant.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: vóór de 100 meter gaat de kandidaat te water met een sprong waarbij het hoofd boven water blijft. Stelling 2 is ook juist: na de 100 meter wordt de proef afgerond met zelfstandig uit het water op de kant klimmen. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 100 meter na sprong met hoofd boven water, daarna uit het water klimmen","source":{"page":11,"quote":"en 1 keer over een drijvend voorwerp heen te klimmen, proef afronden met zelfstandig uit het water op de kant klimmen"},"rev":2},{"id":"EP-0041","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-06"],"question":"Proef C1 Survival, Zwemdiploma C:\nDe kandidaat gaat te water met een sprong naar keuze. Hij zwemt enkele slagen. Wat volgt aansluitend?","options":["Door het gat in een verticaal hangend zeil zwemmen","Bovenkomen in een soort wak","1 keer onder een drijvend voorwerp door zwemmen"],"answer":0,"explanation":"In C1 gaat de kandidaat na de sprong en enkele slagen 1 meter voor een verticaal hangend zeil onder water en zwemt hij door het gat. Bovenkomen in een soort wak is het slot van proef C2, en onder een drijvend voorwerp door zwemmen zit in de 100 meter van C1. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 1 meter voor het zeil onder water gaan en door het gat zwemmen","source":{"page":11,"quote":"1 meter voor een verticaal in het water hangend zeil onder water gaan en door het gat in het zeil zwemmen"},"rev":2},{"id":"EP-0042","category":"examenprogrammas","subtopic":"diploma_c","type":"stellingen","objectives":["EP-DIPC-01"],"question":"Proef C1 Survival, Zwemdiploma C:\nWelke stelling over het begin van de proef is juist?\nStelling 1: De kandidaat gaat te water met een rol voorover.\nStelling 2: Na de rol voorover gaat de kandidaat 15 seconden watertrappen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: C1 begint met te water gaan met een rol voorover. Stelling 2 is ook juist: aansluitend gaat de kandidaat 15 seconden watertrappen, gevolgd door 30 seconden verticaal blijven drijven. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: rol voorover, 15 s watertrappen, 30 s verticaal drijven, 5 m op de rug","source":{"page":11,"quote":"Te water gaan met een rol voorover, aansluitend 15 seconden watertrappen, gevolgd door 30 seconden verticaal blijven drijven"},"rev":2},{"id":"EP-0043","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-07","EP-VERG-03"],"question":"Proef C2 Onder water oriëntatie, Zwemdiploma C:\nWaarmee rondt de kandidaat de proef af?","options":["Bovenkomen in een soort wak","Zelfstandig uit het water op de kant klimmen","1 keer hoofdwaarts richting bodem gaan"],"answer":0,"explanation":"C2 wordt na het zwemmen door het zeil afgerond met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak. Zelfstandig uit het water klimmen hoort bij proef C1 Survival. Hoofdwaarts richting bodem gaan hoort bij proef C3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C2: afronden met bovenkomen in een soort wak","source":{"page":11,"quote":"proef afronden met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak"},"rev":2},{"id":"EP-0044","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-03","EP-DIPC-07","EP-DIPB-03"],"question":"Proef Onder water oriëntatie:\nBij welk zwemdiploma komt de kandidaat na het zeil boven in een soort wak?","options":["Zwemdiploma C","Zwemdiploma B","Zwemdiploma A"],"answer":0,"explanation":"Alleen proef C2 eindigt met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak. Bij A2 en B2 eindigt de proef na het zwemmen door het gat in het zeil. §1.1.1–1.1.3, p. 7, 9 en 11","ref":"§1.1.1–1.1.3, p. 7, 9 en 11","tests":"B2 vs C2: soort wak alleen bij C","source":{"page":11,"quote":"meter van de startkant bevindt, proef afronden met naar de oppervlakte zwemmen"},"rev":2},{"id":"EP-0045","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-08","EP-VERG-06"],"question":"Proef C3 Conditiezwemmen, Zwemdiploma C:\nHoe is de proef opgebouwd?","options":["75 meter schoolslag, dan 75 meter enkelvoudige rugslag","6 keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","75 meter enkelvoudige rugslag, dan 75 meter schoolslag"],"answer":0,"explanation":"C3 is 75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem gaan, gevolgd door 75 meter enkelvoudige rugslag. 6 keer 25 meter afwisselend is proef B3. De omgekeerde volgorde, eerst de enkelvoudige rugslag, staat niet in het examenprogramma. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C3: 75 meter schoolslag, daarna 75 meter enkelvoudige rugslag","source":{"page":11,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan, gevolgd door 75 meter enkelvoudige rugslag"},"rev":2},{"id":"EP-0046","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-08","EP-VERG-10"],"question":"Proef C3 Conditiezwemmen, Zwemdiploma C:\nTijdens de 75 meter schoolslag zakt een kandidaat 1 keer voetwaarts richting de bodem. Verder gaat alles goed. Voldoet dit aan het examenprogramma?","options":["Nee, hij moet hoofdwaarts richting bodem gaan.","Ja, voetwaarts zakken is ook goed.","Nee, hij moet 2 keer een halve draai maken."],"answer":0,"explanation":"Bij C3 wordt de 75 meter schoolslag onderbroken door 1 keer hoofdwaarts richting bodem gaan. Voetwaarts richting de bodem zakken hoort bij proef A3. De 2 halve draaien om de lengteas horen bij proef B3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C3: hoofdwaarts richting bodem in de 75 meter schoolslag","source":{"page":11,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan"},"rev":2},{"id":"EP-0047","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-11","EP-VERG-09"],"question":"Proef C5 Oriënteren boven water en verplaatsen, Zwemdiploma C:\nDe kandidaat drijft 15 seconden op de rug. Waarmee rondt hij daarna de proef af?","options":["30 seconden watertrappen met de benen","1 keer voetwaarts richting de bodem zakken","60 seconden watertrappen met armen en benen"],"answer":0,"explanation":"C5 wordt afgerond met 30 seconden watertrappen met de benen. Afronden met voetwaarts richting de bodem zakken is het slot van proef B6. 60 seconden watertrappen met armen en benen hoort bij de proeven A6 en B6. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C5: afronden met 30 seconden watertrappen met de benen","source":{"page":12,"quote":"15 seconden drijven op de rug, proef afronden met 30 seconden watertrappen met de benen"}},{"id":"EP-0048","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-11"],"question":"Proef C5 Oriënteren boven water en verplaatsen, Zwemdiploma C:\nHoeveel seconden drijft de kandidaat op de rug?","options":["15 seconden","10 seconden","30 seconden"],"answer":0,"explanation":"In C5 drijft de kandidaat 15 seconden op de rug, tussen de twee keer watertrappen. 10 seconden drijven op de rug hoort bij Zwemdiploma A. 30 seconden is in C5 de duur van elke keer watertrappen. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C5: 15 seconden drijven op de rug","source":{"page":12,"quote":"richtingen, gevolgd door 15 seconden drijven op de rug"},"rev":2},{"id":"EP-0049","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-01","EP-DIPA-01","EP-DIPB-01"],"question":"Proef Survival:\nHoe gaat de kandidaat aan het begin van de proef te water bij Zwemdiploma A, B en C?","options":["A voetsprong voorwaarts, B achterwaarts, C rol voorover","A achterwaarts, B voetsprong voorwaarts, C rol voorover","A voetsprong voorwaarts, B rol voorover, C achterwaarts"],"answer":0,"explanation":"De proef Survival begint bij A met een voetsprong voorwaarts, bij B met achterwaarts te water gaan en bij C met een rol voorover. De andere twee opties verwisselen de manieren tussen de diploma's. Bijlage 3","ref":"Bijlage 3","tests":"te water gaan bij de proef Survival A/B/C","source":{"page":"Bijlage 3","quote":"A.1 voetsprong voorwaarts, gekleed B.1 achterwaarts te water gaan, gekleed C.1 met een rol voorover"}},{"id":"EP-0050","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"stellingen","objectives":["EP-VERG-01","EP-DIPC-01"],"question":"Proef Survival:\nWelke stelling over het te water gaan is juist?\nStelling 1: Bij Zwemdiploma B begint de proef met een rol voorover.\nStelling 2: Bij Zwemdiploma A begint de proef met een voetsprong voorwaarts.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bij Zwemdiploma B begint de proef Survival met achterwaarts te water gaan; de rol voorover hoort bij C. Stelling 2 is juist: bij Zwemdiploma A gaat de kandidaat vanaf enige hoogte te water met een voetsprong voorwaarts. §1.1, p. 7, 9 en 11","ref":"§1.1, p. 7, 9 en 11","tests":"te water gaan bij de proef Survival A/B/C","source":{"page":9,"quote":"B1 proef Survival Achterwaarts te water gaan"},"rev":2},{"id":"EP-0051","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-02"],"question":"Proef Onder water oriëntatie:\nHoe gaat de kandidaat te water bij Zwemdiploma A, B en C?","options":["Bij A een sprong of duik, bij B en C een duik","Bij A en B een sprong of duik, bij C een duik","Bij A een duik, bij B en C een sprong of duik"],"answer":0,"explanation":"Bij A2 gaat de kandidaat te water met een sprong, maar duiken heeft de voorkeur. Bij B2 en C2 is het van de kant duiken. Bij B is dus een duik nodig, en bij A is duiken nog niet verplicht. §1.1, p. 7, 9 en 11","ref":"§1.1, p. 7, 9 en 11","tests":"te water gaan Onder water oriëntatie: A sprong, B en C duiken","source":{"page":9,"quote":"B2 proef Onder water oriëntatie Van de kant duiken"},"rev":2},{"id":"EP-0052","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-04"],"question":"Welke afstanden gekleed zwemmen horen bij Zwemdiploma A, B en C?","options":["A 12,5 meter, B 50 meter, C 100 meter","A 25 meter, B 50 meter, C 100 meter","A 12,5 meter, B 50 meter, C 150 meter"],"answer":0,"explanation":"Gekleed zwemmen is 12,5 meter bij A (A.17), 50 meter bij B (B.18) en 100 meter bij C (C.20). 25 meter is geen afstand gekleed zwemmen, en 150 meter is de afstand conditiezwemmen bij B en C. §4.2.6, p. 63","ref":"§4.2.6, p. 63","tests":"afstand gekleed zwemmen A/B/C","source":{"page":63,"quote":"A.17 12,5 meter gekleed zwemmen B.18 50 meter gekleed zwemmen C.20 100 meter gekleed zwemmen"}},{"id":"EP-0053","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-VERG-04","EP-DIPB-02"],"question":"Proef B1 Survival, Zwemdiploma B:\nEen Licentiehouder laat de kandidaten 100 meter zwemmen. Ze zwemmen daarbij 1 keer onder een drijvend voorwerp door. Klopt deze afstand met het standaard examenprogramma?","options":["Nee, bij Zwemdiploma B is het 50 meter.","Ja, bij Zwemdiploma B is het 100 meter.","Nee, bij Zwemdiploma B is het 12,5 meter."],"answer":0,"explanation":"In proef B1 zwemt de kandidaat 50 meter, met 1 keer onder een drijvend voorwerp door. 100 meter is de afstand in proef C1, en 12,5 meter die in proef A1. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B1: 50 meter zwemmen in de proef Survival","source":{"page":9,"quote":"15 seconden watertrappen, gevolgd door 50 meter zwemmen"},"rev":2},{"id":"EP-0054","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-05"],"question":"Hoeveel meter conditiezwemmen zit in het examenprogramma van Zwemdiploma B?","options":["150 meter","100 meter","75 meter"],"answer":0,"explanation":"Bij Zwemdiploma B is het conditiezwemmen 150 meter (B.17), net als bij Zwemdiploma C. 100 meter is de afstand bij Zwemdiploma A. 75 meter is het deel dat de kandidaat bij C in één zwemslag zwemt. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A 100 m, B en C 150 m","source":{"page":62,"quote":"A.16 100 meter conditiezwemmen B.17 150 meter conditiezwemmen C.19 150 meter conditiezwemmen"},"rev":2},{"id":"EP-0055","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"stellingen","objectives":["EP-VERG-05"],"question":"Conditiezwemmen in het standaard examenprogramma:\nWelke stelling is juist?\nStelling 1: Bij Zwemdiploma A is de afstand 100 meter.\nStelling 2: Bij Zwemdiploma B en C is de afstand 150 meter.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: het conditiezwemmen is 100 meter bij Zwemdiploma A (A.16). Stelling 2 is ook juist: bij Zwemdiploma B (B.17) en C (C.19) is het allebei 150 meter. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"conditiezwemmen A 100 m, B en C 150 m","source":{"page":62,"quote":"A.16 100 meter conditiezwemmen B.17 150 meter conditiezwemmen C.19 150 meter conditiezwemmen"},"rev":2},{"id":"EP-0056","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-06"],"question":"Conditiezwemmen in het standaard examenprogramma:\nWanneer wisselt de kandidaat van zwemslag bij Zwemdiploma B en bij Zwemdiploma C?","options":["Bij B iedere 25 meter, bij C na 75 meter","Bij B na 75 meter, bij C iedere 25 meter","Bij B iedere 25 meter, bij C na 50 meter"],"answer":0,"explanation":"Bij A en B worden enkelvoudige rugslag en schoolslag iedere 25 meter afgewisseld. Bij C wordt 75 meter in één slag gezwommen en daarna gewisseld. De andere opties draaien dit om of noemen 50 meter. §4.2.6, p. 62","ref":"§4.2.6, p. 62","tests":"afwisseling slagen conditiezwemmen: A en B per 25 m, C na 75 m","source":{"page":62,"quote":"er wordt 75 meter in één slag gezwommen en daarna gewisseld"},"rev":2},{"id":"EP-0057","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-07","EP-DIPA-06","EP-DIPB-06"],"question":"Proef Borst- en rugcrawl:\nHoeveel meter rugcrawl zwemt de kandidaat bij Zwemdiploma A, B en C?","options":["A 5, B 10 en C 15 meter","A 10, B 10 en C 15 meter","A 5, B 10 en C 10 meter"],"answer":0,"explanation":"Bij de rugcrawl is er een opbouw in afstand: 5 meter bij A, 10 meter bij B en 15 meter bij C. In de andere opties is de afstand bij A of bij C gelijk aan die bij B, en dat klopt niet. §4.2.6, p. 60","ref":"§4.2.6, p. 60","tests":"borst- en rugcrawl opbouw 5/10/15 meter","source":{"page":60,"quote":"A.14, B.15 en C.17 5, 10, 15 meter rugcrawl"},"rev":2},{"id":"EP-0058","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-09","EP-VERG-07"],"question":"Proef C4 Borst- en rugcrawl, Zwemdiploma C:\nEen kandidaat zwemt 10 meter borstcrawl en 10 meter rugcrawl. De uitvoering is goed. Voldoet dit aan het standaard examenprogramma?","options":["Nee, bij Zwemdiploma C is het 15 meter per zwemslag.","Ja, bij Zwemdiploma C is het 10 meter per zwemslag.","Nee, bij Zwemdiploma C is het 25 meter per zwemslag."],"answer":0,"explanation":"Proef C4 bestaat uit 15 meter borstcrawl en 15 meter rugcrawl. 10 meter per zwemslag is de afstand in proef B4. 25 meter is de afstand van de techniekonderdelen schoolslag en enkelvoudige rugslag, niet van de crawl. §1.1.3, p. 12","ref":"§1.1.3, p. 12","tests":"C4: 15 meter borstcrawl en 15 meter rugcrawl","source":{"page":12,"quote":"C4 proef Borst- en rugcrawl 15 meter borstcrawl 15 meter rugcrawl"},"rev":2},{"id":"EP-0059","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-08"],"question":"Basiselement Drijven:\nHoe lang duurt het drijven op de rug bij Zwemdiploma A?","options":["10 seconden","15 seconden","20 seconden"],"answer":0,"explanation":"Bij Zwemdiploma A duurt het drijven op de rug 10 seconden (A.7). 15 seconden is de duur bij Zwemdiploma B en C (B.7, C.9). 20 seconden is de duur van het drijven met gebruik van een drijvend voorwerp bij B (B.8). §4.2.3, p. 54","ref":"§4.2.3, p. 54","tests":"drijven op de rug: A 10 s, B en C 15 s","source":{"page":54,"quote":"A.7, B.7, C.9 10, 15, 15 seconden drijven op de rug"},"rev":2},{"id":"EP-0060","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"stellingen","objectives":["EP-VERG-08"],"question":"Basiselement Drijven:\nWelke stelling is juist?\nStelling 1: Drijven op de buik komt alleen bij Zwemdiploma A voor.\nStelling 2: Bij Zwemdiploma C duurt drijven op de rug 15 seconden.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: 5 seconden drijven op de buik (A.6) staat alleen in het examenprogramma van Zwemdiploma A. Stelling 2 is ook juist: bij C duurt het drijven op de rug 15 seconden (C.9), net als bij B. §4.2.3, p. 53","ref":"§4.2.3, p. 53","tests":"drijven op de buik alleen bij A","source":{"page":53,"quote":"Onderdelen Drijven A.6 5 seconden drijven op de buik A.7 10 seconden drijven op de rug B.7 15 seconden drijven op de rug C.9 15 seconden drijven op de rug"},"rev":2},{"id":"EP-0061","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-09","EP-DIPC-10"],"question":"Proef C5 Oriënteren boven water en verplaatsen:\nHoe lang duurt het watertrappen met verplaatsen in meerdere richtingen?","options":["30 seconden","60 seconden","15 seconden"],"answer":0,"explanation":"Bij C duurt het watertrappen met armen en benen en verplaatsen in meerdere richtingen 30 seconden (C.13). 60 seconden is de duur bij Zwemdiploma B (B.12). 15 seconden is de duur van het gekleed watertrappen. §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"watertrappen met verplaatsen: B 60 s vs C 30 s","source":{"page":57,"quote":"B.12, C.13 60 en 30 seconden watertrappen met armen en benen, verplaatsen in meerdere richtingen"},"rev":2},{"id":"EP-0062","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-09","EP-DIPA-10"],"question":"Bij welk zwemdiploma maakt de kandidaat al watertrappend 2 keer een hele draai om de lengteas?","options":["Zwemdiploma A","Zwemdiploma B","Zwemdiploma C"],"answer":0,"explanation":"De 2 hele draaien om de lengteas tijdens het watertrappen horen bij Zwemdiploma A (A.11). Bij B en C komt dit onderdeel niet voor. Daar is het watertrappen met verplaatsen in meerdere richtingen (B.12, C.13). §4.2.5, p. 57","ref":"§4.2.5, p. 57","tests":"hele draai tijdens watertrappen alleen bij A","source":{"page":57,"quote":"A.11 twee keer, al watertrappend, een hele draai om de lengteas maken"},"rev":2},{"id":"EP-0063","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"stellingen","objectives":["EP-VERG-10"],"question":"Richting de bodem gaan:\nWelke stelling is juist?\nStelling 1: Bij Zwemdiploma B zakt de kandidaat voetwaarts richting de bodem.\nStelling 2: Bij Zwemdiploma C zakt de kandidaat voetwaarts richting de bodem.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij A en B zakt de kandidaat voetwaarts richting de bodem (A.5, B.6). Stelling 2 is onjuist: bij C gaat de kandidaat hoofdwaarts richting de bodem (C.8). §4.2.2, p. 52","ref":"§4.2.2, p. 52","tests":"voetwaarts zakken A en B vs hoofdwaarts C","source":{"page":52,"quote":"A.5, B.6 voetwaarts richting de bodem zakken C.8 hoofdwaarts richting de bodem gaan"},"rev":2},{"id":"EP-0064","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-DIPB-11"],"question":"In welke proef zakt een kandidaat voor Zwemdiploma B voetwaarts richting de bodem?","options":["Oriënteren boven water en verplaatsen","Conditiezwemmen","Je vertrouwd voelen in het water"],"answer":0,"explanation":"Bij B wordt proef B6 Oriënteren boven water en verplaatsen afgerond met 1 keer voetwaarts richting de bodem zakken. Bij Zwemdiploma A zit dit onderdeel in proef A3 Conditiezwemmen. In proef B5 Je vertrouwd voelen in het water komt het niet voor. §1.1.1–1.1.2, p. 7 en 10","ref":"§1.1.1–1.1.2, p. 7 en 10","tests":"plaats voetwaarts zakken: A3 vs B6","source":{"page":10,"quote":"proef afronden met 1 keer voetwaarts richting de bodem zakken"},"rev":2},{"id":"EP-0065","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"kennis","objectives":["EP-VERG-11"],"question":"Basiselement Draaien:\nHoe maakt de kandidaat de halve draai om de lengteas bij Zwemdiploma B?","options":["Van buik naar rug en van rug naar buik","Eén keer, alleen van buik naar rug","Eén keer, alleen van rug naar buik"],"answer":0,"explanation":"Bij B maakt de kandidaat een halve draai om de lengteas van buik naar rug en van rug naar buik (B.10). Eén draai in één richting is te weinig voor B. Bij A staat alleen 'een halve draai om de lengteas' (A.8). Bijlage 2","ref":"Bijlage 2","tests":"halve draai: A één keer vs B van buik naar rug en terug","source":{"page":"Bijlage 2","quote":"B.10 een halve draai om de lengteas van buik naar rug en van rug naar buik"},"rev":2},{"id":"EP-0066","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-01"],"question":"De onderdelen van de standaard examenprogramma's zijn geordend in basiselementen. Hoeveel basiselementen zijn er?","options":["Zeven","Zes","Vijf"],"answer":0,"explanation":"Er zijn zeven basiselementen: te water gaan, onder water, drijven, draaien, watertrappen, voortbewegen en survival. Zes en vijf zijn de aantallen proeven in het standaard examenprogramma: zes bij A en B, vijf bij C. §4.2, p. 46","ref":"§4.2, p. 46","tests":"zeven basiselementen","source":{"page":46,"quote":"te water gaan; onder water; drijven; draaien; watertrappen; voortbewegen; survival."}},{"id":"EP-0067","category":"examenprogrammas","subtopic":"basiselementen","type":"onjuist","objectives":["EP-BASE-01"],"question":"Welke categorie is NIET een van de basiselementen?","options":["Conditiezwemmen","Watertrappen","Voortbewegen"],"answer":0,"explanation":"Watertrappen en voortbewegen zijn twee van de zeven basiselementen. Conditiezwemmen is geen basiselement, maar een onderdeel bij het basiselement Voortbewegen. §4.2, p. 46","ref":"§4.2, p. 46","tests":"conditiezwemmen is geen basiselement","source":{"page":46,"quote":"te water gaan; onder water; drijven; draaien; watertrappen; voortbewegen; survival."}},{"id":"EP-0068","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-02"],"question":"Bijlage 2 geeft de onderdelen per zwemdiploma. Hoeveel onderdelen hebben Zwemdiploma A, B en C?","options":["A 18, B 19, C 22","A 18, B 18, C 22","A 19, B 19, C 22"],"answer":0,"explanation":"Bijlage 2 nummert de onderdelen van A.1 tot en met A.18, van B.1 tot en met B.19 en van C.1 tot en met C.22. A en B hebben dus niet hetzelfde aantal onderdelen. Bijlage 2","ref":"Bijlage 2","tests":"aantal onderdelen A 18, B 19, C 22","source":{"page":"Bijlage 2","quote":"A.18 zelfstandig uit het water op de kant klimmen, gekleed Onderdelen Zwemdiploma B"}},{"id":"EP-0069","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-03"],"question":"Basiselement Draaien (Bijlage 3):\nBij welke zwemdiploma's heeft dit basiselement een onderdeel?","options":["Alleen bij Zwemdiploma A en B","Bij Zwemdiploma A, B en C","Alleen bij Zwemdiploma B en C"],"answer":0,"explanation":"In Bijlage 3 heeft Draaien alleen onderdelen bij A (A.8) en B (B.10). Bij Zwemdiploma C staat onder Draaien geen onderdeel. Bijlage 3","ref":"Bijlage 3","tests":"Draaien: alleen onderdelen bij A en B","source":{"page":"Bijlage 3","quote":"Draaien A.8 een halve draai om de lengteas B.10 een halve draai om de lengteas van"}},{"id":"EP-0070","category":"examenprogrammas","subtopic":"basiselementen","type":"stellingen","objectives":["EP-BASE-03"],"question":"Basiselement Draaien in Bijlage 3:\nWelke stelling is juist?\nStelling 1: Zwemdiploma C heeft een onderdeel bij Draaien.\nStelling 2: Zwemdiploma B heeft onderdeel B.10 bij Draaien.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bij Zwemdiploma C staat onder Draaien geen onderdeel. Stelling 2 is juist: bij B valt B.10, een halve draai om de lengteas van buik naar rug en van rug naar buik, onder Draaien. Bijlage 3","ref":"Bijlage 3","tests":"Draaien: alleen onderdelen bij A en B","source":{"page":"Bijlage 3","quote":"Draaien A.8 een halve draai om de lengteas B.10 een halve draai om de lengteas van"},"rev":2},{"id":"EP-0071","category":"examenprogrammas","subtopic":"basiselementen","type":"kennis","objectives":["EP-BASE-04"],"question":"Basiselement Te water gaan, Zwemdiploma C:\nWelk onderdeel hoort bij dit basiselement?","options":["Met een rol voorover te water gaan, gekleed","Achterwaarts te water gaan, gekleed","Voetsprong voorwaarts, gekleed"],"answer":0,"explanation":"Bij C vallen onder Te water gaan: met een rol voorover te water gaan (gekleed), van de kant in het water duiken en gekleed te water gaan met een sprong waarbij het hoofd boven water blijft. Achterwaarts te water gaan is B.1 en de voetsprong voorwaarts is A.1. Bijlage 3","ref":"Bijlage 3","tests":"Te water gaan bij C: rol voorover, duiken, sprong met hoofd boven water","source":{"page":"Bijlage 3","quote":"B.1 achterwaarts te water gaan, gekleed C.1 met een rol voorover te water gaan,"},"rev":2},{"id":"EP-0072","category":"examenprogrammas","subtopic":"basiselementen","type":"verschil","objectives":["EP-BASE-04","EP-VERG-02"],"question":"Basiselement Te water gaan:\nWelk onderdeel hoort bij Zwemdiploma B en ook bij Zwemdiploma C?","options":["Van de kant in het water duiken","Achterwaarts te water gaan, gekleed","Te water gaan met een sprong"],"answer":0,"explanation":"B.2 en C.2 zijn allebei 'van de kant in het water duiken'. Achterwaarts te water gaan (B.1) komt alleen bij B voor. Te water gaan met een sprong (A.2) hoort bij Zwemdiploma A; bij B staat onder Te water gaan geen sprong. Bijlage 3","ref":"Bijlage 3","tests":"van de kant in het water duiken bij B en C (B.2, C.2)","source":{"page":"Bijlage 3","quote":"A.2 te water gaan met een sprong B.2 van de kant in het water duiken C.2 van de kant in het water duiken"}},{"id":"EP-0073","category":"examenprogramm
