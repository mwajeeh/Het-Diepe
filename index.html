<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Het Diepe — Oefenbad voor de examinatortoets Zwem-ABC</title>
<style>
/* Het Diepe — styles. Colour tokens are custom properties; light/dark follow
   prefers-color-scheme unless the user picks one (html[data-theme]). */
:root {
  --bg: #eef7fa;
  --bg-tile: rgba(14, 116, 144, 0.07);
  --surface: #ffffff;
  --surface-2: #f3f8fa;
  --text: #0b2530;
  --muted: #4d6670;
  --border: #c9dde3;
  --accent: #0e7c86;
  --accent-strong: #0a5f67;
  --accent-soft: #d5f0f0;
  --deep: #0b4f7c;
  --deep-soft: #dcebf7;
  --ok: #1f7a3f;
  --ok-soft: #dff3e5;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --warn: #8a5300;
  --warn-soft: #fff1d6;
  --flag: #b45309;
  --lane-a: #e0483e;
  --lane-b: #ffffff;
  --lane-c: #1d6fb8;
  --focus: #1d6fb8;
  --shadow: 0 1px 2px rgba(11, 37, 48, 0.06), 0 4px 14px rgba(11, 37, 48, 0.06);
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071a22;
    --bg-tile: rgba(94, 200, 210, 0.06);
    --surface: #0d2731;
    --surface-2: #11313d;
    --text: #e4f2f6;
    --muted: #9db8c1;
    --border: #23485a;
    --accent: #3cc0c4;
    --accent-strong: #6ad6d8;
    --accent-soft: #123f45;
    --deep: #7cb8ec;
    --deep-soft: #15334a;
    --ok: #5fd08a;
    --ok-soft: #123a24;
    --bad: #ff8a80;
    --bad-soft: #43201e;
    --warn: #ffc56b;
    --warn-soft: #3d2c10;
    --flag: #f5a64a;
    --lane-b: #d9e7ec;
    --focus: #8cc8ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071a22;
  --bg-tile: rgba(94, 200, 210, 0.06);
  --surface: #0d2731;
  --surface-2: #11313d;
  --text: #e4f2f6;
  --muted: #9db8c1;
  --border: #23485a;
  --accent: #3cc0c4;
  --accent-strong: #6ad6d8;
  --accent-soft: #123f45;
  --deep: #7cb8ec;
  --deep-soft: #15334a;
  --ok: #5fd08a;
  --ok-soft: #123a24;
  --bad: #ff8a80;
  --bad-soft: #43201e;
  --warn: #ffc56b;
  --warn-soft: #3d2c10;
  --flag: #f5a64a;
  --lane-b: #d9e7ec;
  --focus: #8cc8ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background-color: var(--bg);
  /* pool tiles */
  background-image:
    linear-gradient(var(--bg-tile) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-tile) 1px, transparent 1px);
  background-size: 28px 28px;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
#app { flex: 1 0 auto; }
body.exam-mode { background-image: none; background-color: var(--surface-2); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 0.5rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 0.75rem; }
a { color: var(--accent-strong); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
main { padding: 16px 0 32px; }

/* ------------------------------------------------------------- header / footer */
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-align: left; }
.brand-name { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em; }
.brand-tag { font-size: 0.8rem; color: var(--muted); display: block; }
.topbar .spacer { flex: 1; }
.lane { height: 6px; background: repeating-linear-gradient(90deg, var(--lane-a) 0 18px, var(--lane-b) 18px 30px, var(--lane-c) 30px 48px, var(--lane-b) 48px 60px); opacity: 0.85; }
.lane-divider { height: 4px; margin: 24px 0; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--lane-a) 0 14px, var(--lane-b) 14px 22px, var(--lane-c) 22px 36px, var(--lane-b) 36px 44px); opacity: 0.6; }
footer.disclaimer { border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 0.8rem; padding: 14px 0 20px; }
footer.disclaimer .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }

.banner { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--border); font-size: 0.9rem; padding: 8px 0; }

/* ------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: background 0.15s, border-color 0.15s, transform 0.05s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
:root[data-theme="dark"] .btn.primary { color: #062026; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #062026; } }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 0.875rem; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.nav-btn { gap: 8px; padding: 0 14px 0 11px; font: inherit; font-weight: 600; font-size: 0.9rem; }
@media (max-width: 720px) { .nav-btn { padding: 0; } .nav-label { display: none; } }
.nav-btn[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 10px -12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ------------------------------------------------------------- cards / dashboard */
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.hero { position: relative; overflow: hidden; }
.card.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; opacity: 0.25;
  background: radial-gradient(circle at 10px -4px, transparent 12px, var(--accent) 13px) 0 0 / 24px 22px repeat-x; pointer-events: none; }
.card.hero.deep::after { background: radial-gradient(circle at 10px -4px, transparent 12px, var(--deep) 13px) 0 0 / 24px 22px repeat-x; }
.card h2 { display: flex; align-items: center; gap: 8px; }
.kicker { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.75rem; font-weight: 700; color: var(--accent-strong); }
.stat { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.welcome { display: flex; gap: 16px; align-items: center; margin: 8px 0 18px; flex-wrap: wrap; }
.welcome p { margin: 0; }

.rings { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.ring { display: flex; align-items: center; gap: 10px; }
.ring svg { flex: none; }
.ring .ring-label { font-size: 0.85rem; color: var(--muted); }
.ring .ring-value { font-weight: 800; font-size: 1.15rem; }

.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; position: relative; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.deep > span { background: var(--deep); }
.bar.ok > span { background: var(--ok); }
.bar.bad > span { background: var(--bad); }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; margin: 10px 0; }
.bar-row .bar { grid-column: 1 / -1; }
.bar-pair { display: grid; gap: 4px; grid-column: 1 / -1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.bar.stack > span { position: absolute; left: 0; top: 0; }
.bar.stack > .seen { background: var(--accent); opacity: 0.5; }
.bar.stack > .mastered { background: var(--deep); }
.legend i.lg-seen { background: var(--accent); opacity: 0.5; }
.legend i.lg-mastered { background: var(--deep); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin: 24px 0 6px; }
.section-head h2 { margin: 0; }
details.chapter { border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; background: var(--surface); }
details.chapter > summary {
  list-style: none; cursor: pointer; padding: 12px 16px; border-radius: 12px;
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; min-height: 44px;
}
details.chapter > summary::-webkit-details-marker { display: none; }
details.chapter > summary:hover { background: var(--surface-2); }
details.chapter > summary .chev { width: 9px; height: 9px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(-45deg); transition: transform 0.15s; justify-self: center; }
details.chapter[open] > summary .chev { transform: rotate(45deg); }
details.chapter > summary .ch-title { font-weight: 700; }
details.chapter > summary .bar { grid-column: 2 / -1; }
details.chapter .sections { padding: 0 16px 8px 42px; border-top: 1px solid var(--border); }
@media (max-width: 600px) {
  details.chapter > summary .ch-stats { grid-column: 2 / -1; }
  details.chapter .sections { padding-left: 16px; }
}

.list { list-style: none; padding: 0; margin: 0; }
.list > li { border-top: 1px solid var(--border); padding: 12px 0; }
.list > li:first-child { border-top: 0; }
.objective-ref { font-size: 0.8rem; color: var(--muted); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }

.empty { text-align: center; padding: 24px 12px; color: var(--muted); }
.empty svg { margin-bottom: 8px; }

/* ------------------------------------------------------------- forms */
fieldset { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; min-width: 0; }
legend { font-weight: 700; padding: 0 6px; }
label.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
label.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.count-grid { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px 12px; align-items: center; }
input[type="number"], select { font: inherit; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font: inherit; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 700; }
.note { background: var(--deep-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.error-text { color: var(--bad); font-weight: 600; }

/* ------------------------------------------------------------- exam screen (sober) */
.exam-shell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 16px 0 24px; }
.exam-shell.with-panel { grid-template-columns: minmax(0, 1fr) 280px; }
.exam-head { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.exam-head .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; }
.exam-head .title { font-weight: 700; }
.exam-head .spacer { flex: 1; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.25rem; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); min-width: 92px; text-align: center; }
.timer.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.timer.crit { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.qpanel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.qnum { font-size: 0.9rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qtext { font-size: 1.15rem; font-weight: 600; margin: 0 0 18px; }
.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
.option {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start;
  width: 100%; text-align: left; min-height: 56px; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
}
.option:hover { border-color: var(--deep); }
.option .letter { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.option[aria-checked="true"] { border-color: var(--deep); background: var(--deep-soft); }
.option[aria-checked="true"] .letter { background: var(--deep); border-color: var(--deep); color: var(--surface); }
.option.correct { border-color: var(--ok); background: var(--ok-soft); }
.option.correct .letter { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.option[disabled] { cursor: default; }
.exam-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.exam-nav .spacer { flex: 1; }
.flag-btn[aria-pressed="true"] { border-color: var(--flag); color: var(--flag); background: var(--warn-soft); }

.overview { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; align-self: start; position: sticky; top: 76px; }
.overview h2 { font-size: 1rem; }
.ogrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ocell { min-height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; position: relative; }
.ocell.answered { background: var(--deep-soft); border-color: var(--deep); }
.ocell.current { outline: 3px solid var(--text); outline-offset: 1px; }
.ocell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 0; height: 0; border-left: 9px solid transparent; border-top: 9px solid var(--flag); }
.olegend { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
.olegend span { display: inline-flex; align-items: center; gap: 6px; }
.olegend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); display: inline-block; background: var(--surface-2); }
.olegend i.a { background: var(--deep-soft); border-color: var(--deep); }
.olegend i.f { background: linear-gradient(225deg, var(--flag) 0 35%, var(--surface-2) 35%); }

/* mobile: overview becomes a bottom sheet */
@media (max-width: 860px) {
  .exam-shell.with-panel { grid-template-columns: minmax(0, 1fr); }
  .overview { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40; border-radius: 16px 16px 0 0; max-height: 70vh; overflow: auto; box-shadow: 0 -8px 30px rgba(0,0,0,0.25); padding-bottom: 24px; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 39; }
  .ogrid { grid-template-columns: repeat(8, 1fr); }
  .qtext { font-size: 1.05rem; }
}
@media (max-width: 420px) { .ogrid { grid-template-columns: repeat(5, 1fr); } }

/* ------------------------------------------------------------- results / review */
.result-hero { text-align: center; padding: 26px 18px; }
.result-score { font-size: 3.4rem; font-weight: 900; line-height: 1; }
.result-verdict { font-size: 1.4rem; font-weight: 800; margin: 8px 0; }
.result-verdict.ok { color: var(--ok); }
.result-verdict.bad { color: var(--bad); }
.quip { font-style: italic; color: var(--muted); }
.review-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 12px 0; background: var(--surface); }
.review-item.is-wrong { border-left: 6px solid var(--bad); }
.review-item.is-right { border-left: 6px solid var(--ok); }
.review-item.is-blank { border-left: 6px solid var(--muted); }
.review-opts { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px; }
.review-opts li { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; }
.review-opts li.correct { border-color: var(--ok); background: var(--ok-soft); }
.review-opts li.chosen-wrong { border-color: var(--bad); background: var(--bad-soft); }
.review-opts b { font-weight: 800; }
.feedback { border-radius: 12px; padding: 14px; margin-top: 16px; border: 1px solid var(--border); background: var(--surface-2); }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; margin-bottom: 6px; }
blockquote.source { margin: 10px 0 0; padding: 8px 12px; border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 0.92rem; }
blockquote.source cite { display: block; font-style: normal; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.ref { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

/* ------------------------------------------------------------- dialog */
dialog { border: 1px solid var(--border); border-radius: 16px; padding: 0; background: var(--surface); color: var(--text); max-width: min(520px, calc(100vw - 32px)); width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
dialog::backdrop { background: rgba(4, 20, 28, 0.55); }
dialog .dlg-body { padding: 20px; }
dialog .dlg-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }

/* ------------------------------------------------------------- confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: drop 1.8s ease-in forwards; }
@keyframes drop { to { transform: translateY(105vh) rotate(540deg); opacity: 0.6; } }
.bob { animation: bob 3s ease-in-out infinite; transform-origin: center; }
@keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

@media (max-width: 600px) {
  h1 { font-size: 1.35rem; }
  .card { padding: 14px; }
  .qpanel { padding: 14px; }
  .brand-tag { display: none; }
  .result-score { font-size: 2.8rem; }
  .exam-nav .btn { flex: 1 1 auto; }
}

</style>
</head>
<body>
<div id="banner-slot"></div>
<div id="app" aria-live="off"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<script type="application/json" id="bank">{"version":"2026-11-05-550q-859cc93f","objectives":[{"id":"EP-BASE-01","category":"examenprogrammas","subtopic":"basiselementen","section":"4.2","page":46,"weight":"core","statement":"De onderdelen van de standaard examenprogramma's zijn geordend in zeven basiselementen: te water gaan, onder water, drijven, draaien, watertrappen, voortbewegen en survival."},{"id":"EP-BASE-02","category":"examenprogrammas","subtopic":"basiselementen","section":"Bijlage 2","page":"Bijlage 2","weight":"detail","statement":"Zwemdiploma A telt 18 onderdelen (A.1 t/m A.18), Zwemdiploma B 19 onderdelen (B.1 t/m B.19) en Zwemdiploma C 22 onderdelen (C.1 t/m C.22)."},{"id":"EP-BASE-03","category":"examenprogrammas","subtopic":"basiselementen","section":"Bijlage 3","page":"Bijlage 3","weight":"detail","statement":"Het basiselement Draaien heeft alleen onderdelen bij Zwemdiploma A (A.8) en Zwemdiploma B (B.10), niet bij Zwemdiploma C."},{"id":"EP-BASE-04","category":"examenprogrammas","subtopic":"basiselementen","section":"Bijlage 3","page":"Bijlage 3","weight":"detail","statement":"Bij het basiselement Te water gaan heeft Zwemdiploma C drie onderdelen: met een rol voorover te water gaan (gekleed), van de kant in het water duiken, en gekleed te water gaan met een sprong waarbij het hoofd boven water blijft."},{"id":"EP-BASE-05","category":"examenprogrammas","subtopic":"basiselementen","section":"4.2.3","page":55,"weight":"detail","statement":"Voortbewegen op de rug met gebruik van de armen (B.9 en C.11) valt onder het basiselement Drijven."},{"id":"EP-BASE-06","category":"examenprogrammas","subtopic":"basiselementen","section":"4.2.7","page":64,"weight":"core","statement":"Een (steeds groter) deel van de onderdelen wordt gekleed uitgevoerd; deze worden samengevat onder de noemer ‘survival’."},{"id":"EP-BASE-07","category":"examenprogrammas","subtopic":"basiselementen","section":"4.2.7","page":64,"weight":"detail","statement":"Survival-onderdelen bij Zwemdiploma A zijn: voetsprong voorwaarts gekleed (A.1), 15 seconden gekleed watertrappen (A.9), 12,5 meter gekleed zwemmen (A.17) en zelfstandig uit het water klimmen, gekleed (A.18)."},{"id":"EP-CERT-01","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2","page":13,"weight":"core","statement":"De Zwemcertificaten A, B en C zijn ontwikkeld voor een relatief kleine groep kandidaten met tijdelijke of permanente beperkingen die het zwemdiploma niet, of slechts na een heel lange oefenperiode, kunnen halen."},{"id":"EP-CERT-02","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2","page":13,"weight":"core","statement":"Een zwemcertificaat kan worden gebruikt als behaald eindresultaat om trots op te zijn of als tussenstap naar een hoger zwemcertificaat of naar een zwemdiploma."},{"id":"EP-CERT-03","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2","page":13,"weight":"core","statement":"Elk zwemcertificaat heeft een verplicht onderdeel, dat een zekere mate van zwemveiligheid in zich heeft, en een open deel waar het kind al dan niet aan kan voldoen."},{"id":"EP-CERT-04","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2","page":13,"weight":"detail","statement":"In principe worden alle kandidaten, jong of oud, opgeleid voor de Nationale Zwemdiploma's."},{"id":"EP-CERT-05","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.1","page":13,"weight":"core","statement":"Zwemcertificaat A, verplicht deel gekleed: naar keuze te water gaan en geheel onder water gaan, gevolgd door 12,5 meter verplaatsen met zwemslag naar keuze."},{"id":"EP-CERT-06","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.1","page":13,"weight":"core","statement":"Zwemcertificaat A, verplicht deel in badkleding: naar keuze te water gaan en 5 seconden drijven, gevolgd door 50 meter verplaatsen met een zwemslag naar keuze en 1 minuut watertrappen."},{"id":"EP-CERT-07","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.1","page":13,"weight":"detail","statement":"Open deel Zwemcertificaat A: voetsprong, van de kant het water in duiken en 3 meter onder water zwemmen door een gat in een verticaal hangend zeil."},{"id":"EP-CERT-08","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.1","page":13,"weight":"detail","statement":"Open deel Zwemcertificaat A: 5 seconden drijven op de buik, 10 seconden drijven op de rug en zwemmen met een halve draai om de lengteas."},{"id":"EP-CERT-09","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.1","page":13,"weight":"detail","statement":"Open deel Zwemcertificaat A: 25 meter schoolslag, 25 meter enkelvoudige rugslag, 5 meter borstcrawl en 5 meter rugcrawl."},{"id":"EP-CERT-10","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"core","statement":"Zwemcertificaat B, verplicht deel gekleed: naar keuze te water gaan, geheel onder water gaan, 15 seconden watertrappen en 50 meter verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 30 centimeter)."},{"id":"EP-CERT-11","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"core","statement":"Zwemcertificaat B, verplicht deel in badkleding: naar keuze te water gaan, 7 seconden drijven, 75 meter verplaatsen met een zwemslag naar keuze en 1 minuut watertrappen (30 seconden met alleen de armen of benen)."},{"id":"EP-CERT-12","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"detail","statement":"Open deel Zwemcertificaat B, te water gaan: achterwaarts te water gaan, vanaf de kant in het water duiken en voetsprong."},{"id":"EP-CERT-13","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"detail","statement":"Open deel Zwemcertificaat B: 6 meter onder water zwemmen door een gat in een verticaal hangend zeil en voetwaarts richting bodem zakken."},{"id":"EP-CERT-14","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"detail","statement":"Open deel Zwemcertificaat B: 20 seconden met behulp van een drijvend voorwerp blijven drijven, 15 seconden drijven op de rug, 5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen en zwemmen met 2x halve draai om de lengteas."},{"id":"EP-CERT-15","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.2","page":14,"weight":"detail","statement":"Open deel Zwemcertificaat B: 25 meter schoolslag, 25 meter enkelvoudige rugslag, 10 meter borstcrawl en 10 meter rugcrawl."},{"id":"EP-CERT-16","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.3","page":15,"weight":"core","statement":"Zwemcertificaat C, verplicht deel gekleed: naar keuze te water gaan, geheel onder water gaan, 30 seconden blijven drijven met een drijvend voorwerp en 75 meter verplaatsen, onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen (overbruggingsafstand minimaal 50 centimeter)."},{"id":"EP-CERT-17","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.3","page":15,"weight":"core","statement":"Zwemcertificaat C, verplicht deel in badkleding: naar keuze te water gaan, 10 seconden drijven, 100 meter verplaatsen met een zwemslag naar keuze en 1 minuut watertrappen (30 seconden verplaatsen in meerdere richtingen)."},{"id":"EP-CERT-18","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.3","page":15,"weight":"detail","statement":"Open deel Zwemcertificaat C, te water gaan: voetsprong, duiken vanaf de kant, rol voorover en sprong waarbij het hoofd boven water blijft."},{"id":"EP-CERT-19","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.3","page":15,"weight":"detail","statement":"Open deel Zwemcertificaat C: 6 meter onder water zwemmen door een gat in een verticaal hangend zeil met bovenkomen in een soort wak, 10 seconden drijven op de rug en zwemmen met 1x hoofdwaarts richting bodem gaan."},{"id":"EP-CERT-20","category":"examenprogrammas","subtopic":"zwemcertificaten","section":"1.2.3","page":15,"weight":"detail","statement":"Open deel Zwemcertificaat C: 25 meter schoolslag, 25 meter enkelvoudige rugslag, 15 meter borstcrawl en 15 meter rugcrawl."},{"id":"EP-DIPA-01","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"A1 proef Survival begint met vanaf enige hoogte te water gaan met een voetsprong voorwaarts, na het bovenkomen aansluitend 15 seconden watertrappen."},{"id":"EP-DIPA-02","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"In A1 proef Survival volgt na het watertrappen 12,5 meter zwemmen; de proef wordt afgerond met zelfstandig uit het water op de kant klimmen."},{"id":"EP-DIPA-03","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"A2 proef Onder water oriëntatie: van de kant te water gaan met een sprong (duiken heeft de voorkeur), gevolgd door (zonder boven te komen) onder water zwemmen door een gat in een verticaal hangend zeil dat zich op 3 meter van de startkant bevindt."},{"id":"EP-DIPA-04","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"A3 proef Conditiezwemmen bestaat uit 25 meter schoolslag, 25 meter enkelvoudige rugslag, 25 meter schoolslag en 25 meter enkelvoudige rugslag."},{"id":"EP-DIPA-05","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"In A3 proef Conditiezwemmen wordt de tweede 25 meter schoolslag onderbroken door 1 keer voetwaarts richting de bodem zakken."},{"id":"EP-DIPA-06","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"A4 proef Borst- en rugcrawl bestaat uit 5 meter borstcrawl en 5 meter rugcrawl."},{"id":"EP-DIPA-07","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"A5 proef Je vertrouwd voelen in het water begint met enkele slagen zwemmen op de buik, aansluitend 5 seconden drijven op de buik."},{"id":"EP-DIPA-08","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":7,"weight":"core","statement":"In A5 volgen na het drijven op de buik enkele slagen zwemmen, een halve draai naar rugligging en 10 seconden drijven op de rug."},{"id":"EP-DIPA-09","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":8,"weight":"core","statement":"A6 proef Oriënteren boven water en verplaatsen: van de kant te water gaan met een sprong naar keuze, gevolgd door 60 seconden watertrappen met gebruik van armen en benen."},{"id":"EP-DIPA-10","category":"examenprogrammas","subtopic":"diploma_a","section":"1.1.1","page":8,"weight":"core","statement":"Tijdens de 60 seconden watertrappen in A6 wordt 2 keer, al watertrappend, een hele draai om de lengteas gemaakt."},{"id":"EP-DIPB-01","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"B1 proef Survival begint met achterwaarts te water gaan, aansluitend 15 seconden watertrappen."},{"id":"EP-DIPB-02","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"In B1 volgt 50 meter zwemmen, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen; afronden met zelfstandig uit het water op de kant klimmen."},{"id":"EP-DIPB-03","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"B2 proef Onder water oriëntatie: van de kant duiken, gevolgd door (zonder boven te komen) onder water zwemmen door een gat in een verticaal hangend zeil dat zich op 6 meter van de startkant bevindt."},{"id":"EP-DIPB-04","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"B3 proef Conditiezwemmen bestaat uit zes keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag, beginnend met schoolslag."},{"id":"EP-DIPB-05","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"In B3 wordt de laatste 25 meter enkelvoudige rugslag onderbroken door 2 keer een halve draai om de lengteas (van rug naar buik en van buik naar rug)."},{"id":"EP-DIPB-06","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":9,"weight":"core","statement":"B4 proef Borst- en rugcrawl bestaat uit 10 meter borstcrawl en 10 meter rugcrawl."},{"id":"EP-DIPB-07","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":10,"weight":"core","statement":"B5 proef Je vertrouwd voelen in het water begint met in het water springen met een sprong naar keuze, aansluitend 15 seconden drijven op de rug."},{"id":"EP-DIPB-08","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":10,"weight":"core","statement":"In B5 volgt 5 meter hoofdwaarts voortbewegen op de rug met gebruik van armen in de richting van een drijvend voorwerp."},{"id":"EP-DIPB-09","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":10,"weight":"core","statement":"B5 wordt afgesloten met 20 seconden met gebruik van een drijvend voorwerp blijven drijven."},{"id":"EP-DIPB-10","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":10,"weight":"core","statement":"B6 proef Oriënteren boven water en verplaatsen: van de kant te water gaan met een sprong naar keuze, aansluitend 60 seconden watertrappen met verplaatsen in meerdere richtingen, met gebruik van armen en benen."},{"id":"EP-DIPB-11","category":"examenprogrammas","subtopic":"diploma_b","section":"1.1.2","page":10,"weight":"core","statement":"B6 wordt afgerond met 1 keer voetwaarts richting de bodem zakken."},{"id":"EP-DIPC-01","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"C1 proef Survival begint met te water gaan met een rol voorover, aansluitend 15 seconden watertrappen."},{"id":"EP-DIPC-02","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"In C1 volgt na het watertrappen 30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp."},{"id":"EP-DIPC-03","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"Na het verticaal drijven in C1 volgt 5 meter voortbewegen op de rug met gebruik van armen."},{"id":"EP-DIPC-04","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"In C1 volgt een deel waarin de kandidaat te water gaat met een sprong waarbij het hoofd boven water blijft, aansluitend 100 meter zwemmen."},{"id":"EP-DIPC-05","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"De 100 meter in C1 wordt onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen; afronden met zelfstandig uit het water op de kant klimmen."},{"id":"EP-DIPC-06","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"In C1 gaat de kandidaat ook te water met een sprong naar keuze, zwemt enkele slagen en gaat 1 meter voor een verticaal hangend zeil onder water om door het gat te zwemmen."},{"id":"EP-DIPC-07","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"C2 proef Onder water oriëntatie: van de kant duiken, onder water door een gat in een zeil op 6 meter van de startkant, afronden met naar de oppervlakte zwemmen, oriënteren en bovenkomen in een soort wak."},{"id":"EP-DIPC-08","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":11,"weight":"core","statement":"C3 proef Conditiezwemmen: 75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan, gevolgd door 75 meter enkelvoudige rugslag."},{"id":"EP-DIPC-09","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":12,"weight":"core","statement":"C4 proef Borst- en rugcrawl bestaat uit 15 meter borstcrawl en 15 meter rugcrawl."},{"id":"EP-DIPC-10","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":12,"weight":"core","statement":"C5 proef Oriënteren boven water en verplaatsen: van de kant te water gaan met een sprong naar keuze, aansluitend 30 seconden watertrappen met gebruik van armen en benen met verplaatsen in meerdere richtingen."},{"id":"EP-DIPC-11","category":"examenprogrammas","subtopic":"diploma_c","section":"1.1.3","page":12,"weight":"core","statement":"In C5 volgt 15 seconden drijven op de rug; de proef wordt afgerond met 30 seconden watertrappen met de benen."},{"id":"EP-ESS-01","category":"examenprogrammas","subtopic":"essenties","section":"4.2","page":46,"weight":"core","statement":"De basiselementen zijn belangrijk om verdrinking te voorkomen; waarom een onderdeel belangrijk is, wordt de essentie van het onderdeel genoemd."},{"id":"EP-ESS-02","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":46,"weight":"core","statement":"De onderdelen ‘te water gaan’ zijn opgenomen om niet in paniek te raken bij desoriëntatie, vanaf de kant dieper onder water te komen en op een veilige manier in het water te gaan in een onbekende omgeving."},{"id":"EP-ESS-03","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":47,"weight":"core","statement":"De desoriëntatie-onderdelen voetsprong voorwaarts, achterwaarts te water gaan en rol voorover horen ook bij het basiselement Survival, omdat ze gekleed worden uitgevoerd."},{"id":"EP-ESS-04","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":47,"weight":"core","statement":"De essentie van de voetsprong gekleed is helemaal onder water gaan, je oriënteren en zelfstandig (zonder een afzet van de bodem) weer omhoog komen; daarvoor is een waterdiepte van 1,8 meter een voorwaarde."},{"id":"EP-ESS-05","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":47,"weight":"detail","statement":"De voetsprong wordt vanaf enige hoogte uitgevoerd om dieper onder water te kunnen raken."},{"id":"EP-ESS-06","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":47,"weight":"core","statement":"De essentie van achterwaarts te water gaan is te water gaan zonder te weten waar je precies terecht komt en je daarna heroriënteren; er is sprake van vallen."},{"id":"EP-ESS-07","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":47,"weight":"core","statement":"Achterwaarts springen is niet toegestaan: het is een bewuste actie, er ontstaat geen desoriëntatie en het is bovendien gevaarlijk."},{"id":"EP-ESS-08","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":48,"weight":"core","statement":"De essentie van de rol voorover is met een draai om de breedteas te water raken, gedesoriënteerd zijn en je daarna heroriënteren; daarom worden geen eisen gesteld aan de technische uitvoering."},{"id":"EP-ESS-09","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":48,"weight":"core","statement":"Duiken (de populaire benaming voor de kopsprong) is opgenomen als manier om dieper onder te gaan, omdat je in water van 1,8 meter of dieper niet makkelijk van de bodem kunt afzetten."},{"id":"EP-ESS-10","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":48,"weight":"core","statement":"Voor Zwemdiploma A is duiken nog niet verplicht maar heeft het wel de voorkeur, omdat het na een duik veel makkelijker is de oriëntatieopdracht onder water uit te voeren."},{"id":"EP-ESS-11","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":48,"weight":"detail","statement":"De essentie van de sprong (A.2) en het duiken (B.2, C.2) is dieper onder water komen om direct daarna, zonder boven te komen, onder water te oriënteren en een opdracht uit te voeren."},{"id":"EP-ESS-12","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":49,"weight":"core","statement":"Als je niet weet hoe diep het water is, zoals in open water, is een voetsprong of duiken gevaarlijk; dan kun je een sprong maken waarbij het hoofd boven water blijft."},{"id":"EP-ESS-13","category":"examenprogrammas","subtopic":"essenties","section":"4.2.1","page":49,"weight":"core","statement":"De essentie van de sprong waarbij het hoofd boven water blijft is dat je het doel waar je naar toe wilt zwemmen kunt blijven zien."},{"id":"EP-ESS-14","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":50,"weight":"core","statement":"De onderdelen bij ‘onder water’ zijn bedoeld om (gekleed) onder water te (durven) zwemmen en te oriënteren en om voorwerpen te ontwijken."},{"id":"EP-ESS-15","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":50,"weight":"core","statement":"De essentie van onder water zwemmen door het gat in het zeil is onder water kunnen kijken en je in een bepaalde richting verplaatsen (oriënteren); de manier van verplaatsen is vrij."},{"id":"EP-ESS-16","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":50,"weight":"core","statement":"Bovenkomen in een ‘wak’ (Zwemdiploma C) is opgenomen om onder water in te schatten waar je het beste boven kunt komen, zodat je je hoofd niet stoot aan een boot of mat of tegen andere mensen botst."},{"id":"EP-ESS-17","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":51,"weight":"detail","statement":"Onder water verplaatsen met de schoolslag is niet verplicht maar wel verstandig: het is zeer effectief, kost relatief weinig energie en geeft veel verplaatsing."},{"id":"EP-ESS-18","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":51,"weight":"detail","statement":"Gekleed onder water zwemmen voelt heel anders en is vermoeiender dan in badkleding; de essentie van gekleed onder een drijvend voorwerp door zwemmen is dit soepel en makkelijk kunnen."},{"id":"EP-ESS-19","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":52,"weight":"core","statement":"Bij gekleed onder water gaan en door het zeil zwemmen (C) mag de jas uit, omdat zwemmen onder water met een jas erg vermoeiend (en niet aan te raden) is."},{"id":"EP-ESS-20","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":52,"weight":"detail","statement":"Voetwaarts zakken dient om helemaal onder water te komen, bijvoorbeeld om een mat of bootje te ontwijken; een krachtige beenbeweging geeft startsnelheid en gestrekte armen boven het hoofd maken het zakken sneller en meer gestroomlijnd."},{"id":"EP-ESS-21","category":"examenprogrammas","subtopic":"essenties","section":"4.2.2","page":53,"weight":"detail","statement":"Bij hoofdwaarts richting de bodem gaan wordt de beweging ingezet door de kin op de borst te brengen, met een krachtige armdoorhaal wordt startsnelheid gecreëerd en door de benen te strekken gaat het snel en gestroomlijnd."},{"id":"EP-ESS-22","category":"examenprogrammas","subtopic":"essenties","section":"4.2.3","page":53,"weight":"core","statement":"Drijven is een basisvoorwaarde voor veel andere vaardigheden en wordt gebruikt om uit te rusten of te wachten op hulp; drijven op de rug is langer vol te houden omdat er vrij kan worden geademd."},{"id":"EP-ESS-23","category":"examenprogrammas","subtopic":"essenties","section":"4.2.3","page":53,"weight":"detail","statement":"Drijven op de plaats gaat makkelijker als armen en benen gespreid zijn, maar de houding is vrij; armen/handen (wrikbewegingen) mogen worden gebruikt."},{"id":"EP-ESS-24","category":"examenprogrammas","subtopic":"essenties","section":"4.2.3","page":54,"weight":"detail","statement":"Een (te) groot drijvend voorwerp, zoals een bal of plankje, stimuleert het kantelen naar de rug; verticaal drijven is makkelijker met een stuk flexibeam, een dumbell of een ander klein voorwerp."},{"id":"EP-ESS-25","category":"examenprogrammas","subtopic":"essenties","section":"4.2.3","page":55,"weight":"core","statement":"Verticaal drijven op een voorwerp (principes van de HELP-houding) zorgt ervoor dat de afkoeling in koud water aanzienlijk vermindert; daarom zijn de knieën opgetrokken en de ellebogen tegen het lichaam."},{"id":"EP-ESS-26","category":"examenprogrammas","subtopic":"essenties","section":"4.2.3","page":55,"weight":"core","statement":"Voortbewegen op de rug met de armen is voor als je je benen niet goed kunt gebruiken; de armen blijven onder water omdat de benen anders zakken, en bij B is de verplaatsing hoofdwaarts omdat dit het eenvoudigst is."},{"id":"EP-ESS-27","category":"examenprogrammas","subtopic":"essenties","section":"4.2.4","page":56,"weight":"detail","statement":"Draaien in het water is bedoeld om je te oriënteren; met een halve draai om de lengteas verander je van rug- naar buikligging zonder overeind te komen."},{"id":"EP-ESS-28","category":"examenprogrammas","subtopic":"essenties","section":"4.2.5","page":56,"weight":"core","statement":"Watertrappen wordt vooral gebruikt om te oriënteren boven water; door in verticale houding beenbewegingen te maken met armen of handen als ondersteuning blijf je zonder veel inspanning met het hoofd boven water."},{"id":"EP-ESS-29","category":"examenprogrammas","subtopic":"essenties","section":"4.2.5","page":57,"weight":"core","statement":"Bij gekleed watertrappen is het gebruik van armen/handen als ondersteuning heel belangrijk, in tegenstelling tot ‘vroeger’, toen de vingers boven water werden getoond."},{"id":"EP-ESS-30","category":"examenprogrammas","subtopic":"essenties","section":"4.2.5","page":59,"weight":"detail","statement":"Watertrappen met alleen de benen is bedoeld voor als de armen om een bepaalde reden niet mee kunnen bewegen; het is intensiever dan met de armen ter ondersteuning."},{"id":"EP-ESS-31","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":59,"weight":"core","statement":"Enkelvoudige rugslag en schoolslag zijn heel geschikt om je in veiligheid te brengen: ze kosten relatief weinig energie, zijn ook gekleed lang vol te houden en tot op hoge leeftijd uit te voeren."},{"id":"EP-ESS-32","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":59,"weight":"detail","statement":"Rugcrawl en borstcrawl zijn misschien minder geschikt om langere afstanden te overbruggen, maar het beheersen ervan levert een grote bijdrage aan het beleven van plezier."},{"id":"EP-ESS-33","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":60,"weight":"detail","statement":"Bij de enkelvoudige rugslag geven de armen ontspannen naast het lichaam zo weinig mogelijk frontale weerstand; de schoolslag maakt het mogelijk om tijdens het voortbewegen om je heen te blijven kijken."},{"id":"EP-ESS-34","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":61,"weight":"core","statement":"De ademhaling bij borstcrawl is bij A en B nog niet noodzakelijk, omdat die in het begin van het leerproces moeilijk is voor jonge kinderen en veel (extra) weerstand geeft; bij C is een zijwaartse ademhaling de voorkeur omdat die de minste weerstand oplevert."},{"id":"EP-ESS-35","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":62,"weight":"detail","statement":"Door bij A en B af te wisselen tussen enkelvoudige rugslag (minst vermoeiend) en schoolslag treedt minder vermoeidheid op en kan de afstand makkelijker worden volgehouden."},{"id":"EP-ESS-36","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":63,"weight":"core","statement":"Gekleed zwemmen is opgenomen omdat je bij per ongeluk in open water vallen meestal dagelijkse kleding aan hebt; de essentie is een afstand kunnen overbruggen met kleding aan."},{"id":"EP-ESS-37","category":"examenprogrammas","subtopic":"essenties","section":"4.2.6","page":64,"weight":"detail","statement":"Bij gekleed zwemmen is het handig om kandidaten te stimuleren bij de enkelvoudige rugslag de armen te gebruiken voor de balans of (extra) voorstuwing."},{"id":"EP-ESS-38","category":"examenprogrammas","subtopic":"essenties","section":"4.2.7","page":65,"weight":"core","statement":"Jezelf redden eindigt bij zelfstandig uit het water klimmen; de essentie is het resultaat, er worden geen eisen gesteld aan de manier waarop op de kant of over het drijvend voorwerp wordt geklommen."},{"id":"EP-MAAT-01","category":"examenprogrammas","subtopic":"maatwerk","section":"Aanleiding","page":4,"weight":"core","statement":"Voor het Zwem-ABC bestaan twee soorten examenprogramma's: standaard en maatwerk."},{"id":"EP-MAAT-02","category":"examenprogrammas","subtopic":"maatwerk","section":"Aanleiding","page":4,"weight":"core","statement":"De inhoud (onderdelen) van een maatwerk examenprogramma is gelijk aan de inhoud van het standaard examenprogramma."},{"id":"EP-MAAT-03","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"core","statement":"Met een maatwerk examenprogramma is het mogelijk proeven aan te passen, nieuwe proeven te bedenken en zo een heel nieuw examenprogramma samen te stellen."},{"id":"EP-MAAT-04","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"core","statement":"In de standaard examenprogramma's moeten de onderdelen van de proeven in de vastgestelde, in de Examenregeling beschreven volgorde worden uitgevoerd."},{"id":"EP-MAAT-05","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"core","statement":"Een Licentiehouder kan een maatwerk examenprogramma pas toepassen als het vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid."},{"id":"EP-MAAT-06","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"core","statement":"De Toetsingscommissie Maatwerk Examenprogramma's is een commissie van deskundigen die toetst of een ingediend maatwerk examenprogramma voldoet."},{"id":"EP-MAAT-07","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"core","statement":"De Toetsingscommissie toetst op gelijkwaardigheid aan het niveau van de proeven/onderdelen van het standaard examenprogramma en aan de doelen behorende bij de niveaus van zwemveiligheid."},{"id":"EP-MAAT-08","category":"examenprogrammas","subtopic":"maatwerk","section":"4","page":44,"weight":"detail","statement":"Maatwerk examenprogramma's zijn nieuw en geven meer ruimte voor innovatie van het zwemonderwijs en het diplomazwemmen."},{"id":"EP-MAAT-09","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"core","statement":"In een maatwerk examenprogramma mag een proef uit het standaard examenprogramma worden ingewisseld voor een nieuwe proef, mogen onderdelen uit een proef in een andere volgorde worden geplaatst en op een andere manier worden gecombineerd."},{"id":"EP-MAAT-10","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"detail","statement":"In een maatwerk examenprogramma mogen proeven worden samengesteld voor een specifiek deel van het zwembad (stroming of golfslagbad) en proeven waarin het doelgerichte gebruik van vaardigheden voorop staat (oriënteren na te water gaan van de glijbaan of drijven in golfslagbad)."},{"id":"EP-MAAT-11","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"detail","statement":"Maatwerkproeven mogen aansluiten bij de eigen (bedrijfs)visie op het leren zwemmen, en een examenprogramma mag gevarieerde organisatie- en aanbiedingsvormen hebben."},{"id":"EP-MAAT-12","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"core","statement":"Voorwaarde maatwerk: alle onderdelen uit het standaard examenprogramma worden opgenomen in de proeven van het maatwerk examenprogramma."},{"id":"EP-MAAT-13","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"core","statement":"Voorwaarde maatwerk: de normering van de onderdelen van het standaard examenprogramma geldt ook voor het maatwerk examenprogramma."},{"id":"EP-MAAT-14","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"core","statement":"Bij maatwerk is het toegestaan om extra eisen aan de normering van bepaalde onderdelen toe te voegen."},{"id":"EP-MAAT-15","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":44,"weight":"core","statement":"Voorwaarde maatwerk: bij het toepassen van de afzonderlijke onderdelen in proeven moet de essentie van het onderdeel zichtbaar zijn."},{"id":"EP-MAAT-16","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"core","statement":"Voorwaarde maatwerk: de onderdelen worden minimaal uitgevoerd in de waterdiepte die staat voorgeschreven."},{"id":"EP-MAAT-17","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"core","statement":"Voorwaarde maatwerk: de organisatie van het maatwerk examenprogramma maakt het mogelijk om de kandidaten individueel te beoordelen."},{"id":"EP-MAAT-18","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"detail","statement":"Er zijn al maatwerkproeven ontwikkeld en goedgekeurd; deze zijn bedoeld als voorbeeld en inspiratie om zelf proeven of examenprogramma's te ontwikkelen."},{"id":"EP-MAAT-19","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"core","statement":"De Licentiehouder doet de aanvraag van een maatwerk examenprogramma via het aanvraagformulier Maatwerk Examenprogramma; de Toetsingscommissie kijkt of het programma voldoet aan de gestelde voorwaarden."},{"id":"EP-MAAT-20","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"detail","statement":"Het aanvraagformulier vermeldt onder meer voor welk examenprogramma goedkeuring wordt gevraagd, of (en welke) proef wordt vervangen, welke onderdelen voor nieuwe proeven worden gebruikt en hoe het totale programma is opgebouwd."},{"id":"EP-MAAT-21","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"detail","statement":"Het aanvraagformulier beschrijft ook hoe alle proeven stapsgewijs worden uitgevoerd (eventueel met een tekening van het zwembad of beeldmateriaal) en hoe de proef per kandidaat goed kan worden beoordeeld door de Examinator en medebeoordelaars."},{"id":"EP-MAAT-22","category":"examenprogrammas","subtopic":"maatwerk","section":"4.1","page":45,"weight":"core","statement":"Weigert de Toetsingscommissie goedkeuring, dan kan de Licentiehouder een aangepast verzoek bij de Toetsingscommissie indienen of schriftelijk beroep indienen bij de Commissie van Beroep van de Nationale Raad Zwemveiligheid."},{"id":"EP-MAAT-23","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.1","page":48,"weight":"core","statement":"In het maatwerk examenprogramma mag de oriëntatieopdracht onder water na de sprong of duik ook een andere opdracht dan het zeil zijn, mits die minimaal 75 centimeter onder het wateroppervlak wordt uitgevoerd."},{"id":"EP-MAAT-24","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":62,"weight":"core","statement":"Bij maatwerk mag bij conditiezwemmen van de verplichting in volgorde en uit te voeren zwemslag worden afgeweken; techniek en conditie mogen in twee aparte proeven worden opgenomen."},{"id":"EP-MAAT-25","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":63,"weight":"core","statement":"Worden techniek en conditie apart getoetst, dan blijft de afstand van het conditiezwemmen per zwemdiploma gelijk en wordt er in totaal 50 meter meer gezwommen."},{"id":"EP-MAAT-26","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":63,"weight":"core","statement":"Kandidaten mogen bij maatwerk ook een bepaalde tijd aaneengesloten zwemmen; de geschatte afstand in die tijd moet globaal overeenkomen met de afstand van het conditiezwemmen."},{"id":"EP-MAAT-27","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":63,"weight":"core","statement":"Bij het maatwerk-conditiezwemmen mag de kandidaat schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl gebruiken en tussentijds wisselen; de uitvoering wordt niet beoordeeld, maar er moet een redelijke voortstuwing zijn."},{"id":"EP-MAAT-28","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":63,"weight":"detail","statement":"Voor het onderdeel conditiezwemmen geldt voor een maatwerk examenprogramma een andere normering dan voor het standaard examenprogramma."},{"id":"EP-MAAT-29","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.1","page":47,"weight":"core","statement":"Aanvullende voorwaarde: voetsprong voorwaarts, achterwaarts te water gaan en de rol voorover worden direct gevolgd door oriënteren in de vorm van watertrappen en daarna een vervolgopdracht."},{"id":"EP-MAAT-30","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.5","page":57,"weight":"detail","statement":"Aanvullende voorwaarde bij 15 seconden gekleed watertrappen: na het watertrappen volgt een actie in een vooraf afgesproken richting."},{"id":"EP-MAAT-31","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.2","page":50,"weight":"detail","statement":"Aanvullende voorwaarde bij onder water zwemmen door een gat in een verticaal hangend zeil (A.3, B.3, C.4): de kandidaat moet minimaal 1 meter voor het zeil onder water gaan."},{"id":"EP-MAAT-32","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2.6","page":64,"weight":"core","statement":"Gekleed zwemmen (A.17, B.18, C.20) en conditiezwemmen worden uitgevoerd in een bassin met een oppervlak van minimaal 160 m2."},{"id":"EP-MAAT-33","category":"examenprogrammas","subtopic":"maatwerk","section":"4.2","page":53,"weight":"core","statement":"Volgens hoofdstuk 4 worden drijven (op buik en rug) en voortbewegen op de rug met de armen uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan; voetwaarts en hoofdwaarts richting de bodem in minimaal 1,8 meter."},{"id":"EP-MAAT-34","category":"examenprogrammas","subtopic":"maatwerk","section":"1","page":6,"weight":"detail","statement":"Het maatwerk examenprogramma bestaat voor de Zwemdiploma's A, B en C; de Zwemcertificaten A, B en C hebben een (standaard) examenprogramma."},{"id":"EP-MAAT-35","category":"examenprogrammas","subtopic":"maatwerk","section":"Inleiding","page":1,"weight":"detail","statement":"Met het maatwerk examenprogramma heeft de zwemlesaanbieder de vrijheid om het diplomazwemmen te laten aansluiten op de eigen visie en identiteit van de organisatie."},{"id":"EP-VERG-01","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"1.1","page":7,"weight":"core","statement":"Het te water gaan aan het begin van de proef Survival verschilt per diploma: A voetsprong voorwaarts vanaf enige hoogte, B achterwaarts te water gaan, C rol voorover."},{"id":"EP-VERG-02","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"1.1","page":9,"weight":"core","statement":"Bij de proef Onder water oriëntatie mag de kandidaat voor A te water gaan met een sprong (duiken heeft de voorkeur); voor B en C is het van de kant duiken."},{"id":"EP-VERG-03","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"1.1","page":9,"weight":"core","statement":"Het zeil bij de proef Onder water oriëntatie hangt bij A op 3 meter en bij B en C op 6 meter van de startkant; alleen bij C volgt bovenkomen in een soort wak."},{"id":"EP-VERG-04","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.6","page":63,"weight":"core","statement":"De afstand gekleed zwemmen is 12,5 meter bij A, 50 meter bij B en 100 meter bij C."},{"id":"EP-VERG-05","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.6","page":62,"weight":"core","statement":"Conditiezwemmen is 100 meter bij Zwemdiploma A en 150 meter bij Zwemdiploma B en C."},{"id":"EP-VERG-06","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.6","page":62,"weight":"core","statement":"Bij A en B worden enkelvoudige rugslag en schoolslag iedere 25 meter afgewisseld; bij C wordt 75 meter in één slag gezwommen en daarna gewisseld."},{"id":"EP-VERG-07","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.6","page":60,"weight":"core","statement":"Bij borst- en rugcrawl is er een opbouw in afstand: 5 meter (A), 10 meter (B) en 15 meter (C)."},{"id":"EP-VERG-08","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.3","page":53,"weight":"core","statement":"Drijven op de rug duurt 10 seconden bij A en 15 seconden bij B en C; 5 seconden drijven op de buik komt alleen bij A voor."},{"id":"EP-VERG-09","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.5","page":56,"weight":"core","statement":"Watertrappen in de proef Oriënteren boven water: A 60 seconden met 2 hele draaien om de lengteas, B 60 seconden met verplaatsen in meerdere richtingen, C 30 seconden met verplaatsen plus 30 seconden met alleen de benen."},{"id":"EP-VERG-10","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.2","page":52,"weight":"core","statement":"Voetwaarts richting de bodem zakken hoort bij A en B; hoofdwaarts richting de bodem gaan hoort bij C."},{"id":"EP-VERG-11","category":"examenprogrammas","subtopic":"vergelijking_abc","section":"4.2.4","page":56,"weight":"core","statement":"Bij A wordt één halve draai om de lengteas getoond; bij B een halve draai van buik naar rug en een van rug naar buik."},{"id":"NO-ALG-01","category":"normering","subtopic":"normering_algemeen","section":"2","page":16,"weight":"core","statement":"Normering beschrijft hoe onderdelen minimaal moeten worden uitgevoerd om het zwemdiploma te behalen; uitgangspunt is een efficiënte uitvoering van een onderdeel of vaardigheid."},{"id":"NO-ALG-02","category":"normering","subtopic":"normering_algemeen","section":"2","page":16,"weight":"detail","statement":"De normering beschrijft de kenmerken van de (technische) uitvoering, (soms) de voorkeursuitvoering, wat op sommige punten niet wordt toegestaan en de ‘omstandigheden’ zoals waterdiepte en afmetingen van materiaal."},{"id":"NO-ALG-03","category":"normering","subtopic":"normering_algemeen","section":"2","page":16,"weight":"core","statement":"Als een kandidaat de voorkeursuitvoering lastig onder de knie krijgt, hoeft dat niet direct een belemmering te zijn om te slagen voor het zwemdiploma."},{"id":"NO-ALG-04","category":"normering","subtopic":"normering_algemeen","section":"2.1","page":16,"weight":"core","statement":"Om in het bezit te komen van een zwemdiploma moeten alle onderdelen van het examenprogramma volgens de beschreven normering worden uitgevoerd."},{"id":"NO-ALG-05","category":"normering","subtopic":"normering_algemeen","section":"2.1","page":16,"weight":"core","statement":"Bij kandidaten met een tijdelijke of permanente beperking kan de uitvoering worden aangepast aan hun mogelijkheden, mits de essentie van de opdracht of vaardigheid blijft bestaan (bijvoorbeeld een schaarslag bij schoolslag of enkelvoudige rugslag)."},{"id":"NO-ALG-06","category":"normering","subtopic":"normering_algemeen","section":"2.1","page":17,"weight":"core","statement":"Er mogen geen onderdelen of proeven worden overgeslagen."},{"id":"NO-CERT-01","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"detail","statement":"Bij het uitvoeren van de examenprogramma's voor de Zwemcertificaten gelden een paar specifieke afwijkende normeringen en bepalingen."},{"id":"NO-CERT-02","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Verplicht deel zwemcertificaat: te water gaan in diep water mag via een trapje."},{"id":"NO-CERT-03","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Verplicht deel zwemcertificaat: geheel onder water gaan mag ook met behulp van een trapje."},{"id":"NO-CERT-04","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Verplicht deel zwemcertificaat: drijven wordt, indien nodig, uitgevoerd met actief gebruik van de armen."},{"id":"NO-CERT-05","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"detail","statement":"Verplicht deel zwemcertificaat: de uitvoering van de zwemslag naar keuze is vrij."},{"id":"NO-CERT-06","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Verplicht deel zwemcertificaat: de uitvoering van watertrappen is vrij; de essentie is het op een bepaalde plaats in het water boven water blijven."},{"id":"NO-CERT-07","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Open deel zwemcertificaat: er wordt op het zwemcertificaat aangekruist welke onderdelen de kandidaat beheerst en vermeld hoeveel onderdelen zijn uitgevoerd."},{"id":"NO-CERT-08","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Bij het open deel 25 meter schoolslag en enkelvoudige rugslag geldt de normering van de schoolslag techniek en enkelvoudige rugslag techniek uit paragraaf 2.1."},{"id":"NO-CERT-09","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"detail","statement":"Voor de overige onderdelen van het open deel is de normering van de onderdelen uit het hoofdstuk ‘Normering’ van toepassing."},{"id":"NO-CERT-10","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Zwemcertificaten worden per organisatie van het diplomazwemmen aangevraagd; ze kunnen in kleine aantallen worden aangevraagd en zeer beperkt in voorraad worden gehouden."},{"id":"NO-CERT-11","category":"normering","subtopic":"zwemcertificaten","section":"2.2","page":32,"weight":"core","statement":"Licentiehouders die gespecialiseerd zijn in zwemlessen voor kandidaten met een (tijdelijke) beperking mogen een beperkte voorraad zwemcertificaten aanhouden: 10 stuks per niveau."},{"id":"NO-COND-01","category":"normering","subtopic":"conditiezwemmen","section":"2.1.1","page":18,"weight":"core","statement":"A3 Conditiezwemmen bestaat in totaal uit 100 meter; de uitvoering van schoolslag en enkelvoudige rugslag wordt in de eerste 50 meter beoordeeld, de conditie over de totale afstand."},{"id":"NO-COND-02","category":"normering","subtopic":"conditiezwemmen","section":"2.1.1","page":18,"weight":"core","statement":"Bij A3 en B3 wordt na de eerste 50 meter de uitvoering van de zwemslagen niet meer beoordeeld, maar moet er nog wel sprake zijn van een redelijk voortstuwingsrendement."},{"id":"NO-COND-03","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":19,"weight":"core","statement":"Bij A wordt in totaal 100 meter aaneengesloten en bij B 150 meter achter elkaar gezwommen; schoolslag en enkelvoudige rugslag worden iedere 25 meter afgewisseld."},{"id":"NO-COND-04","category":"normering","subtopic":"conditiezwemmen","section":"2.1.3","page":29,"weight":"core","statement":"Bij C3 wordt de uitvoering van schoolslag en enkelvoudige rugslag in de eerste 25 meter van de 75 meter met de betreffende zwemslag beoordeeld; daarna wordt het volhouden van de afstand beoordeeld."},{"id":"NO-COND-05","category":"normering","subtopic":"conditiezwemmen","section":"2.1.3","page":30,"weight":"core","statement":"Bij C wordt in totaal 150 meter achter elkaar gezwommen; de schoolslag wordt na 75 meter afgewisseld door de enkelvoudige rugslag."},{"id":"NO-COND-06","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":19,"weight":"core","statement":"Schoolslag techniek: de kandidaat voelt zich vertrouwd, er is een zo horizontaal mogelijke ligging, een ritmisch en symmetrisch bewegingsverloop, een ontspannen ademhaling en een redelijk voortstuwingsrendement."},{"id":"NO-COND-07","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":19,"weight":"core","statement":"Bij de schoolslag techniek is er een kort uitdrijfmoment aanwezig, waarbij armen en benen beide gestrekt zijn."},{"id":"NO-COND-08","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":19,"weight":"core","statement":"Enkelvoudige rugslag techniek: de kandidaat voelt zich vertrouwd, er is een horizontale ligging, een ritmisch en symmetrisch bewegingsverloop en een redelijk voortstuwingsrendement."},{"id":"NO-COND-09","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":19,"weight":"core","statement":"Bij de enkelvoudige rugslag techniek is er een duidelijk uitdrijfmoment en zijn de armen passief, bij voorkeur langs het lichaam."},{"id":"NO-COND-10","category":"normering","subtopic":"conditiezwemmen","section":"2.1","page":20,"weight":"core","statement":"Bij de halve draai om de lengteas is er sprake van een horizontale ligging."},{"id":"NO-COND-11","category":"normering","subtopic":"conditiezwemmen","section":"2.1.2","page":23,"weight":"detail","statement":"De onderdelen van B3 zijn 25 meter schoolslag techniek, 25 meter enkelvoudige rugslag techniek, een halve draai van rug naar buik, een halve draai van buik naar rug en 150 meter conditiezwemmen."},{"id":"NO-CRAWL-01","category":"normering","subtopic":"borst_rugcrawl","section":"2.1","page":19,"weight":"core","statement":"Bij de borstcrawl is het gezicht in het water."},{"id":"NO-CRAWL-02","category":"normering","subtopic":"borst_rugcrawl","section":"2.1","page":19,"weight":"core","statement":"Bij borst- en rugcrawl is er sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging en een armslag over het water."},{"id":"NO-CRAWL-03","category":"normering","subtopic":"borst_rugcrawl","section":"2.1","page":24,"weight":"core","statement":"Bij Zwemdiploma A wordt bij borst- en rugcrawl een asymmetrische armbeweging gevraagd; bij B en C een doorgaande asymmetrische armbeweging."},{"id":"NO-CRAWL-04","category":"normering","subtopic":"borst_rugcrawl","section":"2.1","page":19,"weight":"core","statement":"Bij de borstcrawl voor A en B is de uitvoering van een ademhaling niet (beslist) noodzakelijk; als die wel wordt uitgevoerd, wordt deze niet bij de beoordeling betrokken."},{"id":"NO-CRAWL-05","category":"normering","subtopic":"borst_rugcrawl","section":"2.1.3","page":31,"weight":"core","statement":"Bij de borstcrawl voor C is er minimaal 1 keer een ademhaling; de uitvoering is bij voorkeur zijwaarts, maar wordt niet bij de beoordeling betrokken."},{"id":"NO-ONDW-01","category":"normering","subtopic":"onder_water","section":"2.1","page":17,"weight":"core","statement":"De proef Onder water oriëntatie (A2, B2 en C2) wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},{"id":"NO-ONDW-02","category":"normering","subtopic":"onder_water","section":"2.1.1","page":18,"weight":"core","statement":"Bij te water gaan met een sprong (A2) heeft duiken de voorkeur; de kandidaat start vanuit staande positie vanaf bassinrand of startblok en gaat na de sprong geheel onder water."},{"id":"NO-ONDW-03","category":"normering","subtopic":"onder_water","section":"2.1.2","page":23,"weight":"core","statement":"Bij van de kant in het water duiken (B2, C2) start de kandidaat vanuit staande positie vanaf bassinrand of startblok en raken de handen als eerste het wateroppervlak, daarna de armen en het hoofd."},{"id":"NO-ONDW-04","category":"normering","subtopic":"onder_water","section":"2.1","page":18,"weight":"core","statement":"Bij onder water zwemmen blijft de kandidaat geheel onder water; de manier waarop onder water wordt gezwommen is vrij."},{"id":"NO-ONDW-05","category":"normering","subtopic":"onder_water","section":"2.1","page":18,"weight":"core","statement":"De afstand die wordt overbrugd met springen of duiken wordt in de totale afstand onder water zwemmen meegeteld."},{"id":"NO-ONDW-06","category":"normering","subtopic":"onder_water","section":"2.1.3","page":29,"weight":"core","statement":"Bij C2 komt de kandidaat boven water in/op een vooraf afgesproken plek (hoepel, mat, afgebakend gebied)."},{"id":"NO-ONDW-07","category":"normering","subtopic":"onder_water","section":"2.1","page":19,"weight":"core","statement":"Bij voetwaarts richting de bodem zakken zijn de armen gestrekt boven het hoofd en blijven ze onder water ook gestrekt; de kandidaat gaat geheel onder water."},{"id":"NO-ONDW-08","category":"normering","subtopic":"onder_water","section":"2.1.1","page":19,"weight":"detail","statement":"Voetwaarts richting de bodem zakken (A3) wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},{"id":"NO-ONDW-09","category":"normering","subtopic":"onder_water","section":"2.1.3","page":30,"weight":"core","statement":"Bij hoofdwaarts richting de bodem gaan (C3) is de beweging hoofdwaarts en komen de benen geheel onder water; het onderdeel wordt uitgevoerd in minimaal 1,8 meter waterdiepte."},{"id":"NO-ONDW-10","category":"normering","subtopic":"onder_water","section":"2.1.3","page":30,"weight":"core","statement":"Hoofdwaarts richting de bodem gaan wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dit wordt niet bij de beoordeling betrokken."},{"id":"NO-ORI-01","category":"normering","subtopic":"orienteren_boven_water","section":"2.1","page":17,"weight":"detail","statement":"Bij watertrappen (gekleed en met armen en benen) is het hoofd boven water en is er sprake van een verticale houding."},{"id":"NO-ORI-02","category":"normering","subtopic":"orienteren_boven_water","section":"2.1","page":17,"weight":"core","statement":"Bij watertrappen bewegen beide benen; dit mag gelijktijdig of afwisselend worden uitgevoerd."},{"id":"NO-ORI-03","category":"normering","subtopic":"orienteren_boven_water","section":"2.1","page":17,"weight":"core","statement":"Bij gekleed watertrappen en watertrappen met armen en benen zijn de armen/handen onder water en bewegen ze mee ter ondersteuning."},{"id":"NO-ORI-04","category":"normering","subtopic":"orienteren_boven_water","section":"2.1","page":17,"weight":"detail","statement":"Bij gekleed watertrappen en bij watertrappen met armen en benen (A6) blijft de kandidaat op de plaats."},{"id":"NO-ORI-05","category":"normering","subtopic":"orienteren_boven_water","section":"2.1","page":21,"weight":"core","statement":"De proef Oriënteren boven water en verplaatsen (A6, B6, C5) wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},{"id":"NO-ORI-06","category":"normering","subtopic":"orienteren_boven_water","section":"2.1.1","page":21,"weight":"core","statement":"Bij al watertrappend een hele draai om de lengteas maken blijft het lichaam tijdens het draaien in verticale houding."},{"id":"NO-ORI-07","category":"normering","subtopic":"orienteren_boven_water","section":"2.1.2","page":26,"weight":"core","statement":"Bij watertrappen met verplaatsen in meerdere richtingen (B6, C5) verplaatst de kandidaat zich minimaal 4 keer (zowel voor-, achter- als zijwaarts)."},{"id":"NO-ORI-08","category":"normering","subtopic":"orienteren_boven_water","section":"2.1.3","page":32,"weight":"core","statement":"Bij watertrappen met de benen (C5) zijn de armen/handen passief, in de zij of bij het wateroppervlak, en blijft de kandidaat op de plaats."},{"id":"NO-SURV-01","category":"normering","subtopic":"survival","section":"2.1.1","page":16,"weight":"core","statement":"A1 proef Survival wordt gestart in een waterdiepte van minimaal 1,8 meter."},{"id":"NO-SURV-02","category":"normering","subtopic":"survival","section":"2.1.1","page":17,"weight":"core","statement":"Bij de gekleed voetsprong voorwaarts raken de voeten als eerste het water, is het lichaam zo gestrekt mogelijk en gaat de kandidaat na de sprong helemaal onder water."},{"id":"NO-SURV-03","category":"normering","subtopic":"survival","section":"2.1.1","page":17,"weight":"core","statement":"‘Vanaf enige hoogte’ bij de voetsprong voorwaarts is minimaal 30 centimeter vanaf de waterlijn."},{"id":"NO-SURV-04","category":"normering","subtopic":"survival","section":"2.1.1","page":17,"weight":"detail","statement":"Als er geen hoge kant of startblok aanwezig is, moet worden gezorgd voor een veilige verhoging waar vanaf wordt gesprongen."},{"id":"NO-SURV-05","category":"normering","subtopic":"survival","section":"2.1","page":17,"weight":"core","statement":"Bij gekleed zwemmen zwemt de kandidaat één of meer van de zwemslagen schoolslag, enkelvoudige rugslag, borstcrawl en rugcrawl en mag hij voortdurend wisselen van zwemslag."},{"id":"NO-SURV-06","category":"normering","subtopic":"survival","section":"2.1","page":17,"weight":"core","statement":"Bij gekleed zwemmen mogen de zwemslagen ook met alleen de armen of alleen de benen worden gezwommen."},{"id":"NO-SURV-07","category":"normering","subtopic":"survival","section":"2.1","page":17,"weight":"core","statement":"Bij gekleed zwemmen moet er sprake zijn van een redelijk voortstuwingsrendement; de uitvoering van de zwemslagen wordt niet meegenomen in de beoordeling."},{"id":"NO-SURV-08","category":"normering","subtopic":"survival","section":"2.1","page":17,"weight":"core","statement":"Bij zelfstandig uit het water op de kant klimmen klimt de kandidaat op een eigen manier; gebruik van een drijvend voorwerp, zoals een mat, is toegestaan."},{"id":"NO-SURV-09","category":"normering","subtopic":"survival","section":"2.1","page":17,"weight"
