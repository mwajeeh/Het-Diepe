"Niet goed; bij deze sprong moet de kandidaat duiken."],"answer":0,"explanation":"Voor deze sprong geldt dat de uitvoering volledig wordt vrijgelaten, mits het hoofd boven water blijft. De hurksprong is als techniek losgelaten en wordt door Reddingsbrigade Nederland niet meer gehanteerd. Duiken is de nieuwe term voor de kopsprong en hoort bij een ander onderdeel. Bijlage 1","ref":"Bijlage 1","tests":"hurksprong → sprong waarbij hoofd boven water blijft","source":{"page":"Bijlage 1","quote":"geldt dat de uitvoering volledig vrijgelaten wordt, mits het hoofd boven water blijft"}},{"id":"AB-0101","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-03"],"question":"Wat vermeldt Bijlage 1 over de techniek van de hurksprong?","options":["Reddingsbrigade Nederland hanteert deze techniek niet meer.","De techniek is nog voorgeschreven bij Zwemdiploma C.","De techniek is in de Examenregeling vervangen door duiken."],"answer":0,"explanation":"De techniek van de hurksprong, die vroeger in het examenprogramma zat, wordt door Reddingsbrigade Nederland niet meer gehanteerd. Ze is bij geen enkel diploma meer voorgeschreven, en de vervangende term is 'een sprong waarbij het hoofd boven water blijft'; duiken vervangt de kopsprong. Bijlage 1","ref":"Bijlage 1","tests":"hurksprong niet meer gehanteerd door Reddingsbrigade Nederland","source":{"page":"Bijlage 1","quote":"wordt door Reddingsbrigade Nederland niet meer gehanteerd"}},{"id":"AB-0102","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-04"],"question":"Onder welke naam was de Examenregeling Nationale Zwemdiploma's voorheen bekend?","options":["Bepalingen, Richtlijnen en Examenprogramma's Zwem-ABC (BREZ)","Het Handboek Licentie Nationale Zwemdiploma's","De Nationale Norm Zwemveiligheid"],"answer":0,"explanation":"De Examenregeling was voorheen bekend als de BREZ: Bepalingen, Richtlijnen en Examenprogramma's Zwem-ABC. Sinds 1 januari 2018 wordt die term niet meer gebruikt. Het Handboek Licentie en de Nationale Norm Zwemveiligheid zijn afzonderlijke documenten. Aanleiding, p. 3 en Bijlage 1","ref":"Aanleiding, p. 3 en Bijlage 1","tests":"BREZ → Examenregeling Nationale Zwemdiploma's (2018)","source":{"page":3,"quote":"voorheen bekend als Bepalingen, Richtlijnen en Examenprogramma’s Zwem-ABC (BREZ)"}},{"id":"AB-0103","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-04","AB-DEF-05"],"question":"Welke bewering over de nieuwe namen en termen uit Bijlage 1 is NIET juist?","options":["Examinator Nationale Zwemdiploma's is de nieuwe naam voor Gelicentieerde Examinator Zwem-ABC.","Licentiehouder Nationale Zwemdiploma's is de nieuwe term voor Licentiehouder Zwem-ABC.","De oude naam BREZ blijft naast de naam Examenregeling Nationale Zwemdiploma's in gebruik."],"answer":2,"explanation":"De term BREZ wordt niet meer gehanteerd; de Examenregeling Nationale Zwemdiploma's is sinds 1 januari 2018 de nieuwe naam voor het reglement. De nieuwe namen voor de Examinator en de Licentiehouder kloppen wel. Bijlage 1","ref":"Bijlage 1","tests":"BREZ → Examenregeling Nationale Zwemdiploma's (2018)","source":{"page":"Bijlage 1","quote":"De term BREZ wordt niet meer gehanteerd"}},{"id":"AB-0104","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-05"],"question":"Wat is de nieuwe naam voor de 'Gelicentieerde Examinator Zwem-ABC'?","options":["Examinator Nationale Zwemdiploma's","Licentiehouder Nationale Zwemdiploma's","Regioadviseur Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's is de nieuwe naam voor de Gelicentieerde Examinator Zwem-ABC; die oude term wordt niet meer gebruikt. Licentiehouder Nationale Zwemdiploma's vervangt Licentiehouder Zwem-ABC, en de regioadviseur is een functie bij de Nationale Raad Zwemveiligheid. Bijlage 1","ref":"Bijlage 1","tests":"Gelicentieerde Examinator Zwem-ABC → Examinator Nationale Zwemdiploma's","source":{"page":"Bijlage 1","quote":"Het betreft hier een nieuwe naam voor Gelicentieerde Examinator Zwem-ABC"}},{"id":"AB-0105","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-05"],"question":"Wie is volgens Bijlage 1 degene die vanuit de Licentiehouder zorgdraagt voor de kwaliteit van het diplomazwemmen?","options":["De Examinator Nationale Zwemdiploma's","De regioadviseur van de Nationale Raad Zwemveiligheid","De Toetsingscommissie Maatwerk Examenprogramma's"],"answer":0,"explanation":"De Examinator Nationale Zwemdiploma's draagt vanuit de Licentiehouder zorg voor de kwaliteit van het diplomazwemmen. De regioadviseur hoort bij de Nationale Raad Zwemveiligheid, niet bij de Licentiehouder, en de Toetsingscommissie toetst maatwerk examenprogramma's. Bijlage 1","ref":"Bijlage 1","tests":"Examinator: vanuit Licentiehouder zorg voor kwaliteit diplomazwemmen","source":{"page":"Bijlage 1","quote":"is degene die vanuit de Licentiehouder zorgdraagt voor kwaliteit van het diplomazwemmen"}},{"id":"AB-0106","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-06"],"question":"Hoe verhouden de termen 'examens' en 'diplomazwemmen' zich tot elkaar in de Examenregeling?","options":["Ze worden door elkaar gebruikt voor hetzelfde moment van praktijktoetsing.","Diplomazwemmen is de praktijktoets; het examen is het theoretische deel.","Examens horen bij de diploma's; diplomazwemmen hoort bij de certificaten."],"answer":0,"explanation":"Het examen is een formeel moment van praktijktoetsing dat ook bekendstaat als diplomazwemmen; beide termen worden door elkaar gebruikt. Er is geen theoretisch deel, en de termen maken geen onderscheid tussen diploma's en zwemcertificaten. Bijlage 1","ref":"Bijlage 1","tests":"examens en diplomazwemmen door elkaar gebruikt","source":{"page":"Bijlage 1","quote":"Dit formele moment is een vorm van praktijktoetsing en staat ook bekend als diplomazwemmen"}},{"id":"AB-0107","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-07","AB-DEF-14"],"question":"Waarom is voor 'hoofdwaarts richting bodem gaan' gekozen in plaats van de term 'hoekduik'?","options":["Omdat de strakke technische normering van de hoekduik is losgelaten","Omdat de afkorting onbekend was en tot verwarring kon leiden","Omdat Reddingsbrigade Nederland de techniek niet meer hanteert"],"answer":0,"explanation":"Bij de hoekduik is gekozen om de strakke technische normering los te laten, en daarom ook voor een nieuwe term. Een onbekende, verwarrende afkorting is de reden bij de HELP-houding, en Reddingsbrigade Nederland wordt genoemd bij de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"hoekduik → hoofdwaarts richting bodem gaan (normering losgelaten)","source":{"page":"Bijlage 1","quote":"Er is gekozen om de strakke technische normering, die daarbij hoorde, los te laten"}},{"id":"AB-0108","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-07","AB-DEF-01","AB-DEF-02"],"question":"Welke combinatie van oude en nieuwe term is NIET juist?","options":["Kopsprong wordt nu 'duiken' genoemd.","Hurksprong wordt nu 'een sprong waarbij het hoofd boven water blijft'.","Hoekduik wordt nu 'verticaal drijven met behulp van een voorwerp'."],"answer":2,"explanation":"De hoekduik heet nu 'hoofdwaarts richting bodem gaan'; 'verticaal drijven met behulp van een voorwerp' vervangt de HELP-houding. De combinaties kopsprong–duiken en hurksprong–sprong waarbij het hoofd boven water blijft zijn wel juist. Bijlage 1","ref":"Bijlage 1","tests":"hoekduik → hoofdwaarts richting bodem gaan (normering losgelaten)","source":{"page":"Bijlage 1","quote":"wordt de term ‘hoofdwaarts richting bodem gaan’ gebruikt waar voorheen de technische benaming ‘hoekduik’ werd gehanteerd"}},{"id":"AB-0109","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-08"],"question":"Met welk doel is de Licentie Zwem-ABC in 2014 geïntroduceerd?","options":["Werken aan voortdurende kwaliteitsverbetering voor zwemlessen en diplomazwemmen","De uitgifte van de Nationale Zwemdiploma's overnemen van de overheid","Zwemlesaanbieders eigen maatwerk examenprogramma's laten ontwikkelen"],"answer":0,"explanation":"De Licentie Zwem-ABC is in 2014 geïntroduceerd om te werken aan voortdurende kwaliteitsverbetering voor zwemlessen en diplomazwemmen. De uitgifte van de diploma's is al in 1984 door de overheid overgedragen, en maatwerk examenprogramma's zijn pas met de Examenregeling van 2018 mogelijk geworden. Bijlage 1","ref":"Bijlage 1","tests":"Licentie Zwem-ABC 2014 (sinds 2018 Licentie Nationale Zwemdiploma's)","source":{"page":"Bijlage 1","quote":"De Licentie Zwem-ABC is in 2014 geïntroduceerd met als doel te werken aan voortdurende kwaliteitsverbetering"}},{"id":"AB-0110","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-08","AB-DEF-09"],"question":"Welke bewering over de Licentie Nationale Zwemdiploma's is NIET juist?","options":["Ze geeft zwemlesaanbieders het recht tot gebruik van de Nationale Zwemdiploma's.","Ze heette tot 1 januari 2018 de Licentie Zwem-ABC.","Ze is in 1984 door de overheid ingevoerd."],"answer":2,"explanation":"De Licentie is in 2014 geïntroduceerd als Licentie Zwem-ABC; in 1984 droeg de overheid alleen de uitgifte van de Nationale Zwemdiploma's over aan de voorganger van de Nationale Raad Zwemveiligheid. Dat de Licentie het recht geeft om de diploma's te gebruiken en dat ze tot 2018 Licentie Zwem-ABC heette, klopt wel. Bijlage 1","ref":"Bijlage 1","tests":"Licentie: recht tot gebruik Nationale Zwemdiploma's","source":{"page":"Bijlage 1","quote":"De Licentie Zwem-ABC is in 2014 geïntroduceerd"}},{"id":"AB-0111","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-10"],"question":"In welke proef zijn alle onderdelen ondergebracht die gekleed worden uitgevoerd?","options":["In de proef Survival","In de proef Onder water oriëntatie","In de proef Conditiezwemmen"],"answer":0,"explanation":"Alle onderdelen die gekleed worden uitgevoerd, zijn ondergebracht in de proef Survival. Onder water oriëntatie en conditiezwemmen zijn andere proeven, zonder gekleed uitgevoerde onderdelen. Bijlage 1","ref":"Bijlage 1","tests":"gekleed uitgevoerde onderdelen in proef Survival","source":{"page":"Bijlage 1","quote":"Alle onderdelen die gekleed worden uitgevoerd, zijn ondergebracht in de proef Survival"}},{"id":"AB-0112","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-11","AB-DEF-10","AB-DEF-12"],"question":"Welke bewering over proeven en onderdelen is NIET juist?","options":["Alle gekleed uitgevoerde onderdelen zijn ondergebracht in de proef Survival.","Een proef is opgebouwd uit losse onderdelen die apart zijn genormeerd.","Het standaard examenprogramma voor Zwemdiploma C bevat zes proeven."],"answer":2,"explanation":"Het standaard examenprogramma voor Zwemdiploma C bevat vijf proeven; zes proeven geldt voor Zwemdiploma A en B. Dat alle gekleed uitgevoerde onderdelen in de proef Survival zitten en dat een proef uit losse, apart genormeerde onderdelen bestaat, is wel juist. Bijlage 1","ref":"Bijlage 1","tests":"aantal proeven: zes (A, B), vijf (C)","source":{"page":"Bijlage 1","quote":"zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen"}},{"id":"AB-0113","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-11"],"question":"Hoeveel proeven bevat het standaard examenprogramma voor Zwemdiploma A, B en C?","options":["Zes voor A en B, vijf voor C","Vijf voor A en B, zes voor C","Zes voor A, B en C"],"answer":0,"explanation":"In het standaard examenprogramma zijn zes proeven opgenomen voor Zwemdiploma A en B, en vijf voor Zwemdiploma C. Het is dus niet andersom, en C heeft niet hetzelfde aantal als A en B. Bijlage 1","ref":"Bijlage 1","tests":"aantal proeven: zes (A, B), vijf (C)","source":{"page":"Bijlage 1","quote":"zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen"}},{"id":"AB-0114","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-13"],"question":"Welke bewering over de keuze van het examenprogramma sinds 1 januari 2018 is NIET juist?","options":["Een Licentiehouder kan het standaard examenprogramma uitvoeren.","Een Licentiehouder kan een zelf ontworpen maatwerk examenprogramma uitvoeren.","Een Licentiehouder mag een maatwerk examenprogramma zonder goedkeuring gebruiken."],"answer":2,"explanation":"Een maatwerk examenprogramma mag pas worden toegepast als het vooraf ter goedkeuring is voorgelegd aan de Nationale Raad Zwemveiligheid. Dat een Licentiehouder sinds 1 januari 2018 kan kiezen tussen het standaard examenprogramma en een zelf ontworpen maatwerk examenprogramma, is wel juist. Aanleiding, p. 4 en Bijlage 1","ref":"Aanleiding, p. 4 en Bijlage 1","tests":"keuze: standaard óf maatwerk examenprogramma (sinds 2018)","source":{"page":4,"quote":"Een zwemlesaanbieder kan een maatwerk examenprogramma toepassen als deze vooraf ter goedkeuring is voorgelegd"}},{"id":"AB-0115","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-13"],"question":"Welke keuze heeft een Licentiehouder sinds 1 januari 2018 voor het examenprogramma van het Zwem-ABC?","options":["Het standaard examenprogramma of een zelf ontworpen maatwerk examenprogramma","Alleen het standaard examenprogramma, in een vastgestelde volgorde van proeven","Alleen een maatwerk examenprogramma dat door de regioadviseur is ontworpen"],"answer":0,"explanation":"Sinds 1 januari 2018 kan een Licentiehouder óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uitvoeren. Het standaard examenprogramma is dus niet de enige mogelijkheid, en een maatwerk examenprogramma ontwerpt de Licentiehouder zelf, niet de regioadviseur. Bijlage 1","ref":"Bijlage 1","tests":"keuze: standaard óf maatwerk examenprogramma (sinds 2018)","source":{"page":"Bijlage 1","quote":"óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uit te voeren"}},{"id":"AB-0116","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-14"],"question":"Welke term gebruikt de Examenregeling waar voorheen de 'HELP-houding' (Heat Escape Lessening Posture) werd gehanteerd?","options":["Verticaal drijven met behulp van een voorwerp","Hoofdwaarts richting bodem gaan","Een sprong waarbij het hoofd boven water blijft"],"answer":0,"explanation":"'Verticaal drijven met behulp van een voorwerp' vervangt de HELP-houding. 'Hoofdwaarts richting bodem gaan' vervangt de hoekduik, en 'een sprong waarbij het hoofd boven water blijft' de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"HELP-houding → verticaal drijven met behulp van een voorwerp","source":{"page":"Bijlage 1","quote":"een voorwerp’ gebruikt waar voorheen de term ‘HELP-houding’ werd gehanteerd"}},{"id":"AB-0117","category":"algemene_bepalingen","subtopic":"definities","type":"verschil","objectives":["AB-DEF-14","AB-DEF-07"],"question":"Waarom is de term 'HELP-houding' vervangen door 'verticaal drijven met behulp van een voorwerp'?","options":["Omdat de afkorting onbekend is en tot verwarring kan leiden","Omdat de strakke technische normering is losgelaten","Omdat Reddingsbrigade Nederland de houding niet meer hanteert"],"answer":0,"explanation":"De term is versimpeld omdat de afkorting HELP onbekend is en tot verwarring kan leiden. Het loslaten van de strakke technische normering is de reden bij de hoekduik, en Reddingsbrigade Nederland wordt genoemd bij de hurksprong. Bijlage 1","ref":"Bijlage 1","tests":"HELP-houding vervangen: afkorting onbekend, verwarrend","source":{"page":"Bijlage 1","quote":"omdat de afkorting onbekend is en tot verwarring kan leiden"}},{"id":"AB-0118","category":"algemene_bepalingen","subtopic":"definities","type":"onjuist","objectives":["AB-DEF-15","AB-DEF-06"],"question":"Welke bewering over begrippen uit Bijlage 1 is NIET juist?","options":["Basiselementen zijn categorieën van vaardigheden.","De termen 'examens' en 'diplomazwemmen' worden door elkaar gebruikt.","Een basiselement is een proef die uit losse onderdelen bestaat."],"answer":2,"explanation":"Basiselementen zijn categorieën van vaardigheden, geen proeven; onderdelen kunnen rond basiselementen worden geordend, terwijl een proef is opgebouwd uit losse onderdelen. Dat 'examens' en 'diplomazwemmen' door elkaar worden gebruikt, klopt wel. Bijlage 1","ref":"Bijlage 1","tests":"basiselementen = categorieën van vaardigheden","source":{"page":"Bijlage 1","quote":"Basiselementen zijn categorieën van vaardigheden"}},{"id":"AB-0119","category":"algemene_bepalingen","subtopic":"definities","type":"kennis","objectives":["AB-DEF-16"],"question":"Wat was tot 1 januari 2018 de naam van de stichting die nu Nationale Raad Zwemveiligheid heet?","options":["Nationaal Platform Zwembaden | NRZ","NL Zwemveilig","Reddingsbrigade Nederland"],"answer":0,"explanation":"Stichting Nationale Raad Zwemveiligheid is sinds 1 januari 2018 de nieuwe naam voor de stichting Nationaal Platform Zwembaden | NRZ. NL Zwemveilig is een project dat de Nationale Raad Zwemveiligheid coördineert, en Reddingsbrigade Nederland is een andere organisatie. Bijlage 1","ref":"Bijlage 1","tests":"Nationaal Platform Zwembaden | NRZ → Nationale Raad Zwemveiligheid","source":{"page":"Bijlage 1","quote":"de stichting Nationaal Platform Zwembaden | NRZ"}},{"id":"TV-0001","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"verschil","objectives":["TV-LIC-01","TV-LIC-02","TV-EXT-01"],"question":"Hoe is de kwaliteitsborging van het diplomazwemmen verdeeld?","options":["Interne kwaliteitsborging ligt bij de Licentiehouder; externe kwaliteitsborging bij gedelegeerden en medewerkers namens de Nationale Raad Zwemveiligheid.","Interne kwaliteitsborging ligt bij de gedelegeerde; externe kwaliteitsborging bij de Licentiehouder en zijn Examinator.","Interne kwaliteitsborging ligt bij de medewerker van de Nationale Raad Zwemveiligheid; externe kwaliteitsborging bij de gedelegeerde."],"answer":0,"explanation":"Het diplomazwemmen kent interne en externe kwaliteitsborging. De Licentiehouder is verantwoordelijk voor de interne kwaliteit; de externe kwaliteitsborging is toezicht door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid. De andere twee opties verwisselen de rollen: gedelegeerde en medewerker horen allebei bij het externe toezicht. §3, p. 37","ref":"§3, p. 37","tests":"interne vs externe kwaliteitsborging: wie","source":{"page":37,"quote":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen."}},{"id":"TV-0002","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-02"],"question":"Waarop heeft de interne kwaliteit van het diplomazwemmen, waarvoor de Licentiehouder verantwoordelijk is, betrekking?","options":["Op de organisatie van het diplomazwemmen en de uitvoering van de examenprogramma's","Op het steekproefsgewijs bezoeken van examens door gedelegeerden en medewerkers","Op het beoordelen van de verslagformulieren van Examinatoren en gedelegeerden"],"answer":0,"explanation":"De interne kwaliteit heeft betrekking op de organisatie van het diplomazwemmen en de uitvoering van de examenprogramma's. Steekproefsgewijs examens bezoeken hoort bij de externe kwaliteitsborging, en het beoordelen van verslagformulieren is een taak van de aangewezen medewerker van de Nationale Raad Zwemveiligheid. §3, p. 37","ref":"§3, p. 37","tests":"interne kwaliteit: organisatie en uitvoering examenprogramma's","source":{"page":37,"quote":"Dit heeft betrekking op de organisatie van het diplomazwemmen en de uitvoering van de examenprogramma’s"}},{"id":"TV-0003","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-02"],"question":"Wie stelt voor de interne kwaliteit van het diplomazwemmen een Examinator Nationale Zwemdiploma's aan?","options":["De Licentiehouder Nationale Zwemdiploma's","De Nationale Raad Zwemveiligheid","De aangewezen medewerker van het werkgebied"],"answer":0,"explanation":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit en stelt hiervoor een Examinator Nationale Zwemdiploma's aan. De Nationale Raad Zwemveiligheid toetst wel de certificering van de Examinator, maar stelt hem niet aan; de aangewezen medewerker houdt extern toezicht. §3, p. 37","ref":"§3, p. 37","tests":"Licentiehouder stelt Examinator aan","source":{"page":37,"quote":"De Licentiehouder stelt hiervoor een Examinator Nationale Zwemdiploma’s aan."}},{"id":"TV-0004","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-03"],"question":"Wie mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren?","options":["Alleen Licentiehouders Nationale Zwemdiploma's","Iedere zwemlesaanbieder met een gecertificeerde Examinator","Iedere Examinator die bekend is bij de Nationale Raad Zwemveiligheid"],"answer":0,"explanation":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren. Een gecertificeerde Examinator in dienst hebben is niet genoeg, en een Examinator zelf organiseert niet: hij wordt door de Licentiehouder aangesteld of ingehuurd. §3, p. 37","ref":"§3, p. 37","tests":"alleen Licentiehouders organiseren diplomazwemmen","source":{"page":37,"quote":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma’s organiseren."}},{"id":"TV-0005","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-03"],"question":"Een zwemschool zonder Licentie Nationale Zwemdiploma's heeft een lesgever in dienst met het certificaat tot Examinator Nationale Zwemdiploma's. De zwemschool wil zelf diplomazwemmen voor Zwemdiploma A organiseren. Is dat toegestaan?","options":["Nee, alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren.","Ja, het certificaat van de Examinator is voldoende om het diplomazwemmen te mogen organiseren.","Ja, mits een gedelegeerde van de Nationale Raad Zwemveiligheid bij het diplomazwemmen aanwezig is."],"answer":0,"explanation":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren. Een gecertificeerde Examinator maakt een zwemschool nog geen Licentiehouder, en de aanwezigheid van een gedelegeerde verandert daar niets aan. §3, p. 37","ref":"§3, p. 37","tests":"alleen Licentiehouders organiseren diplomazwemmen","source":{"page":37,"quote":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma’s organiseren."}},{"id":"TV-0006","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-04"],"question":"Wat is volgens de Examenregeling een Licentiehouder Nationale Zwemdiploma's?","options":["Een natuurlijke of rechtspersoon die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid de Licentie wil gebruiken","Een natuurlijke persoon die het certificaat tot Examinator Nationale Zwemdiploma's heeft behaald","Een vrijwilliger die namens de Nationale Raad Zwemveiligheid het diplomazwemmen periodiek bezoekt"],"answer":0,"explanation":"Een Licentiehouder is een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid gebruik wil maken van de Licentie Nationale Zwemdiploma's. Het certificaat hoort bij de Examinator, en het periodiek bezoeken van het diplomazwemmen is de rol van de gedelegeerde. §3, p. 37","ref":"§3, p. 37","tests":"definitie Licentiehouder","source":{"page":37,"quote":"een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid"}},{"id":"TV-0007","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-LIC-05","TV-LIC-04","TV-LIC-08"],"question":"Welke bewering over Licentiehouders Nationale Zwemdiploma's is NIET juist?","options":["Het bestuur van een (zwem)vereniging kan Licentiehouder zijn.","Een Licentiehouder ontvangt een raamsticker die in de accommodatie getoond kan worden.","Een Licentiehouder is altijd een natuurlijke persoon, zoals de eigenaar van een zwemschool."],"answer":2,"explanation":"Een Licentiehouder kan een natuurlijke óf een rechtspersoon zijn; naast de eigenaar van een zwemschool worden ook een directie van een zwembad, een bestuur van een stichting of (zwem)vereniging en het bevoegd gezag van een school als voorbeeld genoemd. Dat een verenigingsbestuur Licentiehouder kan zijn en dat een Licentiehouder een raamsticker ontvangt, klopt allebei. §3, p. 37","ref":"§3, p. 37","tests":"voorbeelden Licentiehouders","source":{"page":37,"quote":"een bestuur van een stichting of (zwem)vereniging, bevoegd gezag van een school of de eigenaar van een zwemschool"}},{"id":"TV-0008","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-LIC-07","TV-LIC-06"],"question":"Welke bewering over de levering van zwemdiploma's aan Licentiehouders is NIET juist?","options":["Zwemdiploma's worden geleverd tegen een door het bestuur vastgestelde prijs.","De levering gebeurt conform de bepalingen uit de overeenkomst en de algemene voorwaarden.","Eenmaal geleverde zwemdiploma's kan de Nationale Raad Zwemveiligheid nooit terugvorderen."],"answer":2,"explanation":"Houdt een Licentiehouder zich niet aan de voorwaarden, dan mag de Nationale Raad Zwemveiligheid de levering beperken of staken, en zwemdiploma's en/of zwemcertificaten terugvorderen. De prijs wordt wel door het bestuur vastgesteld en de levering verloopt volgens de overeenkomst en de algemene voorwaarden. §3, p. 37","ref":"§3, p. 37","tests":"NRZ mag levering beperken/staken/terugvorderen","source":{"page":37,"quote":"levering aan een Licentiehouder Nationale Zwemdiploma’s te beperken, te staken, dan wel zwemdiploma's en/of zwemcertificaten terug te vorderen"}},{"id":"TV-0009","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-06"],"question":"Tegen welke prijs stelt de Nationale Raad Zwemveiligheid zwemdiploma's en zwemcertificaten ter beschikking aan Licentiehouders?","options":["Tegen een door het bestuur vastgestelde prijs","Tegen een prijs die de medewerker per werkgebied vaststelt","Tegen een prijs die de Licentiehouder per aanvraag afspreekt"],"answer":0,"explanation":"De Nationale Raad Zwemveiligheid levert zwemdiploma's en zwemcertificaten tegen een door het bestuur vastgestelde prijs. De aangewezen medewerker is aanspreekpunt in zijn werkgebied maar stelt geen prijzen vast, en de prijs wordt niet per aanvraag onderhandeld. §3, p. 37","ref":"§3, p. 37","tests":"prijs zwemdiploma's vastgesteld door bestuur","source":{"page":37,"quote":"tegen een door het bestuur vastgestelde prijs"}},{"id":"TV-0010","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-08"],"question":"Waar vermeldt de Nationale Raad Zwemveiligheid een actueel overzicht van alle Licentiehouders Nationale Zwemdiploma's?","options":["Op de website www.allesoverzwemles.nl","Op www.nrz-nl.nl, achter de button 'Mijn NRZ'","In het Handboek Licentie Nationale Zwemdiploma's"],"answer":0,"explanation":"Het actuele overzicht van alle Licentiehouders staat op www.allesoverzwemles.nl. Via 'Mijn NRZ' op www.nrz-nl.nl worden onder meer het diplomazwemmen en de zwemdiploma's aangevraagd, en de Examenregeling noemt het Handboek Licentie niet als vindplaats van dit overzicht. §3, p. 37","ref":"§3, p. 37","tests":"overzicht Licentiehouders op allesoverzwemles.nl","source":{"page":37,"quote":"vermeldt op de website www.allesoverzwemles.nl een actueel overzicht"}},{"id":"TV-0011","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-09"],"question":"Wat is het gevolg als de Licentie van een Licentiehouder is ingetrokken?","options":["Hij mag geen Nationale Zwemdiploma's meer aanvragen en uitgeven en geen diplomazwemmen meer organiseren.","Hij mag nog wel diplomazwemmen organiseren, maar alleen onder toezicht van een gedelegeerde.","Hij mag nog wel al geleverde Nationale Zwemdiploma's uitgeven, maar geen nieuwe meer aanvragen."],"answer":0,"explanation":"Na het (tijdelijk of permanent) intrekken van de Licentie is het niet meer toegestaan Nationale Zwemdiploma's aan te vragen en uit te geven en diplomazwemmen te organiseren. Organiseren onder toezicht is dus niet mogelijk, en ook het uitgeven van zwemdiploma's is niet meer toegestaan. §3, p. 37","ref":"§3, p. 37","tests":"gevolg intrekken Licentie","source":{"page":37,"quote":"Het is dan niet meer toegestaan om Nationale Zwemdiploma's aan te vragen en uit te geven"}},{"id":"TV-0012","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-LIC-09","TV-LIC-03"],"question":"Welke bewering over de Licentiehouder en het intrekken van de Licentie is NIET juist?","options":["De Licentie kan tijdelijk of permanent worden ingetrokken.","Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren.","Na intrekking mag de Licentiehouder al aangevraagde zwemdiploma's nog wel uitgeven."],"answer":2,"explanation":"Na intrekking van de Licentie is het niet meer toegestaan Nationale Zwemdiploma's aan te vragen en uit te geven, en ook niet om diplomazwemmen te organiseren. Dat de Licentie tijdelijk of permanent kan worden ingetrokken en dat alleen Licentiehouders diplomazwemmen mogen organiseren, klopt. §3, p. 37","ref":"§3, p. 37","tests":"gevolg intrekken Licentie","source":{"page":37,"quote":"Het is dan niet meer toegestaan om Nationale Zwemdiploma's aan te vragen en uit te geven"}},{"id":"TV-0013","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"casus","objectives":["TV-EXT-15","TV-LIC-09"],"question":"Uit het toezicht blijkt dat een Licentiehouder zich niet aan de Examenregeling houdt. De afspraken uit het verbetertraject worden niet nagekomen en de verbetering blijft uit. Wat kan er gebeuren?","options":["De directeur kan besluiten tot het (tijdelijk) intrekken van de Licentie; dit wordt schriftelijk gecommuniceerd.","De gedelegeerde kan bij het volgende diplomazwemmen de Licentie ter plekke mondeling intrekken.","De Examinator kan besluiten de Licentie tijdelijk in te trekken tot de verbetering is bereikt."],"answer":0,"explanation":"Als verbeterafspraken niet worden nagekomen en de verbetering uitblijft, kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie, en dat besluit wordt schriftelijk gecommuniceerd. Een gedelegeerde observeert, bespreekt en rapporteert, en de Examinator valt zelf onder de Licentiehouder; geen van hen trekt de Licentie in. §3.2, p. 43","ref":"§3.2, p. 43","tests":"directeur besluit tot intrekken Licentie","source":{"page":43,"quote":"kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie"}},{"id":"TV-0014","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"verschil","objectives":["TV-LIC-10"],"question":"Wie draagt zorg voor de beschikbaarheid van een bassin dat voldoet aan de voorschriften en voor de aanwezigheid van de juiste materialen?","options":["De Licentiehouder","De gedelegeerde","De aangewezen medewerker"],"answer":0,"explanation":"De Licentiehouder draagt zorg voor een bassin dat aan de voorschriften voldoet en voor de juiste materialen zoals omschreven in de Examenregeling. De gedelegeerde en de aangewezen medewerker houden namens de Nationale Raad Zwemveiligheid extern toezicht en regelen geen accommodatie of materialen. §3.1, p. 40","ref":"§3.1, p. 40","tests":"Licentiehouder zorgt voor bassin en materialen","source":{"page":40,"quote":"De Licentiehouder draagt zorg voor de beschikbaarheid van een bassin dat voldoet aan de voorschriften"}},{"id":"TV-0015","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"verschil","objectives":["TV-LIC-11","TV-LIC-14"],"question":"Wie betaalt de reiskosten van de Examinator, en wie normaal de vrijwilligersvergoeding en reiskosten van de gedelegeerde?","options":["Examinator: de Licentiehouder; gedelegeerde: de Nationale Raad Zwemveiligheid, behalve bij te late annulering","Examinator: de Nationale Raad Zwemveiligheid; gedelegeerde: de Licentiehouder, ook als er niet wordt geannuleerd","Examinator en gedelegeerde: allebei altijd de Nationale Raad Zwemveiligheid, ook bij te late annulering"],"answer":0,"explanation":"Honorering, reis- en verblijfkosten van de Examinator zijn voor rekening van de Licentiehouder. De vrijwilligersvergoeding en reiskosten van de gedelegeerde zijn kosten die de Nationale Raad Zwemveiligheid vergoedt; alleen als een annulering niet binnen 24 uur van tevoren wordt gemeld, worden ze volledig bij de Licentiehouder in rekening gebracht. §3.1, p. 40","ref":"§3.1, p. 40","tests":"kosten Examinator vs gedelegeerde","source":{"page":40,"quote":"worden de door de Nationale Raad Zwemveiligheid te vergoeden kosten (vrijwilligersvergoeding en reiskosten) aan de gedelegeerde"}},{"id":"TV-0016","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-11","TV-EXA-02"],"question":"Een Licentiehouder kan vanuit de eigen organisatie geen Examinator inzetten en huurt er een in. De Examinator moet ver reizen en blijft een nacht in de buurt. Voor wiens rekening komen deze reis- en verblijfkosten?","options":["Voor de Licentiehouder, want de kosten van het diplomazwemmen zijn voor zijn rekening.","Voor de Nationale Raad Zwemveiligheid, want de Examinator is haar aanspreekpunt.","Voor de Examinator zelf, want een ingehuurde Examinator draagt zijn eigen kosten."],"answer":0,"explanation":"De kosten van het diplomazwemmen, zoals honorering en reis- en verblijfkosten van de Examinator, de zwemdiploma's, de huur van het zwembad en administratiekosten, zijn voor rekening van de Licentiehouder. Dat de Examinator aanspreekpunt is voor de Nationale Raad Zwemveiligheid maakt de Nationale Raad Zwemveiligheid niet tot betaler, en een ingehuurde Examinator betaalt zijn kosten niet zelf. §3.1, p. 40","ref":"§3.1, p. 40","tests":"kosten diplomazwemmen voor Licentiehouder","source":{"page":40,"quote":"De kosten van het diplomazwemmen, zoals onder andere eventuele honorering, reis- en verblijfkosten van de Examinator Nationale Zwemdiploma’s, de kosten van zwemdiploma's, de huur van het zwembad en de administratiekosten zijn voor rekening van de Licentiehouder."}},{"id":"TV-0017","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-LIC-14","TV-LIC-11"],"question":"Welke bewering over de kosten van het diplomazwemmen is NIET juist?","options":["De huur van het zwembad is voor rekening van de Licentiehouder.","De administratiekosten zijn voor rekening van de Licentiehouder.","Bij een te late annulering betaalt de Examinator de reiskosten van de gedelegeerde."],"answer":2,"explanation":"Wordt een annulering niet binnen 24 uur van tevoren gemeld, dan worden de vrijwilligersvergoeding en reiskosten van de gedelegeerde volledig bij de Licentiehouder in rekening gebracht, niet bij de Examinator. De huur van het zwembad en de administratiekosten zijn inderdaad voor rekening van de Licentiehouder. §3.1, p. 40","ref":"§3.1, p. 40","tests":"late annulering: kosten gedelegeerde bij Licentiehouder","source":{"page":40,"quote":"aan de gedelegeerde volledig in rekening gebracht bij de Licentiehouder"}},{"id":"TV-0018","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"kennis","objectives":["TV-LIC-12"],"question":"Waar blijven de ingevulde beoordelingslijsten na het diplomazwemmen?","options":["Ter documentatie (archiefplicht) bij de Licentiehouder","Bij de Nationale Raad Zwemveiligheid, binnen 7 dagen opgestuurd","Bij de gedelegeerde, als bijlage bij zijn verslag"],"answer":0,"explanation":"De ingevulde beoordelingslijsten blijven ter documentatie bij de Licentiehouder: hij heeft een archiefplicht. Binnen 7 dagen naar de Nationale Raad Zwemveiligheid gaan de verslagen en feedbackformulieren, niet de lijsten; de gedelegeerde maakt zelf een verslag. §3.1, p. 40","ref":"§3.1, p. 40","tests":"archiefplicht beoordelingslijsten bij Licentiehouder","source":{"page":40,"quote":"De ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder."}},{"id":"TV-0019","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-12"],"question":"Een Licentiehouder wil bij het diplomazwemmen een zelf ontwikkelde beoordelingslijst gebruiken. Mag dat?","options":["Ja, de Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken.","Nee, alleen beoordelingslijsten van de Nationale Raad Zwemveiligheid mogen worden gebruikt.","Alleen als de gedelegeerde de lijst vooraf in de voorbespreking goedkeurt."],"answer":0,"explanation":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken; de ingevulde lijsten blijven ter documentatie bij hem. Een eigen lijst is dus toegestaan, en de gedelegeerde hoeft de lijst niet goed te keuren: hij observeert juist met de lijsten die de examinator aanlevert. §3.1, p. 40","ref":"§3.1, p. 40","tests":"Licentiehouder mag eigen beoordelingslijst ontwikkelen","source":{"page":40,"quote":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken."}},{"id":"TV-0020","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"onjuist","objectives":["TV-EXA-13","TV-LIC-10","TV-LIC-12"],"question":"Welke bewering over de Licentiehouder is NIET juist?","options":["Hij draagt zorg voor een bassin dat voldoet aan de voorschriften.","Hij kan zelf een beoordelingslijst ontwikkelen en gebruiken.","Hij bepaalt na afstemming met de gedelegeerde de uitslag."],"answer":2,"explanation":"De uitslag wordt bepaald door de Examinator, na afstemming met een eventueel aanwezige medewerker of gedelegeerde, niet door de Licentiehouder. Zorgen voor een geschikt bassin en zelf een beoordelingslijst ontwikkelen horen wel bij de Licentiehouder. §3.1, p. 39–40","ref":"§3.1, p. 39–40","tests":"Examinator bepaalt uitslag na afstemming","source":{"page":39,"quote":"bepaalt de uitslag conform de Examenregeling Nationale Zwemdiploma's na afstemming met een eventueel aanwezige medewerker"}},{"id":"TV-0021","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-13"],"question":"Twee dagen voor het diplomazwemmen wil de Licentiehouder de ingediende aanvraag nog wijzigen. Kan dat?","options":["Ja, met de inlogcodes kan hij tot 24 uur voor het diplomazwemmen de aanvraag bekijken en wijzigen.","Nee, na het indienen kan de aanvraag niet meer worden gewijzigd, omdat die 21 dagen vooraf moest.","Nee, wijzigen kan alleen tot 7 dagen voor het diplomazwemmen, via de aangewezen medewerker."],"answer":0,"explanation":"De Licentiehouder kan met de inlogcodes tot 24 uur voor het diplomazwemmen de status van de aanvraag bekijken en indien gewenst wijzigen; twee dagen vooraf kan dat dus nog. De 21 dagen gelden voor het aanmelden zelf, en een termijn van 7 dagen hoort bij het insturen van verslagen. §3.1, p. 40","ref":"§3.1, p. 40","tests":"aanvraag bekijken/wijzigen tot 24 uur","source":{"page":40,"quote":"de mogelijkheid om tot 24 uur voor het diplomazwemmen de status van de aanvraag te bekijken en indien gewenst te wijzigen"}},{"id":"TV-0022","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","type":"casus","objectives":["TV-LIC-14"],"question":"Een Licentiehouder annuleert het diplomazwemmen 12 uur voor aanvang. Er was een gedelegeerde ingepland. Wat is het gevolg?","options":["De vrijwilligersvergoeding en reiskosten van de gedelegeerde worden volledig bij de Licentiehouder in rekening gebracht.","Er worden geen kosten in rekening gebracht, omdat de gedelegeerde pas uiterlijk 24 uur vooraf zichtbaar wordt.","De vrijwilligersvergoeding en reiskosten van de gedelegeerde worden bij de Examinator in rekening gebracht."],"answer":0,"explanation":"Een annulering die niet binnen 24 uur van tevoren wordt gemeld, leidt ertoe dat de te vergoeden kosten van de gedelegeerde (vrijwilligersvergoeding en reiskosten) volledig bij de Licentiehouder in rekening worden gebracht. Dat de gedelegeerde uiterlijk 24 uur vooraf zichtbaar wordt, ontslaat de Licentiehouder daar niet van, en de kosten gaan niet naar de Examinator. §3.1, p. 40","ref":"§3.1, p. 40","tests":"late annulering: kosten gedelegeerde bij Licentiehouder","source":{"page":40,"quote":"aan de gedelegeerde volledig in rekening gebracht bij de Licentiehouder"}},{"id":"TV-0023","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-02","TV-EXA-01"],"question":"Welke bewering over de Examinator Nationale Zwemdiploma's is NIET juist?","options":["Hij moet bekend zijn bij de Nationale Raad Zwemveiligheid.","Hij moet het certificaat tot Examinator Nationale Zwemdiploma's bezitten.","Hij moet altijd in dienst zijn van de Licentiehouder voor wie hij examineert."],"answer":2,"explanation":"Een Licentiehouder die vanuit de eigen organisatie geen Examinator kan inzetten, mag er een inhuren; de Examinator hoeft dus niet in dienst te zijn. Bekend zijn bij de Nationale Raad Zwemveiligheid en het certificaat tot Examinator bezitten zijn wel vereist. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator: bekend bij NRZ, certificaat, inhuren mag","source":{"page":38,"quote":"Indien een Licentiehouder niet in staat is vanuit de eigen organisatie een Examinator Nationale Zwemdiploma’s in te zetten, kan hij ervoor kiezen deze in te huren."}},{"id":"TV-0024","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-02"],"question":"Een zwemvereniging met Licentie heeft niemand in de eigen organisatie die als Examinator kan worden ingezet. Wat is volgens de Examenregeling mogelijk?","options":["Een Examinator inhuren, die dan verantwoordelijk is voor de kwaliteitsborging van de vereniging.","De gedelegeerde vragen om tijdens het diplomazwemmen de rol van Examinator over te nemen.","Het diplomazwemmen zonder Examinator houden, onder toezicht van een aangewezen medewerker."],"answer":0,"explanation":"Een Licentiehouder die zelf geen Examinator kan inzetten, kan er een inhuren; die Examinator is dan verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem inhuurt. De gedelegeerde observeert, bespreekt en rapporteert en neemt de Examinatorrol niet over, en zonder Examinator kan het diplomazwemmen niet plaatsvinden. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator inhuren","source":{"page":38,"quote":"Deze Examinator is op dat moment verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem/haar inhuurt."}},{"id":"TV-0025","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-04","TV-EXA-03","TV-EXA-01"],"question":"Welke bewering over Examinatoren bij een Licentiehouder is NIET juist?","options":["Een Licentiehouder mag over meerdere Examinatoren Nationale Zwemdiploma's beschikken.","De certificering van de Examinator wordt getoetst door de Nationale Raad Zwemveiligheid.","Per aanvraag van diplomazwemmen kunnen meerdere Examinatoren samen eindverantwoordelijk zijn."],"answer":2,"explanation":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk; die is de beslisser. Een Licentiehouder mag wel over meerdere Examinatoren beschikken, en de certificering wordt door de Nationale Raad Zwemveiligheid getoetst. §3.1, p. 38","ref":"§3.1, p. 38","tests":"één eindverantwoordelijke Examinator per aanvraag","source":{"page":38,"quote":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk."}},{"id":"TV-0026","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-04","TV-EXA-03"],"question":"Bij één aangevraagd diplomazwemmen zijn drie gecertificeerde Examinatoren van dezelfde Licentiehouder aanwezig. Ze verschillen van mening over de uitslag van een kandidaat. Wie beslist?","options":["De ene Examinator die voor deze aanvraag (eind)verantwoordelijk is","De drie Examinatoren samen, bij meerderheid van stemmen","De Licentiehouder, omdat hij de interne kwaliteit bewaakt"],"answer":0,"explanation":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk, en die is de beslisser. Meerdere Examinatoren mogen meewerken, maar beslissen niet bij meerderheid, en de Licentiehouder stelt de Examinator aan maar bepaalt de uitslag niet zelf. §3.1, p. 38","ref":"§3.1, p. 38","tests":"één eindverantwoordelijke Examinator per aanvraag","source":{"page":38,"quote":"Deze Examinator Nationale Zwemdiploma’s is degene die de beslisser is"}},{"id":"TV-0027","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-05"],"question":"Wat is het enige dat de Examinator Nationale Zwemdiploma's niet mag delegeren?","options":["Zijn eigen aanwezigheid bij het diplomazwemmen","De ondertekening van de zwemdiploma's","Het aanvragen van het diplomazwemmen"],"answer":0,"explanation":"De Examinator mag taken aan collega's delegeren zolang de kwaliteit gewaarborgd blijft; het enige wat hij niet mag delegeren is zijn aanwezigheid bij het diplomazwemmen waarvoor hij verantwoordelijk is. De ondertekening mag hij uitdrukkelijk delegeren, en het aanvragen is een gewone taak die ook gedelegeerd kan worden. §3.1, p. 38","ref":"§3.1, p. 38","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"Het enige dat hij/zij niet mag delegeren, is de aanwezigheid bij het diplomazwemmen"}},{"id":"TV-0028","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-05"],"question":"Een Examinator is eindverantwoordelijk voor een diplomazwemmen, maar heeft die dag een andere afspraak. Hij wil een ervaren collega het hele diplomazwemmen laten leiden en zelf wegblijven. Is dat toegestaan?","options":["Nee, zijn aanwezigheid bij het diplomazwemmen mag hij niet delegeren.","Ja, taken mogen worden gedelegeerd zolang de kwaliteit gewaarborgd blijft.","Ja, mits de collega na afloop zelf binnen 7 dagen het verslag indient."],"answer":0,"explanation":"De Examinator mag taken delegeren aan collega's mits de kwaliteit gewaarborgd blijft, maar hij moet zelf aanwezig zijn bij het diplomazwemmen waarvoor hij verantwoordelijk is. De algemene delegatieregel geldt dus niet voor zijn aanwezigheid, en een verslag van de collega verandert daar niets aan. §3.1, p. 38","ref":"§3.1, p. 38","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"De Examinator dient zelf wel aanwezig te zijn bij het diplomazwemmen."}},{"id":"TV-0029","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-15","TV-EXA-05"],"question":"Na afloop van het diplomazwemmen moeten veertig zwemdiploma's worden ondertekend. De Examinator vraagt een collega dit voor hem te doen. Mag dat?","options":["Ja, de Examinator mag de ondertekening zelf doen, maar kan deze taak ook delegeren.","Nee, de ondertekening moet altijd door de Examinator persoonlijk gebeuren.","Nee, de zwemdiploma's worden uitsluitend door de gedelegeerde ondertekend."],"answer":0,"explanation":"De Examinator is namens de Licentiehouder verantwoordelijk voor de ondertekening van de diploma's; hij mag dit zelf doen, maar kan deze taak ook delegeren. Persoonlijke ondertekening is dus niet verplicht, en de gedelegeerde ondertekent de diploma's niet. §3.1, p. 39","ref":"§3.1, p. 39","tests":"ondertekening diploma's delegeerbaar","source":{"page":39,"quote":"de Examinator mag dit zelf doen, maar kan deze taak ook delegeren"}},{"id":"TV-0030","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-05","TV-EXA-15"],"question":"Welke bewering over delegeren door de Examinator is NIET juist?","options":["Hij mag taken delegeren aan collega's, mits de kwaliteit gewaarborgd blijft.","Hij mag de ondertekening van de zwemdiploma's aan een collega delegeren.","Hij mag zijn aanwezigheid delegeren als er een collega-Examinator aanwezig is."],"answer":2,"explanation":"De aanwezigheid bij het diplomazwemmen waarvoor hij verantwoordelijk is, is het enige wat de Examinator niet mag delegeren, ook niet aan een andere Examinator. Taken delegeren met behoud van kwaliteit en het delegeren van de ondertekening zijn wel toegestaan. §3.1, p. 38–39","ref":"§3.1, p. 38–39","tests":"aanwezigheid Examinator niet delegeerbaar","source":{"page":38,"quote":"Het enige dat hij/zij niet mag delegeren, is de aanwezigheid bij het diplomazwemmen"}},{"id":"TV-0031","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-06","TV-EXT-07"],"question":"Wat is het verschil in de rol van aanspreekpunt tussen de Examinator en de aangewezen medewerker van de Nationale Raad Zwemveiligheid?","options":["De Examinator is aanspreekpunt voor de Nationale Raad Zwemveiligheid; de medewerker is aanspreekpunt voor Licentiehouders en gedelegeerden.","De medewerker is aanspreekpunt voor de Nationale Raad Zwemveiligheid; de Examinator is aanspreekpunt voor Licentiehouders en gedelegeerden.","De Examinator is aanspreekpunt voor de gedelegeerden; de medewerker is aanspreekpunt voor de ouders/verzorgers van kandidaten."],"answer":0,"explanation":"De Examinator is voor zijn diplomazwemmen het aanspreekpunt voor de Nationale Raad Zwemveiligheid voor de kwaliteit. De aangewezen medewerkers zijn het aanspreekpunt voor Licentiehouders en gedelegeerden in hun eigen werkgebied. De tweede optie draait dit om, en de derde noemt een rol voor ouders/verzorgers die de Examenregeling niet aan de medewerker geeft. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"aanspreekpunt: Examinator vs medewerker","source":{"page":42,"quote":"het aanspreekpunt zijn voor Licentiehouders en gedelegeerden"}},{"id":"TV-0032","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-07"],"question":"Aan welke eisen toetst de Examinator of het diplomazwemmen kwalitatief voldoet?","options":["De Examenregeling in combinatie met het Handboek Licentie Nationale Zwemdiploma's","Het klachtenreglement in combinatie met de algemene voorwaarden","De overeenkomst met de Nationale Raad Zwemveiligheid en de verbeterafspraken"],"answer":0,"explanation":"De Examinator toetst of het diplomazwemmen kwalitatief voldoet aan de eisen van de Examenregeling Nationale Zwemdiploma's in combinatie met het Handboek Licentie Nationale Zwemdiploma's. Het klachtenreglement gaat over klachten tegen medewerkers of vrijwilligers, en overeenkomst, algemene voorwaarden en verbeterafspraken zijn zaken tussen de Licentiehouder en de Nationale Raad Zwemveiligheid. §3.1, p. 38","ref":"§3.1, p. 38","tests":"toetsing aan Examenregeling + Handboek Licentie","source":{"page":38,"quote":"toetst of het diplomazwemmen kwalitatief voldoet aan de eisen van de Examenregeling"}},{"id":"TV-0033","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-08","TV-EXT-03"],"question":"Welke combinatie van taken van de Examinator en van de gedelegeerde is juist?","options":["Examinator: observerend, signalerend en rapporterend; gedelegeerde: observeren, bespreken en rapporteren","Examinator: observeren, bespreken en rapporteren; gedelegeerde: observerend, signalerend en corrigerend","Examinator: observerend en adviserend; gedelegeerde: observeren, bezwaar maken en de uitslag bepalen"],"answer":0,"explanation":"De Examinator heeft een observerende, signalerende en rapporterende taak richting de Nationale Raad Zwemveiligheid; de gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren. Corrigerend handelen en bezwaar maken horen bij de medewerker van de Nationale Raad Zwemveiligheid, en de uitslag wordt door de Examinator bepaald. §3.1–3.2, p. 38 en 42","ref":"§3.1–3.2, p. 38 en 42","tests":"taken gedelegeerde: observeren, bespreken, rapporteren","source":{"page":42,"quote":"Een gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren."}},{"id":"TV-0034","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-08"],"question":"Welke taak heeft de Examinator Nationale Zwemdiploma's voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid?","options":["Een observerende, signalerende en rapporterende taak","Een controlerende, corrigerende en sanctionerende taak","Een adviserende taak zonder eigen beslissingsbevoegdheid"],"answer":0,"explanation":"De Examinator heeft richting de Nationale Raad Zwemveiligheid een observerende, signalerende en rapporterende taak. Corrigerend handelen is een bevoegdheid van de medewerker, en de Examinator is juist wel de beslisser, dus 'zonder eigen beslissingsbevoegdheid' klopt niet. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator: observerend, signalerend, rapporterend","source":{"page":38,"quote":"heeft een observerende, signalerende en rapporterende taak voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid"}},{"id":"TV-0035","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-09","TV-EXA-08"],"question":"Welke bewering over de rol van de Examinator is NIET juist?","options":["Hij heeft een observerende, signalerende en rapporterende taak richting de Nationale Raad Zwemveiligheid.","Hij is bij het diplomazwemmen in feite het 'gezicht' van de Nationale Raad Zwemveiligheid.","Hij koppelt de resultaten alleen terug naar de Nationale Raad Zwemveiligheid, niet naar de zwemlesaanbieder."],"answer":2,"explanation":"De Examinator koppelt de resultaten terug naar de zwemlesaanbieder die het diplomazwemmen organiseert én naar de Nationale Raad Zwemveiligheid. Dat hij een observerende, signalerende en rapporterende taak heeft en in feite het 'gezicht' van de Nationale Raad Zwemveiligheid is, klopt. §3.1, p. 38","ref":"§3.1, p. 38","tests":"terugkoppeling resultaten naar zwemlesaanbieder en NRZ","source":{"page":38,"quote":"koppelt de resultaten van het diplomazwemmen terug naar de zwemlesaanbieder die het diplomazwemmen organiseert"}},{"id":"TV-0036","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-10","TV-EXA-34"],"question":"Wie is verantwoordelijk voor het feedbackgesprek na het diplomazwemmen?","options":["De Examinator Nationale Zwemdiploma's","De gedelegeerde van de Nationale Raad Zwemveiligheid","De aangewezen medewerker van het werkgebied"],"answer":0,"explanation":"De Examinator is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid. De gedelegeerde is gesprekspartner en licht daar zijn onderbouwing toe, en de aangewezen medewerker heeft een toezichthoudende rol; geen van beiden draagt de verantwoordelijkheid voor het gesprek. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator verantwoordelijk voor feedbackgesprek","source":{"page":38,"quote":"De Examinator Nationale Zwemdiploma’s is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid"}},{"id":"TV-0037","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-11"],"question":"Wie bepaalt de volgorde van de routing en de organisatorische keuzemogelijkheden voor het gebruikmaken van circuitvormen?","options":["De Examinator, samen met collega's","De gedelegeerde, na overleg met de medewerker","De Licentiehouder, bij het indienen van de aanvraag"],"answer":0,"explanation":"De Examinator bepaalt samen met collega's de volgorde van de routing en de keuze voor circuitvormen, en stelt de volgorde van de onderdelen vast. Een aanwezige gedelegeerde bespreekt dit hooguit in de voorbespreking maar bepaalt het niet, en de Licentiehouder legt dit niet vast in de aanvraag. §3.1, p. 38","ref":"§3.1, p. 38","tests":"Examinator bepaalt routing en circuitvormen","source":{"page":38,"quote":"bepaalt samen met collega’s de volgorde van de routing, organisatorische keuzemogelijkheden voor het gebruikmaken van circuitvormen"}},{"id":"TV-0038","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-13","TV-EXT-05"],"question":"Wie bepaalt de uitslag van het diplomazwemmen als er een gedelegeerde aanwezig is?","options":["De Examinator, na afstemming met de gedelegeerde","De gedelegeerde, op basis van zijn eigen observaties","De Examinator en de gedelegeerde samen, bij gelijke stem"],"answer":0,"explanation":"De Examinator bepaalt de uitslag conform de Examenregeling, na afstemming met een eventueel aanwezige medewerker of gedelegeerde. De gedelegeerde kan vóór de uitslagbepaling kort aan de orde stellen dat diploma's ten onrechte worden uitgereikt, maar bepaalt de uitslag niet zelf en heeft ook geen gelijke stem. §3.1, p. 39","ref":"§3.1, p. 39","tests":"Examinator bepaalt uitslag na afstemming","source":{"page":39,"quote":"bepaalt de uitslag conform de Examenregeling Nationale Zwemdiploma's na afstemming met een eventueel aanwezige medewerker"}},{"id":"TV-0039","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","type":"verschil","objectives":["TV-EXA-13","TV-EXT-03","TV-EXT-11"],"question":"Welke rolverdeling tijdens het diplomazwemmen is juist?","options":["Examinator bepaalt de uitslag; gedelegeerde observeert; medewerker kan daarnaast corrigerend handelen.","Gedelegeerde bepaalt de uitslag; Examinator observeert; medewerker rapporteert alleen achteraf.","Medewerker bepaalt de uitslag; Examinator observeert; gedelegeerde kan corrigerend handelen."],"answer":0,"explanation":"De Examinator bepaalt de uitslag, de gedelegeerde observeert, bespreekt en rapporteert, en de medewerker heeft dezelfde rol als de gedelegeerde maar kan daarnaast corrigerend handelen. De gedelegeerde bepaalt de uitslag niet en kan niet corrigerend handelen, en de medewerker heeft wel directe invloed op de uitslag maar bepaalt die niet in plaats van de Examinator. §3.1–3.2, p. 39 en 43","ref":"§3.1–3.2, p. 39 en 43","tests":"rolverdeling Examinator/gedelegeerde/medewerker","source":{"page":43,"quote":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."}},{"id":"TV-0040","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-31","TV-EXA-14"],"question":"Een jeugdige kandidaat voor Zwemdiploma A wordt afgewezen. De Examinator heeft het druk met de organisatie. De eigen lesgever van het kind biedt aan het gesprek met kind en ouders te voeren. Wat is juist?","options":["Dat mag; de lesgever legt vóór de diploma-uitreiking aan kind en ouders uit waarom het kind is afgewezen.","Dat mag niet; alleen de Examinator mag de reden van de afwijzing aan de ouders uitleggen.","Dat mag; het gesprek kan ook na de diploma-uitreiking of binnen 7 dagen worden gevoerd."],"answer":0,"explanation":"De Examinator of iemand anders die bij het diplomazwemmen betrokken is, bijvoorbeeld de eigen lesgever, voert het gesprek met kind en ouder(s) en legt de reden van afwijzing uit. Dat moet voorafgaand aan de diploma-uitreiking gebeuren, dus niet erna of binnen 7 dagen. Het hoeft niet per se de Examinator te zijn. §3.1, p. 41","ref":"§3.1, p. 41","tests":"afwijzing: gesprek door Examinator of betrokkene","source":{"page":41,"quote":"De Examinator of iemand anders die bij het diplomazwemmen is betrokken (bijvoorbeeld de eigen lesgever)"}},{"id":"TV-0041","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-31"],"question":"Wanneer moet een afgewezen kandidaat volgens de Examenregeling op de hoogte worden gebracht van de afwijzing?","options":["Voorafgaand aan de diploma-uitreiking","Direct na afloop van de diploma-uitreiking","Binnen 7 dagen, samen met het verslag"],"answer":0,"explanation":"Het is vereist dat een afgewezen kandidaat voorafgaand aan de diploma-uitreiking op de hoogte wordt gebracht. Pas na de uitreiking is te laat, en de termijn van 7 dagen geldt voor het verslag van de Examinator, niet voor het informeren van de kandidaat. §3.1, p. 41","ref":"§3.1, p. 41","tests":"afgewezen kandidaat vóór uitreiking informeren","source":{"page":41,"quote":"hiervan voorafgaand aan de diploma-uitreiking op de hoogte wordt gebracht"}},{"id":"TV-0042","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-14"],"question":"Een jeugdige kandidaat moet worden afgewezen. Aan wie moet volgens de Examenregeling de reden daarvan kenbaar worden gemaakt?","options":["Aan de ouders/verzorgers van de kandidaat","Aan de medewerker, via het verslag binnen 7 dagen","Aan de Licentiehouder, via de beoordelingslijst"],"answer":0,"explanation":"Als een jeugdige kandidaat afgewezen moet worden, moet de reden kenbaar worden gemaakt aan de ouders/verzorgers van de kandidaat. Het verslag aan de Nationale Raad Zwemveiligheid gaat over de kwaliteit van het diplomazwemmen, en de beoordelingslijst blijft ter documentatie bij de Licentiehouder; geen van beide vervangt het informeren van de ouders. §3.1, p. 39","ref":"§3.1, p. 39","tests":"jeugdige kandidaat afgewezen: reden aan ouders/verzorgers","source":{"page":39,"quote":"Indien een jeugdige kandidaat afgewezen moet worden, zal de reden daarvan kenbaar gemaakt dienen te worden aan de ouders/verzorgers"}},{"id":"TV-0043","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-30","TV-EXA-14","TV-EXA-13"],"question":"Welke bewering over afwijzing tijdens het diplomazwemmen is NIET juist?","options":["De Examinator bepaalt de uitslag na afstemming met een eventueel aanwezige gedelegeerde.","Bij afwijzing van een jeugdige kandidaat wordt de reden kenbaar gemaakt aan de ouders/verzorgers.","Een kandidaat moet stoppen zodra de afwijzing tijdens het diplomazwemmen vaststaat."],"answer":2,"explanation":"De kandidaat heeft altijd het recht het diplomazwemmen af te maken, ook als de afwijzing tijdens het diplomazwemmen al een feit is. Dat de Examinator de uitslag na afstemming bepaalt en dat bij een jeugdige kandidaat de reden aan de ouders/verzorgers wordt gemeld, klopt. §3.1, p. 39 en 41","ref":"§3.1, p. 39 en 41","tests":"recht om diplomazwemmen af te maken","source":{"page":41,"quote":"De kandidaat heeft altijd het recht om het diplomazwemmen af te maken"}},{"id":"TV-0044","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-30"],"question":"Een kandidaat voor Zwemdiploma B heeft halverwege het diplomazwemmen een onderdeel drie keer onvoldoende uitgevoerd; de afwijzing staat vast. Het kind wil de overige onderdelen toch zwemmen. Wat beslist de Examinator?","options":["Het kind mag het diplomazwemmen afmaken; dat recht heeft een kandidaat altijd.","Het kind moet stoppen, zodat de routing voor de andere kandidaten doorloopt.","Het kind mag alleen verder als de gedelegeerde daar toestemming voor geeft."],"answer":0,"explanation":"De kandidaat heeft altijd het recht het diplomazwemmen af te maken, ook als de afwijzing al een feit is. De routing is geen reden om het kind te laten stoppen, en toestemming van een gedelegeerde is niet nodig. §3.1, p. 41","ref":"§3.1, p. 41","tests":"recht om diplomazwemmen af te maken","source":{"page":41,"quote":"De kandidaat heeft altijd het recht om het diplomazwemmen af te maken ook al is tijdens het diplomazwemmen de afwijzing al een feit"}},{"id":"TV-0045","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXT-08","TV-EXA-16"],"question":"Welke taak hoort NIET bij de taken van de Examinator Nationale Zwemdiploma's?","options":["Kandidaten op de beoordelingslijsten vermelden","Zwemdiploma's gereed maken","De verslagformulieren van gedelegeerden beoordelen"],"answer":2,"explanation":"Het beoordelen van de verslagformulieren van de Examinator en de gedelegeerden is een taak van de aangewezen medewerker van de Nationale Raad Zwemveiligheid. Kandidaten op de beoordelingslijsten vermelden en zwemdiploma's gereed maken staan wel op de takenlijst van de Examinator. §3.1–3.2, p. 39 en 42","ref":"§3.1–3.2, p. 39 en 42","tests":"medewerker: verslagformulieren beoordelen, aanvragen controleren","source":{"page":42,"quote":"Hij/zij beoordeelt de verslagformulieren van de Examinator Nationale Zwemdiploma’s en van de gedelegeerden."}},{"id":"TV-0046","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXT-09","TV-EXA-17"],"question":"Welke taak hoort NIET bij de taken van de Examinator rond en na het diplomazwemmen?","options":["De eventueel aanwezige medewerker of gedelegeerde ontvangen","Het diplomazwemmen rapporteren en evalueren","Diplomazwemmen van andere Licentiehouders onaangekondigd bezoeken"],"answer":2,"explanation":"Steekproefsgewijs, aangekondigd en onaangekondigd, het diplomazwemmen bezoeken is een taak van de medewerker van de Nationale Raad Zwemveiligheid. Het ontvangen van een eventueel aanwezige medewerker of gedelegeerde en het rapporteren en evalueren van het diplomazwemmen horen wel bij de Examinator. §3.1–3.2, p. 39 en 42","ref":"§3.1–3.2, p. 39 en 42","tests":"medewerker bezoekt ook onaangekondigd","source":{"page":42,"quote":"De medewerker bezoekt ook steekproefsgewijs, zowel aangekondigd als onaangekondigd, het diplomazwemmen."}},{"id":"TV-0047","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-18"],"question":"Waarvoor beschikt de Examinator over inlogcodes via de button 'Mijn NRZ' op www.nrz-nl.nl?","options":["Om het diplomazwemmen en zwemdiploma's aan te vragen","Om het verslag van de gedelegeerde aan te passen","Om de Licentie van een zwemlesaanbieder te wijzigen"],"answer":0,"explanation":"De Examinator beschikt onder andere over beoordelingsformulieren en over inlogcodes om via 'Mijn NRZ' het diplomazwemmen aan te vragen en zwemdiploma's aan te vragen via de webwinkel. Het verslag van de gedelegeerde is van de gedelegeerde zelf, en de Licentie valt niet onder de bevoegdheden van de Examinator. §3.1, p. 39","ref":"§3.1, p. 39","tests":"inlogcodes Mijn NRZ voor aanvragen","source":{"page":39,"quote":"inlogcodes om het diplomazwemmen aan te vragen via www.nrz-nl.nl"}},{"id":"TV-0048","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-19"],"question":"Welke kandidaten selecteert de Examinator voor het diplomazwemmen?","options":["Kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren","Alleen kandidaten die het lagere zwemdiploma al hebben behaald","Alle kandidaten die door hun lesgever zijn aangemeld"],"answer":0,"explanation":"De Examinator selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren zoals beschreven in de Examenregeling. Het bezit van een lager zwemdiploma is geen voorwaarde, en een aanmelding door de lesgever is zonder die zekerheid niet genoeg. §3.1, p. 39","ref":"§3.1, p. 39","tests":"selectie: met grote zekerheid","source":{"page":39,"quote":"selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren"}},{"id":"TV-0049","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-19"],"question":"Een lesgever twijfelt sterk of een kandidaat voor Zwemdiploma A alle onderdelen al beheerst, maar het kind wil graag meedoen aan het diplomazwemmen. Wat doet de Examinator?","options":["Hij selecteert het kind niet; alleen kandidaten die het programma met grote zekerheid kunnen uitvoeren, doen mee.","Hij selecteert het kind wel, omdat het elk onderdeel maximaal drie keer mag uitvoeren.","Hij selecteert het kind wel, omdat het bij afwijzing het diplomazwemmen mag afmaken."],"answer":0,"explanation":"De Examinator selecteert alleen kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren; bij sterke twijfel wordt het kind dus niet geselecteerd. De drie pogingen per onderdeel en het recht om het diplomazwemmen af te maken bestaan wel, maar zijn geen reden om een kandidaat met twijfel te selecteren. §3.1, p. 39","ref":"§3.1, p. 39","tests":"selectie: met grote zekerheid","source":{"page":39,"quote":"selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren"}},{"id":"TV-0050","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-20"],"question":"Hoe ver van tevoren meldt de Examinator het diplomazwemmen ten minste aan via de website van de Nationale Raad Zwemveiligheid?","options":["Ten minste 21 dagen van tevoren","Ten minste 7 dagen van tevoren","Ten minste 24 uur van tevoren"],"answer":0,"explanation":"De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via 'Mijn NRZ'. De 7 dagen zijn de termijn voor het verslag na afloop, en 24 uur is de grens voor het bekijken of wijzigen van de aanvraag en voor het zichtbaar worden van een gedelegeerde. §3.1, p. 39","ref":"§3.1, p. 39","tests":"aanvraag ten minste 21 dagen vooraf","source":{"page":39,"quote":"meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via www.nrz-nl.nl"}},{"id":"TV-0051","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-20"],"question":"Een Examinator wil op 1 juni diplomazwemmen houden. Hij meldt het op 20 mei aan via 'Mijn NRZ'. Wat is juist?","options":["Dat is te laat; het diplomazwemmen moet ten minste 21 dagen van tevoren worden aangemeld.","Dat kan; aanmelden mag tot 7 dagen voor het diplomazwemmen.","Dat kan; een aanvraag kan tot 24 uur van tevoren worden ingediend."],"answer":0,"explanation":"Tussen 20 mei en 1 juni zitten maar 12 dagen, terwijl het diplomazwemmen ten minste 21 dagen van tevoren moet worden aangemeld. Een termijn van 7 dagen geldt voor het verslag, en tot 24 uur vooraf kan de Licentiehouder een bestaande aanvraag bekijken en wijzigen, niet een nieuwe indienen. §3.1, p. 39","ref":"§3.1, p. 39","tests":"aanvraag ten minste 21 dagen vooraf","source":{"page":39,"quote":"meldt het diplomazwemmen ten minste 21 dagen van tevoren aan"}},{"id":"TV-0052","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-21"],"question":"Wanneer wordt na akkoord van de Nationale Raad Zwemveiligheid de eventuele aanwezigheid van een gedelegeerde zichtbaar?","options":["Uiterlijk 24 uur voorafgaand aan het examen","Uiterlijk 7 dagen voorafgaand aan het examen","Uiterlijk 21 dagen voorafgaand aan het examen"],"answer":0,"explanation":"Na het indienen van de aanvraag en akkoord door de Nationale Raad Zwemveiligheid wordt uiterlijk 24 uur voorafgaand aan het examen zichtbaar of er een gedelegeerde komt. De 21 dagen gelden voor het aanmelden en de 7 dagen voor het verslag na afloop. §3.1, p. 40","ref":"§3.1, p. 40","tests":"gedelegeerde uiterlijk 24 uur vooraf zichtbaar","source":{"page":40,"quote":"wordt uiterlijk 24 uur voorafgaande aan het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar"}},{"id":"TV-0053","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-21","TV-EXA-20","TV-LIC-13"],"question":"Welke bewering over de aanvraag van het diplomazwemmen is NIET juist?","options":["De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan.","De Licentiehouder kan tot 24 uur voor het diplomazwemmen de aanvraag wijzigen.","Of er een gedelegeerde komt, wordt pas na afloop van het diplomazwemmen bekend."],"answer":2,"explanation":"Na akkoord door de Nationale Raad Zwemveiligheid wordt uiterlijk 24 uur voorafgaand aan het examen zichtbaar of er een gedelegeerde aanwezig is, dus niet pas achteraf. Aanmelden ten minste 21 dagen vooraf en wijzigen tot 24 uur vooraf kloppen allebei. §3.1, p. 39–40","ref":"§3.1, p. 39–40","tests":"gedelegeerde uiterlijk 24 uur vooraf zichtbaar","source":{"page":40,"quote":"wordt uiterlijk 24 uur voorafgaande aan het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar"}},{"id":"TV-0054","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"kennis","objectives":["TV-EXA-22"],"question":"Voor wie moeten er bij het diplomazwemmen beoordelingslijsten voorhanden zijn?","options":["Voor de Licentiehouder, de Examinator en een eventueel aanwezige medewerker en/of gedelegeerde","Alleen voor de Examinator; een gedelegeerde neemt eigen lijsten van de Nationale Raad Zwemveiligheid mee","Voor de Examinator en voor de ouders/verzorgers van iedere kandidaat"],"answer":0,"explanation":"Er moeten voldoende beoordelingslijsten zijn: één voor de Licentiehouder, één voor de Examinator en één voor de eventueel aanwezige medewerker en/of gedelegeerde. Een gedelegeerde neemt geen eigen lijsten mee maar gebruikt de lijsten die de examinator aanlevert, en lijsten voor ouders/verzorgers worden niet genoemd. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voldoende beoordelingslijsten","source":{"page":40,"quote":"één voor de Licentiehouder, één voor de Examinator Nationale Zwemdiploma’s, één voor de eventueel aanwezige medewerker"}},{"id":"TV-0055","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXT-04","TV-LIC-12","TV-EXA-22"],"question":"Welke uitspraak over de beoordelingslijsten van Licentiehouder, Examinator en gedelegeerde is juist?","options":["De gedelegeerde gebruikt lijsten die de examinator aanlevert; de ingevulde lijsten blijven bij de Licentiehouder.","De gedelegeerde neemt eigen lijsten mee; de ingevulde lijsten gaan naar de Nationale Raad Zwemveiligheid.","De Licentiehouder krijgt geen lijst; de ingevulde lijsten blijven bij de gedelegeerde."],"answer":0,"explanation":"De gedelegeerde observeert de kandidaten met beoordelingslijsten die de examinator aanlevert, en de ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder. De gedelegeerde neemt dus geen eigen lijsten mee, en ook de Licentiehouder krijgt een eigen lijst. §3.1–3.2, p. 40 en 42","ref":"§3.1–3.2, p. 40 en 42","tests":"beoordelingslijsten: wie levert aan, wie archiveert","source":{"page":42,"quote":"met behulp van beoordelingslijsten die worden aangeleverd door de examinator"}},{"id":"TV-0056","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-23"],"question":"De Examinator maakt de zwemdiploma's gereed en vult de datum van het diplomazwemmen en de naam van elke kandidaat in. Wat moet hij nog meer invullen?","options":["De geboortedatum van de kandidaat en de naam van het zwembad","De naam van de lesgever en de naam van de Licentiehouder","De naam van de gedelegeerde en het aantal pogingen"],"answer":0,"explanation":"Zwemdiploma's worden gereed gemaakt met de datum van het diplomazwemmen, de naam en geboortedatum van de kandidaat en de naam van het zwembad waar het diplomazwemmen plaatsvindt. De naam van de lesgever, de Licentiehouder, de gedelegeerde of het aantal pogingen wordt bij het gereedmaken niet genoemd. §3.1, p. 40","ref":"§3.1, p. 40","tests":"gegevens op zwemdiploma","source":{"page":40,"quote":"het invullen van de naam en geboortedatum van de kandidaat, en de naam van het zwembad"}},{"id":"TV-0057","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-32","TV-EXA-23"],"question":"Welke bewering over het gereedmaken en uitreiken van zwemdiploma's is NIET juist?","options":["Op het zwemdiploma wordt de geboortedatum van de kandidaat ingevuld.","Op het zwemdiploma komt de naam van het zwembad waar het diplomazwemmen plaatsvindt.","Geslaagde kandidaten krijgen hun zwemdiploma pas nadat het verslag is verstuurd."],"answer":2,"explanation":"Geslaagde kandidaten ontvangen het behaalde zwemdiploma direct na afloop van het diplomazwemmen; daar hoeft het verslag niet eerst voor te zijn verstuurd. De geboortedatum van de kandidaat en de naam van het zwembad worden wel op het diploma ingevuld. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"diploma direct na afloop uitgereikt","source":{"page":41,"quote":"De geslaagde kandidaten ontvangen direct na afloop van het diplomazwemmen het behaalde zwemdiploma."}},{"id":"TV-0058","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"verschil","objectives":["TV-EXA-24","TV-EXA-34"],"question":"Wat is het verschil in duur tussen de voorbespreking en het feedbackgesprek?","options":["Voorbespreking ongeveer 15 minuten; feedbackgesprek ongeveer 15 - 20 minuten","Voorbespreking ongeveer 15 - 20 minuten; feedbackgesprek ongeveer 15 minuten","Voorbespreking en feedbackgesprek elk ongeveer 7 minuten"],"answer":0,"explanation":"De voorbespreking duurt ongeveer 15 minuten en het feedbackgesprek waarmee het diplomazwemmen wordt afgerond ongeveer 15 - 20 minuten. De tweede optie draait de tijden om, en 7 is in de Examenregeling een aantal dagen (de termijn voor het verslag), geen gespreksduur. §3.1, p. 40–41","ref":"§3.1, p. 40–41","tests":"duur voorbespreking 15 min vs feedbackgesprek 15-20 min","source":{"page":40,"quote":"een voorbespreking (ongeveer 15 minuten)"}},{"id":"TV-0059","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"casus","objectives":["TV-EXA-24"],"question":"Een dag voor het diplomazwemmen ziet de Examinator via 'Mijn NRZ' dat er een gedelegeerde aanwezig zal zijn. Wat moet er vóór aanvang van het diplomazwemmen plaatsvinden?","options":["Een voorbespreking van ongeveer 15 minuten tussen de Examinator en de gedelegeerde","Een feedbackgesprek van ongeveer 15 - 20 minuten tussen de Licentiehouder en de gedelegeerde","Niets; de gedelegeerde spreekt de Examinator pas na de uitslagbepaling"],"answer":0,"explanation":"Als een medewerker of gedelegeerde namens de Nationale Raad Zwemveiligheid aanwezig is, vindt vóór aanvang een voorbespreking van ongeveer 15 minuten met de Examinator plaats. Het feedbackgesprek van 15 - 20 minuten sluit het diplomazwemmen juist af en is tussen de Examinator en de gedelegeerde. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voorbespreking bij aanwezigheid gedelegeerde","source":{"page":40,"quote":"dient voor aanvang van het diplomazwemmen een voorbespreking (ongeveer 15 minuten) plaats te vinden"}},{"id":"TV-0060","category":"taken_verantwoordelijkheden","subtopic":"examinator","type":"onjuist","objectives":["TV-EXA-24","TV-EXA-26"],"question":"Welke bewering over de voorbespreking met een aanwezige gedelegeerde is NIET juist?","options":["De voorbespreking duurt ongeveer 15 minuten.","De gedelegeerde wordt voorgesteld aan het publiek voordat het diplomazwemmen start.","De voorbespreking vindt plaats direct na afloop van het diplomazwemmen."],"answer":2,"explanation":"De voorbespreking vindt plaats vóór aanvang van het diplomazwemmen; na afloop volgt het feedbackgesprek. Dat de voorbespreking ongeveer 15 minuten duurt en dat de gedelegeerde vóór de start aan het publiek wordt voorgesteld, klopt. §3.1, p. 40","ref":"§3.1, p. 40","tests":"voorbespreking bij aanwezigheid gedelegeerde","source":{"page":40,"quote":"dient voor aanvang van het diplomazwemmen een voorbespreking (ongeveer 15 minuten) pl
