:"core","statement":"Bij zelfstandig uit het water op de kant klimmen is het gebruik van een trapje niet toegestaan."},{"id":"NO-SURV-10","category":"normering","subtopic":"survival","section":"2.1.2","page":21,"weight":"detail","statement":"B1 en C1 proef Survival worden uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},{"id":"NO-SURV-11","category":"normering","subtopic":"survival","section":"2.1.2","page":22,"weight":"core","statement":"Bij gekleed achterwaarts te water gaan heeft de kandidaat geen zicht op de valrichting; het mag zittend of staand worden uitgevoerd."},{"id":"NO-SURV-12","category":"normering","subtopic":"survival","section":"2.1.2","page":22,"weight":"core","statement":"Bij achterwaarts te water gaan is er sprake van een valbeweging; springen is niet toegestaan."},{"id":"NO-SURV-13","category":"normering","subtopic":"survival","section":"2.1.2","page":22,"weight":"detail","statement":"Achterwaarts te water gaan mag vanaf een lage kant of een drijvend voorwerp worden uitgevoerd."},{"id":"NO-SURV-14","category":"normering","subtopic":"survival","section":"2.1.2","page":22,"weight":"core","statement":"Bij gekleed onder een drijvend voorwerp door zwemmen zwemt de kandidaat met een redelijke voorstuwing onder water onder een voorwerp (bijvoorbeeld een mat of bootje) door."},{"id":"NO-SURV-15","category":"normering","subtopic":"survival","section":"2.1.3","page":27,"weight":"core","statement":"Bij gekleed met een rol voorover te water gaan is er sprake van een draai om de breedteas; de plaats waar de kandidaat in het water terecht komt is niet van belang."},{"id":"NO-SURV-16","category":"normering","subtopic":"survival","section":"2.1.3","page":27,"weight":"detail","statement":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd."},{"id":"NO-SURV-17","category":"normering","subtopic":"survival","section":"2.1.3","page":27,"weight":"core","statement":"Bij gekleed verticaal blijven drijven met een drijvend voorwerp is het hoofd boven water, is de houding verticaal, zijn de knieën opgetrokken en de ellebogen tegen het lichaam."},{"id":"NO-SURV-18","category":"normering","subtopic":"survival","section":"2.1.3","page":27,"weight":"detail","statement":"Bij gekleed verticaal blijven drijven mogen de onderbenen gekruist of naast elkaar zijn, is de keuze voor het drijvend voorwerp vrij en blijft de kandidaat op de plaats."},{"id":"NO-SURV-19","category":"normering","subtopic":"survival","section":"2.1.3","page":27,"weight":"core","statement":"Bij 5 meter gekleed voortbewegen op de rug (C) is de ligging horizontaal, liggen de benen stil en gebeurt de verplaatsing door gebruik van de armen/handen."},{"id":"NO-SURV-20","category":"normering","subtopic":"survival","section":"2.1.3","page":28,"weight":"core","statement":"Bij 5 meter gekleed voortbewegen op de rug (C) is verplaatsing zowel in de richting van het hoofd als van de voeten toegestaan."},{"id":"NO-SURV-21","category":"normering","subtopic":"survival","section":"2.1.3","page":28,"weight":"core","statement":"Bij gekleed over een drijvend voorwerp heen klimmen klimt de kandidaat op een eigen manier uit het water op een drijvend voorwerp."},{"id":"NO-SURV-22","category":"normering","subtopic":"survival","section":"2.1.3","page":28,"weight":"core","statement":"Bij gekleed te water gaan met een sprong waarbij het hoofd boven water blijft, blijft het hoofd boven water; dit mag vanaf een (lage) kant of een drijvend voorwerp."},{"id":"NO-SURV-23","category":"normering","subtopic":"survival","section":"2.1.3","page":28,"weight":"core","statement":"Bij gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen (C) moet de kandidaat minimaal 1 meter voor het zeil onder water gaan."},{"id":"NO-SURV-24","category":"normering","subtopic":"survival","section":"2.1.3","page":28,"weight":"detail","statement":"Het gekleed onder water gaan en door het zeil zwemmen (C) wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},{"id":"NO-VERT-01","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1.1","page":20,"weight":"detail","statement":"A5 proef Je vertrouwd voelen in het water wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},{"id":"NO-VERT-02","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1","page":20,"weight":"core","statement":"Bij drijven op de buik en op de rug is de ligging horizontaal, blijft de kandidaat op de plaats liggen en is de houding van armen en benen vrij."},{"id":"NO-VERT-03","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1","page":20,"weight":"core","statement":"Bij drijven is het gebruik van armen/handen voor het in stand houden van de horizontale drijfhouding toegestaan."},{"id":"NO-VERT-04","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1.1","page":20,"weight":"core","statement":"Bij drijven op de buik is het gezicht in het water, maar het mag uit het water worden getild voor ademhaling."},{"id":"NO-VERT-05","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1.2","page":25,"weight":"core","statement":"Bij hoofdwaarts voortbewegen op de rug met gebruik van de armen (B5) is de ligging horizontaal, liggen de benen stil en is de verplaatsing in de richting van het hoofd."},{"id":"NO-VERT-06","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1","page":25,"weight":"core","statement":"Bij voortbewegen op de rug met gebruik van de armen blijven de armen onder water en komen ze niet boven de schouderlijn."},{"id":"NO-VERT-07","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1.2","page":25,"weight":"core","statement":"Bij drijven met gebruik van een drijvend voorwerp (B5) is de lichaamshouding bij voorkeur verticaal; rugligging is ook toegestaan."},{"id":"NO-VERT-08","category":"normering","subtopic":"vertrouwd_in_water","section":"2.1.2","page":25,"weight":"core","statement":"Bij drijven met gebruik van een drijvend voorwerp (B5) worden armen en benen niet gebruikt om te stuwen, is het drijvend voorwerp vrij en blijft de kandidaat op de plaats."},{"id":"AB-DEF-01","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"In de Examenregeling wordt de term ‘duiken’ gebruikt waar voorheen de technische benaming ‘kopsprong’ werd gehanteerd."},{"id":"AB-DEF-02","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"‘Een sprong waarbij het hoofd boven water blijft’ vervangt de ‘hurksprong’; de uitvoering wordt volledig vrijgelaten, mits het hoofd boven water blijft."},{"id":"AB-DEF-03","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"De techniek van de hurksprong wordt door Reddingsbrigade Nederland niet meer gehanteerd."},{"id":"AB-DEF-04","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"De Examenregeling Nationale Zwemdiploma's is met ingang van 1 januari 2018 de nieuwe naam voor het reglement dat voorheen BREZ heette; de term BREZ wordt niet meer gehanteerd."},{"id":"AB-DEF-05","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"De Examinator Nationale Zwemdiploma's is degene die vanuit de Licentiehouder zorgdraagt voor de kwaliteit van het diplomazwemmen; het is de nieuwe naam voor Gelicentieerde Examinator Zwem-ABC."},{"id":"AB-DEF-06","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"De termen ‘examens’ en ‘diplomazwemmen’ worden door elkaar gebruikt; het examen is een vorm van praktijktoetsing."},{"id":"AB-DEF-07","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"‘Hoofdwaarts richting bodem gaan’ vervangt de ‘hoekduik’; de strakke technische normering die daarbij hoorde is losgelaten."},{"id":"AB-DEF-08","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"De Licentie Zwem-ABC is in 2014 geïntroduceerd met als doel voortdurende kwaliteitsverbetering; sinds 1 januari 2018 heet deze de Licentie Nationale Zwemdiploma's."},{"id":"AB-DEF-09","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"De Licentie Nationale Zwemdiploma's geeft zwemlesaanbieders het recht tot gebruik van de Nationale Zwemdiploma's volgens de voorwaarden in de Examenregeling en het Handboek Licentie Nationale Zwemdiploma's."},{"id":"AB-DEF-10","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"Alle onderdelen die gekleed worden uitgevoerd, zijn ondergebracht in de proef Survival."},{"id":"AB-DEF-11","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"In het standaard examenprogramma zijn zes proeven voor Zwemdiploma A en Zwemdiploma B en vijf proeven voor Zwemdiploma C opgenomen."},{"id":"AB-DEF-12","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"Een proef is opgebouwd uit losse onderdelen; in het standaard examenprogramma zijn de onderdelen apart genormeerd."},{"id":"AB-DEF-13","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"Vanaf 1 januari 2018 kan een Licentiehouder óf het standaard examenprogramma óf een zelf ontworpen maatwerk examenprogramma uitvoeren."},{"id":"AB-DEF-14","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"‘Verticaal drijven met behulp van een voorwerp’ vervangt de term ‘HELP-houding’ (Heat Escape Lessening Posture), omdat de afkorting onbekend is en tot verwarring kan leiden."},{"id":"AB-DEF-15","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"Basiselementen zijn categorieën van vaardigheden."},{"id":"AB-DEF-16","category":"algemene_bepalingen","subtopic":"definities","section":"Bijlage 1","page":"Bijlage 1","weight":"detail","statement":"Stichting Nationale Raad Zwemveiligheid is met ingang van 1 januari 2018 de nieuwe naam voor de stichting Nationaal Platform Zwembaden | NRZ."},{"id":"AB-INL-01","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"core","statement":"De Examenregeling Nationale Zwemdiploma's vormt een onderdeel van de Licentie Nationale Zwemdiploma's en is gekoppeld aan de Nationale Norm Zwemveiligheid."},{"id":"AB-INL-02","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"core","statement":"Voor iedereen herkenbaar: de zwemlesaanbieder is in het bezit van de Licentie Nationale Zwemdiploma's en het verstrekte zwemdiploma is uitgegeven door de Nationale Raad Zwemveiligheid."},{"id":"AB-INL-03","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":2,"weight":"core","statement":"De Examenregeling is vastgesteld door het bestuur van de Nationale Raad Zwemveiligheid en is tot stand gekomen in nauw overleg met de zwembranche."},{"id":"AB-INL-04","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Aanleiding","page":3,"weight":"core","statement":"Het huidige Zwem-ABC bestaat sinds 1998."},{"id":"AB-INL-05","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Inleiding","page":1,"weight":"detail","statement":"De Examenregeling bevat examenprogramma's, de bijbehorende normering en algemene bepalingen en richtlijnen voor het organiseren van diplomazwemmen, en is geschreven voor professionals in zwemonderwijs en diplomazwemmen."},{"id":"AB-INL-06","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"De Nationale Raad Zwemveiligheid is een landelijk opererende stichting die toeziet op de kwaliteit van het zwemonderwijs, de zwemveiligheid en de zwemvaardigheid."},{"id":"AB-INL-07","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"In 1984 heeft de overheid de taak om de uitgifte van de Nationale Zwemdiploma's te verzorgen overgedragen aan de voorganger van de Nationale Raad Zwemveiligheid."},{"id":"AB-INL-08","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"detail","statement":"Het bestuur van de Nationale Raad Zwemveiligheid is samengesteld uit partijen uit de zwembranche en kent een onafhankelijk voorzitter."},{"id":"AB-INL-09","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"core","statement":"Kwaliteit van het eindresultaat valt onder de Examenregeling; kwaliteit van de organisatie van zwemlesaanbieders, de zwemles en het diplomazwemmen onder de Licentie Nationale Zwemdiploma's."},{"id":"AB-INL-10","category":"algemene_bepalingen","subtopic":"nrz_organisatie","section":"NRZ","page":5,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid bereikt haar doel door kennis te verzamelen, ontwikkelen en verspreiden, en door het normeren en controleren van de kwaliteit van zwemlesaanbieders."},{"id":"AB-INL-11","category":"algemene_bepalingen","subtopic":"examenregeling","section":"Aanleiding","page":4,"weight":"detail","statement":"Een standaard examenprogramma is een serie proeven, zoals ‘onder water oriëntatie’ en ‘conditiezwemmen’; proeven bestaan uit vaardigheden die belangrijk zijn om te kunnen overleven."},{"id":"AB-KLED-01","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"De kledingvoorschriften zijn voor Zwemdiploma A en B gelijk: badkleding, shirt, hemd of blouse met lange mouwen, lange broek, jurk of rok tot de enkels, en schoenen."},{"id":"AB-KLED-02","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"Voor Zwemdiploma C wordt een jas met lange mouwen aan het kledingpakket toegevoegd."},{"id":"AB-KLED-03","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"Bij Zwemdiploma C wordt het onderdeel ‘gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen’ zonder de jas gezwommen."},{"id":"AB-KLED-04","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":33,"weight":"core","statement":"De kleding wordt bij alle onderdelen die horen bij ‘Survival’ tot het einde van de opdracht gedragen."},{"id":"AB-KLED-05","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Kleding tijdens de examens laat zien dat je met dagelijkse kleding aan jezelf kunt redden bij onverwacht in het water terechtkomen; de kledingkeuze is afgestemd op het Nederlandse klimaat."},{"id":"AB-KLED-06","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Plastic-, leren-, katoenen- en sportschoenen zijn toegestaan."},{"id":"AB-KLED-07","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"Pantoffels en schoenen zonder echte zool, zoals slippers en surfschoentjes, zijn niet toegestaan."},{"id":"AB-KLED-08","category":"algemene_bepalingen","subtopic":"kleding","section":"2.3","page":34,"weight":"core","statement":"De kledingvoorschriften voor de Zwemcertificaten A, B en C zijn gelijk aan die van het Zwem-ABC."},{"id":"AB-MAT-01","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Omdat de examens vooral de zwemveiligheid, het zelfvertrouwen en het overzicht in het water toetsen, moet het gebruik van lijnen zo minimaal mogelijk blijven."},{"id":"AB-MAT-02","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Een chloor/zwembrilletje is niet toegestaan tijdens het diplomazwemmen, behalve bij de onderdelen borst- en rugcrawl en bij de beoordeling van de uitvoering (techniek) van de zwemslag."},{"id":"AB-MAT-03","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Een uitzondering voor het brilletje bij andere onderdelen in bijzondere situaties bespreek je vóór het selecteren van de kandidaten met de regioadviseur van de Nationale Raad Zwemveiligheid."},{"id":"AB-MAT-04","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het zeil heeft een afmeting van minimaal 1,8 bij 1,8 meter."},{"id":"AB-MAT-05","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het gat in het zeil heeft een diameter van 75 centimeter en bevindt zich (met de bovenkant) op 75 centimeter van het wateroppervlak."},{"id":"AB-MAT-06","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"detail","statement":"Bij ‘drijvend voorwerp’ is er ruimte om zelf invulling te geven aan het soort materiaal; voorbeelden zijn een mat, bootje of surfplank."},{"id":"AB-MAT-07","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het drijvend voorwerp waar onderdoor moet worden gezwommen heeft minimaal een lengte van 1,4 meter en een breedte van 70 centimeter."},{"id":"AB-MAT-08","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het is toegestaan meerdere smallere of kortere voorwerpen aan elkaar te koppelen, mits in totaal aan de minimale afmetingen wordt voldaan."},{"id":"AB-MAT-09","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Bij ‘over een drijvend voorwerp heen klimmen’ moet het voorwerp minimaal 70 centimeter breed zijn."},{"id":"AB-MAT-10","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":34,"weight":"core","statement":"Het ‘soort wak’ bij Zwemdiploma C mag een vierkant of rond voorwerp zijn, zoals een hoepel, en heeft een maximale afmeting van 1 bij 1 meter of een diameter van 1 meter."},{"id":"AB-MAT-11","category":"algemene_bepalingen","subtopic":"materialen","section":"2.3","page":35,"weight":"core","statement":"Bij ‘met gebruik van een drijvend voorwerp blijven drijven’ is de keuze vrij: materialen uit het dagelijks leven (plastic tas, bal, petfles) en zwembadmaterialen (flexibeam, foam halter, plankje) zijn toegestaan."},{"id":"AB-NIV-01","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Zwemveilig zijn is in en om water kunnen overleven en op een veilige manier kunnen bewegen en recreëren in de Nederlandse watercultuur."},{"id":"AB-NIV-02","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Zwemveiligheid is een dynamisch begrip, onder andere beïnvloed door beheersing van vaardigheden, omstandigheden, ervaring, ontwikkeling en zelfvertrouwen."},{"id":"AB-NIV-03","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"detail","statement":"Door de invloed van omstandigheden (zoals waterdiepte, watertemperatuur, stroming, kleding, zwembad of open water) is het onmogelijk om één niveau van zwemveiligheid te definiëren."},{"id":"AB-NIV-04","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":3,"weight":"core","statement":"Er zijn vier veelvoorkomende situaties: een zwembad zonder attracties; een zwembad met attracties; een zwembad met attracties en open water zonder stroming of grote golfslag; open water/zee met mogelijkheid tot stroming en sterke golfslag."},{"id":"AB-NIV-05","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Bijlage 1","page":"Bijlage 1","weight":"core","statement":"Een zwembad zonder attracties hoort bij Zwemdiploma A, een zwembad met attracties (zoals (wildwater)glijbaan, golfslagbassin, stroomversnelling) bij Zwemdiploma B, en daarnaast open water zonder stroming of grote golfslag bij Zwemdiploma C."},{"id":"AB-NIV-06","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"De Nationale Raad Zwemveiligheid focust op de niveaus één tot en met drie; niveau vier (open water met stroming/zee) is zeer specifiek, in hoge mate onvoorspelbaar en niet of nauwelijks te oefenen in een zwembad."},{"id":"AB-NIV-07","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"Het eerste en tweede niveau (Zwemdiploma's A en B) worden gepositioneerd als ‘op weg zijn naar zwemveilig’."},{"id":"AB-NIV-08","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"core","statement":"De Nationale Norm Zwemveiligheid ligt op niveau drie (Zwemdiploma C): zwemveilig in zwembaden met attracties en in open water zonder stroming of grote golfslag."},{"id":"AB-NIV-09","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Inleiding","page":1,"weight":"detail","statement":"De Nationale Norm Zwemveiligheid bestaat uit uniforme landelijke richtlijnen die de gewenste mate van zwemveiligheid van de Nederlandse bevolking weergeven."},{"id":"AB-NIV-10","category":"algemene_bepalingen","subtopic":"zwemveiligheid_niveaus","section":"Aanleiding","page":4,"weight":"detail","statement":"Voor niveau vier zijn naast vaardigheden ook specifieke kennis en voldoende kracht en uithoudingsvermogen nodig."},{"id":"AB-ORG-01","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Bij onvoldoende uitvoering mag de kandidaat een onderdeel nogmaals uitvoeren, maximaal drie keer in totaal."},{"id":"AB-ORG-02","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Het examen voor een zwemcertificaat kan tegelijk plaatsvinden met het examen voor één of meer diploma's van het Zwem-ABC, maar mag ook op een ander moment."},{"id":"AB-ORG-03","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"detail","statement":"De aanvraag van het examen voor een zwemcertificaat gebeurt op dezelfde manier als voor het Zwem-ABC."},{"id":"AB-ORG-04","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"De proeven van het standaard examenprogramma mogen in een willekeurige volgorde worden getoond."},{"id":"AB-ORG-05","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Het examenprogramma uitvoeren in een ‘circuitvorm’ (kleine groepjes voeren tegelijkertijd verschillende proeven uit) is toegestaan."},{"id":"AB-ORG-06","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Voor deelname aan een ‘hoger’ zwemdiploma/zwemcertificaat is het bezit van een ‘lager’ diploma/certificaat niet vereist; zwemdiploma's overslaan mag."},{"id":"AB-ORG-07","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Ook bij het overstappen van een behaald zwemcertificaat naar een zwemdiploma is een lager diploma niet vereist."},{"id":"AB-ORG-08","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Een kandidaat mag voor het Zwem-ABC slechts één examenprogramma per dag afleggen."},{"id":"AB-ORG-09","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Uitgangspunt is dat de uitvoering van een examenprogramma voor Zwemdiploma A, B of C maximaal 1,5 uur duurt."},{"id":"AB-ORG-10","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"core","statement":"Een aanvraag kan gelden voor 1 of meer groepen (voor hetzelfde of een verschillend zwemdiploma); het totale blok diplomazwemmen duurt bij voorkeur niet langer dan 2,5 uur."},{"id":"AB-ORG-11","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"detail","statement":"De zwemlesaanbieder mag op een dag meerdere blokken diplomazwemmen organiseren en aanvragen."},{"id":"AB-ORG-12","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"core","statement":"Het diplomazwemmen vindt plaats tussen 08.30 uur en 21.00 uur; voor afwijkende tijden moet vooraf worden overlegd met de regioadviseur van de Nationale Raad Zwemveiligheid."},{"id":"AB-ORG-13","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"core","statement":"De Examinator bepaalt zelf hoeveel kandidaten gelijktijdig aan een examen deelnemen, zolang het examen overzichtelijk verloopt en kandidaten goed beoordeeld kunnen worden."},{"id":"AB-ORG-14","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":36,"weight":"detail","statement":"Kandidaten moeten voldoende tijd en ruimte hebben; het is niet wenselijk dat ze geruime tijd moeten wachten, dus worden de onderdelen bij voorkeur opeenvolgend uitgevoerd."},{"id":"AB-ORG-15","category":"algemene_bepalingen","subtopic":"organisatie","section":"2.3","page":35,"weight":"detail","statement":"Voor het maatwerk examenprogramma kan een eigen volgorde van onderdelen in de vorm van proeven worden samengesteld."},{"id":"AB-ZWEM-01","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"De examens voor het Zwem-ABC worden afgenomen in een bassin met een oppervlakte van ten minste 160 m2."},{"id":"AB-ZWEM-02","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Het bassin voor het Zwem-ABC heeft een waterdiepte van ten minste 80 centimeter."},{"id":"AB-ZWEM-03","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Het bassin heeft over een wateroppervlakte van ten minste 40 m2 een waterdiepte van minimaal 1,8 meter."},{"id":"AB-ZWEM-04","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"detail","statement":"De afmetingen zijn gekozen in het belang van veiligheid en omdat ze de werkelijkheid reëel benaderen; kinderen raken in de voorgeschreven diepte de bodem niet gemakkelijk en moeten zich inspannen om boven te komen en te blijven."},{"id":"AB-ZWEM-05","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"Bepaalde proeven of onderdelen mogen in andere bassins worden uitgevoerd, bijvoorbeeld het recreatie- of golfslagbad."},{"id":"AB-ZWEM-06","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":34,"weight":"core","statement":"De onderdelen survival en conditiezwemmen vinden altijd plaats in een bassin met een wateroppervlakte van ten minste 160 m2."},{"id":"AB-ZWEM-07","category":"algemene_bepalingen","subtopic":"zwembad","section":"2.3","page":33,"weight":"detail","statement":"De algemene bepalingen en richtlijnen zijn de minimale voorschriften die gelden voor het organiseren van het diplomazwemmen."},{"id":"TV-EXA-01","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator Nationale Zwemdiploma's is verantwoordelijk voor de kwaliteit van het diplomazwemmen; hij/zij moet bekend zijn bij de Nationale Raad Zwemveiligheid en in het bezit zijn van het certificaat tot Examinator Nationale Zwemdiploma's."},{"id":"TV-EXA-02","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"Een Licentiehouder die vanuit de eigen organisatie geen Examinator kan inzetten, kan er een inhuren; die Examinator is dan verantwoordelijk voor de kwaliteitsborging van de zwemlesaanbieder die hem/haar inhuurt."},{"id":"TV-EXA-03","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"Een Licentiehouder kan/mag over meerdere Examinatoren beschikken, zodat niet steeds dezelfde persoon verantwoordelijk is voor het hele proces van diplomazwemmen."},{"id":"TV-EXA-04","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"Per aanvraag van diplomazwemmen is slechts één examinator (eind)verantwoordelijk; deze is de beslisser."},{"id":"TV-EXA-05","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator mag taken delegeren aan collega's mits de kwaliteit gewaarborgd blijft; het enige wat niet gedelegeerd mag worden is de aanwezigheid bij het diplomazwemmen waarvoor hij/zij verantwoordelijk is."},{"id":"TV-EXA-06","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator is voor het diplomazwemmen het aanspreekpunt voor de Nationale Raad Zwemveiligheid voor de kwaliteit."},{"id":"TV-EXA-07","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"De Examinator toetst of het diplomazwemmen kwalitatief voldoet aan de eisen van de Examenregeling in combinatie met het Handboek Licentie Nationale Zwemdiploma's."},{"id":"TV-EXA-08","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator heeft een observerende, signalerende en rapporterende taak voor het diplomazwemmen richting de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-09","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"detail","statement":"De Examinator is bij het diplomazwemmen in feite het ‘gezicht’ van de Nationale Raad Zwemveiligheid en koppelt de resultaten terug naar de organiserende zwemlesaanbieder en naar de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-10","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator is verantwoordelijk voor het feedbackgesprek met de gedelegeerde namens de Nationale Raad Zwemveiligheid."},{"id":"TV-EXA-11","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":38,"weight":"core","statement":"De Examinator bepaalt samen met collega's de volgorde van de routing en de keuze voor circuitvormen, en stelt de volgorde van de onderdelen van het diplomazwemmen vast."},{"id":"TV-EXA-12","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"detail","statement":"De Examinator zorgt ervoor dat de kandidaten aan de hand van de beoordelingslijsten conform de Examenregeling worden beoordeeld."},{"id":"TV-EXA-13","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator bepaalt de uitslag conform de Examenregeling, na afstemming met een eventueel aanwezige medewerker van de Nationale Raad Zwemveiligheid of gedelegeerde."},{"id":"TV-EXA-14","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Als een jeugdige kandidaat wordt afgewezen, moet de reden daarvan kenbaar worden gemaakt aan de ouders/verzorgers."},{"id":"TV-EXA-15","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De uitgereikte zwemdiploma's zijn namens de Nationale Raad Zwemveiligheid ondertekend; de Examinator is namens de Licentiehouder verantwoordelijk voor de ondertekening en mag dit zelf doen of delegeren."},{"id":"TV-EXA-16","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Taken van de Examinator vóór het examen: kandidaten selecteren, het diplomazwemmen aanvragen, kandidaten op de beoordelingslijsten vermelden, zwemdiploma's gereed maken en zorgen voor benodigde materialen."},{"id":"TV-EXA-17","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"Taken van de Examinator rond en na het examen: medewerker/gedelegeerde ontvangen, voorbespreking, goed georganiseerd diplomazwemmen, uitslag vaststellen, diploma's ondertekenen en uitreiken, feedbackgesprek, rapporteren en evalueren."},{"id":"TV-EXA-18","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"detail","statement":"De Examinator beschikt onder andere over beoordelingsformulieren en inlogcodes om via ‘Mijn NRZ’ het diplomazwemmen en zwemdiploma's aan te vragen."},{"id":"TV-EXA-19","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator selecteert kandidaten die met grote zekerheid het examenprogramma kunnen uitvoeren zoals beschreven in de Examenregeling."},{"id":"TV-EXA-20","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":39,"weight":"core","statement":"De Examinator meldt het diplomazwemmen ten minste 21 dagen van tevoren aan via de website van de Nationale Raad Zwemveiligheid (‘Mijn NRZ’)."},{"id":"TV-EXA-21","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Na akkoord van de Nationale Raad Zwemveiligheid wordt uiterlijk 24 uur voor het examen de eventuele aanwezigheid van een gedelegeerde zichtbaar."},{"id":"TV-EXA-22","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"Er moeten voldoende beoordelingslijsten zijn: één voor de Licentiehouder, één voor de Examinator en één voor de eventueel aanwezige medewerker van de Nationale Raad Zwemveiligheid en/of gedelegeerde."},{"id":"TV-EXA-23","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Zwemdiploma's worden gereed gemaakt met de datum van het diplomazwemmen, de naam en geboortedatum van de kandidaat en de naam van het zwembad."},{"id":"TV-EXA-24","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"core","statement":"Als een medewerker/gedelegeerde namens de Nationale Raad Zwemveiligheid aanwezig is, vindt vóór aanvang een voorbespreking van ongeveer 15 minuten plaats met de Examinator."},{"id":"TV-EXA-25","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"Onderwerpen van de voorbespreking zijn onder andere de volgorde en routing, de taken van organisatorisch betrokkenen en eventuele bijzonderheden bij kandidaten."},{"id":"TV-EXA-26","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":40,"weight":"detail","statement":"De medewerker/gedelegeerde wordt aan het publiek voorgesteld voordat het diplomazwemmen van start gaat."},{"id":"TV-EXA-27","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"Tijdens het diplomazwemmen zorgt de Examinator voor een goed lopend diplomazwemmen, zoals een goede routing en een adequate begeleiding van de kandidaten."},{"id":"TV-EXA-28","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Een kandidaat is geslaagd als alle onderdelen voldoende zijn uitgevoerd; voor het zwemcertificaat moet het verplichte deel voldoende zijn en wordt bijgehouden welke onderdelen van het open deel de kandidaat beheerst."},{"id":"TV-EXA-29","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De Examinator is eindverantwoordelijk voor het vaststellen van het resultaat; op de beoordelingslijsten wordt in ieder geval aangegeven welk onderdeel onvoldoende is uitgevoerd."},{"id":"TV-EXA-30","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De kandidaat heeft altijd het recht het diplomazwemmen af te maken, ook als de afwijzing al een feit is."},{"id":"TV-EXA-31","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Een afgewezen kandidaat moet vóór de diploma-uitreiking op de hoogte worden gebracht; de Examinator of iemand anders die betrokken is (bijvoorbeeld de eigen lesgever) legt het kind en de ouder(s) de reden uit."},{"id":"TV-EXA-32","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Zwemdiploma's en zwemcertificaten worden ondertekend door of namens de Examinator; geslaagde kandidaten ontvangen het zwemdiploma direct na afloop van het diplomazwemmen."},{"id":"TV-EXA-33","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"De Examinator biedt de gedelegeerde bij voorkeur de gelegenheid om enkele woorden te richten tot de kandidaten en het publiek."},{"id":"TV-EXA-34","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"Het diplomazwemmen wordt afgerond met een feedbackgesprek van ongeveer 15-20 minuten tussen de Examinator en de gedelegeerde, al dan niet aangevuld met betrokken medewerkers."},{"id":"TV-EXA-35","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"detail","statement":"In het feedbackgesprek komt aan de orde of het diplomazwemmen organisatorisch heeft voldaan, hoe de Examinator de verantwoordelijkheid heeft ingevuld en hoe de gedelegeerde zijn/haar rol heeft vervuld; uitgangspunten zijn wederzijds respect en professioneel handelen."},{"id":"TV-EXA-36","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":41,"weight":"core","statement":"De Examinator maakt na afloop een verslag over de kwaliteit van het diplomazwemmen en stuurt dit binnen 7 dagen naar de Nationale Raad Zwemveiligheid via de website."},{"id":"TV-EXA-37","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"3.1","page":42,"weight":"detail","statement":"Bij aanwezigheid van een gedelegeerde of medewerker vullen zowel de Examinator als de gedelegeerde/medewerker een aanvullend feedbackformulier in, ook binnen 7 dagen; Licentiehouder en gedelegeerde kunnen daarna direct kennis nemen van de inhoud."},{"id":"TV-EXA-38","category":"taken_verantwoordelijkheden","subtopic":"examinator","section":"Handleiding","page":3,"weight":"detail","statement":"(Handleiding) De Examinator beschikt over vaardigheden als tegenstellingen en conflicten onderkennen, objectief oordelen op basis van geobserveerde vaardigheden, rapporteren, beslissingen nemen en het diplomazwemmen evalueren."},{"id":"TV-EXT-01","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3","page":37,"weight":"core","statement":"De externe kwaliteitsborging bestaat uit toezicht op de kwaliteit van het diplomazwemmen door gedelegeerden en aangewezen medewerkers namens de Nationale Raad Zwemveiligheid, onder andere door steekproefsgewijs examens te bezoeken."},{"id":"TV-EXT-02","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid zorgt dat het diplomazwemmen periodiek wordt bezocht door gedelegeerden en aanvullend door aangewezen medewerkers."},{"id":"TV-EXT-03","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"Een gedelegeerde heeft taken en bevoegdheden in de vorm van observeren, bespreken en rapporteren."},{"id":"TV-EXT-04","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De gedelegeerde observeert de kandidaten met beoordelingslijsten die door de examinator worden aangeleverd, en observeert daarnaast de examinator en de organisatie van het diplomazwemmen."},{"id":"TV-EXT-05","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"Vindt de gedelegeerde dat diploma's ten onrechte worden uitgereikt, dan stelt hij dit vóór de uitslagbepaling kort aan de orde en licht hij zijn onderbouwing toe in het feedbackgesprek."},{"id":"TV-EXT-06","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De gedelegeerde stuurt zijn verslag binnen 7 dagen naar de Nationale Raad Zwemveiligheid; het is in te zien door de Licentiehouder, de gedelegeerde en de aangewezen medewerker."},{"id":"TV-EXT-07","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"Aangewezen medewerkers van de Nationale Raad Zwemveiligheid zijn het aanspreekpunt voor Licentiehouders en gedelegeerden en verantwoordelijk voor het diplomazwemmen in hun eigen werkgebied."},{"id":"TV-EXT-08","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"detail","statement":"De medewerker beoordeelt de verslagformulieren van de Examinator en de gedelegeerden en controleert in de systemen de aanvragen van het diplomazwemmen."},{"id":"TV-EXT-09","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":42,"weight":"core","statement":"De medewerker bezoekt het diplomazwemmen steekproefsgewijs, zowel aangekondigd als onaangekondigd."},{"id":"TV-EXT-10","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"Tijdens het diplomazwemmen heeft de medewerker dezelfde rol en taken als de gedelegeerde, maar kan daarnaast bezwaar maken tegen de organisatie en het functioneren van de Examinator en heeft directe invloed op de uitslagbepaling."},{"id":"TV-EXT-11","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"De medewerker kan corrigerend handelen wanneer hij/zij dat noodzakelijk acht."},{"id":"TV-EXT-12","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"In een verbetertraject maken aangewezen medewerkers met Licentiehouders afspraken over verbetering van het resultaat, het functioneren van de Examinator of de organisatorische/administratieve gang van zaken."},{"id":"TV-EXT-13","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Verbeterafspraken worden schriftelijk/per e-mail vastgelegd en gedeeld met de kwaliteitsmanager van de Nationale Raad Zwemveiligheid."},{"id":"TV-EXT-14","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Onderdeel van een verbetertraject kan een extra (onaangekondigde) controle zijn, uitgevoerd door een gedelegeerde of een medewerker."},{"id":"TV-EXT-15","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"core","statement":"Komt de Licentiehouder de verbeterafspraken niet na en blijft verbetering uit, dan kan de directeur besluiten tot het (tijdelijk) intrekken van de Licentie; dit wordt schriftelijk gecommuniceerd."},{"id":"TV-EXT-16","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Een Licentiehouder kan ook op eigen verzoek afspraken maken met de medewerker over een verbetertraject en/of extra controlemomenten."},{"id":"TV-EXT-17","category":"taken_verantwoordelijkheden","subtopic":"externe_kwaliteitsborging","section":"3.2","page":43,"weight":"detail","statement":"Bij onvrede over het gedrag of handelen van een medewerker of vrijwilliger van de Nationale Raad Zwemveiligheid kan schriftelijk een klacht worden ingediend; het klachtenreglement is van toepassing."},{"id":"TV-LIC-01","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Het diplomazwemmen kent interne en externe kwaliteitsborging."},{"id":"TV-LIC-02","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"De Licentiehouder is verantwoordelijk voor de interne kwaliteit van het diplomazwemmen (organisatie van het diplomazwemmen en uitvoering van de examenprogramma's) en stelt hiervoor een Examinator Nationale Zwemdiploma's aan."},{"id":"TV-LIC-03","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Alleen Licentiehouders mogen diplomazwemmen voor de Nationale Zwemdiploma's organiseren."},{"id":"TV-LIC-04","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Een Licentiehouder is een natuurlijke of rechtspersoon (zwemlesaanbieder) die op basis van een overeenkomst met de Nationale Raad Zwemveiligheid gebruik wenst te maken van de Licentie Nationale Zwemdiploma's."},{"id":"TV-LIC-05","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"Voorbeelden van Licentiehouders zijn een directie van een zwembad of exploitatiemaatschappij, een bestuur van een stichting of (zwem)vereniging, bevoegd gezag van een school of de eigenaar van een zwemschool."},{"id":"TV-LIC-06","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"De Nationale Raad Zwemveiligheid stelt zwemdiploma's en zwemcertificaten ter beschikking aan Licentiehouders tegen een door het bestuur vastgestelde prijs."},{"id":"TV-LIC-07","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"De Nationale Raad Zwemveiligheid mag de levering aan een Licentiehouder beperken of staken, of zwemdiploma's en/of zwemcertificaten terugvorderen als de Licentiehouder zich niet aan de voorwaarden houdt."},{"id":"TV-LIC-08","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"detail","statement":"De Licentiehouder ontvangt een raamsticker die zichtbaar kan worden getoond; een actueel overzicht van alle Licentiehouders staat op www.allesoverzwemles.nl."},{"id":"TV-LIC-09","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3","page":37,"weight":"core","statement":"Houdt de Licentiehouder zich niet aan de Examenregeling, dan kan de Licentie tijdelijk of permanent worden ingetrokken; daarna mag hij geen Nationale Zwemdiploma's meer aanvragen en uitgeven of diplomazwemmen organiseren."},{"id":"TV-LIC-10","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder draagt zorg voor de beschikbaarheid van een bassin dat voldoet aan de voorschriften en voor de aanwezigheid van de juiste materialen."},{"id":"TV-LIC-11","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De kosten van het diplomazwemmen, zoals honorering, reis- en verblijfkosten van de Examinator, kosten van zwemdiploma's, huur van het zwembad en administratiekosten, zijn voor rekening van de Licentiehouder."},{"id":"TV-LIC-12","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder kan zelf een beoordelingslijst ontwikkelen en gebruiken; de ingevulde lijsten blijven ter documentatie (archiefplicht) bij de Licentiehouder."},{"id":"TV-LIC-13","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"De Licentiehouder kan met de inlogcodes tot 24 uur voor het diplomazwemmen de status van de aanvraag bekijken en indien gewenst wijzigen."},{"id":"TV-LIC-14","category":"taken_verantwoordelijkheden","subtopic":"licentiehouder","section":"3.1","page":40,"weight":"core","statement":"Wordt een annulering niet binnen 24 uur van tevoren gemeld, dan worden de te vergoeden kosten van de gedelegeerde (vrijwilligersvergoeding en reiskosten) volledig bij de Licentiehouder in rekening gebracht."}],"questions":[{"id":"EP-0001","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-VERG-03","EP-VERG-02"],"question":"Wat is een verschil tussen de proef Onder water oriëntatie van Zwemdiploma A en die van Zwemdiploma B?","options":["Bij A hangt het zeil op 3 meter van de startkant, bij B op 6 meter.","Bij B moet de kandidaat na het zeil bovenkomen in een soort wak, bij A niet.","Bij A is duiken verplicht, bij B mag de kandidaat met een sprong naar keuze te water gaan."],"answer":0,"explanation":"Bij A hangt het zeil op 3 meter, bij B op 6 meter van de startkant. Bovenkomen in een soort wak hoort bij Zwemdiploma C. En het is andersom: bij A is het een sprong (duiken heeft de voorkeur), bij B is het duiken. §1.1.1–1.1.2, p. 7 en 9","ref":"§1.1.1–1.1.2, p. 7 en 9","tests":"afstand zeil A (3 m) vs B (6 m)","source":{"page":9,"quote":"zeil dat zich op 6 meter van de startkant bevindt"}},{"id":"EP-0010","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-01"],"question":"Een kandidaat voor Zwemdiploma A maakt bij proef A1 Survival vanaf enige hoogte een voetsprong voorwaarts en komt boven. Welke opdracht volgt volgens het standaard examenprogramma aansluitend?","options":["15 seconden watertrappen","60 seconden watertrappen met gebruik van armen en benen","5 seconden drijven op de buik"],"answer":0,"explanation":"In proef A1 volgt na het bovenkomen aansluitend 15 seconden watertrappen, daarna 12,5 meter zwemmen. De 60 seconden watertrappen hoort bij proef A6 en de 5 seconden drijven op de buik bij proef A5. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A1: 15 seconden watertrappen na de voetsprong","source":{"page":7,"quote":"na het bovenkomen aansluitend 15 seconden watertrappen, gevolgd door 12,5 meter zwemmen"}},{"id":"EP-0011","category":"examenprogrammas","subtopic":"diploma_a","type":"onjuist","objectives":["EP-DIPA-02","EP-DIPA-01"],"question":"Welke bewering over proef A1 Survival van Zwemdiploma A is NIET juist?","options":["De kandidaat zwemt 50 meter, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen.","Na 15 seconden watertrappen zwemt de kandidaat 12,5 meter.","De proef wordt afgerond met zelfstandig uit het water op de kant klimmen."],"answer":0,"explanation":"In A1 zwemt de kandidaat 12,5 meter zonder onderbreking; 50 meter met 1 keer onder een drijvend voorwerp door zwemmen hoort bij proef B1 van Zwemdiploma B. Dat na het watertrappen 12,5 meter wordt gezwommen en dat de proef eindigt met zelfstandig uit het water op de kant klimmen, klopt. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A1: 12,5 meter zwemmen, afronden met uit het water klimmen","source":{"page":7,"quote":"12,5 meter zwemmen, proef afronden met zelfstandig uit het water op de kant klimmen"}},{"id":"EP-0012","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-03","EP-VERG-02"],"question":"Bij proef A2 Onder water oriëntatie van Zwemdiploma A gaat een kandidaat met een sprong van de kant te water in plaats van te duiken. Daarna zwemt hij zonder boven te komen door het gat in het zeil. Wat beslist de examinator over het te water gaan?","options":["Dit is toegestaan; bij A mag het met een sprong, al heeft duiken de voorkeur.","Dit is niet toegestaan; bij A moet de kandidaat van de kant duiken.","Dit is niet toegestaan; bij A moet hij met een voetsprong voorwaarts te water."],"answer":0,"explanation":"Het examenprogramma van A2 zegt: van de kant te water gaan met een sprong, waarbij duiken de voorkeur heeft. Verplicht duiken geldt pas bij B2 en C2. De voetsprong voorwaarts vanaf enige hoogte hoort bij proef A1 Survival, niet bij A2. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A2: sprong toegestaan, duiken heeft de voorkeur","source":{"page":7,"quote":"Van de kant te water gaan met een sprong (duiken heeft de voorkeur)"}},{"id":"EP-0013","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-03","EP-VERG-03"],"question":"Bij het diplomazwemmen voor Zwemdiploma A hangt het zeil voor proef A2 Onder water oriëntatie op 6 meter van de startkant. Wat stelt de examinator vast?","options":["Dit wijkt af: bij A hangt het zeil op 3 meter van de startkant.","Dit klopt: het zeil hangt bij A, B en C op 6 meter van de startkant.","Dit wijkt af: bij A hangt het zeil op 1 meter van de startkant."],"answer":0,"explanation":"In het standaard examenprogramma van Zwemdiploma A hangt het zeil op 3 meter van de startkant; 6 meter geldt voor B2 en C2. De 1 meter komt uit proef C1, waar de kandidaat 1 meter voor het zeil onder water gaat. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"afstand zeil A (3 m) vs B (6 m)","source":{"page":7,"quote":"hangend zeil dat zich op 3 meter van de startkant bevindt"}},{"id":"EP-0014","category":"examenprogrammas","subtopic":"diploma_a","type":"kennis","objectives":["EP-DIPA-04","EP-VERG-05"],"question":"Hoe is proef A3 Conditiezwemmen van Zwemdiploma A opgebouwd?","options":["Vier keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","Zes keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","75 meter schoolslag, gevolgd door 75 meter enkelvoudige rugslag"],"answer":0,"explanation":"A3 bestaat uit 25 meter schoolslag, 25 meter enkelvoudige rugslag, 25 meter schoolslag en 25 meter enkelvoudige rugslag: vier keer 25 meter. Zes keer 25 meter is proef B3 en 75 meter schoolslag plus 75 meter rugslag is proef C3. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: vier keer 25 meter afwisselend schoolslag en enkelvoudige rugslag","source":{"page":7,"quote":"25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, gevolgd door 25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken, gevolgd door 25 meter enkelvoudige rugslag"}},{"id":"EP-0015","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-05","EP-VERG-10"],"question":"Een kandidaat voor Zwemdiploma A zwemt proef A3 Conditiezwemmen. Tijdens welk deel moet hij 1 keer voetwaarts richting de bodem zakken?","options":["Tijdens de tweede 25 meter schoolslag","Tijdens de laatste 25 meter enkelvoudige rugslag","Tijdens de eerste 25 meter schoolslag"],"answer":0,"explanation":"In A3 wordt de tweede 25 meter schoolslag (het derde stuk van 25 meter) onderbroken door 1 keer voetwaarts richting de bodem zakken. De eerste 25 meter schoolslag en de laatste 25 meter rugslag worden niet onderbroken; een onderbreking in de laatste 25 meter rugslag hoort bij B3. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: voetwaarts zakken in de tweede 25 meter schoolslag","source":{"page":7,"quote":"25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken"}},{"id":"EP-0016","category":"examenprogrammas","subtopic":"diploma_a","type":"onjuist","objectives":["EP-DIPA-05","EP-DIPA-04"],"question":"Welke bewering over proef A3 Conditiezwemmen van Zwemdiploma A is NIET juist?","options":["In de laatste 25 meter rugslag maakt de kandidaat 2 keer een halve draai om de lengteas.","De proef begint met 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag.","In totaal zwemt de kandidaat in deze proef 100 meter, in vier stukken van 25 meter."],"answer":0,"explanation":"De 2 halve draaien om de lengteas in de laatste 25 meter rugslag horen bij B3; in A3 is de onderbreking 1 keer voetwaarts richting de bodem zakken. A3 begint wel met 25 meter schoolslag en telt vier keer 25 meter, dus 100 meter conditiezwemmen. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A3: onderbreking is voetwaarts zakken, geen halve draaien","source":{"page":7,"quote":"onderbroken door 1 keer voetwaarts richting de bodem zakken, gevolgd door 25 meter enkelvoudige rugslag"}},{"id":"EP-0017","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-08","EP-VERG-08"],"question":"Een kandidaat voor Zwemdiploma A heeft in proef A5 Je vertrouwd voelen in het water 5 seconden op de buik gedreven en enkele slagen gezwommen. Wat volgt volgens het standaard examenprogramma?","options":["Een halve draai naar rugligging, gevolgd door 10 seconden drijven op de rug","Een halve draai naar rugligging, gevolgd door 15 seconden drijven op de rug","5 meter hoofdwaarts voortbewegen op de rug met gebruik van armen"],"answer":0,"explanation":"A5 gaat na de enkele slagen verder met een halve draai naar rugligging en 10 seconden drijven op de rug. 15 seconden drijven op de rug hoort bij B en C. Het 5 meter hoofdwaarts voortbewegen op de rug is een onderdeel van proef B5. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A5: halve draai naar rugligging en 10 seconden drijven op de rug","source":{"page":7,"quote":"halve draai naar rugligging, gevolgd door 10 seconden drijven op de rug"}},{"id":"EP-0018","category":"examenprogrammas","subtopic":"diploma_a","type":"onjuist","objectives":["EP-DIPA-07","EP-DIPA-08"],"question":"Welke bewering over proef A5 Je vertrouwd voelen in het water van Zwemdiploma A is NIET juist?","options":["De proef begint met in het water springen met een sprong naar keuze.","De proef begint met enkele slagen zwemmen op de buik.","De kandidaat drijft 5 seconden op de buik."],"answer":0,"explanation":"Beginnen met in het water springen met een sprong naar keuze hoort bij proef B5. A5 begint met enkele slagen zwemmen op de buik, aansluitend 5 seconden drijven op de buik; die twee beweringen kloppen dus. §1.1.1, p. 7","ref":"§1.1.1, p. 7","tests":"A5: begint met enkele slagen zwemmen op de buik en 5 seconden drijven op de buik","source":{"page":7,"quote":"Enkele slagen zwemmen op de buik, aansluitend 5 seconden drijven op de buik"}},{"id":"EP-0019","category":"examenprogrammas","subtopic":"diploma_a","type":"casus","objectives":["EP-DIPA-10","EP-VERG-09"],"question":"Een kandidaat voor Zwemdiploma A watertrapt in proef A6 Oriënteren boven water en verplaatsen 60 seconden met armen en benen. Wat moet hij tijdens dit watertrappen ook laten zien?","options":["2 keer, al watertrappend, een hele draai om de lengteas","Watertrappend verplaatsen in meerdere richtingen","Aan het eind 1 keer voetwaarts richting de bodem zakken"],"answer":0,"explanation":"In A6 wordt tijdens de 60 seconden watertrappen 2 keer, al watertrappend, een hele draai om de lengteas gemaakt. Verplaatsen in meerdere richtingen en afronden met voetwaarts richting de bodem zakken horen bij proef B6. §1.1.1, p. 8","ref":"§1.1.1, p. 8","tests":"A6: 2 keer een hele draai om de lengteas tijdens het watertrappen","source":{"page":8,"quote":"waarin 2 keer, al watertrappend, een hele draai om de lengteas gemaakt wordt"}},{"id":"EP-0020","category":"examenprogrammas","subtopic":"diploma_a","type":"onjuist","objectives":["EP-DIPA-09","EP-DIPA-10"],"question":"Welke bewering over proef A6 Oriënteren boven water en verplaatsen van Zwemdiploma A is NIET juist?","options":["De proef wordt afgerond met 30 seconden watertrappen met de benen.","De kandidaat gaat van de kant te water met een sprong naar keuze.","De kandidaat watertrapt 60 seconden met gebruik van armen en benen."],"answer":0,"explanation":"Afronden met 30 seconden watertrappen met de benen hoort bij proef C5 van Zwemdiploma C. A6 bestaat uit van de kant te water gaan met een sprong naar keuze, gevolgd door 60 seconden watertrappen met armen en benen; die beweringen kloppen. §1.1.1, p. 8","ref":"§1.1.1, p. 8","tests":"A6: sprong naar keuze en 60 seconden watertrappen met armen en benen","source":{"page":8,"quote":"Van de kant te water gaan met een sprong naar keuze, gevolgd door 60 seconden watertrappen met gebruik van armen en benen"}},{"id":"EP-0021","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-DIPB-01"],"question":"Een kandidaat voor Zwemdiploma B is bij proef B1 Survival achterwaarts te water gegaan. Wat volgt volgens het standaard examenprogramma aansluitend?","options":["15 seconden watertrappen","15 seconden drijven op de rug","60 seconden watertrappen met verplaatsen in meerdere richtingen"],"answer":0,"explanation":"In B1 volgt na het achterwaarts te water gaan aansluitend 15 seconden watertrappen, daarna 50 meter zwemmen. 15 seconden drijven op de rug hoort bij proef B5 en 60 seconden watertrappen met verplaatsen bij proef B6. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B1: 15 seconden watertrappen na achterwaarts te water gaan","source":{"page":9,"quote":"Achterwaarts te water gaan, aansluitend 15 seconden watertrappen"}},{"id":"EP-0022","category":"examenprogrammas","subtopic":"diploma_b","type":"kennis","objectives":["EP-DIPB-02"],"question":"Waardoor wordt het zwemmen in proef B1 Survival van Zwemdiploma B onderbroken?","options":["1 keer onder een drijvend voorwerp door zwemmen","1 keer over een drijvend voorwerp heen klimmen","1 keer voetwaarts richting de bodem zakken"],"answer":0,"explanation":"De 50 meter in B1 wordt onderbroken door 1 keer onder een drijvend voorwerp door zwemmen. Over een drijvend voorwerp heen klimmen komt alleen in C1 voor. Voetwaarts richting de bodem zakken zit bij B in proef B6. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B1: 50 meter onderbroken door onder een drijvend voorwerp door zwemmen","source":{"page":9,"quote":"50 meter zwemmen, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen"}},{"id":"EP-0023","category":"examenprogrammas","subtopic":"diploma_b","type":"onjuist","objectives":["EP-DIPB-02","EP-DIPB-01"],"question":"Welke bewering over proef B1 Survival van Zwemdiploma B is NIET juist?","options":["Tijdens het zwemmen klimt de kandidaat 1 keer over een drijvend voorwerp heen.","De kandidaat zwemt 50 meter.","De proef wordt afgerond met zelfstandig uit het water op de kant klimmen."],"answer":0,"explanation":"Over een drijvend voorwerp heen klimmen hoort bij C1; in B1 zwemt de kandidaat alleen 1 keer onder een drijvend voorwerp door. B1 bevat wel 50 meter zwemmen en eindigt met zelfstandig uit het water op de kant klimmen. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B1: geen over een drijvend voorwerp klimmen","source":{"page":9,"quote":"50 meter zwemmen, onderbroken door 1 keer onder een drijvend voorwerp door zwemmen, proef afronden met zelfstandig uit het water op de kant klimmen"}},{"id":"EP-0024","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-DIPB-03","EP-VERG-02"],"question":"Bij proef B2 Onder water oriëntatie van Zwemdiploma B gaat een kandidaat met een sprong van de kant te water en zwemt daarna zonder boven te komen door het gat in het zeil. Voldoet het te water gaan aan het standaard examenprogramma?","options":["Nee, bij B2 moet de kandidaat van de kant duiken.","Ja, een sprong mag, al heeft duiken de voorkeur.","Ja, bij B2 is een sprong naar keuze toegestaan."],"answer":0,"explanation":"B2 begint met van de kant duiken; dat is bij B en C verplicht. Een sprong met duiken als voorkeur is alleen toegestaan bij A2. Een sprong naar keuze hoort bij andere proeven, zoals B5 en B6. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B2: van de kant duiken verplicht","source":{"page":9,"quote":"B2 proef Onder water oriëntatie Van de kant duiken, gevolgd door (zonder boven te komen)"}},{"id":"EP-0025","category":"examenprogrammas","subtopic":"diploma_b","type":"kennis","objectives":["EP-DIPB-04","EP-VERG-05"],"question":"Hoe is proef B3 Conditiezwemmen van Zwemdiploma B opgebouwd?","options":["Zes keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","Vier keer 25 meter, afwisselend schoolslag en enkelvoudige rugslag","75 meter schoolslag, gevolgd door 75 meter enkelvoudige rugslag"],"answer":0,"explanation":"B3 bestaat uit zes keer 25 meter, beginnend met schoolslag en afwisselend met enkelvoudige rugslag: 150 meter. Vier keer 25 meter is A3. 75 meter schoolslag plus 75 meter rugslag is ook 150 meter, maar dat is de opbouw van C3. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B3: zes keer 25 meter afwisselend schoolslag en enkelvoudige rugslag","source":{"page":9,"quote":"25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, gevolgd door 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, gevolgd door 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag"}},{"id":"EP-0026","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-DIPB-05","EP-VERG-11"],"question":"Een kandidaat voor Zwemdiploma B zwemt proef B3 Conditiezwemmen. Wat moet hij tijdens de laatste 25 meter enkelvoudige rugslag laten zien?","options":["2 keer een halve draai om de lengteas","1 keer voetwaarts richting de bodem zakken","1 keer hoofdwaarts richting de bodem gaan"],"answer":0,"explanation":"De laatste 25 meter rugslag van B3 wordt onderbroken door 2 keer een halve draai om de lengteas: van rug naar buik en van buik naar rug. Voetwaarts zakken hoort bij A3 en B6; hoofdwaarts richting de bodem gaan bij C3. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B3: 2 halve draaien om de lengteas in de laatste 25 meter rugslag","source":{"page":9,"quote":"onderbroken door 2 keer een halve draai om de lengteas (van rug naar buik en van buik naar rug)"}},{"id":"EP-0027","category":"examenprogrammas","subtopic":"diploma_b","type":"onjuist","objectives":["EP-DIPB-04","EP-DIPB-05"],"question":"Welke bewering over proef B3 Conditiezwemmen van Zwemdiploma B is NIET juist?","options":["De tweede 25 meter schoolslag wordt onderbroken door 1 keer voetwaarts richting de bodem zakken.","De proef begint met 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag.","De laatste 25 meter wordt in enkelvoudige rugslag gezwommen, net als bij proef A3."],"answer":0,"explanation":"Voetwaarts zakken in de tweede 25 meter schoolslag hoort bij A3. B3 begint wel met 25 meter schoolslag en eindigt met 25 meter enkelvoudige rugslag, onderbroken door 2 halve draaien om de lengteas. §1.1.2, p. 9","ref":"§1.1.2, p. 9","tests":"B3: geen voetwaarts zakken in het conditiezwemmen","source":{"page":9,"quote":"gevolgd door 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, gevolgd door 25 meter schoolslag, gevolgd door 25 meter enkelvoudige rugslag, onderbroken door 2 keer een halve draai"}},{"id":"EP-0028","category":"examenprogrammas","subtopic":"diploma_b","type":"kennis","objectives":["EP-DIPB-07"],"question":"Waarmee begint proef B5 Je vertrouwd voelen in het water van Zwemdiploma B?","options":["In het water springen met een sprong naar keuze","Enkele slagen zwemmen en drijven op de buik","Achterwaarts te water gaan, aansluitend watertrappen"],"answer":0,"explanation":"B5 begint met in het water springen met een sprong naar keuze, aansluitend 15 seconden drijven op de rug. Beginnen met enkele slagen zwemmen en drijven op de buik is A5. Achterwaarts te water gaan met aansluitend watertrappen is het begin van proef B1 Survival. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B5: begint met een sprong naar keuze","source":{"page":10,"quote":"In het water springen met een sprong naar keuze, aansluitend 15 seconden drijven op de rug"}},{"id":"EP-0029","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-DIPB-08","EP-DIPB-07"],"question":"Een kandidaat voor Zwemdiploma B is bij proef B5 in het water gesprongen en heeft 15 seconden op de rug gedreven. Wat volgt volgens het standaard examenprogramma?","options":["5 meter hoofdwaarts voortbewegen op de rug met gebruik van armen","30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp","60 seconden watertrappen met verplaatsen in meerdere richtingen"],"answer":0,"explanation":"Na het drijven op de rug volgt in B5 5 meter hoofdwaarts voortbewegen op de rug met gebruik van armen, in de richting van een drijvend voorwerp. 30 seconden verticaal blijven drijven hoort bij C1 en 60 seconden watertrappen met verplaatsen bij B6. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B5: 5 meter hoofdwaarts voortbewegen op de rug richting een drijvend voorwerp","source":{"page":10,"quote":"5 meter hoofdwaarts voortbewegen op de rug met gebruik van armen in de richting van een drijvend voorwerp"}},{"id":"EP-0030","category":"examenprogrammas","subtopic":"diploma_b","type":"kennis","objectives":["EP-DIPB-09"],"question":"Waarmee wordt proef B5 Je vertrouwd voelen in het water van Zwemdiploma B afgesloten?","options":["20 seconden met gebruik van een drijvend voorwerp blijven drijven","30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp","15 seconden drijven op de rug"],"answer":0,"explanation":"B5 eindigt met 20 seconden met gebruik van een drijvend voorwerp blijven drijven. 30 seconden verticaal blijven drijven is het onderdeel van C1. De 15 seconden drijven op de rug komt in B5 juist aan het begin, na de sprong. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B5: afsluiten met 20 seconden drijven met een drijvend voorwerp","source":{"page":10,"quote":"20 seconden met gebruik van een drijvend voorwerp blijven drijven"}},{"id":"EP-0031","category":"examenprogrammas","subtopic":"diploma_b","type":"onjuist","objectives":["EP-DIPB-07","EP-DIPB-08","EP-DIPB-09"],"question":"Welke bewering over proef B5 Je vertrouwd voelen in het water van Zwemdiploma B is NIET juist?","options":["Na de sprong drijft de kandidaat 10 seconden op de rug.","De kandidaat beweegt zich 5 meter hoofdwaarts voort op de rug.","De proef eindigt met blijven drijven met een drijvend voorwerp."],"answer":0,"explanation":"In B5 drijft de kandidaat na de sprong 15 seconden op de rug; 10 seconden is de duur bij A5. Het 5 meter hoofdwaarts voortbewegen op de rug en het afsluitende drijven met gebruik van een drijvend voorwerp horen wel bij B5. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B5: 15 seconden drijven op de rug","source":{"page":10,"quote":"aansluitend 15 seconden drijven op de rug, gevolgd door 5 meter hoofdwaarts voortbewegen"}},{"id":"EP-0032","category":"examenprogrammas","subtopic":"diploma_b","type":"casus","objectives":["EP-DIPB-11"],"question":"Een kandidaat voor Zwemdiploma B heeft in proef B6 Oriënteren boven water en verplaatsen 60 seconden watertrappend in meerdere richtingen verplaatst. Waarmee wordt de proef afgerond?","options":["1 keer voetwaarts richting de bodem zakken","1 keer hoofdwaarts richting de bodem gaan","30 seconden watertrappen met de benen"],"answer":0,"explanation":"B6 wordt afgerond met 1 keer voetwaarts richting de bodem zakken. Hoofdwaarts richting de bodem gaan hoort bij C3. Afronden met 30 seconden watertrappen met de benen is het slot van proef C5. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B6: afronden met voetwaarts richting de bodem zakken","source":{"page":10,"quote":"proef afronden met 1 keer voetwaarts richting de bodem zakken"}},{"id":"EP-0033","category":"examenprogrammas","subtopic":"diploma_b","type":"onjuist","objectives":["EP-DIPB-10","EP-DIPB-11"],"question":"Welke bewering over proef B6 Oriënteren boven water en verplaatsen van Zwemdiploma B is NIET juist?","options":["Tijdens het watertrappen maakt de kandidaat 2 keer een hele draai om de lengteas.","De kandidaat gaat van de kant te water met een sprong naar keuze.","De kandidaat verplaatst zich watertrappend in meerdere richtingen."],"answer":0,"explanation":"De 2 hele draaien om de lengteas tijdens het watertrappen horen bij A6. In B6 gaat de kandidaat met een sprong naar keuze te water en watertrapt hij 60 seconden met verplaatsen in meerdere richtingen. §1.1.2, p. 10","ref":"§1.1.2, p. 10","tests":"B6: watertrappen met verplaatsen, geen hele draaien","source":{"page":10,"quote":"60 seconden watertrappen met verplaatsen in meerdere richtingen, met gebruik van armen en benen"}},{"id":"EP-0034","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-02","EP-DIPC-01"],"question":"Een kandidaat voor Zwemdiploma C is bij proef C1 Survival met een rol voorover te water gegaan en heeft 15 seconden gewatertrapt. Wat volgt volgens het standaard examenprogramma?","options":["30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp","20 seconden met gebruik van een drijvend voorwerp blijven drijven","15 seconden drijven op de rug"],"answer":0,"explanation":"In C1 volgt na het watertrappen 30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp. 20 seconden drijven met een drijvend voorwerp hoort bij B5. 15 seconden drijven op de rug zit bij C in proef C5. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 30 seconden verticaal blijven drijven met een drijvend voorwerp","source":{"page":11,"quote":"30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp"}},{"id":"EP-0035","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-DIPC-02","EP-DIPB-09"],"question":"Wat is een verschil tussen het drijven met gebruik van een drijvend voorwerp bij Zwemdiploma B en bij Zwemdiploma C?","options":["Bij B duurt het 20 seconden, bij C 30 seconden verticaal blijven drijven.","Bij B duurt het 30 seconden, bij C 20 seconden verticaal blijven drijven.","Bij B duurt het 20 seconden, bij C 15 seconden verticaal blijven drijven."],"answer":0,"explanation":"Bij B (proef B5) blijft de kandidaat 20 seconden drijven met een drijvend voorwerp; bij C (proef C1) is dat 30 seconden verticaal blijven drijven. De andere opties draaien de waarden om of gebruiken 15 seconden, de duur van het drijven op de rug. §1.1.2–1.1.3, p. 10 en 11","ref":"§1.1.2–1.1.3, p. 10 en 11","tests":"drijven met drijvend voorwerp: B 20 seconden vs C 30 seconden","source":{"page":11,"quote":"30 seconden verticaal blijven drijven met gebruik van een drijvend voorwerp, gevolgd door"}},{"id":"EP-0036","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-03"],"question":"Wat volgt in proef C1 Survival van Zwemdiploma C direct op het verticaal blijven drijven met gebruik van een drijvend voorwerp?","options":["5 meter voortbewegen op de rug met gebruik van armen","15 seconden drijven op de rug","1 keer hoofdwaarts richting de bodem gaan"],"answer":0,"explanation":"Na de 30 seconden verticaal drijven volgt in C1 5 meter voortbewegen op de rug met gebruik van armen. 15 seconden drijven op de rug komt bij C voor in proef C5. Hoofdwaarts richting de bodem gaan is de onderbreking in proef C3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 5 meter voortbewegen op de rug na het verticaal drijven","source":{"page":11,"quote":"gevolgd door 5 meter voortbewegen op de rug met gebruik van armen"}},{"id":"EP-0037","category":"examenprogrammas","subtopic":"vergelijking_abc","type":"verschil","objectives":["EP-DIPC-03","EP-DIPB-08"],"question":"Wat is volgens Bijlage 2 een verschil tussen onderdeel B.9 en onderdeel C.11 (5 meter voortbewegen op de rug met gebruik van de armen)?","options":["C.11 wordt gekleed uitgevoerd, B.9 niet.","B.9 wordt gekleed uitgevoerd, C.11 niet.","Bij B.9 is de afstand 5 meter, bij C.11 15 meter."],"answer":0,"explanation":"Bijlage 2 noemt C.11 '5 meter gekleed voortbewegen op de rug met gebruik van de armen'; B.9 heet '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen', zonder 'gekleed'. Andersom klopt dus niet. De afstand is bij beide 5 meter; 15 meter is de crawlafstand van C. Bijlage 2","ref":"Bijlage 2","tests":"B.9 vs C.11: C.11 gekleed","source":{"page":"Bijlage 2","quote":"C.11 5 meter gekleed voortbewegen op de rug met gebruik van de armen"}},{"id":"EP-0038","category":"examenprogrammas","subtopic":"diploma_c","type":"kennis","objectives":["EP-DIPC-04"],"question":"Hoe gaat de kandidaat in proef C1 Survival van Zwemdiploma C te water voordat hij de 100 meter zwemt?","options":["Met een sprong waarbij het hoofd boven water blijft","Met een rol voorover, net als aan het begin van C1","Door van de kant in het water te duiken"],"answer":0,"explanation":"Vóór de 100 meter gaat de kandidaat te water met een sprong waarbij het hoofd boven water blijft. De rol voorover hoort alleen bij het begin van C1, gevolgd door watertrappen. Van de kant duiken hoort bij C bij proef C2 Onder water oriëntatie. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: sprong waarbij het hoofd boven water blijft vóór de 100 meter","source":{"page":11,"quote":"Te water gaan met een sprong waarbij het hoofd boven water blijft, aansluitend 100 meter zwemmen"}},{"id":"EP-0039","category":"examenprogrammas","subtopic":"diploma_c","type":"casus","objectives":["EP-DIPC-05"],"question":"Een kandidaat voor Zwemdiploma C zwemt in proef C1 Survival de 100 meter. Waardoor moet dit zwemmen volgens het standaard examenprogramma worden onderbroken?","options":["1 keer onder een drijvend voorwerp door en 1 keer eroverheen klimmen","Alleen 1 keer onder een drijvend voorwerp door zwemmen","1 keer hoofdwaarts richting de bodem gaan"],"answer":0,"explanation":"De 100 meter in C1 wordt onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen. Alleen onderdoor zwemmen is de onderbreking bij B1. Hoofdwaarts richting de bodem gaan hoort bij C3. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 100 meter onderbroken door onder en over een drijvend voorwerp","source":{"page":11,"quote":"onderbroken door 1 keer onder een drijvend voorwerp door te zwemmen en 1 keer over een drijvend voorwerp heen te klimmen"}},{"id":"EP-0040","category":"examenprogrammas","subtopic":"diploma_c","type":"onjuist","objectives":["EP-DIPC-05","EP-DIPC-04"],"question":"Welke bewering over het 100 meter zwemmen in proef C1 Survival van Zwemdiploma C is NIET juist?","options":["Het zwemmen wordt onderbroken door 1 keer voetwaarts richting de bodem zakken.","Het wordt voorafgegaan door een sprong waarbij het hoofd boven water blijft.","Het wordt gevolgd door zelfstandig uit het water op de kant klimmen."],"answer":0,"explanation":"Voetwaarts richting de bodem zakken komt bij C niet voor; dat hoort bij A3 en B6. De 100 meter wordt wel voorafgegaan door een sprong waarbij het hoofd boven water blijft en gevolgd door zelfstandig uit het water op de kant klimmen. §1.1.3, p. 11","ref":"§1.1.3, p. 11","tests":"C1: 100 meter na sprong met hoofd boven water, daarna uit het water klimmen","source":{"page":11,"quote":"100 meter zwemmen, onderbroken door 1 keer onder een drijvend voorwerp door
