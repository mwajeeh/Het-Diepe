0,"explanation":"Bij achterwaarts te water gaan heeft de kandidaat geen zicht op de valrichting. Een draai om de breedteas hoort bij de rol voorover van C1. Dat de voeten als eerste het water raken, hoort bij de voetsprong voorwaarts van A1. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: geen zicht op valrichting","source":{"page":22,"quote":"De kandidaat heeft geen zicht op de valrichting."}},{"id":"NO-0028","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-12"],"question":"Julia en Milan doen het onderdeel 'achterwaarts te water gaan, gekleed' voor Zwemdiploma B.\n- Julia zit op de lage kant met haar rug naar het water. Zij laat zich achterover vallen.\n- Milan staat op de lage kant met zijn rug naar het water. Hij springt achterwaarts het water in.\nWelke kandidaat voldoet aan de normering?","options":["Julia","Milan","Julia en Milan"],"answer":0,"explanation":"Julia voldoet: te water gaan mag zittend of staand, en er is sprake van een valbeweging. Milan voldoet niet: springen is niet toegestaan, ook al heeft hij geen zicht op de valrichting. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: valbeweging, springen niet toegestaan","source":{"page":22,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."},"rev":2},{"id":"NO-0029","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-12","NO-SURV-13","NO-SURV-11"],"question":"Onderdeel 'achterwaarts te water gaan, gekleed', Zwemdiploma B:\nWelke uitspraak over dit onderdeel is NIET juist?","options":["Het mag vanaf een drijvend voorwerp.","Het mag zittend of staand.","Het mag met een kleine sprong."],"answer":2,"explanation":"Bij achterwaarts te water gaan is er sprake van een valbeweging; springen is niet toegestaan, ook geen kleine sprong. Het onderdeel mag wel vanaf een lage kant of een drijvend voorwerp, en zowel zittend als staand. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: valbeweging, springen niet toegestaan","source":{"page":22,"quote":"Er is sprake van een valbeweging, springen is niet toegestaan."},"rev":2},{"id":"NO-0030","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-15"],"question":"Proef C1 Survival:\nHoe gaat de kandidaat aan het begin gekleed te water?","options":["Met een rol voorover","Met een voetsprong voorwaarts","Achterwaarts, met een valbeweging"],"answer":0,"explanation":"De C1 proef Survival begint met een rol voorover. De voetsprong voorwaarts hoort bij A1, en achterwaarts te water gaan hoort bij B1. §2.1.1–2.1.3, p. 17, 21 en 27","ref":"§2.1.1–2.1.3, p. 17, 21 en 27","tests":"te water gaan bij survival: A voetsprong, B achterwaarts, C rol","source":{"page":27,"quote":"Met een rol voorover te water gaan, gekleed"},"rev":2},{"id":"NO-0031","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-13"],"question":"Proef B1 Survival, onderdeel 'achterwaarts te water gaan, gekleed':\nVanaf waar mag dit onderdeel volgens de normering worden uitgevoerd?","options":["Vanaf een lage kant of een drijvend voorwerp","Vanaf een hoge kant of een startblok","Vanaf een startblok of een veilige verhoging"],"answer":0,"explanation":"Achterwaarts te water gaan mag vanaf een lage kant of een drijvend voorwerp worden uitgevoerd. Een hoge kant, een startblok of een veilige verhoging hoort bij de voetsprong voorwaarts van A1, vanaf minimaal 30 centimeter boven de waterlijn. §2.1.1–2.1.2, p. 17 en 22","ref":"§2.1.1–2.1.2, p. 17 en 22","tests":"hoogte te water gaan: A1 30 cm vs B1 lage kant of drijvend voorwerp","source":{"page":22,"quote":"Dit onderdeel mag vanaf een lage kant of een drijvend voorwerp worden uitgevoerd."},"rev":2},{"id":"NO-0032","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-14"],"question":"Proef B1 Survival:\nWat vraagt de normering bij het onderdeel 'gekleed onder een drijvend voorwerp door zwemmen'?","options":["De kandidaat zwemt met redelijke voortstuwing onder water.","De kandidaat duikt eerst van de kant.","De kandidaat gaat 1 meter voor het voorwerp onder water."],"answer":0,"explanation":"De kandidaat zwemt met een redelijke voortstuwing onder water onder een voorwerp door, bijvoorbeeld een mat of bootje. Van de kant duiken hoort bij Onder water oriëntatie. Minimaal 1 meter vooraf onder water gaan is een eis bij het zeil in C1. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"onder drijvend voorwerp door: redelijke voorstuwing onder water","source":{"page":22,"quote":"De kandidaat zwemt met een redelijke voorstuwing onder water onder een voorwerp"},"rev":2},{"id":"NO-0033","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-14"],"question":"Onderdeel 'gekleed onder een drijvend voorwerp door zwemmen', Zwemdiploma C:\nWelke uitspraak is NIET juist?","options":["De kandidaat zwemt met redelijke voortstuwing onder water.","Het voorwerp is minimaal 70 centimeter breed.","De kandidaat gaat 1 meter voor het voorwerp onder water."],"answer":2,"explanation":"Minimaal 1 meter vooraf onder water gaan is een eis bij het zeil, niet bij het drijvend voorwerp. De kandidaat zwemt wel met een redelijke voortstuwing onder water onder het voorwerp door, en het voorwerp is minimaal 70 centimeter breed. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"onder drijvend voorwerp door: redelijke voorstuwing onder water","source":{"page":28,"quote":"De kandidaat zwemt met een redelijke voorstuwing onder water onder een voorwerp (bijvoorbeeld een mat of bootje) door."},"rev":2},{"id":"NO-0034","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-21","NO-SURV-14"],"question":"Proef C1 Survival:\nDe kandidaat zwemt 100 meter gekleed. Onderweg ligt er een drijvend voorwerp. Wat doet hij daar?","options":["1 keer eronderdoor zwemmen en 1 keer eroverheen klimmen","2 keer eronderdoor zwemmen en 1 keer eroverheen klimmen","1 keer eronderdoor zwemmen en niet eroverheen klimmen"],"answer":0,"explanation":"Bij C1 wordt de 100 meter zwemmen onderbroken door 1 keer onder een drijvend voorwerp door zwemmen en 1 keer eroverheen klimmen. Alleen 1 keer eronderdoor zwemmen hoort bij B1. 2 keer eronderdoor zwemmen komt niet voor. §2.1.2–2.1.3, p. 21 en 27","ref":"§2.1.2–2.1.3, p. 21 en 27","tests":"drijvend voorwerp: B1 onderdoor, C1 ook overheen klimmen","source":{"page":27,"quote":"1 keer gekleed over een drijvend voorwerp heen klimmen"},"rev":2},{"id":"NO-0035","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-15"],"question":"Liam en Zoë doen het onderdeel 'met een rol voorover te water gaan, gekleed' voor Zwemdiploma C.\n- Liam maakt een draai om de breedteas. Hij komt schuin en ver van de kant in het water terecht.\n- Zoë maakt een draai om de breedteas. Zij komt recht en dicht bij de kant in het water terecht.\nWelke kandidaat voldoet aan de normering?","options":["Liam","Zoë","Liam en Zoë"],"answer":2,"explanation":"Liam en Zoë voldoen allebei. Er moet sprake zijn van een draai om de breedteas, en de plaats waar de kandidaat in het water terechtkomt, is niet van belang. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: plaats in het water niet van belang","source":{"page":27,"quote":"De plaats waar de kandidaat in het water terecht komt, is niet van belang."},"rev":2},{"id":"NO-0036","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-15","NO-SURV-16"],"question":"Onderdeel 'met een rol voorover te water gaan, gekleed', Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: Er is sprake van een draai om de breedteas.\nStelling 2: De kandidaat doet de rol vanaf minimaal 30 centimeter boven de waterlijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij de rol voorover is er sprake van een draai om de breedteas. Stelling 2 is onjuist: de rol mag vanaf een (lage) kant of een drijvend voorwerp; minimaal 30 centimeter is de eis bij de voetsprong voorwaarts van A1. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: vanaf (lage) kant of drijvend voorwerp","source":{"page":27,"quote":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd."},"rev":2},{"id":"NO-0037","category":"normering","subtopic":"survival","type":"casus","objectives":["NO-SURV-16"],"question":"Proef C1 Survival, onderdeel 'met een rol voorover te water gaan, gekleed':\nEen kandidaat doet de rol vanaf een drijvend voorwerp. De draai om de breedteas is correct. Voldoet dit?","options":["Ja, een drijvend voorwerp is toegestaan.","Nee, de rol moet vanaf de kant gebeuren.","Nee, de rol moet vanaf minimaal 30 centimeter hoogte gebeuren."],"answer":0,"explanation":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd. De kant is dus niet verplicht. Minimaal 30 centimeter hoogte is de eis bij de voetsprong voorwaarts van A1. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"rol voorover: vanaf (lage) kant of drijvend voorwerp","source":{"page":27,"quote":"De rol voorover mag vanaf een (lage) kant of een drijvend voorwerp worden uitgevoerd."},"rev":2},{"id":"NO-0038","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-17"],"question":"Proef C1 Survival, onderdeel 'gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp':\nWelke houding hoort daarbij?","options":["Knieën opgetrokken, ellebogen tegen het lichaam","Benen gestrekt, armen gespreid","Benen bewegen, armen ondersteunen onder water"],"answer":0,"explanation":"Bij verticaal blijven drijven is het hoofd boven water en de houding verticaal, zijn de knieën opgetrokken en zijn de ellebogen tegen het lichaam. Gestrekte benen en gespreide armen passen daar niet bij. Bewegende benen met ondersteunende armen horen bij watertrappen. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"verticaal drijven: hoofd boven, knieën opgetrokken, ellebogen tegen lichaam","source":{"page":27,"quote":"De ellebogen zijn tegen het lichaam."},"rev":2},{"id":"NO-0039","category":"normering","subtopic":"survival","type":"onjuist","objectives":["NO-SURV-18"],"question":"Onderdeel 'gekleed verticaal blijven drijven met gebruik van een drijvend voorwerp', Zwemdiploma C:\nWelke uitspraak is NIET juist?","options":["De onderbenen mogen gekruist zijn.","De keuze voor het drijvend voorwerp is vrij.","De kandidaat mag zich rustig verplaatsen."],"answer":2,"explanation":"Bij verticaal blijven drijven blijft de kandidaat op de plaats; verplaatsen hoort er niet bij. De onderbenen mogen wel gekruist of naast elkaar zijn, en de keuze voor het drijvend voorwerp is vrij. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"verticaal drijven: op de plaats, onderbenen vrij, voorwerp vrij","source":{"page":27,"quote":"De keuze voor het drijvend voorwerp is vrij. • De kandidaat blijft op de plaats."},"rev":2},{"id":"NO-0040","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-19","NO-SURV-20"],"question":"Onderdeel '5 meter gekleed voortbewegen op de rug met gebruik van de armen', Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: De benen liggen stil.\nStelling 2: De kandidaat mag zich alleen in de richting van het hoofd verplaatsen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: de benen liggen stil en de verplaatsing gebeurt door gebruik van de armen/handen. Stelling 2 is onjuist: bij Zwemdiploma C is verplaatsing zowel in de richting van het hoofd als de voeten toegestaan. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"voortbewegen op de rug C1: horizontaal, benen stil, armen/handen","source":{"page":27,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen."},"rev":2},{"id":"NO-0041","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-19"],"question":"Proef C1 Survival, Zwemdiploma C:\nSanne en Mohammed doen het onderdeel '5 meter gekleed voortbewegen op de rug met gebruik van de armen'.\n- Sanne ligt horizontaal. Zij maakt een lichte beenslag en beweegt de armen onder water.\n- Mohammed ligt horizontaal. Hij houdt de benen stil en beweegt de armen onder water.\nWelke kandidaat voldoet aan de normering?","options":["Sanne","Mohammed","Sanne en Mohammed"],"answer":1,"explanation":"Mohammed voldoet: de benen liggen stil en de verplaatsing gebeurt door gebruik van de armen/handen. Sanne voldoet niet: bij dit onderdeel liggen de benen stil, dus een beenslag mag niet. §2.1.3, p. 27","ref":"§2.1.3, p. 27","tests":"voortbewegen op de rug C1: horizontaal, benen stil, armen/handen","source":{"page":27,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen."},"rev":2},{"id":"NO-0042","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-20"],"question":"Onderdeel '5 meter gekleed voortbewegen op de rug met gebruik van de armen', Zwemdiploma C:\nIn welke richting mag de kandidaat zich verplaatsen?","options":["In de richting van het hoofd en van de voeten","Alleen in de richting van het hoofd","Alleen in de richting van de voeten"],"answer":0,"explanation":"Bij Zwemdiploma C is verplaatsing zowel in de richting van het hoofd als de voeten toegestaan. Alleen in de richting van het hoofd is de normering bij B5, het hoofdwaarts voortbewegen. Alleen in de richting van de voeten is te beperkt, want beide richtingen mogen. §2.1.2–2.1.3, p. 25 en 28","ref":"§2.1.2–2.1.3, p. 25 en 28","tests":"voortbewegen op de rug: C1 richting hoofd en voeten","source":{"page":28,"quote":"Verplaatsing is zowel in de richting van het hoofd als de voeten toegestaan."},"rev":2},{"id":"NO-0043","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-21"],"question":"Onderdeel 'gekleed over een drijvend voorwerp heen klimmen':\nWelke stelling is juist?\nStelling 1: Dit onderdeel hoort bij proef B1 en bij proef C1 Survival.\nStelling 2: De kandidaat klimt op een eigen manier op het voorwerp.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: dit onderdeel komt alleen in proef C1 Survival voor; in proef B1 zwemt de kandidaat alleen onder een drijvend voorwerp door. Stelling 2 is juist: de kandidaat klimt op een eigen manier uit het water op een drijvend voorwerp. §2.1.2–2.1.3, p. 21 en 28","ref":"§2.1.2–2.1.3, p. 21 en 28","tests":"over drijvend voorwerp heen klimmen: op eigen manier (alleen C1)","source":{"page":28,"quote":"De kandidaat klimt op een eigen manier uit het water op een drijvend voorwerp."},"rev":2},{"id":"NO-0044","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-22"],"question":"Proef C1 Survival, Zwemdiploma C:\nLuuk en Yara doen het onderdeel 'gekleed te water gaan met een sprong waarbij het hoofd boven water blijft'.\n- Luuk springt vanaf de lage kant. Zijn hoofd blijft boven water.\n- Yara springt vanaf een drijvend voorwerp. Haar hoofd gaat even helemaal onder water.\nWelke kandidaat voldoet aan de normering?","options":["Luuk","Yara","Luuk en Yara"],"answer":0,"explanation":"Luuk voldoet: het hoofd blijft boven water, en het onderdeel mag vanaf een (lage) kant. Yara voldoet niet: springen vanaf een drijvend voorwerp mag wel, maar het hoofd moet boven water blijven. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"sprong C1: hoofd blijft boven water","source":{"page":28,"quote":"Het hoofd blijft boven water."},"rev":2},{"id":"NO-0045","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-02","NO-SURV-22"],"question":"Onderdeel 'voetsprong voorwaarts, gekleed', Zwemdiploma A:\nWat doet de kandidaat na de sprong?","options":["Hij gaat helemaal onder water.","Hij houdt het hoofd boven water.","Hij zwemt direct onder water verder."],"answer":0,"explanation":"Bij de gekleed voetsprong voorwaarts gaat de kandidaat na de sprong helemaal onder water. Het hoofd boven water houden is de normering van de sprong in proef C1 Survival. Direct onder water verder zwemmen hoort bij proef A2 Onder water oriëntatie. §2.1.1 en §2.1.3, p. 17 en 28","ref":"§2.1.1 en §2.1.3, p. 17 en 28","tests":"sprong A1 (onder water) vs C1 (hoofd boven water)","source":{"page":17,"quote":"De kandidaat gaat na de sprong helemaal onder water."},"rev":2},{"id":"NO-0046","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-23"],"question":"Onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen', Zwemdiploma C:\nHoeveel meter voor het zeil gaat de kandidaat minimaal onder water?","options":["1 meter","3 meter","6 meter"],"answer":0,"explanation":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan. 3 meter en 6 meter zijn de afstanden van het zeil tot de startkant bij de proef Onder water oriëntatie van Zwemdiploma A en B. §2.1.3, p. 28","ref":"§2.1.3, p. 28","tests":"zeil C1: minimaal 1 m voor het zeil onder water","source":{"page":28,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."}},{"id":"NO-0047","category":"normering","subtopic":"survival","type":"kandidaten","objectives":["NO-SURV-23"],"question":"Proef C1 Survival, Zwemdiploma C:\nDaan en Fatima doen het onderdeel 'gekleed onder water gaan en door een gat in een verticaal hangend zeil zwemmen'.\n- Daan gaat 2 meter voor het zeil onder water. Hij zwemt door het gat.\n- Fatima gaat een halve meter voor het zeil onder water. Zij zwemt door het gat.\nWelke kandidaat voldoet aan de normering?","options":["Daan","Fatima","Daan en Fatima"],"answer":0,"explanation":"Daan voldoet: de kandidaat moet minimaal 1 meter voor het zeil onder water gaan. Fatima voldoet niet: een halve meter is te weinig, ook al zwemt zij door het gat. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"zeil C1: minimaal 1 m voor het zeil onder water","source":{"page":28,"quote":"De kandidaat moet minimaal 1 meter voor het zeil onder water gaan."},"rev":2},{"id":"NO-0048","category":"normering","subtopic":"survival","type":"stellingen","objectives":["NO-SURV-24","NO-SURV-10"],"question":"Proef C1 Survival, Zwemdiploma C:\nWelke stelling is juist?\nStelling 1: De proef is in water waar de kandidaat niet kan staan.\nStelling 2: Bij het onderdeel met het zeil is het water minimaal 1,8 meter diep.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de proef C1 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan (p. 27). Stelling 2 is juist: bij het zeil geldt een waterdiepte van minimaal 1,8 meter. §2.1.3, p. 27–28","ref":"§2.1.3, p. 27–28","tests":"zeil C1: waterdiepte minimaal 1,8 m","source":{"page":28,"quote":"Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0049","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-11"],"question":"Proef Survival:\nBij welk onderdeel staat in de normering dat het te water gaan zittend of staand mag?","options":["Gekleed achterwaarts te water gaan","Gekleed voetsprong voorwaarts","Gekleed met een rol voorover te water gaan"],"answer":0,"explanation":"Bij gekleed achterwaarts te water gaan (B1) staat dat te water gaan zittend of staand mag. De voetsprong voorwaarts (A1) is een sprong vanaf minimaal 30 centimeter. Voor de rol voorover (C1) vraagt de normering een draai om de breedteas. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"achterwaarts te water: zittend of staand","source":{"page":22,"quote":"Te water gaan mag zittend of staand worden uitgevoerd."},"rev":2},{"id":"NO-0050","category":"normering","subtopic":"survival","type":"kennis","objectives":["NO-SURV-15","NO-SURV-12"],"question":"Onderdeel 'met een rol voorover te water gaan, gekleed', Zwemdiploma C:\nWelke beweging maakt de kandidaat?","options":["Een draai om de breedteas","Een valbeweging","Een draai om de lengteas"],"answer":0,"explanation":"Bij de rol voorover is er sprake van een draai om de breedteas. Een valbeweging hoort bij gekleed achterwaarts te water gaan in proef B1. Een draai om de lengteas hoort bij andere onderdelen, zoals de halve draai om de lengteas. §2.1.2–2.1.3, p. 22 en 27","ref":"§2.1.2–2.1.3, p. 22 en 27","tests":"B1 valbeweging vs C1 draai om de breedteas","source":{"page":27,"quote":"Er is sprake van een draai om de breedteas."},"rev":2},{"id":"NO-0200","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-01"],"question":"Proef B2 Onder water oriëntatie:\nHet diepe deel van een zwembad is 1,5 meter diep. De kandidaten kunnen daar niet staan. Mag de proef daar worden afgenomen?","options":["Nee, het water moet minimaal 1,8 meter diep zijn.","Ja, de kandidaten kunnen daar niet staan.","Ja, als het zeil minimaal 1,8 bij 1,8 meter is."],"answer":0,"explanation":"Onder water oriëntatie wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter, dus 1,5 meter is te weinig. 'Waar de kandidaat niet kan staan' is de eis bij andere proeven, zoals Oriënteren boven water en verplaatsen. De afmeting van het zeil is een aparte eis en vervangt de diepte-eis niet. §2.1.2, p. 22","ref":"§2.1.2, p. 22","tests":"Onder water oriëntatie: waterdiepte minimaal 1,8 meter","source":{"page":22,"quote":"De proef wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0201","category":"normering","subtopic":"onder_water","type":"kandidaten","objectives":["NO-ONDW-02"],"question":"Noor en Daan doen het onderdeel 'te water gaan met een sprong' voor Zwemdiploma A.\n- Noor springt vanuit staande positie van de bassinrand. Zij gaat daarna geheel onder water.\n- Daan duikt vanuit staande positie van het startblok. Hij gaat daarna geheel onder water.\nWelke kandidaat voldoet aan de normering?","options":["Noor","Daan","Noor en Daan"],"answer":2,"explanation":"Noor en Daan voldoen allebei. Bij A2 mag de kandidaat te water gaan met een sprong, maar duiken heeft de voorkeur. Allebei starten ze vanuit staande positie vanaf bassinrand of startblok en gaan ze geheel onder water. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A2: sprong toegestaan, duiken heeft de voorkeur","source":{"page":18,"quote":"Duiken heeft de voorkeur. • Vanuit staande positie starten vanaf bassinrand of startblok."},"rev":2},{"id":"NO-0202","category":"normering","subtopic":"onder_water","type":"stellingen","objectives":["NO-ONDW-03"],"question":"Onderdeel 'van de kant in het water duiken', Zwemdiploma B:\nWelke stelling is juist?\nStelling 1: De kandidaat mag zittend starten.\nStelling 2: De handen raken als eerste het wateroppervlak.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de kandidaat start vanuit staande positie vanaf bassinrand of startblok. Stelling 2 is juist: de handen raken als eerste het wateroppervlak, daarna volgen de armen en het hoofd. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"B2/C2 duiken: staande start, handen eerst","source":{"page":23,"quote":"De handen raken als eerste het wateroppervlak, daarna volgen het armen en het hoofd."},"rev":2},{"id":"NO-0203","category":"normering","subtopic":"onder_water","type":"stellingen","objectives":["NO-ONDW-02","NO-ONDW-03"],"question":"Proef Onder water oriëntatie:\nWelke stelling over het te water gaan is juist?\nStelling 1: Bij Zwemdiploma A mag de kandidaat met een sprong te water gaan.\nStelling 2: Bij Zwemdiploma C duikt de kandidaat van de kant.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: bij A2 gaat de kandidaat te water met een sprong, maar duiken heeft de voorkeur. Stelling 2 is ook juist: bij C2 is het van de kant duiken, zonder boven te komen. §2.1.1 en 2.1.3, p. 18 en 29","ref":"§2.1.1 en 2.1.3, p. 18 en 29","tests":"te water gaan A2 (sprong) vs B2/C2 (duiken)","source":{"page":29,"quote":"Van de kant duiken, direct gevolgd door (zonder boven te komen)"},"rev":2},{"id":"NO-0204","category":"normering","subtopic":"onder_water","type":"kandidaten","objectives":["NO-ONDW-04"],"question":"Sem en Fatima doen het onderdeel '6 meter onder water zwemmen' voor Zwemdiploma B.\n- Sem komt na de duik kort boven om adem te halen. Daarna zwemt hij onder water door het gat in het zeil.\n- Fatima blijft na de duik onder water. Zij zwemt met schoolslag door het gat in het zeil.\nWelke kandidaat voldoet aan de normering?","options":["Sem","Fatima","Sem en Fatima"],"answer":1,"explanation":"Fatima voldoet: de kandidaat blijft tijdens het onder water zwemmen geheel onder water, en de manier van zwemmen is vrij. Sem voldoet niet, want hij komt tussendoor boven. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"onder water zwemmen: geheel onder water blijven","source":{"page":23,"quote":"De kandidaat blijft tijdens het onder water zwemmen geheel onder water."},"rev":2},{"id":"NO-0205","category":"normering","subtopic":"onder_water","type":"stellingen","objectives":["NO-ONDW-05","NO-ONDW-04"],"question":"Proef A2, onderdeel '3 meter onder water zwemmen':\nWelke stelling is juist?\nStelling 1: De afstand van de sprong telt mee in de 3 meter.\nStelling 2: De kandidaat mag zelf kiezen hoe hij onder water zwemt.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: de afstand die met springen of duiken wordt overbrugd, telt mee in de totale afstand. Stelling 2 is ook juist: de manier waarop onder water wordt gezwommen, is vrij. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"afstand sprong/duik telt mee in onder water zwemmen","source":{"page":18,"quote":"De afstand die wordt overbrugd met springen of duiken wordt in de totale afstand"},"rev":2},{"id":"NO-0206","category":"normering","subtopic":"onder_water","type":"casus","objectives":["NO-ONDW-05"],"question":"Proef B2 Onder water oriëntatie, onderdeel '6 meter onder water zwemmen':\nEen kandidaat maakt een verre duik. Daarna zwemt hij nog een klein stuk onder water door het gat in het zeil. Hoe telt de afstand van de duik?","options":["De duik telt mee in de 6 meter.","De duik telt niet mee in de 6 meter.","De duik telt alleen mee bij Zwemdiploma A."],"answer":0,"explanation":"De afstand die met het duiken wordt overbrugd, telt mee in de totale afstand van 6 meter. Na de duik hoeft hij dus niet nog 6 meter te zwemmen. Deze regel geldt niet alleen bij Zwemdiploma A, maar ook bij B. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"afstand sprong/duik telt mee in onder water zwemmen","source":{"page":23,"quote":"De afstand die wordt overbrugd met het duiken wordt in de totale afstand meegeteld."},"rev":2},{"id":"NO-0207","category":"normering","subtopic":"onder_water","type":"stellingen","objectives":["NO-ONDW-06"],"question":"Proef C2 Onder water oriëntatie:\nWelke stelling is juist?\nStelling 1: Na het zeil komt de kandidaat boven water op een plek naar eigen keuze.\nStelling 2: De afstand van de duik telt mee in de totale afstand.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de kandidaat komt boven water in of op een vooraf afgesproken plek, zoals een hoepel, mat of afgebakend gebied. Stelling 2 is juist: de afstand die met het duiken wordt overbrugd, telt mee in de totale afstand. §2.1.3, p. 29","ref":"§2.1.3, p. 29","tests":"C2: bovenkomen in vooraf afgesproken plek (wak)","source":{"page":29,"quote":"De kandidaat komt boven water in/op een vooraf afgesproken plek (hoepel, mat, afgebakend"},"rev":2},{"id":"NO-0208","category":"normering","subtopic":"onder_water","type":"verschil","objectives":["NO-ONDW-06","NO-ONDW-03"],"question":"Proef Onder water oriëntatie:\nWelk onderdeel heeft Zwemdiploma C wel en Zwemdiploma B niet?","options":["Boven water komen in een 'wak'","Van de kant in het water duiken","Onder water zwemmen door een gat in een verticaal hangend zeil"],"answer":0,"explanation":"Alleen bij C2 komt de kandidaat na het onder water zwemmen boven in een 'wak', een vooraf afgesproken plek. Van de kant duiken en door het gat in het zeil zwemmen horen bij B2 én bij C2. §2.1.2–2.1.3, p. 23 en 29","ref":"§2.1.2–2.1.3, p. 23 en 29","tests":"C2 extra onderdeel: bovenkomen in een wak","source":{"page":29,"quote":"6 meter onder water zwemmen en aansluitend boven water komen in een ‘wak’"},"rev":2},{"id":"NO-0209","category":"normering","subtopic":"onder_water","type":"kandidaten","objectives":["NO-ONDW-07"],"question":"Lotte en Mohammed doen het onderdeel 'voetwaarts richting de bodem zakken' voor Zwemdiploma B.\n- Lotte zakt met haar armen gestrekt boven het hoofd. Haar handen blijven boven water.\n- Mohammed zakt met zijn armen gestrekt boven het hoofd. Hij gaat geheel onder water.\nWelke kandidaat voldoet aan de normering?","options":["Lotte","Mohammed","Lotte en Mohammed"],"answer":1,"explanation":"Mohammed voldoet: de armen zijn gestrekt boven het hoofd en de kandidaat gaat geheel onder water. Lotte voldoet niet: haar handen blijven boven water, dus zij gaat niet geheel onder water. §2.1.2, p. 26","ref":"§2.1.2, p. 26","tests":"voetwaarts zakken: geheel onder water, armen gestrekt","source":{"page":26,"quote":"Armen zijn gestrekt boven het hoofd en blijven onder water ook gestrekt. • De kandidaat gaat geheel onder water."},"rev":2},{"id":"NO-0210","category":"normering","subtopic":"onder_water","type":"kennis","objectives":["NO-ONDW-08"],"question":"Proef A3 Conditiezwemmen:\nIn welke waterdiepte doet de kandidaat het onderdeel 'voetwaarts richting de bodem zakken'?","options":["In water van minimaal 1,8 meter diep","In water van minimaal 1,4 meter diep","In water waar de kandidaat niet kan staan"],"answer":0,"explanation":"Voetwaarts richting de bodem zakken gebeurt bij A3 in een waterdiepte van minimaal 1,8 meter. 'Waar de kandidaat niet kan staan' is de eis bij onder meer A5 en A6. 1,4 meter is de minimale lengte van het drijvend voorwerp, geen waterdiepte. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"A3 voetwaarts zakken: minimaal 1,8 m waterdiepte","source":{"page":19,"quote":"Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0211","category":"normering","subtopic":"onder_water","type":"kennis","objectives":["NO-ONDW-07","NO-ONDW-08"],"question":"Zwemdiploma B:\nIn welke proef zit het onderdeel 'voetwaarts richting de bodem zakken'?","options":["Oriënteren boven water en verplaatsen","Conditiezwemmen","Je vertrouwd voelen in het water"],"answer":0,"explanation":"Bij Zwemdiploma B wordt de proef B6 Oriënteren boven water en verplaatsen afgerond met 1 keer voetwaarts richting de bodem zakken. Bij Zwemdiploma A zit dit onderdeel in A3 Conditiezwemmen; B3 heeft het niet. In B5 Je vertrouwd voelen in het water komt het ook niet voor. §2.1.1–2.1.2, p. 18 en 26","ref":"§2.1.1–2.1.2, p. 18 en 26","tests":"voetwaarts zakken: A3 vs B6","source":{"page":26,"quote":"1 keer voetwaarts richting de bodem zakken"},"rev":2},{"id":"NO-0212","category":"normering","subtopic":"onder_water","type":"kandidaten","objectives":["NO-ONDW-10"],"question":"Sanne en Luuk doen het onderdeel 'hoofdwaarts richting de bodem gaan' voor Zwemdiploma C.\n- Sanne gaat schuin hoofdwaarts naar de bodem. Haar benen komen geheel onder water.\n- Luuk gaat verticaal hoofdwaarts naar de bodem. Zijn voeten blijven boven water.\nWelke kandidaat voldoet aan de normering?","options":["Sanne","Luuk","Sanne en Luuk"],"answer":0,"explanation":"Sanne voldoet: zo verticaal mogelijk heeft de voorkeur, maar dat wordt niet bij de beoordeling betrokken, en haar benen komen geheel onder water. Luuk voldoet niet: zijn voeten blijven boven water, dus zijn benen komen niet geheel onder water. §2.1.3, p. 30","ref":"§2.1.3, p. 30","tests":"hoofdwaarts: verticaal is voorkeur, niet beoordeeld","source":{"page":30,"quote":"De beweging wordt bij voorkeur zo verticaal mogelijk uitgevoerd, maar dit wordt niet bij de"},"rev":2},{"id":"NO-0213","category":"normering","subtopic":"onder_water","type":"kennis","objectives":["NO-ONDW-09"],"question":"Zwemdiploma C:\nDe kandidaat gaat 1 keer hoofdwaarts richting de bodem. Tijdens welke afstand doet hij dat?","options":["De 75 meter schoolslag","De 75 meter enkelvoudige rugslag","De 100 meter gekleed zwemmen"],"answer":0,"explanation":"Bij C3 wordt de 75 meter schoolslag onderbroken door 1 keer hoofdwaarts richting de bodem gaan. Daarna volgt direct de 75 meter enkelvoudige rugslag. De 100 meter gekleed zwemmen van C1 wordt onderbroken door het drijvend voorwerp, niet door hoofdwaarts richting de bodem gaan. §2.1.3, p. 29–30","ref":"§2.1.3, p. 29–30","tests":"C3: hoofdwaarts onderbreekt de 75 m schoolslag","source":{"page":29,"quote":"75 meter schoolslag, onderbroken door 1 keer hoofdwaarts richting bodem te gaan"},"rev":2},{"id":"NO-0214","category":"normering","subtopic":"onder_water","type":"stellingen","objectives":["NO-ONDW-09","NO-ONDW-07"],"question":"Welke stelling is juist?\nStelling 1: Bij het onderdeel 'voetwaarts richting de bodem zakken' zijn de armen gestrekt boven het hoofd.\nStelling 2: Bij het onderdeel 'hoofdwaarts richting de bodem gaan' komen de benen geheel onder water.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: bij voetwaarts richting de bodem zakken zijn de armen gestrekt boven het hoofd en blijven ze onder water gestrekt. Stelling 2 is ook juist: bij hoofdwaarts richting de bodem gaan komen de benen geheel onder water. §2.1.1 en 2.1.3, p. 19 en 30","ref":"§2.1.1 en 2.1.3, p. 19 en 30","tests":"voetwaarts (armen gestrekt) vs hoofdwaarts (benen geheel onder water)","source":{"page":30,"quote":"De benen komen geheel onder water. • Dit onderdeel wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter."},"rev":2},{"id":"NO-0215","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-02","NO-COND-01"],"question":"Proef A3 Conditiezwemmen:\nEen kandidaat zwemt de eerste 50 meter technisch goed. Daarna is zijn schoolslag niet meer symmetrisch. Hij heeft nog wel een redelijk voortstuwingsrendement. Wat beslist de examinator?","options":["Voldoende: na 50 meter telt de uitvoering niet mee.","Voldoende: bij A3 telt alleen de conditie.","Onvoldoende: de slag moet 100 meter symmetrisch blijven."],"answer":0,"explanation":"Bij A3 wordt de uitvoering van de zwemslagen alleen in de eerste 50 meter beoordeeld. Daarna moet er nog wel een redelijk voortstuwingsrendement zijn. De conditie wordt over de totale afstand beoordeeld, maar de uitvoering in de eerste 50 meter telt ook mee. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A3/B3: na 50 m uitvoering niet beoordeeld, wel voortstuwingsrendement","source":{"page":18,"quote":"De uitvoering van de zwemslagen wordt in de tweede 50 meter niet meegenomen in de beoordeling."},"rev":2},{"id":"NO-0216","category":"normering","subtopic":"conditiezwemmen","type":"stellingen","objectives":["NO-COND-02"],"question":"Proef B3 Conditiezwemmen:\nWelke stelling is juist?\nStelling 1: Na 50 meter wordt de uitvoering niet meer beoordeeld.\nStelling 2: Na 50 meter is een redelijk voortstuwingsrendement niet meer nodig.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: na de eerste 50 meter wordt het volhouden van de afstand beoordeeld, niet de uitvoering van de zwemslagen. Stelling 2 is onjuist: ook na de eerste 50 meter moet er een redelijk voortstuwingsrendement zijn. §2.1.2, p. 23–24","ref":"§2.1.2, p. 23–24","tests":"A3/B3: na 50 m uitvoering niet beoordeeld, wel voortstuwingsrendement","source":{"page":24,"quote":"Er is na de eerste 50 meter ook nog sprake van een redelijk voortstuwingsrendement"},"rev":2},{"id":"NO-0217","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-03"],"question":"Proef B3 Conditiezwemmen:\nHoeveel meter zwemt de kandidaat, en wanneer wisselt hij van zwemslag?","options":["150 meter, wisselen iedere 25 meter","150 meter, wisselen na 75 meter","100 meter, wisselen iedere 25 meter"],"answer":0,"explanation":"Bij B3 wordt 150 meter achter elkaar gezwommen. De schoolslag en enkelvoudige rugslag worden iedere 25 meter afgewisseld. Wisselen na 75 meter hoort bij C3, en 100 meter aaneengesloten is de normering bij A3. §2.1.1–2.1.3, p. 18, 24 en 30","ref":"§2.1.1–2.1.3, p. 18, 24 en 30","tests":"B3 conditie: 150 m, wisselen iedere 25 m","source":{"page":24,"quote":"De schoolslag en enkelvoudige rugslag worden iedere 25 meter afgewisseld."},"rev":2},{"id":"NO-0218","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-05","NO-COND-03"],"question":"Proef C3 Conditiezwemmen:\nWanneer wisselt de kandidaat van schoolslag naar enkelvoudige rugslag?","options":["Na 75 meter","Iedere 25 meter","Na 50 meter"],"answer":0,"explanation":"Bij C3 wordt de schoolslag na 75 meter afgewisseld door de enkelvoudige rugslag. Iedere 25 meter wisselen is de normering bij B3. 50 meter is bij B3 de grens voor de beoordeling van de uitvoering. §2.1.2–2.1.3, p. 24 en 30","ref":"§2.1.2–2.1.3, p. 24 en 30","tests":"conditie: wisselen iedere 25 m (A/B) vs na 75 m (C)","source":{"page":30,"quote":"De schoolslag wordt na 75 meter afgewisseld door de enkelvoudige rugslag."},"rev":2},{"id":"NO-0219","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-04","NO-COND-01"],"question":"Proef C3 Conditiezwemmen:\nIn welk deel beoordeelt de examinator de uitvoering van de zwemslagen?","options":["De eerste 25 meter van elke zwemslag","De eerste 50 meter van de proef","De hele 150 meter"],"answer":0,"explanation":"Bij C3 wordt de uitvoering beoordeeld in de eerste 25 meter van de 75 meter met de betreffende zwemslag. De eerste 50 meter van de proef is de regel bij A3 en B3. In de overige meters wordt het volhouden van de afstand beoordeeld. §2.1.1–2.1.3, p. 18, 23 en 29","ref":"§2.1.1–2.1.3, p. 18, 23 en 29","tests":"techniekbeoordeling: eerste 50 m (A/B) vs eerste 25 m van elke 75 m (C)","source":{"page":29,"quote":"De uitvoering van zowel de schoolslag als de enkelvoudige rugslag wordt in de eerste 25 meter"},"rev":2},{"id":"NO-0220","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-04","NO-COND-08"],"question":"Proef C3 Conditiezwemmen:\nEen kandidaat zwemt de 75 meter schoolslag goed. Zijn enkelvoudige rugslag is vanaf het begin niet symmetrisch. Hij heeft wel een redelijk voortstuwingsrendement. Wat beslist de examinator?","options":["Onvoldoende: ook bij de enkelvoudige rugslag telt de uitvoering mee.","Onvoldoende: de uitvoering telt de hele 150 meter mee.","Voldoende: de uitvoering telt alleen in de eerste 50 meter mee."],"answer":0,"explanation":"Bij C3 wordt de uitvoering van beide zwemslagen beoordeeld in de eerste 25 meter van de 75 meter met die zwemslag. In de eerste 25 meter enkelvoudige rugslag is dus een ritmisch en symmetrisch bewegingsverloop nodig. In de overige meters wordt het volhouden van de afstand beoordeeld, niet de uitvoering. De eerste 50 meter is de regel bij A en B. §2.1.3, p. 29–30","ref":"§2.1.3, p. 29–30","tests":"techniekbeoordeling: eerste 50 m (A/B) vs eerste 25 m van elke 75 m (C)","source":{"page":29,"quote":"De uitvoering van zowel de schoolslag als de enkelvoudige rugslag wordt in de eerste 25 meter van de 75 meter zwemmen met de betreffende zwemslag beoordeeld."},"rev":2},{"id":"NO-0221","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-05"],"question":"Proef C3 Conditiezwemmen:\nEen kandidaat wisselt iedere 25 meter tussen schoolslag en enkelvoudige rugslag. Zo zwemt hij 150 meter achter elkaar. Voldoet dit aan de normering voor de conditie?","options":["Nee, hij moet na 75 meter wisselen.","Nee, hij moet 100 meter zwemmen.","Ja, iedere 25 meter wisselen mag ook."],"answer":0,"explanation":"Bij C3 wordt de schoolslag na 75 meter afgewisseld door de enkelvoudige rugslag. Iedere 25 meter wisselen is de normering bij A3 en B3. De 150 meter achter elkaar klopt wel; 100 meter is de afstand bij A3. §2.1.1–2.1.3, p. 18, 24 en 30","ref":"§2.1.1–2.1.3, p. 18, 24 en 30","tests":"conditie: wisselen iedere 25 m (A/B) vs na 75 m (C)","source":{"page":30,"quote":"De schoolslag wordt na 75 meter afgewisseld door de enkelvoudige rugslag."},"rev":2},{"id":"NO-0222","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-03"],"question":"Proef A3 Conditiezwemmen:\nTijdens welk deel zakt de kandidaat 1 keer voetwaarts richting de bodem?","options":["De tweede 25 meter schoolslag","De eerste 25 meter schoolslag","De laatste 25 meter enkelvoudige rugslag"],"answer":0,"explanation":"Bij A3 wordt de tweede 25 meter schoolslag onderbroken door 1 keer voetwaarts richting de bodem zakken. De eerste 25 meter schoolslag en de enkelvoudige rugslag worden niet onderbroken. §2.1.1, p. 18","ref":"§2.1.1, p. 18","tests":"A3: voetwaarts zakken onderbreekt de schoolslag","source":{"page":18,"quote":"25 meter schoolslag, onderbroken door 1 keer voetwaarts richting de bodem zakken"},"rev":2},{"id":"NO-0223","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-07"],"question":"Onderdeel '25 meter schoolslag techniek', Zwemdiploma B:\nWelk uitdrijfmoment vraagt de normering?","options":["Kort, met armen en benen gestrekt","Duidelijk, met de armen passief","Kort, met de armen langs het lichaam"],"answer":0,"explanation":"Bij de schoolslag techniek is er een kort uitdrijfmoment, met armen en benen beide gestrekt. Een duidelijk uitdrijfmoment met passieve armen, bij voorkeur langs het lichaam, hoort bij de enkelvoudige rugslag techniek. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"schoolslag: kort uitdrijfmoment, armen en benen gestrekt","source":{"page":24,"quote":"Er is een kort uitdrijfmoment aanwezig, armen en benen zijn beide gestrekt."},"rev":2},{"id":"NO-0224","category":"normering","subtopic":"conditiezwemmen","type":"kandidaten","objectives":["NO-COND-07"],"question":"Zoë en Milan doen het onderdeel '25 meter schoolslag techniek' voor Zwemdiploma A. Ze zwemmen allebei ritmisch en symmetrisch.\n- Zoë strekt na elke slag armen en benen. Zij drijft dan kort uit.\n- Milan strekt na elke slag armen en benen. Hij begint dan direct een nieuwe slag.\nWelke kandidaat voldoet aan de normering?","options":["Zoë","Milan","Zoë en Milan"],"answer":0,"explanation":"Zoë voldoet: de normering vraagt een kort uitdrijfmoment, met armen en benen beide gestrekt. Milan voldoet niet: hij drijft niet uit, dus het uitdrijfmoment ontbreekt. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"schoolslag: kort uitdrijfmoment, armen en benen gestrekt","source":{"page":19,"quote":"Er is een kort uitdrijfmoment aanwezig, armen en benen zijn beide gestrekt."},"rev":2},{"id":"NO-0225","category":"normering","subtopic":"conditiezwemmen","type":"verschil","objectives":["NO-COND-08","NO-COND-06"],"question":"Welk kenmerk staat in de normering van de schoolslag techniek, maar niet bij de enkelvoudige rugslag techniek?","options":["Een ontspannen ademhaling","Een redelijk voortstuwingsrendement","Een ritmisch en symmetrisch bewegingsverloop"],"answer":0,"explanation":"Een ontspannen ademhaling staat alleen in de normering van de schoolslag techniek. Een redelijk voortstuwingsrendement en een ritmisch en symmetrisch bewegingsverloop staan bij allebei. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"schoolslag vs enkelvoudige rugslag techniek: ademhaling, uitdrijfmoment, ligging","source":{"page":19,"quote":"Er is sprake van een ontspannen ademhaling."},"rev":2},{"id":"NO-0226","category":"normering","subtopic":"conditiezwemmen","type":"casus","objectives":["NO-COND-09"],"question":"Onderdeel '25 meter enkelvoudige rugslag techniek', Zwemdiploma B:\nEen kandidaat heeft een goede beenslag. Bij elke slag beweegt hij de armen onder water mee om extra vooruit te komen. Wat beslist de examinator?","options":["Onvoldoende: de armen moeten passief zijn.","Onvoldoende: de armen moeten boven het hoofd blijven.","Voldoende: de armen mogen meebewegen ter ondersteuning."],"answer":0,"explanation":"Bij de enkelvoudige rugslag techniek zijn de armen passief, bij voorkeur langs het lichaam. Armen gestrekt boven het hoofd horen bij het onderdeel 'voetwaarts richting de bodem zakken'. Meebewegen ter ondersteuning hoort bij de normering van watertrappen. §2.1.2, p. 24","ref":"§2.1.2, p. 24","tests":"enkelvoudige rugslag: armen passief","source":{"page":24,"quote":"De armen zijn passief, bij voorkeur langs het lichaam."},"rev":2},{"id":"NO-0227","category":"normering","subtopic":"conditiezwemmen","type":"kandidaten","objectives":["NO-COND-09"],"question":"Aya en Ruben doen het onderdeel '25 meter enkelvoudige rugslag techniek' voor Zwemdiploma C. De rest van hun uitvoering is in orde.\n- Aya houdt de armen stil op de buik.\n- Ruben houdt de armen stil langs het lichaam.\nWelke kandidaat voldoet aan de normering?","options":["Aya","Ruben","Aya en Ruben"],"answer":2,"explanation":"Aya en Ruben voldoen allebei: bij de enkelvoudige rugslag zijn de armen passief. Langs het lichaam heeft de voorkeur, maar is geen eis. §2.1.3, p. 30","ref":"§2.1.3, p. 30","tests":"enkelvoudige rugslag: armen langs het lichaam is voorkeur","source":{"page":30,"quote":"De armen zijn passief, bij voorkeur langs het lichaam."},"rev":2},{"id":"NO-0228","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-10"],"question":"Wat vraagt de normering bij de halve draai om de lengteas?","options":["Een horizontale ligging","Een verticale houding","Een draai om de breedteas"],"answer":0,"explanation":"Bij de halve draai om de lengteas is er sprake van een horizontale ligging. Een verticale houding hoort bij het onderdeel 'al watertrappend een hele draai om de lengteas maken'. Een draai om de breedteas hoort bij de rol voorover. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"halve draai om de lengteas: horizontale ligging","source":{"page":20,"quote":"Normering halve draai om de lengteas • Er is sprake van een horizontale ligging."},"rev":2},{"id":"NO-0229","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-11"],"question":"Proef B3 Conditiezwemmen:\nTijdens welk deel maakt de kandidaat 2 keer een halve draai om de lengteas?","options":["De laatste 25 meter enkelvoudige rugslag","De laatste 25 meter schoolslag","De eerste 25 meter enkelvoudige rugslag"],"answer":0,"explanation":"Bij B3 wordt de laatste 25 meter enkelvoudige rugslag onderbroken door 2 keer een halve draai om de lengteas. De kandidaat draait van rug naar buik en van buik naar rug. De schoolslag wordt bij B3 niet onderbroken. §2.1.2, p. 23–24","ref":"§2.1.2, p. 23–24","tests":"B3: halve draaien onderbreken de enkelvoudige rugslag","source":{"page":23,"quote":"25 meter enkelvoudige rugslag, onderbroken door 2 keer een halve draai om de lengteas"},"rev":2},{"id":"NO-0230","category":"normering","subtopic":"conditiezwemmen","type":"kennis","objectives":["NO-COND-11","NO-COND-10"],"question":"In welke proef maakt een kandidaat voor Zwemdiploma A een halve draai om de lengteas?","options":["Je vertrouwd voelen in het water","Conditiezwemmen","Oriënteren boven water en verplaatsen"],"answer":0,"explanation":"Bij A maakt de kandidaat de halve draai naar rugligging in proef A5 Je vertrouwd voelen in het water. Bij B zitten de halve draaien in proef B3 Conditiezwemmen. In A6 Oriënteren boven water en verplaatsen maakt de kandidaat al watertrappend een hele draai. §2.1.1–2.1.2, p. 20 en 23","ref":"§2.1.1–2.1.2, p. 20 en 23","tests":"halve draai: A5 vs B3","source":{"page":20,"quote":"Onderdelen A5 proef Je vertrouwd voelen in het water • 5 seconden drijven op de buik • halve draai om de lengteas"},"rev":2},{"id":"NO-0231","category":"normering","subtopic":"conditiezwemmen","type":"onjuist","objectives":["NO-COND-11"],"question":"Welk onderdeel hoort NIET bij de proef B3 Conditiezwemmen?","options":["Een halve draai om de lengteas van buik naar rug","150 meter conditiezwemmen","Voetwaarts richting de bodem zakken"],"answer":2,"explanation":"Voetwaarts richting de bodem zakken hoort bij A3 en B6, niet bij B3. B3 bevat schoolslag techniek, enkelvoudige rugslag techniek, twee halve draaien om de lengteas en 150 meter conditiezwemmen. §2.1.2, p. 23","ref":"§2.1.2, p. 23","tests":"onderdelen B3 Conditiezwemmen","source":{"page":23,"quote":"Onderdelen B3 proef Conditiezwemmen • 25 meter schoolslag techniek • 25 meter enkelvoudige rugslag techniek • Een halve draai om de lengteas van rug naar buik • Een halve draai om de lengteas van buik naar rug • 150 meter conditiezwemmen"}},{"id":"NO-0232","category":"normering","subtopic":"borst_rugcrawl","type":"kandidaten","objectives":["NO-CRAWL-01"],"question":"Mila en Bram doen het onderdeel '5 meter borstcrawl' voor Zwemdiploma A. Bij allebei zijn de arm- en beenbewegingen in orde.\n- Mila houdt het gezicht in het water. Zij haalt geen adem.\n- Bram houdt het hoofd steeds boven water. Hij haalt regelmatig adem.\nWelke kandidaat voldoet aan de normering?","options":["Mila","Bram","Mila en Bram"],"answer":0,"explanation":"Mila voldoet: het gezicht is in het water, en bij A is een ademhaling niet noodzakelijk. Bram voldoet niet: de normering van de borstcrawl vraagt dat het gezicht in het water is. §2.1.1, p. 19","ref":"§2.1.1, p. 19","tests":"borstcrawl: gezicht in het water","source":{"page":19,"quote":"Normering borstcrawl • Het gezicht is in het water."},"rev":2},{"id":"NO-0233","category":"normering","subtopic":"borst_rugcrawl","type":"stellingen","objectives":["NO-CRAWL-02"],"question":"Rugcrawl, Zwemdiploma A:\nWelke stelling over de normering is juist?\nStelling 1: De armen blijven onder water.\nStelling 2: Er is een doorgaande asymmetrische beenbeweging.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: bij de rugcrawl is er een armslag over het water. 'De armen blijven onder water' hoort bij het onderdeel 'hoofdwaarts voortbewegen op de rug met gebruik van de armen'. Stelling 2 is juist: de beenbeweging is doorgaand asymmetrisch, wisselend op- en neerwaarts. §2.1.1–2.1.2, p. 20 en 25","ref":"§2.1.1–2.1.2, p. 20 en 25","tests":"crawl: armslag over het water","source":{"page":20,"quote":"Er is sprake van een asymmetrische armbeweging. • Er is sprake van een armslag over het water."},"rev":2},{"id":"NO-0234","category":"normering","subtopic":"borst_rugcrawl","type":"kandidaten","objectives":["NO-CRAWL-02"],"question":"Thijs en Yara doen het onderdeel '10 meter rugcrawl' voor Zwemdiploma B.\n- Thijs draait de armen om de beurt over het water. Hij beweegt de benen steeds tegelijk op en neer.\n- Yara draait de armen om de beurt over het water. Zij beweegt de benen steeds wisselend op en neer.\nWelke kandidaat voldoet aan de normering?","options":["Thijs","Yara","Thijs en Yara"],"answer":1,"explanation":"Yara voldoet: bij de rugcrawl is er een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging en een armslag over het water. Thijs voldoet niet: zijn benen bewegen tegelijk, en dat is geen asymmetrische beenbeweging. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"crawl: doorgaande asymmetrische beenbeweging","source":{"page":25,"quote":"Er is sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging."},"rev":2},{"id":"NO-0235","category":"normering","subtopic":"borst_rugcrawl","type":"stellingen","objectives":["NO-CRAWL-03"],"question":"Borstcrawl en rugcrawl:\nWelke stelling over de armbeweging is juist?\nStelling 1: Bij Zwemdiploma A is er een asymmetrische armbeweging.\nStelling 2: Bij Zwemdiploma B is er een doorgaande asymmetrische armbeweging.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: bij A vraagt de normering een asymmetrische armbeweging. Stelling 2 is ook juist: bij B is dat een doorgaande asymmetrische armbeweging. §2.1.1–2.1.2, p. 19 en 24","ref":"§2.1.1–2.1.2, p. 19 en 24","tests":"armbeweging crawl: asymmetrisch (A) vs doorgaand asymmetrisch (B/C)","source":{"page":24,"quote":"Er is sprake van een doorgaande asymmetrische armbeweging."},"rev":2},{"id":"NO-0236","category":"normering","subtopic":"borst_rugcrawl","type":"kennis","objectives":["NO-CRAWL-03"],"question":"Rugcrawl, Zwemdiploma A:\nHoe omschrijft de normering de armbeweging?","options":["Als een asymmetrische armbeweging","Als een doorgaande asymmetrische armbeweging","Als een armbeweging onder water"],"answer":0,"explanation":"Bij A vraagt de normering van de rugcrawl een asymmetrische armbeweging, met een armslag over het water. Een doorgaande asymmetrische armbeweging is de normering bij B. Armen onder water horen bij het onderdeel 'hoofdwaarts voortbewegen op de rug met gebruik van de armen'. §2.1.1–2.1.2, p. 20 en 25","ref":"§2.1.1–2.1.2, p. 20 en 25","tests":"armbeweging crawl: asymmetrisch (A) vs doorgaand asymmetrisch (B/C)","source":{"page":20,"quote":"Normering rugcrawl • Er is sprake van een doorgaande asymmetrische (wisselend op- en neerwaartse) beenbeweging. • Er is sprake van een asymmetrische armbeweging."},"rev":2},{"id":"NO-0237","category":"normering","subtopic":"borst_rugcrawl","type":"kennis","objectives":["NO-CRAWL-04"],"question":"Borstcrawl, Zwemdiploma B:\nWat zegt de normering over de ademhaling?","options":["Een ademhaling is niet beslist noodzakelijk.","Er is minimaal 1 keer een ademhaling.","De ademhaling is verplicht zijwaarts."],"answer":0,"explanation":"Bij B is de uitvoering van een ademhaling niet beslist noodzakelijk; als de kandidaat wel ademt, wordt die niet beoordeeld. Minimaal 1 keer ademhalen is de normering bij C. Zijwaarts ademen heeft bij C alleen de voorkeur. §2.1.2–2.1.3, p. 24 en 31","ref":"§2.1.2–2.1.3, p. 24 en 31","tests":"borstcrawl A/B: ademhaling niet noodzakelijk","source":{"page":24,"quote":"De uitvoering van een ademhaling is niet beslist noodzakelijk"},"rev":2},{"id":"NO-0238","category":"normering","subtopic":"borst_rugcrawl","type":"casus","objectives":["NO-CRAWL-05"],"question":"Onderdeel '15 meter borstcrawl', Zwemdiploma C:\nEen kandidaat zwemt met het gezicht in het water. Zijn arm- en beenbewegingen zijn in orde. Hij haalt in de 15 meter geen enkele keer adem. Wat beslist de examinator?","options":["Onvoldoende: hij moet minimaal 1 keer ademen.","Onvoldoende: hij moet zijwaarts ademen.","Voldoende: een ademhaling is niet beslist noodzakelijk."],"answer":0,"explanation":"Bij C vraagt de normering van de borstcrawl minimaal 1 keer een ademhaling. Zijwaarts ademen heeft de voorkeur, maar wordt niet beoordeeld. 'Niet beslist noodzakelijk' geldt bij B, niet bij C. §2.1.2–2.1.3, p. 24 en 31","ref":"§2.1.2–2.1.3, p. 24 en 31","tests":"borstcrawl C: minimaal 1 keer ademhaling","source":{"page":31,"quote":"Er is sprake van minimaal 1 keer een ademhaling."},"rev":2},{"id":"NO-0239","category":"normering","subtopic":"borst_rugcrawl","type":"kandidaten","objectives":["NO-CRAWL-05"],"question":"Ilias en Julia doen het onderdeel '15 meter borstcrawl' voor Zwemdiploma C. Tussen het ademen door is hun gezicht in het water. Hun arm- en beenbewegingen zijn in orde.\n- Ilias haalt 2 keer adem door het hoofd naar voren op te tillen.\n- Julia haalt 3 keer adem door het hoofd opzij te draaien.\nWelke kandidaat voldoet aan de normering?","options":["Ilias","Julia","Ilias en Julia"],"answer":2,"explanation":"Ilias en Julia voldoen allebei: ze ademen minimaal 1 keer. Zijwaarts ademen heeft de voorkeur, maar de uitvoering van de ademhaling wordt niet bij de beoordeling betrokken. §2.1.3, p. 31","ref":"§2.1.3, p. 31","tests":"borstcrawl C: zijwaarts ademen is voorkeur, niet beoordeeld","source":{"page":31,"quote":"De uitvoering van de ademhaling is bij voorkeur zijwaarts, maar wordt niet bij de beoordeling betrokken."},"rev":2},{"id":"NO-0240","category":"normering","subtopic":"borst_rugcrawl","type":"stellingen","objectives":["NO-CRAWL-05","NO-CRAWL-04"],"question":"Borstcrawl:\nWelke stelling over de ademhaling is juist?\nStelling 1: Bij Zwemdiploma B is een ademhaling niet beslist noodzakelijk.\nStelling 2: Bij Zwemdiploma C is een ademhaling niet beslist noodzakelijk.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij B is een ademhaling niet beslist noodzakelijk, en als die er wel is, wordt die niet beoordeeld. Stelling 2 is onjuist: bij C is er minimaal 1 keer een ademhaling. §2.1.2–2.1.3, p. 24 en 31","ref":"§2.1.2–2.1.3, p. 24 en 31","tests":"borstcrawl C: minimaal 1 keer ademhaling","source":{"page":31,"quote":"Er is sprake van minimaal 1 keer een ademhaling."},"rev":2},{"id":"NO-0241","category":"normering","subtopic":"vertrouwd_in_water","type":"kennis","objectives":["NO-VERT-01"],"question":"Proef A5 Je vertrouwd voelen in het water:\nIn welk water wordt deze proef uitgevoerd?","options":["In water waar de kandidaat niet kan staan","In water dat minimaal 1,8 meter diep is","In water dat minimaal 1 meter diep is"],"answer":0,"explanation":"Proef A5 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. Minimaal 1,8 meter geldt bijvoorbeeld bij de proef Onder water oriëntatie. Een minimum van 1 meter noemt de normering van A5 niet. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"A5: dieper water, waar de kandidaat niet kan staan","source":{"page":20,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"NO-0242","category":"normering","subtopic":"vertrouwd_in_water","type":"kandidaten","objectives":["NO-VERT-03","NO-VERT-02"],"question":"Bram en Femke doen het onderdeel '10 seconden drijven op de rug' voor Zwemdiploma A.\n- Bram ligt horizontaal en maakt kleine handbewegingen om zo te blijven liggen. Hij blijft op de plaats.\n- Femke ligt horizontaal en houdt de armen stil. Zij blijft op de plaats.\nWelke kandidaat voldoet aan de normering?","options":["Bram","Femke","Bram en Femke"],"answer":2,"explanation":"Bram en Femke voldoen allebei. Armen/handen gebruiken voor het in stand houden van de horizontale drijfhouding is toegestaan, en de houding van armen en benen is vrij. Allebei liggen ze horizontaal en blijven ze op de plaats. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven: armen/handen gebruiken voor drijfhouding toegestaan","source":{"page":20,"quote":"Het gebruik van armen/handen voor het in stand houden van de horizontale drijfhouding is"},"rev":2},{"id":"NO-0243","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-02"],"question":"Onderdeel '15 seconden drijven op de rug', Zwemdiploma C:\nEen kandidaat drijft op de rug. Met handbewegingen verplaatst hij zich een paar meter in de richting van het hoofd. Wat beslist de examinator?","options":["Onvoldoende, hij moet op de plaats blijven liggen.","Onvoldoende, hij mag de handen helemaal niet gebruiken.","Voldoende, armen/handen gebruiken is toegestaan."],"answer":0,"explanation":"Bij drijven op de rug blijft de kandidaat liggen op de plaats. Armen/handen mag hij wel gebruiken, maar alleen om de horizontale drijfhouding in stand te houden, niet om zich te verplaatsen. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"drijven: kandidaat blijft op de plaats liggen","source":{"page":32,"quote":"De kandidaat blijft liggen op de plaats."},"rev":2},{"id":"NO-0244","category":"normering","subtopic":"vertrouwd_in_water","type":"stellingen","objectives":["NO-VERT-04","NO-VERT-02"],"question":"Onderdeel '5 seconden drijven op de buik', Zwemdiploma A:\nWelke stelling is juist?\nStelling 1: Het gezicht moet de hele tijd in het water blijven.\nStelling 2: De kandidaat blijft op de plaats liggen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: het gezicht is in het water, maar mag uit het water worden getild voor ademhaling. Stelling 2 is juist: de ligging is horizontaal en de kandidaat blijft op de plaats liggen. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven op de buik: gezicht mag uit het water voor ademhaling","source":{"page":20,"quote":"Het gezicht is in het water, maar mag uit het water worden getild voor ademhaling."},"rev":2},{"id":"NO-0245","category":"normering","subtopic":"vertrouwd_in_water","type":"kandidaten","objectives":["NO-VERT-04"],"question":"Ayoub en Lisa doen het onderdeel '5 seconden drijven op de buik' voor Zwemdiploma A.\n- Ayoub ligt horizontaal op de plaats. Hij houdt zijn gezicht de hele tijd in het water.\n- Lisa ligt horizontaal op de plaats. Zij tilt haar gezicht kort uit het water om adem te halen.\nWelke kandidaat voldoet aan de normering?","options":["Ayoub","Lisa","Ayoub en Lisa"],"answer":2,"explanation":"Ayoub en Lisa voldoen allebei. Het gezicht is in het water, maar mag uit het water worden getild voor ademhaling. Allebei liggen ze horizontaal en blijven ze op de plaats liggen. §2.1.1, p. 20","ref":"§2.1.1, p. 20","tests":"drijven op de buik: gezicht mag uit het water voor ademhaling","source":{"page":20,"quote":"Het gezicht is in het water, maar mag uit het water worden getild voor ademhaling."},"rev":2},{"id":"NO-0246","category":"normering","subtopic":"vertrouwd_in_water","type":"kennis","objectives":["NO-VERT-05"],"question":"Onderdeel '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen', Zwemdiploma B:\nWat doen de benen bij dit onderdeel?","options":["Ze liggen stil.","Ze maken een lichte trapbeweging.","Ze bewegen gelijktijdig of afwisselend."],"answer":0,"explanation":"Bij hoofdwaarts voortbewegen op de rug liggen de benen stil; de armen/handen zorgen voor de verplaatsing in de richting van het hoofd. Een trapbeweging hoort er dus niet bij. Benen die gelijktijdig of afwisselend bewegen, horen bij watertrappen. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"B5 voortbewegen op de rug: benen stil, richting hoofd","source":{"page":25,"quote":"De benen liggen stil."},"rev":2},{"id":"NO-0247","category":"normering","subtopic":"vertrouwd_in_water","type":"kandidaten","objectives":["NO-VERT-06","NO-VERT-05"],"question":"Proef B5 Je vertrouwd voelen in het water, Zwemdiploma B:\nJulia en Thijs doen het onderdeel '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen'.\n- Julia houdt de benen stil. Zij maakt armslagen over het water, zoals bij de rugcrawl.\n- Thijs houdt de benen stil. Hij beweegt de armen onder water, onder de schouderlijn.\nWelke kandidaat voldoet aan de normering?","options":["Julia","Thijs","Julia en Thijs"],"answer":1,"explanation":"Thijs voldoet: de benen liggen stil en de armen blijven onder water, onder de schouderlijn. Julia voldoet niet: de armen blijven onder water en komen niet boven de schouderlijn, dus armslagen over het water mogen niet. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"voortbewegen op de rug: armen onder water, niet boven schouderlijn","source":{"page":25,"quote":"De armen blijven onder water. • De armen komen niet boven de schouderlijn."},"rev":2},{"id":"NO-0248","category":"normering","subtopic":"vertrouwd_in_water","type":"stellingen","objectives":["NO-VERT-05","NO-VERT-06"],"question":"Onderdeel '5 meter hoofdwaarts voortbewegen op de rug met gebruik van de armen', Zwemdiploma B:\nWelke stelling is juist?\nStelling 1: De benen mogen met een rustige beenslag helpen.\nStelling 2: De armen komen niet boven de schouderlijn.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":1,"explanation":"Stelling 1 is onjuist: de benen liggen stil en de verplaatsing gebeurt door gebruik van de armen/handen. Stelling 2 is juist: de armen blijven onder water en komen niet boven de schouderlijn. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"B5 voortbewegen op de rug: benen stil, richting hoofd","source":{"page":25,"quote":"De benen liggen stil. • Verplaatsing gebeurt door gebruik van de armen/handen. • Verplaatsing is in de richting van het hoofd."},"rev":2},{"id":"NO-0249","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-08"],"question":"Onderdeel '20 seconden drijven met gebruik van een drijvend voorwerp', Zwemdiploma B:\nEen kandidaat houdt zich vast aan het voorwerp. Hij maakt steeds schoolslagbewegingen met de benen om op de plaats te blijven. Wat beslist de examinator?","options":["Onvoldoende, hij mag niet stuwen met de benen.","Onvoldoende, hij moet in rugligging drijven.","Voldoende, hij blijft op de plaats."],"answer":0,"explanation":"Bij drijven met gebruik van een drijvend voorwerp worden de armen en benen niet gebruikt om te stuwen. Rugligging is toegestaan, maar niet verplicht: de houding is bij voorkeur verticaal. Op de plaats blijven is nodig, maar maakt het stuwen niet goed. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: armen en benen niet stuwen","source":{"page":25,"quote":"De armen en benen worden niet gebruikt om te stuwen."},"rev":2},{"id":"NO-0250","category":"normering","subtopic":"vertrouwd_in_water","type":"kandidaten","objectives":["NO-VERT-07","NO-VERT-08"],"question":"Lotte en Sem doen het onderdeel 'drijven met gebruik van een drijvend voorwerp' voor Zwemdiploma B.\n- Lotte drijft verticaal met een plankje. Zij blijft op de plaats en stuwt niet met armen of benen.\n- Sem drijft in rugligging met een bal. Hij blijft op de plaats en stuwt niet met armen of benen.\nWelke kandidaat voldoet aan de normering?","options":["Lotte","Sem","Lotte en Sem"],"answer":2,"explanation":"Lotte en Sem voldoen allebei. De lichaamshouding is bij voorkeur verticaal, maar rugligging is ook toegestaan. Het drijvend voorwerp is vrij, en allebei blijven ze op de plaats zonder te stuwen. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: bij voorkeur verticaal, rugligging toegestaan","source":{"page":25,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."},"rev":2},{"id":"NO-0251","category":"normering","subtopic":"vertrouwd_in_water","type":"casus","objectives":["NO-VERT-07"],"question":"Onderdeel '20 seconden drijven met gebruik van een drijvend voorwerp', Zwemdiploma B:\nEen kandidaat drijft in rugligging met het voorwerp op zijn buik. Hij blijft op de plaats en stuwt niet. Wat beslist de examinator?","options":["Voldoende, rugligging is toegestaan.","Onvoldoende, de houding moet verticaal zijn.","Onvoldoende, de knieën moeten opgetrokken zijn."],"answer":0,"explanation":"De lichaamshouding is bij voorkeur verticaal, maar rugligging is ook toegestaan. Een verticale houding met opgetrokken knieën is de normering van gekleed verticaal blijven drijven in proef C1, niet van B5. §2.1.2, p. 25","ref":"§2.1.2, p. 25","tests":"drijven met drijvend voorwerp: bij voorkeur verticaal, rugligging toegestaan","source":{"page":25,"quote":"De lichaamshouding is bij voorkeur verticaal; rugligging is ook toegestaan."},"rev":2},{"id":"NO-0252","category":"normering","subtopic":"orienteren_boven_water","type":"kennis","objectives":["NO-ORI-01"],"question":"Proef A6 Oriënteren boven water en verplaatsen:\nWelke houding hoort bij het onderdeel 'watertrappen met armen en benen'?","options":["Een verticale houding","Een horizontale ligging","Een vrije houding"],"answer":0,"explanation":"Bij watertrappen met armen en benen is het hoofd boven water en is er sprake van een verticale houding. Een horizontale ligging hoort bij drijven en bij de halve draai om de lengteas. Vrij is de houding van armen en benen bij drijven, niet bij watertrappen. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: hoofd boven water, verticale houding","source":{"page":21,"quote":"Normering watertrappen met armen en benen • Het hoofd is boven water. • Er is sprake van een verticale houding."},"rev":2},{"id":"NO-0253","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-02"],"question":"Proef A6, onderdeel 'watertrappen met armen en benen':\nEen kandidaat beweegt beide benen gelijktijdig, zoals bij de schoolslag. Hoofd, houding en armen zijn in orde. Voldoet dit?","options":["Ja, de benen mogen gelijktijdig bewegen.","Ja, de benen worden bij A6 niet beoordeeld.","Nee, de benen moeten afwisselend bewegen."],"answer":0,"explanation":"Bij watertrappen bewegen beide benen, en dat mag gelijktijdig of afwisselend. Een verplicht afwisselende beenbeweging staat niet in de normering. De benen worden wel beoordeeld: 'beide benen bewegen' is een eis. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: benen gelijktijdig of afwisselend","source":{"page":21,"quote":"Beide benen bewegen, dit mag gelijktijdig of afwisselend worden uitgevoerd."},"rev":2},{"id":"NO-0254","category":"normering","subtopic":"orienteren_boven_water","type":"kandidaten","objectives":["NO-ORI-03"],"question":"Iris en Thijs doen het onderdeel 'watertrappen met armen en benen' voor Zwemdiploma A.\n- Iris houdt haar handen stil boven water. Haar benen bewegen afwisselend.\n- Thijs beweegt zijn handen onder water mee. Zijn benen bewegen afwisselend.\nWelke kandidaat voldoet aan de normering?","options":["Iris","Thijs","Iris en Thijs"],"answer":1,"explanation":"Thijs voldoet: bij watertrappen met armen en benen zijn de armen/handen onder water en bewegen ze mee ter ondersteuning. Iris voldoet niet: haar handen zijn stil en boven water. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen met armen en benen: armen onder water, bewegen mee","source":{"page":21,"quote":"De armen/handen zijn onder water en bewegen mee ter ondersteuning."},"rev":2},{"id":"NO-0255","category":"normering","subtopic":"orienteren_boven_water","type":"stellingen","objectives":["NO-ORI-04"],"question":"Proef A6, onderdeel 'watertrappen met armen en benen':\nWelke stelling is juist?\nStelling 1: De kandidaat blijft op de plaats.\nStelling 2: De armen/handen zijn passief.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: bij A6 blijft de kandidaat tijdens het watertrappen op de plaats. Stelling 2 is onjuist: de armen/handen zijn onder water en bewegen mee ter ondersteuning. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"watertrappen: op de plaats (A6) vs minimaal 4 keer verplaatsen (B6/C5)","source":{"page":21,"quote":"De armen/handen zijn onder water en bewegen mee ter ondersteuning. • De kandidaat blijft op de plaats."},"rev":2},{"id":"NO-0256","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-05"],"question":"Proef B6 Oriënteren boven water en verplaatsen:\nDe examinator wil deze proef afnemen in een deel van het bad waar de kandidaten kunnen staan. Mag dat?","options":["Nee, de proef moet in water waar de kandidaat niet kan staan.","Nee, het water moet minimaal 1,8 meter diep zijn.","Ja, als de kandidaten de bodem niet raken."],"answer":0,"explanation":"B6 wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. Minimaal 1,8 meter is de eis bij Onder water oriëntatie, niet bij deze proef. Dat de kandidaten de bodem niet raken, vervangt de eis niet. §2.1.2, p. 26","ref":"§2.1.2, p. 26","tests":"Oriënteren boven water: dieper water, waar de kandidaat niet kan staan","source":{"page":26,"quote":"De proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"NO-0257","category":"normering","subtopic":"orienteren_boven_water","type":"stellingen","objectives":["NO-ORI-05","NO-ONDW-01"],"question":"Welke stelling over de waterdiepte is juist?\nStelling 1: De proef Onder water oriëntatie vraagt minimaal 1,8 meter waterdiepte.\nStelling 2: De proef Oriënteren boven water en verplaatsen vraagt minimaal 1,8 meter waterdiepte.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: Onder water oriëntatie wordt uitgevoerd in een waterdiepte van minimaal 1,8 meter. Stelling 2 is onjuist: Oriënteren boven water en verplaatsen wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan. §2.1.3, p. 29 en 31","ref":"§2.1.3, p. 29 en 31","tests":"Oriënteren boven water: dieper water, waar de kandidaat niet kan staan","source":{"page":31,"quote":"Deze proef wordt uitgevoerd in dieper water, tenminste waar de kandidaat niet kan staan."},"rev":2},{"id":"NO-0258","category":"normering","subtopic":"orienteren_boven_water","type":"kandidaten","objectives":["NO-ORI-06"],"question":"Jesse en Amira doen het onderdeel 'al watertrappend een hele draai om de lengteas maken' voor Zwemdiploma A.\n- Jesse gaat tijdens het draaien op zijn rug liggen. Zo draait hij rond.\n- Amira blijft tijdens het draaien verticaal. Zo draait zij rond.\nWelke kandidaat voldoet aan de normering?","options":["Jesse","Amira","Jesse en Amira"],"answer":1,"explanation":"Amira voldoet: tijdens het draaien blijft het lichaam in verticale houding. Jesse voldoet niet: op de rug liggen is een horizontale ligging, en die hoort bij de halve draai om de lengteas. §2.1.1, p. 21","ref":"§2.1.1, p. 21","tests":"hele draai al watertrappend: verticale houding","source":{"page":21,"quote":"Tijdens het draaien blijft het lichaam in verticale houding."},"rev":2},{"id":"NO-0259","category":"normering","subtopic":"orienteren_boven_water","type":"verschil","objectives":["NO-ORI-06","NO-COND-10"],"question":"Onderdelen 'halve draai om de lengteas' en 'al watertrappend een hele draai om de lengteas maken':\nWelke houding hoort bij welke draai?","options":["Halve draai horizontaal, hele draai verticaal","Halve draai verticaal, hele draai horizontaal","Halve draai verticaal, hele draai verticaal"],"answer":0,"explanation":"Bij de halve draai om de lengteas is er sprake van een horizontale ligging. Bij al watertrappend een hele draai maken blijft het lichaam in verticale houding. Daarom zijn de andere twee opties onjuist. §2.1.1, p. 20–21","ref":"§2.1.1, p. 20–21","tests":"halve draai om de lengteas: horizontale ligging","source":{"page":21,"quote":"Normering al watertrappend een hele draai om de lengteas maken • Tijdens het draaien blijft het lichaam in verticale houding."},"rev":2},{"id":"NO-0260","category":"normering","subtopic":"orienteren_boven_water","type":"kennis","objectives":["NO-ORI-07","NO-ORI-04"],"question":"Proef B6 Oriënteren boven water en verplaatsen:\nDe kandidaat gaat 60 seconden watertrappen met armen en benen. Wat doet hij daarbij?","options":["Hij verplaatst zich minimaal 4 keer.","Hij blijft op de plaats.","Hij maakt 2 keer een hele draai."],"answer":0,"explanation":"Bij B6 verplaatst de kandidaat zich minimaal 4 keer, zowel voor-, achter- als zijwaarts. Op de plaats blijven en 2 keer een hele draai om de lengteas maken horen bij A6. §2.1.1–2.1.2, p. 21 en 26","ref":"§2.1.1–2.1.2, p. 21 en 26","tests":"watertrappen: op de plaats (A6) vs minimaal 4 keer verplaatsen (B6/C5)","source":{"page":26,"quote":"De kandidaat verplaatst zich minimaal 4 keer (zowel voor-, achter- als zijwaarts)."},"rev":2},{"id":"NO-0261","category":"normering","subtopic":"orienteren_boven_water","type":"kandidaten","objectives":["NO-ORI-07"],"question":"Bram en Yara doen het onderdeel 'watertrappen met armen en benen, verplaatsen in meerdere richtingen' voor Zwemdiploma C.\n- Bram verplaatst zich 2 keer voorwaarts en 1 keer zijwaarts.\n- Yara verplaatst zich 1 keer voorwaarts, 1 keer achterwaarts en 2 keer zijwaarts.\nWelke kandidaat voldoet aan de normering?","options":["Bram","Yara","Bram en Yara"],"answer":1,"explanation":"Yara voldoet: de kandidaat verplaatst zich minimaal 4 keer, zowel voor-, achter- als zijwaarts. Bram voldoet niet: hij verplaatst zich 3 keer en niet achterwaarts. §2.1.3, p. 31","ref":"§2.1.3, p. 31","tests":"verplaatsen: minimaal 4 keer, voor-, achter- en zijwaarts","source":{"page":31,"quote":"De kandidaat verplaatst zich minimaal 4 keer (zowel voor-, achter- als zijwaarts)."},"rev":2},{"id":"NO-0262","category":"normering","subtopic":"orienteren_boven_water","type":"kennis","objectives":["NO-ORI-08"],"question":"Proef C5, onderdeel 'watertrappen met de benen':\nWat doen de armen/handen?","options":["Ze zijn passief.","Ze bewegen mee onder water.","Ze zijn gestrekt boven het hoofd."],"answer":0,"explanation":"Bij watertrappen met de benen zijn de armen/handen passief, in de zij of bij het wateroppervlak. Meebewegen onder water hoort bij watertrappen met armen en benen. Gestrekte armen boven het hoofd horen bij voetwaarts richting de bodem zakken. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"watertrappen met de benen: armen passief","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak."},"rev":2},{"id":"NO-0263","category":"normering","subtopic":"orienteren_boven_water","type":"casus","objectives":["NO-ORI-08"],"question":"Proef C5, onderdeel 'watertrappen met de benen':\nEen kandidaat maakt steeds kleine bewegingen met zijn handen onder water. Zo houdt hij zijn hoofd boven water. Voldoet dit?","options":["Nee, de armen/handen moeten passief zijn.","Nee, hij moet zich daarbij verplaatsen.","Ja, de handen mogen meebewegen ter ondersteuning."],"answer":0,"explanation":"Bij watertrappen met de benen zijn de armen/handen passief, in de zij of bij het wateroppervlak. Meebewegen ter ondersteuning hoort bij watertrappen met armen en benen. Verplaatsen hoort hier niet bij: de kandidaat blijft op de plaats. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"watertrappen met de benen: armen passief","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak."},"rev":2},{"id":"NO-0264","category":"normering","subtopic":"orienteren_boven_water","type":"stellingen","objectives":["NO-ORI-08"],"question":"Proef C5, onderdeel 'watertrappen met de benen':\nWelke stelling is juist?\nStelling 1: De kandidaat blijft op de plaats.\nStelling 2: De benen mogen gelijktijdig bewegen.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":2,"explanation":"Stelling 1 is juist: bij watertrappen met de benen blijft de kandidaat op de plaats. Stelling 2 is ook juist: beide benen bewegen, en dat mag gelijktijdig of afwisselend. §2.1.3, p. 32","ref":"§2.1.3, p. 32","tests":"C5 watertrappen met de benen: op de plaats","source":{"page":32,"quote":"Armen/handen zijn passief, in de zij of bij het wateroppervlak. • De kandidaat blijft op de plaats."},"rev":2},{"id":"NO-0265","category":"normering","subtopic":"orienteren_boven_water","type":"stellingen","objectives":["NO-ORI-02","NO-ORI-03"],"question":"Proef B6, onderdeel 'watertrappen met armen en benen, verplaatsen in meerdere richtingen':\nWelke stelling is juist?\nStelling 1: De benen mogen gelijktijdig bewegen.\nStelling 2: De armen/handen bewegen mee boven water.","options":["Alleen stelling 1 is juist.","Alleen stelling 2 is juist.","Beide stellingen zijn juist."],"answer":0,"explanation":"Stelling 1 is juist: beide benen bewegen, en dat mag gelijktijdig of afwisselend. Stelling 2 is onjuist: de armen/handen bewegen mee onder water, niet boven water. §2.1.2, p. 26","ref":"§2.1.2,
